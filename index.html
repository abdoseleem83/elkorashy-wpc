/* Approved print picker. No external assets or libraries. */
.doorpanel .dd{--dd-bg:#FFF1D6;--dd-bd:#D9A441;--dd-in:#FFFBF2;--dd-ink:#18365D}html[data-theme="dark"] .doorpanel .dd{--dd-bg:#3B2F19;--dd-bd:#B98E45;--dd-in:#292416;--dd-ink:#F7DBA1}.doorpanel button.ddH[data-k^="ex"]{display:grid;grid-template-columns:auto minmax(0,1fr) 18px;gap:9px;min-height:54px;padding:12px 13px;line-height:1.5}.doorpanel .ddH[data-k^="ex"] .t{font-size:15.5px;font-weight:800}.doorpanel .ddH[data-k^="ex"] .sm{font-size:13.5px;white-space:normal;overflow:visible;text-overflow:clip;color:#614A27;line-height:1.5}html[data-theme="dark"] .doorpanel .ddH[data-k^="ex"] .sm{color:#E8CE9D}.approved-print-heading>button.btn{flex:0 0 44px;width:44px;max-width:44px;min-width:44px;min-height:44px;height:44px;padding:0;border-radius:11px;box-shadow:none;background:var(--surface-2);color:var(--ink)}

.approved-print-tabs{display:flex;gap:7px;margin-top:10px}.approved-print-tabs button{flex:1;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:13px;padding:8px}.approved-print-tabs button.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--card));color:var(--brand)}.approved-print-summary{padding:12px;margin-top:8px;border:1.5px solid #7DBE93;border-radius:11px;background:var(--card);color:var(--ink);text-align:center}.approved-print-code{font-size:13px;line-height:1.7;margin:7px 0}.approved-print-selected{display:block;margin:8px auto;width:100px;height:220px;object-fit:contain;background:#fff}.approved-print-overlay{position:fixed;inset:0;z-index:380;background:#071426b5;display:flex;align-items:center;justify-content:center;padding:14px}.approved-print-dialog{width:min(100%,580px);max-height:91vh;max-height:91svh;overflow:auto;overscroll-behavior:contain;background:var(--card);color:var(--ink);border-radius:18px;padding:15px;box-shadow:0 8px 40px #0007}.approved-print-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.approved-print-heading b{font-size:18px}.approved-print-heading div div{font-size:13px;margin-top:4px}.approved-print-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;direction:ltr}.approved-print-option{padding:8px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-width:0}.approved-print-option img{display:block;width:100%;height:150px;object-fit:contain;margin-bottom:5px;background:#fff}.approved-print-option b{display:block;font-size:16px}.approved-print-option.on{border:3px solid var(--brand);padding:6.5px}.approved-print-hint{font-size:12px;line-height:1.6;margin-top:12px}@media(max-height:700px){.approved-print-option img{height:112px}.approved-print-heading b{font-size:16px}}@media(max-width:350px){.approved-print-dialog{padding:11px}.approved-print-grid{gap:6px}.approved-print-option img{height:120px}}

:root{
  /* ---- هوية «الداكن الأنيق» (v186) ----
     كحلي غامق خلفية، أزرق فاتح للأزرار، وذهبي للمسات المهمة.
     أسماء المتغيّرات زي ما هي عشان كل الشاشات تتحوّل مرة واحدة من غير ما
     نلمس كل قاعدة على حدة.
     (مستندات الـPDF ألوانها مكتوبة جواها بالنص — فهي زي ما هي أبيض وكحلي.) */
  --navy:#16233A;          /* سطح مرتفع (شرايط/كروت غامقة) */
  --navy-2:#0C1524;
  --brand:#3FA9F5;
  --brand-lt:#6FC1FA;
  --wood:#D9A441;          /* الذهبي — لمسة التمييز */
  --wood-lt:#E7BE6E;
  --wood-bg:rgba(217,164,65,.10);
  --wood-line:rgba(217,164,65,.38);
  --bg:#0C1524;
  --card:#141F32;
  --ink:#E8EEF6;
  --muted:#8FA3BD;
  --line:#22304A;
  --ok:#4FC08A;
  --ok-bg:rgba(79,192,138,.13);
  --warn-bg:rgba(217,164,65,.12);
  --warn-line:rgba(217,164,65,.42);
  --danger:#F0736A;
  --r:16px;
  --shadow:0 4px 18px rgba(0,0,0,.38);
  --mark:none;

  /* ---- توكنز التصميم المحدّثة (v108) ----
     سلّم ظلال متدرّج بدل ظل واحد لكل حاجة، وسلّم زوايا، ومنحنيات حركة موحّدة.
     ده اللي بيخلي الشاشة تبان مرتّبة وفيها عمق بدل ما كل الكروت في نفس المستوى. */
  --e1:0 1px 2px rgba(0,0,0,.30), 0 1px 3px rgba(0,0,0,.22);
  --e2:0 2px 6px rgba(0,0,0,.30), 0 6px 16px rgba(0,0,0,.30);
  --e3:0 6px 14px rgba(0,0,0,.34), 0 16px 34px rgba(0,0,0,.42);
  --r-sm:10px;
  --r-md:14px;
  --r-lg:18px;
  --r-pill:999px;
  --ease:cubic-bezier(.2,.7,.3,1);          /* دخول ناعم — بيقف من غير ارتداد */
  --ease-out:cubic-bezier(.16,1,.3,1);      /* خروج سريع في الأول وبطيء في الآخر */
  --t-fast:.13s;
  --t-med:.22s;
  --surface-2:#18233A;                       /* سطح تاني للتمييز جوه الكروت */
  --line-soft:#1E2B44;
  --navh:75px;                               /* ارتفاع شريط التبويبات السفلي (العايم: ٦٣ + هامش ١٠ + فاصل ٢) */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:Arial,'Helvetica Neue',system-ui,sans-serif;
  font-weight:700;                 /* الخط بولد في كل التطبيق */
  background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.6;padding-bottom:30px;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,b,strong{font-family:Arial,'Helvetica Neue',system-ui,sans-serif;font-weight:700}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;font-weight:700}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ بوابة التثبيت — شاشة كاملة قبل أي حاجة تانية ============ */

/* ============ الهيدر ============ */
#appbar{position:sticky;top:0;z-index:40}
#appbar::after{content:'';display:block;height:3px;background:linear-gradient(90deg,var(--wood),var(--wood-lt) 45%,var(--brand-lt))}
.top{
  background:linear-gradient(160deg,var(--navy),var(--navy-2));
  color:#EAF2FA;padding:calc(9px + env(safe-area-inset-top)) 14px 9px;
  box-shadow:0 2px 14px rgba(0,32,80,.3);
}
.top-row{display:flex;align-items:center;gap:11px}
.top img.logo{height:38px;width:auto;background:#fff;border-radius:8px;padding:4px 7px;flex:0 0 auto}
.top .t1{font-family:Arial,'Helvetica Neue',sans-serif;font-size:14.5px;font-weight:600;line-height:1.3}
.top .t2{font-size:11px;color:#9CB6D2;margin-top:1px}
.wh-chip{
  margin-inline-start:auto;flex:0 0 auto;text-align:center;
  background:rgba(79,168,220,.15);border:1px solid rgba(79,168,220,.42);
  color:#9FD1F0;border-radius:9px;padding:4px 9px;font-size:10.5px;line-height:1.35;
}
.wh-chip b{display:block;font-size:12px;color:#DCEEFB}


/* شريط التثبيت/التحديث — تحت اللوجو على طول زي تطبيق الموزعين */
/* شريط الإصدار/التحديث/التثبيت — أعلى الصفحة جنب اللوجو */
.verstrip{display:flex;align-items:center;gap:7px;margin-top:8px}
.verstrip .vs-ver{font-size:10.5px;color:#9CB6D2;flex:1;min-width:0}
.verstrip button{
  flex:0 0 auto;background:rgba(255,255,255,.14);border:1px solid rgba(159,209,240,.4);
  color:#EAF2FA;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:600;
  white-space:nowrap;
}
.verstrip button.vs-install{background:linear-gradient(180deg,var(--brand-lt),var(--brand));border-color:transparent;color:#fff}
.verstrip button[hidden]{display:none}


/* شريط الأقسام فوق (الأبواب / الإكسسوارات / حلق فقط / برور فقط) */
.secnav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:13px}
.secnav button{
  background:var(--card);border:1.5px solid var(--line);border-radius:12px;
  padding:10px 4px;text-align:center;box-shadow:var(--shadow);
}
.secnav button .i{display:block;margin:0 auto 4px;width:22px;height:22px;color:var(--muted)}
.secnav button.on .i{color:var(--wood)}
.secnav button .tx{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.secnav button.on{border-color:var(--brand);background:linear-gradient(180deg,#fff,#F3F9FE)}
.secnav button.on .tx{color:var(--navy)}

/* شبكة الإكسسوارات المصغّرة — ٣ في الصف */
.accgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.accgrid .ac{border:1.5px solid var(--line);border-radius:11px;padding:8px 6px 7px;text-align:center;background:#FCFDFE}.accgrid .ac .ac-img{width:100%;height:84px;object-fit:contain;margin:0 0 6px;border-radius:8px;background:#fff}.accgrid .ac .qty{display:block;transform:none;width:100%}.accgrid .ac .qIc{display:none}.accgrid .ac .qty285{grid-template-columns:36px minmax(0,1fr) 36px;padding:4px;gap:4px;width:100%;box-sizing:border-box}.accgrid .ac .qty285 button{min-height:38px;font-size:20px}
.accgrid .ac b{display:block;font-size:11px;font-weight:600;line-height:1.28;min-height:28px}
.accgrid .ac .pr{font-size:10px;color:var(--muted);margin:2px 0 7px}
.accgrid .ac .qty{transform:scale(.82);transform-origin:center;margin:0 auto;width:fit-content}

/* لوحة تفاصيل الباب — بتظهر تحت صف الباب المختار جوه نفس الشبكة */
.doorpanel{grid-column:1/-1;background:#F7FAFD;border:1px dashed var(--brand);border-radius:12px;padding:12px;margin:2px 0 4px}
/* المقاس / الحلق / البرور — أعمدة جنب بعض تحت الباب المختار */
.specol{display:flex;flex-direction:column;gap:5px;min-width:0}
.specol .sol-h{font-size:10px;color:var(--muted);text-align:center;font-weight:600}
.specol .colchip{
  width:100%;padding:7px 2px;border:1.5px solid var(--line);border-radius:8px;
  background:#FCFDFE;font-size:10.5px;font-weight:500;text-align:center;line-height:1.25;
}
.specol .colchip .ic{display:block;font-size:14px;line-height:1.1;margin-bottom:1px}
.specol .colchip .sub{display:block;font-size:8.8px;color:var(--muted);font-weight:400;margin-top:1px}
.specol .colchip.on{background:var(--navy);border-color:var(--navy);color:#EAF2FA}
.specol .colchip.on .sub{color:#9CB6D2}
.doorpanel .dphead{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.doorpanel .dphead b{font-family:Arial,'Helvetica Neue',sans-serif;font-size:14px;color:var(--navy)}
.doorpanel .dphead span{font-size:11.5px;color:var(--muted)}
.doorpanel .grp{font-size:11.5px;color:var(--muted);margin:11px 0 6px}
.doorpanel .dphead + .grp{margin-top:0}
.grp{font-size:12px;font-weight:700;color:var(--wood);margin:11px 0 6px}
.prow3{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.prow3:last-of-type{border-bottom:0}
.prow3 .lbl{flex:1 1 100%;font-size:12.5px;color:var(--ink);margin-bottom:2px}
.prow3 .lbl small{color:var(--muted)}
.prow3 .tri{display:flex;gap:5px;flex:1 1 100%}
.prow3 .tcell{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.prow3 .tcell b{font-size:9.5px;color:var(--muted);font-weight:700}
.prow3 input{width:100%;text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px 2px;font-size:12.5px;min-width:0}
.prow3 input:focus{border-color:var(--wood);outline:none}
.ptri-head{display:flex;gap:5px;padding:4px 0 2px}
.ptri-head b{flex:1;text-align:center;font-size:10.5px;color:#1080C0;font-weight:700}

/* ============ التبويبات ============ */

/* ============ أيقونات SVG — هوية بصرية موحّدة بدل الإيموجي ============
   كلها stroke-based بنفس السُمك والزوايا، وبتاخد لون النص اللي حواليها (currentColor)
   فبتتلوّن تلقائي حسب الزرار/الحالة، وبتطلع نفس الشكل بالظبط على كل الأجهزة
   (الإيموجي كان بيختلف شكله من موبايل للتاني وده كان بيضرب الهوية البصرية). */
.i{width:1.15em;height:1.15em;flex:0 0 auto;vertical-align:-.18em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.i.lg{width:1.5em;height:1.5em}
.i.xl{width:26px;height:26px;stroke-width:1.7}

.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
.tabs[hidden]{display:none}
.tabs button{flex:1;padding:9px 2px 7px;font-size:11px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;
  display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tabs button .i{width:21px;height:21px}
.tabs button.on .i{color:var(--brand)}
.tabs button.on{color:var(--navy);border-bottom-color:var(--brand);font-weight:600}
.tabs .badge{position:absolute;top:4px;inset-inline-end:calc(50% - 20px);min-width:17px;padding:0 4px;
  background:var(--brand);color:#fff;border-radius:20px;font-size:10px;line-height:17px;font-weight:700;
  box-shadow:0 1px 4px rgba(0,32,80,.25)}
.tabs .badge[hidden]{display:none}

.wrap{padding:14px;max-width:660px;margin:0 auto;position:relative}

/* ============ الكروت + علامة مائية ============ */
.card{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:14px;margin-bottom:13px;box-shadow:var(--shadow);
  overflow:hidden;
}
/* اللوجو خلفية باهتة في كل كارت */
.card::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:var(--mark) no-repeat left 8px bottom 8px;
  background-size:42px auto;opacity:.05;
}
.card>*{position:relative}

.step{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.step .n{
  font-family:Arial,'Helvetica Neue',sans-serif;font-size:11.5px;font-weight:700;color:#fff;
  background:linear-gradient(160deg,var(--brand-lt),var(--brand));border-radius:9px;width:28px;height:28px;
  display:grid;place-items:center;flex:0 0 auto;box-shadow:0 2px 6px rgba(16,128,192,.3);
}
.step .n .i{width:16px;height:16px;stroke-width:2}
.step h2{font-size:15px;margin:0}
.step .hint{font-size:11px;color:var(--muted);margin-inline-start:auto;font-weight:400}

label.fld{display:block;margin-bottom:10px}
label.fld span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
label.fld span .req{color:var(--danger);font-weight:700}
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=date],input[type=search],select,textarea{
  width:100%;padding:10px 11px;border:1.5px solid var(--line);border-radius:10px;background:#FCFDFE;
}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none}
input.bad{border-color:var(--danger);background:#FFF6F5}
input::placeholder{color:#A8B4C2}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ============ رف الأبواب ============ */
.rail{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 9px;padding:4px 2px 6px}
/* وضع التركيز: الباب المختار لوحده وجنبه زرار الرجوع للأكواد */
.focusrow{display:flex;align-items:center;gap:12px;padding:2px 2px 10px;border-bottom:1px solid var(--line);margin-bottom:11px}
.focusrow .door{width:88px;flex:0 0 auto}
.stktbl{width:100%;border-collapse:collapse;font-size:12px;min-width:420px}
.stktbl th{background:var(--navy);color:#EAF2FA;padding:7px 5px;font-size:11px;white-space:nowrap}
.stktbl td{border-bottom:1px solid var(--line)}
.stktbl tbody tr:nth-child(even){background:#F7FAFC}
.stkin{width:100%;min-width:56px;border:1.5px solid var(--line);border-radius:8px;
  padding:7px 4px;text-align:center;font-size:14px;font-weight:700;color:var(--ink);background:#fff}
.stkin:focus{border-color:var(--brand);outline:none}
.stkin.dirty{border-color:#C08A3E;background:#FFF9F0}
/* المقاس المتوفر بالمخزن: خلفية خضرا وكلام بولد عشان يبان فورًا */
.specol .colchip.instock{background:#DCF1E6;border-color:#4FA986;color:#14603F;font-weight:700}
.specol .colchip.instock .sub{color:#2E7D5B;font-weight:700}
.specol .colchip.instock .stk{display:block;font-size:9.5px;font-weight:700;color:#0F5237;margin-top:2px}
/* لو مختار ومتوفر — يفضل الأخضر واضح مع تمييز الاختيار */
.specol .colchip.instock.on{background:#1E7A54;border-color:#14603F;color:#fff}
.specol .colchip.instock.on .sub,
.specol .colchip.instock.on .stk{color:#CFEBDD}
.colchip .stk{display:block;font-size:9.5px;font-weight:700;color:#1E7A54;margin-top:2px}
.door .rdy{display:inline-flex;align-items:center;gap:3px;margin-top:3px;font-size:9.5px;
  font-weight:700;color:#1E7A54;background:#E7F3EE;border-radius:20px;padding:2px 7px}
.door .rdy .i{width:11px;height:11px}
.stockbar{display:flex;align-items:flex-start;gap:8px;margin-top:11px;padding:10px 12px;
  border-radius:10px;font-size:12px;line-height:1.5}
.stockbar .i{flex:0 0 auto;margin-top:1px}
.stockbar.ok{background:#E7F3EE;border:1.5px solid #8FC7B0;color:#14603F}
.stockbar.part{background:#FFF6E5;border:1.5px solid #E8C9A8;color:#8A6512}
.stockbar.out{background:#F3F6FA;border:1.5px solid var(--line);color:var(--muted)}
.rodrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rodbox{border:1.5px solid var(--line);border-radius:11px;padding:10px;background:#fff;text-align:center}
.rodbox .rl{font-size:12px;font-weight:700;color:var(--navy);line-height:1.4}
.rodbox .rl b{color:var(--wood)}
.rodbox .rl small{display:block;font-size:10px;font-weight:400;color:var(--muted)}
.rodbox input{width:100%;margin-top:7px;border:1.5px solid var(--line);border-radius:9px;
  padding:9px 6px;text-align:center;font-size:16px;font-weight:700;color:var(--ink)}
.rodbox input:focus{border-color:var(--wood);outline:none}
.rodbox .rp{margin-top:5px;font-size:10.5px;color:var(--muted)}
.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 11px;
  font-family:inherit;font-size:14px;font-weight:700;resize:vertical;background:#fff;color:var(--ink)}
.fld textarea:focus{border-color:var(--brand);outline:none}
.focusrow .changedoor{width:auto;flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:9px 13px;font-size:12px}
.door{text-align:center;padding:0;min-width:0}
.door .leaf{
  position:relative;width:100%;aspect-ratio:3/4;border-radius:9px;overflow:hidden;
  border:2px solid var(--line);background:#E9EEF4;
  transform-origin:right center;transition:transform .25s ease,border-color .18s,box-shadow .18s;
  box-shadow:0 1px 4px rgba(0,32,80,.1);
}
.door .leaf img{width:100%;height:100%;object-fit:cover;display:block}
.door .leaf.noimg{background:linear-gradient(160deg,#B9CBDD,#4A6580)}
.door .leaf.noimg::before{
  content:attr(data-code);position:absolute;inset:0;display:grid;place-items:center;
  font-family:Arial,'Helvetica Neue',sans-serif;font-size:16px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);
}
.door.on .leaf{border-color:var(--wood);transform:perspective(620px) rotateY(-12deg);box-shadow:-6px 4px 18px rgba(166,100,47,.32)}
.door .zoombadge{
  position:absolute;top:5px;inset-inline-end:5px;width:24px;height:24px;border-radius:50%;
  background:rgba(0,20,50,.55);color:#fff;display:grid;place-items:center;font-size:13px;
  backdrop-filter:blur(2px);z-index:2;
}
.door .code{display:block;font-size:12px;font-weight:600;margin-top:7px;font-family:Arial,'Helvetica Neue',sans-serif}
.door .nm{display:block;font-size:10.5px;color:var(--muted);line-height:1.3}
.door.on .code{color:var(--wood)}

/* ============ الشرايح ============ */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border:1.5px solid var(--line);border-radius:10px;background:#FCFDFE;font-size:13.5px;font-weight:500;text-align:center}
.chip.on{background:var(--navy);border-color:var(--navy);color:#EAF2FA}
.chip .sub{display:block;font-size:10.5px;color:var(--muted);font-weight:400;margin-top:-2px}
.chip.on .sub{color:#9CB6D2}
.chip .ic{display:block;font-size:20px;line-height:1.2;margin-bottom:1px}

.note{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.55}
.note b{color:var(--brand)}
/* ============ العداد ============ */
.qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;width:fit-content;background:#FCFDFE}
.qty.sm{transform:scale(.78);transform-origin:center}
.qty.sm input{width:42px}
.sizeToggleRow{display:flex;flex-flow:row wrap;gap:7px;justify-content:center}
.sizeToggleRow .colchip{width:auto;flex:1 1 76px}
.sizeCard{margin-top:11px;padding:11px 12px;background:#F7FAFD;border:1.5px solid #DCEAF6;border-radius:13px}
.sizeCard .scHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.sizeCard .scHead b{font-size:14px;color:var(--navy)}
.sizeCard .fld.sm{margin-top:8px}
.sizeCard .fld.sm span{font-size:10.5px}
.hgtIn{width:100%;text-align:center;border:1.5px solid var(--line);border-radius:8px;
  padding:6px 2px;font-size:12px;background:#FCFDFE}
.hgtIn:focus{border-color:var(--brand);outline:none}
.hgtIn::placeholder{color:#AEBBC8}
.miniLbl{font-size:10px;color:var(--muted);font-weight:600;margin-top:9px;margin-bottom:4px}
.miniChips{display:flex;flex-wrap:wrap;gap:6px}
.miniChip{border:1.5px solid var(--line);border-radius:9px;padding:6px 10px;font-size:11.5px;
  font-weight:600;color:var(--ink);background:#fff}
.miniChip.on{background:var(--navy);border-color:var(--navy);color:#EAF2FA}
.miniChip:active{opacity:.85}
.miniChip.iconChip{display:inline-flex;align-items:center;gap:5px}
.qty button{width:40px;height:40px;font-size:19px;font-weight:600;color:var(--brand);display:grid;place-items:center}
.qty button:active{background:#EDF3F9}
.qty input{width:54px;text-align:center;border:0;border-inline:1.5px solid var(--line);border-radius:0;padding:10px 0;background:transparent}

/* ============ الأزرار ============ */
.btn{display:block;width:100%;padding:13px;border-radius:13px;font-family:Arial,'Helvetica Neue',sans-serif;font-size:14px;font-weight:600;text-align:center;transition:transform .1s,box-shadow .15s;font-variant-emoji:text}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--navy);color:#EAF2FA}
.btn.brand{background:linear-gradient(180deg,var(--brand-lt),var(--brand));color:#fff;box-shadow:0 3px 10px rgba(16,128,192,.28)}
.btn.wood{background:linear-gradient(180deg,var(--wood-lt),var(--wood));color:#fff;box-shadow:0 3px 10px rgba(166,100,47,.3)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.sm{padding:10px;font-size:12.5px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}
/* شبكة أزرار مضغوطة لشاشة المصنع — أصغر وأكتر تنظيمًا من .btnrow العادية */


.cardacts{display:flex;flex-wrap:nowrap;gap:4px;margin-top:9px;overflow-x:auto;padding-bottom:2px}
.cardacts .btn{padding:6px 4px;font-size:9.5px;border-radius:8px;flex:1 1 0;min-width:0}

/* ألوان موحّدة حسب وظيفة الزرار — عشان العين تفرّق بينهم بسرعة من غير ما تقرا */
.cardacts .btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.cardacts .btn i{font-style:normal;font-size:15px;line-height:1;font-variant-emoji:text}
.cardacts .btn svg{width:15px;height:15px}
.btn.act-edit  {background:#EAF2FA;border:1.5px solid #9CC6E4;color:#0B4A7A}
.btn.act-send  {background:#E7F3EE;border:1.5px solid #8FC7B0;color:#14603F}

.btn.act-del   {background:#FDECEA;border:1.5px solid #E8A9A3;color:var(--danger)}
.btn.act-tool  {background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.btn.act-report{background:#F1EEFA;border:1.5px solid #B7ABDD;color:#40308A}
.btn.act-money {background:var(--wood-bg);border:1.5px solid var(--wood-line);color:var(--wood)}
.btn:disabled{opacity:.55}

/* ============ الإكسسوارات ============ */
.acc{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.acc:last-of-type{border-bottom:0}
.acc .an{flex:1;min-width:0}
.acc .an b{display:block;font-size:13px;font-weight:500}
.acc .an span{font-size:11px;color:var(--muted)}
.acc .qty{transform:scale(.84);transform-origin:left center}

/* ============ السلة ============ */
.line{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.line:last-of-type{border-bottom:0}
.line img{width:44px;height:60px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:0 0 auto}
.line .ic{width:44px;height:60px;display:grid;place-items:center;background:#EDF3F9;border-radius:6px;font-size:20px;flex:0 0 auto}
.line .info2{flex:1;min-width:0}
.line .info2 b{font-size:13px;font-weight:600;display:block}
.line .info2 .spec{font-size:11.5px;color:var(--muted);line-height:1.55}
.line .info2 .pr{font-size:12.5px;color:var(--wood);font-weight:600;margin-top:2px}
.line .del{color:var(--danger);font-size:18px;padding:0 4px;align-self:flex-start}
.line .lineacts{display:flex;flex-direction:column;align-items:center;gap:6px;align-self:flex-start}
.line .edit{font-size:15px;padding:0 4px;line-height:1}

.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;margin-top:6px;border-top:2px solid var(--wood)}
.total .lbl{font-size:13px;color:var(--muted)}
.total .val{font-family:Arial,'Helvetica Neue',sans-serif;font-size:21px;font-weight:700;color:var(--wood)}
.total .val small{font-size:12px;font-weight:400;color:var(--muted)}

/* ============ طلباتي ============ */
.ord{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:11px;box-shadow:var(--shadow)}
.ord .oh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.ord .oid{font-family:Arial,'Helvetica Neue',sans-serif;font-weight:700;color:var(--brand);font-size:14px}
.ord .os{font-size:12.5px;color:var(--muted);line-height:1.6}
.ord .oa{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.ord .oa .btn{padding:9px;font-size:12.5px}

.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .em{font-size:38px;display:block;margin-bottom:10px;opacity:.45}

/* ============ التوست + اللودر ============ */
#toast{
  position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));inset-inline:16px;z-index:95;
  background:var(--navy);color:#EAF2FA;padding:13px 16px;border-radius:12px;font-size:13.5px;text-align:center;
  box-shadow:0 6px 22px rgba(0,32,80,.35);opacity:0;transform:translateY(14px);pointer-events:none;transition:.2s;
}
#toast.show{opacity:1;transform:translateY(0)}
#busy{position:fixed;inset:0;z-index:99;background:rgba(0,32,80,.55);display:none;place-items:center;color:#fff;font-size:14px}
#busy.on{display:grid}
#busy .b{background:var(--navy);padding:20px 26px;border-radius:14px;text-align:center}
#busy .sp{width:26px;height:26px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;margin:0 auto 10px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ============ الشريط السفلي ============ */
.bar{position:fixed;bottom:0;inset-inline:0;z-index:50;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.bar .inner{max-width:660px;margin:0 auto;display:flex;align-items:center;gap:11px}
.bar .sum{flex:0 0 auto;line-height:1.25}
.bar .sum b{display:block;font-family:Arial,'Helvetica Neue',sans-serif;font-size:16px}
.bar .sum span{font-size:11px;color:var(--muted)}
.bar .btn{flex:1;width:auto}


/* ============ المستند (عرض سعر / طلب) ============ */
#paper{position:fixed;top:-10000px;left:-10000px;width:794px;background:#fff}
/* ============================================================
   طبقة التحديث البصري — v108
   ------------------------------------------------------------
   مكتوبة كطبقة فوق التصميم الأصلي عشان أي حاجة مش مذكورة هنا
   تفضل شغّالة زي ما هي بالظبط. اللي اتغيّر:
   • شريط التبويبات بقى بقرص متحرّك بدل خط تحت — أوضح وبيتحرك بنعومة
   • الكروت والأزرار بقى لهم سلّم ظلال وزوايا موحّد بدل ظل واحد لكل حاجة
   • فتح وقفل اللوحات بقى فيه حركة قصيرة (١٨٠ مللي) بدل ما يظهر فجأة
   • مساحات اللمس كبرت للحد الآمن (44px) عشان الضغط ما يغلطش
   ============================================================ */

/* ---------- الأيقونات: سُمك أنعم ووضوح أعلى على الشاشات الصغيرة ---------- */
.i{stroke-width:1.75;shape-rendering:geometricPrecision}
.i.lg{stroke-width:1.7}
.tabs button .i{stroke-width:1.8;transition:transform var(--t-med) var(--ease-out),color var(--t-fast)}

/* ---------- شريط التبويبات ---------- */
.tabs{
  background:var(--card);border-bottom:1px solid var(--line-soft);
  padding:6px 6px calc(4px + env(safe-area-inset-bottom,0px));gap:4px;
  box-shadow:0 1px 0 rgba(12,32,64,.04);
}
.tabs button{
  border-bottom:0;border-radius:var(--r-md);padding:7px 2px 6px;min-height:52px;
  gap:4px;font-size:11px;position:relative;isolation:isolate;
  transition:color var(--t-fast) var(--ease);
}
/* القرص المتحرّك ورا الأيقونة — هو ده اللي بيبيّن التبويب الشغّال */
.tabs button::before{
  content:'';position:absolute;inset:0;z-index:-1;border-radius:var(--r-md);
  background:linear-gradient(180deg,#EAF4FC,#DCEDFA);
  opacity:0;transform:scale(.86);
  transition:opacity var(--t-med) var(--ease-out),transform var(--t-med) var(--ease-out);
}
.tabs button.on::before{opacity:1;transform:scale(1)}
.tabs button.on{color:var(--navy);font-weight:700}
.tabs button.on .i{color:var(--brand);transform:translateY(-1px) scale(1.06)}
.tabs button:active{transform:scale(.96)}
.tabs .badge{
  top:2px;inset-inline-end:calc(50% - 21px);
  background:linear-gradient(180deg,#E05A4E,#C33B2E);
  box-shadow:0 1px 4px rgba(195,59,46,.4);border:1.5px solid var(--card);
}

/* ---------- الهيدر ---------- */
#appbar::after{height:2.5px;opacity:.9}
.top{box-shadow:0 1px 12px rgba(0,32,80,.22)}
.top img.logo{box-shadow:0 2px 8px rgba(0,0,0,.18)}
.wh-chip{border-radius:var(--r-sm);backdrop-filter:saturate(1.4)}
.verstrip button{
  border-radius:var(--r-sm);min-height:32px;
  transition:background var(--t-fast),transform var(--t-fast) var(--ease);
}
.verstrip button:active{transform:scale(.95)}

/* ---------- الكروت ---------- */
.card{
  border-radius:var(--r-lg);border-color:var(--line-soft);
  box-shadow:var(--e2);margin-bottom:12px;
}
.card::before{opacity:.045}
/* الكروت اللي بره الشاشة مش بتتحسب في الرسم — الفرق بيبان في شاشة المصنع
   لما يكون فيه عشرات الطلبات: التمرير بيبقى ناعم بدل ما يتهتّ. */
.wrap>.card{content-visibility:auto;contain-intrinsic-size:auto 320px}

.step .n{border-radius:var(--r-sm);box-shadow:0 2px 8px rgba(16,128,192,.28)}

/* ---------- شريط الأقسام ---------- */
.secnav{gap:7px}
.secnav button{
  border-radius:var(--r-md);border-color:var(--line-soft);box-shadow:var(--e1);
  min-height:62px;
  transition:border-color var(--t-fast),background var(--t-fast),
             box-shadow var(--t-fast),transform var(--t-fast) var(--ease);
}
.secnav button:active{transform:scale(.97)}
.secnav button.on{box-shadow:0 0 0 1.5px var(--brand),var(--e2)}

/* ---------- الأزرار ---------- */
.btn{
  border-radius:var(--r-md);min-height:44px;
  transition:transform var(--t-fast) var(--ease),box-shadow var(--t-med) var(--ease),
             background var(--t-fast),opacity var(--t-fast);
}
.btn:active{transform:scale(.97)}
.btn.brand{box-shadow:0 2px 4px rgba(16,128,192,.18),0 6px 16px rgba(16,128,192,.24)}
.btn.brand:active{box-shadow:0 1px 3px rgba(16,128,192,.2)}
.btn.wood{box-shadow:0 2px 4px rgba(166,100,47,.18),0 6px 16px rgba(166,100,47,.24)}
.btn.primary{box-shadow:0 2px 4px rgba(0,32,80,.2),0 6px 16px rgba(0,32,80,.18)}
.btn.ghost{border-color:var(--line-soft);box-shadow:var(--e1)}
.btn.sm{min-height:38px;border-radius:var(--r-sm)}

.cardacts .btn{min-height:40px;border-radius:var(--r-sm);box-shadow:none}
.cardacts{gap:5px;scrollbar-width:none;-ms-overflow-style:none}
.cardacts::-webkit-scrollbar{display:none}

/* ---------- خانات الإدخال ---------- */
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=date],input[type=search],select,textarea{
  border-radius:var(--r-sm);border-color:var(--line-soft);min-height:44px;
  transition:border-color var(--t-fast),box-shadow var(--t-fast),background var(--t-fast);
}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px rgba(16,128,192,.14)}
input.bad{box-shadow:0 0 0 3px rgba(179,38,30,.1)}

/* ---------- الشريط السفلي ---------- */
.bar{box-shadow:0 -2px 10px rgba(12,32,64,.06),0 -10px 30px rgba(12,32,64,.08)}

/* ---------- التوست ---------- */
#toast{border-radius:var(--r-md);box-shadow:var(--e3)}

/* ---------- الحركة: ظهور اللوحات والكروت ---------- */
@keyframes riseIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* الحركة بتشتغل بس لما المستخدم يبدّل تبويب — مش مع كل ضغطة زرار.
   لو سابناها عامة كانت الكروت هتعيد الحركة مع كل +/- وده هيبان اهتزاز. */
#view.enter>.card{animation:riseIn var(--t-med) var(--ease-out) both}
#view.enter>.card:nth-child(2){animation-delay:.03s}
#view.enter>.card:nth-child(3){animation-delay:.06s}
#view.enter>.card:nth-child(n+4){animation-delay:.09s}

/* لو المستخدم مفعّل «تقليل الحركة» في نظامه، كل ده بيتلغي (القاعدة فوق في أول الملف) */

/* ---------- شاشات أكبر: عرض أوسع ومسافات أريح ---------- */
@media (min-width:720px){
  .wrap{max-width:760px;padding:18px}
  .card{padding:16px}
  .tabs button{font-size:12px}
}
/* ---------- تصحيحات شكل (v108) ---------- */
/* شريط الأقسام: خمس أزرار في شبكة أربعة كانت بتسيب الزرار الأخير لوحده في سطر.
   تلاتة في الصف بيدّي توزيع متوازن (3 + 2 في النص) ومساحة لمس أكبر. */
.secnav{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}
.secnav button{flex:1 1 calc(33.333% - 7px);min-width:96px;max-width:none}

/* الأيقونات جوه الحالات الفاضية والصور المصغّرة — كانت مقاسة لإيموجي بالخط */
.empty .em{opacity:.35;line-height:0}
.empty .em .i{width:52px;height:52px;stroke-width:1.4}
.line .ic .i{width:24px;height:24px;color:var(--muted);stroke-width:1.7}
.chip .ic,.specol .colchip .ic{line-height:0}
.lineacts .i{width:18px;height:18px}

/* أزرار فيها أيقونة + كلام: مسافة ثابتة بينهم بدل ما تعتمد على مسافة النص */
.btn .i{margin-inline-end:6px}
.cardacts .btn .i{margin-inline-end:0}

/* شارة السلة: تختفي وهي صفر بدل ما تفضل «0» أحمر على طول */
.tabs .badge.zero{display:none}
/* ---------- معاينة التقرير على الشاشة ----------
   بتعرض نفس اللي بيطلع في الـ PDF بالظبط، من غير ما تشغّل html2canvas ولا jsPDF —
   فبتفتح فورًا. التقرير مرسوم بعرض A4 ثابت (794px) فبنصغّره بـ transform:scale
   عشان يدخل في عرض الموبايل من غير تمرير أفقي. */
.rpv{position:fixed;inset:0;z-index:320;background:rgba(4,14,32,.96);display:flex;flex-direction:column}
.rpv-bar{
  display:flex;align-items:center;gap:8px;flex:0 0 auto;
  padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
  background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#EAF2FA;
  box-shadow:0 2px 14px rgba(0,0,0,.35);
}
.rpv-bar b{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rpv-bar button{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;min-height:38px;
  border-radius:var(--r-sm);font-size:12px;font-weight:700;padding:0 12px;
  transition:transform var(--t-fast) var(--ease),background var(--t-fast);
}
.rpv-bar button:active{transform:scale(.95)}
.grp-hd{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer}
.grp-chev{font-size:18px;color:#8A97A6;transition:transform .15s;flex:none}
.grp-list{border-top:1px solid var(--line)}
.grp-ord{display:flex;align-items:center;gap:6px;padding:7px 12px;border-top:1px dashed #E4EAF0;min-width:0;flex-wrap:nowrap}
.grp-ord:first-child{border-top:0}
.grp-stw{flex:1;min-width:0;display:flex;justify-content:center;overflow:hidden}
.grp-stw>span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px!important;padding:2px 8px!important;gap:3px!important}
.grp-stw .i{display:none!important}
.ord[data-oid]{scroll-margin-top:150px}
.grp-dy{color:#8A97A6;font-size:11px;font-weight:700;white-space:nowrap;flex:none}
.grp-ord.hasnote{border-bottom:0}
.grp-note{display:flex;gap:6px;align-items:flex-start;margin:0 12px 8px;padding:6px 10px;
  background:#FFF3D6;border:1.5px solid #E8B94A;border-inline-start:5px solid #D99A0B;
  border-radius:8px;color:#7A5405;font-weight:700;font-size:11.5px;line-height:1.55}
.grp-note .i{flex:none;width:13px;height:13px;margin-top:2px}
.grp-b{width:auto!important;padding:5px 9px!important;font-size:11px!important;flex:none}
.grp-b .i{width:13px;height:13px}
.grp-all{display:flex;align-items:center;gap:7px;padding:8px 12px;border-top:1px solid var(--line);
  background:#F7F9FC;font-size:11px;color:#6B7A8C}
.grp-all span:first-child{flex:1;min-width:0}
.ordnote-box{margin-top:11px;padding:9px 11px;background:#FFF8E7;border:1.5px solid #E8C77A;border-radius:11px}
.ordnote-ta{background:#fff;border-color:#E8C77A!important}
.ordnote{margin-top:7px;padding:7px 10px;background:#FFF3D6;border:1.5px solid #E8B94A;border-inline-start:5px solid #D99A0B;border-radius:8px;color:#7A5405;font-weight:700;font-size:12px;display:flex;gap:6px;align-items:flex-start}
.ordnote .i{flex:none;width:14px;height:14px;margin-top:1px}
.rpv-pdf{background:linear-gradient(180deg,var(--brand-lt),var(--brand));color:#fff}
.rpv-x{background:rgba(255,255,255,.14);border:1px solid rgba(159,209,240,.35);color:#EAF2FA;padding:0 10px}
.rpv-scroll{
  flex:1;overflow:auto;-webkit-overflow-scrolling:touch;
  padding:10px 8px calc(14px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;
  direction:ltr;   /* التقرير جواه بيحدد اتجاهه بنفسه — ده عشان حساب التصغير يبقى متوقّع */
}
/* الغلاف بياخد المقاس بعد التصغير، والصفحة جواه بعرضها الأصلي ومتصغّرة.
   من غير الغلاف ده، العنصر المصغّر بيفضل واخد مساحته الأصلية (794px) في التخطيط
   فيظهر تمرير أفقي وفراغ كبير تحت التقرير. */
.rpv-fit{flex:0 0 auto;overflow:hidden;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.rpv-page{
  /* نفس عرض #paper بالظبط (794px = A4) عشان المعاينة تطابق الـ PDF شكلاً وتوزيعًا.
     من غير العرض ده التقرير كان بيتضغط على عرض الموبايل والأعمدة تتلخبط،
     فالمعاينة تبقى مضلّلة — المصنع يشوف حاجة والملف يطلع حاجة تانية. */
  width:794px;transform-origin:top left;background:#fff;
}
@media (min-width:860px){ .rpv-scroll{padding:20px} }

/* ============================================================
   v186 — طبقة «الداكن الأنيق»
   ------------------------------------------------------------
   طبقة فوق التصميم القديم — أي حاجة مش مذكورة هنا بتفضل زي ما هي.
   • خلفية كحلي غامق، كروت أغمق شوية، حدود خفيفة، وذهبي للمسات
   • التبويبات تحت الشاشة على الموبايل، وفوق على الكمبيوتر (من 900px)
     — على الشاشة الكبيرة الشريط السفلي كان بيركب على أزرار الأقسام
   • كل خلفية بيضا كانت مكتوبة بالنص في التصميم القديم اتظبطت هنا
   ============================================================ */

/* ---------- الأساس ---------- */
body{background:var(--bg);color:var(--ink);
     padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px))}
body:has(#bar:not([hidden])){padding-bottom:calc(var(--navh) + 76px + env(safe-area-inset-bottom,0px))}
.wrap{padding-bottom:18px}
::selection{background:rgba(63,169,245,.3)}
:focus-visible{outline-color:var(--brand)}

/* ---------- الهيدر ---------- */
#appbar{background:transparent}
#appbar::after{height:2px;background:linear-gradient(90deg,var(--brand),var(--wood) 55%,rgba(217,164,65,0))}
.top{
  background:linear-gradient(180deg,rgba(24,38,63,.94),rgba(12,21,36,.90));
  -webkit-backdrop-filter:blur(16px) saturate(1.3);
  backdrop-filter:blur(16px) saturate(1.3);
  color:var(--ink);box-shadow:0 2px 18px rgba(0,0,0,.45);
  padding:calc(9px + env(safe-area-inset-top)) 14px 9px;
}
.top-row{gap:8px;flex-wrap:nowrap}
.top .ttl{min-width:0;flex:1 1 auto;overflow:hidden}
.top .t1{color:#fff;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t2{color:var(--muted);font-size:10.5px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.top img.logo{height:36px;border-radius:11px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.wh-chip{
  background:rgba(63,169,245,.12);border:1px solid rgba(63,169,245,.32);color:#9BCDF3;
  border-radius:var(--r-sm);padding:4px 8px;font-size:9.5px;white-space:nowrap;
}
.wh-chip b{color:#fff;font-size:11px}
.top .t2 .vs-ver{background:rgba(255,255,255,.08);border-radius:var(--r-pill);padding:1px 7px;font-size:9.5px;color:#9FB3CC}
.verstrip{margin-top:0;gap:5px;flex:0 0 auto;flex-wrap:nowrap}
.verstrip button{
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.14);color:#CFE2F4;
  min-height:36px;min-width:36px;padding:0 9px;display:inline-flex;align-items:center;
  justify-content:center;gap:5px;font-size:11px;
}
.verstrip button .i{width:16px;height:16px;margin:0}
.verstrip button.vs-install{
  background:linear-gradient(180deg,var(--brand-lt),var(--brand));border-color:transparent;color:#06131F;
  box-shadow:0 2px 10px rgba(63,169,245,.35);
}
@media (max-width:430px){ .verstrip button.vs-install{font-size:0;padding:0;min-width:36px} }

/* ---------- التبويبات: تحت على الموبايل ---------- */
.tabs{
  position:fixed;bottom:0;inset-inline:0;z-index:60;
  background:rgba(12,21,36,.92);
  -webkit-backdrop-filter:blur(16px) saturate(1.4);
  backdrop-filter:blur(16px) saturate(1.4);
  border-top:1px solid var(--line);border-bottom:0;
  box-shadow:0 -2px 20px rgba(0,0,0,.5);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
  max-width:660px;margin:0 auto;
}
.tabs button{min-height:50px;padding:6px 2px 5px;color:var(--muted)}
.tabs button::before{background:linear-gradient(180deg,rgba(63,169,245,.20),rgba(63,169,245,.10))}
.tabs button.on{color:#fff}
.tabs button.on .i{color:var(--brand)}
.tabs .badge{background:linear-gradient(180deg,#E2574C,#C0392B);border-color:transparent;
  box-shadow:0 1px 6px rgba(0,0,0,.5);top:0;inset-inline-end:calc(50% - 24px)}

/* ---------- الكمبيوتر: التبويبات ترجع فوق ----------
   على الشاشة الكبيرة الشريط الثابت تحت كان بيركب على محتوى الصفحة
   (أزرار الأقسام) — فبيرجع صف عادي فوق تحت الهيدر على طول. */
@media (min-width:820px){
  body{display:flex;flex-direction:column;min-height:100vh;padding-bottom:0}
  #appbar{order:-2;position:static}
  .tabs{
    order:-1;position:sticky;top:0;bottom:auto;inset-inline:auto;
    max-width:none;margin:0;border-top:0;border-bottom:1px solid var(--line);
    box-shadow:0 2px 18px rgba(0,0,0,.45);padding:6px 10px;
  }
  .tabs{justify-content:center;gap:6px}
  .tabs button{flex:0 1 180px}
  main.wrap{order:0;flex:1 0 auto}
  body:has(#bar:not([hidden])){padding-bottom:86px}
  .bar{bottom:0}
  #toast{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  body:has(#bar:not([hidden])) #toast{bottom:104px}
}

/* ---------- شريط الإجمالي ---------- */
.bar{
  bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,rgba(22,35,58,.97),rgba(12,21,36,.97));
  border-top:1px solid var(--line);color:var(--ink);
  padding:11px 14px;box-shadow:0 -6px 26px rgba(0,0,0,.5);
}
.bar .sum b{color:#fff;font-size:17px}
.bar .sum span{color:var(--muted)}
.bar .btn.brand{background:linear-gradient(180deg,#4FC08A,#2E9C6A);color:#04140D;
  box-shadow:0 2px 12px rgba(46,156,106,.35)}

/* ---------- الكروت والأسطح ---------- */
.card,.ord{background:var(--card);border-color:var(--line);border-radius:var(--r-lg);box-shadow:var(--e2)}
/* العلامة المائية (اللوجو) خلفيتها بيضا — على الغامق كانت بتبان كمربّع فاتح */
.card::before{display:none}
.step .n{background:linear-gradient(160deg,var(--brand-lt),var(--brand));color:#06131F;
  box-shadow:0 2px 10px rgba(63,169,245,.3)}
.step h2{color:#fff}
.grp{color:var(--wood)}
.secnav button{background:var(--card);border-color:var(--line)}
.secnav button .tx{color:var(--muted)}
.secnav button.on{background:linear-gradient(180deg,#1B2B46,#16233A);border-color:var(--brand);
  box-shadow:0 0 0 1.5px var(--brand),var(--e2)}
.secnav button.on .i,.secnav button.on .tx{color:var(--brand)}
.doorpanel{background:#111C2E;border-color:rgba(63,169,245,.45)}
.doorpanel .dphead b{color:#fff}
.sizeCard{background:#111C2E;border-color:var(--line)}
.sizeCard .scHead b{color:var(--wood)}
.accgrid .ac,.rodbox{background:var(--surface-2);border-color:var(--line)}
.rodbox .rl{color:var(--ink)}
.rodbox .rl b{color:var(--wood)}

/* ---------- الشرايح والعدادات والإدخال ---------- */
.chip,.miniChip,.specol .colchip,.qty,.hgtIn,.stkin{background:var(--surface-2);border-color:var(--line);color:var(--ink)}
.chip.on,.miniChip.on,.specol .colchip.on{background:var(--brand);border-color:var(--brand);color:#06131F}
.chip.on .sub,.specol .colchip.on .sub{color:#0B2138}
.specol .sol-h,.miniLbl,.prow3 .tcell b{color:var(--muted)}
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=date],input[type=search],select,textarea,.fld textarea,.prow3 input{
  background:var(--surface-2);border-color:var(--line);color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(63,169,245,.18)}
input::placeholder,textarea::placeholder,.hgtIn::placeholder{color:#6B7F98}
input.bad{border-color:var(--danger);background:rgba(240,115,106,.12);box-shadow:0 0 0 3px rgba(240,115,106,.12)}
.qty button{color:var(--brand)}
.qty button:active{background:rgba(63,169,245,.14)}
.qty input{background:transparent;border-inline-color:var(--line)}
label.fld span{color:var(--muted)}

/* ---------- الأبواب ---------- */
.door .leaf{background:#16233A;border-color:var(--line);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.door.on .leaf{border-color:var(--wood);box-shadow:-6px 4px 20px rgba(217,164,65,.28)}
.door.on .code{color:var(--wood)}
.door .nm{color:var(--muted)}

/* ---------- الأزرار ---------- */
.btn.brand{background:linear-gradient(180deg,var(--brand-lt),var(--brand));color:#06131F;
  box-shadow:0 2px 4px rgba(63,169,245,.2),0 6px 16px rgba(63,169,245,.24)}
.btn.wood{background:linear-gradient(180deg,var(--wood-lt),var(--wood));color:#1B1405;
  box-shadow:0 2px 10px rgba(217,164,65,.3)}
.btn.primary{background:#22304A;color:#EAF2FA;box-shadow:var(--e1)}
.btn.ghost{background:var(--surface-2);border-color:var(--line);color:#CFE2F4}
.btn.act-edit  {background:rgba(63,169,245,.13);border-color:rgba(63,169,245,.4);color:#9BCDF3}
.btn.act-send  {background:rgba(79,192,138,.13);border-color:rgba(79,192,138,.4);color:#7FD8AE}

.btn.act-del   {background:rgba(240,115,106,.13);border-color:rgba(240,115,106,.4);color:#F3968F}
.btn.act-tool  {background:var(--surface-2);border-color:var(--line);color:#CFE2F4}
.btn.act-report{background:rgba(150,130,225,.14);border-color:rgba(150,130,225,.4);color:#BBAAEE}
.btn.act-money {background:rgba(217,164,65,.13);border-color:rgba(217,164,65,.4);color:#E3BE79}

/* ---------- السلة والإجماليات ---------- */
.line,.acc,.prow3,.grp-list,.grp-ord,.focusrow{border-color:var(--line)}
.line .ic{background:var(--surface-2)}
.line img{border-color:var(--line)}
.line .info2 .spec{color:var(--muted)}
.line .info2 .pr{color:var(--wood)}
.total{border-top-color:var(--wood)}
.total .val{color:var(--wood)}
.total .lbl,.total .val small,.note,.empty{color:var(--muted)}
.note b{color:var(--brand)}
.ord .oid{color:var(--brand)}
.ord .os{color:var(--muted)}

/* ---------- الجداول والمخزن ---------- */
.stktbl th{background:#1B2B46;color:#CFE2F4}
.stktbl td{border-bottom-color:var(--line)}
.stktbl tbody tr:nth-child(even){background:rgba(255,255,255,.025)}
.stkin.dirty{border-color:var(--wood);background:rgba(217,164,65,.12)}
.specol .colchip.instock{background:rgba(79,192,138,.14);border-color:rgba(79,192,138,.45);color:#7FD8AE}
.specol .colchip.instock .sub,.specol .colchip.instock .stk{color:#69C79B}
.specol .colchip.instock.on{background:#2E9C6A;border-color:#4FC08A;color:#04140D}
.specol .colchip.instock.on .sub,.specol .colchip.instock.on .stk{color:#0A2418}
.colchip .stk{color:#69C79B}
.door .rdy{background:rgba(79,192,138,.14);color:#7FD8AE}
.stockbar.ok{background:rgba(79,192,138,.12);border-color:rgba(79,192,138,.4);color:#7FD8AE}
.stockbar.part{background:rgba(217,164,65,.12);border-color:rgba(217,164,65,.4);color:#E3BE79}
.stockbar.out{background:var(--surface-2);border-color:var(--line);color:var(--muted)}

/* ---------- صناديق الملاحظات ---------- */
.ordnote-box,.ordnote{background:rgba(217,164,65,.10);border-color:rgba(217,164,65,.4);color:#E3BE79}
.ordnote-ta{background:var(--surface-2)!important;border-color:rgba(217,164,65,.4)!important;color:var(--ink)}
.grp-all{background:rgba(255,255,255,.03);color:var(--muted);border-top-color:var(--line)}
.grp-dy{color:#E3BE79}
.grp-note{background:rgba(217,164,65,.10);border-color:rgba(217,164,65,.4);
  border-inline-start-color:var(--wood);color:#E3BE79}
.grp-chev{color:var(--muted)}

/* ---------- التوست واللودر والمعاينة ---------- */
#toast{background:#1B2B46;color:#EAF2FA;border:1px solid var(--line);box-shadow:var(--e3);
  bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom,0px))}
body:has(#bar:not([hidden])) #toast{bottom:calc(var(--navh) + 88px + env(safe-area-inset-bottom,0px))}
#busy{background:rgba(6,14,26,.7)}
#busy .b{background:#16233A;border:1px solid var(--line)}
.rpv{background:rgba(4,10,20,.97)}
.rpv-bar{background:linear-gradient(180deg,#1B2B46,#0C1524);color:#EAF2FA}
.rpv-pdf{background:linear-gradient(180deg,var(--brand-lt),var(--brand));color:#06131F}

/* ============================================================
   وضوح الكلام وحجمه (v187)
   ------------------------------------------------------------
   شكوى من الشاشة: الكلام صغير وباهت — خصوصًا أسامي العملاء في شاشة
   المصنع (كانت بلون كحلي غامق مكتوب بالنص، فعلى الخلفية الغامقة بقى
   شبه مخفي). هنا بنكبّر سلّم الخطوط كله ونرفع تباين الألوان الباهتة.
   ============================================================ */
body{font-size:16px;line-height:1.65}
.wrap{padding:16px}
.card{padding:16px}

/* العناوين والخطوات */
.step h2{font-size:17px}
.step .hint{font-size:12.5px}
.step .n{width:31px;height:31px;font-size:13px}
.grp{font-size:13.5px}

/* الحقول */
label.fld span{font-size:13.5px}
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=date],input[type=search],select,textarea{font-size:15.5px}
.fld textarea{font-size:15px}
.note{font-size:12.5px;line-height:1.7}

/* الشرايح والأزرار */
.chip{font-size:14.5px}
.chip .sub{font-size:11.5px}
.miniChip{font-size:12.5px}
.specol .colchip{font-size:11.5px}
.specol .colchip .sub{font-size:10px}
.specol .colchip .stk,.colchip .stk{font-size:10.5px}
.specol .sol-h{font-size:11px}
.miniLbl{font-size:11px}
.btn{font-size:15px}
.btn.sm{font-size:13.5px}

.cardacts .btn{font-size:11px}
.cardacts .btn svg{width:16px;height:16px}
.secnav button .tx{font-size:12px}
.secnav button .i{width:24px;height:24px}

/* التبويبات */
.tabs button{font-size:12px}
.tabs button .i{width:23px;height:23px}
.tabs .badge{font-size:11px;min-width:19px;line-height:19px}

/* السلة */
.line .info2 b{font-size:14.5px}
.line .info2 .spec{font-size:12.5px;line-height:1.6}
.line .info2 .pr{font-size:13.5px}
.line img,.line .ic{width:52px;height:68px}
.total .lbl{font-size:14px}
.total .val{font-size:23px}
.bar .sum b{font-size:18px}
.bar .sum span{font-size:12px}

/* الطلبات وشاشة المصنع */
.ord{padding:15px}
.ord .oid{font-size:15.5px}
.ord .os{font-size:13.5px;line-height:1.7}
.ord .oa .btn{font-size:13px}
.grp-hd{padding:14px}
.grp-hd b{font-size:15.5px!important;color:#fff!important}
.grp-hd div{font-size:12px!important}
.grp-dy{font-size:12px}
.grp-all{font-size:12px}
.grp-b{font-size:12px!important;padding:6px 11px!important}
.grp-chev{font-size:20px}
.stktbl{font-size:13px}
.stktbl th{font-size:12px}
.empty{font-size:15px}

/* ⚠️ شبكة الإكسسوارات كانت ٣ أعمدة ثابتة، وعدّاد الكمية جوّه الكارت عرضه
   ثابت (١٣٤px) أكبر من عرض العمود — فالشبكة كانت بتتمدّ برّه الشاشة والكارت
   التالت في كل صف يتقص من على الشمال. الموزّع مكانش شايف تلت الإكسسوارات
   أصلاً. الحل: أعمدة مرنة حسب عرض الشاشة، والعدّاد يصغّر فعليًا (مش بـscale
   اللي بيسيب مساحته الأصلية محجوزة في التخطيط). */
.accgrid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.accgrid .ac b{font-size:12.5px;min-height:32px}
.accgrid .ac .pr{font-size:11.5px}
.accgrid .ac .qty{transform:none;width:fit-content}
.accgrid .ac .qty button{width:34px;height:36px;font-size:18px}
.accgrid .ac .qty input{width:40px;padding:7px 0;font-size:14.5px}

/* الكلام الباهت: نرفع التباين شوية على الغامق */
/* ⚠️ الألوان دي كانت مكتوبة بالنص جوّه قوالب الجافاسكريبت (style="color:#E3BE79")،
   فالـCSS مش قادرة تغيّرها مع تغيير الشكل — على الفاتح كانت بتطلع باهتة
   لدرجة إنها شبه مخفية. بقت توكنز، وكل شكل بيحطلها قيمته. */
:root{--muted:#A3B6CE;--warn-ink:#E3BE79;--info-ink:#9BCDF3;--ok-ink:#7FD8AE;--danger-ink:#F3968F}
.top .t2{color:#A3B6CE}

/* ============================================================
   v197 — الشكل ١ «نظيف وهادي»
   ------------------------------------------------------------
   أبيض، أزرق واحد، ظلال خفيفة. نفس الشكل اللي اخترته من الاقتراحات
   التلاتة: أوضح حاجة للقراءة في نور الورشة وللموزّعين الكبار في السن.

   مكتوبة كطبقة فوق طبقة «الداكن الأنيق» (v186) — الخطوات والأزرار
   والمسارات كلها زي ما هي بالظبط، اللون والسطح بس هما اللي بيتغيّروا.

   ⚠️ أهم حاجة هنا: طبقة الداكن كان فيها ألوان مكتوبة بالنص (نصوص بيضا،
   شرايط شبه شفافة غامقة، ظلال سودة قوية). التوكنز لوحدها مش كفاية —
   لو سيبنا الألوان دي زي ما هي، هنطلع حروف بيضا على خلفية بيضا. فكل
   قاعدة فيها لون مكتوب بالنص متظبّطة تحت واحدة واحدة.

   • لون تمييز واحد (أزرق) — الذهبي بقى نفس الأزرق عشان الشكل يفضل هادي
   • التحذيرات فاضلة بلون كهرماني (دلالة، مش زينة)
   • مستندات الـPDF ألوانها جواها بالنص — ما اتغيّرتش (كانت أبيض أصلاً)
   ============================================================ */
:root{
  --navy:#0F2C4F;
  --navy-2:#1D5E96;
  --brand:#0E7BD1;
  --brand-lt:#3C9BE0;
  /* الذهبي بقى نفس الأزرق: «أزرق واحد» هو أصل الشكل ده */
  --wood:#0E7BD1;
  --wood-lt:#3C9BE0;
  --wood-bg:rgba(14,123,209,.07);
  --wood-line:rgba(14,123,209,.28);
  --bg:#F6F8FB;
  --card:#FFFFFF;
  --surface-2:#F4F7FB;
  --ink:#0F2740;
  --muted:#7A8AA0;
  --line:#E8EDF3;
  --ok:#12805C;
  --ok-bg:rgba(18,128,92,.10);
  --warn-bg:#FFF6E5;
  --warn-line:#EBCF9B;
  --danger:#C6362D;
  --shadow:0 2px 10px rgba(15,39,64,.07);
  --e1:0 1px 2px rgba(15,39,64,.05), 0 1px 3px rgba(15,39,64,.05);
  --e2:0 1px 3px rgba(15,39,64,.05), 0 4px 14px rgba(15,39,64,.07);
  --e3:0 6px 16px rgba(15,39,64,.10), 0 18px 40px rgba(15,39,64,.13);
}

/* ---------- الأساس ---------- */
::selection{background:rgba(14,123,209,.16)}

/* ---------- الهيدر ---------- */
#appbar::after{height:1px;background:var(--line)}
.top{
  background:#fff;
  -webkit-backdrop-filter:none;backdrop-filter:none;
  color:var(--ink);box-shadow:0 1px 0 var(--line);
}
.top .t1{color:var(--ink)}
.top .t2,.top .t2 .vs-ver{color:var(--muted)}
.top .t2 .vs-ver{background:var(--surface-2)}
.top img.logo{box-shadow:none;border:1px solid var(--line)}
.wh-chip{background:#F1F6FB;border-color:#DCE9F5;color:#4A7FA8}
.wh-chip b{color:var(--navy)}
.verstrip button{background:#fff;border-color:var(--line);color:#42536B}
.verstrip button.vs-install{
  background:linear-gradient(180deg,var(--brand-lt),var(--brand));border-color:transparent;color:#fff;
  box-shadow:0 2px 8px rgba(14,123,209,.24);
}

/* ---------- التبويبات ---------- */
.tabs{
  background:rgba(255,255,255,.94);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 -1px 0 var(--line);
}
.tabs button{color:var(--muted)}
.tabs button::before{background:rgba(14,123,209,.08)}
.tabs button.on{color:var(--brand)}
.tabs button.on .i{color:var(--brand)}
.tabs .badge{background:var(--danger);box-shadow:0 1px 4px rgba(198,54,45,.30)}
@media (min-width:820px){
  .tabs{box-shadow:0 1px 0 var(--line)}
}

/* ---------- شريط الإجمالي ---------- */
.bar{
  background:rgba(255,255,255,.97);border-top-color:var(--line);color:var(--ink);
  box-shadow:0 -4px 18px rgba(15,39,64,.08);
}
.bar .sum b{color:var(--ink)}
.bar .btn.brand{background:linear-gradient(180deg,var(--brand-lt),var(--brand));color:#fff;
  box-shadow:0 2px 10px rgba(14,123,209,.26)}

/* ---------- الكروت والأسطح ---------- */
.card,.ord{background:var(--card);box-shadow:var(--e2)}
.step .n{background:linear-gradient(160deg,var(--brand-lt),var(--brand));color:#fff;
  box-shadow:0 2px 8px rgba(14,123,209,.22)}
.step h2{color:var(--ink)}
.grp{color:var(--brand)}
.secnav button{background:#fff}
.secnav button.on{background:#F1F7FD;border-color:var(--brand);
  box-shadow:0 0 0 1.5px var(--brand),var(--e1)}
.doorpanel{background:#FBFCFE;border-color:rgba(14,123,209,.28)}
.doorpanel .dphead b{color:var(--ink)}
.sizeCard{background:#FBFCFE}
.sizeCard .scHead b{color:var(--ink)}
.rodbox .rl b{color:var(--brand)}

/* ---------- الشرايح والإدخال ---------- */
.chip,.miniChip,.specol .colchip,.qty,.hgtIn,.stkin{background:#fff}
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=date],input[type=search],select,textarea,.fld textarea,.prow3 input{background:#fff}
.chip.on,.miniChip.on,.specol .colchip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.on .sub,.specol .colchip.on .sub{color:#DCEBF8}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,123,209,.13)}
input::placeholder,textarea::placeholder,.hgtIn::placeholder{color:#9FAEC2}
input.bad{background:#FFF3F2;box-shadow:0 0 0 3px rgba(198,54,45,.10)}
.qty button:active{background:rgba(14,123,209,.08)}

/* ---------- الأبواب ---------- */
.door .leaf{background:#fff;box-shadow:var(--e1)}
.door.on .leaf{border-color:var(--brand);box-shadow:-4px 3px 14px rgba(14,123,209,.18)}
.door.on .code{color:var(--brand)}

/* ---------- الأزرار ---------- */
.btn.brand{background:linear-gradient(180deg,var(--brand-lt),var(--brand));color:#fff;
  box-shadow:0 1px 2px rgba(14,123,209,.16),0 4px 12px rgba(14,123,209,.18)}
.btn.wood{background:linear-gradient(180deg,var(--brand-lt),var(--brand));color:#fff;
  box-shadow:0 2px 8px rgba(14,123,209,.22)}
.btn.primary{background:var(--navy);color:#fff;box-shadow:var(--e1)}
.btn.ghost{background:#fff;color:#42536B}
.btn.act-edit  {background:#F1F7FD;border-color:#CFE3F5;color:#1466A8}
.btn.act-send  {background:#EFF8F3;border-color:#C4E4D5;color:#0E6B4D}

.btn.act-del   {background:#FDF2F1;border-color:#F0CFCC;color:#A82D25}
.btn.act-tool  {background:#fff;border-color:var(--line);color:#42536B}
.btn.act-report{background:#F4F2FD;border-color:#D9D2F3;color:#5945A8}
.btn.act-money {background:#F1F7FD;border-color:#CFE3F5;color:#1466A8}

/* ---------- السلة والإجماليات ---------- */
.line .ic{background:var(--surface-2)}
.line .info2 .pr{color:var(--brand)}
.total{border-top-color:var(--brand)}
.total .val{color:var(--brand)}
.note b{color:var(--brand)}
.ord .oid{color:var(--brand)}

/* ---------- الجداول والمخزن ---------- */
.stktbl th{background:var(--surface-2);color:#42536B}
.stktbl tbody tr:nth-child(even){background:#FAFCFE}
.stkin.dirty{border-color:var(--brand);background:#F1F7FD}
.specol .colchip.instock{background:#EFF8F3;border-color:#C4E4D5;color:#0E6B4D}
.specol .colchip.instock .sub,.specol .colchip.instock .stk{color:#12805C}
.specol .colchip.instock.on{background:#12805C;border-color:#12805C;color:#fff}
.specol .colchip.instock.on .sub,.specol .colchip.instock.on .stk{color:#D8EFE5}
.colchip .stk{color:#12805C}
.door .rdy{background:#EFF8F3;color:#0E6B4D}
.stockbar.ok{background:#EFF8F3;border-color:#C4E4D5;color:#0E6B4D}
.stockbar.part{background:var(--warn-bg);border-color:var(--warn-line);color:#8A5A0B}
.stockbar.out{background:var(--surface-2);border-color:var(--line);color:#5B6B82}

/* ---------- صناديق الملاحظات ---------- */
.ordnote-box,.ordnote{background:var(--warn-bg);border-color:var(--warn-line);color:#8A5A0B}
.ordnote-ta{background:#fff!important;border-color:var(--warn-line)!important;color:var(--ink)}
.grp-all{background:var(--surface-2);color:#5B6B82;border-top-color:var(--line)}
.grp-dy{color:#8A5A0B}
.grp-note{background:var(--warn-bg);border-color:var(--warn-line);
  border-inline-start-color:#D9A441;color:#8A5A0B}
.grp-chev{color:var(--muted)}
.grp-hd b{color:var(--ink)!important}

/* ---------- التوست واللودر والمعاينة ---------- */
#toast{background:var(--navy);color:#fff;border-color:transparent;box-shadow:var(--e3)}
#busy{background:rgba(15,39,64,.28)}
#busy .b{background:#fff;color:var(--ink)}
#busy .sp{border-color:var(--line);border-top-color:var(--brand)}
#busyTxt{display:block;max-width:330px;line-height:1.6;font-weight:700}
.rpv{background:rgba(15,39,64,.55)}
.rpv-bar{background:#fff;color:var(--ink);border-bottom:1px solid var(--line)}
.rpv-pdf{background:linear-gradient(180deg,var(--brand-lt),var(--brand));color:#fff}

/* ---------- الكلام الباهت: تباين مظبوط على الفاتح ---------- */
:root{--muted:#5B6B82;--warn-ink:#8A5A0B;--info-ink:#1466A8;--ok-ink:#0E6B4D;--danger-ink:#A82D25}
.top .t2{color:#5B6B82}
.specol .sol-h,.miniLbl,.prow3 .tcell b,label.fld span{color:#4A5C74}
.line .info2 .spec,.ord .os,.note,.empty,.total .lbl{color:#5B6B82}

/* ============================================================
   v200 — «خفيف ودقيق» (شكل ٢٠٢٧)
   ------------------------------------------------------------
   تطوير هادي فوق الشكل النظيف (v197): خطوط الأيقونات أرفع وأدق، زوايا
   أنعم، ومساحات أوسع. مفيش أي خطوة ولا زرار اتغيّر — المقاسات بس.

   اللي اتغيّر بالأرقام:
     • سُمك خط الأيقونة من ١.٧٥ لـ١.٥ على شبكة ٢٤ (ده اللي ماشي في
       أيقونات ٢٠٢٦–٢٠٢٧: خط واحد رفيع ودقيق يفضل مقروء وهو صغير).
     • الزوايا كبرت درجة: الكارت ١٨→٢٢، والشرايح والخانات معاها.
     • الكارت والشاشة خدوا مساحة زيادة تتنفّس فيها.
     • الحدود بقت أخف شوية عشان الخط الرفيع ما يتوهش وسط إطار تقيل.
   ============================================================ */
:root{
  --r:20px;
  --r-sm:12px;
  --r-md:16px;
  --r-lg:22px;
  --line:#EDF1F6;
}

/* ---------- الأيقونات ---------- */
.i{stroke-width:1.5}
.i.lg{stroke-width:1.45}
.i.xl{stroke-width:1.4}
.tabs button .i{stroke-width:1.55}
.step .n .i{stroke-width:1.7}
/* الأيقونة اللي جوّه زرار ملوّن محتاجة شعرة زيادة عشان ما تبهتش على اللون */
.btn.brand .i,.btn.primary .i,.bar .btn .i{stroke-width:1.65}

/* ---------- مساحة تتنفّس فيها ---------- */
.wrap{padding:18px 16px}
.card{padding:18px}
.card,.ord{border-radius:var(--r-lg)}
.step{margin-bottom:14px}
.chips{gap:8px}
.miniChips{gap:7px}
.chip,.miniChip{border-radius:var(--r-pill)}
.sizeCard,.doorpanel,.rodbox,.accgrid .ac{border-radius:var(--r-md)}
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=date],input[type=search],select,textarea,.fld textarea{border-radius:var(--r-sm)}
.btn{border-radius:var(--r-sm)}
.line{padding-block:13px}
.line img,.line .ic{border-radius:var(--r-sm)}
.door .leaf{border-radius:var(--r-md)}

/* ---------- حدود أخف تحت الخط الرفيع ---------- */
.card,.ord,.sizeCard,.rodbox,.accgrid .ac{border-width:1px}
.chip,.miniChip{border-width:1px}
.chip.on,.miniChip.on{border-width:1px}

/* ---------- التبويبات: أهدى شوية ---------- */
.tabs button .i{width:22px;height:22px}
.secnav button .i{width:23px;height:23px}

/* ---------- ترتيب الشرايح: شبكة منتظمة بدل صفوف مبعثرة ----------
   ⚠️ الشكوى: الشرايح واخدة عرض كبير، اتنين في الصف، والآخر لوحده —
   والشاشة بتضيع في الفاضي. ١١ لون كانوا ٦ صفوف.
   السبب إن الشرايح كانت بتتلفّ حسب عرض النص (flex-wrap)، فطول النص
   العربي المختلف بيسيب فراغات متفاوتة وصف آخر ناقص.
   الحل: شبكة أعمدتها متساوية بتتحسب من عرض الشاشة — كل الشرايح بنفس
   العرض، الصفوف متساوية، ومفيش فراغ ضايع. */
.chips{
  display:grid;
  /* ٩٢ بكسل = أضيق عرض يخلّي ٣ أعمدة تدخل على تليفون ٣٦٠ بكسل (أصغر شاشة
     عملية: عرض الصف الفعلي هناك ٢٩٠ بكسل، و٣×٨٨+١٦ = ٢٨٠ بتدخل)، ويفضل ٣
     أعمدة على ٤١٢ كمان. أطول اسم («A013 — أرو فاتح» ١٠٤ بكسل) بينزل سطرين
     على الضيق بس — وده أحسن من إننا نضيّع صف كامل. */
  grid-template-columns:repeat(auto-fill,minmax(88px,1fr));
  gap:8px;align-items:stretch;
}
.chip{
  padding:9px 6px;               /* العرض بقى من الشبكة، فالحشو الجانبي مالوش لازمة */
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:44px;line-height:1.35;
  overflow-wrap:break-word;      /* يكسر عند المسافة، مش في نص الكلمة */
}
/* صف أزرار الحالة في شاشة المصنع لازم يفضل سطر واحد */
.chips-line{display:flex;flex-wrap:nowrap}
.chips-line .chip{padding:9px 10px}

/* أزرار الأقسام: صفوف متساوية كمان (كانت ٣ وبعدين ٢ متمدّدين) */
.secnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.secnav button{flex:none;min-width:0;max-width:none}

/* ============================================================
   v202 — «زجاج وعُمق» (الشكل ٢)
   ------------------------------------------------------------
   الشكل ١ كان مقصود إنه هادي — خط الأيقونة من ١.٧٥ لـ١.٥ مابيبانش.
   ده الشكل التاني من الاقتراحات: أسطح شبه شفافة فوق خلفية فيها
   تدرّجات لون خفيفة، ظلال ناعمة ملوّنة، وأزرار ليها عمق.

   مفيش أي خطوة ولا زرار اتغيّر — السطح واللون بس.

   ⚠️ backdrop-filter مش مدعوم على كل الأجهزة (ولا بيشتغل وقت تصوير
   المستندات في html2canvas). كل حتة فيها زجاج ليها خلفية صلبة تحتها،
   فلو الفلتر مشتغلش السطح يفضل مقروء — مش شفاف على الفاضي.
   ============================================================ */
:root{
  --brand:#1F6FEB;
  --brand-lt:#4B93FF;
  --wood:#1F6FEB;
  --wood-lt:#4B93FF;
  --bg:#EDF2FA;
  --card:rgba(255,255,255,.72);
  --surface-2:rgba(255,255,255,.55);
  --line:rgba(255,255,255,.9);
  --ink:#0E1B2E;
  --e1:0 1px 2px rgba(14,27,46,.05);
  --e2:0 2px 8px rgba(14,27,46,.06), 0 10px 26px rgba(14,27,46,.07);
  --e3:0 10px 26px rgba(14,27,46,.12), 0 24px 54px rgba(14,27,46,.14);
}

/* خلفية فيها لمسات لون خفيفة — دي اللي بتدّي الزجاج معنى */
body{
  background:
    radial-gradient(58% 34% at 10% 0%,rgba(31,111,235,.16),transparent 62%),
    radial-gradient(52% 30% at 94% 10%,rgba(120,80,230,.13),transparent 60%),
    radial-gradient(66% 38% at 50% 100%,rgba(0,180,175,.12),transparent 62%),
    var(--bg);
  background-attachment:fixed;
}

/* ---------- الأسطح الزجاجية ---------- */
.card,.ord,.sizeCard,.doorpanel,.rodbox,.accgrid .ac{
  background:var(--card);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:var(--e2),inset 0 1px 0 rgba(255,255,255,.85);
  -webkit-backdrop-filter:blur(16px) saturate(1.6);
  backdrop-filter:blur(16px) saturate(1.6);
}
.top{
  background:rgba(255,255,255,.62);
  -webkit-backdrop-filter:blur(18px) saturate(1.7);
  backdrop-filter:blur(18px) saturate(1.7);
  box-shadow:0 1px 0 rgba(255,255,255,.75),0 6px 20px rgba(14,27,46,.05);
}
.tabs{
  background:rgba(255,255,255,.74);
  -webkit-backdrop-filter:blur(18px) saturate(1.7);
  backdrop-filter:blur(18px) saturate(1.7);
  box-shadow:0 -1px 0 rgba(255,255,255,.8),0 -6px 22px rgba(14,27,46,.06);
}
.bar{
  background:rgba(255,255,255,.80);
  -webkit-backdrop-filter:blur(18px) saturate(1.7);
  backdrop-filter:blur(18px) saturate(1.7);
  box-shadow:0 -6px 24px rgba(14,27,46,.10);
}

/* ---------- الشرايح والخانات ---------- */
.chip,.miniChip,.specol .colchip,.qty,.hgtIn,.stkin,
input[type=text],input[type=tel],input[type=number],input[type=password],
input[type=date],input[type=search],select,textarea,.fld textarea,.prow3 input{
  background:rgba(255,255,255,.66);
  border-color:rgba(255,255,255,.95);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 1px 2px rgba(14,27,46,.04);
}
.chip.on,.miniChip.on,.specol .colchip.on{
  background:linear-gradient(135deg,var(--brand-lt),#1050C8);
  border-color:transparent;color:#fff;
  box-shadow:0 3px 12px rgba(31,111,235,.30),inset 0 1px 0 rgba(255,255,255,.3);
}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px rgba(31,111,235,.16)}

/* ---------- الأزرار: عمق حقيقي ---------- */
.btn.brand,.bar .btn.brand,.step .n{
  background:linear-gradient(135deg,var(--brand-lt),#1050C8);color:#fff;
  box-shadow:0 4px 14px rgba(31,111,235,.30),inset 0 1px 0 rgba(255,255,255,.32);
}
.btn.wood{background:linear-gradient(135deg,var(--brand-lt),#1050C8);color:#fff;
  box-shadow:0 4px 14px rgba(31,111,235,.28),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.primary{background:linear-gradient(135deg,#17233A,#0B1424);color:#fff;
  box-shadow:0 4px 14px rgba(14,27,46,.26),inset 0 1px 0 rgba(255,255,255,.14)}
.btn.ghost{background:rgba(255,255,255,.66);border-color:rgba(255,255,255,.95);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.secnav button{background:rgba(255,255,255,.62);border-color:rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.secnav button.on{background:rgba(31,111,235,.10);border-color:var(--brand);
  box-shadow:0 0 0 1.5px var(--brand),0 4px 14px rgba(31,111,235,.16)}

/* ---------- الأبواب ---------- */
.door .leaf{background:rgba(255,255,255,.7);border-color:rgba(255,255,255,.95);
  box-shadow:var(--e2),inset 0 1px 0 rgba(255,255,255,.8)}
.door.on .leaf{border-color:var(--brand);box-shadow:0 6px 20px rgba(31,111,235,.26)}

/* ---------- الأيقونات: تبان أوضح على الزجاج ---------- */
.i{stroke-width:1.65}
.i.lg{stroke-width:1.6}
.tabs button .i{stroke-width:1.7}
.tabs button.on .i{filter:drop-shadow(0 2px 6px rgba(31,111,235,.35))}

/* ---------- أجهزة مش قادرة على الزجاج: سطح صلب مقروء ---------- */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .card,.ord,.sizeCard,.doorpanel,.rodbox,.accgrid .ac{background:#fff}
  .top,.tabs,.bar{background:#fff}
  .secnav button{background:#fff}
  .chip,.miniChip,.specol .colchip,.qty,.hgtIn,.stkin,
  input[type=text],input[type=tel],input[type=number],input[type=password],
  input[type=date],input[type=search],select,textarea,.fld textarea,.prow3 input{background:#fff}
  .door .leaf{background:#fff}
}


/* ============================================================
   v203 — «الشكل المدموج»: التلات اقتراحات في واحد
   ------------------------------------------------------------
   الشكل ١ كان نظيف بس مابيبانش. الشكل ٢ (الزجاج) بان بس السطح
   بس هو اللي اتغيّر. الشكل ٣ كان جسور في اللون والهوية.
   ده التلاتة مدموجين:

     • من ١: أبيض فاتح، أزرق واحد، مسافات مرتاحة، قراءة واضحة
             في نور الورشة (الأساس فاضل هو هو).
     • من ٢: أسطح زجاجية وظلال ملوّنة وأزرار ليها عمق (فاضلة).
     • من ٣: هوية جسورة — هيدر بتدرّج لون العلامة، تبويب سفلي
             بحبّة (pill) ملوّنة بدل خط تحتاني، وشريط لون على
             عنوان كل كارت، وأرقام أتقل.

   مفيش أي خطوة ولا زرار ولا مسار اتغيّر — الشكل بس.

   ⚠️ الهيدر بقى غامق، فكل حاجة جواه (العنوان، شريحة المخزن،
   زراير النسخة) متظبّطة هنا لوحدها — التوكنز مش بتوصلها.
   ============================================================ */

/* ---------- ١) الهيدر: هوية العلامة ---------- */
.top{
  background-color:#1668B8;
  background-image:linear-gradient(135deg,#2E7FF0 0%,var(--brand) 48%,#0B4FA8 100%);
  color:#fff;
  box-shadow:0 2px 14px rgba(11,79,168,.28);
  -webkit-backdrop-filter:none;backdrop-filter:none;
}
#appbar::after{height:0}
.top .t1{color:#fff;letter-spacing:.2px}
.top .t2{color:rgba(255,255,255,.82)}
.top .t2 .vs-ver{background:rgba(255,255,255,.18);color:#fff}
.top img.logo{border-color:rgba(255,255,255,.55);box-shadow:0 2px 10px rgba(4,32,72,.25)}
.wh-chip{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.34);color:rgba(255,255,255,.88)}
.wh-chip b{color:#fff}
.verstrip button{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.34);color:#fff}
.verstrip button.vs-install{
  background:#fff;border-color:transparent;color:#0B4FA8;
  box-shadow:0 2px 10px rgba(4,32,72,.22);
}

/* ---------- ٢) التبويب السفلي: حبّة ملوّنة ---------- */
.tabs button{border-bottom:0;border-radius:14px}
/* ⚠️ من غير margin رأسي — ارتفاع الشريط مربوط بـ--navh والشريط السفلي
   (الإجمالي) قاعد فوقه بالحساب ده. أي زيادة هنا بتعمل تداخل. */
.tabs button::before{border-radius:14px}
.tabs button.on::before{
  background:linear-gradient(135deg,rgba(46,127,240,.16),rgba(11,79,168,.10));
  box-shadow:inset 0 0 0 1.5px rgba(46,127,240,.42);
}
.tabs button.on{color:var(--brand);font-weight:800}
.tabs button.on .i{color:var(--brand)}

/* ---------- ٣) شريط لون على عنوان الكارت ---------- */
.card{position:relative;overflow:hidden}
.card>.step:first-child::after,
.card>h3:first-child::after{content:none}
.step .n{
  background:linear-gradient(135deg,#2E7FF0,#0B4FA8);
  box-shadow:0 3px 10px rgba(46,127,240,.32),inset 0 1px 0 rgba(255,255,255,.3);
}

/* ---------- ٤) مسافات مرتاحة (من الشكل ١) ---------- */
.wrap{padding:18px 16px 22px}
.card{padding:18px;border-radius:20px}

/* ---------- ٥) الأرقام أتقل — تتقري من بعيد ---------- */
.bar .sum b,.tot b{font-weight:800}

/* ---------- ٦) الشريط السفلي: زرار الإرسال واضح ---------- */
.bar .btn.brand{
  background:linear-gradient(135deg,#2E7FF0,#0B4FA8);
  box-shadow:0 5px 18px rgba(46,127,240,.34),inset 0 1px 0 rgba(255,255,255,.3);
  font-weight:800;
}

/* ---------- أجهزة مش قادرة على الزجاج ---------- */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .tabs{background:#fff}
}


/* ============================================================
   v207 — نايت مود / نهار مود
   ------------------------------------------------------------
   النهاري = الشكل الحالي زي ما هو. الليلي = كحلي عميق بلمسات
   زجاجية وإضاءة زرقاء وذهبي للتمييز (زي تصميم التطبيقات الجديدة).
   الاختيار بيتحفظ في localStorage (wpc_theme: light | dark) وبيتطبّق
   قبل أول رسم عشان مفيش وميض. مستندات PDF/الطباعة بيضا دايمًا.
   ============================================================ */

/* ---------- زرار التبديل (الاتنين) ---------- */
.verstrip button.vs-theme .i{width:17px;height:17px;margin:0}
.verstrip button.vs-theme .ic-sun{display:none}
html[data-theme="dark"] .verstrip button.vs-theme .ic-sun{display:block}
html[data-theme="dark"] .verstrip button.vs-theme .ic-moon{display:none}
@media (max-width:430px){ .wh-chip{padding-inline:8px} .wh-chip b{font-size:11.5px} }

/* ---------- لمسة عصرية للأيقونات في الاتنين: بلاط ملوّن ---------- */
.secnav button .i{
  width:38px;height:38px;padding:8px;border-radius:12px;margin:0 auto 6px;
  color:#fff;stroke-width:1.7;
  background:linear-gradient(135deg,#4B93FF,#1F6FEB);
  box-shadow:0 4px 12px rgba(31,111,235,.30);
}
.secnav button:nth-child(2) .i{background:linear-gradient(135deg,#F2B544,#D98A12);box-shadow:0 4px 12px rgba(217,138,18,.30)}
.secnav button:nth-child(3) .i{background:linear-gradient(135deg,#3DD6A0,#12996B);box-shadow:0 4px 12px rgba(18,153,107,.30)}
.secnav button:nth-child(4) .i{background:linear-gradient(135deg,#9B7BFF,#6A45E0);box-shadow:0 4px 12px rgba(106,69,224,.30)}
.secnav button:nth-child(5) .i{background:linear-gradient(135deg,#FF8A7A,#E2503F);box-shadow:0 4px 12px rgba(226,80,63,.28)}
.secnav button:nth-child(6) .i{background:linear-gradient(135deg,#34C9E8,#0E8FB0);box-shadow:0 4px 12px rgba(14,143,176,.28)}
.secnav button:nth-child(7) .i{background:linear-gradient(135deg,#FF8FC0,#D9468A);box-shadow:0 4px 12px rgba(217,70,138,.28)}
.secnav button.on .i{color:#fff}

/* ================== الوضع الليلي ================== */
html[data-theme="dark"]{color-scheme:dark}
html[data-theme="dark"]{
  --navy:#16233A; --navy-2:#0C1524;
  --brand:#3FA9F5; --brand-lt:#6FC1FA;

  --e1:0 1px 2px rgba(0,0,0,.35);

    radial-gradient(70% 40% at 50% 100%,rgba(0,170,200,.16),transparent 64%),

}

/* الأقسام والأبواب */

/* ---------- v207: تخطيط أحدث — شريط ترحيب + كروت أقسام بوصف ---------- */

/* كروت الأقسام: أيقونة جنب العنوان والوصف، عمودين */
.secnav{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.secnav button{display:grid;grid-template-columns:42px 1fr;grid-template-rows:auto auto;align-content:center;column-gap:10px;row-gap:1px;text-align:start;padding:11px 12px;min-width:0;max-width:none;flex:none;border-radius:18px}
.secnav button .i{margin:0;grid-row:1/3;grid-column:1;align-self:center;width:42px;height:42px;padding:9px}
.secnav button .tx{grid-column:2;grid-row:1;align-self:end}
.secnav button .sb{grid-column:2;grid-row:2;align-self:start}
.secnav button .tx{display:block;font-size:13.5px;font-weight:800;line-height:1.25;color:var(--ink)}
.secnav button .sb{display:block;font-size:10.5px;font-weight:600;color:var(--muted);margin-top:2px;line-height:1.3}
.secnav button>.tx,.secnav button>.sb{min-width:0}
.secnav button:last-child:nth-child(odd){grid-column:1/-1}
html[data-theme="dark"] .secnav button .tx{color:var(--ink)}
html[data-theme="dark"] .secnav button.on .tx{color:var(--brand-lt)}

/* ---------- ميعاد التسليم (شاشة المصنع) ---------- */
.grp-ord{flex-wrap:wrap}
.due{position:relative;display:inline-flex;align-items:center;gap:6px;flex:1 1 100%;min-width:0;
  padding:5px 10px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;line-height:1.4;
  border:1px solid var(--due-line,var(--line));background:var(--due-bg,transparent);color:var(--due-ink,var(--muted))}
.due .i{width:14px;height:14px;flex:none}
.due .de{font-weight:600;font-size:11px;opacity:.85;white-space:nowrap}
.due input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}



.dueov{position:fixed;inset:0;z-index:330;background:rgba(0,10,30,.88);display:flex;align-items:flex-start;justify-content:center;
  padding:14px;overflow-y:auto;overscroll-behavior:contain}
.dueov .box{width:100%;max-width:420px;background:#FFFFFF;border:1px solid var(--line);border-radius:16px;padding:14px;margin:auto 0}

.dueov .rw.col{flex-wrap:wrap}
