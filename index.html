<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تقارير القرشي</title>
<!-- xlsx-js-style = نفس SheetJS 0.18.5 بالظبط + دعم تنسيق الخلايا (ألوان/برواز/تجميد).
     القراءة والكتابة ما اتغيروش، اللي زاد هو خاصية s على الخلية. -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
:root{
  --blue:#1d4ed8; --blue-d:#173fb0; --bg:#f4f6fb; --panel:#ffffff; --panel2:#eef2fb;
  --border:#dbe3f3; --text:#1b2436; --muted:#6b7690; --danger:#dc2626; --ok:#16a34a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--bg:#10131c;--panel:#181c28;--panel2:#20263a;--border:#2b3350;--text:#e7ebf5;--muted:#8b93ac} }
:root[data-theme="dark"]{--bg:#10131c;--panel:#181c28;--panel2:#20263a;--border:#2b3350;--text:#e7ebf5;--muted:#8b93ac}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
/* 100vh على الموبايل بيحسب المساحة اللي تحت شريط المتصفح كمان، فآخر
   حاجة في الصفحة (شريط التصدير اللاصق) بتقع تحت الشريط ومش بتتشاف.
   100dvh بيحسب المساحة الظاهرة فعلاً. */
body{margin:0;font-family:Tahoma,Arial,sans-serif;font-size:15.5px;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;height:100dvh}
input,select,textarea,button{font-family:inherit}
header{background:var(--blue);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:relative;z-index:20}
header h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap;cursor:pointer}
header h1{min-width:0;flex:1 1 0;overflow:hidden;text-overflow:ellipsis}
header>span{flex:none}
@media (max-width:420px){ header .ver{display:none} header h1{font-size:15px} }
/* الموبايلات الضيقة: اللوجو بيقول الاسم، فالكلام بيستخبى عشان ☰ والأزرار يدخلوا */
@media (max-width:390px){ header h1 .ttl{display:none} }
header .ver{font-size:10px;opacity:.75}
/* القايمة = نفس شكل الكمبيوتر في كل الأجهزة: على الموبايل درج بيطلع من
   اليمين بزرار ☰، وعلى الكمبيوتر ثابتة جنب الشغل */
nav{display:flex;flex-direction:column;gap:2px;background:var(--panel);overflow-y:auto;overflow-x:hidden;
  position:fixed;top:0;bottom:0;right:0;width:min(84vw,300px);z-index:46;
  padding:calc(14px + env(safe-area-inset-top,0px)) 10px calc(20px + env(safe-area-inset-bottom,0px));
  border-left:1px solid var(--border);box-shadow:-8px 0 30px rgba(0,0,0,.18);
  transform:translateX(110%);transition:transform .22s ease;visibility:hidden}
body.menu-open nav{transform:none;visibility:visible}
.menu-bd{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:45;display:none}
body.menu-open .menu-bd{display:block}
.nav-head{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 10px;font-weight:800;font-size:15px}
.nav-head button{border:none;background:var(--panel2);color:var(--text);width:32px;height:32px;border-radius:10px;font-size:15px;cursor:pointer}
.nav-btn{width:100%;text-align:right;background:transparent;border:1px solid transparent;border-radius:12px;padding:11px 12px;
  font-size:14px;font-weight:800;color:var(--text);cursor:pointer;white-space:nowrap;transition:background .15s}
.nav-btn:hover{background:var(--panel2)}
.nav-btn.active{background:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(29,78,216,.25)}
.nav-search{display:block;width:100%;text-align:right;padding:11px 12px;margin-bottom:8px;border-radius:12px;border:1px solid var(--border);
  background:var(--panel2);color:var(--muted);font-size:13px;font-weight:700;cursor:pointer}
.nav-sub{display:block;text-align:right;padding:8px 12px 8px 8px;margin-right:14px;width:calc(100% - 14px);
  border:none;border-right:2px solid var(--border);background:transparent;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;border-radius:0 8px 8px 0}
.nav-sub:hover{color:var(--text);background:var(--panel2)}
.nav-sub.on{color:var(--blue);border-right-color:var(--blue);background:var(--panel2)}
#menuBtn{font-size:16px}
main{flex:1;overflow-y:auto;padding:10px}

/* ═══ مربعات الأرقام الملونة فوق كل قسم ═══ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:7px;margin-bottom:10px}
.stat{border-radius:13px;padding:9px 5px 8px;color:#fff;text-align:center;cursor:pointer;background:var(--c,#1e3a8a);
  box-shadow:0 3px 10px rgba(0,0,0,.10);min-width:0;transition:transform .12s}
.stat:active{transform:scale(.97)}
.stat b{display:block;font-size:16.5px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{display:block;font-size:10.5px;font-weight:700;opacity:.92;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ═══ البحث في كل التطبيق ═══ */
.srch-in{width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:15px}
.srch-in:focus{outline:none;border-color:var(--blue)}
.srch-h{font-size:11.5px;color:var(--muted);font-weight:800;margin:12px 2px 5px}
.srch-r{display:flex;align-items:center;gap:10px;padding:10px 11px;border:1px solid var(--border);border-radius:12px;
  background:var(--panel);margin-bottom:6px;cursor:pointer}
.srch-r:active{background:var(--panel2)}
.srch-r .ic{font-size:18px;width:26px;text-align:center;flex-shrink:0}
.srch-r .tx{flex:1;min-width:0}
.srch-r .t1{font-size:13.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srch-r .t2{font-size:11.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;width:28px;height:28px;font-size:14px;cursor:pointer}
/* ═══ الكمبيوتر: نفس شكل الموبايل — الأيقونات تحت والقايمة بتتفتح من زرار ☰ ═══ */
@media (min-width:1000px){
  body nav{width:min(380px,40vw)}
  body .overlay{justify-content:center;align-items:center}
  body .sheet{max-width:640px;border-radius:22px;max-height:84vh}
  body .homewrap{max-width:980px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .stat{padding:14px 10px}
  .stat b{font-size:22px}
  .stat span{font-size:12px}
}
/* ═══ الصفحة الرئيسية ═══ */
.homewrap{max-width:760px;margin:0 auto}
@media (min-width:900px){
  main{padding:16px max(16px, calc((100% - 1100px)/2))}
  .kpi b{font-size:20px}
  .kpi span{font-size:12px}
}
.hero{background:linear-gradient(135deg,var(--blue),#4f46e5);color:#fff;border-radius:18px;
  padding:16px 16px 18px;margin-bottom:12px;box-shadow:0 6px 18px rgba(29,78,216,.22)}
.hero .hi{font-size:13px;opacity:.85;font-weight:700}
.hero .big{font-size:21px;font-weight:800;margin-top:2px;letter-spacing:-.2px}
.hero .dt{font-size:12px;opacity:.8;margin-top:5px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpi{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:13px;
  padding:9px 6px;text-align:center;cursor:pointer}
.kpi b{display:block;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi span{display:block;font-size:10.5px;opacity:.9;margin-top:2px;font-weight:700}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 10px}
.rgrid .rtile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:68px;padding:8px 4px;white-space:normal;text-align:center;line-height:1.25;border-radius:12px;flex:none;width:auto}
.rgrid .rtile .ri{font-size:22px;line-height:1}
.rgrid .rtile .rn{font-size:12px;font-weight:800}
.htile{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--border);
  border-radius:15px;padding:11px 6px 10px;cursor:pointer;text-align:center;min-width:0;
  transition:transform .12s ease, box-shadow .12s ease}
.htile:active{transform:scale(.975)}
.htile::after{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--ac)}
.htile.wide{grid-column:1/-1}
.hico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:20px;background:color-mix(in srgb, var(--ac) 15%, transparent);margin:0 auto 6px}
@supports not (background: color-mix(in srgb, red 15%, transparent)){ .hico{background:var(--panel2)} }
.htile .nm{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htile .sb{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:2px;line-height:1.35;
  font-variant-numeric:tabular-nums}
.hsec{font-size:12px;color:var(--muted);font-weight:800;margin:14px 2px 7px}
.hnote{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);
  border-radius:13px;padding:10px 12px;margin-bottom:8px;font-size:12.5px;font-weight:700;cursor:pointer}
.hnote .dot{width:9px;height:9px;border-radius:50%;background:var(--ac);flex:0 0 auto}
.mod{display:none}
.mod.active{display:block}
/* ═══ شريط تبويبات موحّد في كل الشاشات ═══ */
.stabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.stabs::-webkit-scrollbar{display:none}
.stabs.grow>.stab{flex:1 1 0}
.stab{flex:0 0 auto;padding:10px 13px;border-radius:13px;border:1px solid var(--border);
  background:var(--panel);color:var(--muted);font-size:13px;font-weight:800;cursor:pointer;
  white-space:nowrap;transition:background .15s,color .15s,box-shadow .15s}
.stab:active{transform:scale(.97)}
.stab.on{background:var(--blue);border-color:var(--blue);color:#fff;
  box-shadow:0 4px 12px rgba(29,78,216,.28)}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.search{flex:1;padding:11px 13px;border-radius:13px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:11px 13px;margin-bottom:8px;
  display:flex;align-items:center;gap:8px}
.card .info{flex:1;min-width:0}
/* لوح عادي (مش صف) — .card نفسها flex فأي محتوى جواها بيتقسم أعمدة */
.panelbox{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:13px;margin-bottom:10px;display:block}
.card .name{font-weight:700;font-size:14px}
.card .sub{font-size:12px;color:var(--muted);margin-top:2px}
/* أول تلاتة فوق كل تقرير */
.mobar{margin-bottom:8px}
.morow{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px;align-items:center}
.mochip{border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:999px;
  padding:4px 9px;font-size:11.5px;font-weight:700;cursor:pointer;line-height:1.5}
.mochip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.mosep{font-size:11.5px;color:var(--muted);font-weight:700;margin-inline-start:6px}
.top3{display:flex;gap:6px;margin-bottom:8px}
.t3{flex:1 1 0;min-width:0;background:var(--panel);border:1px solid var(--border);border-top:3px solid var(--border);
  border-radius:11px;padding:7px 6px;text-align:center}
.t3:nth-child(1){border-top-color:#d4af37}
.t3:nth-child(2){border-top-color:#9aa3ad}
.t3:nth-child(3){border-top-color:#b0703a}
.t3m{font-size:17px;line-height:1}
.t3n{font-size:11.5px;font-weight:700;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t3v{font-size:13.5px;font-weight:800;margin-top:2px;color:var(--blue)}
.t3lbl{font-size:12px;color:var(--muted);font-weight:700;margin:2px 0 4px}
/* أعلى رقم في العمود أخضر وأقل رقم أحمر */
table.rep tr.qsub td{font-size:12px;color:var(--muted);background:var(--panel2);font-weight:700}
table.rep tr.dcexp td{background:var(--bg);padding:8px;white-space:normal;text-align:right}
.dclist{display:block}
.dcrow{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed var(--border)}
.dcrow:last-of-type{border-bottom:none}
.dcn{flex:1;min-width:0;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcrow input{width:78px;padding:6px 8px;border-radius:9px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);font-weight:700;font-size:12.5px;text-align:center}
.dcrow button{border:1px solid var(--border);background:var(--panel);border-radius:9px;
  width:32px;height:32px;font-size:13px;cursor:pointer;flex:0 0 auto}
.finlist{display:block}
.finrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 0;border-bottom:1px dashed var(--border)}
.finrow:last-child{border-bottom:none}
.finn{flex:1;min-width:0;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.finv{font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums;font-size:12.5px}
.finnote{font-size:11.5px;color:var(--muted);font-weight:700;padding:4px 0 7px;line-height:1.7}
.dcsave{width:100%;margin-top:8px;padding:9px;border-radius:11px;border:none;background:var(--blue);
  color:#fff;font-weight:800;font-size:12.5px;cursor:pointer}
table.rep td.hi{background:rgba(10,125,60,.18) !important}
table.rep td.lo{background:rgba(192,32,47,.16) !important}
.clsrow{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.clschip{border:1px solid var(--border);background:var(--panel2);color:var(--muted);border-radius:999px;
  padding:4px 8px;font-size:11.5px;font-weight:700;cursor:pointer;line-height:1.45}
.clschip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.clschip.pend{background:#e0a800;border-color:#e0a800;color:#231a00}
.act{display:flex;gap:6px}
.act button{border:none;background:var(--panel2);width:33px;height:33px;border-radius:10px;font-size:14px;cursor:pointer}
.act button:active{background:var(--border)}
.empty{text-align:center;color:var(--muted);padding:34px 16px;font-size:13.5px;font-weight:700;line-height:1.9;
  background:var(--panel);border:1px dashed var(--border);border-radius:16px}
.fbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);
  border-top:1px solid var(--border);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.fab{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;
  background:var(--blue);color:#fff;font-size:24px;border:none;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:25;cursor:pointer}
.rsbtn{position:fixed;left:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;
  background:var(--panel);color:var(--text);border:1px solid var(--border);font-size:21px;box-shadow:0 4px 14px rgba(0,0,0,.25);
  z-index:26;cursor:pointer;display:none}
.rspanel{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:45;background:var(--bg);
  border:1px solid var(--border);border-radius:14px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:none;gap:8px;align-items:center}
.rspanel input{flex:1;min-width:0;padding:10px 12px;border-radius:11px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:15px}
.rspanel span{font-size:12px;color:var(--muted);white-space:nowrap}
.rspanel button{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 12px;font-size:14px;cursor:pointer}
.impbar{display:flex;gap:8px;margin-bottom:10px}
.impbar label,.impbar button{flex:1;text-align:center;padding:11px 6px;border-radius:13px;font-size:12.5px;font-weight:800;
  background:var(--panel);border:1px solid var(--border);color:var(--text);cursor:pointer;transition:background .15s}
.impbar label:active,.impbar button:active{background:var(--panel2)}
.grp{border:1px solid var(--border);border-radius:15px;margin-bottom:9px;overflow:hidden;background:var(--panel)}
.grp-h{display:flex;align-items:center;justify-content:space-between;padding:13px;cursor:pointer;font-weight:800;font-size:13.5px}
.grp.open .grp-h{border-bottom:1px solid var(--border);background:var(--panel2)}
.grp-h .cnt{font-weight:400;color:var(--muted);font-size:12px}
.grp-h .arrow{transition:transform .2s;color:var(--muted)}
.grp.open .grp-h .arrow{transform:rotate(180deg)}
.grp-body{display:none;padding:9px 9px 3px;background:var(--bg)}
.grp.open .grp-body{display:block}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:50}
.overlay.show{display:flex}
.sheet{background:var(--panel);width:100%;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet::before{content:'';display:block;width:42px;height:4px;border-radius:99px;background:var(--border);margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font-size:15.5px;font-weight:800}
.f-row{margin-bottom:10px}
.f-row label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.f-row input,.f-row select{width:100%;padding:11px;border-radius:11px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:14px}
.f-row input:focus,.f-row select:focus,.search:focus{outline:none;border-color:var(--blue)}
.f-actions{display:flex;gap:8px;margin-top:14px}
.f-actions button{flex:1;padding:13px;border-radius:13px;border:none;font-size:14px;font-weight:800;cursor:pointer}
.btn-save{background:var(--blue);color:#fff}
.btn-cancel{background:var(--panel2);color:var(--text);border:1px solid var(--border) !important}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  background:#1b2436;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:60;opacity:0;transition:opacity .25s;
  pointer-events:none}  /* وهي مستخبية كانت بتاكل الضغطات اللي تحتها في نص الشاشة */
.toast.show{opacity:1}
.warn{background:#fff4e5;color:#8a5a00;border:1px solid #f0c36d;border-inline-start:4px solid #e8a33d;
  border-radius:13px;padding:11px 13px;font-size:12.5px;font-weight:700;line-height:1.75;margin-bottom:10px}
@media (prefers-color-scheme:dark){ .warn{background:#332a12;color:#f0c36d;border-color:#5a4a1f} }
.pill{display:inline-block;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:8px 13px;margin:0 6px 8px 0;font-size:12.5px;font-weight:700;cursor:pointer}
.pill.on{background:var(--blue);color:#fff;border-color:var(--blue)}
table.rep{width:100%;border-collapse:collapse;font-size:14.5px;font-weight:700;background:var(--panel);
  border-radius:14px;overflow:hidden;border:1px solid var(--border)}
table.rep th,table.rep td{padding:7px 5px;border-bottom:1px solid var(--border);text-align:center;
  white-space:nowrap;width:1%}
table.rep th{background:var(--panel2);font-size:13.5px;font-weight:800;color:var(--text)}
table.rep td:first-child,table.rep th:first-child{text-align:right;white-space:normal;width:auto}
table.rep.stk{width:max-content;min-width:100%;overflow:visible}

table.rep.bon td.plus{color:#16a34a;font-weight:800}table.rep.bon td.minus{color:#dc2626;font-weight:800}
table.rep.bon.stk td:first-child,table.rep.bon.stk th:first-child{width:26%}
table.rep.bon.stk td:first-child,table.rep.bon.stk th:first-child{min-width:0;max-width:none;width:34%}
.qs{display:flex;gap:10px;font-size:12px;align-items:center;flex-wrap:wrap}
.qs small{color:var(--muted)}
.grp-h>span:first-child{flex:1;min-width:0}
.grp-h{gap:8px}
.ddrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.dd{position:relative;min-width:0}
.dd summary,.dd .ddoff{list-style:none;cursor:pointer;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 26px 8px 10px;display:flex;flex-direction:column;gap:2px;position:relative}
.dd .ddoff{cursor:default;opacity:.7}
.dd summary::-webkit-details-marker{display:none}
.dd summary::after{content:'▾';position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.ddl{font-size:11px;color:var(--muted)}
.ddv{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddp{position:absolute;top:calc(100% + 4px);z-index:30;width:min(330px,88vw);max-height:52vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:6px}
.ddp label{display:flex;align-items:center;gap:8px;padding:10px 8px;font-size:13.5px;border-bottom:1px solid var(--border)}
.ddp label:last-child{border-bottom:none}
.ddp input[type=checkbox]{width:18px;height:18px;flex-shrink:0}
.ddact{display:flex;gap:6px;padding:2px 2px 8px;position:sticky;top:0;background:var(--panel);z-index:1}
.ddact button{flex:1;padding:7px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:12px;font-weight:700}

/* ═══════════ الشكل الجديد: لوحة تحكم داكنة ═══════════ */
:root{--gold:#fbbf24;--bn-h:0px;color-scheme:dark;
  --blue:#2563eb;--blue-d:#1d4ed8;--bg:#0a1020;--panel:#111a30;--panel2:#18233f;
  --border:#22314f;--text:#e8edf8;--muted:#8d9ab8;--ok:#22c55e;
  --body-bg:radial-gradient(900px 420px at 85% -8%,rgba(37,99,235,.28),transparent 62%),radial-gradient(700px 380px at 0% 105%,rgba(139,92,246,.14),transparent 60%),#0a1020;
  --hdr-bg:linear-gradient(180deg,#16265a,#0d1733);--nav-bg:linear-gradient(180deg,#0f1a36,#0b1329);
  --card-bg:linear-gradient(160deg,#18233f,#111a30);--bn-bg:rgba(10,16,32,.94);
  --th-bg:linear-gradient(180deg,#1d2c52,#16213f);--th-tx:#dbe6ff;--zebra:rgba(255,255,255,.03);
  --sheet-bg:linear-gradient(180deg,#14203d,#0f1830);--ov-bg:rgba(3,7,18,.62);
  --sec:#a9b6d6;--okt:#4ade80;--hit:#86efac;--lot:#fca5a5;--track:rgba(255,255,255,.07);--gold-tx:#fbbf24;--sb:#2b3b61}
/* ☀️ الوضع النهاري */
:root[data-theme="light"]{color-scheme:light;
  --blue:#1d4ed8;--blue-d:#173fb0;--bg:#f4f6fb;--panel:#ffffff;--panel2:#eef2fb;
  --border:#dbe3f3;--text:#1b2436;--muted:#6b7690;--ok:#16a34a;
  --body-bg:#f4f6fb;--hdr-bg:linear-gradient(180deg,#2150d6,#1a40b0);--nav-bg:#ffffff;
  --card-bg:#ffffff;--bn-bg:rgba(255,255,255,.96);
  --th-bg:#eaf0fc;--th-tx:#1b2436;--zebra:rgba(20,40,90,.035);
  --sheet-bg:#ffffff;--ov-bg:rgba(15,23,42,.45);
  --sec:#5b6784;--okt:#15803d;--hit:#166534;--lot:#b91c1c;--track:rgba(20,40,90,.09);--gold-tx:#b45309;--sb:#c3cde3}
:root[data-theme="light"] .htile,:root[data-theme="light"] .card,:root[data-theme="light"] .panelbox,
:root[data-theme="light"] .hchart,:root[data-theme="light"] .hqa button,:root[data-theme="light"] table.rep,
:root[data-theme="light"] .pill,:root[data-theme="light"] .hnote{box-shadow:0 3px 12px rgba(30,50,100,.10)}
:root[data-theme="light"] header{box-shadow:0 4px 16px rgba(30,50,100,.22)}
:root[data-theme="light"] #bnav{box-shadow:0 -4px 16px rgba(30,50,100,.10)}
body{background:var(--body-bg)}
header{background:var(--hdr-bg);border-bottom:1px solid var(--border);box-shadow:0 8px 26px rgba(0,0,0,.4)}
nav{background:var(--nav-bg)}
.nav-btn.active{background:linear-gradient(135deg,#2563eb,#4f46e5);box-shadow:0 4px 14px rgba(37,99,235,.4)}
.stat{box-shadow:0 8px 20px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.1)}
.hero{background:linear-gradient(135deg,#1e3a8a,#3730a3 58%,#5b21b6);border:1px solid rgba(255,255,255,.14);
  box-shadow:0 14px 34px rgba(37,99,235,.28)}
.kpi{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px)}
.kpi:nth-child(1) b{color:#4ade80}.kpi:nth-child(2) b{color:#fbbf24}.kpi:nth-child(3) b{color:#7dd3fc}
.htile{background:var(--card-bg);border-radius:16px;
  border-color:var(--border);border-color:color-mix(in srgb,var(--ac) 42%,var(--border));box-shadow:0 8px 22px rgba(0,0,0,.34)}
.hico{box-shadow:0 0 20px rgba(255,255,255,.06);box-shadow:0 0 22px color-mix(in srgb,var(--ac) 38%,transparent)}
.hnote{background:var(--card-bg)}
.card,.panelbox{background:var(--card-bg);box-shadow:0 4px 14px rgba(0,0,0,.26)}
.fab{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#241700;box-shadow:0 6px 18px rgba(245,158,11,.45)}
.toast{background:#1c2a4d;border:1px solid var(--border)}
input,select,textarea{color-scheme:dark}
/* اختصارات سريعة + رسم بياني في الرئيسية */
.hqa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 2px}
.hqa button{background:var(--card-bg);border:1px solid var(--border);color:var(--text);
  border-radius:14px;padding:10px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:11px;font-weight:800;box-shadow:0 5px 14px rgba(0,0,0,.28)}
.hqa button:active{transform:scale(.96)}
.hqa .i{font-size:20px;line-height:1}
.hchart{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;
  padding:12px 12px 8px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.hchart .hmeta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.hchart .hmeta b{font-size:18px;color:var(--okt);font-variant-numeric:tabular-nums}
.hchart .hmeta span{font-size:11px;color:var(--muted);font-weight:700}
.hlbl{direction:ltr;display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-weight:700;margin-top:4px}
/* شريط التنقل السفلي (الموبايل) */
#bnav{display:none}
@media all{
  :root{--bn-h:calc(66px + env(safe-area-inset-bottom,0px))}
  #bnav{justify-content:center}
  #bnav button{max-width:170px}
  #bnav{display:flex;position:fixed;left:0;right:0;bottom:0;height:var(--bn-h);padding-bottom:env(safe-area-inset-bottom,0px);
    z-index:31;background:var(--bn-bg);backdrop-filter:blur(14px);border-top:1px solid var(--border);
    box-shadow:0 -8px 24px rgba(0,0,0,.35)}
  #bnav button{flex:1;background:none;border:0;color:var(--muted);font-size:10.5px;font-weight:800;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;padding:6px 0;cursor:pointer;position:relative}
  #bnav button .i{font-size:21px;line-height:1}
  #bnav button.on{color:var(--gold-tx)}
  #bnav button.on .i{filter:drop-shadow(0 0 8px rgba(251,191,36,.65))}
  #bnav button.on::before{content:'';position:absolute;top:0;width:30px;height:3px;border-radius:0 0 4px 4px;background:var(--gold)}
  main{padding-bottom:calc(var(--bn-h) + 12px)}
  .fbar{bottom:var(--bn-h)}
  .fab{bottom:calc(var(--bn-h) + 14px)}
  .rsbtn{bottom:calc(var(--bn-h) + 82px)}
  .toast{bottom:calc(var(--bn-h) + 22px)}
}
@media print{#bnav{display:none !important}}

/* ═══════════ لمسات الشاشات الداخلية ═══════════ */
#syncPill{white-space:nowrap;max-width:104px;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
/* اختيار الوضع (ليلي / نهاري) */
.nav-theme{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.nav-theme button{padding:9px 6px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);color:var(--text);
  font-size:12.5px;font-weight:800;cursor:pointer}
.nav-theme button.on{background:linear-gradient(135deg,#2563eb,#4f46e5);border-color:#4f6ff0;color:#fff}
*{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:var(--sb);border-radius:99px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold) !important;box-shadow:0 0 0 3px rgba(251,191,36,.18)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}
button{-webkit-tap-highlight-color:transparent}
/* تبويبات وأزرار */
.pill{background:var(--card-bg);box-shadow:0 3px 10px rgba(0,0,0,.22);transition:transform .12s,background .15s}
.pill:active{transform:scale(.96)}
.pill.on{background:linear-gradient(135deg,#2563eb,#4f46e5);border-color:#4f6ff0;box-shadow:0 5px 16px rgba(37,99,235,.45)}
.btn-save{background:linear-gradient(135deg,#2563eb,#4f46e5);box-shadow:0 5px 16px rgba(37,99,235,.38)}
.btn-save:active,.btn-cancel:active{transform:scale(.97)}
/* الجداول */
table.rep{box-shadow:0 6px 20px rgba(0,0,0,.28)}
table.rep th{background:var(--th-bg);color:var(--th-tx);border-bottom:1px solid var(--border)}
table.rep tbody tr:nth-child(even) td{background-color:var(--zebra)}
table.rep tbody tr:hover td{background-color:rgba(37,99,235,.10)}
table.rep td.hi{background:rgba(34,197,94,.20) !important;color:var(--hit)}
table.rep td.lo{background:rgba(239,68,68,.18) !important;color:var(--lot)}
/* الكروت والنوافذ */
.card{transition:transform .12s,border-color .15s}
.card:active{transform:scale(.99)}
.overlay{backdrop-filter:blur(4px);background:var(--ov-bg)}
.sheet{background:var(--sheet-bg);border:1px solid var(--border);box-shadow:0 -12px 40px rgba(0,0,0,.5)}
.empty{border:1px dashed var(--border);border-radius:16px;background:rgba(255,255,255,.02)}
.hsec{color:var(--sec);display:flex;align-items:center;gap:8px}
.hsec::before{content:'';width:4px;height:13px;border-radius:3px;background:var(--gold)}

/* نواقص سريعة + نظرة المخازن */
.hbadge{background:#ef4444;color:#fff;border-radius:99px;font-size:10.5px;padding:1px 7px;font-weight:800}
.hmore{text-align:center;color:var(--gold-tx);font-size:12px;font-weight:800;padding:8px;cursor:pointer}
.wbar{display:grid;grid-template-columns:minmax(70px,26%) 1fr auto;align-items:center;gap:8px;padding:8px 2px;cursor:pointer;
  border-top:1px solid var(--border);font-size:12.5px;font-weight:800}
.wbar:first-of-type{border-top:0}
.wbar .wn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbar .wt{height:9px;border-radius:99px;background:var(--track);overflow:hidden;display:block}
.wbar .wt i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2563eb,#38bdf8)}
.wbar b{font-variant-numeric:tabular-nums;min-width:28px;text-align:left}
.wbar em{grid-column:2/4;font-style:normal;color:var(--lot);font-size:11px;margin-top:-4px}

/* بونص الموزعين */
.dbcard{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:12px;margin-bottom:12px;overflow:hidden}
.dbhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.dbshow{font-size:12px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
table.dbt td label{display:flex;align-items:center;gap:6px;white-space:normal;font-weight:800;cursor:pointer}
table.dbt tr.off td{opacity:.45}
table.dbt td{vertical-align:middle}
.dbn,.dbr{padding:6px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-weight:700;text-align:center;font-size:13px}
.dbn{width:100%;min-width:84px}.dbr{width:58px}
.dbed{font-size:10.5px;color:var(--gold-tx);cursor:pointer;margin-top:2px;font-weight:800}
.dbtot{display:flex;gap:8px;margin-top:10px}
.dbtot span{flex:1;background:var(--panel2);border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--muted);font-weight:800}
.dbtot b{display:block;font-size:17px;color:var(--text);font-variant-numeric:tabular-nums;margin-top:2px}
.dbtot span.dbok b{color:var(--okt)}
.dbcard{border-top:5px solid var(--dc,var(--border))}
.dbcard table.dbt th{background:var(--dc);color:#fff;border-color:var(--dc)}
.dbcard .dbhead>div>div:first-child{color:var(--dc)}
.dbn.dba{min-width:78px}
.dbd.pos{color:#16a34a}.dbd.neg{color:#dc2626}
.dbpick{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 2px;border-top:1px solid var(--border);font-size:13.5px;font-weight:800}
.dbpick:first-of-type{border-top:0}
.dbpick label{display:flex;align-items:center;gap:8px;cursor:pointer}
.dbpick b{font-variant-numeric:tabular-nums;color:var(--okt)}

function cleanOldAppStorage(){
  let n = 0, bytes = 0;
  try{
    for(const k of Object.keys(localStorage)){
      if(!isOldAppKey(k)) continue;
      bytes += lsBytes(k); localStorage.removeItem(k); n++;
    }
  }catch(e){}
  return {n, bytes};
}

function pruneBackups(keepNewest){
  const bks = [];
  try{ for(const k of Object.keys(localStorage)) if(k.indexOf('_backup_') === 0) bks.push(k); }catch(e){}
  bks.sort();
  let n = 0;
  for(const k of bks.slice(0, Math.max(0, bks.length - (keepNewest||0)))){
    try{ localStorage.removeItem(k); n++; }catch(e){}
  }
  return n;
}
function save(k,v){
  const str = JSON.stringify(v);
  try{ localStorage.setItem(k, str); }
  catch(e){
    // المساحة اتملت — ننضف اللي مش لازم ونعيد المحاولة قبل ما نفشّل
    const freed = cleanOldAppStorage();
    let saved = false;
    try{ localStorage.setItem(k, str); saved = true; }catch(e2){}
    if(!saved){ pruneBackups(2); try{ localStorage.setItem(k, str); saved = true; }catch(e3){} }
    if(!saved){
      toast('مساحة المتصفح اتملت — افتح ⚙️ ودوس «نضّف مساحة الجهاز»');
    } else if(freed.n){

function secGroupItems(key){
  const isMG = items.some(i=> i.mainGroup===key);
  const match = it=> key==='غير معروف' ? !it
    : !!it && (isMG ? it.mainGroup===key : (SECTOR_MAP[it.mainGroup]||'أخرى')===key);
  const agg={}, mos=[], noDetail=[];
  salesMonths().forEach(mo=>{
    const has = Object.values(monthlySector[mo]||{}).some(o=> o && key in o);
    if(!has) return;

      if(!match(itemFind(n))) return;

/* مهم: من غير مهلة زمنية، أي طلب بيعلّق بيخلّي المزامنة واقفة على «بيزامن...»
   للأبد ومش بتشتغل تاني أبدًا. المهلة بتكبر مع حجم اللي بنبعته. */
async function syncApi(payload, isGet){
  const c = syncCfg();
  const url = c.url + (isGet ? ('?' + new URLSearchParams(Object.assign({token:c.token}, payload))) : '');
  const body = isGet ? '' : JSON.stringify(Object.assign({token:c.token}, payload));
  const opt = isGet ? {} : {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body};
  const timeoutMs = Math.min(240000, 45000 + Math.round(body.length / 1024) * 60);
  let last;
  for(let a = 0; a < 3; a++){                 // الشبكة بتقطع — بنعيد المحاولة
    if(navigator.onLine === false) throw new Error('مفيش نت');
    const ctrl = new AbortController();
    const timer = setTimeout(()=> ctrl.abort(), timeoutMs);
    try{
      const r = await fetch(url, Object.assign({signal: ctrl.signal}, opt));
      if(r.status === 404) throw new Error('HTTP 404 — رابط السكربت مش شغال أو النشر اتغيّر');
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      // «unknown action» = الـPOST اتحوّل GET وضاع جسمه · «busy» = كتابة شغّالة
      if(d && d.ok === false && /unknown action|busy/i.test(d.error || '')) throw new Error(d.error);
      return d;
    }catch(e){
      last = (e && e.name === 'AbortError')
        ? new Error('الطلب عدّى ' + Math.round(timeoutMs/1000) + ' ثانية من غير رد')
        : e;
      if(a < 2) await new Promise(z=> setTimeout(z, 800 * (a + 1)));
    }finally{ clearTimeout(timer); }
  }
  throw last;
}

   قبل كده لو الجهازين لمسوا نفس الملف (whShortage مثلاً) كانت المزامنة تقول
   «تعارض» وتاخد الأحدث كله وتحط التاني نسخة احتياطية — حتى لو كل واحد كان
   بيكتب في صنف مختلف خالص. فكنت تشوف تنبيه كل شوية وانت شغال، وممكن اللي
   كتبته يختفي.
   دلوقتي بنحتفظ بلقطة من آخر نسخة اتزامنت (الأساس)، وبنقارن بند ببند:
     • أنا بس اللي غيّرت البند  → بتاعي يفضل
     • هو بس اللي غيّر البند    → بتاعه ياخد مكانه
     • البند اتشال من ناحية     → يتشال
     • الاتنين غيّروا نفس البند → الأحدث يكسب (وده التعارض الحقيقي الوحيد)
   يعني اتنين بيكتبوا في أصناف مختلفة مابيتعارضوش أصلاً. */
const isPlainObj = v=> v && typeof v === 'object' && !Array.isArray(v);
const sameVal = (a,b)=> JSON.stringify(a === undefined ? null : a) === JSON.stringify(b === undefined ? null : b);
// مصفوفة كائنات ليها id — بنتعامل معاها كخريطة بالـid
const isIdArray = v=> Array.isArray(v) && v.length && v.every(x=> isPlainObj(x) && x.id !== undefined);

function merge3(mine, theirs, base, mineWins){
  if(sameVal(mine, theirs)) return {val: mine, clash: false};
  if(sameVal(mine, base))   return {val: theirs, clash: false};   // هو بس اللي غيّر
  if(sameVal(theirs, base)) return {val: mine,   clash: false};   // أنا بس اللي غيّرت

  if(isPlainObj(mine) && isPlainObj(theirs)){
    const b = isPlainObj(base) ? base : {};
    const out = {}; let clash = false;
    for(const k of new Set([...Object.keys(mine), ...Object.keys(theirs), ...Object.keys(b)])){
      const hm = Object.prototype.hasOwnProperty.call(mine, k);
      const ht = Object.prototype.hasOwnProperty.call(theirs, k);
      const hb = Object.prototype.hasOwnProperty.call(b, k);
      if(!hm && !ht) continue;                               // اتشال من الاتنين
      if(hb && !hm && sameVal(theirs[k], b[k])) continue;     // أنا شيلته وهو ما لمسوش
      if(hb && !ht && sameVal(mine[k], b[k])) continue;       // هو شاله وأنا ما لمستوش
      if(!hm){ out[k] = theirs[k]; continue; }
      if(!ht){ out[k] = mine[k]; continue; }
      const r = merge3(mine[k], theirs[k], hb ? b[k] : undefined, mineWins);
      out[k] = r.val; clash = clash || r.clash;
    }
    return {val: out, clash};
  }
  if(isIdArray(mine) && isIdArray(theirs)){
    const toMap = a=>{ const m = {}; (a||[]).forEach(x=>{ if(isPlainObj(x) && x.id !== undefined) m[x.id] = x; }); return m; };
    const r = merge3(toMap(mine), toMap(theirs), isIdArray(base) ? toMap(base) : {}, mineWins);
    const order = [], seen = new Set();
    [...mine, ...theirs].forEach(x=>{ const id = x && x.id;
      if(id !== undefined && !seen.has(String(id)) && r.val[id]){ seen.add(String(id)); order.push(r.val[id]); } });
    return {val: order, clash: r.clash};
  }
  if(Array.isArray(mine) && Array.isArray(theirs) && !isIdArray(mine) && !isIdArray(theirs)){
    const bs = Array.isArray(base) ? base : [];
    const out = [...mine];
    theirs.forEach(x=>{ if(!out.some(y=> sameVal(x,y)) && !bs.some(y=> sameVal(x,y))) out.push(x); });
    return {val: out.filter(x=> theirs.some(y=>sameVal(x,y)) || !bs.some(y=>sameVal(x,y)) || mine.some(y=>sameVal(x,y))), clash:false};
  }
  return {val: mineWins ? mine : theirs, clash: true};        // قيمتين مختلفتين في نفس البند
}

    /* السيرفر (Apps Script) بطيء: كل طلب من ٤ لـ١٤ ثانية. يعني مزامنة ٨ حاجات
       ممكن تاخد دقيقتين. والموبايل بيوقف الطلبات أول ما الشاشة تتقفل — فلو
       الشغل كله متسجّل في الآخر بس، أي قطع في النص كان بيضيّع المجهود كله
       وتفضل «مستني يترفع» للأبد. دلوقتي كل حاجة بتتسجّل أول ما تخلص. */
    const saveProgress = ()=>{ save('_syncRevs_', syncRevs); save('_syncPulled_', syncPulled); };
    const todo = SYNC_KEYS.filter(k=>{
      const mine = syncRevs[k] || 0, theirs = idx[k] || 0, base = syncPulled[k] || 0;
      return mine > base || theirs > base;
    });
    let doneN = 0;
    for(const k of todo){
      const mine = syncRevs[k] || 0, theirs = idx[k] || 0, base = syncPulled[k] || 0;
      const iChanged = mine > base, theyChanged = theirs > base;
      // بنكتب من غير save() عشان ما يبقاش «تعديل جديد» يترفع تاني
      const setLocal = (val)=>{
        try{ localStorage.setItem(k, JSON.stringify(val)); }catch(e){}
        if(SYNC_VARS[k]) SYNC_VARS[k](val);
        writeBase(k, val);                    // لقطة الأساس للدمج الجاي
      };
      const getServer = async ()=>{
        const r = await syncApi({action:'get', key:SYNC_PREFIX + k}, true);
        if(!r || !r.ok) return undefined;
        const v = JSON.parse(r.value || 'null');
        return v === null ? undefined : v;
      };
      const pull = async ()=>{
        const val = await getServer();
        if(val === undefined) return false;
        setLocal(val);
        syncRevs[k] = theirs; syncPulled[k] = theirs; down.push(k);
        saveProgress();
        return true;
      };
      const pushVal = async (val, rev)=>{
        await syncApi({action:'set', key:SYNC_PREFIX + k, value: JSON.stringify(val)});
        idx[k] = rev;
        /* الفهرس بيتكتب بعد كل حاجة مش في الآخر. لو اتكتبت القيمة والفهرس لأ،
           الأجهزة التانية عمرها ما هتعرف إنها موجودة، وإحنا هنعتبرها مرفوعة
           وما نرفعهاش تاني — يعني تضيع على السيرفر من غير ما حد يشوفها. */
        await syncApi({action:'set', key:SYNC_INDEX, value: JSON.stringify(idx)});
        syncPulled[k] = rev; up.push(k);
        saveProgress();
      };
      syncStatus('☁️ ' + (++doneN) + '/' + todo.length);
      if(iChanged && !theyChanged){ const v = load(k, null); await pushVal(v, mine); writeBase(k, v); }
      else if(!iChanged && theyChanged) await pull();
      else {
        /* الاتنين لمسوا الملف — بنقارن بند ببند بدل ما ناخد ملف ونرمي التاني.
           في الغالب كل واحد كان في صنف مختلف، فالنتيجة دمج نضيف من غير تنبيه. */
        const srv = await getServer();
        const me = load(k, null);
        if(srv === undefined){ await pushVal(me, mine); writeBase(k, me); }
        else {
          const r = merge3(me, srv, readBase(k), mine >= theirs);
          const rev = Math.max(mine, theirs) + 1;
          if(r.clash){ save('_backup_' + k + '_' + mine, me); clash.push(k); }
          setLocal(r.val);
          syncRevs[k] = rev;
          await pushVal(r.val, rev);
          merged.push(k);
        }
      }
    }
    saveProgress();
    save('_syncAt_', Date.now()); save('_syncErr_', '');
    syncStatus('☁️ ' + new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}), 'ok');
    if(down.length || merged.length) syncRender();
    if(!quiet || down.length || up.length || clash.length){
      toast(`مزامنة: نزّل ${down.length} · رفع ${up.length}` + (merged.length ? ` · دمج ${merged.length}` : ''));
    }
    /* من غير alert: كان بيقطع عليك الكتابة في نص الشغل. التعارض الحقيقي بقى
       نادر أصلاً بعد الدمج بند ببند، وبيتسجّل في ⚙️ لو حبيت تراجعه. */
    if(clash.length){
      save('_lastClash_', {at: Date.now(), keys: clash});
      toast('اتدمج الشغل من الجهازين · ' + clash.length + ' بند اتاخد الأحدث فيه');
    }
  }catch(e){
    syncStatus('☁️ مش متزامن', 'err');
    save('_syncErr_', (e && e.message) || String(e));
    if(!quiet) toast('المزامنة فشلت: ' + ((e && e.message) || ''));
  }finally{
    clearTimeout(guard);
    syncBusy = false;
    if(syncAgain){ syncAgain = false; setTimeout(()=> syncNow(true), 300); }
  }
}
/* لو جهاز فيه الشغل الصح والباقي فاضي (أو العكس)، ده بيحسمها بضغطة:
   بنختم كل مفتاح فيه بيانات بالوقت الحالي، فيكسب أي مقارنة ويترفع كله. */
async function syncPushAll(){
  const keys = SYNC_KEYS.filter(syncHasData);
  if(!keys.length){ toast('مفيش بيانات على الجهاز ده ترفعها'); return; }
  if(!confirm('هيترفع كل اللي على الجهاز ده (' + keys.length + ' نوع بيانات) '
    + 'ويتحط مكان اللي على السيرفر.\nاستعمله لو الجهاز ده هو اللي عليه الشغل الصح. متأكد؟')) return;
  const now = Date.now();
  keys.forEach((k, i)=>{ syncRevs[k] = now + i; });
  save('_syncRevs_', syncRevs);
  closeSheet();
  await syncNow(false);
}

async function syncPullAll(){

}

/* اختبار اتصال خطوة بخطوة — بيقول بالظبط فين الوقفة بدل «بيزامن...» على طول */
async function testSyncConn(){
  const box = $('#connMsg'); const c = syncCfg();
  if(!c.url){ box.innerHTML = '<b style="color:var(--danger)">المزامنة مقفولة.</b>'; return; }
  const lines = []; const show = ()=> box.textContent = lines.join('\n');
  const step = async (name, fn)=>{
    lines.push('⏳ ' + name + '...'); show();
    const t = Date.now();
    try{ const r = await fn(); lines[lines.length-1] = '✅ ' + name + ' — ' + ((Date.now()-t)/1000).toFixed(1) + 'ث' + (r? ' · ' + r : ''); show(); return true; }
    catch(e){ lines[lines.length-1] = '❌ ' + name + ' — ' + ((e && e.message) || e); show(); return false; }
  };
  const tk = '__conntest__' + Date.now();
  if(!await step('قراءة من السيرفر (GET)', async ()=>{
      const r = await syncApi({action:'list', prefix:SYNC_PREFIX}, true);
      const ks = (r && r.keys) || []; return 'عدد مفاتيح النسخة الجديدة: ' + ks.length; })) return;
  if(!await step('كتابة على السيرفر (POST)', async ()=>{
      const r = await syncApi({action:'set', key:tk, value:'1'});
      if(!r || r.ok !== true) throw new Error((r && r.error) || 'رد غير متوقع'); return 'اتكتب'; })) return;
  await step('قراءة اللي اتكتب', async ()=>{
      const r = await syncApi({action:'get', key:tk}, true);
      if(!r || r.value !== '1') throw new Error((r && r.error) || 'القيمة رجعت غلط'); return 'رجعت صح'; });
  await step('تنضيف', async ()=>{ await syncApi({action:'delete', key:tk}); return 'اتمسح'; });
  const pend = SYNC_KEYS.filter(k=> (syncRevs[k]||0) > (syncPulled[k]||0));
  lines.push('', 'مستني يترفع من الجهاز ده: ' + pend.length + (pend.length? ' (' + pend.join('، ') + ')' : ''));
  show();
}
function doCleanStorage(){
  const before = lsTotal();
  const r = cleanOldAppStorage();
  const nb = pruneBackups(2);
  const freed = before - lsTotal();
  toast(freed ? ('اتفضى ' + fmtKB(freed)) : 'المساحة نضيفة خلاص');
  closeSheet(); setTimeout(openSyncSheet, 300);
}
async function wipeOldServerData(){
  const box = $('#wipeMsg'); if(!syncCfg().url){ toast('اظبط الرابط الأول'); return; }
  box.innerHTML = 'بيقرا مفاتيح السيرفر...';
  try{
    const r = await syncApi({action:'list', prefix:''}, true);
    const all = (r && (r.keys || r.value)) || [];
    const keys = (Array.isArray(all) ? all : JSON.parse(all || '[]'))
      .filter(k=> String(k).indexOf(SYNC_PREFIX) !== 0);
    if(!keys.length){ box.innerHTML = '<b style="color:var(--ok)">السيرفر نضيف — مفيش بيانات قديمة.</b>'; return; }
    if(!confirm('هيتمسح ' + keys.length + ' مفتاح من بيانات التطبيق القديم نهائيًا:\n'
      + keys.slice(0,12).join('، ') + (keys.length>12?' …':'') + '\n\nمتأكد؟')) { box.innerHTML=''; return; }
    let n = 0;
    for(const k of keys){
      box.innerHTML = `بيمسح ${n+1} من ${keys.length}...`;
      try{ await syncApi({action:'delete', key:k}); n++; }catch(e){}
    }
    box.innerHTML = `<b style="color:var(--ok)">اتمسح ${n} من ${keys.length}.</b>`;
  }catch(e){ box.innerHTML = '<b style="color:var(--danger)">فشل: ' + esc(e.message || '') + '</b>'; }
}

   في أكواد جيفز بيفتح بياناته (الكود/القطع/الوزن/السعر) للتعديل بدل ما يتكرر. */
function gvItemFind(){
  const box=document.getElementById('g_find_res'), inp=document.getElementById('g_find'); if(!box||!inp) return;
  const words=ordNorm(inp.value).split(/\s+/).filter(Boolean);
  if(!words.length){ box.innerHTML=''; return; }
  const hit=items.filter(i=>{ const t=ordNorm([i.name,i.mainGroup,i.subGroup,i.baseName,i.color].join(' ')); return words.every(w=>t.includes(w)); }).slice(0,8);
  box.innerHTML = hit.length? hit.map(i=>{
    const ex=gvcodes.some(g=>ordNorm(g.name)===ordNorm(i.name));
    return `<div class="card" style="cursor:pointer" onclick="gvPickItem('${i.id}')"><div class="info"><div class="name" style="font-size:13px">${esc(i.name)}</div>
      <div class="sub">${esc(i.mainGroup||'—')}${i.color?' · '+esc(i.color):''}${ex?' · <span style="color:var(--ok)">✔ متضاف في أكواد جيفز</span>':''}</div></div></div>`;
  }).join('') : `<div class="empty" style="padding:8px">مفيش صنف بالاسم ده في الأصناف — اكتب الاسم يدوي تحت</div>`;
}
function gvPickItem(itemId){

function importGvCodes(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      // شيت باسم تاني (أو اتغيّر اسمه) كان بيوقّع الاستيراد بـ«خطأ في الملف» — بناخد أول شيت
      const rows=XLSX.utils.sheet_to_json(wb.Sheets['اكواد جيفز']||wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      let list=[];
      for(let i=1;i<rows.length;i++){ const r2=rows[i]; if(!r2[0]) continue;
        list.push({id:uid(), name:String(r2[0]).trim(), code:String(r2[1]||'').trim(),
          perCarton:r2[2]||'', weight:r2[3]||'', price:r2[4]||''}); }
      if(!list.length){ toast('لا توجد بيانات'); return; }
      pendingImport={type:'gvcodes', list};
      openSheet(`<h3>تأكيد الاستيراد</h3><p style="font-size:13.5px;color:var(--muted)">
        ${list.length} كود جيفز — هيتم استبدال القائمة الحالية.</p>
        <div class="f-actions"><button class="btn-cancel" onclick="closeSheet()">إلغاء</button>
        <button class="btn-save" onclick="commitImport()">💾 حفظ</button></div>`);
    }catch(err){ toast('خطأ في الملف'); }
  };
  r.readAsArrayBuffer(file);
}
function toggleGroup(g){ if(openGroups.has(g)) openGroups.delete(g); else openGroups.add(g); render(); }
function importItems(file){

      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets['data']||wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});

          subGroup:String(r2[2]||'').trim(), rollQty:r2[3]||'', baseName:String(r2[4]||'').trim(),
          color:String(r2[5]||'').trim(), unit:String(r2[6]||'').trim()}); }

}

function editWarehouse(id){
  const w = id? warehouses.find(x=>x.id===id) : {id:'', name:'', location:'', type:'مخزن رئيسي'};
  openSheet(`<h3>${id?'تعديل مخزن':'إضافة مخزن'}</h3>

    <div class="f-actions"><button class="btn-cancel" onclick="closeSheet()">إلغاء</button><button class="btn-save" onclick="saveWarehouse('${id}')">حفظ</button></div>`);

function saveWarehouse(id){
  const name=$('#w_name').value.trim(); if(!name){ toast('اكتب اسم المخزن'); return; }
  const obj={id:id||uid(), name, location:$('#w_location').value.trim(), type:'مخزن رئيسي'};
  if(id){ const i=warehouses.findIndex(x=>x.id===id); warehouses[i]=obj; } else warehouses.unshift(obj);
  save('warehouses_v1',warehouses); closeSheet(); render(); toast('تم الحفظ');
}
function delWarehouse(id){
  const w=warehouses.find(x=>x.id===id);
  if(!w) return;
  if(!confirm('حذف مخزن «'+w.name+'»؟\nهيتنقل لسلة المحذوفات وتقدر ترجّعه من ♻️ (بأرصدته ونواقصه وجرده).')) return;
  // نسخة كاملة من المخزن قبل الحذف عشان الاسترجاع يرجّع كل حاجة
  whTrash.unshift({tid:uid(), at:new Date().toISOString(), wh:w,
    stock:whStock[id]||null, shortage:whShortage[id]||null,
    inv:invCounts[id]||null, draft:(typeof invDraft!=='undefined' && invDraft[id])||null});
  whTrash=whTrash.slice(0,30);
  save('whTrash_v1',whTrash);
  warehouses=warehouses.filter(x=>x.id!==id);
  delete whStock[id]; delete whShortage[id];
  delete invCounts[id]; save('invCounts_v1',invCounts);
  save('warehouses_v1',warehouses); save('whStock_v1',whStock); save('whShortage_v1',whShortage);
  if(load('_whTab_',null)===id) save('_whTab_',null);
  render(); toast('اتحذف — ممكن ترجّعه من ♻️');
}
/* استرجاع مخزن: من السلة، أو من نسخ احتياطية قديمة على الجهاز (لو فيه) */
function whBackupCands(){
  const out=[]; let keys=[]; try{ keys=Object.keys(localStorage); }catch(e){}
  keys.filter(k=>k.indexOf('_backup_warehouses_v1')===0).forEach(k=>{
    let arr; try{ arr=JSON.parse(localStorage.getItem(k)); }catch(e){ return; }
    if(!Array.isArray(arr)) return;
    const suf=k.slice('_backup_warehouses_v1'.length), rd=n=>{ try{ return (JSON.parse(localStorage.getItem('_backup_'+n+suf))||{}); }catch(e){ return {}; } };
    const st=rd('whStock_v1'), sh=rd('whShortage_v1'), iv=rd('invCounts_v1');
    arr.forEach(w=>{ if(w && w.id && w.name && !warehouses.some(x=>x.id===w.id) && !out.some(o=>o.wh.id===w.id))
      out.push({tid:'bk:'+k+':'+w.id, bk:true, wh:w, stock:st[w.id]||null, shortage:sh[w.id]||null, inv:iv[w.id]||null}); });
  });
  return out;
}
function whRestoreSheet(){
  const all=[...whTrash.map(t=>Object.assign({},t)), ...whBackupCands()];
  const rows=all.map(t=>{
    const n=Object.keys(t.stock||{}).length, d=t.at? new Date(t.at).toLocaleString('ar-EG') : 'نسخة احتياطية قديمة';
    return `<div style="display:flex;align-items:center;gap:8px;padding:10px 4px;border-top:1px solid var(--border)">
      <div style="flex:1;min-width:0"><b>🏭 ${esc(t.wh.name)}</b>
        <div style="font-size:11.5px;color:var(--muted)">${n? n+' صنف رصيد · ' : ''}<bdi>${esc(d)}</bdi></div></div>
      <button class="btn-save" style="flex:none;padding:8px 14px" onclick="whRestore(${jsArg(t.tid)})">♻️ رجّعه</button></div>`; }).join('');
  openSheet(`<h3>♻️ استرجاع مخزن</h3>`
    + (rows || `<div class="empty">مفيش مخازن محذوفة في السلة.<br><small style="color:var(--muted)">أي مخزن تحذفه من دلوقتي هيتحفظ هنا. ولو المخزن اتحذف قبل التحديث ده، ضيفه بـ ➕ وارفع شيت الأرصدة تاني.</small></div>`)
    + `<div class="f-actions"><button class="btn-cancel" onclick="closeSheet()">إغلاق</button></div>`);
}
function whRestore(tid){
  const t = tid.indexOf('bk:')===0 ? whBackupCands().find(x=>x.tid===tid) : whTrash.find(x=>x.tid===tid);
  if(!t) return toast('مش لاقي النسخة دي');
  const w=t.wh;
  if(!warehouses.some(x=>x.id===w.id)) warehouses.push(w);
  if(t.stock){ whStock[w.id]=t.stock; save('whStock_v1',whStock); }
  if(t.shortage){ whShortage[w.id]=t.shortage; save('whShortage_v1',whShortage); }
  if(t.inv){ invCounts[w.id]=t.inv; save('invCounts_v1',invCounts); }
  if(t.draft && typeof invDraft!=='undefined'){ invDraft[w.id]=t.draft; save('invDraft_v1',invDraft); }
  save('warehouses_v1',warehouses);
  if(tid.indexOf('bk:')!==0){ whTrash=whTrash.filter(x=>x.tid!==tid); save('whTrash_v1',whTrash); }
  closeSheet(); render(true); toast('اتسترجع مخزن «'+w.name+'»');
}

/* مخازن متكررة بنفس الاسم: بندمجها في واحد — الأرصدة والنواقص
   والجرد بيتنقلوا، والباقي بيتشال. */
function dupWarehouses(){
  const by={}; warehouses.forEach(w=>{ const k=String(w.name||'').trim(); (by[k]=by[k]||[]).push(w); });
  return Object.keys(by).filter(k=> by[k].length>1).map(k=>({name:k, list:by[k]}));
}
function mergeDupWarehouse(name){
  const g=dupWarehouses().find(x=>x.name===name); if(!g) return;
  const keep=g.list[0], rest=g.list.slice(1);
  if(!confirm('دمج '+g.list.length+' مخازن باسم «'+name+'» في واحد؟')) return;
  rest.forEach(w=>{
    Object.entries(whStock[w.id]||{}).forEach(([n,v])=>{
      whStock[keep.id]=whStock[keep.id]||{};
      if(whStock[keep.id][n]===undefined) whStock[keep.id][n]=v;   // اللي فوق في القايمة يكسب مش يتجمع
    });
    // سطر نواقص فاضي (اتفتح من غير كمية) ما يغطّيش على سطر فيه كمية في المخزن التاني
    const hasQ = r=> r && (nz(r.q1)||nz(r.q2)||nz(r.cartons)||nz(r.pieces)||nz(r.order));
    Object.entries(whShortage[w.id]||{}).forEach(([n,v])=>{
      whShortage[keep.id]=whShortage[keep.id]||{};
      const cur=whShortage[keep.id][n];
      if(cur===undefined || (!hasQ(cur) && hasQ(v))) whShortage[keep.id][n]=v;
    });
    Object.entries(invCounts[w.id]||{}).forEach(([n,v])=>{
      invCounts[keep.id]=invCounts[keep.id]||{};
      if(invCounts[keep.id][n]===undefined) invCounts[keep.id][n]=v;
    });
    delete whStock[w.id]; delete whShortage[w.id]; delete invCounts[w.id];
  });
  const ids=new Set(rest.map(w=>w.id));
  warehouses=warehouses.filter(w=> !ids.has(w.id));
  save('warehouses_v1',warehouses); save('whStock_v1',whStock);
  save('whShortage_v1',whShortage); save('invCounts_v1',invCounts);
  if(ids.has(load('_whTab_',null))) save('_whTab_', keep.id);
  render(true); toast('اتدمجوا في مخزن واحد');
}
function dupWhBar(){
  const d=dupWarehouses(); if(!d.length) return '';

function normUnit(u){ return String(u||'').trim().replace(/ه$/,'ة'); }
function pieceBreakdown(name, s){
  const it = itemsByName[name] || {};
  const unit = normUnit(it.unit) || '—';
  const rq = Number(it.rollQty)||0;
  const bigLbl = unit==='لفة'?'لفة':(unit==='كرتونة'?'كرتونة':'وحدة كبيرة');
  const smallLbl = unit==='لفة'?'عود':'قطعة';
  let big = nz(s.big), small = nz(s.small);
  if(!big && !small && rq>1){ const b=nz(s.balance); big=Math.floor(b/rq); small=b%rq; }
  return {unit, bigLbl, smallLbl, big, small};
}
function balText(name, s){
  s = s || {balance:0};
  const b = pieceBreakdown(name, s);
  const bal = nz(s.balance);
  const parts=[]; if(b.big) parts.push(b.big+' '+b.bigLbl); if(b.small) parts.push(b.small+' '+b.smallLbl);
  if(parts.length) return bal+' ('+parts.join(' + ')+')';
  return bal+' '+(b.unit==='—'?'':b.unit);
}

function importStock(file, whId){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const sn = wb.SheetNames.find(n=>n.includes('ارصدة')||n.includes('رصيد')) || wb.SheetNames[0];
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
      /* شيت الأرصدة ممكن يكون بعناوين عربي (صنف / رصيد) أو تصدير خام من برنامج
         الحسابات (Item_Name / cur) وفي أوله صفوف فاضية — فبندوّر على صف العناوين
         في أول 15 صف بدل ما نفترض إنه الأول. */
      const isHdr = r=>{ const h=r.map(x=>String(x||'').trim().toLowerCase());
        return h.some(x=>x.includes('صنف')||x==='item_name') && h.some(x=>x.includes('رصيد')||x.includes('كمية')||x==='cur'); };
      let hi = rows.slice(0,15).findIndex(isHdr); if(hi<0) hi = 0;
      const hdr = (rows[hi]||[]).map(h=>String(h||'').trim());
      const hl = hdr.map(h=>h.toLowerCase());
      /* عمود cur / Item_Name ليهم الأولوية لو موجودين — عشان لو الشيت فيه كمان عمود
         بعنوان فيه «رصيد» أو «كمية» (رصيد سابق مثلاً) ما ياخدش الرقم الغلط. */
      let ni = hl.indexOf('item_name'); if(ni<0) ni = hl.findIndex(h=>h.includes('صنف'));
      let bi = hl.indexOf('cur');       if(bi<0) bi = hl.findIndex(h=>h.includes('رصيد')||h.includes('كمية'));
      const wi = hdr.findIndex(h=>h==='مخزن'||h.includes('فرع'));
      const bigI = hdr.findIndex(h=>h.includes('لفه')||h.includes('لفة')||h.includes('كرتونه'));
      const smallI = hdr.findIndex(h=>h.includes('عود')||h.includes('قطعه')||h.includes('قطعة'));
      if(ni<0 || bi<0){ toast('لم يتم التعرف على أعمدة الصنف/الرصيد — تأكد من العناوين'); return; }
      const perWh={};
      for(let i=hi+1;i<rows.length;i++){ const row=rows[i]; if(!row[ni]) continue;
        const targetWh = wi>=0 ? String(row[wi]||'').trim() : null;
        // لو الشيت فيه عمود مخزن، وزّع كل مخزن مذكور على المخزن المطابق بالاسم؛ غير كده كله للمخزن المفتوح حاليًا
        let destId = whId;
        if(targetWh){ const match = warehouses.find(w=>w.name===targetWh); if(match) destId=match.id; else continue; }
        perWh[destId]=perWh[destId]||{};
        perWh[destId][String(row[ni]).trim()] = {balance:nz(row[bi]), big:bigI>=0? nz(row[bigI]) : 0, small:smallI>=0? nz(row[smallI]) : 0};
      }
      const totalRows = Object.values(perWh).reduce((a,m2)=>a+Object.keys(m2).length,0);
      pendingImport={type:'stock', perWh, file:file.name};
      const whNames = Object.keys(perWh).map(id=>(warehouses.find(w=>w.id===id)||{}).name).join('، ');
      openSheet(`<h3>تأكيد استيراد الأرصدة</h3><p style="font-size:13.5px;color:var(--muted)">
        ${esc(file.name)}<br>${totalRows} صنف${whNames?' — للمخازن: '+esc(whNames):''} — هيتم استبدال بيانات الأرصدة الحالية لهذا المخزن/المخازن.</p>
        <div class="f-actions"><button class="btn-cancel" onclick="closeSheet()">إلغاء</button>
        <button class="btn-save" onclick="commitImport()">💾 حفظ</button></div>`);
    }catch(err){ toast('خطأ في الملف'); }
  };
  r.readAsArrayBuffer(file);
}
/* الطلب خانتين لكل صنف، والوحدتين بتتحددوا من مجموعة الصنف:
     القطاعات (كرافت لاين · نيو لاين · PVC كومبن) → لفة / عود
     الاكسسوارات وأي حاجة تانية              → كرتونة / قطعة
   فمفيش قايمة وحدات تختار منها كل مرة.
   بنقرا السجلات القديمة بكل أشكالها: {order, unit} و {cartons, pieces}. */
const SHORT_UNITS_ROLL = ['لفة','عود'];      // القطاعات
const SHORT_UNITS_BOX  = ['كرتونة','قطعة'];  // الاكسسوارات وغيرها
function isProfileGroup(g){
  g = String(g || '');
  return /قطاعات|نيو لاين/.test(g);
}
function shortUnits(name){
  const it = itemsByName[name] || {};
  return isProfileGroup(it.mainGroup) ? SHORT_UNITS_ROLL : SHORT_UNITS_BOX;
}
// بيرجّع {q1,q2,u1,u2,note} مهما كان شكل السجل المتخزّن
function shortRec(whId, name){
  const r = (whShortage[whId] || {})[name] || {};
  const [u1, u2] = shortUnits(name);
  const base = {q1:'', q2:'', u1, u2, note: r.note || ''};
  if(r.q1 !== undefined || r.q2 !== undefined){
    return Object.assign(base, {q1: r.q1 || '', q2: r.q2 || ''});
  }
  if(r.cartons !== undefined || r.pieces !== undefined){   // شكل v2.8
    return Object.assign(base, {q1: r.cartons || '', q2: r.pieces || ''});
  }
  const legacy = r.order || '';                            // شكل v2.7 وأقدم
  if(!legacy) return base;
  const u = normUnit(r.unit || '');
  return Object.assign(base, u === u1 ? {q1: legacy} : {q2: legacy});
}
function setShortQty(whId, name, field, val){
  val = String(val || '').trim();
  const r = shortRec(whId, name);
  r[field] = val;
  whShortage[whId] = whShortage[whId] || {};
  if(!r.q1 && !r.q2) delete whShortage[whId][name];
  else whShortage[whId][name] = {q1:r.q1, q2:r.q2, u1:r.u1, u2:r.u2, note:r.note};

function shortTotals(whId){
  const out = {items:0, byUnit:{}};
  Object.keys(whShortage[whId] || {}).forEach(n=>{
    const r = shortRec(whId, n);
    const a = Number(r.q1) || 0, b = Number(r.q2) || 0;
    if(!a && !b) return;
    out.items++;
    if(a) out.byUnit[r.u1] = (out.byUnit[r.u1] || 0) + a;
    if(b) out.byUnit[r.u2] = (out.byUnit[r.u2] || 0) + b;
  });
  return out;
}

function buildGroupBreakdown(list, whId){

    buckets[bucket]=buckets[bucket]||{byUnit:{}, subs:{}};
    add(buckets[bucket].byUnit, r.u1, a); add(buckets[bucket].byUnit, r.u2, b);
    const sb=buckets[bucket].subs[sub]=buckets[bucket].subs[sub]||{};
    add(sb, r.u1, a); add(sb, r.u2, b);
  });
  return buckets;
}

let cmpMain=new Set(), cmpSub=new Set(), cmpZero=false, colMain=new Set(), colZero=false;
const fmtN=n=>Number(n).toLocaleString('en-US');
/* ═══ مطابقة اسم الصنف مع شيت الأرصدة ═══
   المقارنات كانت بتدوّر على الرصيد **بالاسم بالظبط**. أي فرق بسيط بين اسم
   الصنف في شيت الأصناف وشيت الأرصدة — مسافة زيادة، ة/ه، أ/ا، ى/ي، رقم
   عربي/هندي، شرطة — كان بيخلّي الرصيد صفر، فالمقارنة تطلع فاضية مع إن
   الأرصدة مرفوعة فعلاً. دلوقتي بنجرب الاسم بالظبط الأول، وبعدين بالبصمة. */
let _whIdx = null, _whIdxFor = null;
function whStockIndex(){
  if(_whIdx && _whIdxFor === whStock) return _whIdx;
  const idx = {};
  for(const w of warehouses){
    const m = idx[w.id] = {};
    for(const n of Object.keys(whStock[w.id] || {})){
      const f = ordNorm(n);
      if(f && m[f] === undefined) m[f] = n;
    }
  }
  _whIdx = idx; _whIdxFor = whStock;
  return idx;
}
function stockKey(whId, name){
  const m = whStock[whId] || {};
  if(m[name] !== undefined) return name;
  const hit = (whStockIndex()[whId] || {})[ordNorm(name)];
  return hit !== undefined ? hit : null;
}
function stockOf(whId, name){
  const k = stockKey(whId, name);
  return k === null ? undefined : (whStock[whId] || {})[k];
}
function qtyOf(whId, name){ return nz(stockOf(whId, name)?.balance); }
// أصناف موجودة في شيت الأرصدة ومالهاش مقابل في قايمة الأصناف — دي بتختفي
// من المقارنات من غير ما حد يعرف، فبنعدّها ونقولك.
function stockOrphans(){
  const known = new Set();
  items.forEach(i=>{ known.add(i.name); known.add(ordNorm(i.name)); });
  const out = [];
  for(const w of warehouses){
    for(const n of Object.keys(whStock[w.id] || {})){
      if(known.has(n) || known.has(ordNorm(n))) continue;
      if(!nz((whStock[w.id][n]||{}).balance)) continue;
      out.push(n);
    }
  }
  return [...new Set(out)];
}
/* شريط التصدير مثبّت في آخر الشاشة نفسها (fixed مش sticky) عشان
   ما يختفيش لما الجدول يتسحب يمين وشمال أو لما الصفحة تطول. */
function floatBar(inner){
  return `<div style="height:82px"></div>
    <div class="fbar"><div class="impbar" style="margin:0">${inner}</div></div>`;
}
/* شريط تبويبات واحد لكل الشاشات: نفس شكل الصفحة الرئيسية.
   list = [{k, name}]، active = المفتوح، onc(k) = الكود اللي يتنفّذ. */
function tabStrip(list, active, onc, opt){
  opt=opt||{};
  return `<div class="stabs${opt.grow?' grow':''}${opt.cls?' '+opt.cls:''}">${list.map(t=>
    `<button class="stab${String(t.k)===String(active)?' on':''}" onclick="${onc(t.k)}">${t.name}</button>`
  ).join('')}</div>`;
}
function noStockMsg(){ return !warehouses.some(w=>Object.keys(whStock[w.id]||{}).length); }

function buildCompareTree(){
  const tree=[];
  [...new Set(items.map(i=>i.mainGroup).filter(Boolean))].forEach(mg=>{
    if(cmpMain.size && !cmpMain.has(mg)) return;
    const mgItems=items.filter(i=>i.mainGroup===mg);
    const subs=[];
    [...new Set(mgItems.map(i=>i.subGroup||'بدون فرعية'))].forEach(sg=>{
      if(cmpSub.size && !cmpSub.has(sg)) return;
      const rows=[];
      mgItems.filter(i=>(i.subGroup||'بدون فرعية')===sg).forEach(it=>{
        const cells=warehouses.map(w=>qtyOf(w.id,it.name));
        if(!cells.reduce((a,b)=>a+b,0) && !cmpZero) return;
        rows.push({name:it.name,cells});
      });
      if(rows.length) subs.push({sg, cells:warehouses.map((w,i)=>rows.reduce((s,r)=>s+r.cells[i],0)), items:rows});
    });
    if(subs.length) tree.push({mg, cells:warehouses.map((w,i)=>subs.reduce((s,x)=>s+x.cells[i],0)), subs});
  });
  return tree;
}
function qCells(cells){
  const tot=cells.reduce((a,b)=>a+b,0);
  return warehouses.map((w,i)=>`<span><small>${esc(w.name)}</small> <b>${fmtN(cells[i])}</b></span>`).join('')+(warehouses.length>1?`<span><small>الكل</small> <b>${fmtN(tot)}</b></span>`:'');
}

    ${floatBar(`<button onclick="exportCompareExcel()">📊 إكسل</button><button onclick="exportComparePdf()">📄 PDF</button><button onclick="exportCompareImage()">🖼️ صورة</button>`)}

// ----- مقارنة بالألوان: الصنف المختصر × (اللون × الفرع) -----
function buildColorTable(){
  const norm=s=>String(s).trim();
  const src=items.filter(i=>i.baseName && norm(i.baseName) && i.color && norm(i.color) && (!colMain.size || colMain.has(i.mainGroup)));
  const groups={};
  src.forEach(it=>{
    const mg=it.mainGroup, bn=norm(it.baseName), c=norm(it.color);
    groups[mg]=groups[mg]||{}; groups[mg][bn]=groups[mg][bn]||{};
    const cells=groups[mg][bn][c]=groups[mg][bn][c]||warehouses.map(()=>0);
    warehouses.forEach((w,i)=>{ cells[i]+=qtyOf(w.id,it.name); });
  });
  const colorSum={};
  Object.values(groups).forEach(bs=>Object.values(bs).forEach(cs=>Object.entries(cs).forEach(([c,cells])=>{ colorSum[c]=(colorSum[c]||0)+cells.reduce((a,b)=>a+b,0); })));
  /* اللون اللي رصيده صفر في كل الفروع وكل البنود مالوش عمود خالص — كان
     بيتعرض لو خانة «إظهار الصفرية» متفعّلة، فتلاقي عمود خشبي فاضي واخد
     عرض الشاشة من غير فايدة. الخانة دلوقتي للأصناف بس. */
  let colors=Object.keys(colorSum).filter(c=>colorSum[c]>0);
  const pri=['ابيض','بيج']; colors.sort((a,b)=>{ const pa=pri.indexOf(a), pb=pri.indexOf(b); if(pa>=0||pb>=0) return (pa<0?99:pa)-(pb<0?99:pb); return colorSum[b]-colorSum[a]; });
  const W=warehouses.length, rows=[];
  Object.entries(groups).forEach(([mg,bs])=>{
    const list=[];
    Object.entries(bs).forEach(([bn,cs])=>{
      const flat=[]; colors.forEach(c=>{ const cells=cs[c]||warehouses.map(()=>0); flat.push(...cells); });
      const total=flat.reduce((a,b)=>a+b,0);
      if(total||colZero) list.push({type:'item',label:bn,flat,total});
    });
    if(list.length){ rows.push({type:'main',label:mg}); rows.push(...list); }
  });
  return {colors, rows, W};
}

function saveCustomer(id){
  const name=$('#c_name').value.trim(); if(!name){ toast('اكتب الاسم'); return; }
  const dup=customers.find(x=> x.name===name && x.id!==id);
  if(dup){ toast('في عميل بالاسم ده — لو هو نفسه استخدم 🔗 دمج'); return; }
  const obj={id:id||uid(), name, cls:$('#c_cls').value};
  if(id){ const i=customers.findIndex(x=>x.id===id), old=customers[i];
    // تغيير الاسم: المبيعات كانت بتفضل على الاسم القديم والعميل يبان من غير مبيعات
    if(old && old.name!==name) mergeCustomerNames(old.name, name);
    customers[i]=obj; delete custPend[id]; } else customers.unshift(obj);
  save('customers_v1',customers); closeSheet(); render(); toast('تم الحفظ');
}

function mergeCustomerSheet(id){

function doMergeCustomer(id){
  const from=customers.find(x=>x.id===id); if(!from) return;
  const to=($('#mg_to').value||'').trim();
  if(!to){ toast('اختار الاسم الجديد'); return; }
  if(to===from.name){ toast('دا نفس الاسم'); return; }
  const target=customers.find(x=>x.name===to);
  if(!target){ toast('مفيش عميل بالاسم ده — اختار من القايمة'); return; }
  mergeCustomerNames(from.name, to);
  if(!target.cls && from.cls) target.cls=from.cls;
  customers=customers.filter(x=>x.id!==id);
  save('customers_v1',customers); save('custAlias_v1',custAlias);
  closeSheet(); render(true); toast('اتدمج في '+to);
}
function mergeCustomerNames(a, b){
  Object.keys(monthlySales).forEach(mo=>{ const m2=monthlySales[mo];
    if(m2[a]===undefined) return; m2[b]=(m2[b]||0)+m2[a]; delete m2[a]; });
  Object.keys(monthlySector).forEach(mo=>{ const m2=monthlySector[mo];
    if(!m2[a]) return; m2[b]=m2[b]||{};
    Object.entries(m2[a]).forEach(([k,v])=> m2[b][k]=(m2[b][k]||0)+v); delete m2[a]; });
  Object.keys(monthlyDoors).forEach(mo=>{ const m2=monthlyDoors[mo];
    if(!m2[a]) return; m2[b]=m2[b]||{};
    Object.entries(m2[a]).forEach(([k,v])=>{
      const t=m2[b][k]=m2[b][k]||{qty:0,val:0,code:v.code||'',sub:v.sub||''};
      t.qty+=(v.qty||0); t.val+=(v.val||0);
      if(!t.code && v.code) t.code=v.code; if(!t.sub && v.sub) t.sub=v.sub; });
    delete m2[a]; });
  // أي اسم كان بيتحوّل للقديم يتحوّل للجديد على طول
  Object.keys(custAlias).forEach(k=>{ if(custAlias[k]===a) custAlias[k]=b; });
  custAlias[a]=b;
  save('monthlySales_v1',monthlySales); save('monthlySector_v1',monthlySector);
  save('monthlyDoors_v1',monthlyDoors); save('custAlias_v1',custAlias);
}

/* أعلى/أقل قيمة في كل عمود رقمي — نفس التلوين على الشاشة وفي التصدير */
function modelHiLo(md, noColor){
  const rows = md.body.filter(r=> r.type==='row');
  const out={};
  md.header.forEach((h,c)=>{
    if(c===0) return;                      // عمود الاسم/الكود

    if(vals.length<2) return;

/* جدول واحد لكل التقارير: ميداليات لأول تلاتة، وفي كل عمود رقمي
   أكبر قيمة خلفيتها خضرا وأصغر قيمة (غير الصفر) خلفيتها حمرا،

function renderRepTable(m, id, md, opt){

  m.innerHTML = `${opt.warn? `<div class="warn">${opt.warn}</div>`:''}

/* ٢) موزعين × قطاعات */
/* نفس صفوف «موزعين إجمالي» بالظبط عشان التقريرين يطابقوا بعض:
   كل موزع بسطر، ومبيعات الجملة سطر واحد مجمّع. */
function buildDistSectors(){
  const months = salesMonths();
  const custByName={}; customers.forEach(c=>custByName[c.name]=c);
  const secs = new Set(), rows = {};
  months.forEach(mo=>{
    Object.entries(monthlySector[mo]||{}).forEach(([cname, bySec])=>{
      const cls=(custByName[cname]||{}).cls||'';
      if(!cls || cls==='مستبعد' || cls==='عميل ابواب' || cls==='مبيعات خاصة') return;
      const key = cls==='موزع' ? cname : cls;
      Object.entries(bySec).forEach(([sec0, v])=>{
        const sec = secColOf(sec0);
        secs.add(sec); rows[key]=rows[key]||{}; rows[key][sec]=(rows[key][sec]||0)+v;
      });
    });
  });
  // العمود اللي كله أصفار أو اللي أخفيته ما يظهرش
  const cols = [...secs].filter(sec=> !secHidden(sec) && Object.keys(rows).some(n=> rows[n][sec])).sort(secSort);
  const list = Object.keys(rows).map(n=>({name:n, cells: cols.map(s2=> rows[n][s2]||0),
    total: cols.reduce((a,s2)=> a+(rows[n][s2]||0), 0)})).sort((a,b)=> b.total-a.total);
  const tot = cols.map((s2,i)=> list.reduce((a,r)=> a+r.cells[i], 0));
  return {cols, list, tot, total: tot.reduce((a,b)=>a+b,0), months};
}
function repDistSectorsModel(){
  const d = buildDistSectors(), body=[];
  d.list.forEach(r=> body.push({type:'row', cells:[r.name, ...r.cells.map(v=> Math.round(v)), Math.round(r.total)]}));
  body.push({type:'tot', cells:['الإجمالي', ...d.tot.map(v=>Math.round(v)), Math.round(d.total)]});
  return {title:'مبيعات الموزعين حسب القطاع — '+periodLabel(),
    header:['الموزع', ...d.cols.map(secLabel), 'الإجمالي'],
    headTap:['', ...d.cols.map(k=>`secSheet(${jsArg(k)})`), ''], body, d,
    boxes:[{l:'أعلى ٣ مجموعات', rows:d.cols.map((c,i)=>({name:secLabel(c), val:d.tot[i]})).sort((a,b)=>b.val-a.val)},
           {l:'أعلى ٣ أصناف', rows:topItems()}]};
}
function renderRepDistSectors(m){
  const d = buildDistSectors();

/* ٢-ب) موزعين وقطاعات — بلوك لكل موزع: كل القطاعات (حتى الصفر) + إجمالي الموزع + إجمالي كلي
   ترتيب القطاعات ثابت · الموزعين من الأكبر للأصغر · الصفر أحمر · أعلى قطاع عند كل موزع أخضر
   الفترة من نفس شريط الشهور/الكوارتر/السنة (كل فترة في بلوك لوحدها). */
function distBlkAgg(months, cols){
  const custByName={}; customers.forEach(c=>custByName[c.name]=c);
  const rows={};
  months.forEach(mo=>{
    Object.entries(monthlySector[mo]||{}).forEach(([cname, bySec])=>{
      const cls=(custByName[cname]||{}).cls||'';
      if(!cls || cls==='مستبعد' || cls==='عميل ابواب' || cls==='مبيعات خاصة') return;
      const key = cls==='موزع' ? cname : cls;
      const r = rows[key] = rows[key] || {};
      Object.entries(bySec).forEach(([s0, v])=>{ const sc=secColOf(s0); r[sc]=(r[sc]||0)+v; });
    });
  });
  const list = Object.keys(rows).map(n=>{
    const cells = cols.map(sc=> rows[n][sc]||0);
    return {name:n, cells, total: cells.reduce((a,b)=>a+b,0)};
  }).filter(r=> Math.round(r.total)!==0).sort((a,b)=> b.total-a.total);
  return {list, total: list.reduce((a,r)=>a+r.total,0)};
}
function distBlkModel(){
  const D = buildDistSectors(), cols = D.cols;
  const blocks = periodCols().map(pc=> Object.assign({label:pc.label}, distBlkAgg(pc.months, cols)));
  return {cols, blocks, title:'موزعين وقطاعات — '+periodLabel()};
}
const distBlkN = v=> Math.round(v).toLocaleString('en-US');

/* ٣) الأبواب بالكود — صف لكل كود، وأعمدة للمقاسات
      70 · 80 · 90 · متر · برور وحلق · خدمات.
      المقاس بيتقرا من اسم الصنف، والبرور والحلق مع بعض في عمود واحد. */
/* التقرير ده للأبواب نفسها بس: البرور والحلوق والخدمات والإكسسوارات
   مستبعدين حتى لو عليهم أكواد، فمفيش سطر «بدون كود» من الأصل. */
const DOOR_SIZES=['70','80','90','متر','باقي'];
const NOT_A_DOOR=/برور|حلق|حلوق|خدم|كالون|مفصل|جوان|سليكون|مسمار|اكسسوار|إكسسوار|عتب/;
function isDoorItem(name, sub){
  if(NOT_A_DOOR.test(String(name||''))) return false;
  return isDoorSub(name, sub);
}
function doorCol(name){
  const n=String(name||'');
  const m2=n.match(/(^|[\s(])(\d{2,3})(\s*سم)?([\s)]|$)/);
  if(m2){ const v=parseInt(m2[2],10);
    if(v===70) return '70'; if(v===80) return '80'; if(v===90) return '90';
    if(v>=100 && v<=130) return 'متر'; }
  if(/متر/.test(n)) return 'متر';
  return 'باقي';                        // باب من غير مقاس واضح في اسمه
}
function buildDoorsByCode(){
  const rows={}, noCode={};        // اللي من غير كود مش بيدخل الجدول خالص
  salesMonths().forEach(mo=>{
    Object.values(monthlyDoors[mo]||{}).forEach(byItem=>{
      Object.entries(byItem).forEach(([name, d])=>{
        if(!isDoorItem(name, d.sub)) return;
        if(doorHide.indexOf(name)>=0) return;
        const code = doorCodeMap[name] || d.code || '';
        if(!code){ noCode[name]=(noCode[name]||0)+(d.val||0); return; }
        const r = rows[code] = rows[code] || {code, names:new Set(), cells:{}, qtys:{}, qty:0, val:0};
        r.names.add(name);
        const c = doorCol(name);
        r.cells[c]=(r.cells[c]||0)+(d.val||0);
        r.qtys[c]=(r.qtys[c]||0)+(d.qty||0);
        r.qty += (d.qty||0); r.val += (d.val||0);
      });
    });
  });
  const all=Object.values(rows);
  // عمود المقاس ما يظهرش غير لما يكون فيه أرقام
  const cols=DOOR_SIZES.filter(c=> all.some(r=> r.cells[c]));
  const list=all.map(r=>({
    code:r.code, name:[...r.names][0]||'', names:[...r.names], many:r.names.size>1,
    cells:cols.map(c=> r.cells[c]||0), qtys:cols.map(c=> rnd2(r.qtys[c]||0)),
    qty:r.qty, val:r.val
  })).sort((a,b)=> b.val-a.val);
  const tot=cols.map((c,i)=> list.reduce((a,r)=> a+r.cells[i],0));
  const totQ=cols.map((c,i)=> rnd2(list.reduce((a,r)=> a+r.qtys[i],0)));
  return {cols, list, tot, totQ,
    noCode:Object.keys(noCode).map(n=>({name:n, val:noCode[n]})).sort((a,b)=>b.val-a.val),
    qty:list.reduce((a,r)=>a+r.qty,0), val:list.reduce((a,r)=>a+r.val,0)};
}

    body.push({type:'row', cells:[r.code, ...r.cells.map(v=>Math.round(v)), Math.round(r.val)]});
    body.push({type:'sub', cells:['كمية', ...r.qtys, rnd2(r.qty)]});     // الكمية تحت القيمة
