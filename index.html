});

document.addEventListener('input',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a==='adm-pw'){ state.admin.pw=el.value; const b=document.querySelector('[data-act="adm-login"]'); if(b) b.disabled=!el.value; return; }
  if(a==='prof'){
    // الموبايل بيتخزّن بأرقام لاتينية دايمًا — لو الموزع كتبه بالعربي بنحوّله
    // على طول عشان يتقبل هنا ويتطابق مع السيرفر بعدين.
    state.profile[el.dataset.k] = (el.dataset.k==='phone') ? toLatinDigits_(el.value) : el.value;
    save(LS_PROFILE,state.profile); return;
  }
  if(a==='cust'){
    const k=el.dataset.k;
    const v = (k==='w'||k==='h') ? decIn_(el.value) : el.value;
    const wasReady = customReady_(state.pick);
    state.pick.custom[k]=v;
    if(el.value!==v) el.value=v;
    refreshSummary();
    // خيارات الحلق والبرور بتظهر بس لما المقاس الخاص يكتمل — لازم نرسم الشاشة تاني أول ما يكتمل (أو يبطل يكتمل)
    if(wasReady !== customReady_(state.pick)) render();
    return;
  }
  if(a==='pick-note'){ state.pick.note=el.value; return; }
  if(a==='cust-name'){ state.customer.name=el.value; return; }
  if(a==='cust-phone'){ state.customer.phone=toLatinDigits_(el.value); return; }
  if(a==='edit-date'){ state.editingDate=el.value; return; }
  if(a==='edit-meta-customer'){ if(state.editingMeta) state.editingMeta.customer=el.value; return; }
  if(a==='edit-meta-phone'){ if(state.editingMeta) state.editingMeta.customerPhone=toLatinDigits_(el.value); return; }
  if(a==='stock-in'){
    state.admin.stockDraft[el.dataset.code+'|'+el.dataset.w] = el.value;
    el.classList.add('dirty');
    const b=document.querySelector('[data-act="stock-save"]'); if(b) b.disabled=false;
    return;
  }
  if(a==='ord-note'){ state.orderNote=el.value; return; }
  if(a==='size-height'){ const w=Number(el.dataset.w); const e=state.pick.sizes[w]; if(e) e.height=decIn_(el.value); if(el.value!==e.height) el.value=e.height; refreshSummary(); return; }
  if(a==='size-frame-height'){ const w=Number(el.dataset.w); const e=state.pick.sizes[w]; if(e) e.frameHeight=decIn_(el.value); if(el.value!==e.frameHeight) el.value=e.frameHeight; return; }
  if(a==='cust-frame-height'){ state.pick.custom.frameHeight=decIn_(el.value); if(el.value!==state.pick.custom.frameHeight) el.value=state.pick.custom.frameHeight; return; }
  if(a==='size-frame-rodqty'){ const w=Number(el.dataset.w); const e=state.pick.sizes[w]; if(e) e.frameRodQty=el.value; return; }
  if(a==='cust-frame-rodqty'){ state.pick.custom.frameRodQty=el.value; return; }
  if(a==='size-frame-fordoors'){ const w=Number(el.dataset.w); const e=state.pick.sizes[w]; if(e) e.frameForDoors=el.value; return; }
  if(a==='cust-frame-fordoors'){ state.pick.custom.frameForDoors=el.value; return; }
  if(a==='size-qty-set'){ const w=Number(el.dataset.w); const e=state.pick.sizes[w]; if(e) e.qty=(parseInt(el.value,10)>0?parseInt(el.value,10):''); refreshSummary(); return; }
  if(a==='cust-qty-set'){ const wasReady=customReady_(state.pick); state.pick.custom.qty=(parseInt(el.value,10)>0?parseInt(el.value,10):''); refreshSummary(); if(wasReady!==customReady_(state.pick)) render(); return; }
  if(a==='acc-set'){ state.acc[el.dataset.id]=Math.max(0,parseFloat(el.value)||0); refreshAccBtn(); return; }
  if(a==='fr-jambCm'){ state.fr.jambCm=decIn_(el.value); render(); return; }
  if(a==='fr-headerCm'){ state.fr.headerCm=decIn_(el.value); render(); return; }
  if(a==='fr-qty'){ state.fr.qty=el.value; render(); return; }
  if(a==='fr-brqty'){ state.fr.brQty=el.value; render(); return; }
  if(a==='fr-brlen'){ state.fr.brLen=decIn_(el.value); render(); return; }
  if(a==='fr-rods'){ state.fr.rods=el.value; render(); return; }
  if(a==='fr-rodsCm'){ state.fr.rodsCm=decIn_(el.value); render(); return; }
  if(a==='fr-extra-cm'){ state.fr.extra[Number(el.dataset.i)].cm=decIn_(el.value); render(); return; }
  if(a==='fr-extra-qty'){ state.fr.extra[Number(el.dataset.i)].qty=el.value; render(); return; }
  if(a==='fr-note'){ state.fr.note=el.value; return; }
  if(a==='br-rods'){ state.br.rods=el.value; refreshRodBtn('add-br'); return; }
  if(a==='br-len'){ state.br.len=decIn_(el.value); render(); return; }
  if(a==='mb-qty'){ state.mb.qty=el.value; refreshMabraBtn_(); return; }
  if(a==='mb-wall-txt'){ state.mb.wallTxt=el.value; refreshMabraBtn_(); return; }
  if(a==='mb-w'){ state.mb.w=el.value; refreshMabraBtn_(); return; }
  if(a==='mb-h'){ state.mb.h=el.value; refreshMabraBtn_(); return; }
  if(a==='pd-qty'){ state.pd.qty=el.value; refreshPanelBtn(); return; }
  if(a==='sp-qty'){ state.sp.qty=el.value; refreshMeterBtn_('strip'); return; }
  if(a==='vn-qty'){ state.vn.qty=el.value; refreshMeterBtn_('veneer'); return; }
  if(a==='price-set'){
    const pe=state.admin.priceEdit; if(!pe) return;
    const v=parseFloat(el.value)||0, g=el.dataset.group, k=el.dataset.key, tier=el.dataset.tier;
    if(g==='customExtra') pe.customExtra[tier]=v;
    else if(g==='woodExtra') pe.woodExtra[tier]=v;
    else if(g==='printExtra'){ pe.printExtra = pe.printExtra || {dist:0,showroom:0}; pe.printExtra[tier]=v; }
    else if(g==='hafrExtra') pe.hafrExtra[tier]=v;
    else if(pe[g][k]) pe[g][k][tier]=v;
    return;
  }
  if(a==='prod-set'){
    const key = el.dataset.id+':'+el.dataset.idx;
    state.admin.prodEdit[key] = el.value;
    return;
  }
  if(a==='item-qty-set'){
    const key = el.dataset.id+':'+el.dataset.idx;
    state.admin.qtyEdit[key] = el.value;
    return;
  }
  if(a==='meta-customer'){
    const id = el.dataset.id;
    if(!state.admin.metaEdit[id]){
      const o=adminOrderById_(id);
      state.admin.metaEdit[id] = {customer:(o&&o.customer)||'', date:(o&&o.date)||''};
    }
    state.admin.metaEdit[id].customer = el.value;
    return;
  }
  if(a==='meta-date'){
    const id = el.dataset.id;
    if(!state.admin.metaEdit[id]){
      const o=adminOrderById_(id);
      state.admin.metaEdit[id] = {customer:(o&&o.customer)||'', date:(o&&o.date)||''};
    }
    state.admin.metaEdit[id].date = el.value;
    return;
  }
});

// زرار الإكسسوارات كان بيفضل مقفول لو الموزع كتب الكمية بإيده بدل ما يضغط +
// لأن الصفحة مش بتترسم وقت الكتابة — فبنحدّثه هنا يدوي.
function refreshAccBtn(){
  const b=document.querySelector('[data-act="add-acc"]'); if(!b) return;
  const t=ACCESSORIES.reduce((sum,a)=>sum+(state.acc[a.id]||0)*a.price,0);
  b.disabled = !(t>0);
  b.textContent = t>0 ? 'أضف الإكسسوارات' : 'اختر الكميات أولاً';
}

// جاهز للإضافة؟ كل مقاس مختار لازم يكون له كمية مكتوبة (مفيش كمية افتراضية عشان الموظف مايفوتهاش) + حلق + برور
function doorReady_(p){
  const ws = Object.keys(p.sizes).map(Number);
  const cr = customReady_(p);
  if(!p.code || (!ws.length && !cr)) return false;
  if(!ws.every(w=>Number(p.sizes[w].qty)>0 && p.sizes[w].frame!=null && p.sizes[w].dbror!=null)) return false;
  return !p.customOn || (cr && p.custom.frame!=null && p.custom.dbror!=null);
}
function refreshSummary(){
  const n=document.getElementById('sumline'); if(n) n.textContent=currentSummary();
  const b=document.querySelector('[data-act="add-door"]');
  if(b){ const ok=doorReady_(state.pick); b.disabled=!ok; b.textContent = ok ? 'أضف الأبواب للسلة' : 'اكتب الكمية وحدد الحلق والبرور لكل مقاس'; }
}

// زرار إضافة ألواح البروديوم — بيتحدّث من غير render كامل عشان الكيبورد ما يقفلش وإحنا بنكتب
function refreshPanelBtn(){
  const b=document.querySelector('[data-act="add-pd"]'); if(!b) return;
  const q=Math.max(0,Math.round(Number(state.pd.qty)||0));
  b.disabled=!(q>0 && state.pd.code);
  b.textContent = !state.pd.code ? 'اختر اللون الأول (كود الباب)'
    : (q>0 ? `أضف ${q} لوح بروديوم — ${state.pd.code}` : 'اكتب عدد الألواح');
}

// بنحدّث زرار الإضافة من غير render عشان الكيبورد ما يقفلش وإحنا بنكتب
// زرار البرور بس — الحلق بقى عدادين فبيترسم كامل مع render()
function refreshRodBtn(act){
  const b=document.querySelector('[data-act="'+act+'"]'); if(!b) return;
  // ⚠️ addRod بتقرّب العدد (Math.round) لكن الزرار كان بيعرض الرقم زي ما اتكتب.
  // يعني «أضف 2.5 عود» وبتتضاف ٣ — الزرار كان بيوعد بحاجة والإضافة تعمل غيرها.
  // نفس تقريب البروديوم بالظبط.
  const r=rodQty_(state.br.rods), s=BRORS.find(x=>x.size===state.br.size)||BRORS[0];
  b.disabled=!(r>0 && state.br.code);
  b.textContent = !state.br.code ? 'اختر اللون الأول (كود الباب)'
    : (r>0 ? `أضف ${r} عود برور ${s.size} — ${state.br.code}` : 'اكتب عدد العيدان');
}

function addDoor(){
  const p=state.pick;
  const widths = Object.keys(p.sizes).map(Number).filter(w=>(Number((p.sizes[w]||{}).qty)||0)>0);
  const customReady = customReady_(p);
  if(Object.keys(p.sizes).some(w=>!(Number(p.sizes[w].qty)>0))){ toast('اكتب الكمية لكل مقاس مختار'); return; }
  if(!p.code || (!widths.length && !customReady)){
    toast('اختر مقاس واحد على الأقل'); return;
  }
  if(widths.some(w=>{ const e=p.sizes[w]; return e.frame==null || e.dbror==null; }) || (customReady && (p.custom.frame==null||p.custom.dbror==null))){
    toast('حدد الحلق والبرور لكل مقاس مختار'); return;
  }
  const d=doorByCode(p.code);
  const addedTxts=[];

  widths.forEach(w=>{
    const e=p.sizes[w];
    const qty=Number(e.qty)||1;
    // ارتفاع الفتحة المعمارية اختياري ولكل مقاس ارتفاعه الخاص بيه (المقاس الخاص أصلًا بياخد ارتفاعه من حقل الطول بتاعه)
    const doorHeight = e.height ? Number(e.height) : 0;
    const sizeTxt=w+' سم', sizeEn=w+' cm', unitPrice=priceForWidth(w,e.hafr);
    const frameKind = e.frame ? (e.frameKind||'full') : null;
    state.cart.push({
      kind:'door',
      title:'باب '+d.code+' '+d.name+(e.hafr?' (حفر)':'')+(e.print?' (طباعة)':''),
      titleEn:'WPC Door '+d.code+' - '+d.en+(e.hafr?' (Carved)':'')+(e.print?' (Print)':''),
      code:d.code, img:d.img, sizeTxt, sizeEn, unitPrice, qty,
      w,   // العرض بالسم كرقم خام — لخصم الرصيد بدقة
      frame:e.frame||0, dbror:e.dbror||'', frameHeight:e.frameHeight?Number(e.frameHeight):0,
      frameKind, frameRodQty:frameKind==='rods'?(e.frameRodQty||''):'', frameForDoors:frameKind==='rods'?(e.frameForDoors||''):'',
      note: [frameKind==='rods' ? frameKindNote_('rods', e.frameRodQty, e.frameForDoors) : '', (p.note||'').trim()].filter(Boolean).join(' — '),
      doorHeight, hafr:!!e.hafr, wood:!!e.wood, print:!!e.print, millEn:e.hafr?'Carved':''
    });
    addedTxts.push(doorSizeText_(sizeTxt,doorHeight)+' × '+qty);
  });

  if(customReady){
    const w=Number(p.custom.w), h=Number(p.custom.h), qty=Number(p.custom.qty)||1;
    // ⚠️ المقاس الخاص كان بيتضاف عليه CUSTOM_EXTRA في السعر. دلوقتي السعر زي
    // سعر المقاس العادي بالظبط، و«خدمة قص» بتتكتب كسطر تحت الصنف — تبان
    // للمصنع وللعميل من غير ما تتحسب في الفلوس.
    const sizeTxt=w+'×'+h+' سم (مقاس خاص — مقاس الفتحة المعمارية)', sizeEn=w+'x'+h+' cm (custom)', unitPrice=priceForWidth(w,p.custom.hafr);
    const customFrameKind = p.custom.frame ? (p.custom.frameKind||'full') : null;
    state.cart.push({
      kind:'door',
      title:'باب '+d.code+' '+d.name+(p.custom.hafr?' (حفر)':'')+(p.custom.print?' (طباعة)':''),
      titleEn:'WPC Door '+d.code+' - '+d.en+(p.custom.hafr?' (Carved)':'')+(p.custom.print?' (Print)':''),
      code:d.code, img:d.img, sizeTxt, sizeEn, unitPrice, qty,
      w:'',   // مقاس خاص مش متتبّع في المخزون
      frame:p.custom.frame||0, dbror:p.custom.dbror||'', frameHeight:p.custom.frameHeight?Number(p.custom.frameHeight):0,
      frameKind:customFrameKind, frameRodQty:customFrameKind==='rods'?(p.custom.frameRodQty||''):'', frameForDoors:customFrameKind==='rods'?(p.custom.frameForDoors||''):'',
      // «خدمة قص» مابقتش ملحوظة — بقت بند مستقل بسعره تحت الباب (syncCutServiceLines_)
      note: [customFrameKind==='rods' ? frameKindNote_('rods', p.custom.frameRodQty, p.custom.frameForDoors) : '',
             (p.note||'').trim()].filter(Boolean).join(' — '),
      doorHeight:0, hafr:!!p.custom.hafr, wood:!!p.custom.wood, print:!!p.custom.print, millEn:p.custom.hafr?'Carved':''
    });
    addedTxts.push(sizeTxt+' × '+qty);
  }

  saveCart_();
  clearPulledLine_();
  toast('اتضاف للسلة: '+d.code+' — '+addedTxts.join('، '));
  // نلمّ الاختيارات ونقفل اللوحة عشان يختار باب تاني بارتياح
  state.pick={code:'', sizes:{}, customOn:false, note:'', custom:{w:'',h:'',qty:'',frame:null,frameHeight:'',dbror:null,hafr:false,wood:false,print:false,frameKind:null,frameRodQty:'',frameForDoors:''}};
  render();
}

function addRod(kind){
  const isFrame = kind==='frame';
  const st = isFrame?state.fr:state.br;
  if(!st.code){toast('اختر اللون (كود الباب) الأول — الحلق/البرور بيتصنّع بلون');return;}
  const dName = (DOORS.find(x=>x.code===doorCode_(st.code))||{}).name || '';

  // بيضيف/بيجمّع سطر عود واحد في السلة (كل مقاس سطر مستقل)
  const push = (spec, cm, qty, perM, titleAr, titleEn) => {
    const key = kind+'|'+spec+'|'+cm+'|'+st.code+'|'+(st.doorW||'');
    const ex = state.cart.find(it=>it.kind===kind && it.key===key);
    if(ex){ ex.qty += qty; return; }
    state.cart.push({
      kind, key, qty, code:st.code, rodCm:cm, perM,
      price: rodPrice(perM, cm),
      spec:  spec+' — '+cm+' سم'+(st.code?' — '+st.code:''),
      title: titleAr, titleEn,
      doorW: isFrame ? (st.doorW||'') : '', note: isFrame ? (st.note||'') : ''
    });
  };

  let added = 0;
  let addedIsSet = false;
  if(isFrame){
    const f = FRAMES.find(x=>x.cm===st.cm)||FRAMES[0];
    const forDoor = st.doorW ? ' — لباب '+st.doorW+' سم' : '';
    // ⚠️ ده كان اسمه kind كمان — وبيحجب باراميتر الدالة نفسه (frame/bror) جوّه
    // البلوك ده. اشتغل صح بالصدفة لأن push() اتعرّفت قبله فبتقفل على الأصلي،
    // والسطر اللي جاي بيكتب 'frame' بالنص بدل ما يستعمل المتغيّر. أي سطر جديد
    // يستعمل kind هنا كان هيقارن بـ'full' من غير ما حد ياخد باله.
    const frameMode = st.kind==='rods' ? 'rods' : 'full';
    if(frameMode==='full'){
      const qty = rodQty_(st.qty);
      const jambCm = Math.max(1, frCm_(st.jambCm)||220);
      const headerCm = Math.max(1, frCm_(st.headerCm)||110);
      const extra = (st.extra||[]).map(x=>({cm:Math.max(0,frCm_(x.cm)), qty:rodQty_(x.qty)})).filter(x=>x.cm>0 && x.qty>0);
      const isStd = (jambCm===220 && headerCm===110 && !extra.length);
      if(qty<=0){toast('اكتب الكمية');return;}
      if(isStd){
        // الحالة الاستاندر: سطر واحد "حلق كامل" بعدد الأطقم — من غير تفاصيل قائم/عارضة حلق علوية/الطول لأنها معروفة للمصنع
        const setPrice = Math.round((rodPrice(f.price,220)*JAMBS_PER_SET + rodPrice(f.price,110)*HEADERS_PER_SET)*100)/100;
        const key = 'frame|fullset|'+f.cm+'|'+st.code+'|'+(st.doorW||'');
        const ex = state.cart.find(it=>it.kind===kind && it.key===key);
        if(ex){ ex.qty += qty; }
        else{
          state.cart.push({
            kind:'frame', key, qty, code:st.code, rodCm:0, isSet:true, perM:f.price, price:setPrice, frCm:f.cm,
            spec: 'حلق كامل '+f.cm+' سم'+(st.code?' — '+st.code:''),
            title: 'حلق كامل باب '+f.cm+' سم'+(st.code?' — '+st.code+(dName?' '+dName:''):'')+forDoor+(st.note?' — ملاحظة: '+st.note:''),
            titleEn: 'Full Door Frame '+f.cm+' cm'+(st.code?' - '+st.code:''),
            doorW: st.doorW||'', note: st.note||''
          });
        }
        added += qty;
        addedIsSet = true;
      } else {
        // ⚠️ كان بيتقسّم لسطرين/تلاتة (قائم لوحده، عارضة حلق علوية لوحدها، أي عود إضافي لوحده)
        // كل واحد بمقاسه في سطر مستقل بالسلة. طلب إن ده يبقى سطر واحد بعدد الأعواد
        // الإجمالي (زي "٣ أعواد")، والأطوال المختلفة تتكتب في وصف السطر نفسه.
        const jamb = qty*JAMBS_PER_SET;
        const header = qty*HEADERS_PER_SET;
        const parts = [];
        if(jamb)   parts.push({label:'قائم',        cm:jambCm,   qty:jamb});
        if(header) parts.push({label:'عارضة حلق علوية', cm:headerCm, qty:header});
        extra.forEach(x=>{ if(x.qty>0) parts.push({label:'عود', cm:x.cm, qty:x.qty}); });

        const totalQty = parts.reduce((s,p)=>s+p.qty,0);
        if(totalQty>0){
          const totalPrice = parts.reduce((s,p)=>s+rodPrice(f.price,p.cm)*p.qty,0);
          // ⚠️ التقريب لقرشين هنا كان بيخلي (سعر العود × العدد) ≠ مجموع الأعواد
          // الحقيقي — ٤ قروش فرق على سطر واحد، وبتكبر مع الطلبات الكبيرة.
          const avgPrice = Math.round((totalPrice/totalQty)*10000)/10000;
          const breakdown = parts.map(p=>p.label+' '+p.cm+' سم × '+p.qty).join(' + ');
          const sig = parts.map(p=>p.cm+':'+p.qty).join(',');
          const key = 'frame|customset|'+f.cm+'|'+sig+'|'+st.code+'|'+(st.doorW||'');
          const ex = state.cart.find(it=>it.kind===kind && it.key===key);
          if(ex){ ex.qty += totalQty; ex.setsQty=(ex.setsQty||0)+qty; }
          else{
            state.cart.push({
              kind:'frame', key, qty:totalQty, code:st.code, rodCm:jambCm, perM:f.price, price:avgPrice, frCm:f.cm,
              customSet:true, setsQty:qty, jambCm, headerCm, extra,
              spec: breakdown+(st.code?' — '+st.code:''),
              title: 'حلق باب '+f.cm+' سم — '+breakdown+(st.code?' — '+st.code+(dName?' '+dName:''):'')+forDoor+(st.note?' — ملاحظة: '+st.note:''),
              titleEn: 'Door Frame '+f.cm+' cm - '+parts.map(p=>p.label+' '+p.cm+'cm x'+p.qty).join(' + ')+(st.code?' - '+st.code:''),
              doorW: st.doorW||'', note: st.note||''
            });
          }
          added += totalQty;
        }
      }
      // برور مع الحلق الكامل: سطر برور عادي (نفس لون الحلق) بعدد = عدد البرور لكل طقم × الأطقم.
      // بنفس مفتاح سطر «برور فقط» عشان لو نفس المقاس/اللون موجود يتجمّعوا.
      if(st.brSize){
        const perSet = rodQty_(st.brQty);
        const bb = BRORS.find(x=>x.size===st.brSize);
        if(bb && perSet>0){
          const brTotal = Math.round(perSet*qty*100)/100;
          const rodCm = (st.brLen===''||st.brLen==null) ? BROR_ROD_CM : Math.max(1, frCm_(st.brLen)||BROR_ROD_CM);
          const spec = bb.size+' — '+rodCm+' سم'+(st.code?' — '+st.code:'');
          const bkey = 'bror|'+bb.size+'|'+rodCm+'|'+st.code+'|';
          const bex = state.cart.find(it=>it.kind==='bror' && it.key===bkey);
          if(bex){ bex.qty = Math.round((Number(bex.qty)+brTotal)*100)/100; }
          else{
            state.cart.push({
              kind:'bror', key:bkey, qty:brTotal, code:st.code, rodCm, perM:bb.price,
              price: rodPrice(bb.price, rodCm), spec,
              title: 'برور '+bb.size+' — عود '+rodCm+' سم'+(st.code?' — '+st.code+(dName?' '+dName:''):''),
              titleEn: 'Bror '+bb.size+' - '+rodCm+'cm rod'+(st.code?' - '+st.code:''),
              doorW:'', note:''
            });
          }
        }
      }
    } else {
      const rods = rodQty_(st.rods);   // بيقبل الكسور — نص عود/ربع عود تكملة
      // ⚠️ الطول بقى بيقبل كسور (220.5) في الشاشة، لكن الإضافة الفعلية كانت
      // لسه بتقرّبه لصحيح — فاللي بيتحفظ في الطلب غير اللي المستخدم كتبه.
      const rodsCm = Math.max(0, frCm_(st.rodsCm));
      if(rods<=0 || rodsCm<=0){toast('اكتب عدد الأعواد وطولها');return;}
      push(f.cm+' سم', rodsCm, rods, f.price,

        'حلق باب '+f.cm+' سم — عود '+rodsCm+' سم'+(st.code?' — '+st.code+(dName?' '+dName:''):'')+forDoor+(st.note?' — ملاحظة: '+st.note:''),
        'Door Frame '+f.cm+' cm - rod '+rodsCm+'cm'+(st.code?' - '+st.code:''));
      added += rods;
    }
    // ⚠️ الافتراضيات ٢٢٠/١١٠ بالسنتي — لو الشاشة واقفة على المتر لازم تتكتب
    // بالمتر، وإلا الطلب اللي بعده يطلع «٢٢٠ متر».
    state.fr.jamb=2; state.fr.header=1;
    state.fr.jambCm=lenFromCm_(220, state.fr.unit); state.fr.headerCm=lenFromCm_(110, state.fr.unit);
    state.fr.extra=[]; state.fr.rods=''; state.fr.rodsCm=''; state.fr.doorW=''; state.fr.note=''; state.fr.qty=1; state.fr.nonStd=false;
    state.fr.brSize=''; state.fr.brQty=5; state.fr.brLen='';
  } else {
    const b = BRORS.find(x=>x.size===st.size)||BRORS[0];
    const rods = rodQty_(st.rods);
    if(rods<=0){toast('اكتب عدد العيدان');return;}
    // طول العود قابل للتغيير (افتراضيًا الطول القياسي) — عشان لو حد طلب عيدان مقاس مختلف زي ٣م
    const rodCm = brRodCm_(st.len===''||st.len==null ? BROR_ROD_M_DEFAULT : st.len, st.unit);
    push(b.size, rodCm, rods, b.price,
      'برور '+b.size+' — عود '+rodCm+' سم'+(st.code?' — '+st.code+(dName?' '+dName:''):''),
      'Bror '+b.size+' - '+rodCm+'cm rod'+(st.code?' - '+st.code:''));
    added = rods;
    state.br.rods=1; state.br.len=lenFromCm_(rodCm, state.br.unit) || BROR_ROD_M_DEFAULT;
  }

  saveCart_();
  clearPulledLine_();
  toast(addedIsSet ? ('اتضاف '+added+' طقم حلق كامل') : ('اتضاف '+added+' عود'));
  render();
}

// معبرة: العرض والارتفاع بالسم — الاستاندر (عرض الباب × 215) أو مقاس خاص مكتوب
function mbDims_(){
  const m = state.mb;
  if(m.custom) return { w:Number(decIn_(m.w))||0, h:Number(decIn_(m.h))||0 };
  return { w:Number(m.doorW)||0, h:DOOR_STD_HEIGHT };
}
// سمك الحيطة: واحد من الاستاندر (10/15/20) أو مقاس آخر مكتوب بالإيد
function mbWall_(){
  const m = state.mb;
  if(m.wallCustom){ const n = Number(decIn_(m.wallTxt)); return n>0 ? Math.round(n*100)/100 : 0; }
  return Number(m.wall)||0;
}
function mbQty_(){ return Math.max(0, Math.round(Number(decIn_(String(state.mb.qty==null?'':state.mb.qty)))||0)); }
function mbNum_(n){ return String(Math.round(Number(n)*100)/100); }
function mbSpec_(wall, h, w){ return wall+' سم — '+mbNum_(h)+'×'+mbNum_(w); }
function parseMabraSpec_(spec){
  const m = /^(\d+(?:\.\d+)?)\s*سم\s*—\s*(\d+(?:\.\d+)?)×(\d+(?:\.\d+)?)/.exec(String(spec||'').trim());
  return m ? { wall:Number(m[1]), h:Number(m[2]), w:Number(m[3]) } : null;
}
function mbBtnLabel_(){
  const st=state.mb, d=mbDims_(), q=mbQty_();
  if(!st.code) return 'اختر اللون الأول (كود الباب)';
  if(!(mbWall_()>0)) return 'اكتب سمك الحيطة';
  if(!(d.w>0)) return st.custom ? 'اكتب عرض المعبرة' : 'اختر العرض';
  if(!(d.h>0)) return 'اكتب ارتفاع المعبرة';
  if(!(q>0)) return 'اكتب عدد المعابر';
  return `أضف ${q} معبرة — ${mbNum_(mbWall_())} سم — ${mbNum_(d.h)}×${mbNum_(d.w)} — ${st.code}`;
}
// بيتحدّث من غير render كامل عشان الكيبورد ما يقفلش وإحنا بنكتب

  toast('اتضاف '+qty+' معبرة');
