// بيبني order object موحّد من بيانات شاشة المصنع (list + orderItems) — مستخدم في تصدير الـ PDF وفي مشاركة الصورة
// السيرفر بيخزّن اسم الصنف بالإنجليزي بس (Order_Items عمود Item). بنعيد بناء الاسم العربي
// من نفس الكتالوجات اللي التطبيق أصلًا شغال بيها (DOORS/ACCESSORIES)، مش نص إنجليزي متسيّب.
const ACC_EN_TO_AR_ = {}; ACCESSORIES.forEach(a=>{ ACC_EN_TO_AR_[a.en] = a.name; });
function arabicItemTitle_(it){
  if(it.type==='Door'){
    const d = DOORS.find(x=>x.code===it.code);
    const base = d ? ('باب '+d.code+' '+d.name) : (it.code||it.title||'');
    return base + (String(it.milling||'').trim() ? ' (حفر)' : '') + (it.itemNote ? ' — '+it.itemNote : '');
  }
  // المقاس محفوظ إنجليزي في الشيت ('10 cm' / '6x9')، والمستند عربي —
  // arabicSizeText_ بتحوّله لـ '10 سم' وبتسيب اللي مش على الصيغة دي زي ما هو.
  if(it.type==='Frame'){
    let t = 'حلق '+arabicSizeText_(it.size||'')+(it.code?' — '+it.code:'');
    if(it.forDoorWidth) t += ' — لباب '+it.forDoorWidth+' سم';
    if(it.itemNote) t += ' — '+it.itemNote;
    return t;
  }
  if(it.type==='Bror'){
    let t = 'برور '+arabicSizeText_(it.size||'')+(it.code?' — '+it.code:'');
    if(it.forDoorWidth) t += ' — لباب '+it.forDoorWidth+' سم';
    if(it.itemNote) t += ' — '+it.itemNote;
    return t;
  }
  if(it.type==='Panel') return 'لوح بروديوم'+(it.code?' — '+it.code:'');
  return ACC_EN_TO_AR_[it.title] || it.title || '';
}

// السيرفر بيخزّن المقاس بالإنجليزي ("70 cm" أو "80x210 cm (custom)") — بنحوّله لنفس صيغة
// العميل العربية ("70 سم" أو "80×210 سم (مقاس خاص)") قبل ما نعرضه في أي مستند
function arabicSizeText_(sizeEn){
  const s = String(sizeEn||'').trim();
  let m = /^(\d+)\s*cm$/i.exec(s);
  if(m) return m[1]+' سم';
  m = /^(\d+)\s*x\s*(\d+)\s*cm\s*\(custom\)$/i.exec(s);
  if(m) return m[1]+'×'+m[2]+' سم (مقاس خاص — مقاس الفتحة المعمارية)';
  return s;
}

function buildAdminDocOrder_(o, its, tierKey){
  return {
    id:o.id, ts:o.date?new Date(o.date).getTime():Date.now(),
    name:o.dist, phone:o.phone, region:o.region, warehouse:'', total:o.total,
    customer:o.customer||'', note:o.ordNote||'',
    // ⚠️ الحقول دي مكانتش بتتنقل خالص، فمستند المصنع كان بيطبع رقم الطلب الداخلي
    // الطويل (#2026-xxxx) بدل الرقم التسلسلي اللي العميل شايفه في تطبيقه.
    // يعني الورقة اللي في المصنع والورقة اللي مع العميل رقمين مختلفين لنفس الطلب.
    displayNo: o.displayNo || '', editCount: Number(o.editCount)||0, replacesId: o.replacesId || '',
    editedAt: o.editedAt || '',
    priceTierLabel: tierKey ? (PRICE_TIERS[tierKey]||PRICE_TIERS.dist).label : '',
    items: its.map(it=>{
      // المقاس بيتخزّن إنجليزي في الشيت ('10 cm')؛ بنعرّبه لكل الأنواع مش الأبواب بس
      const sz = it.type==='Door' ? doorSizeText_(arabicSizeText_(it.size), it.doorHeight)
                                  : arabicSizeText_(it.size||'');
      const kind = it.type==='Door'?'door':(it.type==='Frame'?'frame':(it.type==='Bror'?'bror':(it.type==='Panel'?'panel':'acc')));
      const price = tierKey ? tierPrice(it.unitPrice||0, kind, tierKey, tierKeyFor_(it, kind)) : (it.unitPrice||0);
      return {
        kind, title: (it.avail===false?'⚠️ غير متاح — ':'') + arabicItemTitle_(it),
        code: it.code||'',
        sizeTxt: sz, sizeEn: it.size||'', spec: sz, unit: it.unit||'', qty: it.qty||0,
        // ⚠️ باج كان هنا: السيرفر بيخزّن وحدة الحلق الكامل كـ 'set'، والمستند بيقرا
        // it.isSet عشان يكتب «طقم». الحقل ده مكانش بيتنقل خالص، فسطر فيه ٥ أطقم كان
        // بيتطبع «٥ عود» — والطقم ٣ عيدان، يعني المصنع يقطّع ٥ بدل ١٥.
        isSet: String(it.unit||'') === 'set',
        rodCm: (String(it.unit||'').match(/^rod\s+(\d+)/)||[])[1] || '',
        unitPrice: price, price: price,
        frame: it.frame||'', dbror: it.dbror||'', frameHeight: it.frameHeight||'', doorHeight: it.doorHeight||'',
        produced: it.produced
      };
    })
  };
}

// بيبني مستند PDF للطلب من بيانات شاشة المصنع (بعد ما أصنافه تتحمّل)
// بيبني صف تلات مستويات (جملة/معرض/عميل) لصنف معيّن — سعر الجملة هو الأساسي، والباقي بيتاخد من القيمة
// المحفوظة له لو موجودة، وإلا بتتحسب مبدئيًا بالزيادة الافتراضية لحد ما تحفظ إنت قيمة تانية بنفسك.
function triFor_(basePrice, kind, key){
  return {
    dist: basePrice,
    showroom: tierPrice(basePrice, kind, 'showroom', key),
    customer: tierPrice(basePrice, kind, 'customer', key)
  };
}
function openAdminPrices(){
  state.admin.priceEdit = {
    sizes: Object.fromEntries(SIZES.map(s=>[s.w, triFor_(s.price,'door',s.w)])),
    customExtra: triFor_(CUSTOM_EXTRA,'door','customExtra'),
    hafrExtra: triFor_(HAFR_EXTRA,'door','hafrExtra'),
    frames: Object.fromEntries(FRAMES.map(f=>[f.cm, triFor_(f.price,'frame',f.cm)])),
    brors: Object.fromEntries(BRORS.map(b=>[b.size, triFor_(b.price,'bror',b.size)])),
    acc: Object.fromEntries(ACCESSORIES.map(a=>[a.id, triFor_(a.price,'acc',a.id)])),
    panel: {prodium: triFor_(PRODIUM_PRICE,'panel','prodium')}
  };
  state.admin.pricesOpen = true;
  render(); window.scrollTo({top:0,behavior:'smooth'});
}

function saveAdminPrices(){
  const pe = state.admin.priceEdit; if(!pe) return;
  SIZES.forEach(s=>{ if(pe.sizes[s.w]) s.price=Number(pe.sizes[s.w].dist)||0; });
  CUSTOM_EXTRA = Number(pe.customExtra.dist)||0;
  if(pe.hafrExtra) HAFR_EXTRA = Number(pe.hafrExtra.dist)||0;
  FRAMES.forEach(f=>{ if(pe.frames[f.cm]) f.price=Number(pe.frames[f.cm].dist)||0; });
  BRORS.forEach(b=>{ if(pe.brors[b.size]) b.price=Number(pe.brors[b.size].dist)||0; });
  ACCESSORIES.forEach(a=>{ if(pe.acc[a.id]) a.price=Number(pe.acc[a.id].dist)||0; });
  if(pe.panel && pe.panel.prodium) PRODIUM_PRICE = Number(pe.panel.prodium.dist)||0;

  const pickGroup = (g, tier) => Object.fromEntries(Object.entries(g).map(([k,v])=>[k, Number(v[tier])||0]));
  const out = { dist:{}, showroom:{}, customer:{} };
  ['dist','showroom','customer'].forEach(tier=>{
    out[tier] = {
      sizes: pickGroup(pe.sizes, tier),
      customExtra: Number(pe.customExtra[tier])||0,
      hafrExtra: Number((pe.hafrExtra||{})[tier])||0,
      frames: pickGroup(pe.frames, tier),
      brors: pickGroup(pe.brors, tier),
      acc: pickGroup(pe.acc, tier),
      panel: pickGroup(pe.panel, tier)
    };
  });
  save(LS_PRICES, out);
  TIER_OVERRIDES.showroom = { sizes:{...out.showroom.sizes}, customExtra:out.showroom.customExtra, hafrExtra:out.showroom.hafrExtra, frames:{...out.showroom.frames}, brors:{...out.showroom.brors}, acc:{...out.showroom.acc}, panel:{...out.showroom.panel} };
  TIER_OVERRIDES.customer = { sizes:{...out.customer.sizes}, customExtra:out.customer.customExtra, hafrExtra:out.customer.hafrExtra, frames:{...out.customer.frames}, brors:{...out.customer.brors}, acc:{...out.customer.acc}, panel:{...out.customer.panel} };
  state.admin.pricesOpen=false; state.admin.priceEdit=null;
  toast('اتحفظت الأسعار الجديدة');
  render();
}

// بيفتح واتساب من غير رقم محدد — عكس تدفق العميل بالظبط، هنا المصنع هو اللي بيختار
// يبعت الصورة لمين (موزع/مجموعة/أي حد) بدل ما تتقفل على رقم ثابت.
function openWhatsAppFree(text){
  window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(text),'_blank');
}

// بيجهّز صورة الطلب من شاشة المصنع ويسيب المصنع يختار المستلم بنفسه (زرار "📤 إرسال" في كل كارت)
async function shareAdminOrderImage(o){
  await toggleOrderItemsLoadOnly_(o.id);
  const its = state.admin.items[o.id] || [];
  if(!its.length){ toast('مفيش أصناف لهذا الطلب'); return; }
  const doc = buildAdminDocOrder_(o, its);
  const caption = 'طلب أوردر #'+o.id+' — '+(o.dist||'');

  try{ await ensureLib_('html2canvas'); }
  catch(e){
    openWhatsAppFree(caption);
    toast('مفيش نت كفاية لتجهيز الصورة — هيتفتح واتساب بالنص بس');
    return;
  }
  busy(true,'جارٍ تجهيز صورة الطلب…');
  try{
    const {canvas} = await renderPaper_(docHTML(doc,'order'));
    const blob=await new Promise(res=>canvas.toBlob(res,'image/png',0.95));
    const file=new File([blob],'طلب_'+o.id+'.png',{type:'image/png'});

    if(navigator.canShare && navigator.canShare({files:[file]})){
      // شاشة المشاركة الأصلية بتاعة الموبايل — يختار واتساب وبعدين الشخص/المجموعة بنفسه
      await navigator.share({files:[file], title:'طلب أوردر #'+o.id, text:caption});
    } else {
      downloadBlob(blob,'طلب_'+o.id+'.png');
      openWhatsAppFree(caption);
      toast('اتحمّلت صورة الطلب — اختار واتساب والمستلم وارفقها');
    }
  }catch(err){
    if(err && err.name==='AbortError'){ busy(false); return; }
    toast('تعذّر تجهيز صورة الطلب — هيتفتح واتساب بالنص');
    openWhatsAppFree(caption);
  }
  busy(false);
}

// بيجمع الأصناف المتكررة (نفس الاسم/الكود/المقاس) في سطر واحد بكميتهم مجمّعة

// بيرجّع عرض الباب بالسم لو المقاس قياسي ("70 cm") عشان نقدر نجمّع بيه، أو null لو مقاس خاص/غير قياسي
function doorWidthGroup_(sizeStr){

}

// ============================================================
// تقرير الأبواب المعلّقة — كل عميل، كل طلب بتاريخه، الأبواب مقسّمة حسب المقاس
// (الطلبات المؤرشفة مستبعدة أصلًا من listWithItems؛ هنا كمان بنستبعد الملغي)
// ============================================================
function buildPendingDoorsData_(orders){
  const pending = orders.filter(o=>o.status!=='Cancelled');
  const byCustomer = {}, order = [];
  pending.forEach(o=>{
    // التقرير ده للأبواب بس — الطلبات اللي مفيهاش أبواب (إكسسوارات أو حلق/برور فقط)
    // بتتشال من الأساس عشان ما تظهرش كعناوين فاضية بإجمالي صفر
    if(!(o.items||[]).some(it=>it.type==='Door')) return;
    // التجميع بقى على **صاحب الأوردر** — لو مفيش، بنرجع لصاحب الحساب
    const key = (o.customer && o.customer.trim()) || o.dist || '—';
    if(!byCustomer[key]){ byCustomer[key]=[]; order.push(key); }
    byCustomer[key].push(o);
  });
  return order.map(name=>{
    const ords = byCustomer[name];
    const perOrder = ords.map(o=>{
      const doorItems = (o.items||[]).filter(it=>it.type==='Door');
      const groups={};
      doorItems.forEach(it=>{
        const w = doorWidthGroup_(it.size);
        const key = w!=null ? String(w) : 'خاص';
        (groups[key]=groups[key]||[]).push(it);
      });
      const widths = Object.keys(groups).sort((a,b)=>{
        if(a==='خاص') return 1; if(b==='خاص') return -1; return Number(a)-Number(b);
      });
      return { id:o.id, date:o.date, customer:o.customer||'', phone:o.customerPhone||o.phone||'', groups, widths };
    });
    const total = ords.reduce((s,o)=>s+(o.items||[]).filter(it=>it.type==='Door').reduce((s2,it)=>s2+(Number(it.qty)||0),0),0);
    return { name, perOrder, total };
  }).filter(c=>c.total>0);   // عميل مالوش ولا باب واحد مايظهرش خالص
}

// عدد الأيام من تاريخ الطلب لحد النهاردة — بيتحسب من تاريخ الطلب (yyyy-MM-dd)

// نوتة صنف واحد: بتجمع معلومات الحلق الإضافي/البرور في سطر ملاحظات واحد — زي النموذج المطلوب بالظبط

// بيرجّع أصناف العميل مجمّعة (لو نفس الصنف اتكرر في أكتر من طلب، بيتجمعوا في سطر واحد بالكمية الإجمالية)
function mergedCustomerItems_(cust){
  const merged = {}, order = [];
  cust.perOrder.forEach(o=>{
    o.widths.forEach(w=>{
      o.groups[w].forEach(it=>{
        const frame = it.frame ? frameText_(it.frame, it.frameHeight) : '';
        const size = doorSizeText_(it.size || (w==='خاص'?'خاص':w+' سم'), it.doorHeight);
        const key = [it.code||'', size, frame, it.dbror||''].join('|');
        if(!merged[key]){
          const wh = doorWH_(it.size, it.doorHeight);
          merged[key] = {
            code:it.code||'', size, qty:0, produced:0, frame, dbror: it.dbror||'',
            w:wh.w, h:wh.h, frameW: it.frame||'', frameH: it.frame ? (it.frameHeight||'') : ''
          };
          order.push(key);
        }
        merged[key].qty += Number(it.qty)||0;
        merged[key].produced += itemProdPending_(it).produced;
      });
    });
  });
  return order.map(k=>merged[k]);
}

// ألوان مختلفة لكل عميل عشان جدوله يتفرّق بسرعة عن اللي قبله وبعده
const CUST_TINTS_ = [
  {line:'#1080C0', head:'#EAF2FA'},
  {line:'#C08A3E', head:'#FBF0E1'},
  {line:'#3E9B72', head:'#E7F5EE'},
  {line:'#7C63C4', head:'#F0EAFB'},
  {line:'#C25454', head:'#FBE7E7'},
  {line:'#2C8FA3', head:'#E3F3F7'}
];

// جدول عميل واحد: صنف/مقاس/كمية/حلق/برور — كل عميل بجدوله المستقل ولونه الخاص
// حالة توفّر الصنف بالمخزن: أخضر = متاح بالكامل، أصفر = الكمية أكبر من المتاح جزئيًا، أحمر = مفيش خالص
function stockStatus_(code, size, qty){
  const w = doorWidthGroup_(size);
  const stock = stockFor(code, w!=null ? w : size);
  if(stock===null) return null;   // الأرصدة لسه ما اتحمّلتش
  if(stock<=0) return {color:'#B3261E', bg:'#FBE7E7', label:'غير متاح'};
  if(qty>stock) return {color:'#B8790A', bg:'#FFF4E0', label:'جزئي ('+stock+' متاح)'};
  return {color:'#1E8E52', bg:'#E7F6EC', label:'متاح'};
}

async function buildPendingDoorsExcel_(orders){
  const data = buildPendingDoorsData_(orders);
  if(!data.length){ toast('مفيش طلبات معلّقة'); return; }
  if(!await needLibs_('exceljs')) return;

  const NAVY='FF002050', WHITE='FFFFFFFF', ZEBRA='FFF6F8FA', BORDER_CLR='FFDCE4EC';
  const thin = {style:'thin', color:{argb:BORDER_CLR}};
  const border = {top:thin,left:thin,right:thin,bottom:thin};
  // عمود "ارتفاع الحلق" شرطي على مستوى التقرير كله — بيظهر بس لو صنف واحد على الأقل من كل العملاء متسجّل له ارتفاع حلق فعلي
  const showFrameHCol = data.some(cust=>mergedCustomerItems_(cust).some(it=>it.frameW && it.frameH));
  const COLS = showFrameHCol ? 8 : 7;
  const PROD_GREEN='FF1E8E52', PEND_RED='FFB3261E';
  const READY_FILL='FFE6F4EA', READY_TXT='FF1E8E52', PEND_FILL='FFFDECEA', PEND_TXT='FFB3261E';

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('الأبواب المعلّقة', { views:[{ rightToLeft:true }] });
  ws.columns = [
    { key:'w',    width:11 },
    { key:'h',    width:11 },
    { key:'code', width:13 },
    { key:'qty',  width:9  },
    { key:'stat', width:14 },
    { key:'frameW',width:11 },
    ...(showFrameHCol ? [{ key:'frameH', width:11 }] : []),
    { key:'bror', width:14 }
  ];

  function mergedRow(text, fillArgb, fontArgb, bold, size){
    const r = ws.addRow([text].concat(Array(COLS-1).fill('')));
    ws.mergeCells(r.number,1,r.number,COLS);
    r.eachCell(c=>{
      c.fill = {type:'pattern',pattern:'solid',fgColor:{argb:fillArgb}};
      c.font = {bold: !!bold, color:{argb:fontArgb}, size: size||11, name:'Arial'};
      c.alignment = {horizontal:'right', vertical:'middle'};
    });
    r.height = 20;
    return r;
  }

  const now = new Date();
  const dateTimeStr = now.toLocaleDateString('ar-EG') + ' — الساعة ' + now.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
  mergedRow('تقرير الأبواب المعلّقة  —  '+dateTimeStr, NAVY, WHITE, true, 13);
  ws.addRow([]);

  const CUST_FILL = ['FF1080C0','FFC08A3E','FF3E9B72','FF7C63C4','FFC25454','FF2C8FA3'];
  const CUST_TINT = ['FFEAF2FA','FFFBF0E1','FFE7F5EE','FFF0EAFB','FFFBE7E7','FFE3F3F7'];
  const STAT_GREEN='FFE7F6EC', STAT_YELLOW='FFFFF4E0', STAT_RED='FFFBE7E7';
  const STAT_GREEN_TXT='FF1E8E52', STAT_YELLOW_TXT='FFB8790A', STAT_RED_TXT='FFB3261E';
  const QTY_COL = 4, STAT_COL = 5;   // أرقام الأعمدة ثابتة بغض النظر عن ظهور "ارتفاع الحلق" — هو آخر عمود قبل البرور بس

  data.forEach((cust,ci)=>{
    const fill = CUST_FILL[ci % CUST_FILL.length];
    const tint = CUST_TINT[ci % CUST_TINT.length];
    mergedRow('صاحب الطلب: '+cust.name, fill, WHITE, true, 13);

    function subHeader_(bg, txt, title){
      const r = mergedRow(title, bg, txt, true, 11);
      r.height = 18;
      return r;
    }
    function colHeader_(){
      const labels = ['عرض الفتحة المعمارية','ارتفاع الفتحة المعمارية','الكود','الكمية','حالة المخزن','عرض الحلق']
        .concat(showFrameHCol?['ارتفاع الحلق']:[]).concat(['البرور']);
      const hdr = ws.addRow(labels);
      hdr.eachCell(c=>{
        c.fill = {type:'pattern',pattern:'solid',fgColor:{argb:fill}};
        c.font = {bold:true, color:{argb:WHITE}, name:'Arial', size:10.5};
        c.alignment = {horizontal:'center'};
        c.border = border;
      });
    }
    function itemRow_(it, idx, qtyVal, qtyColor){
      const st = stockStatus_(it.code, it.size, it.qty);
      const statTxt = st ? st.label : '—';
      const frameHTxt = it.frameW ? (it.frameH||'استاندر') : '—';
      const vals = [it.w||'—', it.h||'—', it.code, qtyVal, statTxt, it.frameW||'—']
        .concat(showFrameHCol?[frameHTxt]:[]).concat([it.dbror||'—']);
      const row = ws.addRow(vals);
      row.eachCell((c,colNo)=>{
        c.alignment = {horizontal:'center'};
        c.border = border;
        c.font = {name:'Arial', size:10.5, bold: colNo===QTY_COL||colNo===STAT_COL, color: colNo===QTY_COL?{argb:qtyColor}:(colNo===STAT_COL&&st?{argb: st.color==='#1E8E52'?STAT_GREEN_TXT:(st.color==='#B8790A'?STAT_YELLOW_TXT:STAT_RED_TXT)}:undefined)};
        c.fill = {type:'pattern',pattern:'solid',fgColor:{argb: colNo===STAT_COL&&st ? (st.color==='#1E8E52'?STAT_GREEN:(st.color==='#B8790A'?STAT_YELLOW:STAT_RED)) : (idx%2===1 ? ZEBRA : WHITE)}};
      });
    }
    function emptyRow_(text){
      const row = ws.addRow([text].concat(Array(COLS-1).fill('')));
      ws.mergeCells(row.number,1,row.number,COLS);
      row.eachCell(c=>{ c.border=border; c.alignment={horizontal:'center'}; c.font={name:'Arial', size:10.5, color:{argb:'FF8A97A6'}}; });
    }

    const items = mergedCustomerItems_(cust);
    let total = 0, totalProduced = 0;
    items.forEach(it=>{ total += it.qty; totalProduced += it.produced; });
    const readyItems = items.filter(it=>it.produced>0);
    const pendingItems = items.filter(it=>(it.qty-it.produced)>0);

    subHeader_(READY_FILL, READY_TXT, '✅ جاهز للتسليم');
    colHeader_();
    if(readyItems.length) readyItems.forEach((it,idx)=>itemRow_(it, idx, it.produced, PROD_GREEN));
    else emptyRow_('مفيش حاجة جاهزة لسه');

    ws.addRow([]);
    subHeader_(PEND_FILL, PEND_TXT, '⏳ لسه متبقي / تحت التنفيذ');
    colHeader_();
    if(pendingItems.length) pendingItems.forEach((it,idx)=>itemRow_(it, idx, it.qty-it.produced, PEND_RED));
    else emptyRow_('مفيش حاجة متبقية 🎉');

    mergedRow('إجمالي عدد الأبواب:  '+total+'   (جاهز '+totalProduced+' · متبقي '+(total-totalProduced)+')', tint, NAVY, true, 12);
    ws.addRow([]);
  });

  const codesTxt = DOORS.map(d=>d.code).join('، ');
  mergedRow('الأكواد المتاحة: '+codesTxt+'  |  المقاسات المتاحة (سم): 60، 70، 80، 90، 100', 'FFF7F9FB', 'FF6B7A8C', false, 9.5);

  // هامش الطباعة: رقم الصفحة بس (من غير سطر إعداد)
  wb.worksheets.forEach(w=>{
    w.headerFooter = w.headerFooter || {};
    w.headerFooter.oddFooter = '&L&9Page &P of &N';
  });

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const fname = 'تقرير_الأبواب_المعلقة_'+isoLocal_()+'.xlsx';
  await shareOrDownload_(blob, fname, fname);
}

// بيجيب بيانات الطلبات المعلّقة بالتفصيل من السيرفر — مشتركة بين التلات أزرار التصدير
async function fetchPendingOrders_(){
  if(!APPS_SCRIPT_URL || !state.admin.pw) return null;
  const d = await jsonp(APPS_SCRIPT_URL + '?action=listWithItems' + admParams_(), 25000);
  if(!d || !d.ok) throw new Error((d && d.error) || 'رد غير متوقع');
  const orders = d.orders || [];
  if(!orders.length){ toast('مفيش طلبات لسه'); return null; }
  return orders;
}

// معاينة طلب العميل على الشاشة — نفس اللي بيطلع في الـ PDF بالظبط، بس من غير
// html2canvas ولا jsPDF خالص. فبتفتح فورًا (بدل ثواني تجهيز الـ PDF)، والمصنع
// يقدر يراجع الطلب وياخد قراره، ولو عايز الملف يضغط «تصدير PDF» من جوه المعاينة.
// ⚠️ النسخة الأولى من المعاينة كانت بطيئة جدًا وأحيانًا ماكانتش بتفتح خالص، لسببين:
//   ١) كانت بتنده loadStock(true) — والمستند ده مابيستخدمش الأرصدة أصلًا، نداء ملهوش لازمة
//   ٢) كانت بتنده fetchPendingOrders_() اللي بتجيب **كل** الطلبات بكل أصنافها من السيرفر
//      (listWithItems)، مع إن بيانات الطلبات موجودة قدامنا في الشاشة أصلًا.
// يعني نداءين تقال قبل ما أي حاجة تظهر، وأي واحد فيهم يفشل = المعاينة ما تفتحش.
//
// دلوقتي: بيانات الطلب بتتاخد من الشاشة على طول، والأصناف من الكاش لو محمّلة قبل كده
// (لو المصنع فتح «الأصناف» للطلب)، وإلا بنجيب أصناف الطلبات دي بس — نداء صغير لكل
// طلب بدل نداء واحد ضخم بكل طلبات المصنع.
async function previewCustomerOrder_(name){
  if(!name) return;
  const a = state.admin;
  if(a.groupPreviewBusy) return;

  // الطلبات موجودة في الشاشة خلاص — مفيش داعي نسأل السيرفر عنها تاني
  const list = (a.viewArchive ? a.archRows : a.rows) || [];
  const mine = list.filter(o => (String(o.customer||'').trim() || 'بدون اسم') === name);
  if(!mine.length){ toast('مفيش طلبات للعميل ده في الشاشة'); return; }

  a.groupPreviewBusy = name; render();
  try{
    // نجيب أصناف الطلبات اللي لسه ماتحمّلتش بس. بالتوازي عشان السرعة، بس على دفعات
    // من 4 — عميل عنده 15 طلب معلّق كان هيبعت 15 نداء لـ Apps Script في نفس اللحظة،
    // وده بيقرّب من حد التنفيذ المتوازي عنده وممكن بعض النداءات ترجع فاضية.
    const need = mine.filter(o => !a.items[o.id]);
    for(let i = 0; i < need.length; i += 4){
      await Promise.all(need.slice(i, i+4).map(o => loadOrderItems_(o.id).catch(()=>null)));
    }

    const html = mine.map(o => {
      const its = a.items[o.id] || [];
      return docHTML(buildAdminDocOrder_(o, its), 'order');
    }).join('<div style="height:18px"></div>');

    showReportPreview_(html, name);
  }catch(err){
    toast('تعذّر فتح المعاينة: ' + (err.message || err));
  }
  a.groupPreviewBusy = null; render();
}

// بتجيب أصناف طلب واحد وتكاشهم. بترجّع من غير أي نداء لو محمّلين خلاص.
async function loadOrderItems_(id){
  if(state.admin.items[id]) return state.admin.items[id];
  const d = await jsonp(APPS_SCRIPT_URL
    + '?action=orderItems' + admParams_()
    + '&id=' + encodeURIComponent(id));
  if(d && d.ok) state.admin.items[id] = d.items || [];
  return state.admin.items[id] || [];
}

// بتعرض HTML التقرير في طبقة فوق الشاشة، مصغّر ليدخل في عرض الموبايل.
// التقرير مرسوم بعرض A4 ثابت (794 بكسل)، فبنعمله scale حسب عرض الشاشة
// عشان يتقري من غير تمرير أفقي.
function showReportPreview_(html, title){
  const old = document.getElementById('reportPreviewOverlay'); if(old) old.remove();
  const ov = document.createElement('div');
  ov.id = 'reportPreviewOverlay';
  ov.className = 'rpv';
  ov.innerHTML = `
    <div class="rpv-bar">
      <b>معاينة — ${esc(title||'')}</b>
      <button class="rpv-pdf" data-act="rpv-pdf" data-name="${esc(title||'')}">${ico('doc')}تصدير PDF</button>
      <button class="rpv-x" data-act="rpv-close" aria-label="إغلاق المعاينة">${ico('x')}</button>
    </div>
    <div class="rpv-scroll"><div class="rpv-fit"><div class="rpv-page">${html}</div></div></div>`;
  document.body.appendChild(ov);

  // نظبط التصغير حسب عرض الشاشة
  const fit = () => {
    const page = ov.querySelector('.rpv-page');
    const fitBox = ov.querySelector('.rpv-fit');
    const wrap = ov.querySelector('.rpv-scroll');
    if(!page || !fitBox || !wrap) return;
    const natural = 794;                        // نفس عرض #paper — مثبّت في الـ CSS
    const avail = Math.max(200, wrap.clientWidth - 16);
    const k = Math.min(1, avail / natural);
    page.style.transform = k < 1 ? 'scale(' + k + ')' : 'none';
    fitBox.style.width  = Math.round(natural * k) + 'px';
    fitBox.style.height = Math.round(page.offsetHeight * k) + 'px';
  };
  requestAnimationFrame(()=>{ fit(); setTimeout(fit, 250); });   // تاني مرة بعد ما الصور تتحمّل
  ov._fit = fit;
  window.addEventListener('resize', fit);

  // الضغط في أي مكان فاضي بره الورقة بيقفل — منطقة التمرير بتملى الشاشة،
  // فلازم نحسبها هي كمان مش الطبقة الخارجية بس.
  ov.addEventListener('click', e=>{
    if(e.target===ov || e.target.classList.contains('rpv-scroll')) closeReportPreview_();
  });
}

function closeReportPreview_(){
  const ov = document.getElementById('reportPreviewOverlay');
  if(!ov) return;
  if(ov._fit) window.removeEventListener('resize', ov._fit);
  ov.remove();
}

// ============================================================
// تصدير إكسيل — تقرير الطلبات (شاشة المصنع) — منظّم بالعربي، مجمّع لكل عميل
// بنفس روح تصميم تقرير الأبواب المعلّقة/الـ PDF الشامل (لوجو + ألوان + عناوين عربي)
// ============================================================
const ITEM_TYPE_AR_ = { 'Door':'باب', 'Frame':'حلق', 'Bror':'برور', 'Panel':'لوح بروديوم' };
function itemTypeAr_(t){ return ITEM_TYPE_AR_[t] || 'إكسسوار'; }
function itemUnitAr_(u){
  const s = String(u||'').trim();
  if(s==='door') return 'باب';
  if(s==='pc') return 'قطعة';
  if(/^rod\s/.test(s)) return 'عود '+s.replace(/^rod\s/,'')+ (/م$/.test(s)?'':'م');
  return s || '—';
}
// لو الصنف باب معروف (كود من A01..A10) بنرجّع اسمه العربي بدل الاعتماد على النص الإنجليزي المخزّن
function itemNameAr_(it){
  if(it.type==='Door'){
    const d = DOORS.find(x=>x.code===it.code);
    if(d) return 'باب '+d.name+' — '+it.code;
  }
  return it.title || it.code || '—';
}

function buildAdminOrdersDetail_(orders){
  const byCustomer = {}, order = [];
  orders.forEach(o=>{
    const key = o.dist || '—';
    if(!byCustomer[key]){ byCustomer[key]=[]; order.push(key); }
    byCustomer[key].push(o);
  });
  return order.map(name=>{
    const ords = byCustomer[name];
    const codeTotals = {}; // key: type+code -> {label, qty}
    let clientQty = 0, clientProduced = 0;
    ords.forEach(o=>(o.items||[]).forEach(it=>{
      const qty = Number(it.qty)||0;
      const pp = itemProdPending_(it);
      clientQty += qty; clientProduced += pp.produced;
      const key = it.type+'|'+(it.code||it.title||'')+(it.isSet?'|set':'');
      if(!codeTotals[key]) codeTotals[key] = { type:it.type, code:it.code||'', name:itemNameAr_(it), qty:0, produced:0 };
      codeTotals[key].qty += qty;
      codeTotals[key].produced += pp.produced;
    }));
    return { name, orders:ords, clientQty, clientProduced, clientPending: clientQty-clientProduced, codeTotals: Object.values(codeTotals).sort((a,b)=>b.qty-a.qty) };
  });
}

async function buildAdminOrdersExcel_(orders){
  if(!orders.length){ toast('مفيش طلبات'); return; }
  if(!await needLibs_('exceljs')) return;

  // أبواب بس — زي الـ PDF بالظبط: بنشيل الإكسسوارات والحلق/البرور المنفصلين،
  // وأي طلب مابقاش فيه ولا باب بيتشال بالكامل من التلات شيتات.
  orders = orders
    .map(o=>Object.assign({}, o, { items:(o.items||[]).filter(it=>it.type==='Door') }))
    .filter(o=>o.items.length);
  if(!orders.length){ toast('مفيش أبواب في الطلبات الحالية'); return; }

  // عمود "ارتفاع الحلق" شرطي على مستوى المصنَّف كله (زي docHTML/reportHTML) — يظهر بس لو صنف باب
  // واحد على الأقل في كل الطلبات متسجّل له عرض حلق + ارتفاع حلق مع بعض.
  const showFrameHCol = orders.some(o=>(o.items||[]).some(it=>it.frame && it.frameHeight));

  busy(true,'جارٍ تجهيز الإكسيل…');

  const NAVY='FF002050', BRAND='FF1080C0', LIGHT='FFEAF2FA', WHITE='FFFFFFFF',
        BORDER_CLR='FFDCE4EC', ZEBRA='FFF7FAFC';
  const thin = {style:'thin', color:{argb:BORDER_CLR}};
  const border = {top:thin,left:thin,right:thin,bottom:thin};
  const FONT='Arial';

  const wb = new ExcelJS.Workbook();
  wb.creator = COMPANY_AR;
  wb.created = new Date();

  let logoImgId = null;
  try{ const lb64 = await logoBase64_(); if(lb64) logoImgId = wb.addImage({ base64: lb64, extension:'png' }); }catch(e){}

  function addHeaderBand_(ws, lastCol, title, subtitle){
    ws.mergeCells(1,1,3,1);
    ws.getRow(1).height = 26; ws.getRow(2).height = 20; ws.getRow(3).height = 18;
    if(logoImgId){ ws.addImage(logoImgId, { tl:{col:0.15, row:0.15}, ext:{width:58, height:58} }); }
    ws.mergeCells(1,2,1,lastCol);
    const tCell = ws.getCell(1,2);
    tCell.value = title;
    tCell.font = {bold:true, size:16, color:{argb:NAVY}, name:'Arial'};
    tCell.alignment = {horizontal:'right', vertical:'middle'};
    ws.mergeCells(2,2,2,lastCol);
    const sCell = ws.getCell(2,2);
    sCell.value = subtitle;
    sCell.font = {size:10.5, color:{argb:'FF6B7A8C'}, name:'Arial'};
    sCell.alignment = {horizontal:'right', vertical:'middle'};
    ws.mergeCells(3,2,3,lastCol);
    ws.getCell(3,2).border = {bottom:{style:'medium', color:{argb:BRAND}}};
    ws.getCell(3,1).border = {bottom:{style:'medium', color:{argb:BRAND}}};
    return 4;
  }

  // ---------- ورقة 1: ملخص الطلبات ----------
  const wsSum = wb.addWorksheet('ملخص الطلبات', { views:[{ rightToLeft:true }] });
  wsSum.columns = [
    {width:4},{key:'id',width:14},{key:'date',width:12},{key:'dist',width:22},
    {key:'customer',width:22},
    {key:'phone',width:14},{key:'region',width:13},{key:'wh',width:12},
    {key:'status',width:15},{key:'qty',width:10},{key:'produced',width:9},{key:'pending',width:9}
  ];
  const sumLastCol = 12;
  addHeaderBand_(wsSum, sumLastCol, 'تقرير الأبواب', COMPANY_AR+' — '+new Date().toLocaleDateString('ar-EG')+' — إجمالي الطلبات: '+orders.length);
  wsSum.addRow([]);
  const hdrSum = wsSum.addRow(['','رقم الطلب','التاريخ','صاحب الحساب','صاحب الأوردر','الهاتف','المنطقة','المخزن','الحالة','إجمالي الكمية','جاهز','متبقي']);
  hdrSum.eachCell((c,i)=>{ if(i===1) return; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:NAVY}}; c.font={bold:true,color:{argb:WHITE},name:FONT,size:10.5}; c.alignment={horizontal:'center',vertical:'middle'}; c.border=border; });
  hdrSum.height = 22;
  wsSum.views = [{ rightToLeft:true, state:'frozen', ySplit:hdrSum.number }];

  let grandQty = 0, grandProducedSum = 0;
  orders.forEach((o,idx)=>{
    const qty = (o.items||[]).reduce((s,it)=>s+(Number(it.qty)||0),0);
    const produced = (o.items||[]).reduce((s,it)=>s+itemProdPending_(it).produced,0);
    grandQty += qty; grandProducedSum += produced;
    const pending = qty-produced;
    const st = STATUS[o.status] || {ar:o.status||'—'};
    const r = wsSum.addRow(['', o.id, xlDate_(o.date), o.dist||'', o.customer||'—', String(o.phone||''), o.region||'', o.warehouse||'', st.ar, qty, produced, pending]);
    xlDateCell_(r, 3);
    r.eachCell((c,i)=>{ if(i===1) return; c.border=border; c.font={name:FONT,size:10.5, color: i===11?{argb:'FF1E8E52'}:(i===12&&pending>0?{argb:'FFB3261E'}:undefined)}; c.alignment={horizontal:'center',vertical:'middle'};
      if(idx%2===1) c.fill={type:'pattern',pattern:'solid',fgColor:{argb:ZEBRA}}; });
  });
  const totRowSum = wsSum.addRow(['','','','','','','','','الإجمالي الكلي', grandQty, grandProducedSum, grandQty-grandProducedSum]);
  totRowSum.eachCell((c,i)=>{ if(i===1) return; c.font={bold:true,name:FONT,size:11,color:{argb:NAVY}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:LIGHT}}; c.border=border; c.alignment={horizontal:'center'}; });

  // ---------- ورقة 2: تفاصيل حسب العميل ----------
  const wsDet = wb.addWorksheet('تفاصيل حسب العميل', { views:[{ rightToLeft:true }] });

    ].concat(showFrameHCol?[{width:10}]:[]).concat([{width:9},{width:12},{width:9},{width:9},{width:9},{width:9}]);
  const detLastCol = 13 + (showFrameHCol?1:0);

  wsDet.addRow([]);

  const data = buildAdminOrdersDetail_(orders);
  // ترقيم الأعمدة ديناميكي حسب ظهور عمود "ارتفاع الحلق" — عشان تلوين الخلايا الصح، وبيستخدمه
  // كل من صفوف الأصناف وصفوف إجمالي الكود مع بعض.
  const BROR_COL = showFrameHCol?9:8, QTY_COL2 = BROR_COL+2, PRO_COL2 = QTY_COL2+1, PEND_COL2 = PRO_COL2+1, AVAIL_COL2 = PEND_COL2+1;
  data.forEach(cust=>{
    const rName = wsDet.addRow(['', 'صاحب الحساب:  '+cust.name]);
    wsDet.mergeCells(rName.number,2,rName.number,detLastCol);
    rName.eachCell((c,i)=>{ if(i===1) return; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:NAVY}}; c.font={bold:true,color:{argb:WHITE},name:'Arial',size:13}; c.alignment={horizontal:'right',vertical:'middle'}; });
    rName.height = 22;

    cust.orders.forEach(o=>{
      const st = STATUS[o.status] || {ar:o.status||'—'};
      const rOrd = wsDet.addRow(['', 'طلب #'+o.id+'  —  '+dateStr2_(o.date)+'  —  '+st.ar+(o.customer?'  —  صاحب الأوردر: '+o.customer:'')]);
      wsDet.mergeCells(rOrd.number,2,rOrd.number,detLastCol);
      rOrd.eachCell((c,i)=>{ if(i===1) return; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:BRAND}}; c.font={bold:true,color:{argb:WHITE},name:FONT,size:10.5}; c.alignment={horizontal:'right',vertical:'middle'}; });

      const hdrCells = ['','النوع','الكود','الصنف','عرض الفتحة','ارتفاع الفتحة','عرض الحلق']
        .concat(showFrameHCol?['ارتفاع الحلق']:[]).concat(['البرور','الوحدة','الكمية','جاهز','متبقي','متاح؟']);
      const hdr = wsDet.addRow(hdrCells);
      hdr.eachCell((c,i)=>{ if(i===1) return; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:LIGHT}}; c.font={bold:true,color:{argb:NAVY},name:FONT,size:10}; c.alignment={horizontal:'center'}; c.border=border; });

      (o.items||[]).forEach(it=>{
        const wh = doorWH_(it.size, it.doorHeight);
        const frameW = it.frame ? it.frame : '—';
        const frameH = it.frame ? (it.frameHeight ? it.frameHeight : 'استاندر') : '—';
        const brorTxt = it.dbror ? it.dbror : '—';
        const pp = itemProdPending_(it);
        const cells = ['', itemTypeAr_(it.type), it.code||'—', itemNameAr_(it), wh.w||'—', wh.h||'—', frameW]
          .concat(showFrameHCol?[frameH]:[]).concat([brorTxt, itemUnitAr_(it.unit), Number(it.qty)||0, pp.produced, pp.pending, it.avail===false?'غير متاح':'متاح']);
        const row = wsDet.addRow(cells);
        row.eachCell((c,i)=>{ if(i===1) return; c.border=border; c.font={name:FONT,size:10}; c.alignment={horizontal:'center'};
          if(i===PRO_COL2) c.font={name:FONT,size:10,color:{argb:'FF1E8E52'}};
          if(i===PEND_COL2 && pp.pending>0) c.font={name:FONT,size:10,color:{argb:'FFB3261E'},bold:true};
          if(i===AVAIL_COL2 && it.avail===false) c.font={name:FONT,size:10,color:{argb:'FFB3261E'},bold:true}; });
      });
    });

    if(cust.codeTotals.length){
      const rCodeHdr = wsDet.addRow(['','إجمالي كل صنف (كود) — صاحب الحساب '+cust.name]);
      wsDet.mergeCells(rCodeHdr.number,2,rCodeHdr.number,detLastCol);
      rCodeHdr.eachCell((c,i)=>{ if(i===1) return; c.font={bold:true,color:{argb:NAVY},name:FONT,size:10.5}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF3F6FA'}}; });
      cust.codeTotals.forEach(ct=>{

          .concat(showFrameHCol?['']:[]).concat(['', '', ct.qty, ct.produced, ct.qty-ct.produced, '']);
        const r = wsDet.addRow(cells);
        r.eachCell((c,i)=>{ if(i===1) return; c.font={name:FONT,size:10, color: i===PRO_COL2?{argb:'FF1E8E52'}:(i===PEND_COL2&&(ct.qty-ct.produced)>0?{argb:'FFB3261E'}:undefined)}; if((i>=2&&i<=4)||i===QTY_COL2||i===PRO_COL2||i===PEND_COL2) c.border=border; c.alignment={horizontal:'center'}; });

  orders.forEach(o=>(o.items||[]).forEach(it=>{
    const key = it.type+'|'+(it.code||it.title||'')+(it.isSet?'|set':'');
    if(!grand[key]) grand[key] = { type:it.type, code:it.code||'', name:itemNameAr_(it), qty:0, produced:0, orderIds:new Set() };
    grand[key].qty += Number(it.qty)||0;
    grand[key].produced += itemProdPending_(it).produced;
    grand[key].orderIds.add(o.id);
  }));
  const grandList = Object.values(grand).sort((a,b)=>b.qty-a.qty);
  let grandProducedX = 0;
  grandList.forEach((g,idx)=>{
    grandProducedX += g.produced;
    const pending = g.qty-g.produced;
    const r = wsCodes.addRow(['', itemTypeAr_(g.type), g.code||'—', g.name, g.orderIds.size, g.qty, g.produced, pending]);
    r.eachCell((c,i)=>{ if(i===1) return; c.border=border; c.font={name:FONT,size:10.5, color: i===7?{argb:'FF1E8E52'}:(i===8&&pending>0?{argb:'FFB3261E'}:undefined)}; c.alignment={horizontal:'center'};
      if(idx%2===1) c.fill={type:'pattern',pattern:'solid',fgColor:{argb:ZEBRA}}; });
  });
  const rGrandTot = wsCodes.addRow(['','','','','الإجمالي الكلي', grandQty, grandProducedX, grandQty-grandProducedX]);
  rGrandTot.eachCell((c,i)=>{ if(i===1) return; c.font={bold:true,color:{argb:NAVY},name:FONT,size:11}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:LIGHT}}; c.border=border; c.alignment={horizontal:'center'}; });
  wsCodes.autoFilter = { from:{row:hdrCodes.number,column:2}, to:{row:hdrCodes.number,column:codesLastCol} };

  // هامش الطباعة: رقم الصفحة بس (من غير سطر إعداد)
  wb.worksheets.forEach(w=>{
    w.headerFooter = w.headerFooter || {};
    w.headerFooter.oddFooter = '&L&9Page &P of &N';
  });

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  downloadBlob(blob, 'تقرير_الأبواب_'+isoLocal_()+'.xlsx');
  busy(false);
}

// التاريخ في ملفات الإكسيل لازم يتكتب كقيمة تاريخ حقيقية مش نص.
// كان بيتكتب نص بأرقام عربية (زي "٠٣‏/٠٩‏/٢٠٢٦") — شكله مظبوط بس إكسيل مايعرفش
// يرتّبه ولا يفلتر بمدى تواريخ ولا يستخدمه في PivotTable، فعمود التاريخ كان
// عمليًا مالوش فايدة للمصنع. بنرجّع Date وبنحط numFmt على الخانة بعد الإضافة.
function xlDate_(v){
  if(v===''||v==null) return '';
  const d = (v instanceof Date) ? v : new Date(v);
  return isNaN(d.getTime()) ? '' : d;
}
// بتحط تنسيق تاريخ ومحاذاة على خانة واحدة في صف إكسيل (بترجّع من غير ما تعمل حاجة لو مش تاريخ)
function xlDateCell_(row, col){
  const c = row.getCell(col);
  if(c.value instanceof Date){ c.numFmt = 'yyyy-mm-dd'; c.alignment = { horizontal:'center' }; }
}

function dateStr2_(d){
  if(!d) return '';
  try{ return new Date(d).toLocaleDateString('ar-EG',{day:'2-digit',month:'2-digit',year:'numeric'}); }catch(e){ return String(d); }
}

// إكسيل تفصيلي بكل الطلبات — كان كمان بدون زرار.
// ⚠️ وكان فيه باج: busy(false) كانت مكتوبة في حالة الخطأ بس، فلو التصدير نجح
// شاشة «جارٍ التحميل» كانت بتفضل شغّالة للأبد والتطبيق يبان متعلّق.

let adminPollTimer = null;
function startAdminPolling(){
  if(adminPollTimer || !APPS_SCRIPT_URL) return;
  adminPollTimer = setInterval(()=>adminPoll(), 90000);   // فحص خلفي كل ٩٠ ثانية طول ما الشاشة مفتوحة
  // لما المستخدم يرجّع التطبيق قدامه بنفحص فورًا بدل ما يستنى دورة كاملة (لحد ٩٠ ثانية انتظار)
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) adminPoll(); });
}

// فحص خلفي: بيقارن آخر حالة معروفة لكل طلب بالحالة الجديدة —
// طلب جديد خالص → يزوّد عداد "معلق" فوق تبويب 🏭. طلب اتغيّرت حالته → إشعار فوري.
async function adminPoll(){
  if(!APPS_SCRIPT_URL || !state.admin.pw) return;
  // التطبيق في الخلفية (الشاشة مقفولة أو المستخدم في تطبيق تاني)؟ مافيش داعي نستهلك نت وبطارية
  if(document.hidden) return;
  try{
    const d = await jsonp(APPS_SCRIPT_URL + '?action=list' + admParams_());
    if(!d || !d.ok) return;
    const rows = d.orders || [];
    const seen = loadAdminSeen_();
    let pending = 0;
    rows.forEach(o=>{
      const prev = seen[o.id];
      if(prev===undefined){
        pending++;
        notifyAdmin_('📥 طلب جديد #'+o.id, o.dist?('من: '+o.dist):'');
      } else if(prev !== o.status){
        const stAr = (STATUS[o.status] && STATUS[o.status].ar) || o.status;
        notifyAdmin_('طلب #'+o.id+' تم تعديله لـ '+stAr, o.dist?('صاحب الطلب: '+o.dist):'');
      }
      seen[o.id] = o.status;
    });
    saveAdminSeen_(seen);
    state.admin.pendingCount = pending;
    updateAdmBadge();
    // لو شاشة متابعة المصنع مفتوحة فعلًا قدام المستخدم، حدّث القايمة المعروضة كمان
    if(state.admin.open && state.tab==='admin'){
      state.admin.rows = rows;
      state.admin.staleAt = null;
      saveAdminCache_(rows);
      // لو المستخدم واقف بيكتب في خانة (كمية/اسم عميل/تاريخ) مانعيدش الرسم دلوقتي
      // عشان مانضيّعش اللي بيكتبه — هيتحدّث في أقرب رسم جاي أو لما يخلص.
      const ae = document.activeElement;
      const typing = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
      if(!typing) render();
    }
  }catch(err){ /* أعطال الشبكة في الفحص الخلفي بنتجاهلها بصمت */ }
}

// جدول تتبّع الإنتاج لكل أصناف الطلب: الصنف / المقاس / المطلوب / الجاهز / المتبقي
// لمسة على أي صف تفتح خانة تعديل الكمية الجاهزة وتحفظها في الشيت
// لو qtyMode=true: بيتحول الجدول لوضع تعديل الكمية المطلوبة نفسها + حذف الصنف (بدل تسجيل الجاهز)
function sizeText_(it){
  if(it.type==='Door') return doorSizeText_(arabicSizeText_(it.size||''), it.doorHeight);
  if(it.type==='Frame') return (it.size||'')+(it.frameHeight?' (ارتفاع '+it.frameHeight+' سم)':'');
  return it.size||'—';
}
function prodTableHTML_(oid, its, a, qtyMode){
  const rows = its.map((it,idx)=>{
    const key = oid+':'+idx;
    const qty = Number(it.qty)||0;
    const produced = Math.max(0, Math.min(qty, Number(it.produced)||0));
    const pending = qty - produced;
    const full = qty>0 && produced>=qty;
    const title = esc(arabicItemTitle_(it)) + (it.type==='Door'&&it.code?' ('+esc(it.code)+')':'');

    if(qtyMode){
      const qKey = oid+':'+idx;
      const qBusy = a.qtyBusy === qKey;
      const dBusy = a.itemDelBusy === qKey;
      const draft = a.qtyEdit.hasOwnProperty(qKey) ? a.qtyEdit[qKey] : qty;
      return `<tr>
        <td style="padding:6px 7px;text-align:right;font-size:11px">${title}</td>
        <td style="padding:6px 5px;text-align:center;font-size:11px;color:#4B5A6B;white-space:nowrap">${esc(sizeText_(it))}</td>
        <td style="padding:6px 5px;text-align:center" colspan="2">
          <div style="display:flex;align-items:center;justify-content:center;gap:4px">
            <input type="number" inputmode="numeric" min="1" value="${esc(draft)}"
              data-act="item-qty-set" data-id="${esc(oid)}" data-idx="${idx}"
              style="width:48px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:4px 2px;font-size:12px;font-weight:700">
            <button class="btn sm" data-act="adm-qty-save" data-id="${esc(oid)}" data-idx="${idx}" ${qBusy?'disabled':''} style="font-size:10px;padding:4px 6px">${qBusy?'…':ico('check')}</button>
          </div>
        </td>
        <td style="padding:6px 5px;text-align:center">
          <button class="btn act-del sm" data-act="adm-item-del" data-id="${esc(oid)}" data-idx="${idx}" ${dBusy?'disabled':''} style="font-size:10px;padding:4px 6px">${dBusy?'…':ico('trash')}</button>
        </td>
      </tr>`;
    }

    const editing = a.prodEdit.hasOwnProperty(key);
    const busy = a.prodBusy === key;

    const readyCell = editing
      ? `<div style="display:flex;align-items:center;justify-content:center;gap:4px">
          <input type="number" inputmode="numeric" min="0" max="${qty}" value="${esc(a.prodEdit[key])}"
            data-act="prod-set" data-id="${esc(oid)}" data-idx="${idx}"
            style="width:44px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:4px 2px;font-size:12px;font-weight:700">
        </div>`
      : `<b style="color:${full?'#1E8E52':(produced>0?'#B8790A':'#6B7A8C')}">${produced}</b>`;

    const lastCell = editing
      ? `<div style="display:flex;gap:4px;justify-content:center">
          <button class="btn sm" data-act="adm-prod-save" data-id="${esc(oid)}" data-idx="${idx}" ${busy?'disabled':''} style="font-size:10px;padding:4px 6px">${busy?'…':ico('check')}</button>
          <button class="btn ghost sm" data-act="adm-prod-cancel" data-id="${esc(oid)}" data-idx="${idx}" ${busy?'disabled':''} style="font-size:10px;padding:4px 6px">${ico('x')}</button>
        </div>`
      : `<b style="color:${pending>0?'#B3261E':'#6B7A8C'}">${pending}</b>`;

    // ⚠️ علامة «غير متاح» بتتطبع في مستند الطلب (شوف buildAdminDocOrder_) بس مكانش
    // فيه أي طريقة المصنع يعلّمها بيها — الدالة setItemAvail والمعالج موجودين من
    // غير زرار. الزرار ده بيقفل الدايرة: ضغطة بتقلب الحالة، والعميل يشوفها في ورقته.
    const avail = it.avail !== false;
    const availBusy = a.itemBusy === (oid+':'+idx);
    const availBtn = `<button class="btn ${avail?'act-send':'act-del'} sm"
        data-act="adm-item-avail" data-id="${esc(oid)}" data-idx="${idx}" data-avail="${avail?0:1}"
        ${availBusy?'disabled':''} title="${avail?'اضغط لتعليمه «غير متاح»':'اضغط لتعليمه «متاح»'}"
        style="font-size:9.5px;padding:3px 5px;min-height:0;width:auto">${availBusy?'…':(avail?ico('check'):ico('warn'))}</button>`;

    return `<tr data-act="${editing?'':'adm-prod-edit-open'}" data-id="${esc(oid)}" data-idx="${idx}" style="cursor:${editing?'default':'pointer'};${avail?'':'background:#FDECEA'}">
      <td style="padding:6px 7px;text-align:right;font-size:11px">${avail?'':'<span style="color:#B3261E;font-weight:700">غير متاح — </span>'}${title}</td>
      <td style="padding:6px 5px;text-align:center;font-size:11px;color:#4B5A6B;white-space:nowrap">${esc(sizeText_(it))}</td>
      <td style="padding:6px 5px;text-align:center;font-size:11.5px">${qty}</td>
      <td style="padding:6px 5px;text-align:center;font-size:11.5px">${readyCell}</td>
      <td style="padding:6px 5px;text-align:center;font-size:11.5px">${lastCell}</td>
      <td style="padding:6px 3px;text-align:center">${availBtn}</td>
    </tr>`;
  }).join('');

  return `<div style="overflow-x:auto;margin-top:6px">
    <table class="stktbl" style="min-width:0">
      <thead><tr>
        ${qtyMode
          ? `<th style="text-align:right">الصنف</th><th>المقاس</th><th colspan="2">الكمية</th><th>حذف</th>`
          : `<th style="text-align:right">الصنف</th><th>المقاس</th><th>مطلوب</th><th>جاهز</th><th>متبقي</th><th>متاح</th>`}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function viewAdmin(){


  const a = state.admin;

  // شاشة الانتظار بتظهر بس لو مفيش أي حاجة نعرضها. لو عندنا نسخة محفوظة،
  // بنعرضها فورًا والتحديث ماشي في الخلفية (شريط التنبيه فوق بيوضّح ده).
  if(a.loading && !(a.rows||[]).length && !(a.viewArchive && (a.archRows||[]).length))
    return `<div class="empty"><span class="em">${ico("clock","xl")}</span><p>جارٍ التحميل…</p></div>`;

  if(!a.open){
    return `<section class="card">
      <div class="step"><span class="n">${ico("lock","lg")}</span><h2>متابعة المصنع</h2></div>
      <div class="note" style="margin-top:0">الشاشة دي لموظفي المصنع بس — منها بتتحدّد حالة كل طلب،
      وصاحب الطلب بيشوف الحالة على طول في تبويب «المتابعة».</div>
      <label class="fld" style="margin-top:12px"><span>كلمة السر</span>
        <input type="password" inputmode="numeric" value="${esc(a.pw)}" placeholder="••••" data-act="adm-pw"></label>
      ${a.err?`<div class="note" style="color:var(--danger)">${esc(a.err)}</div>`:''}
      <button class="btn primary" data-act="adm-login" ${a.pw?'':'disabled'}>دخول</button>
    </section>${verBar()}`;
  }

  const viewingArchive = !!a.viewArchive;
  const list = viewingArchive ? a.archRows : a.rows;

  // شريط بيوضّح إن المعروض نسخة محفوظة وإن التحديث شغّال — عشان المصنع ما ياخدش
  // قرار على أرقام قديمة وهو فاكرها لحظية
  const staleBar = (a.staleAt && a.loading)
    ? `<div class="note" style="margin:0 0 10px;display:flex;align-items:center;gap:7px;
            background:#FFF6E5;border:1px solid var(--warn-line);color:#8A6512">
         ${ico('clock')} بيعرض آخر نسخة محفوظة — بيتحدّث من المصنع دلوقتي…</div>`
    : (a.staleAt
      ? `<div class="note" style="margin:0 0 10px;display:flex;align-items:center;gap:7px;
              background:#FDECEA;border:1px solid #E8A9A3;color:#8A3A32">
           ${ico('warn')} النت مقطوع — دي آخر نسخة محفوظة، اضغط «تحديث» لما النت يرجع</div>`
      : '');

  const headerBtns = `${staleBar}<div class="toolgrid">
        <button class="btn act-tool sm" data-act="adm-reload">${ico("refresh")}${a.loading?'بيحدّث…':'تحديث'}</button>
        <button class="btn act-report sm" data-act="adm-pending-pdf">${ico("doc")}متبقي PDF</button>
        <button class="btn act-report sm" data-act="adm-pending-xls">${ico("sheet")}متبقي إكسيل</button>
        <button class="btn act-report sm" data-act="adm-full-pdf">${ico("report")}تقرير كامل</button>
        <button class="btn act-report sm" data-act="adm-full-xls">${ico("sheet")}كل الطلبات إكسيل</button>
        <button class="btn ${a.viewStock?'brand':'act-edit'} sm" data-act="adm-toggle-stock">${ico("box")}${a.viewStock?'رجوع للطلبات':'أرصدة المخزن'}</button>
        <button class="btn ${viewingArchive?'brand':'act-edit'} sm" data-act="adm-toggle-archive">${ico("folder")}${viewingArchive?'رجوع للطلبات':'الأرشيف'}</button>
        <button class="btn act-money sm" data-act="adm-prices-open">${ico("money")}الأسعار</button>
        ${viewingArchive?`<button class="btn act-del sm" data-act="adm-clear-delivered">${ico("trash")}حذف المؤرشف</button>`:''}
        <button class="btn act-tool sm" data-act="adm-logout">${ico("lock")}خروج</button>
      </div>`;

  if(a.pricesOpen) return viewAdminPrices() + verBar();

  if(viewingArchive && a.archLoading){
    return `<section class="card">
      <div class="step"><span class="n">${ico("folder","lg")}</span><h2>الأرشيف</h2></div>
      ${headerBtns}
    </section>
    <div class="empty"><span class="em">${ico("clock","xl")}</span><p>جارٍ تحميل الأرشيف…</p></div>${verBar()}`;
  }

  // ---------- شاشة أرصدة المخزن ----------
  if(a.viewStock){
    const rowsHtml = DOORS.map(d=>{
      const cells = SIZES.map(sz=>{
        const key = d.code+'|'+sz.w;
        const cur = stockFor(d.code, sz.w) || 0;
        const draft = a.stockDraft[key];
        const val = draft!==undefined ? draft : cur;
        const busy = a.stockBusy===key;
        const dirty = draft!==undefined && Number(draft)!==Number(cur);
        const res = reservedFor(d.code, sz.w);
        const free = cur-(res||0);
        return `<td style="padding:4px">
          <input type="number" inputmode="numeric" min="0" value="${esc(val)}"
            data-act="stock-in" data-code="${esc(d.code)}" data-w="${sz.w}"
            class="stkin ${dirty?'dirty':''}" ${busy?'disabled':''}>
          ${res>0?`<div style="text-align:center;font-size:9.5px;margin-top:2px"><span style="color:#B3261E">مطلوب ${res}</span> · <span style="color:${free<0?'#B3261E':'#1E8E52'};font-weight:700">متبقي ${free}</span></div>`:''}
        </td>`;
      }).join('');
      const total = stockTotalFor(d.code)||0;
      const resTotal = SIZES.reduce((s,sz)=>s+(reservedFor(d.code, sz.w)||0),0);
      const freeTotal = total-resTotal;
      return `<tr>
        <td style="padding:5px 7px;white-space:nowrap"><b>${esc(d.code)}</b>
          <span style="color:var(--muted);font-size:11px"> ${esc(d.name)}</span></td>
        ${cells}
        <td style="padding:5px 7px;text-align:center;color:var(--muted);font-size:11.5px">${total}</td>
        <td style="padding:5px 7px;text-align:center;font-size:11.5px;color:${resTotal>0?'#B3261E':'var(--muted)'}">${resTotal||'—'}</td>
        <td style="padding:5px 7px;text-align:center;font-size:11.5px;font-weight:700;color:${freeTotal>0?'#1E8E52':'#B3261E'}">${freeTotal}</td>
      </tr>`;
    }).join('');

    const dirtyCount = Object.keys(a.stockDraft).filter(k=>{
      const [c,w] = k.split('|');
      return Number(a.stockDraft[k]) !== Number(stockFor(c, Number(w))||0);
    }).length;

    return `<section class="card">
      <div class="step"><span class="n">${ico("box","lg")}</span><h2>أرصدة المخزن</h2>
        <span class="hint">الجاهز للتسليم</span></div>
      <div class="note" style="margin-top:0">اكتب الكمية المتاحة لكل كود ومقاس. العميل هيشوف
        «${esc(READY_HOURS_TXT)}» للأصناف اللي ليها رصيد. عمود «مطلوب لعملاء» بيوريك كام باب من نفس الكود/المقاس
        لسه محجوز لطلبات عملاء معلّقة، عشان تعرف الرصيد الفاضي فعليًا.</div>
      ${headerBtns}
      <div style="overflow-x:auto;margin-top:12px">
        <table class="stktbl">
          <thead><tr>
            <th style="text-align:right">الكود</th>
            ${SIZES.map(sz=>`<th>${sz.w} سم</th>`).join('')}
            <th>الإجمالي</th>
            <th>مطلوب لعملاء</th>
            <th>متبقي فعليًا</th>
          </tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
      <div class="btnrow" style="margin-top:12px">
        <button class="btn brand" data-act="stock-save" ${dirtyCount?'':'disabled'}>
          ${dirtyCount?`حفظ ${dirtyCount} تعديل`:'مفيش تعديلات'}</button>
        <button class="btn ghost sm" data-act="stock-reload">${ico("refresh")}تحديث</button>
        <button class="btn act-report sm" data-act="stock-pdf" ${a.stockPdfBusy?'disabled':''}>${ico("doc")}${a.stockPdfBusy?'…':'تصدير PDF'}</button>
      </div>
    </section>${verBar()}`;
  }


  if(!list || !list.length){
    return `<section class="card">
      <div class="step"><span class="n">${viewingArchive?ico("folder","lg"):ico("factory","lg")}</span><h2>${viewingArchive?'الأرشيف':'متابعة المصنع'}</h2></div>
      ${headerBtns}
    </section>
    <div class="empty"><span class="em">${ico("clip","xl")}</span><p>${viewingArchive?'مفيش طلبات مؤرشفة.':'مفيش طلبات نشطة لسه.'}</p></div>${verBar()}`;
  }

  const orderCardHTML_ = o=>{
    const busy = a.busy === o.id;
    const delBusy = a.delBusy === o.id;
    const archBusy = a.archBusy === o.id;
    const btns = FLOW.map(st=>{
      const c = STATUS[st];
      const on = o.status === st;
      return `<button class="chip ${on?'on':''}" data-act="adm-set" data-id="${esc(o.id)}" data-st="${esc(st)}"
        ${busy?'disabled':''} style="flex:1;min-width:0;padding:8px 4px;font-size:11.5px">
        ${ico(c.ic,'lg')}<span style="display:block;margin-top:3px">${esc(c.ar)}</span></button>`;
    }).join('');

    const itemsOpen = !!a.itemsOpen[o.id];
    const qtyMode = !!a.qtyEditOpen[o.id];
    const its = a.items[o.id];
    let itemsHtml = '';
    if(itemsOpen){
      if(qtyMode){
        const meta = a.metaEdit[o.id] || {customer:o.customer||'', date:o.date||''};
        const metaBusy = a.metaBusy === o.id;
        itemsHtml += `<div style="margin-top:8px;padding:9px 10px;background:#F7F9FB;border:1px solid var(--line);border-radius:10px">
          <div style="font-size:11px;color:#6B7A8C;font-weight:700;margin-bottom:6px">بيانات الطلب:</div>
          <div style="display:flex;gap:7px;flex-wrap:wrap">
            <label style="flex:1;min-width:140px;display:flex;flex-direction:column;gap:3px">
              <span style="font-size:10.5px;color:#6B7A8C">صاحب الأوردر</span>
              <input type="text" value="${esc(meta.customer)}" data-act="meta-customer" data-id="${esc(o.id)}"
                style="border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:12px">
            </label>
            <label style="flex:1;min-width:120px;display:flex;flex-direction:column;gap:3px">
              <span style="font-size:10.5px;color:#6B7A8C">تاريخ الطلب</span>
              <input type="date" value="${esc(meta.date)}" data-act="meta-date" data-id="${esc(o.id)}"
                style="border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px">
            </label>
          </div>
          <button class="btn sm" data-act="adm-meta-save" data-id="${esc(o.id)}" ${metaBusy?'disabled':''} style="margin-top:7px;font-size:11px;padding:6px 12px">${metaBusy?'…':ico('save')+' حفظ بيانات الطلب'}</button>
        </div>`;
      }
      if(its && its.length){
        itemsHtml += `<div style="margin-top:8px">
          <div style="font-size:11px;color:#6B7A8C;font-weight:700;margin-bottom:4px">${qtyMode?'تعديل الكمية المطلوبة أو حذف صنف من الطلب:':'تتبّع الإنتاج (لمسة على أي صف لتحديث الكمية الجاهزة):'}</div>
          ${prodTableHTML_(o.id, its, a, qtyMode)}
        </div>`;
      } else {
        itemsHtml += `<div class="note">جارٍ تحميل الأصناف…</div>`;
      }
    }

    // ⚠️ زرار PDF للطلب الواحد كان مفقود من الكارت — الدالة exportAdminOrderPdf
    // موجودة وشغّالة والمعالج موجود، بس مفيش زرار بينده عليهم. فالمصنع كان يقدر
    // يصدّر PDF لكل طلبات العميل مع بعض بس، مش طلب واحد.
    const actionBtns = `<button class="btn ${itemsOpen?'brand':'act-edit'} sm" data-act="adm-toggle-items" data-id="${esc(o.id)}">${ico("box")}${itemsOpen?'إخفاء':'الأصناف'}</button>
         <button class="btn act-report sm" data-act="adm-pdf" data-id="${esc(o.id)}">${ico("doc")}PDF</button>
         <button class="btn ${qtyMode?'brand':'act-edit'} sm" data-act="adm-toggle-qtymode" data-id="${esc(o.id)}">${ico("edit")}تعديل</button>
         <button class="btn act-edit sm" data-act="adm-add-items" data-id="${esc(o.id)}">${ico("plus")}إضافة</button>
         <button class="btn act-send sm" data-act="adm-share" data-id="${esc(o.id)}">${ico("send")}إرسال</button>
         <button class="btn act-money sm" data-act="adm-quote" data-id="${esc(o.id)}">${ico("money")}سعر</button>
         ${viewingArchive?`<button class="btn act-tool sm" data-act="adm-unarchive" data-id="${esc(o.id)}" ${archBusy?'disabled':''}>${ico("refresh")}${archBusy?'…':'رجّع'}</button>`:''}
         <button class="btn act-del sm" data-act="adm-del" data-id="${esc(o.id)}" ${delBusy?'disabled':''}>${ico("trash")}${delBusy?'…':'حذف'}</button>`;

    return `<div class="ord">
      <div class="oh"><span class="oid" title="الكود الداخلي: ${esc(o.id)}">${esc(orderNoText_(o))}</span>${Number(o.editCount)>0?`<span style="font-size:10px;font-weight:700;color:#8A6512;background:#FFF6E5;border:1px solid #E8C77A;border-radius:20px;padding:1px 8px">معدّل</span>`:''}${o.replacesId?`<span style="font-size:10.5px;font-weight:700;color:#B3261E;background:#FBE9E7;border-radius:20px;padding:2px 9px;display:inline-flex;align-items:center;gap:4px">${ico("undo")}تعديل على #${esc(o.replacesId)}</span>`:''}${statusPill(o.status)}</div>
      <div class="os">${esc(o.dist||'')} · ${esc(o.region||'')} · ${esc(o.phone||'')}
        ${o.customer?`<br><b style="color:#0B4A7A">صاحب الأوردر: ${esc(o.customer)}</b>`:''}
        ${o.ordNote?`<br><span style="color:#8A6512">ملاحظات: ${esc(o.ordNote)}</span>`:''}<br>
        ${esc(o.date||'')} · ${esc(o.qty||0)} قطعة${o.rods?' · '+esc(o.rods)+' عود':''} · ${money(o.total||0)} ج</div>
      <div class="chips" style="margin-top:10px;gap:6px;flex-wrap:nowrap">${btns}</div>
      ${busy?'<div class="note">جارٍ الحفظ…</div>':''}
      <div class="cardacts">${actionBtns}</div>
      ${itemsHtml}
    </div>`;
  };

  // ---------- تجميع طلبات كل عميل في قايمة منسدلة ----------
  const groups = {};
  const order = [];
  list.forEach(o=>{
    const key = String(o.customer||'').trim() || 'بدون اسم';
    if(!groups[key]){ groups[key]=[]; order.push(key); }
    groups[key].push(o);
  });

  const rows = order.map(name=>{
    const orders = groups[name];
    const open = !!a.groupOpen[name];
    const totalQty = orders.reduce((s,o)=>s+(Number(o.qty)||0),0);
    const totalMoney = orders.reduce((s,o)=>s+(Number(o.total)||0),0);
    const pdfBusy = a.groupPdfBusy === name;
    const prevBusy = a.groupPreviewBusy === name;
    return `<div class="ord" style="padding:0;overflow:hidden">
      <div data-act="adm-toggle-group" data-name="${esc(name)}" style="display:flex;align-items:center;gap:8px;padding:13px 14px;cursor:pointer">
        <span style="flex:1;min-width:0">
          <b style="font-size:13.5px;color:#0B2A4A">${esc(name)}</b>
          <div style="font-size:11px;color:#6B7A8C;margin-top:2px">${orders.length} طلب · ${totalQty} قطعة · ${money(totalMoney)} ج</div>
        </span>
        <button class="btn act-tool sm" data-act="adm-group-preview" data-name="${esc(name)}" ${prevBusy?'disabled':''}
          title="معاينة الطلب قبل التصدير" aria-label="معاينة طلب ${esc(name)}" style="width:auto;padding:7px 10px">
          ${ico("search")}${prevBusy?'…':'معاينة'}</button>
        <button class="btn act-report sm" data-act="adm-group-pdf" data-name="${esc(name)}" ${pdfBusy?'disabled':''} style="width:auto;padding:7px 10px">
          ${ico("doc")}${pdfBusy?'…':'PDF'}</button>
        <span style="font-size:18px;color:#8A97A6;transform:rotate(${open?90:0}deg);transition:.15s">‹</span>
      </div>
      ${open?`<div style="padding:0 10px 10px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)">
        <div style="height:1px"></div>${orders.map(orderCardHTML_).join('')}
      </div>`:''}
    </div>`;
  }).join('');

  return `<section class="card">
      <div class="step"><span class="n">${viewingArchive?ico("folder","lg"):ico("factory","lg")}</span><h2>${viewingArchive?'الأرشيف':'متابعة المصنع'}</h2><span class="hint">${list.length} طلب · ${order.length} عميل</span></div>
      <div class="note" style="margin-top:0">${viewingArchive?'الطلبات المؤرشفة (اتسلمت أو اتأرشفت يدوي) — مش بتظهر في التقارير.':'اضغط اسم العميل عشان تشوف طلباته، وبعدين «الأصناف والإنتاج» جوه كل طلب عشان تسجّل الإنتاج وتشوف المتبقي. تسليم الطلب بيأرشفه أوتوماتيك.'}</div>
      ${headerBtns}
    </section>
    ${rows}${verBar()}`;
}

document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('button[data-tab]'); if(!b) return;
  // سايب شاشة «طلب جديد» وفيه صنف مسحوب للتعديل ما اتكملش؟ رجّعه للسلة بدل ما يضيع
  if(b.dataset.tab!=='new') restorePulledLine_();
  state.tab=b.dataset.tab; render(); window.scrollTo({top:0,behavior:'smooth'});
  if(state.tab==='orders' && state.track.rows===null && state.orders.length) loadTrack();
  if(state.tab==='new') loadStock();
});

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, p=state.pick;
  switch(a){
    case 'go-cart': state.tab='cart'; render(); window.scrollTo({top:0}); break;
    case 'pick-door': selectDoor(el.dataset.code); loadStock(); break;
    case 'sec': state.newSection=el.dataset.s; save(LS_SECTION,state.newSection); render(); window.scrollTo({top:0,behavior:'smooth'}); break;
    case 'door-preview': showDoorPreview(el.dataset.code); break;

// لو رد "تابع طلبك" (list بالـphone) بيرجّع أصناف الطلب مع حقل produced، بنحطه على نسخة الطلب المحلية
// عشان مستند/صورة العميل يوري جاهز/متبقي محدّث. لو السيرفر لسه مابيرجعش الحقل ده، محصلش تغيير (0 آمن افتراضيًا).
function mergeProducedFromTrack_(o){
  const live = (state.track.rows||[]).find(r=>String(r.id)===String(o.id));
  if(live && Array.isArray(live.items)){
    (o.items||[]).forEach((it,idx)=>{
      const li = live.items[idx];
      if(li && li.produced!==undefined) it.produced = li.produced;
    });
  }
  return o;
}

// إنتر في خانة كلمة سر متابعة المصنع يعمل دخول على طول
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeReportPreview_(); return; }
  if(e.key!=='Enter') return;
  const el = e.target.closest('[data-act="adm-pw"]');
  if(!el) return;
  e.preventDefault();
  const b = document.querySelector('[data-act="adm-login"]');
  if(b && !b.disabled) b.click();
});

document.addEventListener('input',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a==='adm-pw'){ state.admin.pw=el.value; const b=document.querySelector('[data-act="adm-login"]'); if(b) b.disabled=!el.value; return; }
  if(a==='prof'){
    // الموبايل بيتخزّن بأرقام لاتينية دايمًا — لو الموزع كتبه بالعربي بنحوّله
    // على طول عشان يتقبل هنا ويتطابق مع السيرفر بعدين.
    state.profile[el.dataset.k] = (el.dataset.k==='phone') ? toLatinDigits_(el.value) : el.value;
    save(LS_PROFILE,state.profile); return;
  }
  if(a==='cust'){ state.pick.custom[el.dataset.k]=el.value; refreshSummary(); return; }
  if(a==='cust-name'){ state.customer.name=el.value; return; }
  if(a==='cust-phone'){ state.customer.phone=toLatinDigits_(el.value); return; }
  if(a==='edit-date'){ state.editingDate=el.value; return; }
  if(a==='edit-meta-customer'){ if(state.editingMeta) state.editingMeta.customer=el.value; return; }
  if(a==='edit-meta-phone'){ if(state.editingMeta) state.editingMeta.customerPhone=toLatinDigits_(el.value); return; }
  if(a==='stock-in'){
    state.admin.stockDraft[el.dataset.code+'|'+el.dataset.w] = el.value;
    el.classList.add('dirty');
    const b=document.querySelector('[data-act="stock-save"]'); if(b) b.disabled=false;
    return;
  }
  if(a==='ord-note'){ state.orderNote=el.value; return; }
  if(a==='size-height'){ const w=Number(el.dataset.w); const e=state.pick.sizes[w]; if(e) e.height=el.value; refreshSummary(); return; }
  if(a==='size-frame-height'){ const w=Number(el.dataset.w); const e=state.pick.sizes[w]; if(e) e.frameHeight=el.value; return; }
  if(a==='cust-frame-height'){ state.pick.custom.frameHeight=el.value; return; }
  if(a==='size-frame-rodqty'){ const w=Number(el.dataset.w); const e=state.pick.sizes[w]; if(e) e.frameRodQty=el.value; return; }
  if(a==='cust-frame-rodqty'){ state.pick.custom.frameRodQty=el.value; return; }
  if(a==='size-frame-fordoors'){ const w=Number(el.dataset.w); const e=state.pick.sizes[w]; if(e) e.frameForDoors=el.value; return; }
  if(a==='cust-frame-fordoors'){ state.pick.custom.frameForDoors=el.value; return; }
  if(a==='size-qty-set'){ const w=Number(el.dataset.w); const e=state.pick.sizes[w]; if(e) e.qty=Math.max(1,parseInt(el.value,10)||1); refreshSummary(); return; }
  if(a==='cust-qty-set'){ state.pick.custom.qty=Math.max(1,parseInt(el.value,10)||1); refreshSummary(); return; }
  if(a==='acc-set'){ state.acc[el.dataset.id]=Math.max(0,parseFloat(el.value)||0); refreshAccBtn(); return; }
  if(a==='fr-jamb'){ state.fr.jamb=el.value; render(); return; }
  if(a==='fr-header'){ state.fr.header=el.value; render(); return; }
  if(a==='fr-jambCm'){ state.fr.jambCm=el.value; render(); return; }
  if(a==='fr-headerCm'){ state.fr.headerCm=el.value; render(); return; }
  if(a==='fr-qty'){ state.fr.qty=el.value; render(); return; }
  if(a==='fr-rods'){ state.fr.rods=el.value; render(); return; }
  if(a==='fr-rodsCm'){ state.fr.rodsCm=el.value; render(); return; }
  if(a==='fr-extra-cm'){ state.fr.extra[Number(el.dataset.i)].cm=el.value; render(); return; }
  if(a==='fr-extra-qty'){ state.fr.extra[Number(el.dataset.i)].qty=el.value; render(); return; }
  if(a==='fr-note'){ state.fr.note=el.value; return; }
  if(a==='br-rods'){ state.br.rods=el.value; refreshRodBtn('add-br'); return; }
  if(a==='br-lenM'){ state.br.lenM=el.value; render(); return; }
  if(a==='pd-qty'){ state.pd.qty=el.value; refreshPanelBtn(); return; }
  if(a==='price-set'){
    const pe=state.admin.priceEdit; if(!pe) return;
    const v=parseFloat(el.value)||0, g=el.dataset.group, k=el.dataset.key, tier=el.dataset.tier;
    if(g==='customExtra') pe.customExtra[tier]=v;
    else if(g==='hafrExtra') pe.hafrExtra[tier]=v;
    else if(pe[g][k]) pe[g][k][tier]=v;
    return;
  }
  if(a==='prod-set'){
    const key = el.dataset.id+':'+el.dataset.idx;
    state.admin.prodEdit[key] = el.value;
    return;
  }
  if(a==='item-qty-set'){
    const key = el.dataset.id+':'+el.dataset.idx;
    state.admin.qtyEdit[key] = el.value;
    return;
  }
  if(a==='meta-customer'){
    const id = el.dataset.id;
    if(!state.admin.metaEdit[id]){
      const o=((state.admin.rows||[]).concat(state.admin.archRows||[])).find(x=>String(x.id)===String(id));
      state.admin.metaEdit[id] = {customer:(o&&o.customer)||'', date:(o&&o.date)||''};
    }
    state.admin.metaEdit[id].customer = el.value;
    return;
  }
  if(a==='meta-date'){
    const id = el.dataset.id;
    if(!state.admin.metaEdit[id]){
      const o=((state.admin.rows||[]).concat(state.admin.archRows||[])).find(x=>String(x.id)===String(id));
      state.admin.metaEdit[id] = {customer:(o&&o.customer)||'', date:(o&&o.date)||''};
    }
    state.admin.metaEdit[id].date = el.value;
    return;
  }
});

function refreshAccBtn(){
  const b=document.querySelector('[data-act="add-acc"]'); if(!b) return;
  const t=ACCESSORIES.reduce((sum,a)=>sum+(state.acc[a.id]||0)*a.price,0);
  b.disabled = !(t>0);
  b.textContent = t>0 ? 'أضف الإكسسوارات' : 'اختر الكميات أولاً';
}

function refreshSummary(){const n=document.getElementById('sumline'); if(n) n.textContent=currentSummary();}

function refreshPanelBtn(){
  const b=document.querySelector('[data-act="add-pd"]'); if(!b) return;
  const q=Math.max(0,Math.round(Number(state.pd.qty)||0));
  b.disabled=!(q>0 && state.pd.code);
  b.textContent = !state.pd.code ? 'اختر كود الباب أولاً'
    : (q>0 ? `أضف ${q} لوح بروديوم — ${state.pd.code}` : 'اكتب عدد الألواح');
}

// بنحدّث زرار الإضافة من غير render عشان الكيبورد ما يقفلش وإحنا بنكتب
// زرار البرور بس — الحلق بقى عدادين فبيترسم كامل مع render()
function refreshRodBtn(act){
  const b=document.querySelector('[data-act="'+act+'"]'); if(!b) return;
  const r=Number(state.br.rods)||0, s=BRORS.find(x=>x.size===state.br.size)||BRORS[0];

    : (r>0 ? `أضف ${r} عود برور ${s.size} — ${state.br.code}` : 'اكتب عدد العيدان');
}

/* ============================================================
   السلة
   ============================================================ */
function addDoor(){
  const p=state.pick;
  const widths = Object.keys(p.sizes).map(Number).filter(w=>(Number((p.sizes[w]||{}).qty)||0)>0);
  const customReady = p.customOn && Number(p.custom.w)>0 && Number(p.custom.h)>0 && Number(p.custom.qty)>0;
  if(!p.code || (!widths.length && !customReady)){
    toast('اختر مقاس واحد على الأقل'); return;
  }
  if(widths.some(w=>{ const e=p.sizes[w]; return e.frame==null || e.dbror==null; }) || (customReady && (p.custom.frame==null||p.custom.dbror==null))){
    toast('حدد الحلق والبرور لكل مقاس مختار'); return;
  }
  const d=doorByCode(p.code);
  const addedTxts=[];

  widths.forEach(w=>{
    const e=p.sizes[w];
    const qty=Number(e.qty)||1;
    // ارتفاع الفتحة المعمارية اختياري ولكل مقاس ارتفاعه الخاص بيه (المقاس الخاص أصلًا بياخد ارتفاعه من حقل الطول بتاعه)
    const doorHeight = e.height ? Number(e.height) : 0;
    const sizeTxt=w+' سم', sizeEn=w+' cm', unitPrice=priceForWidth(w,e.hafr);
    const frameKind = e.frame ? (e.frameKind||'full') : null;
    state.cart.push({
      kind:'door',
      title:'باب '+d.code+' '+d.name+(e.hafr?' (حفر)':''),
      titleEn:'WPC Door '+d.code+' - '+d.en+(e.hafr?' (Carved)':''),
      code:d.code, img:d.img, sizeTxt, sizeEn, unitPrice, qty,
      w,   // العرض بالسم كرقم خام — لخصم الرصيد بدقة
      frame:e.frame||0, dbror:e.dbror||'', frameHeight:e.frameHeight?Number(e.frameHeight):0,
      frameKind, frameRodQty:frameKind==='rods'?(e.frameRodQty||''):'', frameForDoors:frameKind==='rods'?(e.frameForDoors||''):'',
      note: frameKind==='rods' ? frameKindNote_('rods', e.frameRodQty, e.frameForDoors) : '',
      doorHeight, hafr:!!e.hafr, millEn:e.hafr?'Carved':''
    });
    addedTxts.push(doorSizeText_(sizeTxt,doorHeight)+' × '+qty);
  });

  if(customReady){
    const w=Number(p.custom.w), h=Number(p.custom.h), qty=Number(p.custom.qty)||1;
    const sizeTxt=w+'×'+h+' سم (مقاس خاص — مقاس الفتحة المعمارية)', sizeEn=w+'x'+h+' cm (custom)', unitPrice=priceForWidth(w,p.custom.hafr)+CUSTOM_EXTRA;
    const customFrameKind = p.custom.frame ? (p.custom.frameKind||'full') : null;
    state.cart.push({
      kind:'door',
      title:'باب '+d.code+' '+d.name+(p.custom.hafr?' (حفر)':''),
      titleEn:'WPC Door '+d.code+' - '+d.en+(p.custom.hafr?' (Carved)':''),
      code:d.code, img:d.img, sizeTxt, sizeEn, unitPrice, qty,
      w:'',   // مقاس خاص مش متتبّع في المخزون
      frame:p.custom.frame||0, dbror:p.custom.dbror||'', frameHeight:p.custom.frameHeight?Number(p.custom.frameHeight):0,
      frameKind:customFrameKind, frameRodQty:customFrameKind==='rods'?(p.custom.frameRodQty||''):'', frameForDoors:customFrameKind==='rods'?(p.custom.frameForDoors||''):'',
      note: customFrameKind==='rods' ? frameKindNote_('rods', p.custom.frameRodQty, p.custom.frameForDoors) : '',
      doorHeight:0, hafr:!!p.custom.hafr, millEn:p.custom.hafr?'Carved':''
    });
    addedTxts.push(sizeTxt+' × '+qty);
  }

  save(LS_CART,state.cart);
  clearPulledLine_();
  toast('اتضاف للسلة: '+d.code+' — '+addedTxts.join('، '));
  // نلمّ الاختيارات ونقفل اللوحة عشان يختار باب تاني بارتياح
  state.pick={code:'', sizes:{}, customOn:false, custom:{w:'',h:'',qty:1,frame:null,frameHeight:'',dbror:null,hafr:false,frameKind:null,frameRodQty:'',frameForDoors:''}};
  render();
}

function addRod(kind){
  const isFrame = kind==='frame';
  const st = isFrame?state.fr:state.br;
  if(!st.code){toast('اختر كود الباب (اللون) الأول');return;}
  const dName = (DOORS.find(x=>x.code===st.code)||{}).name || '';

  // بيضيف/بيجمّع سطر عود واحد في السلة (كل مقاس سطر مستقل)
  const push = (spec, cm, qty, perM, titleAr, titleEn) => {
    const key = kind+'|'+spec+'|'+cm+'|'+st.code+'|'+(st.doorW||'');
    const ex = state.cart.find(it=>it.kind===kind && it.key===key);
    if(ex){ ex.qty += qty; return; }
    state.cart.push({
      kind, key, qty, code:st.code, rodCm:cm, perM,
      price: rodPrice(perM, cm),
      spec:  spec+' — '+cm+' سم'+(st.code?' — '+st.code:''),
      title: titleAr, titleEn,
      doorW: isFrame ? (st.doorW||'') : '', note: isFrame ? (st.note||'') : ''
    });
  };

  let added = 0;
  let addedIsSet = false;
  if(isFrame){
    const f = FRAMES.find(x=>x.cm===st.cm)||FRAMES[0];
    const forDoor = st.doorW ? ' — لباب '+st.doorW+' سم' : '';
    const kind = st.kind==='rods' ? 'rods' : 'full';
    if(kind==='full'){
      const qty = Math.max(0, Math.round(Number(st.qty)||0));
      const jambCm = Math.max(1, Math.round(Number(st.jambCm)||220));
      const headerCm = Math.max(1, Math.round(Number(st.headerCm)||110));
      const extra = (st.extra||[]).map(x=>({cm:Math.max(0,Math.round(Number(x.cm)||0)), qty:Math.max(0,Math.round(Number(x.qty)||0))})).filter(x=>x.cm>0 && x.qty>0);
      const isStd = (jambCm===220 && headerCm===110 && !extra.length);
      if(qty<=0){toast('اكتب الكمية');return;}
      if(isStd){
        // الحالة الاستاندر: سطر واحد "حلق كامل" بعدد الأطقم — من غير تفاصيل قائم/عارضة حلق علوية/الطول لأنها معروفة للمصنع
        const setPrice = Math.round((rodPrice(f.price,220)*2 + rodPrice(f.price,110)*1)*100)/100;
        const key = 'frame|fullset|'+f.cm+'|'+st.code+'|'+(st.doorW||'');
        const ex = state.cart.find(it=>it.kind==='frame' && it.key===key);
        if(ex){ ex.qty += qty; }
        else{
          state.cart.push({
            kind:'frame', key, qty, code:st.code, rodCm:0, isSet:true, perM:f.price, price:setPrice,
            spec: 'حلق كامل '+f.cm+' سم'+(st.code?' — '+st.code:''),
            title: 'حلق كامل باب '+f.cm+' سم'+(st.code?' — '+st.code+(dName?' '+dName:''):'')+forDoor+(st.note?' — ملاحظة: '+st.note:''),
            titleEn: 'Full Door Frame '+f.cm+' cm'+(st.code?' - '+st.code:''),
            doorW: st.doorW||'', note: st.note||''
          });
        }
        added += qty;
        addedIsSet = true;
      } else {
        const jamb = qty*2;
        const header = qty*1;
        if(jamb){
          push(f.cm+' سم', jambCm, jamb, f.price,
            'حلق باب '+f.cm+' سم — قائم '+jambCm+' سم'+(st.code?' — '+st.code+(dName?' '+dName:''):'')+forDoor+(st.note?' — ملاحظة: '+st.note:''),
            'Door Frame '+f.cm+' cm - jamb '+jambCm+'cm'+(st.code?' - '+st.code:''));
          added += jamb;
        }
        if(header){
          push(f.cm+' سم', headerCm, header, f.price,
            'حلق باب '+f.cm+' سم — عارضة حلق علوية '+headerCm+' سم'+(st.code?' — '+st.code+(dName?' '+dName:''):'')+forDoor+(st.note?' — ملاحظة: '+st.note:''),
            'Door Frame '+f.cm+' cm - header '+headerCm+'cm'+(st.code?' - '+st.code:''));
          added += header;
        }
        extra.forEach(x=>{
          push(f.cm+' سم', x.cm, x.qty, f.price,
            'حلق باب '+f.cm+' سم — عود '+x.cm+' سم'+(st.code?' — '+st.code+(dName?' '+dName:''):'')+forDoor+(st.note?' — ملاحظة: '+st.note:''),
            'Door Frame '+f.cm+' cm - rod '+x.cm+'cm'+(st.code?' - '+st.code:''));
          added += x.qty;
        });
      }
    } else {
      const rods = Math.max(0, Math.round(Number(st.rods)||0));
      const rodsCm = Math.max(0, Math.round(Number(st.rodsCm)||0));
      if(rods<=0 || rodsCm<=0){toast('اكتب عدد الأعواد وطولها');return;}
      push(f.cm+' سم', rodsCm, rods, f.price,
        'حلق باب '+f.cm+' سم — عود '+rodsCm+' سم'+(st.code?' — '+st.code+(dName?' '+dName:''):'')+forDoor+(st.note?' — ملاحظة: '+st.note:''),
        'Door Frame '+f.cm+' cm - rod '+rodsCm+'cm'+(st.code?' - '+st.code:''));
      added += rods;
    }
    state.fr.jamb=2; state.fr.header=1; state.fr.jambCm=220; state.fr.headerCm=110; state.fr.extra=[]; state.fr.rods=''; state.fr.rodsCm=''; state.fr.doorW=''; state.fr.note=''; state.fr.qty=1; state.fr.nonStd=false;
  } else {
    const b = BRORS.find(x=>x.size===st.size)||BRORS[0];
    const rods = Math.max(0, Math.round(Number(st.rods)||0));
    if(rods<=0){toast('اكتب عدد العيدان');return;}
    // طول العود قابل للتغيير (افتراضيًا الطول القياسي) — عشان لو حد طلب عيدان مقاس مختلف زي ٣م
    const lenM = Number(st.lenM)||BROR_ROD_M_DEFAULT;
    const rodCm = Math.max(1, Math.round(lenM*100));
    push(b.size, rodCm, rods, b.price,
      'برور '+b.size+' — عود '+rodCm+' سم'+(st.code?' — '+st.code+(dName?' '+dName:''):''),
      'Bror '+b.size+' - '+rodCm+'cm rod'+(st.code?' - '+st.code:''));
    added = rods;
    state.br.rods=1; state.br.lenM=BROR_ROD_M_DEFAULT;
  }

  save(LS_CART,state.cart);
  clearPulledLine_();
  toast(addedIsSet ? ('اتضاف '+added+' طقم حلق كامل') : ('اتضاف '+added+' عود'));
  render();
}

function addPanel(){

  const qty = Math.max(0, Math.round(Number(st.qty)||0));
  if(qty<=0){toast('اكتب عدد الألواح');return;}
  const dName = (DOORS.find(x=>x.code===st.code)||{}).name || '';
  const key = 'panel|'+st.code;
  const ex = state.cart.find(it=>it.kind==='panel' && it.key===key);

  else{
    state.cart.push({
      kind:'panel', key, qty, code:st.code, price:PRODIUM_PRICE, unit:'لوح',

    });
