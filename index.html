/* ============================================================
   تجهيز الصور والـ PDF — نسخة محسّنة ضد التهنيج
   المشاكل اللي كانت بتهنّج التطبيق واتحلّت هنا:
   ١) html2canvas بينسخ الصفحة كلها قبل ما يرسم، وصفحتنا فيها صور الأبواب
      كلها base64 (حجم كبير) — فكنا بندفع التكلفة دي في كل تصدير.
      الحل: نخفي شبكة الأبواب مؤقتًا وقت الرسم (onclone) فمابتتنسخش.
   ٢) scale ثابت ٢ حتى للتقارير الطويلة — كان بيطلع كانفس بملايين البكسلات
      فالمتصفح بيقع. الحل: scale بيتحسب حسب طول المستند مع سقف أقصى للبكسلات.
   ٣) الـ PDF الطويل كان بيحط نسخة كاملة من الصورة في كل صفحة (تكرار ضخم).
      الحل: بنقصّ كل صفحة لوحدها من الكانفس ونحطها بحجمها بس.
   ٤) العمليات التقيلة كانت بتقفل الواجهة تمامًا. الحل: بنسيب المتصفح
      يتنفّس بين الخطوات (yield_) فالشاشة تفضل تتحرك ومؤشر التحميل يبان.
   ============================================================ */

const MAX_CANVAS_PIXELS = 16e6;   // سقف آمن يشتغل على الموبايلات الضعيفة

// بتسيب المتصفح يرسم قبل ما نكمل — بتمنع تجميد الواجهة
function yield_(ms){
  return new Promise(r=>requestAnimationFrame(()=>setTimeout(r, ms||0)));
}

const _paperImgPng_=new Map();
// بترسم محتوى #paper وترجّع canvas — بتظبط الـ scale لوحدها حسب الطول
const MAX_TILED_PIXELS = 100e6;   // سقف إجمالي الشرايط (الزمن بيطول جدًا فوقه: 115 مليون بكسل اخد 4 دقايق في الاختبار): فوقه رسالة خطأ واضحة بدل ملف فاضي
// فحص إن اللوحة (أو كل شريط) فيها حبر فعلًا — بدونه كانفس أكبر من حد الجهاز كان بيطلع صفحات بيضاء ورسالة نجاح.
function paperCanvasHasInk_(c){
  try{
    if(!c||!c.width||!c.height) return false;
    const pw=48, ph=Math.max(1,Math.min(1500,Math.round(c.height*pw/c.width)));
    const pr=document.createElement('canvas'); pr.width=pw; pr.height=ph;
    const x=pr.getContext('2d',{willReadFrequently:true}); x.fillStyle='#ffffff'; x.fillRect(0,0,pw,ph);
    x.drawImage(c,0,0,c.width,c.height,0,0,pw,ph);
    const d=x.getImageData(0,0,pw,ph).data;
    for(let i=0;i<d.length;i+=4){ if(d[i]<246||d[i+1]<246||d[i+2]<246) return true; }
  }catch(e){ return true; }   // لو الفحص نفسه فشل مانوقفش التصدير
  return false;
}
function assertPaperInk_(canvas){
  const tiles = canvas._tiles;
  const bad = tiles ? (tiles.every(t=>!paperCanvasHasInk_(t.c)) || tiles.slice(0,-1).some(t=>!paperCanvasHasInk_(t.c))) : !paperCanvasHasInk_(canvas);
  if(bad) throw new Error('الجهاز ما قدرش يرسم التقرير (طلع فاضي)، ولم يُنشأ ملف. جرّب تقليل عدد الطلبات أو افتح التطبيق من جهاز أقوى.');
}
// رسم صفوف [sy, sy+sh) من كانفس عادي أو من شرايط
function drawCanvasRows_(ctx, canvas, sy, sh, dx, dy, dw, dh){
  if(!canvas._tiles){ ctx.drawImage(canvas, 0, sy, canvas.width, sh, dx, dy, dw, dh); return; }
  const k = dh/sh;
  for(const t of canvas._tiles){
    const a=Math.max(sy,t.y), b=Math.min(sy+sh,t.y+t.c.height);
    if(b<=a) continue;
    ctx.drawImage(t.c, 0, a-t.y, t.c.width, b-a, dx, dy+(a-sy)*k, dw, (b-a)*k);
  }
}
async function renderPaper_(html, opts){
  const paper = document.getElementById('paper');
  paper.innerHTML = html;
  await yield_(60);
  await waitExportResource_(Promise.all([...paper.querySelectorAll('img')].map(im=>im.decode())),20000,'انتهت مهلة تحميل صورة في الورقة؛ الطلب والصور الأصلية محفوظين');                       // تفتح مجال للصور/الخطوط تتحمّل
  for(const im of paper.querySelectorAll('img')){
    if(!/^data:|^blob:/.test(im.src)&&new URL(im.src,location.href).origin===location.origin){
      // كاش: نفس الصورة (لوجو/باب) بتتكرر في أسطر كتير — ترميز PNG مرة واحدة بس
      let png=_paperImgPng_.get(im.src);
      if(!png){
        const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;
        c.getContext('2d').drawImage(im,0,0);png=c.toDataURL('image/png');
        if(_paperImgPng_.size>=40)_paperImgPng_.delete(_paperImgPng_.keys().next().value);
        _paperImgPng_.set(im.src,png);
      }
      im.src=png;await im.decode();
    }
  }
  const el = paper.firstElementChild;
  const w = el.offsetWidth || 794;
  const h = el.offsetHeight || 1123;

  // scale المطلوب مقابل السقف المسموح
  let scale = (opts && opts.scale) || 2;
  // التقارير الطويلة (أكتر من ~4 صفحات A4) مش محتاجة دقة x2 — الفرق مش بيبان في PDF
  // بس الوقت والذاكرة بيتضاعفوا. بنقلّل الدقة تدريجيًا مع الطول فالتقرير بيطلع أسرع بكتير.
  const a4h = w * 1.414;
  if(!(opts&&opts.imageQuality)&&h > a4h * 4)      scale = Math.min(scale, 1.5);
  else if(!(opts&&opts.imageQuality)&&h > a4h * 2) scale = Math.min(scale, 1.75);
  const maxScale = Math.sqrt(MAX_CANVAS_PIXELS / Math.max(w*h, 1));
  if(scale > maxScale) scale = Math.max(1, maxScale);

  // لو مطلوب إن كل عنصر بيطابق selector معيّن يبدأ صفحة جديدة إجباريًا (مثلاً كل طلب في تقرير)،
  // بنسجّل مكانه بالبكسل (بمقياس canvas) قبل ما نمسح محتوى الورقة
  let breaksPx = null;
  if(opts && opts.breakSelector){
    const elTop = el.getBoundingClientRect().top;
    breaksPx = Array.from(el.querySelectorAll(opts.breakSelector))
      .map(n => Math.round((n.getBoundingClientRect().top - elTop) * scale))
      .filter(y => y > 0);
  }

  // بلوكات لازم تفضل في صفحة واحدة (كارت التحويل والملحوظة) — بنسجّل مكانها بمقياس canvas
  const keepTop = el.getBoundingClientRect().top;
  const keepBlocks = Array.from(el.querySelectorAll('.keep-blk')).map(n=>{
    const r = n.getBoundingClientRect();
    return [Math.round((r.top-keepTop)*scale), Math.round((r.bottom-keepTop)*scale)];
  });

  // v331: حدود صفوف الجداول — علشان التقطيع العادي ما يقطعش صف بين صفحتين
  const rowBlocks = Array.from(el.querySelectorAll('tbody tr')).map(n=>{
    const r = n.getBoundingClientRect();
    return [Math.round((r.top-keepTop)*scale), Math.round((r.bottom-keepTop)*scale)];
  }).filter(r=>r[1]>r[0]);

  await yield_(0);
  const hasRunHdr_ = !!el.querySelector('[data-pdf-running-header]');
  const useTiles_ = !(opts&&opts.tile===false) && !hasRunHdr_ && (w*scale)*(h*scale) > MAX_CANVAS_PIXELS;
  if(useTiles_ && (w*scale)*(h*scale) > MAX_TILED_PIXELS) throw new Error('التقرير كبير جدًا على الجهاز ('+Math.round(w*scale*h*scale/1e6)+' مليون بكسل). قلّل عدد الطلبات أو اعمل التقرير على أجزاء، ولم يُنشأ ملف.');
  const h2cOpts_ = {
    scale,
    backgroundColor:'#ffffff',
    useCORS:true,
    logging:false,
    imageTimeout:15000,
    removeContainer:true,
    // أهم سطر: بنشيل صور الكتالوج من النسخة اللي html2canvas بيرسمها
    onclone: doc => {
      doc.querySelectorAll('.rail, .secnav, .tabs, #view, #reportPreviewOverlay, .rpv, dialog').forEach(n=>{
        if(!n.contains(doc.getElementById('paper'))) n.remove();
      });
    }
  };
  let canvas;
  if(useTiles_){
    // التقرير أطول/أكبر من اللي الكانفس الواحد يستحمله: بنرسمه على شرايط ونقطّعه لصفحات من الشرايط.
    // (السبب القديم: كانفس واحد أكبر من حد المتصفح كان بيطلع صفحات بيضاء مع رسالة نجاح.)
    const tileCss = Math.max(400, Math.floor(Math.min(12000, 8e6/(w*scale)) / scale));
    const tiles = []; let devH = 0;
    for(let y0=0; y0<h; y0+=tileCss){
      const th = Math.min(tileCss, h-y0);
      const c = await html2canvas(el, Object.assign({}, h2cOpts_, {y:y0, height:th, windowHeight:Math.max(h, th)}));
      tiles.push({c, y:devH}); devH += c.height;
      await yield_(0);
    }
    canvas = {width: tiles[0].c.width, height: devH, _tiles: tiles};
  }else{
    canvas = await html2canvas(el, h2cOpts_);
  }
  // Order identity is rendered separately, reserving real space on every PDF page.
  const identity = el.querySelector('[data-pdf-running-header]');
  if(identity){
    const bounds=n=>{const r=n.getBoundingClientRect();return [Math.floor((r.top-keepTop)*scale),Math.ceil((r.bottom-keepTop)*scale)];};
    const table=el.querySelector('[data-order-lines]');
    const rows=table&&table.tBodies[0]?Array.from(table.tBodies[0].children).filter(n=>n.tagName==='TR'):[];
    const rowBounds=rows.map(bounds),groups=[];
    rows.forEach((row,i)=>{if(Array.from(row.cells).some(c=>c.colSpan>1)&&rows[i+1])groups.push([rowBounds[i][0],rowBounds[i+1][1]]);});
    const head=table&&table.tHead?bounds(table.tHead):null;
    const firstData=rows.findIndex(row=>!Array.from(row.cells).some(c=>c.colSpan>1));
    if(head&&firstData>=0)groups.push([head[0],rowBounds[firstData][1]]);
    const copy=identity.cloneNode(true);
    copy.style.display='block';copy.style.width=w+'px';copy.style.position='relative';copy.style.boxSizing='border-box';
    paper.appendChild(copy);
    const header=await html2canvas(copy,{scale,backgroundColor:'#ffffff',logging:false,removeContainer:true});
    copy.remove();
    canvas._docPages={header,head,tableBottom:table?bounds(table)[1]:0,rows:rowBounds,groups,
      mandatory:Array.from(el.querySelectorAll('[data-door-drawing],[data-standalone-part]')).map(bounds)};
  }
  paper.innerHTML = '';
  canvas._keep = keepBlocks;
  canvas._rows = rowBlocks;
  assertPaperInk_(canvas);
  await yield_(0);
  return { canvas, breaksPx };
}

// بتحوّل canvas لـ PDF بتقطيع صفحات حقيقي (مش تكرار نفس الصورة)

// بيحاول يشارك الملف مباشرة (بيظهر واتساب في شاشة المشاركة لو متاحة)، ولو مش متاحة بينزّله عادي
async function shareOrDownload_(blob, filename, title){
  fileReadyDialog357_(blob, filename, title);
  return true;
}

// بيرجّع ارتفاع آخر سطر فيه محتوى فعلي على اللوحة (مش خلفية بيضاء) + هامش صغير.
// بدونه أي سنتيمتر زيادة عن آخر صفحة (هوامش/حشو أبيض) كان بيطلع صفحة أخيرة فاضية تمامًا.
function contentBottomPx_(canvas, pxPerMm){
  if(canvas._tiles){
    for(let i=canvas._tiles.length-1;i>=0;i--){
      const t=canvas._tiles[i], r=contentBottomPx_(t.c, pxPerMm);
      const raw = r - Math.round(4*pxPerMm);
      if(r < t.c.height || paperCanvasHasInk_(t.c)) return Math.min(canvas.height, t.y + (r<t.c.height? r : t.c.height));
    }
    return canvas.height;
  }
  try{
    const w = canvas.width, h = canvas.height, ctx = canvas.getContext('2d');
    const total = w*h, BAND = 128;
    // نفس العينة القديمة بالظبط (كل بكسل رابع من آخر بكسل رجوعًا) بس على شرايط ١٢٨ صف —
    // بدل ما نقرا الكانفس كله (ممكن ٦٤ ميجا) وبيخرج بدري أول ما يلاقي محتوى.
    for(let r1 = h; r1 > 0; r1 -= BAND){
      const r0 = Math.max(0, r1 - BAND);
      const data = ctx.getImageData(0, r0, w, r1 - r0).data, base = r0*w;
      let p = total - 1 - 4*Math.ceil((total - r1*w)/4);
      for(; p >= base; p -= 4){
        const i = (p - base) << 2;
        if(data[i] < 242 || data[i+1] < 242 || data[i+2] < 242){
          return Math.min(h, Math.floor(p / w) + 1 + Math.round(4 * pxPerMm));   // ~٤ مم تحت آخر محتوى
        }
      }
    }
  }catch(e){}
  return canvas.height;
}

// بتقطّع الـ canvas لصفحات A4. لو opts.hardBreaksPx موجودة، كل نقطة فيها بتبدأ صفحة جديدة إجباريًا
// (مثلاً بداية كل طلب في تقرير) — والمقطع اللي أطول من صفحة واحدة بيتقسّم تلقائي زي العادي جواه.

// Pagination for a single order/quote. Other report exports keep their own rules.
async function canvasToDocPdf_(canvas, filename, opts){
  const {jsPDF}=window.jspdf,pdf=new jsPDF('p','mm','a4');
  const PW=210,PH=297,FOOT=5,ppm=canvas.width/PW,meta=canvas._docPages;
  const headerH=meta.header.height/ppm;
  const baseCapacity=Math.floor((PH-FOOT-headerH)*ppm);
  const columnH=meta.head?meta.head[1]-meta.head[0]:0;
  if(baseCapacity<=columnH+60)throw new Error('بيانات رأس الصفحة أطول من المساحة المتاحة؛ راجع طول اسم العميل ورقم الأوردر');
  const effH=contentBottomPx_(canvas,ppm),keeps=[...(canvas._keep||[]),...meta.rows,...meta.groups];
  const hard=(opts.hardBreaksPx||[]).filter(y=>y>0&&y<effH).sort((a,b)=>a-b);
  const pages=[];let start=0;
  while(start<effH){
    const repeat=!!(meta.head&&start>=meta.head[1]-1&&start<meta.tableBottom-1);
    const capacity=(start===0?Math.floor((PH-FOOT)*ppm):baseCapacity)-(repeat?columnH:0);
    const required=[...meta.rows,...meta.mandatory].find(([a,b])=>a>=start-1&&a<start+capacity&&b-a>capacity);
    if(required)throw new Error('أحد بنود الأوردر أطول من صفحة كاملة؛ راجع طول وصفه قبل تصدير المستند');
    let end=Math.min(effH,start+capacity,hard.find(y=>y>start+1)||Infinity);
    // Resolve overlapping/nested blocks repeatedly, independent of DOM order.
    for(let pass=0;pass<keeps.length+1;pass++){
      const crossing=keeps.filter(([a,b])=>b-a<=capacity&&a>start+1&&a<end-1&&b>end+1);
      if(!crossing.length)break;
      const next=Math.min(...crossing.map(r=>r[0]));
      if(next>=end)break;end=next;
    }
    if(end<=start)throw new Error('تعذّر تقسيم المستند بدون قطع أحد البنود');
    pages.push({start,height:end-start,repeat});start=end;
  }
  const probe=document.createElement('canvas'),pctx=probe.getContext('2d',{willReadFrequently:true});
  const visible=pages.filter(p=>{
    probe.width=48;probe.height=Math.max(1,Math.round(p.height*48/canvas.width));
    pctx.fillStyle='#fff';pctx.fillRect(0,0,probe.width,probe.height);
    pctx.drawImage(canvas,0,p.start,canvas.width,p.height,0,0,probe.width,probe.height);
    const d=pctx.getImageData(0,0,probe.width,probe.height).data;
    for(let i=0;i<d.length;i+=4)if(d[i]<246||d[i+1]<246||d[i+2]<246)return true;
    return false;
  });
  if(!visible.length)throw new Error('المستند لا يحتوي على بيانات قابلة للطباعة');
  const identityImage=meta.header.toDataURL('image/png');
  let columnImage='';
  if(meta.head){
    const c=document.createElement('canvas');c.width=canvas.width;c.height=columnH;
    c.getContext('2d').drawImage(canvas,0,meta.head[0],canvas.width,columnH,0,0,canvas.width,columnH);
    columnImage=c.toDataURL('image/png');
  }
  const slice=document.createElement('canvas');slice.width=canvas.width;
  const ctx=slice.getContext('2d',{alpha:false});
  // Kept as harmless render metadata for independent pagination checks.
  canvas._docPdfPages=visible.map((p,i)=>({...p,identity:true,mainIdentity:i===0,headerHeightPx:i?meta.header.height:0}));
  for(let i=0;i<visible.length;i++){
    const p=visible[i];if(i)pdf.addPage();
    if(i)pdf.addImage(identityImage,'PNG',0,0,PW,headerH,undefined,'FAST');
    let y=i?headerH:0;
    if(p.repeat){pdf.addImage(columnImage,'PNG',0,y,PW,columnH/ppm,undefined,'FAST');y+=columnH/ppm;}
    slice.height=p.height;ctx.fillStyle='#fff';ctx.fillRect(0,0,slice.width,slice.height);
    ctx.drawImage(canvas,0,p.start,canvas.width,p.height,0,0,canvas.width,p.height);
    pdf.addImage(slice.toDataURL('image/jpeg',0.88),'JPEG',0,y,PW,p.height/ppm);
    pdf.setFontSize(8);pdf.setTextColor(120,130,145);
    pdf.text(String(i+1)+' / '+visible.length,PW/2,PH-2.5,{align:'center'});
    if(i%2===1)await yield_(0);
  }
  if(opts.share!==false){await shareOrDownload_(pdf.output('blob'),filename,filename);return;}
  pdf.save(filename);
}

async function canvasToPdf_(canvas, filename, opts){
  opts = opts || {};
  if(canvas._docPages) return canvasToDocPdf_(canvas, filename, opts);
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF('p','mm','a4');
  const PW = 210, PH = 297;
  const FOOT_H = 5;                               // مساحة صغيرة أسفل الصفحة لرقم الصفحة بس
  const usableH = PH - FOOT_H;
  const pxPerMm = canvas.width / PW;
  const pageHpx  = Math.floor(usableH * pxPerMm); // المحتوى بيتقص على الارتفاع المتاح بس
  const effH = contentBottomPx_(canvas, pxPerMm);   // قص أي مساحة بيضاء زيادة في الآخر (مانع الصفحة الفاضية)

  const hardBreaks = (opts.hardBreaksPx||[]).filter(y=>y>0 && y<effH).sort((a,b)=>a-b);
  // لو بلوك «لازم يفضل مع بعضه» هيتقطع بين صفحتين، نبدأ صفحة جديدة عنده (لو أقصر من صفحة)
  (canvas._keep||[]).forEach(([top,bot])=>{
    const prev = hardBreaks.filter(y=>y<=top).pop() || 0;
    const rt = top-prev, rb = bot-prev;
    if(rb-rt <= pageHpx && Math.floor(rt/pageHpx) !== Math.floor((rb-1)/pageHpx)){
      hardBreaks.push(top); hardBreaks.sort((a,b)=>a-b);
    }
  });
  const segBounds = [0, ...hardBreaks, effH];
  let segments = [];
  for(let i=0;i<segBounds.length-1;i++){
    if(segBounds[i+1] > segBounds[i]) segments.push([segBounds[i], segBounds[i+1]]);
  }

  const slice = document.createElement('canvas');
  // willReadFrequently:false + إعادة استخدام نفس اللوحة بدل ما نعيد حجزها كل صفحة.
  // تغيير width/height بيمسح اللوحة ويعيد حجز الذاكرة، وده كان بيتعمل لكل صفحة
  // حتى لما الطول مايكونش اتغيّر — أبطأ حاجة في تجهيز تقرير طويل.
  const ctx = slice.getContext('2d', { alpha:false });
  slice.width = canvas.width;

  // فواصل الأقسام وبلوكات keep ممكن تسيب شرائح كلها فراغ أبيض (ذيل مقطع بعد
  // حد صفحة طبيعي مثلاً) فتطلع صفحة فاضية — نفحص كل شريحة ونشيل الفاضي منها.
  const slices = [];
  // v331: لو صف جدول (أقصر من صفحة) هيتقطع عند حد الصفحة، بننهي الصفحة قبله والصف يبدأ الصفحة اللي بعدها.
  // الشرايح متتالية بدون فجوة ولا تداخل، فمفيش صف بيتحذف ولا بيتكرر.
  const rowsPx_ = canvas._rows || [];
  segments.forEach(([s,e])=>{
    let sy = s;
    while(sy < e){
      let end = Math.min(e, sy + pageHpx);
      if(end < e){
        for(let pass=0; pass<=rowsPx_.length; pass++){
          const cut = rowsPx_.filter(([a,b])=>b-a<=pageHpx && a>sy+1 && a<end-1 && b>end+1);
          if(!cut.length) break;
          const next = Math.min(...cut.map(r=>r[0]));
          if(next<=sy+1 || next>=end) break;
          end = next;
        }
      }
      slices.push([sy, end-sy]);
      sy = end;
    }
  });
  const probe = document.createElement('canvas');
  const pctx = probe.getContext('2d', {willReadFrequently:true});
  const sliceBlank = ([sy,sh])=>{
    const pw = 48;
    const ph = Math.max(1, Math.round(sh * pw / canvas.width));
    probe.width = pw; probe.height = ph;
    pctx.fillStyle = '#ffffff'; pctx.fillRect(0,0,pw,ph);
    drawCanvasRows_(pctx, canvas, sy, sh, 0, 0, pw, ph);
    const d = pctx.getImageData(0,0,pw,ph).data;
    for(let i=0;i<d.length;i+=4){ if(d[i]<246||d[i+1]<246||d[i+2]<246) return false; }
    return true;
  };
  const keptSlices = slices.filter(sg=>!sliceBlank(sg));
  if(keptSlices.length) slices.length = 0, slices.push(...keptSlices);

  const totalPages = slices.length;
  canvas._pdfSlices = slices.map(x=>x.slice());   // metadata للفحص المستقل فقط

  let pageIdx = 0;
  for(const [sy, sh] of slices){
      if(slice.height !== sh) slice.height = sh;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0,0,slice.width,slice.height);
      drawCanvasRows_(ctx, canvas, sy, sh, 0, 0, canvas.width, sh);

      if(pageIdx > 0) pdf.addPage();
      pdf.addImage(slice.toDataURL('image/jpeg',0.88), 'JPEG', 0, 0, PW, sh / pxPerMm);

      if(totalPages > 1){
        pdf.setFontSize(8);
        pdf.setTextColor(120,130,145);
        pdf.text(String(pageIdx+1) + ' / ' + totalPages, PW/2, PH - 2.5, {align:'center'});
      }
      pageIdx++;
      if(pageIdx % 2 === 0) await yield_(0);          // منع تجميد الواجهة من غير ما نبطّأ التقرير
  }
  // ⚠️ المشاركة كانت خيار اختياري (opts.share) — واتنين من أربع نداءات نسيوه،
  // منهم مستند الطلب وعرض السعر نفسهم. النتيجة إن أهم ورقتين بيبعتهم المصنع
  // كانوا بينزّلوا في مجلد التنزيلات على الموبايل بدل ما تتفتح شاشة المشاركة.
  // بقت هي الافتراضي: اللي عايز تنزيل مباشر يطلبه صراحة بـ share:false.
  if(opts.share !== false){
    const blob = pdf.output('blob');
    await shareOrDownload_(blob, filename, filename);
    return;
  }
  pdf.save(filename);
}

// ومش مكتوب على أي ورقة عنده. نفس باج v137 اللي اتصلّح للواتساب والمستند.
function prevOrderNoText_(o){

function orderNoText_(o){
  if(!o) return '';

  if(!n) return '#' + (o.id || '');

  return ec > 0 ? (n + '/' + ec) : String(n);
}

function deviceId_(){

// بنستخدم JSONP (وسم script) بدل fetch — أضمن مع Apps Script ومفيش مشاكل CORS
// ⚠️ المهلات كانت متناثرة بأرقام عشوائية: ١٢ ثانية لجلب الأسعار، ١٥ للافتراضي،
// ٢٠ لإرسال الطلب، ٢٥ لتقرير الأصناف. وأقصر واحدة فيهم (الأسعار) بتتنادى عند
// فتح التطبيق بالظبط — وقت ما Apps Script بيبقى «نايم» ورده بياخد أطول حاجة.
// Apps Script بطيء بطبعه (بيصحّى من السكون + بيقرا الشيت)، والفشل الحقيقي في
// الشبكة بيوصل فورًا من sc.onerror مش بالمهلة — فالمهلة الطويلة مابتأخّرش
// المستخدم في حالة العطل، بس بتديه فرصة لما السيرفر يكون بطيء وخلاص.
const JSONP_TIMEOUT_MS = 25000;
function jsonp(url, timeout){
  return new Promise((res, rej) => {
    const cb = 'wpcb' + Date.now() + Math.floor(Math.random()*999);
    const sc = document.createElement('script');
    const t = setTimeout(() => { cleanup(); rej(new Error('انتهت المهلة')); }, timeout || JSONP_TIMEOUT_MS);
    function cleanup(){ clearTimeout(t); delete window[cb]; sc.remove(); }
    window[cb] = d => { cleanup(); rememberArtworkLifetimes_(d); res(d); };
    sc.onerror = () => { cleanup(); rej(new Error('تعذّر الاتصال')); };
    sc.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.body.appendChild(sc);
  });
}

/* v326: an order the factory confirmed and later deleted must leave "My orders", whatever its status.
   Evidence: a successful action=list for the same phone. The server reads the whole Orders sheet for that phone
   (every status, archived and delivered included, no paging), and a row leaves the sheet only when the factory
   deletes it. A confirmed order is written together with its receipt, so it cannot be missing for lack of a write,
   except an order confirmed after this list request started: those are skipped by their confirmation time
   (wpc_sentat326), not by age. Never touched: pending, unconfirmed or rejected orders (a pending edit that points
   at a deleted original stays). An empty list counts only if this device earlier saw a non-empty list for the same
   phone. Every removed order, restored copies included, is copied to wpc_factory_removed_backup326 first, and the
   id is marked deleted so no local merge brings it back. */
function pruneFactoryDeleted326_(rows,phone,t0){
  if(!Array.isArray(rows))return 0;
  const key=String(phone||'').replace(/\D/g,'').slice(-9);if(key.length<9)return 0;
  const proven=load('wpc_phoneseen326',{});
  if(rows.length)proven[key]=1;
  else if(!proven[key])return 0;
  save('wpc_phoneseen326',proven);
  const listed=new Set(rows.map(r=>String(r&&r.id)));
  const pending=new Set(loadPendingSync_().map(String)),rejected=new Set(loadRejected_().map(String)),sent=new Set(loadSent_().map(String));
  const sentAt=load('wpc_sentat326',{});let ledger={};try{ledger=dispatchLedger294_()||{};}catch(e){}
  const gone=[];
  state.orders.forEach(o=>{
    if(!o||o.id==null)return;const id=String(o.id);
    if(listed.has(id))return;
    if(pending.has(id)||rejected.has(id))return;
    if(sentAt[id]&&t0&&Number(sentAt[id])>=t0)return;
    const led=ledger[id];if(led&&led.state!=='confirmed')return;
    if(!o.restored){
      if(!(sent.has(id)||(led&&led.state==='confirmed')))return;
      if(String(o.phone||'').replace(/\D/g,'').slice(-9)!==key)return;
    }
    gone.push(o);
  });
  if(!gone.length)return 0;
  try{const bk=load('wpc_factory_removed_backup326',[]);gone.forEach(o=>bk.unshift({at:Date.now(),order:o}));if(!save('wpc_factory_removed_backup326',bk.slice(0,200)))return 0;}catch(e){return 0;}
  gone.forEach(o=>markDeleted_(o.id));
  state.orders=state.orders.filter(o=>!gone.includes(o));
  if(state.track&&state.track.rows)state.track.rows=state.track.rows.filter(r=>!gone.some(o=>String(o.id)===String(r.id)));
  saveOrders_(state.orders);
  toast('اتشالت '+gone.length+' طلب اتحذفوا من المصنع من «طلباتي»');
  return gone.length;
}

// v327: السيرفر بقى بيرجّع `deleted` (أرقام طلبات المصنع حذفها) مع قايمة الموبايل.
// ده دليل قاطع إن الطلب كان عند المصنع واتحذف — فبنشيله من «تابع طلبك» حتى لو
// استلامه ما اتأكدش على الجهاز (الحالة اللي pruneFactoryDeleted326_ بتسيبها لأنها
// مابتفرّقش بين «اتحذف» و«لسه ماوصلش»).
function applyFactoryTombstones327_(ids,phone){
  if(!Array.isArray(ids)||!ids.length)return 0;
  const key=String(phone||'').replace(/\D/g,'').slice(-9);if(key.length<9)return 0;
  const dead=new Set(ids.map(String));
  const listed=new Set((state.track&&state.track.rows||[]).map(r=>String(r&&r.id)));
  const gone=state.orders.filter(o=>o&&o.id!=null&&dead.has(String(o.id))&&!listed.has(String(o.id))&&String(o.phone||'').replace(/\D/g,'').slice(-9)===key);
  if(!gone.length)return 0;
  try{const bk=load('wpc_factory_removed_backup326',[]);gone.forEach(o=>bk.unshift({at:Date.now(),order:o}));if(!save('wpc_factory_removed_backup326',bk.slice(0,200)))return 0;}catch(e){return 0;}   // v328: no backup, no removal
  const goneIds=new Set(gone.map(o=>String(o.id)));
  gone.forEach(o=>markDeleted_(o.id));
  state.orders=state.orders.filter(o=>!goneIds.has(String(o.id)));
  if(state.track&&state.track.rows)state.track.rows=state.track.rows.filter(r=>!goneIds.has(String(r.id)));
  try{const pend=loadPendingSync_().filter(id=>!goneIds.has(String(id)));if(pend.length!==loadPendingSync_().length)savePendingSync_(pend);}catch(e){}
  saveOrders_(state.orders);
  toast('اتشالت '+gone.length+' طلب اتحذفوا من المصنع من «تابع طلبك»');
  return gone.length;
}
async function loadTrack(){
  if(!APPS_SCRIPT_URL){ state.track.err='مفيش رابط سيرفر متظبّط'; render(); return; }
  state.track.loading = true; state.track.err = ''; render();
  try{
    const phone = String(state.profile.phone||'').trim();
    const t0_326 = Date.now();
    const d = await jsonp(APPS_SCRIPT_URL + '?action=list&dev=' + encodeURIComponent(deviceId_())
      + '&phone=' + encodeURIComponent(phone));
    if(!d || !d.ok) throw new Error((d && d.error) || 'رد غير متوقع');
    state.track.rows = d.orders || [];
    state.track.t0_326 = t0_326;
    state.track.at = Date.now();
    state.track.phoneUsed = phoneKey_();
    mergeRestored_(state.track.rows);
    // بنحدّث رقم الطلب "العادي" وعدد التعديلات في النسخة المحلية من أي رد سيرفر بيوصلنا،
    // عشان لو الرد الأول وقت الإرسال ضاع (النت اتقطع) يتظبط تلقائي أول ما نفتح "تابع طلبك"
    let changedLocal=false;
    state.track.rows.forEach(r=>{
      const lo = state.orders.find(x=>String(x.id)===String(r.id));
      if(lo && r.displayNo && (lo.displayNo!==r.displayNo || lo.editCount!==r.editCount)){
        lo.displayNo=r.displayNo; lo.editCount=r.editCount||0; changedLocal=true;
      }
    });
    if(changedLocal) saveOrders_(state.orders);
    try{applyFactoryTombstones327_(d.deleted,phone);}catch(e){}
    try{pruneFactoryDeleted326_(Array.isArray(d.orders)?state.track.rows:null,phone,t0_326);}catch(e){}
    for(const id of loadPendingSync_()){
      const lo=state.orders.find(o=>String(o.id)===String(id));
      const hit=state.track.rows.find(r=>String(r.id)===String(id));
      if(lo&&hit&&String(lo.phone||'').trim()===phone){try{await reconcileReceipt280_(lo,hit);}catch(e){}}
    }
  }catch(err){
    state.track.err = err.message || String(err);
  }
  state.track.loading = false; render();
}

/* ============================================================
   شاشة المصنع — تغيير حالة الطلب (بكلمة سر)
   ============================================================ */
// ⚠️ شاشة المصنع كانت بتفضل فاضية بتلف لحد ما السيرفر يرد. Apps Script بطيء
// بطبعه (بيصحّى من السكون + بيقرا الشيت كله)، فالمصنع كان بيستنى كل مرة يفتح
// الشاشة أو يبدّل تبويب.
// دلوقتي بنحفظ آخر قايمة وصلت، وبنعرضها فورًا وإحنا بنجيب الجديدة في الخلفية.
// الشاشة بتفتح على طول، والأرقام بتتحدّث لوحدها أول ما الرد يوصل.
// ⚠️ باج تاني كان بيخلّي الحذف «ما يمسكش»: الفحص الخلفي بيجيب قايمة الطلبات
// كل ٩٠ ثانية، وبيكتبها فوق القايمة المعروضة. لو النداء ده كان طالع قبل الحذف
// (أو طلع وقت ما الحذف لسه شغّال على السيرفر)، الرد بييجي وفيه الطلب المحذوف
// — فالسطر بيرجع يبان تاني بعد ثواني، والمصنع يفتكر إن الحذف مش بيشتغل.
// بنفتكر اللي اتحذف من هنا لمدة ٥ دقايق، وبنشيله من أي قايمة جاية من السيرفر.
const _deletedIds = new Map();          // معرّف الطلب → وقت الحذف
const DELETED_TTL_MS = 5 * 60 * 1000;
function excludeSuperseded_(rows){ // v325: replaced orders stay in the Sheet as history only; never counted again
  const list=rows||[];const repl=new Set(list.map(r=>r&&r.replacesId?String(r.replacesId):'').filter(Boolean));
  return list.filter(o=>o && !o.superseded && !repl.has(String(o.id)));
}
function dropDeleted_(rows){
  rows = excludeSuperseded_(rows);
  const now = Date.now();
  _deletedIds.forEach((t,id)=>{ if(now - t > DELETED_TTL_MS) _deletedIds.delete(id); });
  if(!_deletedIds.size) return rows || [];
  return (rows || []).filter(o => !_deletedIds.has(String(o.id)));
}

const LS_ADM_CACHE = 'wpc_adm_rows';

function saveAdminCache_(rows){
  try{ localStorage.setItem(LS_ADM_CACHE, JSON.stringify({at:Date.now(), rows:rows||[]})); }catch(e){}
}
function loadAdminCache_(){
  try{
    const c = JSON.parse(localStorage.getItem(LS_ADM_CACHE)||'null');
    // بنسيبها ٧ أيام — أقدم من كده الأرقام بتبقى مضلّلة أكتر من إنها مفيدة
    if(c && Array.isArray(c.rows) && (Date.now()-c.at) < 7*24*3600*1000) return c;
  }catch(e){}
  return null;
}
function clearAdminCache_(){ try{ localStorage.removeItem(LS_ADM_CACHE); }catch(e){} }

// بتقارن نسخة السكربت المنشور بالمطلوبة. ما بترجّعش حاجة — بتحدّث state
// والشاشة بتعرض السطر لوحدها. أي فشل (نت، سكربت قديم مابيرجّعش srv) بيتسجّل
// كـ«مش معروف» مش كـ«تمام» — الافتراض الأأمن إننا مانعرفش.
// الـping رد صغير جدًا، فمهلة أقصر من العادي كفاية — ومش عايزينه يقعد
// يستنى ٢٥ ثانية وهو مجرد سؤال عن نسخة.
const PING_TIMEOUT_MS = 15000;
async function checkServerBuild_(){
  if(state.admin.srvChecking) return;
  state.admin.srvChecking = true;
  try{
    const d = await jsonp(APPS_SCRIPT_URL + '?action=ping', PING_TIMEOUT_MS);
    state.admin.srv = (d && d.ok && d.srv) ? String(d.srv) : '';
    state.admin.srvErr = '';
  }catch(e){
    state.admin.srv = null;                 // null = مافيش رد خالص
    state.admin.srvErr = e && e.message ? e.message : 'مفيش رد';
  }
  state.admin.srvChecking = false;
  render();
}

// السطر اللي المصنع بيشوفه. تمام؟ مابيبانش خالص — مش عايزين سطر زيادة على
// الشاشة كل يوم. قديم أو مش معروف بس هو اللي بيظهر.
function srvBuildNote_(){
  const v = state.admin.srv;
  if(v === undefined || v === SRV_BUILD_WANT) return '';
  if(v === null) return `<div class="ordnote">${ico("warn")}<span>مش قادرين نتأكد من نسخة السكربت على جوجل (${esc(state.admin.srvErr||'مفيش رد')}). لو الأرصدة أو تعديل الأصناف بيعمل مشاكل، افتح جوجل شيت ▸ Extensions ▸ Apps Script وتأكد إنك عملت <b>Deploy ▸ New version</b> على <b>نفس</b> الـdeployment.</span></div>`;
  return `<div class="ordnote">${ico("warn")}<span>السكربت المنشور على جوجل نسخة <b>${esc(v||'قديمة جدًا')}</b> والتطبيق محتاج <b>${SRV_BUILD_WANT}</b>. انسخ <b>apps_script.gs</b> كله من جديد واعمل <b>Deploy ▸ New version</b> على <b>نفس</b> الـdeployment — مش deployment جديد، عشان الرابط مايتغيّرش.</span></div>`;
}

async function adminLoad(){
  // فيه نسخة محفوظة ومفيش حاجة معروضة؟ اعرضها فورًا بدل شاشة الانتظار
  if(!state.admin.rows){
    const c = loadAdminCache_();
    if(c){
      state.admin.rows = c.rows;
      state.admin.open = true;
      state.admin.staleAt = c.at;       // عشان نقول للمستخدم إن دي نسخة محفوظة
    }
  }
  state.admin.loading = true; state.admin.err = ''; render();
  try{
    const d = await jsonp(APPS_SCRIPT_URL + '?action=list' + admParams_());
    if(!d || !d.ok) throw new Error((d && d.error) || 'رد غير متوقع');
    state.admin.rows = dropDeleted_(d.orders);
    state.admin.open = true;
    state.admin.staleAt = null;         // البيانات بقت من السيرفر مباشرة
    saveAdminCache_(state.admin.rows);
    sessionStorage.setItem('wpc_adm', state.admin.pw);
    markAdminSeen_(state.admin.rows);       // فتح الشاشة فعليًا = المصنع شاف كل الطلبات الحالية
    state.admin.pendingCount = 0; updateAdmBadge();
    if('Notification' in window && Notification.permission==='default') Notification.requestPermission();
    startAdminPolling();
    // ⚠️ كلمة سر المصنع متخزّنة في sessionStorage وبتتمسح لما التطبيق يتقفل.
    // فلو المصنع عدّل الأسعار وهو أوفلاين وقفل التطبيق، الرفع مكانش يقدر يشتغل
    // تاني (محتاج كلمة السر) ومزامنة الأسعار كانت هتفضل واقفة. الدخول نفسه
    // بيشغّلها دلوقتي — فأول ما يدخل، اللي لسه ما اترفعش بيترفع.
    syncPricesFromServer_();
    checkServerBuild_();                    // مرة كل دخول — رد صغير وبيتكاش
  }catch(err){
    state.admin.err = err.message || String(err);
    // فشل التحديث وعندنا نسخة محفوظة معروضة؟ سيبها شغّالة بدل ما نقفل الشاشة
    // على المصنع — نسخة قديمة أحسن من شاشة فاضية وقت ما النت يقطع.
    if(!state.admin.staleAt) state.admin.open = false;
  }
  state.admin.loading = false; render();
}


async function setStatus(id, st){
  // بنمسك الرقم قبل أي حاجة: التسليم بيشيل الصف من القايمة، وبعدها مش هنلاقي
  // رقمه التسلسلي فالرسالة كانت بترجع للكود الداخلي
  const رقم_الطلب = adminOrderNoText_(id);
  state.admin.busy = id; render();
  try{
    const d = await jsonp(APPS_SCRIPT_URL
      + '?action=setStatus' + admParams_()
      + '&id=' + encodeURIComponent(id)
      + '&status=' + encodeURIComponent(st));
    if(!d || !d.ok) throw new Error((d && d.error) || 'فشل التحديث');
    const row = (state.admin.rows||[]).find(o=>String(o.id)===String(id));
    if(row) row.status = st;
    if(d.archived){
      // تسليم الطلب بيأرشفه أوتوماتيك — يتشال من القايمة النشطة على طول
      state.admin.rows = (state.admin.rows||[]).filter(o=>String(o.id)!==String(id));
      state.admin.archRows = null;   // الكاش بقى قديم، هيتحمّل تاني لما المصنع يفتح الأرشيف
      toast('اتحدّثت حالة الطلب ' + رقم_الطلب + ' → ' + (STATUS[st] ? STATUS[st].ar : st) + ' — واتأرشف تلقائي');
    } else {
      toast('اتحدّثت حالة الطلب ' + رقم_الطلب + ' → ' + (STATUS[st] ? STATUS[st].ar : st));
    }
  }catch(err){
    toast('تعذّر التحديث: ' + (err.message || err));
  }
  state.admin.busy = null; render();
}

async function loadArchive(force){
  const a = state.admin;
  if(!force && a.archRows) return;   // متحمّلناش تاني لو محمّل خلاص، إلا لو طلب تحديث صريح
  a.archLoading = true; render();
  try{
    const d = await jsonp(APPS_SCRIPT_URL + '?action=list' + admParams_() + '&archived=1');
    if(!d || !d.ok) throw new Error((d && d.error) || 'رد غير متوقع');
    a.archRows = dropDeleted_(d.orders).slice().sort((x,y)=>String(y.updated||y.date||'').localeCompare(String(x.updated||x.date||'')));   // الأحدث أرشفةً الأول
  }catch(err){
    toast('تعذّر تحميل الأرشيف: ' + (err.message || err));
    a.archRows = a.archRows || [];
  }
  a.archLoading = false; render();
}

async function unarchiveOrder(id){

      + '?action=archiveOrder' + admParams_()

// بيشيل الطلب من كل نسخ الشاشة (النشط + الأرشيف + الأصناف المحمّلة)
function forgetOrderLocally_(id){
  _deletedIds.set(String(id), Date.now());
  state.admin.rows = (state.admin.rows||[]).filter(o=>String(o.id)!==String(id));
  if(state.admin.archRows) state.admin.archRows = state.admin.archRows.filter(o=>String(o.id)!==String(id));
  delete state.admin.items[id]; delete state.admin.itemsOpen[id]; deleteAdmItemsEntry_(id);
  saveAdminCache_(state.admin.rows||[]);
}

// ⚠️ «الحذف بيعلّق والسطر مش بيتمسح من الشيت»:
// الحذف كتابة تقيلة (سطر ملخّص + كل سطور الأصناف + رجوع الرصيد)، والرد بيرجع
// عن طريق JSONP. لو المهلة خلصت أو النت قطع بعد ما السيرفر اشتغل فعلًا،
// التطبيق كان بيقول «تعذّر الحذف» والسطر يفضل في الشاشة — والمصنع يضغط تاني
// ويلاقي «الطلب مش موجود»، فيفتكر إن الحذف مش شغّال.
// دلوقتي: مهلة أطول للحذف، ومحاولة تانية أوتوماتيك لو الاتصال قطع
// (الحذف على السيرفر بقى مُعاد التنفيذ بأمان)، و«الطلب مش موجود» =
// يعني اتمسح خلاص، فبنشيله من الشاشة بدل ما نسيبه معلّق.
const DELETE_TIMEOUT_MS = 60000;

async function deleteOrderCall_(id){
  const d = await jsonp(APPS_SCRIPT_URL
    + '?action=deleteOrder' + admParams_()
    + '&id=' + encodeURIComponent(id), DELETE_TIMEOUT_MS);
  if(d && d.ok) return { gone:true, already:!!d.alreadyGone };
  const msg = (d && d.error) || 'فشل الحذف';
  if(/مش موجود/.test(msg)) return { gone:true, already:true };   // اتمسح قبل كده
  // رد فعلي من السيرفر (كلمة سر غلط مثلاً) — إعادة المحاولة مش هتفيد
  const err = new Error(msg); err.fromServer = true; throw err;
}

async function deleteOrder(id){
  if(!confirm('تأكيد حذف الطلب '+adminOrderNoText_(id)+'؟ الإجراء ده نهائي ومش هيترجع.')) return;
  const رقم_الطلب = adminOrderNoText_(id);
  state.admin.delBusy = id; render();
  try{
    let r;
    try{
      r = await deleteOrderCall_(id);
    }catch(err1){
      // السيرفر رد برفض واضح؟ مفيش فايدة من إعادة المحاولة
      if(err1 && err1.fromServer) throw err1;
      // فشل اتصال/مهلة؟ نعيد النداء مرة واحدة — لو الأولى نجحت على السيرفر
      // التانية هترجع «اتمسح خلاص»، ولو ما نجحتش هتكمّل الشغل اللي وقف
      r = await deleteOrderCall_(id);
    }
    forgetOrderLocally_(id);
    toast(r.already ? ('الطلب ' + رقم_الطلب + ' كان متحذف خلاص — اتشال من القايمة')
                    : ('اتحذف الطلب ' + رقم_الطلب));
  }catch(err){
    toast('تعذّر الحذف: ' + (err.message || err));
  }
  state.admin.delBusy = null; render();
}

// مسح كل الطلبات المؤرشفة (تم التسليم) دفعة واحدة — تنظيف دوري، إجراء نهائي وجماعي فمحتاج تأكيد قوي
async function clearDeliveredOrders(){
  const list = state.admin.archRows || [];
  const n = list.filter(o=>o.status==='Delivered').length;
  if(!n){ toast('مفيش طلبات مؤرشفة لمسحها'); return; }
  if(!confirm('هيتمسح '+n+' طلب من الأرشيف نهائيًا من الشيت (الطلب وكل أصنافه) — الإجراء ده مش قابل للتراجع. متأكد؟')) return;
  if(!confirm('تأكيد أخير: هيتحذف '+n+' طلب فعلًا ونهائيًا. اضغط موافق للمتابعة.')) return;
  state.admin.archLoading = true; render();
  try{
    const d = await jsonp(APPS_SCRIPT_URL
      + '?action=deleteDelivered' + admParams_());
    if(!d || !d.ok) throw new Error((d && d.error) || 'فشل المسح');
    // نفس حكاية الفحص الخلفي: اللي اتمسح دلوقتي ممكن يرجع في رد قايمة
    // كان طالع قبل المسح — فبنفتكره ونشيله من أي قايمة جاية
    (d.ids || list.filter(o=>o.status==='Delivered').map(o=>o.id))
      .forEach(id=>_deletedIds.set(String(id), Date.now()));
    state.admin.archRows = list.filter(o=>o.status!=='Delivered');
    state.admin.rows = (state.admin.rows||[]).filter(o=>o.status!=='Delivered');
    Object.keys(state.admin.items||{}).forEach(id=>{
      if(!(state.admin.rows||[]).find(o=>String(o.id)===id) && !(state.admin.archRows||[]).find(o=>String(o.id)===id)){
        delete state.admin.items[id]; delete state.admin.itemsOpen[id]; deleteAdmItemsEntry_(id);
      }
    });
    toast('اتمسح '+(d.count||n)+' طلب من الأرشيف');
  }catch(err){
    toast('تعذّر المسح: ' + (err.message || err));
  }
  state.admin.archLoading = false; render();
}

// بيحدّث الكمية المطلوبة لصنف معيّن جوه طلب (تعديل يدوي من شاشة المصنع) وبيحدّث إجماليات الطلب في القايمة
// ⚠️ السيرفر ممكن يعدّل/يمسح بند «خدمة قص» لوحده بعد تعديل كمية باب أو حذفه.
// نسخة الأصناف المحفوظة على الجهاز بتبقى ساعتها مزحلقة عن الشيت — والأرقام
// اللي بنبعتها في أي تعديل بعده بتوقع على الصنف الغلط. بنرمي النسخة ونجيبها
// تاني من السيرفر.
async function refreshOrderItems_(id){
  delete state.admin.items[id]; deleteAdmItemsEntry_(id);
  // مسودّات تعديل الكميات متخزّنة بالرقم (id:idx) — بعد ما الترتيب يتغيّر
  // بتبقى بتشاور على أصناف تانية خالص. بنمسحها بدل ما تتطبّق على الغلط.

  });
  Object.keys(state.admin.recvEdit || {}).forEach(k=>{
    if(k.indexOf(id+':')===0) delete state.admin.recvEdit[k];
  });

async function deleteOrderItem_(id, idx){

/* ---------- نداء موحّد لعمليات المصنع ----------
   ⚠️ خمس دوال كانوا بيكرروا نفس الهيكل حرف بحرف: علّم «مشغول» → أعِد الرسم →
   نادِ السيرفر → اتأكد من الرد → طبّق النتيجة → رسالة → صفّر «مشغول» → أعِد
   الرسم، وكل واحدة بتكتب معالجة الخطأ من أول وجديد. أي تعديل على المعالجة كان
   لازم يتعمل ٥ مرات، ونسيان واحدة معناها إن الصف يفضل معطّل للأبد بعد أي خطأ. */
async function adminAction_(o){
  state.admin[o.busyField] = o.busyKey; render();
  try{
    const d = await jsonp(APPS_SCRIPT_URL + '?action=' + o.action + admParams_() + (o.params || ''));
    if(!d || !d.ok) throw new Error((d && d.error) || o.failMsg || 'فشل التحديث');
    if(o.onOk) o.onOk(d);
    toast(typeof o.okMsg === 'function' ? o.okMsg(d) : o.okMsg);
  }catch(err){
    toast((o.errPrefix || 'تعذّر التحديث: ') + (err.message || err));
  }
  state.admin[o.busyField] = null; render();
}

// بيحدّث qty/rods/total لسطر الطلب في state.admin.rows/archRows بعد أي تعديل يدوي على أصنافه
function applyOrderTotals_(id, totals){
  if(!totals) return;
  [state.admin.rows, state.admin.archRows].forEach(list=>{
    const o = (list||[]).find(x=>String(x.id)===String(id));
    if(o){ o.qty = totals.qty; o.rods = totals.rods; o.total = totals.total; }
  });
}

// بيبني order object موحّد من بيانات شاشة المصنع (list + orderItems) — مستخدم في تصدير الـ PDF وفي مشاركة الصورة
// السيرفر بيخزّن اسم الصنف بالإنجليزي بس (Order_Items عمود Item). بنعيد بناء الاسم العربي
// من نفس الكتالوجات اللي التطبيق أصلًا شغال بيها (DOORS/ACCESSORIES)، مش نص إنجليزي متسيّب.
const ACC_EN_TO_AR_ = {}; ACCESSORIES.forEach(a=>{ ACC_EN_TO_AR_[a.en] = a.name; });
// الحفر ليه عمود خاص في الشيت (Milling)، والطباعة علامتها متكتوبة في اسم
// الصنف نفسه («(Print)») — الاتنين بيرجعوا للاسم العربي عشان المصنع يشوفهم
// على سطر الباب في كل مستند، مش في بند تحته بس.
const PRINT_MARK_RE_ = /\(طباعة\)|\(Print\)/i;
function arabicItemTitle_(it){
  if(it.type==='Door'){
    const d = DOORS.find(x=>x.code===doorCode_(it.code));
    const base = d ? ('باب '+d.code+' '+d.name) : (it.code||it.title||'');
    return base + (String(it.milling||'').trim() ? ' (حفر)' : '')
                + (PRINT_MARK_RE_.test(String(it.title||'')) ? ' (طباعة)' : '')
                + (approvedPrintMeta_(it)?' '+approvedPrintMarker_(approvedPrintMeta_(it)):'')
                + (it.itemNote ? ' — '+it.itemNote : '');
  }
  // المقاس محفوظ إنجليزي في الشيت ('10 cm' / '6x9')، والمستند عربي —
  // arabicSizeText_ بتحوّله لـ '10 سم' وبتسيب اللي مش على الصيغة دي زي ما هو.
  // ⚠️ وصف الحلق اللي على الشيت بقى عربي كامل ('حلق كامل 10 سم — A01')، فالسطر
  // كان بيطلع في المستندات «حلق حلق كامل 10 سم — A01 — A01» — الاسم والكود متكررين.
  if(it.type==='Frame' || it.type==='Bror'){
    const بادئة = it.type==='Frame' ? 'حلق' : 'برور';
    const sz = arabicSizeText_(it.size||'');
    let t = sz.indexOf(بادئة)===0 ? sz : (بادئة+' '+sz);
    if(it.code && t.indexOf(it.code)<0) t += ' — '+it.code;
    if(it.forDoorWidth && t.indexOf('لباب '+it.forDoorWidth)<0) t += ' — لباب '+it.forDoorWidth+' سم';
    if(it.itemNote && t.indexOf(it.itemNote)<0) t += ' — '+it.itemNote;
    return t;
  }
  if(it.type==='Panel') return 'لوح بروديوم'+(it.code?' — '+it.code:'');
  if(it.type==='Mabra') return 'معبرة'+(it.size?' '+arabicSizeText_(it.size):'')+(it.code?' — '+it.code:'');
  if(METER_TYPE_TO_KIND_[it.type]) return METER_KINDS_[METER_TYPE_TO_KIND_[it.type]].ar+(it.code?' — '+it.code:'');
  return ACC_EN_TO_AR_[it.title] || it.title || '';
}

// السيرفر بيخزّن المقاس بالإنجليزي ("70 cm" أو "80x210 cm (custom)") — بنحوّله لنفس صيغة
// العميل العربية ("70 سم" أو "80×210 سم (مقاس خاص)") قبل ما نعرضه في أي مستند
function arabicSizeText_(sizeEn){
  const s = String(sizeEn||'').trim();
  let m = /^(\d+(?:\.\d+)?)\s*cm$/i.exec(s);
  if(m) return m[1]+' سم';
  m = /^(\d+(?:\.\d+)?)\s*x\s*(\d+(?:\.\d+)?)\s*cm\s*\(custom\)$/i.exec(s);
  if(m) return m[1]+'×'+m[2]+' سم (مقاس خاص)';
  return s;
}

function buildAdminDocOrder_(o, its, tierKey){
  const items = (its||[]).map(it=>adminDocItem_(it, tierKey));
  // ⚠️ باج كان هنا: الإجمالي كان بيتاخد من o.total زي ما هو — وده دايمًا إجمالي
  // الجملة. لكن السطور بتتسعّر بالمستوى المختار (عميل). يعني عرض السعر
  // اللي بيروح للعميل سطوره مابتجمعش على الإجمالي المكتوب تحتها، والإجمالي أقل
  // من مجموعها. بنحسبه من نفس السطور اللي اتطبعت.
  const total = tierKey && tierKey !== 'dist'
    ? قرش_(items.reduce((sum,it)=>sum + قرش_((Number(it.unitPrice)||0) * (Number(it.qty)||0)), 0))
    : o.total;
  return {
    id:o.id, fromAdmin:true, ts:o.date?new Date(o.date).getTime():Date.now(),
    name:o.dist, phone:o.phone, region:o.region, warehouse:'', total,
    customer:o.customer||'', customerRegion:o.customerRegion||'', note:o.ordNote||'',
    // ⚠️ الحقول دي مكانتش بتتنقل خالص، فمستند المصنع كان بيطبع رقم الطلب الداخلي
    // الطويل (#2026-xxxx) بدل الرقم التسلسلي اللي العميل شايفه في تطبيقه.
    // يعني الورقة اللي في المصنع والورقة اللي مع العميل رقمين مختلفين لنفس الطلب.
    displayNo: o.displayNo || '', editCount: Number(o.editCount)||0, replacesId: o.replacesId || '',
    editedAt: o.editedAt || '', artCompletedAt:o.artCompletedAt||0, artPurgedAt:o.artPurgedAt||0,
    priceTierLabel: tierKey ? (PRICE_TIERS[tierKey]||PRICE_TIERS.dist).label : '',
    priceTier: tierKey || '',
    items
  };
}

// بيحوّل صنف من شكل السيرفر لشكل المستند، وبيسعّره على المستوى المختار
function adminDocItem_(it, tierKey){
  // المقاس بيتخزّن إنجليزي في الشيت ('10 cm')؛ بنعرّبه لكل الأنواع مش الأبواب بس
  const sz = it.type==='Door' ? doorSizeText_(arabicSizeText_(it.size), it.doorHeight)
                              : arabicSizeText_(it.size||'');
  const kind = it.type==='Door'?'door':(it.type==='Frame'?'frame':(it.type==='Bror'?'bror':(it.type==='Panel'?'panel':(it.type==='Mabra'?'mabra':(METER_TYPE_TO_KIND_[it.type]||'acc')))));
  // الحفر بيتعرف من عموده، ولو الطلب قديم مافيهوش العمود بنقراه من الاسم
  const حفرـالصنف = kind==='door' &&
    (!!String(it.milling||'').trim() || /\(حفر\)|\(Carved\)/i.test(String(it.title||'')));
  const price = tierKey
    ? tierPrice(it.unitPrice||0, kind, tierKey, tierKeyFor_(it, kind), {hafr:حفرـالصنف})
    : (it.unitPrice||0);
  return {
    kind, title: (it.avail===false?'⚠️ غير متاح — ':'') + arabicItemTitle_(it),
    code: it.code||'',
    sizeTxt: sz, sizeEn: it.size||'', spec: sz, unit: it.unit||'', qty: it.qty||0,
    // ⚠️ باج كان هنا: السيرفر بيخزّن وحدة الحلق الكامل كـ 'set'، والمستند بيقرا
    // it.isSet عشان يكتب «طقم». الحقل ده مكانش بيتنقل خالص، فسطر فيه ٥ أطقم كان
    // بيتطبع «٥ عود» — والطقم ٣ عيدان، يعني المصنع يقطّع ٥ بدل ١٥.
    isSet: String(it.unit||'') === 'set',
    titleEn: String(it.title||''),   // الاسم الإنجليزي المحفوظ — منه بنقرا عرض الحلق في المستند
    // نفس حكاية الكسور: مستند المصنع كان بياخد الجزء الصحيح من طول العود بس
    rodCm: (String(it.unit||'').match(/^rod\s+(\d+(?:\.\d+)?)/)||[])[1] || '',
    doorW: kind==='frame' ? (it.forDoorWidth||'') : '',
    unitPrice: price, price: price,
    frame: it.frame||'', dbror: it.dbror||'', frameHeight: it.frameHeight||'', doorHeight: it.doorHeight||'',
    ...approvedPrintFields_(it), printArt: it.printArt||'', engraveArt:it.engraveArt||'',   // صورة الطباعة — بتوصل لرسمة الباب في ملخص الورقة
    produced: it.produced
  };
}

// بيبني مستند PDF للطلب من بيانات شاشة المصنع (بعد ما أصنافه تتحمّل)
// بيبني صف المستويين (جملة/عميل) لصنف معيّن — سعر الجملة هو الأساسي، والتاني بيتاخد من القيمة
// المحفوظة له لو موجودة، وإلا بتتحسب مبدئيًا بالزيادة الافتراضية لحد ما تحفظ إنت قيمة تانية بنفسك.
function triFor_(basePrice, kind, key){
  return {
    dist: basePrice,
    showroom: tierPrice(basePrice, kind, 'showroom', key)
  };
}
function openAdminPrices(){
  state.admin.priceEdit = {
    sizes: Object.fromEntries(SIZES.map(s=>[s.w, triFor_(s.price,'door',s.w)])),
    customExtra: triFor_(CUSTOM_EXTRA,'acc','customExtra'),
    woodExtra: triFor_(WOOD_EXTRA,'acc','woodExtra'),
    printExtra: triFor_(PRINT_EXTRA,'acc','printExtra'),
    hafrExtra: triFor_(HAFR_EXTRA,'door','hafrExtra'),
    frames: Object.fromEntries(FRAMES.map(f=>[f.cm, triFor_(f.price,'frame',f.cm)])),
    brors: Object.fromEntries(BRORS.map(b=>[b.size, triFor_(b.price,'bror',b.size)])),
    acc: Object.fromEntries(ACCESSORIES.map(a=>[a.id, triFor_(a.price,'acc',a.id)])),
    panel: {prodium: triFor_(PRODIUM_PRICE,'panel','prodium')},
    strip: {m: triFor_(STRIP_PRICE,'strip','m')},
    veneer: {m: triFor_(VENEER_PRICE,'veneer','m')}
  };
  state.admin.pricesOpen = true;
  render(); window.scrollTo({top:0,behavior:'smooth'});
}

function saveAdminPrices(){
  const pe = state.admin.priceEdit; if(!pe) return;
  SIZES.forEach(s=>{ if(pe.sizes[s.w]) s.price=Number(pe.sizes[s.w].dist)||0; });
  CUSTOM_EXTRA = Number(pe.customExtra.dist)||0;
  WOOD_EXTRA = Number(pe.woodExtra.dist)||0;
  if(pe.printExtra) PRINT_EXTRA = Number(pe.printExtra.dist)||0;
  if(pe.hafrExtra) HAFR_EXTRA = Number(pe.hafrExtra.dist)||0;
  FRAMES.forEach(f=>{ if(pe.frames[f.cm]) f.price=Number(pe.frames[f.cm].dist)||0; });
  BRORS.forEach(b=>{ if(pe.brors[b.size]) b.price=Number(pe.brors[b.size].dist)||0; });
  ACCESSORIES.forEach(a=>{ if(pe.acc[a.id]) a.price=Number(pe.acc[a.id].dist)||0; });
  if(pe.panel && pe.panel.prodium) PRODIUM_PRICE = Number(pe.panel.prodium.dist)||0;
  if(pe.strip && pe.strip.m) STRIP_PRICE = Number(pe.strip.m.dist)||0;
  if(pe.veneer && pe.veneer.m) VENEER_PRICE = Number(pe.veneer.m.dist)||0;

  const pickGroup = (g, tier) => Object.fromEntries(Object.entries(g).map(([k,v])=>[k, Number(v[tier])||0]));
  const out = { dist:{}, showroom:{} };
  ['dist','showroom'].forEach(tier=>{
    out[tier] = {
      sizes: pickGroup(pe.sizes, tier),
      customExtra: Number(pe.customExtra[tier])||0,
      woodExtra: Number(pe.woodExtra[tier])||0,
      printExtra: Number((pe.printExtra||{})[tier])||0,
      hafrExtra: Number((pe.hafrExtra||{})[tier])||0,
      frames: pickGroup(pe.frames, tier),
      brors: pickGroup(pe.brors, tier),
      acc: pickGroup(pe.acc, tier),
      panel: pickGroup(pe.panel, tier),
      strip: pickGroup(pe.strip, tier),
      veneer: pickGroup(pe.veneer, tier)
    };
  });
  // ⚠️ لو مساحة الجهاز مليانة، الحفظ بيفشل. من غير الفحص ده الرسالة كانت بتقول
  // «اتحفظت الأسعار الجديدة» والأسعار ترجع القديمة أول ما يقفل التطبيق.
  const pricesSaved = save(LS_PRICES, out);
  TIER_OVERRIDES.showroom = { sizes:{...out.showroom.sizes}, customExtra:out.showroom.customExtra, woodExtra:out.showroom.woodExtra, printExtra:out.showroom.printExtra, hafrExtra:out.showroom.hafrExtra, frames:{...out.showroom.frames}, brors:{...out.showroom.brors}, acc:{...out.showroom.acc}, panel:{...out.showroom.panel}, strip:{...out.showroom.strip}, veneer:{...out.showroom.veneer} };
  state.admin.pricesOpen=false; state.admin.priceEdit=null;
  render();

  if(!pricesSaved){
    toast('⚠️ الأسعار شغّالة دلوقتي بس ما اتحفظتش على الجهاز (المساحة مليانة) — هترجع القديمة لو قفلت التطبيق', 5200);
    return;
  }
  // ودلوقتي للسيرفر عشان توصل الموزّعين كلهم، مش الجهاز ده بس
  pushPricesToServer_(out);
}

// بيرفع الأسعار للشيت عشان كل الأجهزة تشوفها. لو فشل، المصنع لازم يعرف إن
// التعديل شغّال على جهازه هو بس — عشان مايفتكرش إن الموزّعين شايفين الجديد.
async function pushPricesToServer_(out, quiet){
  if(!APPS_SCRIPT_URL){
    if(!quiet) toast('اتحفظت الأسعار على الجهاز — مفيش رابط سيرفر عشان توصل للموزّعين');
    return false;
  }
  if(!state.admin.pw){ return false; }        // مش المصنع — مالوش يرفع أسعار
  if(!quiet) busy(true,'جارٍ نشر الأسعار للموزّعين…');
  let ok = false;
  try{
    const payload = JSON.stringify(out);
    const url = APPS_SCRIPT_URL + '?action=setPrices' + admParams_() + '&payload=' + encodeURIComponent(payload);
    if(url.length > 7500) throw new Error('الأسعار أطول من اللي الرابط بيستحمله');
    const d = await jsonp(url);
    if(!d || !d.ok) throw new Error((d && d.error) || 'رد غير متوقع');
    ok = true;
    save(LS_PRICES_DIRTY, false);
    toast(quiet ? '✅ الأسعار اللي عدّلتها قبل كده وصلت للموزّعين دلوقتي'
                : '✅ اتحفظت الأسعار الجديدة ووصلت للموزّعين كلهم');
  }catch(err){
    // العلامة دي بتمنع القراية من السيرفر إنها تمسح تعديل لسه ما اترفعش
    save(LS_PRICES_DIRTY, true);
    if(!quiet) toast('⚠️ الأسعار اتحفظت على جهازك بس ما وصلتش للموزّعين: '
      + (err.message || err) + ' — محفوظ للمراجعة؛ تحقق من الاستلام قبل أي محاولة جديدة', 6000);
  }
  if(!quiet) busy(false);
  return ok;
}

/* ---------- غلافين بيتكرروا في كل مكان ---------- */

// غلاف شاشة الانتظار: شغّلها → اعمل الشغل → لو فشل قول السبب → اقفلها.
// ⚠️ كان مكتوب حرف بحرف في أربع دوال تصدير. نسيان busy(false) في واحدة معناها
// إن شاشة الانتظار تفضل مغطية التطبيق للأبد بعد أي خطأ.
async function withBusy_(msg, errPrefix, work){
  busy(true, msg);
  try{ await work(); }
  catch(err){ toast(errPrefix + (err.message || err)); }
  busy(false);
}

// بيحمّل أصناف الطلب من السيرفر (لو مش محمّلة) وبعدين ينفّذ الشغل عليها.
// ⚠️ كانت مكتوبة أربع مرات، وفي كل مرة نفس فحص «مفيش أصناف» — بس برسالتين
// مختلفتين. لو حد نسي الفحص، المستند بيتبني فاضي من غير ما حد يعرف ليه.
async function withOrderItems_(o, work){
  const err = await toggleOrderItemsLoadOnly_(o.id);
  const its = state.admin.items[o.id] || [];
  if(!its.length){
    // نفرّق بين «الطلب فاضي فعلاً» و«ما قدرناش نجيب أصنافه» — الرسالتين مختلفتين تمامًا
    toast(err ? ('تعذّر تحميل أصناف الطلب: ' + (err.message || err)) : 'مفيش أصناف في الطلب ده', err ? 4200 : undefined);
    return false;
  }
  await work(its);
  return true;
}

function toggleOrderItemsLoadOnly_(id){
  // زي toggleOrderItems بس من غير ما يقفل القايمة لو مفتوحة أصلًا — مستخدمة قبل تصدير الـ PDF
  // ⚠️ الـcatch كان بيبلع الخطأ في صمت، فالمصنع كان بيتقاله «مفيش أصناف في الطلب
  // ده» وهو أصلًا النت اللي قطع — رسالة غلط بتخليه يفتكر إن الطلب فاضي فعلاً.
  // بنرجّع الخطأ عشان اللي نداها يقول السبب الحقيقي.
  return (async()=>{
    if(state.admin.items[id]) return null;
    state.admin.itemsLoading = id; render();
    let err = null;
    try{ await loadOrderItems_(id); }catch(e){ err = e; }
    state.admin.itemsLoading = null; render();
    return err;
  })();
}

// تقرير PDF شامل: كل الطلبات مقسّمة حسب المرحلة، كل طلب بتاريخه واسم صاحبه وأصنافه وكمياتها
// بيجمع الأصناف المتكررة (نفس الاسم/الكود/المقاس) في سطر واحد بكميتهم مجمّعة

// بيرجّع عرض الباب بالسم لو المقاس قياسي ("70 cm") عشان نقدر نجمّع بيه، أو null لو مقاس خاص/غير قياسي
function doorWidthGroup_(sizeStr){
  const m = /^(\d+)\s*cm$/.exec(String(sizeStr||'').trim());
  return m ? Number(m[1]) : null;
}


// تجميع أصناف كل الطلبات حسب النوع والكود — مرتّبة بالكمية تنازليًا.
// ⚠️ الكتلة دي كانت مكتوبة مرتين حرف بحرف: مرة في تقرير الـPDF ومرة في تقرير
// الإكسيل. أي تعديل على واحدة كان هيخلي التقريرين يدّوا أرقام مختلفة لنفس
// البيانات — والمصنع بيقارن بينهم.
function groupItemsByCode_(orders){
  const grand = {};
  (orders||[]).forEach(o=>(o.items||[]).forEach(it=>{
    if(isCutLine_(it)) return;        // بند تسعير — مش شغل إنتاج
    const key = it.type+'|'+(it.code||it.title||'')+(it.isSet?'|set':'');
    if(!grand[key]) grand[key] = { type:it.type, code:it.code||'', name:itemNameAr_(it), qty:0, produced:0, orderIds:new Set() };
    grand[key].qty += Number(it.qty)||0;
    grand[key].produced += itemProdPending_(it).produced;
    grand[key].orderIds.add(o.id);
  }));
  return Object.values(grand).sort((a,b)=>b.qty-a.qty);
}

// مواصفات الصنف زي ما بتتعرض في التقارير (عرض/ارتفاع الفتحة، الحلق، البرور).
// ⚠️ كانت مكتوبة مرتين حرف بحرف — في تقرير الـPDF وفي تقرير الإكسيل — فأي
// تعديل على واحدة كان بيخلي التقريرين يوصفوا نفس الصنف بشكلين مختلفين.
function itemSpecCells_(it){
  const wh = doorWH_(it.size, it.doorHeight);
  return {
    w: wh.w, h: wh.h,
    frameW: it.frame ? it.frame : '—',
    frameH: it.frame ? (it.frameHeight ? it.frameHeight : 'استاندر') : '—',
    bror:   it.dbror ? it.dbror : '—'
  };
}

  orders.forEach(o=>{ grandQty += (o.items||[]).reduce((s,it)=>s+(Number(it.qty)||0),0); });

  const grandPending1 = grandQty-grandProduced1;

      <thead><tr>

        <th style="${th}">صاحب الحساب</th><th style="${th}">صاحب الأوردر</th><th style="${th};width:78px">الهاتف</th>

          <tbody>${itemRows}</tbody>

      </div>`;
    }).join('');

    const codeRows = cust.codeTotals.map(ct=>`<tr>
        <td style="${td}">${esc(itemTypeAr_(ct.type))}</td>
        <td style="${td}">${esc(ct.code||'—')}</td>
        <td style="${td};text-align:right">${esc(ct.name)}</td>
        <td style="${td}"><b>${ct.qty}</b></td>
        <td style="${td};color:#1E8E52">${ct.produced}</td>

function availMap357_(orders){
  const m=new Map();
  try{
    if(!state.stock||!state.stock.rows) return m;
    const left={};
    (orders||[]).filter(o=>o.status!=='Cancelled'&&o.status!=='Delivered').slice()
      .sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.id||'').localeCompare(String(b.id||'')))
      .forEach(o=>(o.items||[]).forEach(it=>{
        if(it.type!=='Door') return;
        const q=Math.max(0,Number(it.qty)||0); if(q<=0) return;
        const w=doorWidthGroup_(it.size); if(w==null) return;
        const sk=(String(it.code||'').trim()||'—')+'|'+w;
        if(!(sk in left)) left[sk]=Math.max(0,Number(stockFor(String(it.code||'').trim(),w))||0);
        const got=Math.min(q,left[sk]); left[sk]-=got; m.set(it,got);
      }));
  }catch(e){}
  return m;
}
function availTxt357_(it,m){
  if(it.avail===false) return {t:'غير متاح',c:'#B3261E'};
  if(it.type==='Door'&&m&&m.has(it)){
    const got=m.get(it), q=Number(it.qty)||0;
    if(got>=q) return {t:'متاح '+q,c:'#1E8E52'};
    if(got>0) return {t:'متاح '+got+' من '+q,c:'#B26A00'};
    return {t:'غير متاح (0 من '+q+')',c:'#B3261E'};
  }
  return {t:'متاح',c:''};
}

// ============================================================
// تقرير الأبواب المعلّقة — كل عميل، كل طلب بتاريخه، الأبواب مقسّمة حسب المقاس
// (الطلبات المؤرشفة مستبعدة أصلًا من listWithItems؛ هنا كمان بنستبعد الملغي
//  والمُسلَّم — التقرير ده «اللي لسه ما اتسلّمش»، والمسلَّم اللي مااتأرشفش
//  بالغلط كان بيظهر فيه وكإنه لسه مطلوب)
// ============================================================
function buildPendingDoorsData_(orders){
  const pending = orders.filter(o=>o.status!=='Cancelled' && o.status!=='Delivered');
  const byCustomer = {}, order = [];
  pending.forEach(o=>{
    // التقرير ده للأبواب بس — الطلبات اللي مفيهاش أبواب (إكسسوارات أو حلق/برور فقط)
    // بتتشال من الأساس عشان ما تظهرش كعناوين فاضية بإجمالي صفر
    if(!(o.items||[]).some(it=>it.type==='Door')) return;
    // التجميع بقى على **صاحب الأوردر** — لو مفيش، بنرجع لصاحب الحساب
    const key = (o.customer && o.customer.trim()) || o.dist || '—';
    if(!byCustomer[key]){ byCustomer[key]=[]; order.push(key); }
    byCustomer[key].push(o);
  });
  return order.map(name=>{
    const ords = byCustomer[name];
    const perOrder = ords.map(o=>{
      const doorItems = (o.items||[]).filter(it=>it.type==='Door');
      const groups={};
      doorItems.forEach(it=>{
        const w = doorWidthGroup_(it.size);
        const key = w!=null ? String(w) : 'خاص';
        (groups[key]=groups[key]||[]).push(it);
      });
      const widths = Object.keys(groups).sort((a,b)=>{
        if(a==='خاص') return 1; if(b==='خاص') return -1; return Number(a)-Number(b);
      });
      return { id:o.id, date:o.date, customer:o.customer||'', phone:o.customerPhone||o.phone||'', groups, widths };
    });
    const total = ords.reduce((s,o)=>s+(o.items||[]).filter(it=>it.type==='Door').reduce((s2,it)=>s2+(Number(it.qty)||0),0),0);
    return { name, perOrder, total };
  }).filter(c=>c.total>0);   // عميل مالوش ولا باب واحد مايظهرش خالص
}

// عدد الأيام من تاريخ الطلب لحد النهاردة — بيتحسب من تاريخ الطلب (yyyy-MM-dd)

// نوتة صنف واحد: بتجمع معلومات الحلق الإضافي/البرور في سطر ملاحظات واحد — زي النموذج المطلوب بالظبط

// بيرجّع أصناف العميل مجمّعة (لو نفس الصنف اتكرر في أكتر من طلب، بيتجمعوا في سطر واحد بالكمية الإجمالية)
function mergedCustomerItems_(cust){
  const merged = {}, order = [];
  cust.perOrder.forEach(o=>{
    o.widths.forEach(w=>{
      o.groups[w].forEach(it=>{
        const frame = it.frame ? frameText_(it.frame, it.frameHeight) : '';
        const size = doorSizeText_(it.size || (w==='خاص'?'مقاس خاص':w+' سم'), it.doorHeight);
        const key = [it.code||'', size, frame, it.dbror||''].join('|');
        if(!merged[key]){
          const wh = doorWH_(it.size, it.doorHeight);
          merged[key] = {
            code:it.code||'', size, qty:0, produced:0, frame, dbror: it.dbror||'',
            w:wh.w, h:wh.h, frameW: it.frame||'', frameH: it.frame ? (it.frameHeight||'') : ''
          };
          order.push(key);
        }
        merged[key].qty += Number(it.qty)||0;
        merged[key].produced += itemProdPending_(it).produced;
      });
    });
  });
  return order.map(k=>merged[k]);
}

// جدول عميل واحد: صنف/مقاس/كمية/حلق/برور — كل عميل بجدوله المستقل ولونه الخاص
// حالة توفّر الصنف بالمخزن: أخضر = متاح بالكامل، أصفر = الكمية أكبر من المتاح جزئيًا، أحمر = مفيش خالص
function stockStatus_(code, size, qty){
  // ⚠️ باج كان هنا: المقاس الخاص مش متتبّع في المخزون عن قصد (الباب بيتقص،
  // مش صنف جاهز على الرف) — ومحصلش يتخصم ولا يترجع رصيد له أبدًا. لكن الشارة
  // كانت بتدوّر على رصيد بنص المقاس الكامل، مالهوش سطر في المخزن، فبترجع صفر
  // وتطبع «غير متاح» أحمر على كل باب مقاس خاص. شارة إنذار غلط دايمًا معناها
  // إن المصنع يبطّل ياخد باله منها خالص.
  if(/\(custom\)/i.test(String(size||'')) || /مقاس خاص/.test(String(size||''))){
    return { color:'#5B6B7D', bg:'#F0F3F7', label:'مقاس خاص' };
  }
  const w = doorWidthGroup_(size);
  const stock = stockFor(code, w!=null ? w : size);
  if(stock===null) return null;   // الأرصدة لسه ما اتحمّلتش
  if(stock<=0) return {color:'#B3261E', bg:'#FBE7E7', label:'غير متاح'};
  if(qty>stock) return {color:'#B8790A', bg:'#FFF4E0', label:'جزئي ('+stock+' متاح)'};
  return {color:'#1E8E52', bg:'#E7F6EC', label:'متاح'};
}

async function buildPendingDoorsExcel_(orders){
  const data = buildPendingDoorsData_(orders);
  if(!data.length){ toast('مفيش طلبات معلّقة'); return; }
  if(!await needLibs_('exceljs')) return;

  const NAVY='FF002050', WHITE='FFFFFFFF', ZEBRA='FFF6F8FA', BORDER_CLR='FFDCE4EC';
  const thin = {style:'thin', color:{argb:BORDER_CLR}};
  const border = {top:thin,left:thin,right:thin,bottom:thin};
  // عمود "ارتفاع الحلق" شرطي على مستوى التقرير كله — بيظهر بس لو صنف واحد على الأقل من كل العملاء متسجّل له ارتفاع حلق فعلي
  const showFrameHCol = data.some(cust=>mergedCustomerItems_(cust).some(it=>it.frameW && it.frameH));
  const COLS = showFrameHCol ? 8 : 7;
  const PROD_GREEN='FF1E8E52', PEND_RED='FFB3261E';
  const READY_FILL='FFE6F4EA', READY_TXT='FF1E8E52', PEND_FILL='FFFDECEA', PEND_TXT='FFB3261E';

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('الأبواب المعلّقة', { views:[{ rightToLeft:true }] });
  ws.columns = [
    { key:'w',    width:11 },
    { key:'h',    width:11 },
    { key:'code', width:13 },
    { key:'qty',  width:9  },
    { key:'stat', width:14 },
    { key:'frameW',width:11 },
    ...(showFrameHCol ? [{ key:'frameH', width:11 }] : []),
    { key:'bror', width:14 }
  ];

  function mergedRow(text, fillArgb, fontArgb, bold, size){
    const r = ws.addRow([text].concat(Array(COLS-1).fill('')));
    ws.mergeCells(r.number,1,r.number,COLS);
    r.eachCell(c=>{
      c.fill = {type:'pattern',pattern:'solid',fgColor:{argb:fillArgb}};
      c.font = {bold: !!bold, color:{argb:fontArgb}, size: size||11, name:'Arial'};
      c.alignment = {horizontal:'right', vertical:'middle'};
    });
    r.height = 20;
    return r;
  }

  const now = new Date();
  const dateTimeStr = now.toLocaleDateString('ar-EG') + ' — الساعة ' + now.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
  mergedRow('تقرير الأبواب المعلّقة  —  '+dateTimeStr, NAVY, WHITE, true, 13);
  ws.addRow([]);

  const CUST_FILL = ['FF1080C0','FFC08A3E','FF3E9B72','FF7C63C4','FFC25454','FF2C8FA3'];
  const CUST_TINT = ['FFEAF2FA','FFFBF0E1','FFE7F5EE','FFF0EAFB','FFFBE7E7','FFE3F3F7'];
  const STAT_GREEN='FFE7F6EC', STAT_YELLOW='FFFFF4E0', STAT_RED='FFFBE7E7';
  const STAT_GREEN_TXT='FF1E8E52', STAT_YELLOW_TXT='FFB8790A', STAT_RED_TXT='FFB3261E';
  const QTY_COL = 4, STAT_COL = 5;   // أرقام الأعمدة ثابتة بغض النظر عن ظهور "ارتفاع الحلق" — هو آخر عمود قبل البرور بس

  data.forEach((cust,ci)=>{
    const fill = CUST_FILL[ci % CUST_FILL.length];
    const tint = CUST_TINT[ci % CUST_TINT.length];
    mergedRow('صاحب الطلب: '+cust.name, fill, WHITE, true, 13);

    function subHeader_(bg, txt, title){
      const r = mergedRow(title, bg, txt, true, 11);
      r.height = 18;
      return r;
    }
    function colHeader_(){
      const labels = ['عرض الفتحة المعمارية','ارتفاع الفتحة المعمارية','الكود','الكمية','حالة المخزن','عرض الحلق']
        .concat(showFrameHCol?['ارتفاع الحلق']:[]).concat(['البرور']);
      const hdr = ws.addRow(labels);
      hdr.eachCell(c=>{
        c.fill = {type:'pattern',pattern:'solid',fgColor:{argb:fill}};
        c.font = {bold:true, color:{argb:WHITE}, name:'Arial', size:10.5};
        c.alignment = {horizontal:'center'};
        c.border = border;
      });
    }
    function itemRow_(it, idx, qtyVal, qtyColor){
      const st = stockStatus_(it.code, it.size, it.qty);
      const statTxt = st ? st.label : '—';
      const frameHTxt = it.frameW ? (it.frameH||'استاندر') : '—';
      const vals = [it.w||'—', it.h||'—', it.code, qtyVal, statTxt, it.frameW||'—']
        .concat(showFrameHCol?[frameHTxt]:[]).concat([it.dbror||'—']);
      const row = ws.addRow(vals);
      row.eachCell((c,colNo)=>{
        c.alignment = {horizontal:'center'};
        c.border = border;
        c.font = {name:'Arial', size:10.5, bold: colNo===QTY_COL||colNo===STAT_COL, color: colNo===QTY_COL?{argb:qtyColor}:(colNo===STAT_COL&&st?{argb: st.color==='#1E8E52'?STAT_GREEN_TXT:(st.color==='#B8790A'?STAT_YELLOW_TXT:STAT_RED_TXT)}:undefined)};
        c.fill = {type:'pattern',pattern:'solid',fgColor:{argb: colNo===STAT_COL&&st ? (st.color==='#1E8E52'?STAT_GREEN:(st.color==='#B8790A'?STAT_YELLOW:STAT_RED)) : (idx%2===1 ? ZEBRA : WHITE)}};
      });
    }
    function emptyRow_(text){
      const row = ws.addRow([text].concat(Array(COLS-1).fill('')));
      ws.mergeCells(row.number,1,row.number,COLS);
      row.eachCell(c=>{ c.border=border; c.alignment={horizontal:'center'}; c.font={name:'Arial', size:10.5, color:{argb:'FF8A97A6'}}; });
    }

    const items = mergedCustomerItems_(cust);
    let total = 0, totalProduced = 0;
    items.forEach(it=>{ total += it.qty; totalProduced += it.produced; });
    const readyItems = items.filter(it=>it.produced>0);
    const pendingItems = items.filter(it=>(it.qty-it.produced)>0);

    subHeader_(READY_FILL, READY_TXT, 'جاهز للتسليم');
    colHeader_();
    if(readyItems.length) readyItems.forEach((it,idx)=>itemRow_(it, idx, it.produced, PROD_GREEN));
    else emptyRow_('مفيش حاجة جاهزة لسه');

    ws.addRow([]);
    subHeader_(PEND_FILL, PEND_TXT, 'لسه متبقي / تحت التنفيذ');
    colHeader_();
    if(pendingItems.length) pendingItems.forEach((it,idx)=>itemRow_(it, idx, it.qty-it.produced, PEND_RED));
    else emptyRow_('مفيش حاجة متبقية');

    mergedRow('إجمالي عدد الأبواب:  '+total+'   (جاهز '+totalProduced+' · متبقي '+(total-totalProduced)+')', tint, NAVY, true, 12);
    ws.addRow([]);
  });

  const codesTxt = DOORS.map(d=>d.code).join('، ');
  mergedRow('الأكواد المتاحة: '+codesTxt+'  |  المقاسات المتاحة (سم): 60، 70، 80، 90، 100', 'FFF7F9FB', 'FF6B7A8C', false, 9.5);

  // هامش الطباعة: رقم الصفحة بس (من غير سطر إعداد)
  wb.worksheets.forEach(w=>{
    w.headerFooter = w.headerFooter || {};
    w.headerFooter.oddFooter = '&L&9Page &P of &N';
  });

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const fname = 'تقرير_الأبواب_المعلقة_'+isoLocal_()+'.xlsx';
  await shareOrDownload_(blob, fname, fname);
}

// ============================================================
// تقرير الأبواب المطلوبة — مجمّع حسب العرض (70 / 80 / 90 / 100 …) ثم الكود،
// وكل كود فيه استاندر وخاص (بمقاسه). بيجمع كل الطلبات اللي لسه ما اتسلّمتش.
// المطلوب = الكمية المطلوبة، جاهز = اللي اتنتج فعلًا، متبقي = الباقي على المصنع.
// ============================================================
function buildRequiredDoorsData_(orders){
  const pending = (orders||[]).filter(o=>o.status!=='Cancelled' && o.status!=='Delivered');
  const groups = {};
  pending.forEach(o=>(o.items||[]).forEach(it=>{
    if(it.type!=='Door') return;
    const qty = Number(it.qty)||0;
    if(qty<=0) return;
    const wh = doorWH_(it.size, it.doorHeight);
    const hasW = wh.w!=='' && wh.w!=null;
    const customSize = /\(custom\)/i.test(String(it.size||''));
    // خاص = مقاس بعرض/ارتفاع مكتوب بالإيد، أو عرض قياسي بارتفاع فتحة غير الاستاندر
    const special = customSize || (hasW && Number(wh.h)!==DOOR_STD_HEIGHT);
    const gKey = hasW ? String(wh.w) : 'other';
    const g = groups[gKey] || (groups[gKey] = { key:gKey, w:hasW?Number(wh.w):null, rows:{}, qty:0, produced:0 });
    const code = it.code || '—';
    const sizeLbl = hasW ? (wh.w+' × '+wh.h) : String(it.size||'مقاس خاص');
    const rKey = code+'|'+(special ? 'sp|'+sizeLbl : 'std');
    const r = g.rows[rKey] || (g.rows[rKey] = { code, special, sizeLbl, h:hasW?Number(wh.h):0, qty:0, produced:0 });
    const prod = itemProdPending_(it).produced;
    r.qty += qty;  r.produced += prod;
    g.qty += qty;  g.produced += prod;
  }));
  const codeIdx = c=>{ const i = DOORS.findIndex(d=>d.code===c); return i<0 ? 999 : i; };
  return Object.values(groups)
    .sort((a,b)=> a.w==null ? 1 : b.w==null ? -1 : a.w-b.w)
    .map(g=>({
      key:g.key, w:g.w, qty:g.qty, produced:g.produced, pending:g.qty-g.produced,
      rows:Object.values(g.rows)
        .sort((a,b)=> codeIdx(a.code)-codeIdx(b.code) || a.code.localeCompare(b.code)
                      || (a.special-b.special) || (a.h-b.h))
        .map(r=>({ ...r, pending:r.qty-r.produced }))
    }));
}

  const data = buildRequiredDoorsData_(orders);

  const border = {top:thin,left:thin,right:thin,bottom:thin};

  const GRP_TINT = ['FFEAF2FA','FFFBF0E1','FFE7F5EE','FFF0EAFB','FFFBE7E7','FFE3F3F7'];

  const doorName = c=>{ const d = DOORS.find(x=>x.code===c); return d ? d.name : ''; };

  const ws = wb.addWorksheet('الأبواب المطلوبة', { views:[{ rightToLeft:true }] });

    r.eachCell(c=>{
      c.fill = {type:'pattern',pattern:'solid',fgColor:{argb:fillArgb}};
      c.font = {bold:true, color:{argb:fontArgb}, size:size||11, name:'Arial'};
      c.alignment = {horizontal:'right', vertical:'middle'};
    });
    r.height = 21;
    return r;
  }

  const now = new Date();
  const dateTimeStr = now.toLocaleDateString('ar-EG') + ' — الساعة ' + now.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
  const grand = data.reduce((s,g)=>s+g.qty,0), grandReady = data.reduce((s,g)=>s+g.produced,0);
  mergedRow('تقرير الأبواب المطلوبة  —  '+dateTimeStr, NAVY, WHITE, 13);
  mergedRow('إجمالي المطلوب: '+grand+'   (جاهز '+grandReady+' · متبقي '+(grand-grandReady)+')', 'FFF7F9FB', NAVY, 11);
  ws.addRow([]);

  data.forEach((g,gi)=>{
    const fill = GRP_FILL[gi % GRP_FILL.length], tint = GRP_TINT[gi % GRP_TINT.length];
    const title = g.w==null ? 'مقاسات أخرى' : 'أبواب '+g.w+' سم';
    mergedRow(title, fill, WHITE, 13);
    const hdr = ws.addRow(['الكود','النوع / المقاس','المطلوب','جاهز','متبقي']);
    hdr.eachCell(c=>{
      c.fill = {type:'pattern',pattern:'solid',fgColor:{argb:fill}};
      c.font = {bold:true, color:{argb:WHITE}, name:'Arial', size:10.5};
      c.alignment = {horizontal:'center'}; c.border = border;
    });
    g.rows.forEach((r,idx)=>{
      const row = ws.addRow([
        r.code + (doorName(r.code) ? ' ' + doorName(r.code) : ''),
        r.special ? 'مقاس خاص — '+r.sizeLbl : 'استاندر',
        r.qty, r.produced, r.pending
      ]);
      row.eachCell((c,colNo)=>{
        c.alignment = {horizontal:'center'}; c.border = border;
        const color = colNo===4 ? 'FF1E8E52' : colNo===5 ? (r.pending>0?'FFB3261E':'FF1E8E52')
                    : (colNo===2 && r.special) ? 'FFB8790A' : undefined;
        c.font = {name:'Arial', size:10.5, bold: colNo!==2 || r.special, color: color?{argb:color}:undefined};
        c.fill = {type:'pattern',pattern:'solid',fgColor:{argb: colNo===2 ? (r.special?'FFFFF4E0':'FFE7F6EC') : (idx%2===1 ? ZEBRA : WHITE)}};
      });

    ws.mergeCells(tot.number,1,tot.number,2);
    tot.eachCell(c=>{
