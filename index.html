.dueov h3{margin:0 0 4px;font-size:16px;color:var(--ink)}
.dueov .sub{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.6}
.dueov .sec{margin-top:12px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px}
.dueov .rw{display:flex;align-items:center;gap:8px;justify-content:space-between;border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;margin-top:6px}
.dueov .rw .t{min-width:0}
.dueov .rw .t b{font-size:14px;color:var(--ink)}
.dueov .rw .t div{font-size:11.5px;color:var(--muted);margin-top:2px}
.dueov input[type=date]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;background:transparent;color:var(--ink);flex:none}

/* ---------- الصفحة الرئيسية للمصنع: كروت مؤشرات + اختصارات + كروت عملاء ---------- */



.grp-hd{align-items:center;gap:11px}
.grp-hd::before{content:attr(data-ini);flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:800;color:#fff;background:var(--av,#2E7FF0)}

/* ---------- الصفحة الرئيسية للتطبيق ---------- */







.hm-h{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 8px;font-weight:800;font-size:14px;color:var(--ink)}
.hm-h button{font-size:12px;color:var(--info-ink);font-weight:700}

/* ---------- v210: أزرار الأقسام أصغر والصفحة أضم ---------- */
.secnav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.secnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;padding:7px 4px;border-radius:14px;min-width:0;flex:none}
.secnav button .i{width:28px;height:28px;padding:6px;border-radius:9px;margin:0;grid-row:auto;grid-column:auto;box-shadow:0 2px 6px rgba(31,111,235,.22)}
.secnav button .tx{display:block;font-size:11.5px;font-weight:800;line-height:1.2;grid-column:auto;grid-row:auto}
.secnav button .sb{display:none}
.secnav button:last-child:nth-child(odd){grid-column:auto}
.secnav button:last-child:nth-child(3n+1){grid-column:1/-1}

/* ---------- v214: قوائم منسدلة + بيانات أصغر ---------- */
.secTile .ti{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#4B93FF,#1F6FEB)}
.secTile .ti svg{width:17px;height:17px;stroke-width:1.9}
.secTile .ti[data-s="acc"]{background:linear-gradient(135deg,#F2B544,#D98A12)}
.secTile .ti[data-s="frame"]{background:linear-gradient(135deg,#3DD6A0,#12996B)}
.secTile .ti[data-s="strip"]{background:linear-gradient(135deg,#9B7BFF,#6A45E0)}
.secTile .ti[data-s="veneer"]{background:linear-gradient(135deg,#FF8A7A,#E2503F)}
.secTile .ti[data-s="bror"]{background:linear-gradient(135deg,#34C9E8,#0E8FB0)}
.secTile .ti[data-s="prodium"]{background:linear-gradient(135deg,#FF8FC0,#D9468A)}
.secTile .ti[data-s="mabra"]{background:linear-gradient(135deg,#FFB547,#E07B12)}
.secTile .ti[data-s="user"]{background:linear-gradient(135deg,#6B7A8C,#46566B)}
.ddH>svg.i{flex:0 0 auto;width:16px;height:16px;color:var(--muted);transition:transform .18s}
.dd.open>.ddH>svg.i{transform:rotate(180deg)}
.secPanel>.card{margin:0;padding:6px 0 0;border:0;box-shadow:none;background:transparent}
.secPanel>.card>.step{display:none}
.dd{margin-top:8px;border:1px dashed var(--line);border-radius:10px}
.ddH{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;text-align:start;background:transparent;color:var(--ink)}
.ddH .t{font-size:12px;font-weight:800}
.ddH .sm{flex:1;min-width:0;font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddB{padding:0 10px 8px}
.stepHint{margin-top:9px;font-size:11px;color:var(--muted);font-weight:600}
.secTiles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.secTile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 2px 7px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--ink);min-width:0}
.secTile .tx{font-size:11px;font-weight:800;line-height:1.2;text-align:center}
.secTile.on{border-color:var(--brand);box-shadow:0 0 0 1.5px var(--brand)}
.secPanel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px 12px;margin-bottom:12px}
.noteBtn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;margin-bottom:10px;border:1px dashed var(--line);border-radius:12px;background:var(--card);color:var(--ink);text-align:start}
.noteBtn svg.i{flex:0 0 auto;width:16px;height:16px;color:var(--warn-ink)}
.noteBtn .tx{font-size:12.5px;font-weight:800;white-space:nowrap}
.noteBtn .sb{flex:1;min-width:0;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.noteBtn.has{border-style:solid;border-color:var(--warn-ink)}
.qty input.qtyEmpty{width:68px}
input::placeholder,textarea::placeholder{color:#7A8DA6!important}
html[data-theme="dark"] input::placeholder,html[data-theme="dark"] textarea::placeholder{color:#9FB0C6!important}

/* ============================================================
   v229+ — ألوان خانات الكتابة + أيقونة الكمية
   كل خانة كتابة ليها خلفية مميّزة عن الكارت اللي حواليها، واللون بيدل على النوع:
   أزرق = نص/اسم/تليفون · أخضر = أرقام ومقاسات · كهرماني = الكمية
   بنفسجي = ملاحظات وتواريخ · رمادي مزرق = قوائم الاختيار
   ============================================================ */
:root{
  --fx-txt-bg:#EAF2FE;  --fx-txt-bd:#A9C6EC;  --fx-txt-fc:#FFFFFF;
  --fx-num-bg:#E7F7EE;  --fx-num-bd:#9ED6B8;  --fx-num-fc:#FFFFFF;
  --fx-note-bg:#F3EEFF; --fx-note-bd:#C9B9F0; --fx-note-fc:#FFFFFF;
  --fx-sel-bg:#EDF0F6;  --fx-sel-bd:#B4BFD2;  --fx-sel-fc:#FFFFFF;
  --fx-qty-bg:#FFF1D6;  --fx-qty-bd:#EBBE6B;  --fx-qty-fc:#FFFFFF;
  --fx-qty-ic-bg:#FBDFA4; --fx-qty-ic:#8A5A0B;
  --fx-bad-bg:#FFF0EE;  --fx-dirty-bg:#FFF4DF;
}
html[data-theme="dark"]{
  --fx-txt-bg:#14294A;  --fx-txt-bd:#34588C;  --fx-txt-fc:#1B3560;
  --fx-num-bg:#10302A;  --fx-num-bd:#2B6A55;  --fx-num-fc:#163E35;
  --fx-note-bg:#251F4A; --fx-note-bd:#4E4390;  --fx-note-fc:#30285E;
  --fx-sel-bg:#1B2740;  --fx-sel-bd:#3A4C70;  --fx-sel-fc:#24344F;
  --fx-qty-bg:#3A2A10;  --fx-qty-bd:#8A6524;  --fx-qty-fc:#4A3514;
  --fx-qty-ic-bg:#5A4015; --fx-qty-ic:#F0C46A;
  --fx-bad-bg:#3A1A1A;  --fx-dirty-bg:#3D2E12;
}
/* الحاملات: كل نوع خانة بياخد مجموعة ألوانه */
:root:root :is(input[type=text],input[type=tel],input[type=search],input[type=password],input[type=email],input:not([type])){
  --fxb:var(--fx-txt-bg);--fxd:var(--fx-txt-bd);--fxf:var(--fx-txt-fc)}
:root:root :is(input[type=number],.stkin,.hgtIn,.prow3 input,.rodbox input){
  --fxb:var(--fx-num-bg);--fxd:var(--fx-num-bd);--fxf:var(--fx-num-fc)}
:root:root :is(textarea,.fld textarea,input[type=date],input[type=time]){
  --fxb:var(--fx-note-bg);--fxd:var(--fx-note-bd);--fxf:var(--fx-note-fc)}
:root:root select{--fxb:var(--fx-sel-bg);--fxd:var(--fx-sel-bd);--fxf:var(--fx-sel-fc)}
:root:root :is(input[data-act*="qty"],input[data-act="acc-set"]){
  --fxb:var(--fx-qty-bg);--fxd:var(--fx-qty-bd);--fxf:var(--fx-qty-fc)}
/* التطبيق الفعلي */
:root:root :is(input[type=text],input[type=tel],input[type=search],input[type=password],input[type=email],input:not([type]),
  input[type=number],input[type=date],input[type=time],textarea,select,.stkin,.hgtIn,.prow3 input,.rodbox input,.fld textarea){
  background:var(--fxb);border-color:var(--fxd)}
:root:root :is(input[type=text],input[type=tel],input[type=search],input[type=password],input[type=email],input:not([type]),
  input[type=number],input[type=date],input[type=time],textarea,select,.stkin,.hgtIn,.prow3 input,.rodbox input,.fld textarea):focus{
  background:var(--fxf);border-color:var(--brand)}
:root:root .stkin.dirty{background:var(--fx-dirty-bg);border-color:#C08A3E}
:root:root input.bad{background:var(--fx-bad-bg);border-color:var(--danger)}

/* عدّاد الكمية: خلفية كهرمانية + خانة أيقونة */
:root:root .qty{background:var(--fx-qty-bg);border-color:var(--fx-qty-bd)}
:root:root .qty input,:root:root .qty input:focus{background:transparent;border-inline-color:var(--fx-qty-bd);box-shadow:none}
:root:root .qty button{color:var(--fx-qty-ic)}
:root:root .qty button:active{background:var(--fx-qty-ic-bg)}
.qty .qIc{display:grid;place-items:center;align-self:stretch;flex:0 0 auto;width:34px;
  background:var(--fx-qty-ic-bg);color:var(--fx-qty-ic);border-inline-end:1.5px solid var(--fx-qty-bd)}
.qty .qIc svg.i{width:18px;height:18px}
.accgrid .ac .qty .qIc{width:24px}:root:root .accgrid .ac .qty285{grid-template-columns:36px auto 36px}.accgrid .ac .qty input{width:52px}
.accgrid .ac .qty .qIc svg.i{width:15px;height:15px}

/* ============================================================
   v230 — تظبيط وتنعيم الشكل العام (طبقة إضافية فوق اللي فات، من غير ما تغيّر أي منطق)
   ============================================================ */
:root{--ease:cubic-bezier(.22,.8,.3,1);--press:.97}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overscroll-behavior-y:none}
input,textarea,select,.money,.pr,.no{font-variant-numeric:tabular-nums}
/* انتقالات ناعمة موحّدة لكل العناصر اللي بتتلمس */
@media (prefers-reduced-motion:no-preference){
  .btn,.chip,.miniChip,.colchip,.secnav button,.tabs button,.door .leaf,.ord,.card,.sizeCard,.qty,.qty button,input,select,textarea,.stkin,.hgtIn,.noteBtn{
    transition:background-color .18s var(--ease),border-color .18s var(--ease),box-shadow .22s var(--ease),
               transform .14s var(--ease),color .18s var(--ease),opacity .18s}
  .chip.on,.miniChip.on,.colchip.on{transform:translateY(-1px)}
  .door.on .leaf{transform:translateY(-2px)}
}
/* إحساس الضغط على الموبايل */
.btn:active,.chip:active,.miniChip:active,.secnav button:active,.noteBtn:active{transform:scale(var(--press))}
.door:active .leaf{transform:scale(.98)}
.qty button:active{transform:scale(.9)}
/* كروت: زوايا أنعم وعمق أوضح، وطلبات العملاء تتنفس */
.card,.ord{border-radius:var(--r-lg,18px)}
.ord{padding:14px;margin-bottom:13px}
.card{margin-bottom:13px}
.sizeCard{border-radius:var(--r-md,14px);padding:12px 13px}
html[data-theme="dark"] .sizeCard{background:rgba(255,255,255,.04);border-color:rgba(120,165,235,.22)}
/* الأزرار: ارتفاع ثابت مريح للمس وحالة تعطيل واضحة */
.btn{min-height:46px;display:flex;align-items:center;justify-content:center;gap:7px;letter-spacing:.1px}
.btn.sm{min-height:34px}
.btn[disabled],.btn:disabled{opacity:.5;filter:saturate(.55);pointer-events:none;box-shadow:none}
.btn svg.i{width:18px;height:18px;flex:none}
/* شريط التبويبات والعنوان العلوي: فاصل ناعم بدل الخط الحاد */
.top{box-shadow:0 2px 14px rgba(0,0,0,.14)}
.tabs{box-shadow:0 1px 0 var(--line),0 6px 16px -10px rgba(0,0,0,.28)}
.tabs button{border-radius:12px 12px 0 0}
.tabs button.on{background:linear-gradient(180deg,transparent,rgba(63,169,245,.10))}
/* الشريط السفلي: زجاج خفيف وفاصل أنعم، والمحتوى ما يتغطّاش */
.bar{box-shadow:0 -8px 24px -12px rgba(0,0,0,.35)}
main,#app,.wrap{scroll-padding-bottom:110px}
/* عناوين الأقسام والملاحظات: مسافات منتظمة */
.grp{margin:14px 0 7px;letter-spacing:.2px}
.note{line-height:1.7}
.row2{gap:11px}
label.fld{margin-bottom:12px}
label.fld span{margin-bottom:5px;font-weight:700}
/* حلقة التركيز واضحة للي بيستخدم كيبورد */
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
/* جداول وقوائم طويلة: تمرير ناعم من غير شريط تمرير تقيل */
.stktbl,[style*="overflow-x:auto"],[style*="overflow:auto"]{-webkit-overflow-scrolling:touch;scrollbar-width:thin}
::selection{background:rgba(63,169,245,.28)}

/* v231 — ترتيب كارت المقاس: الكمية ← الحلق ← البرور ← خيارات إضافية */
.sizeCard .scHead{padding-bottom:9px;margin-bottom:9px;border-bottom:1px dashed var(--line)}
.sizeCard .miniLbl{margin:11px 0 6px}
.sizeCard .miniLbl:first-of-type{margin-top:4px}
.sizeCard .dd{margin-top:13px;padding-top:11px;border-top:1px dashed var(--line)}

/* v233 — إصلاح عرض الهيدر: كان بيزق الصفحة أعرض من الشاشة ويعمل تمرير جانبي */
body{overflow-x:clip}
.top-row{flex-wrap:wrap;row-gap:6px}
.top-row .ttl{min-width:0;flex:1 1 120px}
.top-row .ttl .t1,.top-row .ttl .t2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-row .wh-chip{flex:none}
.top-row .verstrip{margin-top:0;margin-inline-start:auto;flex:none}

/* v234 — بحث الطلبات + شريط السلة العائم */
.ord[hidden],#ordNone[hidden],#cartFloat[hidden]{display:none!important}
.ordFilter{position:sticky;top:0;z-index:5;margin:0 0 12px;padding:2px 0 8px;background:var(--bg,transparent)}
.ordFilter input{width:100%;box-sizing:border-box;padding:11px 14px;border-radius:13px;font-size:14px}
.ordChips{display:flex;gap:7px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.ordChips::-webkit-scrollbar{display:none}
.ordChip{flex:none;padding:7px 13px!important;font-size:12.5px!important;border-radius:20px!important}
.ordChip b{margin-inline-start:4px;opacity:.75}
.ordChip.on{background:var(--brand)!important;color:#fff!important;border-color:var(--brand)!important}
#cartFloat{position:fixed;inset-inline:12px;z-index:60;display:flex;align-items:center;gap:9px;padding:12px 15px;border:0;border-radius:16px;
  background:linear-gradient(135deg,var(--brand-lt,#3FA9F5),var(--brand,#1668B8));color:#fff;font-weight:700;font-size:14px;
  box-shadow:0 8px 22px rgba(11,79,168,.38)}
#cartFloat svg.i{width:20px;height:20px;flex:none}
#cartFloat b{margin-inline-start:auto;font-size:15px}
#cartFloat em{font-style:normal;font-size:12px;opacity:.9}
#cartFloat:active{transform:scale(.98)}
.ordChip{white-space:nowrap}
.oa .btn{white-space:nowrap;font-size:12.5px;padding-inline:6px;gap:5px}
.oa .btn svg.i{width:16px;height:16px}

/* ============ v235 — الرئيسية الجديدة ============ */

/* ============ v236 — شاشة السلة ============ */
.ct-hero{position:relative;overflow:hidden;border-radius:24px;padding:16px;color:#fff;margin-bottom:14px;
  background:linear-gradient(160deg,#0E2A57 0%,#0A1B3D 55%,#071229 100%);box-shadow:0 14px 34px -14px rgba(7,18,41,.75),inset 0 0 0 1px rgba(111,193,250,.16)}
.ct-hero .g1,.ct-hero .g2{position:absolute;border-radius:50%;filter:blur(36px);pointer-events:none}
.ct-hero .g1{width:150px;height:150px;top:-60px;inset-inline-start:-30px;background:rgba(79,192,138,.32)}
.ct-hero .g2{width:140px;height:140px;bottom:-70px;inset-inline-end:-20px;background:rgba(63,169,245,.34)}
.ct-hero>*{position:relative}
.ct-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.ct-top small{display:block;font-size:12.5px;opacity:.78}
.ct-top b{display:block;font-size:24px;margin-top:2px}
.ct-tot{text-align:end}.ct-tot b{font-size:26px;font-variant-numeric:tabular-nums}.ct-tot em{font-style:normal;font-size:14px;opacity:.8}
.ct-steps{display:flex;align-items:center;gap:6px;margin-top:15px}
.ct-steps span{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:6px 11px;border-radius:20px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);white-space:nowrap}
.ct-steps span svg.i{width:15px;height:15px}
.ct-steps span.on{background:rgba(79,192,138,.22);color:#9FF0C6}
.ct-steps span.warn{background:rgba(240,115,106,.22);color:#FFB4AE}
.ct-steps i{flex:1;height:2px;border-radius:2px;background:rgba(255,255,255,.18);min-width:8px}
.line{border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:9px;box-shadow:var(--shadow)}
.total{border-radius:16px}
.ct-fix{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px;margin-bottom:12px;border-radius:13px;font-size:13px;font-weight:800;
  background:rgba(240,115,106,.14);color:var(--danger-ink,#C6362D);border:1.5px dashed rgba(240,115,106,.55)}
.ct-fix svg.i{width:17px;height:17px}
.btn.ct-send{background:linear-gradient(135deg,#2BD576,#0E9F6E)!important;color:#fff!important;box-shadow:0 10px 22px -8px rgba(14,159,110,.6)}

/* v236 — شاشة «طلب جديد»: نفس هوية الرئيسية والسلة */
.secTile.on{box-shadow:0 0 0 2px var(--brand),0 10px 22px -10px var(--brand)}
body.hasFloat #view{padding-bottom:84px}

/* ============ v237 — أيقونات بلمسة لونين + أشكال أنعم ============ */
.i .d{fill:currentColor;fill-opacity:.17;stroke:none}
.tabs button.on .i .d{fill-opacity:.38}
.i{stroke-width:1.8}
.btn .i .d,#cartFloat .i .d{fill-opacity:.28}
.secTile .ti{border-radius:16px}
.secTile .ti{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.38),0 6px 14px -6px rgba(0,0,0,.35)}
.secTile .ti .i .d{fill:#fff;fill-opacity:.3}
.tabs button.on{border-radius:18px}
.tabs button .i{transition:transform .2s var(--ease,ease)}
.tabs button.on .i{transform:translateY(-1px) scale(1.08)}
.ct-steps span svg.i .d{fill-opacity:.35}

/* ============ v238 — شاشة المصنع ============ */
.ad-card{margin-bottom:14px}
.ad-q{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:14px;font-size:14px}
.ad-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--muted);font-weight:700}

.ad-row.ad-end{grid-template-columns:1fr 1fr}
/* v259 — مجموعات شريط الأدوات منسدلة */
.ord[data-grp]{border-radius:18px}
.grp-hd{padding:12px}
.grp-ord{border-radius:12px}

/* v238 — تظبيط صفوف الطلبات وأزرار الأدوات في المصنع */
.ad-row .btn:last-child:nth-child(odd){grid-column:1/-1}
.grp-ord{display:flex!important;flex-wrap:nowrap;align-items:center;gap:6px}
.grp-ord .grp-b{flex:none;width:auto!important;justify-content:center;white-space:nowrap}
.grp-all{display:flex;flex-wrap:wrap;align-items:center;gap:7px 8px}

.grp-all .grp-b{flex:1 1 calc(33.33% - 6px);justify-content:center;padding-inline:6px}
.grp-all{display:flex!important;flex-wrap:wrap!important}
.grp-all>span{flex:1 0 100%!important;width:100%!important;text-align:start}
.grp-all .grp-b{flex:1 1 calc(33.33% - 6px)!important;width:auto!important;margin:0!important;padding-inline:6px!important}

/* ---------- شكل قايمة العملاء المختار (تصميم A بألوان A3 الهادية) ---------- */
.ord.grpa{background:var(--cardtint,#F5F8FC)}
.grp-nm{color:#12233F}
.ord.grpa .grp-list{background:#FFFFFF;margin:0 10px;border-radius:12px;overflow:hidden}
.ord.grpa .grp-all{background:#FFFFFF;margin:10px 10px 0;border-radius:12px 12px 0 0}
.ord.grpa .grp-list{margin-bottom:10px}
.grp-num{background:none;border:0;padding:2px 4px;font-family:inherit;font-size:15.5px;font-weight:800;color:#1F3B66;cursor:pointer;flex:none}
.grp-num:active{opacity:.6}
.grp-dtw{flex:none;display:flex;align-items:baseline;gap:5px}
.grp-dm{font-size:13px;font-weight:800;color:#12233F;white-space:nowrap}
.grp-prev{background:#FFFFFF!important;color:#1F3B66!important;border:1px solid #C9D6E8!important;padding:6px 12px!important;font-size:12.5px!important;border-radius:10px!important}
.grp-prev .i{color:#1F3B66}
html[data-theme="dark"] .ord.grpa{background:var(--card)}
html[data-theme="dark"] .grp-nm,html[data-theme="dark"] .grp-dm,html[data-theme="dark"] .grp-num{color:#E8EEF7}
html[data-theme="dark"] .ord.grpa .grp-list,html[data-theme="dark"] .ord.grpa .grp-all{background:rgba(255,255,255,.04)}

<script>
'use strict';

/* ============================================================
   الإعدادات
   ============================================================ */

const ASSETS = {
  logo:'img/logo.png',
  mark:'img/mark.png',
  bank:'img/bank-transfer.jpg',   // بيانات التحويل البنكي — بتتطبع في آخر مستند الأوردر
  doors:{
    A01:'img/doors/A01.jpg',
    A02:'img/doors/A02.jpg',
    A03:'img/doors/A03.jpg',
    A04:'img/doors/A04.jpg',
    A05:'img/doors/A05.jpg',
    A06:'img/doors/A06.jpg',
    A07:'img/doors/A07.jpg',
    A08:'img/doors/A08.jpg',
    A09:'img/doors/A09.jpg',
    A010:'img/doors/A010.jpg',
    A013:'img/doors/A013.jpg'
  }
};

// اللوجو والصور بقت ملفات منفصلة بدل ما تكون base64 جوه الكود (أخف وبتتكاش لوحدها).
// الدالة دي بتجيب اللوجو كـ base64 مرة واحدة بس وتخزّنه — محتاجينه بالشكل ده لمكتبة الإكسيل (ExcelJS).
let _logoB64Cache = null;
async function logoBase64_(){
  if(_logoB64Cache) return _logoB64Cache;
  try{
    const res = await fetch(ASSETS.logo);
    const blob = await res.blob();
    _logoB64Cache = await new Promise((resolve,reject)=>{
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result).split(',')[1]);
      fr.onerror = reject;
      fr.readAsDataURL(blob);
    });
  }catch(e){ _logoB64Cache = null; }
  return _logoB64Cache;
}

// بنحمّل صور الأبواب واللوجو بدري في الخلفية عشان تبقى جاهزة في كاش المتصفح
// وقت ما المستخدم يفتح لوحة اختيار الباب أو يعمل تصدير PDF/صورة (بدل ما تتأخر في اللحظة دي).
function preloadDoorImages_(){
  // كان بيبدأ 13 تحميل صورة مع أول لحظة فتح فيزاحم رسم الشاشة نفسها.
  // دلوقتي بيستنى المتصفح يفضى (requestIdleCallback) فالفتحة بقت أسرع محسوسًا.
  const go = () => {
    [ASSETS.logo, ASSETS.mark, ...Object.values(ASSETS.doors)].forEach(src=>{
      const im = new Image(); im.decoding = 'async'; im.src = src;
    });
  };
  (window.requestIdleCallback || (fn => setTimeout(fn, 1200)))(go, { timeout: 3000 });
}

/* ============================================================
   تحميل المكتبات التقيلة عند الطلب (Lazy loading)
   ------------------------------------------------------------
   قبل كده كانت 4 مكتبات (~2.4 ميجا) بتتحمّل في <head> مع كل فتحة للتطبيق،
   حتى لو المستخدم مش هيصدّر أي حاجة. ده كان بيأخّر ظهور الشاشة الأولى ثواني
   على الموبايل. دلوقتي كل مكتبة بتتحمّل أول مرة تتطلب فيها بس، والوعد بتاعها
   بيتخزّن فمافيش تحميل مكرر، والـ Service Worker بيكاشها فالمرات الجاية فورية.
   ============================================================ */
const LIB_URLS = {html2canvas:'html2canvas.js',jspdf:'jspdf.js',exceljs:'exceljs.js'};
const LIB_READY = {
  html2canvas:()=>typeof html2canvas!=='undefined',
  jspdf      :()=>!!window.jspdf,
  exceljs    :()=>typeof ExcelJS!=='undefined'
};
const _libPromises = {};
function ensureLib_(name){
  if(LIB_READY[name] && LIB_READY[name]()) return Promise.resolve(true);
  if(_libPromises[name]) return _libPromises[name];
  _libPromises[name] = new Promise((resolve, reject)=>{
    const sc=document.createElement('script');let settled=false;
    const fail=()=>{if(settled)return;settled=true;clearTimeout(timer);delete _libPromises[name];sc.remove();reject(new Error('تعذّر تحميل أدوات التصدير في الوقت المحدد'));};
    const timer=setTimeout(fail,25000);
    sc.src=LIB_URLS[name];sc.async=true;
    sc.onload=()=>{if(settled)return;if(!(LIB_READY[name]&&LIB_READY[name]())){fail();return;}settled=true;clearTimeout(timer);resolve(true);};
    sc.onerror=fail;document.head.appendChild(sc);
  });
  return _libPromises[name];
}
// Read-only export waits are bounded. This helper never edits order or artwork data.
async function waitExportResource_(work,ms,message){
  let timer;
  try{return await Promise.race([Promise.resolve(work),new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(message)),ms);})]);}
  finally{clearTimeout(timer);}
}
// بتحمّل مجموعة مكتبات مع بعض وبتوري رسالة واضحة لو النت مقطوع.
// بترجّع true لو كله تمام، و false لو فشل — فكل مكان بيستخدمها بيعمل return عادي.
async function needLibs_(...names){
  const missing = names.filter(n => !(LIB_READY[n] && LIB_READY[n]()));
  if(!missing.length) return true;
  // ⚠️ كان فيه باج هنا: الدالة دي بتقفل شاشة «جارٍ التجهيز» في الآخر على طول.
  // بس هي بتتنده أحيانًا من جوه عملية أطول فاتحة الشاشة أصلًا (زي «تقرير كامل»)،
  // فكانت بتقفلها في نص الشغل والمستخدم يفتكر إن التطبيق علّق — والباقي (رسم
  // الصفحة وتحويلها PDF) هو أبطأ جزء أصلًا. دلوقتي بنرجّع الشاشة زي ما لقيناها.
  const wasOn = _busyOn, wasTxt = _busyTxt;
  busy(true,'جارٍ تجهيز الأدوات…');
  try{
    await Promise.all(missing.map(ensureLib_));
    return true;
  }catch(e){
    toast('تعذّر تحميل أدوات التصدير؛ الطلب والصور محفوظين. تأكد من الاتصال وجرّب PDF مرة أخرى',6500);
    return false;
  }finally{
    if(wasOn) busy(true, wasTxt);   // العملية الأكبر لسه شغّالة — سيب الشاشة مفتوحة
    else busy(false);
  }
}
// أول ما المستخدم يفتح شاشة فيها تصدير، بنبدأ نجيب المكتبات في الخلفية بهدوء
// عشان أول ضغطة على «PDF» تبقى فورية بدل ما يستنى التحميل ساعتها.
let _libsWarmed = false;
function warmExportLibs_(){
  if(_libsWarmed) return;
  _libsWarmed = true;
  const go = () => { ensureLib_('html2canvas').catch(()=>{}); ensureLib_('jspdf').catch(()=>{}); ensureLib_('exceljs').catch(()=>{}); };
  (window.requestIdleCallback || (fn=>setTimeout(fn,1500)))(go, {timeout:4000});
}

const _cartTabId_=Math.random().toString(36).slice(2,10)+Date.now().toString(36);
function cartLid_(){return 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function cartAssignLids_(items){for(const it of items)if(it&&typeof it==='object'&&!it.lid)it.lid=cartLid_();}
function cartReadEnv_(){
  let raw=null; try{raw=localStorage.getItem(LS_CART);}catch(e){return null;}
  if(raw==null)return{rev:0,items:[],raw:null};
  try{
    const p=JSON.parse(raw);
    if(Array.isArray(p))return{rev:0,items:p,raw};
    if(p&&p.__cartEnv===CART_ENV_V_&&Array.isArray(p.items))return{rev:Number(p.rev)||0,items:p.items,raw};
  }catch(e){}
  return{rev:0,items:[],raw};
}
function cartLoadItems_(){
  const env=cartReadEnv_();
  const items=(env&&env.items)||[];
  cartAssignLids_(items);
  _cartRev=env?env.rev:0;
  _cartBase=JSON.parse(JSON.stringify(items));
  _cartWrittenRaw=(env&&env.raw)||'';
  return items;
}
function cartMerge3_(base,theirs,mine){
  const noSvc=a=>(a||[]).filter(it=>!isServiceLine_(it));
  const b=noSvc(base),t=noSvc(theirs),m=noSvc(mine);
  const bMap=new Map(b.map(i=>[i.lid,i])),tMap=new Map(t.map(i=>[i.lid,i])),mMap=new Map(m.map(i=>[i.lid,i]));
  const myDel=new Set([...bMap.keys()].filter(l=>!mMap.has(l)));
  const out=[],seen=new Set();let conflicts=0;
  const push=it=>{if(it&&!seen.has(it.lid)){seen.add(it.lid);out.push(it);}};
  for(const ti of t){
    if(myDel.has(ti.lid))continue;
    const bi=bMap.get(ti.lid),mi=mMap.get(ti.lid);
    if(mi&&bi&&JSON.stringify(mi)!==JSON.stringify(bi)&&JSON.stringify(ti)===JSON.stringify(bi)){push(mi);continue;}
    if(mi&&bi&&JSON.stringify(mi)!==JSON.stringify(bi)&&JSON.stringify(ti)!==JSON.stringify(bi))conflicts++;
    push(ti);
  }
  for(const mi of m)if(!tMap.has(mi.lid)&&!bMap.has(mi.lid))push(mi);
  return{items:out,conflicts};
}
const LS_PROFILE = 'wpc_profile', LS_CART = 'wpc_cart', LS_ORDERS = 'wpc_orders', LS_TAB = 'wpc_tab', LS_SECTION = 'wpc_section', LS_PRICES = 'wpc_prices', LS_PENDING = 'wpc_pending_sync', LS_PENDING_CANCEL = 'wpc_pending_cancel', LS_PRICES_DIRTY = 'wpc_prices_dirty', LS_DELETED = 'wpc_deleted_ids', LS_SENT = 'wpc_sent_ids', LS_REJECTED = 'wpc_rejected_ids';

// مستويات السعر: السعر الأساسي المتخزّن في الكتالوج هو "سعر موزع"، ومنه بتتحسب المستويات التانية بزيادة ثابتة.
// الزيادة بتتطبّق وقت طباعة عرض السعر بس — من غير ما تغيّر الأسعار المتخزّنة نفسها.
// ⚠️ المستويات بقت اتنين بس: جملة وعميل. المستوى التاني مفتاحه الداخلي فاضل
// 'showroom' زي ما هو عن قصد — الأسعار المحفوظة على السيرفر وعلى الأجهزة
// متخزّنة بالمفتاح ده، فتغييره كان هيضيّع كل الأسعار اللي المصنع ظبّطها.
// اللي اتغيّر هو الاسم اللي بيبان للناس بس.
const PRICE_TIERS = {
  dist:     { label:'سعر جملة', labelEn:'Wholesale Price', doorAdd:0,   otherAdd:0   },
  showroom: { label:'سعر عميل', labelEn:'Customer Price',  doorAdd:300, otherAdd:0.5 }
};
// كل مستوى سعر (جملة/عميل) بيتخزّن كقيمة مستقلة لكل صنف — مش بيتحسب تلقائي من زيادة ثابتة.
// الزيادات فوق (doorAdd/otherAdd) بتُستخدم بس كقيمة مبدئية أول مرة تفتح فيها شاشة تعديل الأسعار قبل ما تحفظ حاجة بنفسك.
const TIER_OVERRIDES = { showroom:{sizes:{},customExtra:null,woodExtra:null,printExtra:null,hafrExtra:null,frames:{},brors:{},acc:{},panel:{},strip:{},veneer:{}} };
const ACC_EN_TO_ID_ = {}; ACCESSORIES.forEach(a=>{ ACC_EN_TO_ID_[a.en] = a.id; });
// بيرجّع سعر الصنف على مستوى معيّن (جملة/عميل). لو الصنف ده اتحفظله سعر مخصوص لنفس المستوى بيترجع هو،
// وإلا بيترجع سعر الجملة + الزيادة الافتراضية للمستوى (fallback للأصناف اللي لسه محدّش عدّل سعرها بنفسه).
// opts.hafr = الباب ده حفر (سعره الأساسي شامل زيادة الحفر).
// ⚠️ باج كان هنا: أول ما المصنع يحفظ سعر عميل لمقاس، السعر المحفوظ ده كان
// بيرجع زي ما هو للباب الحفر كمان — يعني زيادة الحفر (٦٠٠–٨٠٠ ج للباب)
// بتختفي من عرض سعر العميل. بنفصل سعر المقاس عن زيادة الحفر، ونحط زيادة
// المستوى فوقه.
function tierPrice(basePrice, kind, tierKey, key, opts){
  if(!tierKey || tierKey==='dist') return Number(basePrice)||0;
  if(kind==='mabra') return Number(basePrice)||0;   // لسه من غير تسعير — مايتزادش عليها زيادة المستوى
  const group = kind==='door'?'sizes':kind==='frame'?'frames':kind==='bror'?'brors':kind==='panel'?'panel':(kind==='strip'||kind==='veneer')?kind:'acc';
  const ov = TIER_OVERRIDES[tierKey];
  // «خدمة قص» سعرها واحد في كل المستويات إلا لو المصنع حفظ للمستوى ده قيمة
  // بنفسه. الزيادة الافتراضية للمستوى مالهاش لازمة هنا — كانت بتطلّع 300.5.
  if(key==='woodExtra') return 0; // v367: التدعيم الإجباري للمقاس الخاص سعره داخل خدمة القص
  if(key==='customExtra' || key==='woodExtra' || key==='printExtra'){
    return (ov && ov[key]!=null) ? (Number(ov[key])||0) : (Number(basePrice)||0);
  }
  const حفر = !!(opts && opts.hafr) && kind==='door';
  const زيادة_الحفر = حفر
    ? ((ov && ov.hafrExtra!=null) ? (Number(ov.hafrExtra)||0) : (Number(HAFR_EXTRA)||0))
    : 0;
  // سعر المقاس من غير الحفر — عشان نركّب عليه زيادة الحفر بتاعة المستوى
  const أساس = (Number(basePrice)||0) - (حفر ? (Number(HAFR_EXTRA)||0) : 0);
  if(ov){
    if(key==='hafrExtra'){ if(ov.hafrExtra!=null) return Number(ov.hafrExtra)||0; }
    else if(key!=null && ov[group] && ov[group][key]!=null){
      return (Number(ov[group][key])||0) + زيادة_الحفر;
    }
  }
  const t = PRICE_TIERS[tierKey] || PRICE_TIERS.dist;
  const add = kind==='door' ? t.doorAdd : t.otherAdd;
  return أساس + زيادة_الحفر + add;
}
// بيستخرج مفتاح الصنف (مقاس الباب/الحلق بالرقم، مقاس البرور، أو كود الإكسسوار) من صنف الطلب —
// المفتاح ده هو اللي بيتربط بيه سعر كل مستوى في TIER_OVERRIDES.
function tierKeyFor_(it, kind){
  if(kind==='door' || kind==='frame'){ const m=/^(\d+)/.exec(String(it.size||'')); return m?Number(m[1]):null; }
  if(kind==='bror') return it.size||null;
  if(kind==='panel') return 'prodium';
  if(kind==='strip' || kind==='veneer') return 'm';
  // بنود الخدمة (قص/تدعيم) بتاخد سعرها من مفتاحها في كل مستوى
  if(kind==='acc'){
    const def = serviceDefFor_(it);
    if(def) return def.priceKey;
    return ACC_EN_TO_ID_[it.title] || null;
  }
  return null;
}

// أسعار الكتالوج (الأبواب/الحلق/البرور/الإكسسوارات) متخزّنة كأرقام ثابتة فوق —
// الدالتين دول بيسمحوا بتعديلها من شاشة المصنع وحفظ التعديل على نفس الجهاز.
function loadPriceOverrides_(){ try{ return JSON.parse(localStorage.getItem(LS_PRICES)||'{}'); }catch(e){ return {}; } }
function applyPriceOverrides(){
  const ov = loadPriceOverrides_();
  // توافق مع الشكل القديم (كان فيه سعر جملة بس، من غير مستوى عميل مخصوص)
  const dist = ov.dist || ov;
  if(dist.sizes) SIZES.forEach(s=>{ if(dist.sizes[s.w]!=null) s.price=Number(dist.sizes[s.w])||0; });
  if(dist.customExtra!=null) CUSTOM_EXTRA = Number(dist.customExtra)||0;
  if(dist.woodExtra!=null) WOOD_EXTRA = Number(dist.woodExtra)||0;
  if(dist.printExtra!=null) PRINT_EXTRA = Number(dist.printExtra)||0;
  if(dist.hafrExtra!=null) HAFR_EXTRA = Number(dist.hafrExtra)||0;
  if(dist.frames) FRAMES.forEach(f=>{ if(dist.frames[f.cm]!=null) f.price=Number(dist.frames[f.cm])||0; });
  if(dist.brors) BRORS.forEach(b=>{ if(dist.brors[b.size]!=null) b.price=Number(dist.brors[b.size])||0; });
  if(dist.acc) ACCESSORIES.forEach(a=>{ if(dist.acc[a.id]!=null) a.price=Number(dist.acc[a.id])||0; });
  if(dist.panel && dist.panel.prodium!=null) PRODIUM_PRICE = Number(dist.panel.prodium)||0;
  if(dist.strip && dist.strip.m!=null) STRIP_PRICE = Number(dist.strip.m)||0;
  if(dist.veneer && dist.veneer.m!=null) VENEER_PRICE = Number(dist.veneer.m)||0;
  ['showroom'].forEach(tk=>{
    const t = ov[tk]; if(!t) return;
    if(t.sizes) TIER_OVERRIDES[tk].sizes = {...t.sizes};
    if(t.customExtra!=null) TIER_OVERRIDES[tk].customExtra = t.customExtra;
    if(t.woodExtra!=null) TIER_OVERRIDES[tk].woodExtra = t.woodExtra;
    if(t.printExtra!=null) TIER_OVERRIDES[tk].printExtra = t.printExtra;
    if(t.hafrExtra!=null) TIER_OVERRIDES[tk].hafrExtra = t.hafrExtra;
    if(t.frames) TIER_OVERRIDES[tk].frames = {...t.frames};
    if(t.brors) TIER_OVERRIDES[tk].brors = {...t.brors};
    if(t.acc) TIER_OVERRIDES[tk].acc = {...t.acc};
    if(t.panel) TIER_OVERRIDES[tk].panel = {...t.panel};
    if(t.strip) TIER_OVERRIDES[tk].strip = {...t.strip};
    if(t.veneer) TIER_OVERRIDES[tk].veneer = {...t.veneer};
  });
}

/* ---------- مزامنة الأسعار مع السيرفر ----------
   الأسعار كانت متخزّنة على جهاز المصنع بس، فلما المصنع يعدّل سعر كان الموزّعين
   كلهم يفضلوا شايفين السعر القديم المكتوب جوّه التطبيق لحد ما تترفع نسخة جديدة.
   دلوقتي الشيت هو المصدر الواحد. بنقرا منه عند فتح التطبيق، وبنفضل شغّالين
   بآخر نسخة محفوظة على الجهاز لو النت مش موجود. */
let _pricesSyncedAt = '';
async function syncPricesFromServer_(){
  if(!APPS_SCRIPT_URL) return;
  // ⚠️ لو المصنع عدّل الأسعار وهو مش متصل، التعديل لسه على جهازه بس. لو قرينا
  // من السيرفر دلوقتي هنمسح تعديله بالأسعار القديمة. فبنحاول نرفع الأول،
  // ومانقراش خالص طالما لسه فيه تعديل ما اترفعش.
  if(load(LS_PRICES_DIRTY, false)){
    const pushed = await pushPricesToServer_(loadPriceOverrides_(), true);
    if(!pushed) return;
  }
  try{
    const d = await jsonp(APPS_SCRIPT_URL + '?action=prices');
    if(!d || !d.ok || !d.prices) return;
    const incoming = JSON.stringify(d.prices);
    if(incoming === JSON.stringify(loadPriceOverrides_())) return;   // نفس اللي عندنا
    save(LS_PRICES, d.prices);
    applyPriceOverrides();
    _pricesSyncedAt = d.at || '';
    render();
  }catch(err){ /* مفيش نت — بنكمّل بآخر أسعار محفوظة على الجهاز */ }
}

   بتتنفّذ قبل ما state تتبني عشان تقرا المحوَّل على طول. */
(function renameDoorCodeLocally_(){
  try{
    if(localStorage.getItem('wpc_code_migrated')) return;
    const قديم = /\bA015\b/g;
    const حوّل = list => (Array.isArray(list) ? list : []).map(it=>{
      if(!it || typeof it !== 'object') return it;
      if(it.code) it.code = String(it.code).replace(قديم, 'A013');
      ['title','titleEn','spec','key'].forEach(k=>{
        if(typeof it[k] === 'string') it[k] = it[k].replace(قديم, 'A013');
      });
      if(Array.isArray(it.items)) it.items = حوّل(it.items);
      return it;
    });
    ['wpc_cart','wpc_orders'].forEach(k=>{
      const raw = localStorage.getItem(k);
      if(!raw || raw.indexOf('A015') < 0) return;
      try{ localStorage.setItem(k, JSON.stringify(حوّل(JSON.parse(raw)))); }catch(e){}
    });
    localStorage.setItem('wpc_code_migrated', '1');
  }catch(e){}
})();

/* ---------- قراية التخزين ----------
   ⚠️ دي كانت بترجّع القيمة الافتراضية في صمت لو الـJSON اتخرب. والمشكلة إن أول
   حفظ بعدها بيكتب القايمة الفاضية فوق البيانات المخربة — فالضياع يبقى نهائي
   ومفيش أي أثر ليه.
   والـJSON بيتخرب فعلًا: الـService Worker بيعمل reload إجباري لكل الصفحات
   المفتوحة مع كل نسخة جديدة، ولو ده حصل وسط كتابة قايمة الطلبات، النص بيتقطع.
   دلوقتي: بنحتفظ بالأصل المخرب في مفتاح جانبي، وبنحاول نرجّع منه أكبر عدد
   ممكن من الطلبات السليمة، وبنقول للمستخدم اللي حصل. */
function load(k,d){
  let raw = null;
  try{ raw = localStorage.getItem(k); }catch(e){ return d; }
  if(raw == null || raw === '') return d;
  try{ return JSON.parse(raw); }catch(e){}
  // الـJSON مقطوع أو مخرب — نحفظ الأصل الأول قبل أي حاجة تكتب فوقه
  try{ if(localStorage.getItem(k + '_corrupt')===null)localStorage.setItem(k + '_corrupt', raw); }catch(e2){}
  const مسترجع = recoverArray_(raw);
  _storeProblems_.push({ key:k, recovered: مسترجع ? مسترجع.length : 0 });
  return مسترجع && مسترجع.length ? مسترجع : d;
}

// بيحاول ينقذ أكبر عدد عناصر من مصفوفة JSON اتقطعت في النص.
// بيرجع للخلف لآخر عنصر مكتمل ويقفل المصفوفة، وبيجرّب لحد ما يعرف يقراها.
function recoverArray_(raw){
  const t = String(raw||'').trim();
  if(t[0] !== '[') return null;
  for(let i = t.lastIndexOf('}'); i > 0; i = t.lastIndexOf('}', i - 1)){
    try{
      const v = JSON.parse(t.slice(0, i + 1) + ']');
      if(Array.isArray(v) && v.length) return v;
    }catch(e){}
  }
  return null;
}
// ⚠️ دي كانت بتبتلع أي خطأ في صمت. لما مساحة التخزين تمتلي (أو المتصفح يمنع

// بيتحط في الذاكرة والمستخدم يشوف «✅ اتسجّل الطلب»، وأول ما يقفل التطبيق يلاقيه
// اختفى من «تابع طلبك» من غير ما حد يقوله ليه.

function save(k,v){

  // A damaged original stays read-only until it can be recovered safely.
  if(_storeProblems_.some(p=>p.key===k)) return false;
  try{ localStorage.setItem(k,JSON.stringify(v)); return true; }
  catch(e){ return false; }
}

// أساسها، فخلّيناها ثابت واحد.

/* ---------- وحدة الطول في شاشة «حلق فقط» و«برور فقط» ----------
   فيه موزّعين بيفكّروا بالسنتي (٢٢٠ سم) وفيه بالمتر (٢.٢ م). بدل ما كل شاشة
   تفرض وحدة واحدة والموزّع يحسب في دماغه (وده مصدر غلطات في الأطوال)، فيه
   زرار وحدة جنب الخانات. التطبيق بيحسب وبيسجّل بالسنتي دايمًا — الوحدة
   اختيار كتابة وعرض بس، مابتأثرش على الطلب المتسجّل ولا على السعر. */
const LEN_UNITS_ = { cm:{lbl:'سم', f:1, ar:'سنتيمتر'}, m:{lbl:'م', f:100, ar:'متر'} };
function lenUnit_(u){ return LEN_UNITS_[u] || LEN_UNITS_.cm; }
function lenUnitLbl_(u){ return lenUnit_(u).lbl; }
// من اللي المستخدم كتبه (بالوحدة المختارة) لسنتيمتر.
// ⚠️ التقريب لجزء من مية من السنتي مقصود: من غيره ٢.٢٦٥ م بتطلع
// 226.49999999999997 وبتتسجّل كده في الشيت وفي الطلب المبعوت.
function lenToCm_(v, u){
  const n = Number(decIn_(String(v==null?'':v))) || 0;
  return Math.round(n * lenUnit_(u).f * 100) / 100;
}
// والعكس — لما الموزّع يبدّل الوحدة، اللي مكتوب يتحوّل بدل ما معناه يتغيّر
// (٢٢٠ سم تبقى ٢.٢ م، مش ٢٢٠ م).
function lenFromCm_(cm, u){
  const v = (Number(cm)||0) / lenUnit_(u).f;
  if(!v) return '';
  return String(Math.round(v * 10000) / 10000);
}
// ⚠️ عدد الأعواد كان بيتقرّب لصحيح (Math.round) في كل مكان — فنص عود أو ربع
// عود (تكملة) مكانش ينفع يتطلب أصلاً، والزرار كان بيقول «أضف ٣» والمستخدم
// كاتب ٢.٥. بقى بيقبل الكسور زي الأطوال.
function quantityNumber_(v){
  let s=toLatinDigits_(String(v==null?'':v)).trim().replace(/\u066B/g,'.').replace(/\u066C/g,'');
  if(!s.includes('.'))s=s.replace(/[,،]/g,'.');
  if(!/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return 0;
  const n=Number(s);return Number.isFinite(n)&&n>0?n:0;
}
function wholeQuantity_(v){const n=quantityNumber_(v);return Number.isInteger(n)?n:0;}
function rodQty_(v){return Math.round(quantityNumber_(v)*100)/100;}

// طول عود البرور بالسنتي من اللي مكتوب في الشاشة (بالوحدة المختارة).
// كان بيتقرّب لسنتي صحيح — فعود ٢.٢٦٥ م يتسجّل ٢٢٧ سم، نص سنتي يضيع من كل
// عود والسعر (سعر المتر × الطول) يطلع غلط على الطلب كله.
function brRodCm_(v, unit){
  return Math.max(0.1, lenToCm_(v, unit===undefined ? 'm' : unit));
}
// طول من شاشة «حلق فقط» بالسنتي — المكان الوحيد اللي بيقرا وحدة الشاشة
function frCm_(v){ return lenToCm_(v, (state.fr||{}).unit); }
// شرايح اختيار الوحدة (سنتيمتر / متر)

}
// ⚠️ الفلوس بتتخزّن وبتتبعت زي ما هي — مش بس بتتعرض. سعر العود المتوسط بقى
// بأربع خانات عشرية (عشان إجمالي السطر يطلع مظبوط بالقرش)، فحاصل الضرب كان
// بيطلع 7199.499999999999 ويتسجّل كده في الشيت وفي الطلب المبعوت.
// بنقرّب لأقرب قرش عند حساب السطر والإجمالي — الفلوس متقاس بالقرش مش أكتر.
const قرش_ = n => Math.round((Number(n)||0)*100)/100;
function linePrice(it){return قرش_((it.kind==='door'?it.unitPrice:it.price)*it.qty);}
function cartTotal(){return قرش_(state.cart.reduce((s,it)=>s+linePrice(it),0));}
function cartCount(){return state.cart.length;}
// ⚠️ الكيبورد العربي على الموبايل بيكتب أرقام هندية (٠١٢٣٤٥٦٧٨٩) مش لاتينية.
// الموزع بيكتب رقمه ٠١٠١٢٣٤٥٦٧٨ — رقم صح تمامًا — والتطبيق كان بيقوله «رقم غلط»
// من غير ما يقوله ليه، ويمنعه من إرسال الطلب.
// وأخطر من كده: لو الرقم اتسجّل بالعربي، السيرفر بيشيل «كل اللي مش رقم» فبيمسح
// الرقم كله ويفضل فاضي — يعني الموزع ده مش هيلاقي طلباته أبدًا في «تابع طلبك»،
// ولا يقدر يلغي طلب.
// بنحوّل الأرقام الهندية (العربية والفارسية) للاتينية في أي مكان بنقرا فيه رقم.
function toLatinDigits_(v){
  return String(v == null ? '' : v)
    .replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 0x0660))   // ٠-٩ عربي
    .replace(/[\u06F0-\u06F9]/g, d => String(d.charCodeAt(0) - 0x06F0));  // ۰-۹ فارسي
}

function phoneOk(p){return /^0?1[0-9]{9}$/.test(toLatinDigits_(p).replace(/\s/g,''));}

// بيسمح بالأرقام (حتى لو مكتوبة بالأرقام العربية) ونقطة عشرية واحدة بس —
// عشان حقول الأطوال/الارتفاعات (زي 110.5) تتكتب طبيعي من غير ما تتمسح.
// مستخدمة بدل type="number" اللي كان بيصفّر الخانة أول ما تكتب النقطة.
function decIn_(v){
  let s = toLatinDigits_(v);
  // ٫ (u066B) هي العلامة العشرية العربية، و٬ (u066C) فاصلة الآلاف — مش نفس الحاجة.
  // والفاصلة العادية بتبقى عشرية لو مفيش نقطة في النص (1,5)، وفاصلة آلاف لو
  // فيه نقطة كمان (1,234.5) — الحالة التانية كانت بتطلّع 1.2345 بدل 1234.5.
  s = s.replace(/\u066B/g, '.').replace(/[\u066C\u2009\s]/g, '');
  s = /\./.test(s) ? s.replace(/[,،]/g, '') : s.replace(/[,،]/g, '.');
  s = s.replace(/[^0-9.]/g,'');
  const i = s.indexOf('.');
  if(i!==-1) s = s.slice(0,i+1) + s.slice(i+1).replace(/\./g,'');
  return s;
}

   أرصدة المخزن — الأصناف الجاهزة تتسلّم خلال ٤٨ ساعة

const READY_HOURS_TXT = 'التسليم خلال ٤٨ ساعة من المصنع';

// بيرجّع الرصيد المتاح لكود + مقاس (المقاس بالسم كرقم، أو '' لأي مقاس)
// المطلوب/المحجوز لعملاء: بيجمع كل الطلبات المعلّقة (اللي لسه ما اتسلّمتش) وبيحسب المتبقي
// (الكمية - الجاهز) لكل كود+مقاس — عشان المصنع يعرف الرصيد فعلًا فاضي قد إيه بعد خصم المحجوز
async function loadReserved(force){
  const a = state.admin;
  if(a.reservedLoading) return;
  if(!force && a.reserved && Date.now()-a.reservedAt < 60000) return;   // كاش دقيقة
  a.reservedLoading = true; render();
  try{
    const orders = await fetchPendingOrders_();
    const map = {};
    (orders||[]).forEach(o=>{
      // «المحجوز لعملاء» = اللي لسه مطلوب فعلاً. الملغي مش مطلوب، والمُسلَّم
      // خلاص خرج. (المسلَّم بيتأرشف أوتوماتيك فمابيجيش أصلاً — إلا لو حد غيّر
      // الحالة بإيده على الشيت، وساعتها كان بيتحسب محجوز وهو مسلَّم.)
      if(o.status==='Cancelled' || o.status==='Delivered') return;
      (o.items||[]).forEach(it=>{
        if(it.type!=='Door') return;
        const qty = Number(it.qty)||0;
        // v327: الباب الجاهز غير المسلَّم موجود فعليًا ضمن رصيد المخزن، فيُحجز من الرصيد مرة واحدة (لا يُطرح من المطلوب)
        const remain = Math.max(0, qty);
        if(remain<=0) return;
        const key = String(it.code||'').trim()+'|'+String(doorWidthGroup_(it.size) ?? it.size ?? '').trim();
        map[key] = (map[key]||0) + remain;
      });
    });
    a.reserved = map; a.reservedAt = Date.now();
  }catch(err){ /* المحجوز إضافة مساعدة — لو فشل مايوقفش الشاشة */ }
  a.reservedLoading = false; render();
}
function reservedFor(code, sizeW){
  const map = state.admin.reserved;
  if(!map) return null;
  return map[String(code).trim()+'|'+String(sizeW).trim()] || 0;
}

    return `<tr style="${zebra}">

  const now = new Date();

function stockFor(code, sizeW){
  const rows = state.stock.rows;
  if(!rows || !code) return null;
  const want = String(sizeW==null?'':sizeW).trim();
  const wantCode = doorCode_(code);
  const hit = rows.find(r=>doorCode_(r.code)===wantCode
                        && String(r.size).trim()===want);
  return hit ? (Number(hit.qty)||0) : 0;
}
// إجمالي رصيد الكود على كل المقاسات — للشارة على كارت الباب
function stockTotalFor(code){
  const rows = state.stock.rows;
  if(!rows || !code) return null;
  return rows.filter(r=>String(r.code).trim()===String(code).trim())
             .reduce((n,r)=>n+(Number(r.qty)||0),0);
}

async function loadStockOnce_(force){
  if(!APPS_SCRIPT_URL) return;
  if(state.stock.loading) return;
  if(!force && state.stock.rows && Date.now()-state.stock.at < 120000) return;  // كاش دقيقتين
  state.stock.loading = true;
  try{
    const d = await jsonp(APPS_SCRIPT_URL + '?action=stock');
    if(d && d.ok){ state.stock.rows = d.stock || []; state.stock.at = Date.now(); }
  }catch(err){ /* الرصيد إضافة مساعدة — لو فشل مايوقفش الطلب */ }
  state.stock.loading = false;
  render();
}

let _stockReadInFlight_=null;
function loadStock(force){
  if(_stockReadInFlight_)return _stockReadInFlight_;
  const task=loadStockOnce_(force);if(!state.stock.loading)return task;_stockReadInFlight_=task;
  task.finally(()=>{if(_stockReadInFlight_===task)_stockReadInFlight_=null;});
  return task;
}

// بيحفظ كل التعديلات المعلّقة على الأرصدة واحدة واحدة
async function saveStockDrafts(){
  const a = state.admin;
  const keys = Object.keys(a.stockDraft).filter(k=>{
    const [c,w] = k.split('|');
    return Number(a.stockDraft[k]) !== Number(stockFor(c, Number(w))||0);
  });
  if(!keys.length){ toast('مفيش تعديلات'); return; }
  busy(true,'جارٍ حفظ الأرصدة…');
  let done=0;
  const kept = {}, failedNames = [];
  for(const k of keys){
    const [code, w] = k.split('|');
    a.stockBusy = k;
    let ok = false;
    try{
      const d = await jsonp(APPS_SCRIPT_URL
        + '?action=setStock' + admParams_()
        + '&code=' + encodeURIComponent(code)
        + '&size=' + encodeURIComponent(w)
        + '&qty='  + encodeURIComponent(Math.max(0, Math.round(Number(a.stockDraft[k])||0))));
      ok = !!(d && d.ok);
    }catch(err){ ok = false; }
    if(ok) done++;
    else {
      // ⚠️ قبل كده كنا بنمسح المسوّدات كلها في الآخر، فالرقم اللي المصنع كتبه
      // وفشل حفظه كان بيختفي من الشاشة من غير ما حد يعرف أنهي صنف. بنسيبه
      // مكتوب عشان يشوفه ويحاول تاني.
      kept[k] = a.stockDraft[k];
      failedNames.push(code + ' / ' + w + ' سم');
    }
  }
  a.stockBusy = null;
  a.stockDraft = kept;
  await loadStock(true);          // نرجّع الأرصدة من السيرفر عشان الشاشة تطابقه
  busy(false);
  toast(failedNames.length
    ? ('اتحفظ '+done+' — فشل: '+failedNames.join('، ')+' (الأرقام لسه مكتوبة، جرّب تاني)')
    : ('اتحفظت '+done+' أرصدة'), failedNames.length ? 5200 : undefined);
}

// ومصر UTC+2/+3 — فأي شغل بعد نص الليل كان بيتسجّل بتاريخ اليوم اللي فات.
function isoLocal_(ts){
  const d = (ts===undefined||ts===null) ? new Date() : new Date(ts);
  if(isNaN(d.getTime())) return '';
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}

   المشاكل اللي كانت موجودة واتصلّحت هنا:
   ١) كل ضغطة زرار (+/-، اختيار مقاس، شيك بوكس) كانت بتعيد بناء الشاشة كلها فورًا،
      ولو الكود نده render() أكتر من مرة في نفس اللحظة كانت بتتنفّذ كلها — شغل مكرر ملهوش لازمة.
      دلوقتي النداءات بتتجمّع وتتنفّذ مرة واحدة في أقرب إطار رسم (requestAnimationFrame).
   ٢) الكتابة في خانات الحلق/البرور كانت بتنده render() فالخانة بتتمسح من الصفحة،
      فالفوكس والكيبورد بيقفلوا بعد كل حرف. دلوقتي بنحفظ الخانة اللي فيها الفوكس
      ومكان المؤشر جواها وبنرجّعهم بعد الرسم.
   ٣) مكان التمرير (scroll) كان بيتهزّ لما يتغيّر طول الصفحة. بنثبّته دلوقتي.
   ------------------------------------------------------------ */

// بصمة تعرّف الخانة اللي فيها الفوكس عشان نلاقيها تاني بعد إعادة الرسم
function focusKey_(el){
  if(!el || !el.dataset || !el.dataset.act) return null;
  const d = el.dataset;
  const q = v => String(v).replace(/\\/g,'\\\\').replace(/"/g,'\\"');
  return ['act','k','w','i','id','idx','code','group','key','tier']
    .filter(n => d[n] != null)
    .map(n => '[data-'+n+'="'+q(d[n])+'"]')
    .join('');
}

function captureFocus_(){
  const el = document.activeElement;
  if(!el || !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return null;
  const sel = focusKey_(el);
  if(!sel) return null;
  let start=null, end=null;
  try{ start=el.selectionStart; end=el.selectionEnd; }catch(e){}
  return { sel, start, end };
}

function restoreFocus_(snap){
  if(!snap) return;
  const el = document.querySelector(snap.sel);
  if(!el || el===document.activeElement) return;
  try{
    el.focus({preventScroll:true});
    if(snap.start!=null && el.setSelectionRange) el.setSelectionRange(snap.start, snap.end);
  }catch(e){}
}

      +`<button class="miniChip ${sel===0?'on':''}" data-act="${act}"${wAttr} data-cm="0">بدون</button>`;
  };
  const dbrorMiniChips=(sel,w)=>{
    const act = w==='custom' ? 'cust-dbror' : 'size-dbror';
    const wAttr = w==='custom' ? '' : ` data-w="${w}"`;
    return BRORS.map(b=>`<button class="miniChip ${sel===b.size?'on':''}" data-act="${act}"${wAttr} data-size="${esc(b.size)}">${esc(b.size)}</button>`).join('')
      +`<button class="miniChip ${sel===''?'on':''}" data-act="${act}"${wAttr} data-size="">بدون</button>`;
  };
  const hafrMiniChips=(sel,w)=>{
    const act = w==='custom' ? 'cust-hafr' : 'size-hafr';
    const wAttr = w==='custom' ? '' : ` data-w="${w}"`;
    return `<button class="miniChip ${!sel?'on':''}" data-act="${act}"${wAttr} data-v="0">عادي</button>`
      +`<button class="miniChip ${sel?'on':''}" data-act="${act}"${wAttr} data-v="1">حفر${pricesVisible()?` (+${HAFR_EXTRA}ج)`:''}</button>`;
  };

  // تدعيم الخشب: اختيار صريح على الباب، وبيتحوّل لبند مستقل بسعره تحت الصنف
  const woodMiniChips=(sel,w)=>{
    const act = w==='custom' ? 'cust-wood' : 'size-wood';
    const wAttr = w==='custom' ? '' : ` data-w="${w}"`;
    return `<button class="miniChip ${!sel?'on':''}" data-act="${act}"${wAttr} data-v="0">بدون</button>`
      +`<button class="miniChip ${sel?'on':''}" data-act="${act}"${wAttr} data-v="1">تدعيم خشب${pricesVisible()?` (+${WOOD_EXTRA}ج)`:''}</button>`;
  };

  // الطباعة: اختيار صريح على الباب زي التدعيم، وبيتحوّل لبند مستقل بسعره تحت الصنف
  const printMiniChips=(sel,w)=>{
    const act = w==='custom' ? 'cust-print' : 'size-print';
    const wAttr = w==='custom' ? '' : ` data-w="${w}"`;
    return `<button class="miniChip ${!sel?'on':''}" data-act="${act}"${wAttr} data-v="0">بدون</button>`
      +`<button class="miniChip ${sel?'on':''}" data-act="${act}"${wAttr} data-v="1">طباعة${pricesVisible()?` (+${PRINT_EXTRA}ج)`:''}</button>`;
  };

  // خانة منسدلة صغيرة — بتتفتح بالضغط بس
  const dd = (key, title, summary, inner) => {
    const open = uiOpen_(key,false);
    return `<div class="dd ${open?'open':''}">
      <button class="ddH" data-act="ui-toggle" data-k="${key}"><span class="t">${title}</span><span class="sm">${summary?esc(summary):''}</span>${ico("chev")}</button>
      ${open?`<div class="ddB">${inner}</div>`:''}</div>`;
  };
  // الخطوات: الكمية ← الحلق ← (ارتفاع الحلق + البرور بعد ما الحلق يتحدد) ← خيارات إضافية منسدلة
  const stepsFor = (e, w) => {
    const isC = w==='custom';
    const A = (n)=> isC ? 'cust-'+n : 'size-'+n;
    const wA = isC ? '' : ` data-w="${w}"`;
    const bits = [];
    if(e.hafr) bits.push('حفر'); if(e.wood) bits.push('تدعيم'); if(e.print) bits.push('طباعة'); 
    const extras = dd('ex'+w, 'خيارات إضافية', bits.join('، ') || 'حفر · تدعيم · طباعة',
      `<div class="exCols">
         <div class="exCol"><div class="miniLbl">النوع</div><div class="miniChips">${hafrMiniChips(e.hafr,w)}</div></div>
         <div class="exCol"><div class="miniLbl">التدعيم</div><div class="miniChips">${woodMiniChips(e.wood,w)}</div></div>
         <div class="exCol"><div class="miniLbl">الطباعة</div><div class="miniChips">${printMiniChips(e.print,w)}</div></div>
       </div>`);
    const frameStep = `<div class="miniLbl">١) الحلق</div><div class="miniChips">${frameMiniChips(e.frame,w)}</div>`;
    const afterFrame = e.frame==null
      ? `<div class="stepHint">اختار الحلق (أو «بدون») عشان يظهر البرور</div>`
      : `${e.frame?`<label class="fld sm"><span>ارتفاع الحلق (سم) — اختياري</span>
          <input type="text" inputmode="decimal" class="hgtIn" value="${esc(e.frameHeight||'')}" placeholder="سيبها فاضية لو عادي" data-act="${A('frame-height')}"${wA}></label>`:''}
        <div class="miniLbl">٢) البرور</div><div class="miniChips">${dbrorMiniChips(e.dbror,w)}</div>`;
    return frameStep + afterFrame + extras + printUploadHTML_(e,w,'print') + printUploadHTML_(e,w,'engrave');
  };

  const sizeCards = selWidths.map(w=>{
    const e=p.sizes[w];
    const st = stockFor(p.code, w);
    const stockLine = st===null ? '' : (st<=0
      ? `<div class="stockbar out">${ico("factory")}<span>بيتصنّع حسب الطلب — المصنع هيتواصل معاك بالميعاد.</span></div>`
      : `<div class="stockbar ${st>=e.qty?'ok':'part'}">${ico(st>=e.qty?"checkC":"warn")}
          <span>${st>=e.qty
            ? `متوفر بالمخزن (${st} باب) — <b>${READY_HOURS_TXT}</b>`
            : `المتوفر دلوقتي <b>${st}</b> بس من الكمية اللي طلبتها — الباقي بيتصنّع حسب الطلب.`}</span></div>`);
    return `<div class="sizeCard">
      <div class="scHead"><b>${w} سم</b>
        <div class="qty sm"><span class="qIc" aria-hidden="true">${ico('qty')}</span>
          <span class="flow-qty282 qty285" dir="ltr"><button type="button" data-q285="1" aria-label="زيادة الكمية">+</button><input type="number" inputmode="numeric" min="1" value="${e.qty}" placeholder="الكمية" class="qtyEmpty" data-act="size-qty-set" data-w="${w}"><button type="button" data-q285="-1" aria-label="تقليل الكمية">−</button></span>
        </div>
      </div>
      ${stockLine}
      ${stepsFor(e,w)}
    </div>`;
  }).join('');

  const customCard = p.customOn ? `<div class="sizeCard">
      <div class="scHead"><b>مقاس خاص</b></div>
      <div class="row2">
        <label class="fld"><span>العرض (سم)</span><input type="text" inputmode="decimal" value="${esc(p.custom.w)}" placeholder="مثال 85" data-act="cust" data-k="w"></label>
        <label class="fld"><span>الارتفاع (سم)</span><input type="text" inputmode="decimal" value="${esc(p.custom.h)}" placeholder="مثال 215" data-act="cust" data-k="h"></label>
      </div>
      <div class="grp" style="margin-top:6px">الكمية</div>
      <div class="qty"><span class="qIc" aria-hidden="true">${ico('qty')}</span>
        <span class="flow-qty282 qty285" dir="ltr"><button type="button" data-q285="1" aria-label="زيادة الكمية">+</button><input type="number" inputmode="numeric" min="1" value="${p.custom.qty}" placeholder="الكمية" class="qtyEmpty" data-act="cust-qty-set"><button type="button" data-q285="-1" aria-label="تقليل الكمية">−</button></span>
      </div>
      <div class="note">سعر الباب زي المقاس العادي، و<b>«${CUT_SERVICE_NOTE_}»</b> بتتحط بند مستقل تحته بالكمية والسعر (${CUSTOM_EXTRA} ج للباب).</div>
      ${customReady_(p) ? stepsFor(p.custom,'custom') : `<div class="stepHint">اكتب العرض والارتفاع عشان تظهر باقي الاختيارات</div>`}
    </div>` : '';

  const frKind=state.fr.kind==='rods'?'rods':'full';
  const frUnit=lenUnit_(state.fr.unit).lbl;
  const frQty=rodQty_(state.fr.qty);
  const frNonStd=!!state.fr.nonStd;
  const frJamb=frKind==='full' ? frQty*2 : Math.max(0,Number(state.fr.jamb)||0);
  const frHeader=frKind==='full' ? frQty*1 : Math.max(0,Number(state.fr.header)||0);
  const frJambCm=Math.max(1,frCm_(state.fr.jambCm)||220);
  const frHeaderCm=Math.max(1,frCm_(state.fr.headerCm)||110);
  const frExtra=(state.fr.extra||[]).map(x=>({cm:Math.max(0,frCm_(x.cm)), qty:rodQty_(x.qty)}));
  const frExtraRods=frExtra.reduce((s,x)=>s+(x.cm>0?x.qty:0),0);
  const frRodsQty=rodQty_(state.fr.rods);
  const frRodsCm=Math.max(0,frCm_(state.fr.rodsCm));
  const frRods=frKind==='full' ? (frJamb+frHeader+frExtraRods) : frRodsQty;
  const frSel=FRAMES.find(f=>f.cm===state.fr.cm)||FRAMES[0];
  // برور مع الحلق الكامل (اختياري) — الباب بياخد ٥ عيدان، فهنا نفس الفكرة: عدد لكل طقم × عدد الأطقم
  const frBrOn = frKind==='full' && !!state.fr.brSize;
  const frBrPerSet = rodQty_(state.fr.brQty);
  const frBrLenCm = (state.fr.brLen===''||state.fr.brLen==null) ? BROR_ROD_CM : Math.max(1, frCm_(state.fr.brLen)||BROR_ROD_CM);
  const frBrTotal = frBrOn ? Math.round(frBrPerSet*frQty*100)/100 : 0;
  const frBrTxt = frBrTotal>0 ? ' + '+frBrTotal+' برور '+state.fr.brSize+(frBrLenCm!==BROR_ROD_CM?' ('+frBrLenCm+' سم)':'') : '';
  // سعر كل مقاس على حدة حسب طوله الفعلي
  const frJambPrice=rodPrice(frSel.price,frJambCm), frHeaderPrice=rodPrice(frSel.price,frHeaderCm);
  const frChips=FRAMES.map(f=>`
    <button class="chip ${state.fr.cm===f.cm?'on':''}" data-act="fr-cm" data-cm="${f.cm}">${f.cm} سم</button>`).join('');
  // كود/لون الباب للحلق المنفصل — إجباري زي باقي الاختيارات
  const frCodeChips=DOORS.map(d=>`
    <button class="chip ${state.fr.code===d.code?'on':''}" data-act="fr-code" data-code="${d.code}"${doorChipStyle_(d.code,state.fr.code===d.code)}>${d.code} — ${esc(d.name)}</button>`).join('');
  // مقاس الباب اللي الحلق ده مخصوص له (70/80/90/100) — اختياري، بس بيوضح للمصنع
  const frDoorWChips=SIZES.map(s=>`
    <button class="chip ${String(state.fr.doorW)===String(s.w)?'on':''}" data-act="fr-doorw" data-w="${s.w}">${s.w} سم</button>`).join('')
    +`<button class="chip ${!state.fr.doorW?'on':''}" data-act="fr-doorw" data-w="">مش محدد</button>`;

  const brRods=rodQty_(state.br.rods);
  const brUnit=lenUnit_(state.br.unit).lbl;
  const brSel=BRORS.find(b=>b.size===state.br.size)||BRORS[0];
  const brChips=BRORS.map(b=>`
    <button class="chip ${state.br.size===b.size?'on':''}" data-act="br-size" data-size="${esc(b.size)}">برور ${esc(b.size)}</button>`).join('');
  // كود/لون الباب للبرور المنفصل — إجباري زي الحلق بالظبط
  const brCodeChips=DOORS.map(d=>`
    <button class="chip ${state.br.code===d.code?'on':''}" data-act="br-code" data-code="${d.code}"${doorChipStyle_(d.code,state.br.code===d.code)}>${d.code} — ${esc(d.name)}</button>`).join('');
  // طول العود المطلوب بالمتر — افتراضيًا الطول القياسي، وقابل للتعديل لو حد طلب مقاس تكملة (زي ٣م)
  const brRodCm=brRodCm_(state.br.len===''||state.br.len==null ? BROR_ROD_M_DEFAULT : state.br.len, state.br.unit);
  const brLinePrice=rodPrice(brSel.price, brRodCm);

  const pdQty=wholeQuantity_(state.pd.qty);
  // كود/لون الباب للوح البروديوم — إجباري زي البرور بالظبط
  const pdCodeChips=DOORS.map(d=>`
    <button class="chip ${state.pd.code===d.code?'on':''}" data-act="pd-code" data-code="${d.code}"${doorChipStyle_(d.code,state.pd.code===d.code)}>${d.code} — ${esc(d.name)}</button>`).join('');

  const accCards=ACCESSORIES.map(a=>{
    const q=state.acc[a.id]||'';
    return `<div class="ac">
      ${a.img?`<img class="ac-img" src="${a.img}" alt="${esc(a.name)}">`:''}
      <b>${esc(a.name)}</b>${pricesVisible()?`<div class="pr">${money(a.price)} ج/${esc(a.unit)}</div>`:''}
      <div class="qty"><span class="qIc" aria-hidden="true">${ico('qty')}</span>
        <span class="flow-qty282 qty285" dir="ltr"><button type="button" data-q285="1" aria-label="زيادة الكمية">+</button><input type="number" inputmode="decimal" min="0" step="any" value="${q}" placeholder="الكمية" data-act="acc-set" data-id="${a.id}"><button type="button" data-q285="-1" aria-label="تقليل الكمية">−</button></span>
      </div></div>`;}).join('');
  const accTotal=ACCESSORIES.reduce((s,a)=>s+(state.acc[a.id]||0)*a.price,0);

  // ── لوحة تفاصيل الباب — بتتحط تحت الصف اللي فيه الباب المختار ──
  // مفيش حاجة متحددة افتراضيًا: الموزع لازم يختار كل مقاس وحلقه وبروره بنفسه
  const readyToAdd = doorReady_(p);

  const detailPanel = p.code ? `
    <div class="doorpanel">
      <div class="dphead"><b>${esc(p.code)}</b><span>${esc(doorByCode(p.code).name)}</span></div>

      <div class="specol sizeToggleRow">${sizeToggleRow}</div>
      <div class="note">تقدر تختار أكتر من مقاس — ولكل مقاس ارتفاعه وحلقه وبروره الخاصين بيه، منفصلين عن باقي المقاسات.</div>

      ${sizeCards}
      ${customCard}

      ${(selWidths.length>0 || p.customOn) ? `      <label class="fld">
        <span>ملاحظات على الباب (اختياري)</span>
        <textarea rows="2" placeholder="مثال: الباب حفر جانبي حفر وردة — أو: الطول لأربع أبواب" data-act="pick-note">${esc(p.note||'')}</textarea>
      </label>

      <div class="note" id="sumline">${esc(currentSummary())}</div>
      <button class="btn primary" style="margin-top:12px" data-act="add-door" ${readyToAdd?'':'disabled'}>
        ${readyToAdd?'أضف الأبواب للسلة':'اكتب الكمية وحدد الحلق والبرور لكل مقاس'}</button>
      ` : ''}
    </div>` : '';

  // ── شبكة الأبواب مقسّمة صفوف من ٤، واللوحة بتتحط تحت الصف اللي فيه المختار ──
  // لما يختار باب، بنعرض الباب ده لوحده + لوحة التفاصيل — باقي الأكواد بتختفي
  // عشان ميحصلش لخبطة، وبترجع تظهر تاني أول ما يضيف للسلة أو يلغي الاختيار.
  const doorCard = d => `
      <button class="door ${p.code===d.code?'on':''}" data-act="pick-door" data-code="${d.code}">
        <div class="leaf" data-code="${esc(d.code)}">
          <img src="${d.img}" alt="" loading="lazy" onerror="this.closest('.leaf').classList.add('noimg');this.remove();">
          <span class="zoombadge" data-act="door-preview" data-code="${esc(d.code)}">${ico("search")}</span>
        </div>
        <span class="code">${esc(d.code)}</span><span class="nm">${esc(d.name)}</span>
        ${stockTotalFor(d.code)>0?`<span class="rdy">${ico("checkC")} متوفر</span>`:''}
      </button>`;

  let doorsGrid='';
  if(p.code){
    const sel = DOORS.find(d=>d.code===doorCode_(p.code));
    doorsGrid = `<div class="focusrow">${doorCard(sel)}
        <button class="btn ghost sm changedoor" data-act="pick-door" data-code="${esc(p.code)}">${ico("back")} غيّر الباب</button>
      </div>${detailPanel}`;
  } else {
    doorsGrid = DOORS.map(doorCard).join('');
  }


  const secDoors = `
  <section class="card">
    <div class="step"><span class="n">${ico("door","lg")}</span><h2>اختر الباب</h2><span class="hint">١١ لون</span></div>
    <div class="rail" style="${p.code?'display:block':'display:grid;grid-template-columns:repeat(4,1fr);gap:12px 9px'}">${doorsGrid}</div>
  </section>`;

  const secAcc = `
  <section class="card">
    <div class="step"><span class="n">${ico("parts","lg")}</span><h2>إكسسوارات الأبواب</h2><span class="hint">اختياري</span></div>
    <div class="accgrid">${accCards}</div>
    <div data-sumlabel="add-acc" style="margin:9px 2px 0;font-size:13px;font-weight:700;color:#5A6B7C;text-align:center">${accTotal?'أضف الإكسسوارات':'اختر الكميات أولاً'}</div>
<button class="btn brand" style="margin-top:12px;width:100%;font-size:16px;padding:13px" data-act="add-acc" ${accTotal?'':'disabled'}>التالي</button>
  </section>`;

  const frExtraRows = frExtra.map((x,idx)=>`
    <div class="rodbox">
      <div class="rl">عود إضافي<small>ارتفاع مخصوص</small></div>
      <div class="row2" style="gap:6px">
        <input type="text" inputmode="decimal" placeholder="${lenUnit_(state.fr.unit).lbl}" value="${esc(state.fr.extra[idx].cm)}" data-act="fr-extra-cm" data-i="${idx}">
        <span class="flow-qty282 qty285" dir="ltr"><button type="button" data-q285="1" aria-label="زيادة الكمية">+</button><input type="text" inputmode="decimal" placeholder="عدد" value="${esc(state.fr.extra[idx].qty)}" data-act="fr-extra-qty" data-i="${idx}"><button type="button" data-q285="-1" aria-label="تقليل الكمية">−</button></span>
      </div>
      ${x.cm>0&&pricesVisible()?`<div class="rp">${money(rodPrice(frSel.price,x.cm))} ج/عود</div>`:''}
      <button class="btn ghost sm" style="margin-top:6px;padding:4px 10px" data-act="fr-extra-del" data-i="${idx}">${ico("x")} حذف</button>
    </div>`).join('');

  const secFrame = `
  <section class="card">
    <div class="step"><span class="n">${ico("frame","lg")}</span><h2>حلق فقط</h2><span class="hint">ارتفاع الأعواد قابل للتعديل</span></div>
    
    <div class="sol-h" style="margin-bottom:6px">المقاس</div>
    <div class="chips">${frChips}</div>
    <div class="sol-h" style="margin:12px 0 6px">اللون (كود الباب) <b class="req">*</b></div>
    ${colorPick357_('fr',state.fr.code,'fr-code')}
    <details class="dd357"><summary>لباب مقاس: ${state.fr.doorW?state.fr.doorW+' سم':'غير محدد'}</summary><div class="chips">${frDoorWChips}</div></details>
    
    <div class="sol-h" style="margin:12px 0 6px">نوع الحلق</div>
    <div class="miniChips">
      <button class="miniChip iconChip ${frKind==='full'?'on':''}" data-act="fr-kind" data-k="full">${ico('door')}<span>حلق كامل</span></button>
      <button class="miniChip iconChip ${frKind==='rods'?'on':''}" data-act="fr-kind" data-k="rods">${ico('ruler')}<span>أعواد</span></button>
    </div>
    ${frKind==='full' ? `
    <div class="sol-h" style="margin:12px 0 6px">الكمية (طقم)</div><div class="auto357">الطقم: عودين ${+(((frJambCm===220?215:frJambCm))/100).toFixed(3)} م + عود ${+(frHeaderCm/100).toFixed(3)} م (= ${frJambCm===220&&frHeaderCm===110?"٢.٥":"—"} عود)</div>
    <div style="max-width:260px">
      <span class="flow-qty282 qty285" dir="ltr"><button type="button" data-q285="1" aria-label="زيادة الكمية">+</button><input type="text" inputmode="decimal" placeholder="العدد" value="${esc(state.fr.qty)}" data-act="fr-qty"><button type="button" data-q285="-1" aria-label="تقليل الكمية">−</button></span>
    </div>
    <div class="sol-h" style="margin:12px 0 6px">برور مع الحلق <span style="font-weight:400;color:var(--muted)">(اختياري — مقاس البرور)</span></div>
    <div class="chips">
      <button class="chip ${!state.fr.brSize?'on':''}" data-act="fr-brsize" data-s="">بدون برور</button>
      ${BRORS.map(b=>`<button class="chip ${state.fr.brSize===b.size?'on':''}" data-act="fr-brsize" data-s="${esc(b.size)}">${esc(b.size)}</button>`).join('')}
    </div>
    ${frBrOn?`
    <label class="fld" style="margin-top:9px;max-width:220px"><span>عدد البرور لكل طقم</span>
      <span class="flow-qty282 qty285" dir="ltr"><button type="button" data-q285="1" aria-label="زيادة الكمية">+</button><input type="text" inputmode="decimal" placeholder="اكتب العدد" value="${esc(state.fr.brQty)}" data-act="fr-brqty"><button type="button" data-q285="-1" aria-label="تقليل الكمية">−</button></span></label>
    <label class="fld" style="margin-top:9px;max-width:220px"><span>طول عود البرور (${frUnit})</span>
      <input type="text" inputmode="decimal" placeholder="${lenFromCm_(BROR_ROD_CM, state.fr.unit)}" value="${esc(state.fr.brLen)}" data-act="fr-brlen"></label>
    <div class="auto357">${frBrTotal||0} عود برور ${esc(state.fr.brSize)} — طول العود ${+(frBrLenCm/100).toFixed(3)} م</div>`:''}
    ${pricesVisible()&&frQty>0?`<div class="rp" style="margin-top:6px">${money(frJambPrice)} ج/عود ٢٢٠سم — ${money(frHeaderPrice)} ج/عود ١١٠سم</div>`:''}
    <button class="btn ghost sm" style="margin-top:9px" data-act="fr-nonstd-toggle">${frNonStd?'إخفاء الارتفاع المخصوص':'الارتفاع مش استاندر؟'}</button>

function showOrdNote_(){
  const old = document.getElementById('ordNoteOverlay'); if(old) old.remove();

  ov.innerHTML = `<div class="box"><h3>${ico('warn')} ملاحظات عامة على الأوردر</h3>

  document.body.appendChild(ov);
  const close=()=>{ ov.remove(); render(); };

  ov.addEventListener('click',e=>{ if(e.target===ov) close(); });

}

function currentSummary(){
  const p=state.pick;
  if(!p.code) return '';
  const d=doorByCode(p.code);
  const widths = Object.keys(p.sizes).map(Number).sort((a,b)=>a-b);
  const customReady = customReady_(p);

  if(!widths.length && !p.customOn) return 'اختر مقاس واحد على الأقل.';
  for(const w of widths){ if(!(Number(p.sizes[w].qty)>0)) return `اكتب الكمية لمقاس ${w} سم.`; }
  if(p.customOn && !customReady) return 'اكتب العرض والارتفاع والكمية لمقاس خاص.';
  for(const w of widths){
    const e=p.sizes[w];
    if(e.frame==null) return `اختر الحلق (أو «بدون حلق») لمقاس ${w} سم.`;
    if(e.dbror==null) return `اختر البرور (أو «بدون برور») لمقاس ${w} سم.`;
  }
  if(customReady && (p.custom.frame==null || p.custom.dbror==null)) return 'اختر الحلق والبرور لمقاس خاص.';

  const parts=[]; let totalQty=0, totalPrice=0;
  widths.forEach(w=>{
    const e=p.sizes[w];
    const qty=wholeQuantity_(e.qty); totalQty+=qty;
    const unit=priceForWidth(w,e.hafr); totalPrice+=unit*qty;
    // ارتفاع غير الاستاندر = خدمة قص، والتدعيم اختيار — الاتنين بنود بتتحسب
    if(Number(e.height)) totalPrice+=CUSTOM_EXTRA*qty;
    if(e.wood) totalPrice+=WOOD_EXTRA*qty;
    if(e.print) totalPrice+=PRINT_EXTRA*qty;
    let line=doorSizeText_(w+' سم',e.height)+' × '+qty;
    const bits=[];
    if(Number(e.height)) bits.push(CUT_SERVICE_NOTE_);
    if(e.wood) bits.push('تدعيم خشب');
    if(e.print) bits.push('طباعة');
    if(e.hafr) bits.push('حفر');
    if(e.frame) bits.push('حلق '+frameText_(e.frame,e.frameHeight));
    if(e.dbror) bits.push('برور '+e.dbror);
    if(bits.length) line+=' ('+bits.join('، ')+')';
    parts.push(line);
  });
  if(customReady){
    const w=Number(p.custom.w), h=Number(p.custom.h), qty=wholeQuantity_(p.custom.qty);
    // خدمة القص بند مستقل — بتتحسب في الإجمالي زي أي صنف
    totalQty+=qty; totalPrice+=(priceForWidth(w,p.custom.hafr)*qty)+(CUSTOM_EXTRA*qty)
                              +(p.custom.wood?WOOD_EXTRA*qty:0)
                              +(p.custom.print?PRINT_EXTRA*qty:0);
    let line=w+'×'+h+' سم (مقاس خاص) × '+qty;
    const bits=[CUT_SERVICE_NOTE_];
    if(p.custom.wood) bits.push('تدعيم خشب');
    if(p.custom.print) bits.push('طباعة');
    if(p.custom.hafr) bits.push('حفر');
    if(p.custom.frame) bits.push('حلق '+frameText_(p.custom.frame,p.custom.frameHeight));
    if(p.custom.dbror) bits.push('برور '+p.custom.dbror);
    if(bits.length) line+=' ('+bits.join('، ')+')';
    parts.push(line);
  }

  let t='باب '+d.code+' '+d.name+' — '+parts.join('، ')+' — إجمالي '+totalQty;
  if(pricesVisible()) t+=' = '+money(totalPrice)+' ج';
  t+=' (الحلق والبرور شامل مع الباب)';
  return t;
}
