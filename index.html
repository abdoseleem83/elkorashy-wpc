/* ===== تنسيق الإكسل =====
   الشيت بيطلع زي التقرير: رأس ملوّن، برواز، صفوف مخططة، صف إجمالي مميّز،
   وفلتر جاهز على العناوين. sign[] بتحدد أعمدة الخصم (أحمر) والزيادة (أخضر). */
const XS_NAVY = '16307A', XS_LINE = 'C4CBE0', XS_BAND = 'EEF1F9', XS_TOT = 'D9E1F5';
const xsBorder = (c)=> ({style:'thin', color:{rgb: c || XS_LINE}});
const xsAll = (c)=> ({top:xsBorder(c), bottom:xsBorder(c), left:xsBorder(c), right:xsBorder(c)});
const XS_RED = 'C0202F', XS_GREEN = '0A7D3C';
function styleSheet(ws, o){
  o = o || {};
  const sign = o.sign || [];             // '' | 'minus' | 'plus' لكل عمود
  const headRow = o.headRow || 0;        // صف العناوين (0-based داخل الشيت)
  const titleRows = o.titleRows || 0;    // عدد سطور رأس التقرير فوقه
  const totalRe = /^(الإجمالي|الاجمالي|إجمالي|اجمالي|صافي|مجمل)/;
  if(!ws['!ref']) return ws;
  const R = XLSX.utils.decode_range(ws['!ref']);
  const at = (r, c)=> ws[XLSX.utils.encode_cell({r, c})];
  for(let r = R.s.r; r <= R.e.r; r++){
    // اسم الصف (أول خانة فيها كلام) عشان نعرف الإجماليات
    let label = '';
    for(let c = R.s.c; c <= R.e.c && !label; c++){
      const v = at(r, c); if(v && v.t === 's') label = String(v.v || '').trim();
    }
    const isTitle = r < titleRows;
    const isHead  = r === headRow;
    const isTot   = !isTitle && !isHead && totalRe.test(label);
    for(let c = R.s.c; c <= R.e.c; c++){
      const k = XLSX.utils.encode_cell({r, c});
      if(!ws[k]) ws[k] = {t:'s', v:''};
      const cell = ws[k];
      if(isTitle){
        cell.s = {font:{bold: r === 0, sz: r === 0 ? 15 : 11, color:{rgb: r === 0 ? '16307A' : '555555'}},
                  alignment:{horizontal:'center', vertical:'center'}};
      } else if(isHead){
        cell.s = {font:{bold:true, sz:11, color:{rgb:'FFFFFF'}},
                  fill:{fgColor:{rgb: XS_NAVY}},
                  alignment:{horizontal:'center', vertical:'center', wrapText:true},
                  border: xsAll('0E205C')};
      } else {
        const numeric = cell.t === 'n';
        // الخصم أحمر والإضافة خضرا — زي الشاشة والـPDF.
        // 'auto' = اللون من إشارة الرقم نفسه (عمود «الفرق» في الجرد)
        // أو من نص الخانة (عمود «النوع»: عجز/زيادة).
        let sg = sign[c - R.s.c];
        if(sg === 'auto'){
          if(numeric) sg = cell.v < 0 ? 'minus' : (cell.v > 0 ? 'plus' : '');
          else { const t=String(cell.v || '');
                 sg = (/^-/.test(t) || /عجز/.test(t)) ? 'minus'
                    : ((/^\+/.test(t) || /زياد/.test(t)) ? 'plus' : ''); }
        }
        // صف الإجمالي في الإكسل خلفيته فاتحة (D9E1F5) فالأحمر والأخضر
        // الغامقين بيتقروا عليه عادي
        const paint = sg && (numeric ? cell.v !== 0 : !!String(cell.v || ''));
        /* colFill[] بتدي لكل عمود لونه الخاص (زي كشف الإرسال: الراتب
           والصافي أخضر فاتح، وخانات الإدخال كريمي) بدل التخطيط العادي */
        const cf = (o.colFill || [])[c - R.s.c];
        /* أعلى رقم في العمود خلفية خضرا وأقل رقم خلفية حمرا — زي الشاشة */
        const hl = (o.hiLo || {})[c - R.s.c];
        let hlFill = '';
        if(hl && numeric && cell.v !== 0 && !isTot)
          hlFill = cell.v === hl.mx ? 'D6F5DF' : (cell.v === hl.mn ? 'FDE0E3' : '');
        cell.s = {font:{bold: isTot || !!paint, sz:10.5,
                        color: paint ? {rgb: sg === 'minus' ? XS_RED : XS_GREEN} : undefined},
                  fill:{fgColor:{rgb: isTot ? XS_TOT : (hlFill || cf || (o.plain ? 'FFFFFF' : ((r - headRow) % 2 === 0 ? XS_BAND : 'FFFFFF')))}},
                  alignment:{horizontal: numeric ? 'center' : 'right', vertical:'center'},
                  border: xsAll()};
      }
    }
  }
  // فلتر على صف العناوين — بيخلّي الشيت جدول تقدر ترتّبه وتفلتره.
  // (تثبيت الصف مش مدعوم في المكتبة دي، فمش بنكتبه.)
  ws['!autofilter'] = {ref: XLSX.utils.encode_range(
    {s:{r:headRow, c:R.s.c}, e:{r:R.e.r, c:R.e.c}})};
  const rows = [];
  for(let r = R.s.r; r <= R.e.r; r++) rows.push({hpt: r < titleRows ? (r === 0 ? 24 : 17) : (r === headRow ? 30 : 17)});
  ws['!rows'] = rows;
  return ws;
}
/* رأس التقرير جوه الإكسل: سطر اسم الشركة وسطر عنوان التقرير والتاريخ،
   وبعدين العناوين. نفس شكل الـPDF. */
/* عرض العمود بيتحسب من أطول محتوى فيه (والعرض المطلوب حد أدنى)،
   عشان مفيش خانة تطلع #### ولا اسم يتقص في أي ملف إكسل. */
function xlsxColWidths(aoa, widths, ncol){
  ncol = ncol || Math.max(1, ...aoa.map(r=> (r||[]).length));
  const out=[];
  for(let c=0;c<ncol;c++){
    let mx=0;
    aoa.forEach(r=>{ const v=(r||[])[c];
      if(v===undefined || v===null || v==='') return;
      const t = typeof v==='number' ? Math.round(v).toLocaleString('en-US') : String(v);
      String(t).split('\n').forEach(line=>{ if(line.length>mx) mx=line.length; });
    });
    const base = (widths && widths[c]) ? widths[c] : 12;
    out.push(Math.max(9, Math.min(48, Math.max(base, mx + 2))));
  }
  return out;
}
function saveAoaXlsx(aoa, sheetName, fileName, widths, opt){
  opt = opt || {};
  const ncol = Math.max(1, ...aoa.map(r=> (r||[]).length));
  const pad = (row)=>{ const r = (row||[]).slice(); while(r.length < ncol) r.push(''); return r; };
  const title = opt.title || sheetName;
  const head = [
    pad(['مجموعة القرشي']),
    pad([title + '  —  ' + new Date().toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'})]),
  ];
  const full = head.concat(aoa.map(pad));
  const ws = XLSX.utils.aoa_to_sheet(full);
  ws['!cols'] = xlsxColWidths(aoa, widths, ncol).map(w=>({wch:w}));
  // دمج سطري الرأس على عرض الجدول كله
  ws['!merges'] = [{s:{r:0,c:0}, e:{r:0,c:ncol-1}}, {s:{r:1,c:0}, e:{r:1,c:ncol-1}}];
  styleSheet(ws, {titleRows: 2, headRow: 2, sign: opt.sign || [], colFill: opt.colFill || [],
                  plain: !!opt.plain, hiLo: opt.hiLo || {}});
  /* أسهم الزيادة/النقص: الخانة تفضل رقم (تتجمع وتتفلتر) والسهم جاي من تنسيق الرقم */
  (opt.arrows||[]).forEach((row,bi)=>{ (row||[]).forEach((dir,c)=>{
    const cell = dir && ws[XLSX.utils.encode_cell({r: 3+bi, c})];
    if(!cell || cell.t!=='n') return;
    cell.z = (dir==='up'? '"▲ "' : '"▼ "') + '#,##0';
    cell.s = Object.assign({}, cell.s, {font: Object.assign({}, (cell.s||{}).font, {bold:true, color:{rgb: dir==='up'? XS_GREEN : XS_RED}})});
  }); });
  const wbk = XLSX.utils.book_new();
  wbk.Workbook = {Views:[{RTL:true}]};   // الشيت يفتح من اليمين لليسار
  XLSX.utils.book_append_sheet(wbk, ws, sheetName);
  XLSX.writeFile(wbk, fileName);
}

let employees=load('employees_v1',[]);
let payData=load('payData_v1',{});
let payMonth=load('_payMonth_', todayStr().slice(0,7));
let payHalf=load('_payHalf_',1);
let payKind=load('_payKind_','send');
const MONTHS_AR=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const PAY_FIELDS=[['abP','غياب بإذن (أيام)'],['abN','غياب بدون إذن (أيام)'],['late','تأخيرات (ساعات)'],['ot','إضافي (ساعات)'],['otD','إضافي (أيام)'],['mam','ماموريات (أيام)'],['pen','جزاءات (أيام)'],['adv','سلف (جنيه)'],['ins','تأمينات (جنيه)'],['bonus','حوافز (جنيه)']];
function payLabel(month,half){
  const p=String(month).split('-'); const mn=MONTHS_AR[(+p[1]||1)-1]+' '+p[0];
  return (half==='m'?'الشهر كامل':(half===2?'النصف الثاني (16 – 30)':'النصف الأول (1 – 15)'))+' — '+mn;
}
function empIn(emp,half){ return half===1? emp.h1!==false : emp.h2!==false; }
function calcPay(emp, half, e){
  e=e||{};
  const both=emp.h1!==false && emp.h2!==false, monthly=nz(emp.salary);
  const due=both? rnd0(monthly/2) : monthly;
  const day=both? rnd2(due/15) : rnd2(monthly/30);
  const hour=rnd2(day/9);
  const dAbP=rnd0(nz(e.abP)*day), dAbN=rnd0(nz(e.abN)*day), dLate=rnd0(nz(e.late)*hour), otAmt=rnd0(nz(e.ot)*hour*1.5)+rnd0(nz(e.otD)*day*2), mamAmt=rnd0(nz(e.mam)*day*2), dPen=rnd0(nz(e.pen)*day);
  const adv=nz(e.adv), ins=nz(e.ins), bonus=nz(e.bonus);
  const ded=dAbP+dAbN+dLate+dPen+adv+ins;
  const net=mr5(due-ded+otAmt+mamAmt+bonus);
  return {emp,half,monthly,due,day,hour,abP:nz(e.abP),abN:nz(e.abN),late:nz(e.late),ot:nz(e.ot),otD:nz(e.otD),mam:nz(e.mam),pen:nz(e.pen),dAbP,dAbN,dLate,otAmt,mamAmt,dPen,adv,ins,bonus,ded,net,note:e.note||''};
}
function payEntry(month,half,id){ return ((payData[month]||{})['h'+half]||{})[id]||{}; }
function payRows(month, half){
  if(half==='m'){
    const map={};
    [1,2].forEach(h=>employees.forEach(emp=>{
      if(!empIn(emp,h)) return;
      const r=calcPay(emp,h,payEntry(month,h,emp.id)), a=map[emp.id];
      if(!a) map[emp.id]=Object.assign({},r,{half:'m'});
      else ['due','abP','abN','late','ot','otD','mam','pen','dAbP','dAbN','dLate','otAmt','mamAmt','dPen','adv','ins','bonus','ded','net'].forEach(k=>{ a[k]+=r[k]; });
    }));
    return employees.filter(e=>map[e.id]).map(e=>map[e.id]);
  }
  return employees.filter(emp=>empIn(emp,half)).map(emp=>calcPay(emp,half,payEntry(month,half,emp.id)));
}
function payTotals(rows){
  const t={n:rows.length,monthly:0,due:0,dAb:0,dLate:0,otAmt:0,mamAmt:0,dPen:0,adv:0,ins:0,ded:0,bonus:0,net:0};
  rows.forEach(r=>{ t.monthly+=r.monthly; t.due+=r.due; t.dAb+=r.dAbP+r.dAbN; t.dLate+=r.dLate; t.otAmt+=r.otAmt; t.mamAmt+=r.mamAmt; t.dPen+=r.dPen; t.adv+=r.adv; t.ins+=r.ins; t.ded+=r.ded; t.bonus+=r.bonus; t.net+=r.net; });
  return t;
}

/* ── ميزان المراجعة: رفع من إكسل ── */
/* الحساب الأب = في حساب تاني كوده بيبدأ بكوده. الطرفي بس هو اللي
   بيتحسب، عشان الرصيد ما يتعدّش مرتين. */
function tbPrefixSet(list){
  const set={}; list.forEach(a=>{ const c=String(a.code||'');
    for(let i=1;i<c.length;i++) set[c.slice(0,i)]=1; });
  return set;
}
function tbLeaves(list){
  const pre=tbPrefixSet(list);
  return list.filter(a=>{ const c=String(a.code||''); return !c || !pre[c]; });
}
function tbDepth(code, codes){
  const c=String(code||''); let d=0;
  for(let i=1;i<c.length;i++) if(codes[c.slice(0,i)]) d++;
  return d;
}
function finPeriods(){ return moSort(Object.keys(trialBal)); }
function finCur(){ const p=load('_finPer_',null), ps=finPeriods(); return ps.indexOf(p)>=0? p : ps[ps.length-1]||null; }
function setFinPeriod(p){ save('_finPer_',p); render(true); }
function importTrialBalance(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      const has=t=>String(t||'').replace(/\s/g,'');
      let h=0;
      while(h<rows.length && !(rows[h]||[]).some(c=>/Account_Name|حساب|مدين|دائن|رصيد/i.test(has(c)))) h++;
      if(h>=rows.length){ toast('الملف مفيهوش أعمدة الحساب والمدين والدائن'); return; }
      const hdr=(rows[h]||[]).map(c=>String(c||'').trim());
      const find=re=> hdr.findIndex(c=> re.test(c.replace(/\s/g,'')));
      /* صيغة برنامج المحاسبة: Account_Code · Account_Name · c_d · c_c (أرصدة آخر المدة)
         وبرضه بنقبل أي ملف فيه أعمدة عربية: الحساب · مدين · دائن */
      const ci = find(/^Account_Code$/i) >=0 ? find(/^Account_Code$/i) : find(/^(كود|رقم)?الحساب$|^كود$|^رقم$/);
      const ni = find(/^Account_Name$/i) >=0 ? find(/^Account_Name$/i) : find(/اسم|بيان|الحساب/);
      let di = find(/^c_d$/i), cri = find(/^c_c$/i);
      if(di<0) di = find(/مدين/);
      if(cri<0) cri = find(/دائن/);
      if(ni<0 || (di<0 && cri<0)){ toast('مش لاقي عمود الاسم أو المدين/الدائن'); return; }
      const list=[];
      for(let i=h+1;i<rows.length;i++){
        const row=rows[i]; const nm=String(row[ni]||'').trim(); if(!nm) continue;
        const d=di>=0? nz(row[di]) : 0;
        const cr=cri>=0? nz(row[cri]) : 0;
        if(!d && !cr) continue;
        list.push({code: ci>=0? String(row[ci]||'').trim() : '', name:nm, debit:d, credit:cr});
      }

      if(!list.length){ toast('مفيش صفوف فيها أرقام'); return; }
      /* الحساب الأب رصيده مجموع اللي تحته، فلو جمعنا الكل الرقم
         بيتعدّ مرتين والميزان يبان مش متوازن. الطرفية بس. */
      const lf=tbLeaves(list);
      const td=lf.reduce((a,x)=>a+x.debit,0), tc=lf.reduce((a,x)=>a+x.credit,0);
      pendingImport={type:'tb', list};
      openSheet(`<h3>تأكيد ميزان المراجعة</h3>
        <p style="font-size:13px;line-height:1.8">${list.length} حساب (${lf.length} طرفي) —
          مدين ${fmtN(Math.round(td))} · دائن ${fmtN(Math.round(tc))}
          ${Math.abs(td-tc)>1? `<br><b style="color:var(--danger)">⚠️ الميزان مش متوازن — الفرق ${fmtN(Math.round(td-tc))}</b>`:'<br>✅ متوازن'}</p>
        <div class="f-row"><label>الفترة *</label>
          <div style="display:flex;gap:6px">
            <select id="tb_mo" style="flex:2">${AR_MONTHS.map((n,i)=>
              `<option value="${String(i+1).padStart(2,'0')}" ${i===new Date().getMonth()?'selected':''}>${n}</option>`).join('')}</select>
            <select id="tb_yr" style="flex:1">${(()=>{const y=new Date().getFullYear(); let o='';
              for(let v=y+1;v>=y-4;v--) o+=`<option ${v===y?'selected':''}>${v}</option>`; return o;})()}</select>
          </div></div>
        <div class="f-actions"><button class="btn-cancel" onclick="closeSheet()">إلغاء</button>
          <button class="btn-save" onclick="commitTrialBalance()">💾 حفظ</button></div>`);
    }catch(err){ console.error(err); toast('خطأ في الملف'); }
  };
  r.readAsArrayBuffer(file);
}

function trialBalModel(per){
  const list=(trialBal[per]||[]).slice().sort((a,b)=> String(a.code).localeCompare(String(b.code)));
  const pre=tbPrefixSet(list), codes={}; list.forEach(a=> codes[String(a.code)]=1);
  const body=[];
  list.forEach(r=>{
    const c=String(r.code||''), parent=!!pre[c];
    const ind='  '.repeat(tbDepth(c, codes));
    body.push({type: parent? 'sub':'row',
      cells:[ind+r.name, c||'—', Math.round(r.debit), Math.round(r.credit)]});
  });
  const lf=tbLeaves(list);
  const td=lf.reduce((a,x)=>a+x.debit,0), tc=lf.reduce((a,x)=>a+x.credit,0);
  body.push({type:'tot', cells:['الإجمالي (الحسابات الطرفية)','', Math.round(td), Math.round(tc)]});
  return {title:'ميزان المراجعة — '+moName(per), header:['الحساب','الكود','مدين','دائن'], body, lf};
}

/* ── قوائم الدخل والمركز المالي ──
   بتتبني من الميزان نفسه: كل بند مجموع الحسابات الطرفية اللي
   كودها بيبدأ بأرقام البند. الحسابات الأب مش بتتحسب عشان ما
   يتعدّش الرقم مرتين. */
const FIN_TITLES={isco:'قائمة دخل الشركة', ispvc:'قائمة دخل PVC', isfac:'قائمة دخل المصنع', bs:'المركز المالي'};
const FIN_SEG_OF={isco:'', ispvc:'pvc', isfac:'fac'};
const FIN_SEGS=[['','الشركة'],['pvc','PVC'],['fac','المصنع']];
/* بند القائمة: pre = بدايات أكواد الحسابات، flip = الرصيد دائن (إيراد) */
const IS_LINES=[
  {k:'sales', n:'المبيعات',                pre:['41'], flip:true},
  {k:'ret',   n:'مردود المبيعات',           pre:['33'], neg:true},
  {k:'disc',  n:'خصم مسموح به',             pre:['35'], neg:true},
  {k:'net',   n:'صافي المبيعات',            sub:true},
  {k:'cogs',  n:'تكلفة البضاعة المباعة',    pre:['32'], neg:true},
  {k:'gross', n:'مجمل الربح',               sub:true},
  {k:'oth',   n:'إيرادات أخرى',             pre:['43','44','45'], flip:true},
  {k:'exp',   n:'المصروفات العمومية',       pre:['31'], neg:true},
  {k:'profit',n:'صافي الربح',               sub:true},
];
const BS_LINES=[
  {k:'fixed', n:'الأصول الثابتة',            pre:['11']},
  {k:'cur',   n:'الأصول المتداولة',          pre:['12']},
  {k:'assets',n:'إجمالي الأصول',             sub:true},
  {k:'cap',   n:'رأس المال',                 pre:['2101'], flip:true},
  {k:'liabL', n:'إلتزامات طويلة الأجل',      pre:['21'], not:['2101'], flip:true},
  {k:'liabS', n:'الإلتزامات المتداولة',      pre:['22'], flip:true},
  {k:'profit',n:'صافي ربح الفترة',           sub:true},
  {k:'total', n:'إجمالي الإلتزامات وحقوق الملكية', sub:true},
];
/* الحسابات الطرفية بس (اللي مالهاش حسابات تحتها) */
function finLeaves(per){
  return tbLeaves(trialBal[per]||[]).filter(a=> String(a.code||''))
    .map(a=>({code:String(a.code), name:a.name, bal:(a.debit||0)-(a.credit||0)}));
}
/* القطاع بيتحدّد على الحساب الأب (٤ أرقام) وكل اللي تحته بيرثه،
   وتقدر تخصّص حساب طرفي بعينه لو عايز تخالف الأب. */
function finSegOf(code){
  const c=String(code||'');
  return finSeg[c] || finSeg[c.slice(0,4)] || '';
}
/* كلمات فروع PVC زي ما اتحددت: طنطا · اكسا العاشر · الاسكندرية ·
   شتر وبلسيه، ومصروفاتهم: طنطا · الاسكندرية · السيارة · الموتوسيكل */
const PVC_RE=/طنطا|اكسا|العاشر|المنصور|اسكندري|إسكندري|شتر|بلسيه|سبرباي|pvc|سياره|سيارة|شفروليه|موتوسيكل|موتسيكل|متوسيكل|متسيكل/i;
function finAutoSeg(per){
  let n=0;
  finParents(per).forEach(a=>{ if(!finSeg[a.code] && PVC_RE.test(a.name)){ finSeg[a.code]='pvc'; n++; } });
  save('finSeg_v1', finSeg);
  return n;
}
function finAccounts(per, line, seg){
  return finLeaves(per).filter(a=>
    (line.pre||[]).some(p=> a.code.startsWith(p)) &&
    !(line.not||[]).some(p=> a.code.startsWith(p)) &&
    (!seg || finSegOf(a.code)===seg));
}
/* حسابات الأرباح والخسائر على مستوى ٤ أرقام — دي اللي بتخصّصها */
function finParents(per){
  const leaves=finLeaves(per), by={};
  leaves.forEach(a=>{
    if(!/^[34]/.test(a.code)) return;
    const k=a.code.slice(0,4);
    (by[k]=by[k]||{code:k, name:'', bal:0, n:0}).bal+=a.bal; by[k].n++;
  });
  (trialBal[per]||[]).forEach(a=>{ const c=String(a.code||''); if(by[c] && !by[c].name) by[c].name=a.name; });
  Object.keys(by).forEach(k=>{ if(!by[k].name){
    const f=leaves.find(a=>a.code.startsWith(k)); by[k].name=f? f.name : k; } });
  return Object.values(by).sort((a,b)=> Math.abs(b.bal)-Math.abs(a.bal));
}
function finLineVal(per, line, seg){
  const v=finAccounts(per, line, seg).reduce((a,x)=>a+x.bal,0);
  return line.flip? -v : v;
}
function finStatement(per, id){
  const seg=FIN_SEG_OF[id]||'', isBS = id==='bs';
  const L = isBS? BS_LINES : IS_LINES, V={};
  L.forEach(l=>{ if(!l.sub) V[l.k]=finLineVal(per, l, isBS? '' : seg); });
  if(isBS){
    V.assets = V.fixed + V.cur;
    const P=IS_LINES.filter(l=>!l.sub);
    const pv={}; P.forEach(l=> pv[l.k]=finLineVal(per,l,''));
    V.profit = pv.sales - pv.ret - pv.disc - pv.cogs + pv.oth - pv.exp;
    V.total  = V.cap + V.liabL + V.liabS + V.profit;
  } else {
    V.net    = V.sales - V.ret - V.disc;
    V.gross  = V.net - V.cogs;
    V.profit = V.gross + V.oth - V.exp;
  }
  return {lines:L, V, seg, isBS};
}
let finOpen={};                      // البنود المفتوحة: 'القائمة|البند'
function toggleFinLine(id,k){ const key=id+'|'+k; if(finOpen[key]) delete finOpen[key]; else finOpen[key]=1; render(); }
function finDetailOn(){ return load('_finDetail_',0)===1; }
function setFinDetail(v){ save('_finDetail_', v?1:0); finOpen={}; render(); }
/* حسابات البند كلها (مش المخصّصة للقطاع بس) عشان تقدر تخصّصها
   من جوه القائمة نفسها. اللي برّه القطاع بيبان باهت ومش بيتحسب. */
function finLineAccounts(per, line){ return finAccounts(per, line, ''); }
function finModel(per, id, detail){
  const R=finStatement(per, id), body=[];
  R.lines.forEach(l=>{
    body.push({type: l.sub? 'tot':'row', cells:[(l.neg?'( ناقص ) ':'')+l.n, Math.round(R.V[l.k]||0)]});
    if(detail && !l.sub){
      const seg=R.isBS? '' : R.seg;
      finAccounts(per, l, seg).forEach(a=>
        body.push({type:'sub', cells:['  '+a.name, Math.round(l.flip? -a.bal : a.bal)]}));
    }
  });
  return {title:(FIN_TITLES[id]||'')+' — '+moName(per), header:['البيان','المبلغ'],
    body, rowTap: detail? null : R.lines.filter(l=>!l.sub).map(l=>`toggleFinLine('${id}','${l.k}')`),
    tapCol:0, tapIcon:'▸',
    expand: detail? null : R.lines.filter(l=>!l.sub).map(l=> finOpen[id+'|'+l.k]? finLineHtml(id, l.k) : ''),
    R};
}
/* القايمة المنسدلة تحت البند: حساباته بأرقامها وقطاع كل واحد */
function finLineHtml(id, k){
  const per=finCur(), R=finStatement(per, id);
  const line=R.lines.find(l=>l.k===k); if(!line || line.sub) return '';
  const all=finLineAccounts(per, line), seg=R.isBS? '' : R.seg;

  const out=all.filter(a=> seg && finSegOf(a.code)!==seg).length;
  return `<div class="finlist">

    ${all.map(a=>{
      const inSeg = !seg || finSegOf(a.code)===seg;
      return `<div class="finrow"${inSeg?'':' style="opacity:.5"'}>
        <span class="finn" title="${esc(a.name)}">${esc(a.name)}</span>

      </div>`; }).join('')}</div>`;
}

function saveEmployee(id){
  const name=$('#e_name').value.trim(), salary=$('#e_salary').value;
  if(!name || salary===''){ toast('الاسم والمرتب مطلوبين'); return; }
  const o={id:id||uid(),name,branch:$('#e_branch').value.trim(),salary:Number(salary),h1:$('#e_h1').checked,h2:$('#e_h2').checked};
  if(id){ const i=employees.findIndex(x=>x.id===id); employees[i]=o; } else employees.push(o);
  save('employees_v1',employees); closeSheet(); render(); toast('تم الحفظ');
}
function delEmployee(id){ if(!confirm('حذف الموظف؟ (بياناته في الشهور السابقة هتفضل محفوظة بس مش هتظهر)')) return; employees=employees.filter(x=>x.id!==id); save('employees_v1',employees); render(); }
function importEmployees(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const sn=wb.SheetNames.find(n=>n.includes('الموظفين'))||wb.SheetNames[0];
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
      let hi=rows.findIndex(x=>x.some(c=>String(c).includes('اسم الموظف'))); if(hi<0) hi=2;
      const list=[];
      for(let i=hi+1;i<rows.length;i++){ const x=rows[i]; const name=String(x[1]||'').trim(); if(!name||!nz(x[3])) continue;
        list.push({id:uid(),name,branch:String(x[2]||'').trim(),salary:nz(x[3]),h1:String(x[4]).includes('✔'),h2:String(x[5]).includes('✔')}); }
      if(!list.length){ toast('لم يتم إيجاد موظفين في الملف'); return; }
      pendingImport={type:'employees',list};
      openSheet(`<h3>تأكيد الاستيراد</h3><p style="font-size:13.5px;color:var(--muted)">${list.length} موظف — هيتم استبدال قائمة العاملين الحالية.</p>
        <div class="f-actions"><button class="btn-cancel" onclick="closeSheet()">إلغاء</button><button class="btn-save" onclick="commitImport()">💾 حفظ</button></div>`);
    }catch(err){ toast('خطأ في قراءة الملف'); }
  };
  r.readAsArrayBuffer(file);
}

/* الفترة بالشكل اللي في الكشف المطبوع: «١٦ الى آخر الشهر» مش «16 – 30» */
const toArabicDigits = n=> String(n).replace(/[0-9]/g, d=> '٠١٢٣٤٥٦٧٨٩'[+d]);
function payPeriodLabel(month, half){
  const p = String(month).split('-'), mn = MONTHS_AR[(+p[1]||1)-1] + ' ' + toArabicDigits(p[0]);
  if(half === 'm') return 'الشهر كامل — ' + mn;
  return (half === 2 ? 'كشف مرتبات النصف الثاني   الفترة: ١٦ الى آخر الشهر'
                     : 'كشف مرتبات النصف الأول   الفترة: ١ الى ١٥') + '   ' + mn;
}
function payModel(){
  let rows=payRows(payMonth,payHalf);
  if(payExportBranch) rows=rows.filter(r=>(r.emp.branch||'بدون فرع')===payExportBranch);
  let cols=PAY_COLS[payKind].filter(c=> payVisible().has(c[0]));
  if(!cols.length) cols=PAY_COLS[payKind].filter(c=> c[0]==='net');
  // لو مختار فرع واحد، عمود «الفرع» بيتكرر في كل سطر — ملوش لازمة
  const brCol = !payExportBranch;
  const sums=rs=>cols.map(([k,h,f])=>rs.reduce((a,r)=>a+f(r),0));
  const body=[];
  if(payKind==='send'){
    /* الكشف اللي بيتبعت مسطّح: الفرع عمود جنب الموظف، وسطر إجمالي واحد
       في الآخر — من غير سطور تقسيم على الفروع. وفيه عمود ملاحظات. */
    // الصفر في خانة إدخال = مفيش حاجة اتسجّلت، فبتفضل فاضية زي الورقة
    const blank0 = (v, h)=> (PAY_INPUT_COL.test(h) && !v) ? '' : v;
    rows.forEach((r,i)=>{
      const ent = payEntry(payMonth, payHalf, r.emp.id) || {};
      body.push({type:'row', cells:[i+1, r.emp.name, ...(brCol?[r.emp.branch||'']:[]),
        ...cols.map(([k,h,f])=> blank0(f(r), h)), ent.note||'']});
    });
    body.push({type:'tot', cells:['','الإجمالي', ...(brCol?['']:[]), ...cols.map(([k,h,f])=> blank0(rows.reduce((a,r)=>a+f(r),0), h)), '']});
    return {title: payPeriodLabel(payMonth,payHalf)+(payExportBranch?' — فرع '+payExportBranch:''),
            header:['م','الموظف',...(brCol?['الفرع']:[]),...cols.map(c=>c[1]),'ملاحظات'], body, rows, send:true};
  }
  const branches=[...new Set(rows.map(r=>r.emp.branch||'بدون فرع'))]; let idx=0;
  branches.forEach(b=>{
    const br=rows.filter(r=>(r.emp.branch||'بدون فرع')===b);
    if(branches.length>1) body.push({type:'branch',label:b});
    br.forEach(r=>{ idx++; body.push({type:'row',cells:[idx,r.emp.name,...(brCol?[r.emp.branch||'']:[]),...cols.map(([k,h,f])=>f(r))]}); });
    if(branches.length>1) body.push({type:'sub',cells:['','إجمالي '+b,...(brCol?['']:[]),...sums(br)]});
  });
  body.push({type:'tot',cells:['','الإجمالي العام',...(brCol?['']:[]),...sums(rows)]});
  return {title:'كشف المرتبات — '+payLabel(payMonth,payHalf)+(payExportBranch?' — فرع '+payExportBranch:''),
    header:['م','الموظف',...(brCol?['الفرع']:[]),...cols.map(c=>c[1])], body, rows};
}

let gvOrders=load('gvOrders_v1',[]), gvCur=load('_gvCur_',null), gvShowArch=false;

function gvNew(){

  if(o.archived && !gvShowArch){ const nx=gvOrders.find(x=>!x.archived); gvCur=nx?nx.id:null; save('_gvCur_',gvCur); }

function gvDelete(){ const o=gvGet(); if(!o||!confirm('حذف الطلبية نهائيًا؟')) return; gvOrders=gvOrders.filter(x=>x.id!==o.id); gvCur=null; save('_gvCur_',null); gvSave(); render(true); }
function gvField(f,v){ const o=gvGet(); if(!o) return; o[f]=(f==='name'||f==='date')? v : nz(v); gvSave(); if(f==='containers'||f==='cap') render(); }
/* كود جيفز بتاع سطر في الطلبية — بالـid، ولو الـid ضاع من استيراد قديم بالاسم */
function gvCodeOf(r){
  const g=gvcodes.find(x=>x.id===r.gid); if(g) return g;
  const byName = r.name && gvcodes.find(x=> ordNorm(x.name)===ordNorm(r.name));
  if(byName){ r.gid=byName.id; return byName; }     // بنصلّح الربط عشان الإضافة ما تعملش سطر مكرر
  return {};
}
function gvCalc(o){
  // طلبية جاية من مزامنة قديمة ممكن تكون من غير rows — ما تكسرش الشاشة كلها
  const rows=((o&&o.rows)||[]).map((r,i)=>{
    const g=gvCodeOf(r), pc=nz(g.perCarton), w=nz(g.weight), p=nz(g.price), qty=nz(r.qty);
    return {i,gid:r.gid,name:g.name||r.name||'صنف محذوف',code:g.code||r.code||'',pc,w,p,qty,cartons:pc? qty/pc : 0,weight:qty*w,value:qty*p,noPrice:!p};
  });
  const tot={cartons:0,weight:0,value:0}; rows.forEach(r=>{ tot.cartons+=r.cartons; tot.weight+=r.weight; tot.value+=r.value; });
  const cap=nz(o.containers)*nz(o.cap), diff=cap-tot.weight;
  const status=Math.abs(diff)<0.0001? 'مظبوطة تمام' : (diff>0? 'لسه فيها مكان '+fmt1(diff)+' كجم' : 'الحمولة زيادة عن الحاويات بـ '+fmt1(-diff)+' كجم');
  return {rows,tot,cap,diff,status};
}
function gvQty(i,kind,v){
  const o=gvGet(); if(!o) return; const r=o.rows[i]; const g=gvCodeOf(r);
  if(kind==='q') r.qty=nz(v);
  else { const pc=nz(g.perCarton); if(!pc){ toast('الصنف ده مفيهوش عدد قطع بالكرتونة'); return; } r.qty=Math.round(nz(v)*pc*1000)/1000; }
  gvSave(); render();
}

function gvFilter(){

    const ist='width:66px;padding:8px 6px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:13px;text-align:center';

      <div style="display:flex;gap:6px">
        <input type="number" inputmode="decimal" data-k="c" placeholder="كراتين" ${pc?'':'disabled title="الصنف ده مفيهوش عدد قطع بالكرتونة"'} value="${cv}" style="${ist}" onchange="gvSetQtyDirect('${g.id}',this.value,'c',this)">
        <input type="number" inputmode="numeric" data-k="q" placeholder="قطع" value="${q||''}" style="${ist}" onchange="gvSetQtyDirect('${g.id}',this.value,'q',this)">

  }).join('') : `<div class="empty">${gvcodes.length?'لا توجد نتائج':'لسه مفيش أكواد جيفز — استوردها من الأصناف ← أكواد جيفز'}</div>`;
}
function gvSetQtyDirect(gid,val,kind,el){
  const o=gvGet(); if(!o) return; const g=gvcodes.find(x=>x.id===gid); if(!g) return;
  const pc=nz(g.perCarton);
  const qty = kind==='c' ? (pc? Math.round(nz(val)*pc*1000)/1000 : 0) : nz(val);   // الكراتين بتتحول قطع
  const card = el && el.closest ? el.closest('.card') : null;
  if(card){                                                                          // الخانة التانية تتحدّث فورًا
    const cI=card.querySelector('[data-k=c]'), qI=card.querySelector('[data-k=q]');
    if(qI) qI.value = qty||'';
    if(cI && pc) cI.value = qty? Math.round(qty/pc*100)/100 : '';
  }
  const ex=o.rows.find(r=>r.gid===gid);
  if(!qty){ if(ex) o.rows=o.rows.filter(r=>r.gid!==gid); }
  else if(ex) ex.qty=qty;
  else o.rows.push({gid,name:g.name,code:g.code,qty});
  gvSave(); render();
}
function gvImportExcel(file){
  const o=gvGet(); if(!o){ toast('اعمل طلبية جديدة الأول'); return; }
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      let hit=null;
      for(const sn of wb.SheetNames){
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
        for(let hi=0;hi<Math.min(rows.length,6);hi++){
          const hdr=(rows[hi]||[]).map(h=>String(h||'').trim());
          const ni=hdr.findIndex(h=>h.includes('اسم الصنف')), qi=hdr.findIndex(h=>h.includes('الكمية'));
          if(ni>=0 && qi>=0){ hit={rows,hi,ni,qi}; break; }
        }
        if(hit) break;
      }
      if(!hit){ toast('لم يتم التعرف على أعمدة اسم الصنف/الكمية في الملف'); return; }
      const {rows,hi,ni,qi}=hit, newRows=o.rows.map(r2=>({...r2})); let matched=0; const unmatched=[];
      for(let i=hi+1;i<rows.length;i++){
        const row=rows[i], name=String(row[ni]||'').trim(), qty=nz(row[qi]);
        if(!name || !qty) continue;
        const g=gvcodes.find(x=>x.name.trim()===name) || gvcodes.find(x=>ordNorm(x.name)===ordNorm(name));  // فرق مسافة/همزة/ة
        if(!g){ unmatched.push(name); continue; }
        matched++;
        const ex=newRows.find(r2=>r2.gid===g.id);
        if(ex) ex.qty=qty; else newRows.push({gid:g.id,name:g.name,code:g.code,qty});
      }
      if(!matched && !unmatched.length){ toast('لا توجد بيانات في الملف'); return; }
      pendingImport={type:'gvrows',rows:newRows};
      openSheet(`<h3>تأكيد استيراد الطلبية</h3><p style="font-size:13.5px;color:var(--muted)">
        ${matched} صنف هيتضاف/يتحدّث في الطلبية الحالية.
        ${unmatched.length? '<br>⚠️ '+unmatched.length+' صنف مش موجود في أكواد جيفز: '+unmatched.slice(0,6).map(esc).join('، ')+(unmatched.length>6?' ...':''):''}</p>
        <div class="f-actions"><button class="btn-cancel" onclick="closeSheet()">إلغاء</button><button class="btn-save" onclick="commitImport()">💾 حفظ</button></div>`);
    }catch(err){ toast('خطأ في قراءة الملف'); console.error(err); }
  };
  r.readAsArrayBuffer(file);
}

// حسبة الاستلام: المستلم مقابل المطلوب
function gvRecvRows(o){
  return gvCalc(o).rows.map(r=>{
    const src=o.rows[r.i]||{}, recv=nz(src.recv);
    return Object.assign({}, r, {recv, recvCartons: r.pc? recv/r.pc : 0,
      diff: recv - r.qty, recvWeight: recv*r.w, recvValue: recv*r.p});
  });
}
function gvRecvTot(o){
  const rows=gvRecvRows(o), t={qty:0,recv:0,cartons:0,weight:0,value:0,diff:0,short:0,over:0};
  rows.forEach(r=>{ t.qty+=r.qty; t.recv+=r.recv; t.cartons+=r.recvCartons; t.weight+=r.recvWeight;
    t.value+=r.recvValue; t.diff+=r.diff; if(r.diff<0) t.short++; if(r.diff>0) t.over++; });
  return {rows, t};
}
function gvRecvTotHtml(c){
  const o=gvGet(); const {t}=gvRecvTot(o);
  return `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center">

    <div><div style="font-size:12px;color:var(--muted)">مستلم</div><div style="font-size:17px;font-weight:700">${fmtN(t.recv)}</div></div>
    <div><div style="font-size:12px;color:var(--muted)">كراتين</div><div style="font-size:17px;font-weight:700">${fmt1(t.cartons)}</div></div>
    <div><div style="font-size:12px;color:var(--muted)">الفرق</div><div style="font-size:17px;font-weight:700;color:${t.diff<0?'var(--danger)':(t.diff>0?'var(--ok)':'inherit')}">${fmt1(t.diff)}</div></div>
  </div>${t.short||t.over? `<div style="font-size:12.5px;color:var(--muted);margin-top:8px">
    ${t.short? `<b style="color:var(--danger)">${t.short}</b> صنف ناقص` : ''}${t.short&&t.over?' · ':''}${t.over? `<b style="color:var(--ok)">${t.over}</b> صنف زيادة` : ''}</div>`:''}`;
}
/* التسعير: كل المصاريف بتتحوّل جنيه وتتوزّع على الأصناف **بنسبة قيمتها**
   من إجمالي الفاتورة المستلمة. فالصنف الغالي بياخد نصيب أكبر من الشحن. */
function gvPricing(o){
  const {rows, t} = gvRecvTot(o);
  const c = o.cost || {};
  const rate = nz(c.rate) || 0;
  const invoice = nz(c.invoice) || t.value;          // لو ما كتبتش الفاتورة بنحسبها من المستلم
  const discount = nz(c.discount);                    // خصم على الفاتورة بالدولار
  const netInvoice = Math.max(0, invoice - discount);
  const baseUsd = t.value || invoice;                 // أساس التوزيع
  const extrasEgp = nz(c.bankUsd)*rate + nz(c.bankEgp) + nz(c.customs) + nz(c.handling) + nz(c.shipUsd)*rate;
  const goodsEgp  = netInvoice * rate;
  const totalEgp  = goodsEgp + extrasEgp;
  /* التكلفة الكاملة (فاتورة + مصاريف) بتتوزّع على الأصناف بنسبة قيمتها.
     مهم: بنوزّع **الإجمالي كله** مش قيمة كل صنف + نصيبه من المصاريف —
     عشان مجموع تكاليف الأصناف يساوي الإجمالي بالظبط حتى لو الفاتورة
     مختلفة عن قيمة اللي وصل فعلاً (نقص أو زيادة في الشحنة). */
  const priced = rows.filter(r=> r.recv > 0).map(r=>{
    const share = baseUsd ? (r.recvValue / baseUsd) : 0;
    const costEgp = totalEgp * share;
    return Object.assign({}, r, {share, costEgp, unitEgp: r.recv ? costEgp/r.recv : 0,
      cartonEgp: r.recvCartons ? costEgp/r.recvCartons : 0});
  });
  // فرق الفاتورة عن قيمة المستلم — بنقوله للمستخدم بدل ما يعدّي في صمت
  const gap = nz(c.invoice) ? (t.value - nz(c.invoice)) : 0;
  return {rows: priced, rate, invoice, discount, netInvoice, extrasEgp, goodsEgp, totalEgp, t, gap};
}

/* ═══════════ بونص اكسا ═══════════
   ملف إكسل لكل قطاع (كرافت · كومبن ابيض · كومبن بيج · نيو لاين · اكسسوارات)
   فيه الأصناف وصافي مشترياتها، والتقرير بيطلع لكل قطاع:
   صافي المشتريات × نسبة البونص = البونص المستحق.
   الاكسسوارات بتتقسم عام / بلسيه / سيلكون وفوم زي كشف اكسا، والفرش برّه. */
const BONUS_FILES=[
  {k:'kraft', name:'كرافت لاين', icon:'🟫'},
  {k:'kw',    name:'كومبن ابيض', icon:'⬜'},
  {k:'kb',    name:'كومبن بيج',  icon:'🟨'},
  {k:'new',   name:'نيو لاين',   icon:'🟦'},
  {k:'acc',   name:'اكسسوارات',  icon:'🔩'}];
const BONUS_ACC=['اكسسوارات عام','اكسسوارات ( بلسيه )','اكسسوارات ( سيلكون وفوم)','خارج البونص'];
const BONUS_RATE_DEF={'كرافت لاين':.02,'نيو لاين':.02,'كومبن ابيض':.02,'كومبن بيج':.02,
  'اكسسوارات عام':.05,'اكسسوارات ( بلسيه )':.05,'اكسسوارات ( سيلكون وفوم)':.05,'خارج البونص':0};
const BONUS_ORDER=['كرافت لاين','نيو لاين','كومبن ابيض','كومبن بيج',...BONUS_ACC];
function bonusSave(){ save('bonusAksa_v1', bonusData); }
function bonusFile(k){ return (bonusData.files||{})[k]; }
function bonusRate(line){
  const r=(bonusData.rates||{})[line];
  return r!==undefined && r!==null && r!=='' ? +r : (BONUS_RATE_DEF[line] ?? 0);
}
function bonusAccLine(name, type){
  const o=(bonusData.itemLine||{})[name]; if(o) return o;
  const t=ordNorm(type||'');
  if(t){ const hit=BONUS_ACC.find(l=> ordNorm(l)===t); if(hit) return hit; }
  const n=String(name||'');
  if(/بلي?سيه/.test(n)) return 'اكسسوارات ( بلسيه )';
  if(/سيلكون|سليكون|فوم/.test(n)) return 'اكسسوارات ( سيلكون وفوم)';
  if(/(^|\s)فرش(\s|$)/.test(n)) return 'خارج البونص';
  return 'اكسسوارات عام';
}
function bonusLineOf(fk, r){ return fk==='acc' ? bonusAccLine(r.name, r.type) : BONUS_FILES.find(f=>f.k===fk).name; }
/* قراءة الشيت: بندوّر في كل الشيتات على صف عناوين فيه الصنف والقيمة
   (الصافي الأول)، وبناخد الشيت اللي طلع منه أكتر أصناف سليمة. لو فيه
   عمود «النوع» فيه اسم القطاع ده، بناخد صفوف القطاع ده بس — فتقدر ترفع
   ملف واحد فيه كل القطاعات في كل خانة. */
function bonusParse(wb, fk){
  const nameRe=/^(اسم\s*)?الصنف$|اسم الصنف|^الصنف|item_?name|^البيان$|^بيان$/i;
  const valRes=[/صافي/, /قيمة المشتريات|المشتريات|^القيمه$|^القيمة$|القيمه|القيمة|vout|net|value|اجمالي|إجمالي/i];
  const slot=BONUS_FILES.find(f=>f.k===fk);
  const slotOk = t=>{ const n=ordNorm(t); return fk==='acc' ? /^اكسسوار/.test(n) : n.indexOf(ordNorm(slot.name))>=0; };
  let best=null;
  for(const sn of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
    for(let h=0; h<Math.min(rows.length,15); h++){
      const hdr=(rows[h]||[]).map(c=>String(c||'').trim());
      const ni=hdr.findIndex(c=> nameRe.test(c)); if(ni<0) continue;
      /* تصدير حركة الصنف من برنامج المحاسبة (Item_Name · tvin · tvout):
         الوارد من اكسا tvin والمرتجع ليهم tvout، فالصافي = الوارد − المرتجع */
      const inI=hdr.findIndex(c=> /^t?v_?in$/i.test(c)), outI=hdr.findIndex(c=> /^t?v_?out$/i.test(c));
      let vi=-1;
      if(inI<0){ for(const re of valRes){ vi=hdr.findIndex((c,i)=> i!==ni && re.test(c)); if(vi>=0) break; }
        if(vi<0) continue; }
      const valOf = r=> inI>=0 ? nz(r[inI]) - (outI>=0? nz(r[outI]) : 0) : nz(r[vi]);
      const ti=hdr.findIndex(c=> /^النوع$|^القطاع$|^المجموعه$|^المجموعة$|^category_?name$/i.test(c));
      let list=[], cat='';
      for(let i=h+1;i<rows.length;i++){
        const r=rows[i]||[], name=String(r[ni]||'').trim();
        const t = ti>=0? String(r[ti]||'').trim() : '';
        // المجموعة ممكن تكون سطر لوحدها فوق أصنافها (Category_Name) — بتتشال للأصناف اللي تحتها
        if(!name){ if(t) cat=t; continue; }
        if(/^#/.test(name) || /^(total|grand total|الإجمالي|الاجمالي|إجمالي|اجمالي)/i.test(name)) continue;
        const val=valOf(r); if(!val) continue;
        list.push({name, val, type: t || cat});
      }
      if(ti>=0 && list.some(x=> slotOk(x.type))) list=list.filter(x=> slotOk(x.type));
      if(list.length && (!best || list.length>best.list.length)) best={list, sheet:sn};
      break;
    }
  }
  if(!best) return null;
  const agg={};                     // نفس الصنف مكرر (كذا فاتورة) = بيتجمع
  best.list.forEach(x=>{ const a=agg[x.name]=agg[x.name]||{name:x.name,val:0,type:x.type}; a.val+=x.val; });
  return {sheet:best.sheet, rows:Object.values(agg).sort((a,b)=> b.val-a.val)};
}
function bonusUpload(fk, input){
  const f=input.files && input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const p=bonusParse(wb, fk);
      if(!p || !p.rows.length){ toast('مش لاقي عمود الصنف وصافي المشتريات في الملف'); return; }
      bonusData.files=bonusData.files||{};
      bonusData.files[fk]={file:f.name, sheet:p.sheet, at:todayStr(), rows:p.rows};
      bonusSave(); render();
      const tot=p.rows.reduce((a,x)=>a+x.val,0);
      toast(BONUS_FILES.find(x=>x.k===fk).name+': '+p.rows.length+' صنف · '+fmtN(Math.round(tot)));
    }catch(err){ toast('خطأ في قراءة الملف'); }
  };
  r.readAsArrayBuffer(f);
}
function bonusClearFile(fk){
  const b=BONUS_FILES.find(x=>x.k===fk);
  if(!confirm('مسح ملف «'+b.name+'»؟')) return;
  delete bonusData.files[fk]; bonusSave(); render();
}
function bonusNewPeriod(){
  if(!confirm('فترة جديدة؟ هيتمسح كل الملفات المرفوعة (النِسَب بتفضل زي ما هي).')) return;
  bonusData.files={}; bonusData.period=''; bonusSave(); render(true);
}
function bonusSetPeriod(v){ bonusData.period=String(v||'').trim(); bonusSave(); }
/* سطور التقرير: كل قطاع بصافيه ونسبته وبونصه، والأصناف تحت كل سطر */
function bonusLines(){
  const L={};
  BONUS_FILES.forEach(f=>{ const d=bonusFile(f.k); if(!d) return;
    d.rows.forEach(r=>{ const line=bonusLineOf(f.k, r);
      const o=L[line]=L[line]||{line, fk:f.k, net:0, items:[]}; o.net+=r.val; o.items.push(r); }); });
  return BONUS_ORDER.filter(l=> L[l]).concat(Object.keys(L).filter(l=> BONUS_ORDER.indexOf(l)<0))
    .map(l=>{ const o=L[l], rate=bonusRate(l); return Object.assign(o, {rate, bonus: Math.round(o.net*rate*100)/100}); });
}
const bonusPct = r=> (Math.round(r*10000)/100)+'%';
/* بونص اكسا الفعلي لكل قطاع (بيتكتب بإيدك) والفرق = بونصنا − بونص اكسا */
function bonusAksaOf(line){ const v=(bonusData.aksa||{})[line]; return (v===undefined||v===null||v==='') ? null : +v; }
function bonusSetAksa(line, v){
  v=String(v||'').replace(/[,،\s]/g,'');
  bonusData.aksa=bonusData.aksa||{};
  if(v==='' || isNaN(+v)) delete bonusData.aksa[line]; else bonusData.aksa[line]=+v;
  bonusSave(); render();
}
function bonusModel(){
  const lines=bonusLines(), body=[];
  // البونص بالجنيه الصحيح عشان العمود يبقى بشكل واحد (الحسبة نفسها بالقروش)
  lines.forEach(o=>{ const a=bonusAksaOf(o.line);
    o.aksa=a; o.diff= a===null ? null : Math.round((o.bonus-a)*100)/100;
    body.push({type:'row', cells:[o.line, Math.round(o.net), bonusPct(o.rate), Math.round(o.bonus), a===null?'':Math.round(a), a===null?'':Math.round(o.diff)]}); });
  const net=lines.reduce((a,o)=>a+o.net,0), bon=lines.reduce((a,o)=>a+o.bonus,0);
  const ak=lines.filter(o=>o.aksa!==null), aT=ak.reduce((a,o)=>a+o.aksa,0), dT=ak.reduce((a,o)=>a+o.bonus,0)-aT;
  if(lines.length) body.push({type:'tot', cells:['الإجمالي', Math.round(net), '', Math.round(bon), ak.length?Math.round(aT):'', ak.length?Math.round(dT):'']});
  return {title:'بونص اكسا'+(bonusData.period?' — '+bonusData.period:''),
    header:['القطاع','صافي المشتريات','نسبة البونص','البونص المستحق','بونص اكسا','الفرق'], body,
    hiLo:{},   // مفيش تلوين أعلى/أقل — التقرير ده حسبة مش مقارنة
    rowTap: lines.map(o=>`bonusLineSheet(${jsArg(o.line)})`), tapCol:0, tapIcon:'▾', lines};
}

const bonusShort = l=> l.replace(/^اكسسوارات\s*/,'').replace(/[()]/g,'').trim() || l;
function bonusItemSheet(name, line){
  openSheet(`<h3>✏️ سطر الصنف</h3>
    <div style="font-weight:800;font-size:14px;margin-bottom:4px">${esc(name)}</div>
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">دلوقتي في: <b style="color:var(--text)">${esc(line)}</b></div>

        <div style="font-size:11px;opacity:.8">${bonusPct(bonusRate(l))}</div></button>`).join('')}</div>
    <div class="f-actions"><button class="btn-cancel" onclick="bonusLineSheet(${jsArg(line)})">رجوع</button></div>`);
}
function bonusSaveRate(line){
  const v=$('#bn_rate').value;
  bonusData.rates=bonusData.rates||{};
  if(v==='' || Math.abs(nz(v)/100-(BONUS_RATE_DEF[line]??0))<1e-9) delete bonusData.rates[line];
  else bonusData.rates[line]=nz(v)/100;
  bonusSave(); closeSheet(); render(); toast('اتحفظت نسبة '+line);
}
function bonusMoveItem(name, to, from){
  bonusData.itemLine=bonusData.itemLine||{};
  bonusData.itemLine[name]=to; bonusSave(); render();
  const still=bonusLines().find(x=> x.line===from);
  if(still) bonusLineSheet(from); else closeSheet();
  toast('اتنقل لـ«'+to+'»');
}

/* ═══════════ بونص الموزعين ═══════════
   شبل: بونص من اكسا + بونص من القرشي — الاتنين عن مشتريات مصطفى الغمري (ملف واحد).
   مطروح: بونص عن مشتريات الفرع.
   الملف = تقرير مبيعات بالقطاعات (Category_Name · Group_Name · tvout · tvin).
   البونص = (tvout − tvin) × النسبة، لكل قطاع إنت بتختار يدخل ولا لأ وتعدّل نسبته ومبلغه. */
const DB_FILES=[{k:'ghamry', name:'مشتريات مصطفى الغمري (لشبل)', icon:'🧑‍💼'},
                {k:'matrouh', name:'مشتريات فرع مطروح', icon:'🏪'}];
const DB_SECS=[
  {id:'shibl_aksa', dist:'shibl',   fk:'ghamry',  col:'#1d4ed8', tint:'#dbe7ff', icon:'🟦', title:'بونص محمد شبل — من اكسا',   sub:'عن مشتريات مصطفى الغمري من اكسا'},
  {id:'shibl_qur',  dist:'shibl',   fk:'ghamry',  col:'#c2570c', tint:'#ffe6d1', icon:'🟧', title:'بونص محمد شبل — من القرشي', sub:'عن مشتريات مصطفى الغمري من القرشي'},
  {id:'matrouh',    dist:'matrouh', fk:'matrouh', col:'#0f7a4d', tint:'#d5f3e4', icon:'🏪', title:'بونص فرع مطروح',            sub:'عن مشتريات الفرع'}];
const DB_DEF={shibl:['قطاعات كرافت لاين','قطاعات نيو لاين'],
              matrouh:['قطاعات كرافت لاين','قطاعات نيو لاين','قطاعات كومبن','اكسسوارات']};
const DB_SUM={col:'#6d28d9', tint:'#e7defb'};      // لون جدول الملخّص
const DB_ORDER=['قطاعات كرافت لاين','قطاعات نيو لاين','قطاعات كومبن','اكسسوارات'];
const DB_RATE_DEF=0.01;
const dbSecOf = id=> DB_SECS.find(x=>x.id===id);
function dbSave(){ save('distBonus_v1', distBonus); }
function dbSetPeriod(v){ distBonus.period=String(v||'').trim(); dbSave(); }
function setDbTab(k){ save('_dbTab_',k); render(true); }
/* أسماء القطاعات في التقرير بتتوحّد على نفس أسماء شيت البونص */
function dbCatName(raw){
  const n=String(raw||'').trim();
  if(/كومبن/.test(n)) return 'قطاعات كومبن';
  if(/كرافت/.test(n)) return 'قطاعات كرافت لاين';
  if(/نيو\s*لاين/.test(n)) return 'قطاعات نيو لاين';
  if(/^اكسسوارات/.test(n) && /pvc|اكسا/i.test(n)) return 'اكسسوارات';
  return n || 'غير مصنف';
}
function dbParse(wb){
  for(const sn of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
    let h=-1, ix={};
    for(let i=0;i<Math.min(rows.length,15);i++){
      const hd=(rows[i]||[]).map(c=>String(c||'').trim());
      const o=hd.findIndex(c=>/^t?v_?out$/i.test(c));
      if(o<0) continue;
      h=i; ix={out:o, ret:hd.findIndex(c=>/^t?v_?in$/i.test(c)),
        grp:hd.findIndex(c=>/^group_?name$/i.test(c)), cat:hd.findIndex(c=>/^category_?name$/i.test(c))};
      break;
    }
    if(h<0 || ix.grp<0 || ix.cat<0) continue;
    const cats={}; let cur='';
    for(let i=h+1;i<rows.length;i++){
      const r=rows[i]||[];
      if(r.some(c=>/^(stv|stq|total_)/i.test(String(c||'').trim()))) continue;     // سطور الإجماليات
      const cc=String(r[ix.cat]||'').trim(), ov=r[ix.out];
      if(cc && (ov===''||ov==null)){ cur=dbCatName(cc); continue; }                // عنوان قطاع
      const name=String(r[ix.grp]||'').trim(); if(!name) continue;
      const out=nz(r[ix.out]), ret= ix.ret>=0? nz(r[ix.ret]) : 0;
      if(!out && !ret) continue;
      const key=cur||'غير مصنف', c=cats[key]=cats[key]||{name:key, out:0, ret:0, groups:[]};
      c.out+=out; c.ret+=ret; c.groups.push({name, out, ret});
    }
    const list=Object.values(cats).map(c=>Object.assign(c,{net:Math.round((c.out-c.ret)*100)/100}));
    if(list.length) return {sheet:sn, cats:list};
  }
  return null;
}
function dbUpload(fk, input){
  const f=input.files && input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const p=dbParse(wb);
      if(!p){ toast('الملف مش بالشكل المتوقع (لازم فيه Category_Name · Group_Name · tvout)'); return; }
      distBonus.files=distBonus.files||{};
      distBonus.files[fk]={file:f.name, sheet:p.sheet, at:todayStr(), cats:p.cats};
      dbSave(); render(false);
      toast(DB_FILES.find(x=>x.k===fk).name+': '+p.cats.length+' قطاع · '+fmtN(Math.round(p.cats.reduce((a,c)=>a+c.net,0))));
    }catch(err){ console.error(err); toast('خطأ في قراءة الملف'); }
  };
  r.readAsArrayBuffer(f);
}
function dbClear(fk){
  const b=DB_FILES.find(x=>x.k===fk);
  if(!confirm('مسح ملف «'+b.name+'»؟ (التعديلات اللي عملتها على النِسَب والمبالغ بتفضل محفوظة)')) return;
  delete distBonus.files[fk]; dbSave(); render(false);
}
function dbCfgOf(secId, key){
  const o=((distBonus.cfg||{})[secId]||{})[key]||{}, sec=dbSecOf(secId);
  return {on: o.on!==undefined ? !!o.on : DB_DEF[sec.dist].indexOf(key)>=0,
          rate: o.rate!==undefined && o.rate!=='' ? +o.rate : DB_RATE_DEF,
          amt: (o.amt!==undefined && o.amt!==null && o.amt!=='') ? +o.amt : null,
          aksa: (o.aksa!==undefined && o.aksa!==null && o.aksa!=='') ? +o.aksa : null};
}
function dbCfgSet(secId, key, patch){
  distBonus.cfg=distBonus.cfg||{}; const c=distBonus.cfg[secId]=distBonus.cfg[secId]||{};
  c[key]=Object.assign(c[key]||{}, patch);
  Object.keys(c[key]).forEach(k=>{ if(c[key][k]===null || c[key][k]===undefined) delete c[key][k]; });
  dbSave(); render(false);
}
function dbToggleCat(secId, key, on){ dbCfgSet(secId, key, {on:!!on}); }
function dbSetAmt(secId, key, v){
  v=String(v||'').replace(/[,،\s]/g,'');
  dbCfgSet(secId, key, {amt: v==='' || isNaN(+v) ? null : +v});
}
function dbSetAksa(secId, key, v){
  v=String(v||'').replace(/[,،\s]/g,'');
  dbCfgSet(secId, key, {aksa: v==='' || isNaN(+v) ? null : +v});
}
const dbSigned = x=>{ const r=Math.round(x); return r>0 ? '+'+fmtN(r) : (r<0 ? '-'+fmtN(-r) : '0'); };
const dbDiffCls = x=>{ const r=Math.round(x); return r>0 ? 'pos' : (r<0 ? 'neg' : ''); };
function dbSetRate(secId, key, v){
  v=String(v||'').replace(/[%٪\s]/g,'').replace('،','.');
  if(v==='' || isNaN(+v)) return dbCfgSet(secId, key, {rate:null});
  dbCfgSet(secId, key, {rate: Math.max(0, +v)/100});
}
const dbShow = id=> (distBonus.show||{})[id] !== false;
function dbToggleShow(id, on){ distBonus.show=distBonus.show||{}; distBonus.show[id]=!!on; dbSave(); render(false); }
/* سطور قسم: كل قطاع في الملف بمبلغه ونسبته وهل داخل في البونص */
function dbLines(secId){
  const sec=dbSecOf(secId), f=(distBonus.files||{})[sec.fk]; if(!f) return [];
  const rank=k=>{ const i=DB_ORDER.indexOf(k); return i<0 ? 99 : i; };
  return f.cats.slice().sort((a,b)=> rank(a.name)-rank(b.name) || b.net-a.net).map(c=>{
    const cf=dbCfgOf(secId, c.name), net= cf.amt!==null ? cf.amt : c.net;
    const bonus = cf.on ? Math.round(net*cf.rate*100)/100 : 0;
    return {key:c.name, fileNet:c.net, net, rate:cf.rate, on:cf.on, edited:cf.amt!==null, bonus,
            aksa:cf.aksa, diff: cf.aksa!==null ? Math.round((bonus-cf.aksa)*100)/100 : null};
  });
}
function dbSecModel(secId){
  const lines=dbLines(secId), on=lines.filter(l=>l.on);
  const ak=on.filter(l=>l.aksa!==null), aksa=Math.round(ak.reduce((a,l)=>a+l.aksa,0)*100)/100,
        bonus=Math.round(on.reduce((a,l)=>a+l.bonus,0)*100)/100;
  // الفرق = بونصنا − بونص اكسا (على القطاعات اللي اتكتب لها بونص اكسا بس)
  return {sec:dbSecOf(secId), lines, on, hasAksa:ak.length>0, aksa,
    diff: Math.round((ak.reduce((a,l)=>a+l.bonus,0)-aksa)*100)/100,
    net: on.reduce((a,l)=>a+l.net,0), bonus};
}
/* الأقسام اللي بتظهر في التقرير: متعلّم عليها «يظهر» + فيها قطاع داخل في البونص */
function dbIds(which){
  return DB_SECS.filter(s=> (which==='all' || s.dist===which) && dbShow(s.id) && dbSecModel(s.id).on.length).map(s=>s.id);
}
const dbTotal = ids=> Math.round(ids.reduce((a,id)=> a+dbSecModel(id).bonus, 0)*100)/100;
function dbSub(){
  const n=DB_FILES.filter(f=>(distBonus.files||{})[f.k]).length, t=dbTotal(dbIds('all'));
  return `${n} من ${DB_FILES.length} ملفات` + (t? ' · '+shortNum(t) : '') + (distBonus.period? ' · '+distBonus.period : '');
}
const dbMoney = x=> fmtN(Math.round(x));
function dbFileCard(fk){
  const b=DB_FILES.find(x=>x.k===fk), d=(distBonus.files||{})[fk];
  const tot=d? d.cats.reduce((a,c)=>a+c.net,0) : 0;
  return `<div class="card">
    <div style="font-size:24px;width:40px;text-align:center">${b.icon}</div>
    <div class="info"><div class="name">${esc(b.name)}</div>
      <div class="sub">${d? `${d.cats.length} قطاع · ${dbMoney(tot)} · <bdi>${esc(d.file)}</bdi> · <bdi>${d.at}</bdi>` : 'لسه ما اترفعش — ارفع تقرير المبيعات (xls / xlsx)'}</div></div>
    <div class="act" style="display:flex;gap:6px;align-items:center">
      <label style="padding:8px 12px;border-radius:10px;background:${d?'var(--panel2)':'var(--blue)'};color:${d?'var(--text)':'#fff'};font-weight:800;font-size:12.5px;cursor:pointer;white-space:nowrap">📥 ${d?'تغيير':'رفع'}
        <input type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="dbUpload('${fk}',this)"></label>
      ${d? `<button onclick="dbClear('${fk}')">🗑️</button>`:''}</div></div>`;
}
function dbSecCard(secId){
  const M=dbSecModel(secId), sec=M.sec;
  const head=`<div class="dbhead"><div><div style="font-weight:800;font-size:14.5px">${sec.icon} ${esc(sec.title)}</div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:2px">${esc(sec.sub)}</div></div>
      <label class="dbshow"><input type="checkbox" ${dbShow(secId)?'checked':''} onchange="dbToggleShow('${secId}',this.checked)"> يظهر في التقرير</label></div>`;
  if(!M.lines.length) return `<div class="dbcard">${head}<div class="empty">ارفع ملف المبيعات الأول</div></div>`;
  const rows=M.lines.map(l=>`<tr class="${l.on?'':'off'}">
    <td><label><input type="checkbox" ${l.on?'checked':''} onchange="dbToggleCat('${secId}',${jsArg(l.key)},this.checked)"> ${esc(l.key)}</label></td>
    <td><input class="dbn" inputmode="decimal" value="${l.net}" onchange="dbSetAmt('${secId}',${jsArg(l.key)},this.value)" title="${l.edited?'معدّل يدوي — الأصلي '+l.fileNet:'من الملف'}">${l.edited?`<div class="dbed" onclick="dbSetAmt('${secId}',${jsArg(l.key)},'')">↩︎ ${dbMoney(l.fileNet)}</div>`:''}</td>
    <td><input class="dbr" inputmode="decimal" value="${Math.round(l.rate*10000)/100}" onchange="dbSetRate('${secId}',${jsArg(l.key)},this.value)">%</td>
    <td>${l.on? '<b>'+dbMoney(l.bonus)+'</b>' : '—'}</td>
    <td><input class="dbn dba" inputmode="decimal" placeholder="—" value="${l.aksa!==null?l.aksa:''}" onchange="dbSetAksa('${secId}',${jsArg(l.key)},this.value)"></td>
    <td>${l.aksa!==null? `<b class="dbd ${dbDiffCls(l.diff)}">${dbSigned(l.diff)}</b>` : '—'}</td></tr>`).join('');
  return `<div class="dbcard" style="--dc:${sec.col};--dt:${sec.tint}">${head}
    <div style="overflow-x:auto"><table class="rep dbt"><thead><tr><th>القطاع</th><th>المبلغ</th><th>النسبة</th><th>البونص</th><th>بونص اكسا</th><th>الفرق</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="dbtot"><span>مبلغ القطاعات المختارة<b>${dbMoney(M.net)}</b></span><span class="dbok">البونص المستحق<b>${dbMoney(M.bonus)}</b></span>${M.hasAksa? `<span>بونص اكسا<b>${dbMoney(M.aksa)}</b></span><span>الفرق<b class="dbd ${dbDiffCls(M.diff)}">${dbSigned(M.diff)}</b></span>` : ''}</div></div>`;
}
function dbExportBar(which){
  const n=dbIds(which).length;
  return `<div class="impbar" style="margin-top:12px">
    <button onclick="dbExport('${which}','i')">🖼️ صورة</button>

}
function renderDBonus(m){
  const tab=load('_dbTab_','shibl');
  m.innerHTML = moduleStats('dbonus')
    + tabStrip([{k:'shibl',name:'🧑‍💼 بونص شبل'},{k:'matrouh',name:'🏪 بونص مطروح'},{k:'all',name:'🧮 تجميع الكل'}], tab, k=>`setDbTab('${k}')`, {grow:true})
    + `<div class="f-row"><label>الفترة (بتظهر في التقرير)</label>
        <input value="${esc(distBonus.period||'')}" placeholder="مثلاً: الربع الثاني 2026" onchange="dbSetPeriod(this.value)"></div>

}

/* جدول ملخّص بالأقسام + إجمالي كل موزّع + الإجمالي الكلي */
const dbAnyAksa = ids=> ids.some(id=>dbSecModel(id).hasAksa);
function dbSummaryRows(ids){
  const out=[]; let g=0, ga=0, gd=0;
  const A=M=> M.hasAksa ? [M.aksa, M.diff] : ['',''];
  [['shibl','إجمالي شبل'],['matrouh','إجمالي مطروح']].forEach(([d,lbl])=>{
    const mine=ids.filter(id=>dbSecOf(id).dist===d); if(!mine.length) return;
    mine.forEach(id=>{ const M=dbSecModel(id); out.push({t:'row', col:dbSecOf(id).col, c:[dbSecOf(id).title, M.net, M.bonus, ...A(M)]}); });
    const Ms=mine.map(dbSecModel), ha=Ms.some(m=>m.hasAksa);
    if(mine.length>1){ const net=Ms.reduce((a,m)=>a+m.net,0), b=dbTotal(mine);
      out.push({t:'sub', c:[lbl, net, b, ha? Ms.reduce((a,m)=>a+m.aksa,0):'', ha? Ms.reduce((a,m)=>a+m.diff,0):'']}); }
    g+=dbTotal(mine); Ms.forEach(m=>{ if(m.hasAksa){ ga+=m.aksa; gd+=m.diff; } });
  });
  const any=dbAnyAksa(ids);
  out.push({t:'tot', c:['إجمالي البونص', '', Math.round(g*100)/100, any? Math.round(ga*100)/100 : '', any? Math.round(gd*100)/100 : '']});
  return out;
}
function dbSummaryHtml(ids, doc){
  if(!ids.length) return `<div class="empty">مفيش قسم هيظهر — علّم على اللي عايزه فوق</div>`;
  const ha=dbAnyAksa(ids), th=`style="background:${DB_SUM.col};border-color:${DB_SUM.col};color:#fff"`;
  const R=dbSummaryRows(ids).map(r=> `<tr class="${r.t==='row'?'z':'s'}"><td${r.col?` style="border-right:6px solid ${r.col}"`:''}>${esc(r.c[0])}</td><td>${r.c[1]===''?'':dbMoney(r.c[1])}</td><td><b>${dbMoney(r.c[2])}</b></td>`
    + (ha? `<td>${r.c[3]===''?'':dbMoney(r.c[3])}</td><td>${r.c[4]===''?'':`<b class="dbd ${dbDiffCls(r.c[4])}">${dbSigned(r.c[4])}</b>`}</td>` : '') + `</tr>`).join('');
  return `<div style="overflow-x:auto"><table class="rep"><thead><tr><th ${th}>البيان</th><th ${th}>مبلغ المشتريات</th><th ${th}>البونص</th>${ha?`<th ${th}>بونص اكسا</th><th ${th}>الفرق</th>`:''}</tr></thead><tbody>${R}</tbody></table></div>`;
}
function dbDocBody(ids){
  const per=distBonus.period? ' — '+esc(distBonus.period) : '';
  let h=`<div class="dx"><h2>بونص الموزعين${per}</h2>`;
  ids.forEach(id=>{
    const M=dbSecModel(id), sec=M.sec, ha=M.hasAksa, th=`style="background:${sec.col};border-color:${sec.col}"`, tot=`style="background:${sec.tint}"`;
    h+=`<h3 style="color:${sec.col};border-right:7px solid ${sec.col};padding-right:8px">${esc(sec.title)}</h3><div class="sub" style="text-align:right;margin-bottom:6px">${esc(sec.sub)}</div>
      <table><tr><th ${th}>القطاع</th><th ${th}>المبلغ</th><th ${th}>النسبة</th><th ${th}>البونص</th>${ha?`<th ${th}>بونص اكسا</th><th ${th}>الفرق</th>`:''}</tr>`
      + M.on.map(l=>`<tr class="z"><td>${esc(l.key)}</td><td>${dbMoney(l.net)}</td><td>${bonusPct(l.rate)}</td><td>${dbMoney(l.bonus)}</td>`
          + (ha? `<td>${l.aksa!==null?dbMoney(l.aksa):''}</td><td class="${l.aksa!==null?dbDiffCls(l.diff):''}">${l.aksa!==null?dbSigned(l.diff):''}</td>` : '') + `</tr>`).join('')
      + `<tr class="s"><td ${tot}>الإجمالي</td><td ${tot}>${dbMoney(M.net)}</td><td ${tot}></td><td ${tot}>${dbMoney(M.bonus)}</td>`
      + (ha? `<td ${tot}>${dbMoney(M.aksa)}</td><td ${tot} class="${dbDiffCls(M.diff)}">${dbSigned(M.diff)}</td>` : '') + `</tr></table>`;
  });
  if(ids.length>1){
    const ha=dbAnyAksa(ids), th=`style="background:${DB_SUM.col};border-color:${DB_SUM.col}"`, tot=`style="background:${DB_SUM.tint}"`;
    h+=`<h3 style="color:${DB_SUM.col};border-right:7px solid ${DB_SUM.col};padding-right:8px">الملخّص</h3><table><tr><th ${th}>البيان</th><th ${th}>مبلغ المشتريات</th><th ${th}>البونص</th>${ha?`<th ${th}>بونص اكسا</th><th ${th}>الفرق</th>`:''}</tr>`
      + dbSummaryRows(ids).map(r=>{ const st=r.t==='row'? '' : tot, f=(i)=> r.c[i]===''?'':dbMoney(r.c[i]);
          return `<tr class="${r.t==='row'?'z':'s'}"><td ${r.col?`style="border-right:7px solid ${r.col}"`:st}>${esc(r.c[0])}</td><td ${st}>${f(1)}</td><td ${st}>${f(2)}</td>`
          + (ha? `<td ${st}>${f(3)}</td><td ${st} class="${r.c[4]===''?'':dbDiffCls(r.c[4])}">${r.c[4]===''?'':dbSigned(r.c[4])}</td>` : '') + `</tr>`; }).join('')
      + `</table>`;
  }
  return h+`</div>`;
}
function dbExcel(ids, file){
  const ha=dbAnyAksa(ids);
  const aoa=[['الجهة','القطاع','المبلغ','النسبة','البونص', ...(ha?['بونص اكسا','الفرق']:[])]];
  ids.forEach(id=>{
    const M=dbSecModel(id);
    M.on.forEach(l=> aoa.push([M.sec.title, l.key, Math.round(l.net*100)/100, bonusPct(l.rate), Math.round(l.bonus*100)/100,
      ...(ha?[l.aksa!==null?l.aksa:'', l.aksa!==null?l.diff:'']:[])]));
    aoa.push([M.sec.title, 'إجمالي', Math.round(M.net*100)/100, '', M.bonus, ...(ha?[M.hasAksa?M.aksa:'', M.hasAksa?M.diff:'']:[])]);
  });
  const sum=dbSummaryRows(ids).pop();
  aoa.push(['إجمالي البونص','','','', dbTotal(ids), ...(ha?[sum.c[3], sum.c[4]]:[])]);
  saveAoaXlsx(aoa, 'بونص الموزعين', file+'.xlsx', [34,26,16,10,16,...(ha?[16,14]:[])], {title:'بونص الموزعين'+(distBonus.period?' — '+distBonus.period:'')});
}
function dbExport(which, kind){
  const ids=dbIds(which);
  if(!ids.length){ toast('مفيش قسم هيظهر — ارفع الملف أو علّم «يظهر»'); return; }
  const nm=which==='shibl'?'شبل':(which==='matrouh'?'مطروح':'الموزعين');
  const file='بونص_'+nm+(distBonus.period? '_'+distBonus.period.replace(/\s+/g,'_') : '');
  if(kind==='x') return dbExcel(ids, file);
  const body=dbDocBody(ids);
  if(kind==='p') exportDocPdf(body, file, false); else exportDocImage(body, file, false);
}

function navTo(mod, keys, gv, qq){
  try{ closeSheet(); }catch(e){}

}

function searchResults(qs){
  const t=ordNorm(qs); if(!t) return [];
  const hit=x=> ordNorm(x).indexOf(t)>=0, out=[];
  const grp=(title, list, max)=>{ if(list.length) out.push({title, list:list.slice(0,max||8), more:Math.max(0,list.length-(max||8))}); };
  grp('الشاشات والتقارير', appScreens().filter(x=> hit(x.name.replace(/^\S+\s/,'')) || hit(x.name)).map(x=>({ic:'🧭',
    t1:x.name.replace(/^\S+\s/,''), t2:(modules.find(m=>m.id===x.mod)||{}).name||'', go:x.go})), 6);
  grp('الأصناف', items.filter(i=> hit(i.name) || hit(i.mainGroup||'')).map(i=>{
    const st=warehouses.reduce((a,w)=>a+qtyOf(w.id,i.name),0);
    return {ic:'📦', t1:i.name, t2:(i.mainGroup||'')+(i.subGroup?' · '+i.subGroup:'')+(warehouses.length?' · رصيد '+fmtN(st):''),
      go:`navTo('items',{_itemsTab_:0},null,${jsArg(i.name)})`}; }));
  grp('العملاء', customers.filter(c=> hit(c.name)).map(c=>({ic:'👤', t1:c.name, t2:c.cls||'غير مصنّف',
    go:`navTo('sales',{_salesTab_:1},null,${jsArg(c.name)})`})));
  grp('الموظفين', employees.filter(e=> hit(e.name) || hit(e.branch||'')).map(e=>({ic:'🧑‍💼', t1:e.name,
    t2:(e.branch||'')+' · '+fmtN(nz(e.salary))+' ج', go:`navTo('payroll',{_payTab_:0});editEmployee('${e.id}')`})));
  grp('المخازن', warehouses.filter(w=> hit(w.name)).map(w=>({ic:'🏭', t1:w.name, t2:fmtN(Object.keys(whStock[w.id]||{}).length)+' رصيد',
    go:`navTo('warehouses',{_whTab_:'${w.id}'})`})));
  grp('أكواد جيفز', gvcodes.filter(g=> hit(g.name) || hit(g.code||'')).map(g=>({ic:'🔖', t1:g.name, t2:g.code||'',
    go:`navTo('items',{_itemsTab_:1},null,${jsArg(g.name)})`})));
  return out;
}
function searchRender(){
  const box=$('#srch_r'); if(!box) return;
  const qs=($('#srch')||{}).value||'';
  if(!qs.trim()){ box.innerHTML=`<div class="srch-h">اكتب أي حاجة — بيدوّر في الشاشات والأصناف والعملاء والموظفين والمخازن</div>`; return; }
  const R=searchResults(qs);
  box.innerHTML = R.length ? R.map(g=>`<div class="srch-h">${g.title}${g.more?` <span style="font-weight:700">(+${g.more})</span>`:''}</div>`
    + g.list.map(r=>`<div class="srch-r" onclick="${r.go}"><span class="ic">${r.ic}</span>
        <div class="tx"><div class="t1">${esc(r.t1)}</div>${r.t2?`<div class="t2">${esc(r.t2)}</div>`:''}</div></div>`).join('')).join('')

}

const HOME_AC={items:'#f59e0b', warehouses:'#0ea5e9', sales:'#16a34a', gv:'#8b5cf6', payroll:'#ec4899', fin:'#0f766e', bonus:'#d97706', dbonus:'#0891b2'};
function homeStats(){
  const mos=moSort(Object.keys(monthlySales));
  const last=mos[mos.length-1];
  const lastVal=last? Object.values(monthlySales[last]||{}).reduce((a,b)=>a+b,0) : 0;
  const unc=customers.filter(c=>!c.cls).length;
  // الأصناف اللي فيها كمية فعلاً في مخازن موجودة — مش أي صنف اتفتح وسابوه فاضي
  const short=warehouses.reduce((a,w)=> a+shortTotals(w.id).items, 0);
  const stockItems=warehouses.reduce((a,w)=> a+Object.keys(whStock[w.id]||{}).length, 0);
  return {last, lastVal, unc, short, stockItems, months:mos.length};
}
function shortNum(n){
  n=Math.round(n||0);
  if(n>=1e6) return (n/1e6).toFixed(n>=1e8?0:1).replace(/\.0$/,'')+' م';
  if(n>=1e3) return (n/1e3).toFixed(n>=1e4?0:1).replace(/\.0$/,'')+' ألف';
  return n.toLocaleString('en-US');
}

    sales:`${customers.length} عميل · ${S.months} شهر`,
    gv:`${gvOrders.length} طلبية`,
    payroll:`${employees.length} موظف`,
    fin:finUnlocked? `${Object.keys(trialBal).length} فترة` : '🔒 محمي بكلمة سر',
    dbonus:dbSub(),
    bonus:`${BONUS_FILES.filter(f=>bonusFile(f.k)).length} من ${BONUS_FILES.length} ملفات${bonusData.period?' · '+bonusData.period:''}`,
  };
  // آخر أيقونة تاخد الصف كله لو فضلت لوحدها في صف
  const tile=(mo,i)=>`<div class="htile${(i===modules.length-1 && modules.length%3===1)?' wide':''}"
      style="--ac:${HOME_AC[mo.id]}" onclick="switchModule('${mo.id}')">
      <div class="hico">${mo.icon}</div>
      <div class="nm">${mo.name}</div><div class="sb">${sub[mo.id]||''}</div></div>`;
  // تنبيهات تستاهل تتشاف من أول الشاشة
  const notes=[];
  if(S.unc) notes.push(['#f59e0b', `⚠️ ${S.unc} عميل من غير تصنيف — مش داخلين في التقارير`,
    `switchModule('sales');save('_salesTab_',1);render(true)`]);
  if(S.short) notes.push(['#dc2626', `🧾 ${S.short} صنف في طلب النواقص`, `switchModule('warehouses')`]);
  if(dupWarehouses().length) notes.push(['#dc2626','🏭 في مخازن متكررة بنفس الاسم — محتاجة دمج',
    `switchModule('warehouses')`]);
  // ترتيب الأيقونات ثابت (مش بيتغيّر حسب الاستخدام)
  const ordered=modules.slice();
  // نواقص سريعة من كل المخازن
  let shortHtml='';
  try{
    const rs=[];
    warehouses.forEach(w=> Object.keys(whShortage[w.id]||{}).forEach(n=>{
      const r=shortRec(w.id,n), a=Number(r.q1)||0, b=Number(r.q2)||0;
      if(a||b) rs.push({w, n, txt:[a?fmtN(a)+' '+r.u1:'', b?fmtN(b)+' '+r.u2:''].filter(Boolean).join(' + ')});
    }));
    if(rs.length){
      shortHtml=`<div class="hsec">نواقص سريعة <span class="hbadge">${rs.length}</span></div>`
        + rs.slice(0,5).map(x=>`<div class="hnote" style="--ac:#ef4444" onclick="switchModule('warehouses');save('_whTab_',${jsArg(x.w.id)});render(true)"><span class="dot"></span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.n)}</span><span style="color:var(--muted);font-size:11px;white-space:nowrap">${esc(x.w.name)} · ${esc(x.txt)}</span></div>`).join('')
        + (rs.length>5? `<div class="hmore" onclick="switchModule('warehouses')">+${rs.length-5} كمان — افتح المخازن</div>` : '');
    }
  }catch(e){ shortHtml=''; }
  // رسم بياني سريع لمبيعات آخر شهور
  let spark='';
  try{
    const mos6=moSort(Object.keys(monthlySales)).slice(-6);
    const vals=mos6.map(k=>Object.values(monthlySales[k]||{}).reduce((a,b)=>a+(+b||0),0));
    if(vals.length>=2){
      const W=300,H=84,P=8,mx=Math.max(...vals),mn=Math.min(...vals),rg=(mx-mn)||1;
      const pts=vals.map((v,i)=>[P+i*(W-2*P)/(vals.length-1), H-P-(v-mn)/rg*(H-2*P)]);
      const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
      const lp=pts[pts.length-1], fp=pts[0];
      spark=`<div class="hsec">نظرة سريعة</div><div class="hchart">
        <div class="hmeta"><b>${shortNum(vals[vals.length-1])}</b><span>مبيعات آخر ${vals.length} شهور</span></div>
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:84px;display:block;color:var(--okt)">
          <path d="${d} L ${lp[0].toFixed(1)} ${H} L ${fp[0].toFixed(1)} ${H} Z" fill="currentColor" fill-opacity=".13"/>
          <path d="${d}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        </svg>
        <div class="hlbl">${mos6.map(k=>`<span>${esc(moName(k))}</span>`).join('')}</div></div>`;
    }
  }catch(e){ spark=''; }
  m.innerHTML = `<div class="homewrap">
    <div class="hero">
      <div class="hi">${hi}</div>
      <div class="big">تقارير القرشي</div>
      <div class="dt">${today}</div>
      <div class="kpis">
        <div class="kpi" onclick="switchModule('sales');save('_salesTab_',2);render(true)">
          <b>${S.last? shortNum(S.lastVal) : '—'}</b><span>${S.last? 'مبيعات '+moName(S.last) : 'مفيش مبيعات'}</span></div>
        <div class="kpi" onclick="switchModule('warehouses')">
          <b>${S.short || '✅'}</b><span>${S.short? 'نواقص' : 'مفيش نواقص'}</span></div>
        <div class="kpi" onclick="switchModule('sales');save('_salesTab_',1);render(true)">
          <b>${S.unc || '✅'}</b><span>${S.unc? 'غير مصنّف' : 'كله مصنّف'}</span></div>
      </div>
    </div>
    <div class="hqa">
      <button onclick="openSearch()"><span class="i">🔍</span>بحث</button>
      <button onclick="switchModule('warehouses')"><span class="i">📦</span>المخازن</button>
      <button onclick="switchModule('sales');save('_salesTab_',2);render(true)"><span class="i">📈</span>مقارنة</button>
      <button onclick="syncNow(false)"><span class="i">☁️</span>مزامنة</button>
    </div>
    ${spark}
    ${shortHtml}
    ${notes.length? `<div class="hsec">محتاج انتباهك</div>`+notes.map(([c,t,go])=>
      `<div class="hnote" style="--ac:${c}" onclick="${go}"><span class="dot"></span><span>${t}</span></div>`).join('') : ''}
    <div class="hsec">الأقسام</div>
    <div class="hgrid">${ordered.map(tile).join('')}</div>
    <div style="height:14px"></div></div>`;
}
function render(top){
  const m=$('#main'); const st=m? m.scrollTop : 0;
  renderInner();
  if(m) m.scrollTop = top? 0 : st;
}

$('#refreshBtn').addEventListener('click', ()=>{ location.reload(); });
render();

/* ═══════════ رقم سري لكل حذف ═══════════
   أيقونات الحذف 🗑 بس بتطلب نفس الرقم السري بتاع القوائم المالية (مش مسح الملفات ولا التصفير).
   بنلفّ الدوال بعد ما اتعرّفت كلها، فالأزرار القديمة بتشتغل من غير تعديل. */
let _pinRun=null;
function askDelPin(run,label){
  _pinRun=run;
  openSheet(`<h3>🔐 ${esc(label||'تأكيد الحذف')}</h3>
    <div class="f-row"><label>الرقم السري</label>
      <input id="del_pw" type="password" inputmode="numeric" autocomplete="off"></div>
    <div class="f-actions"><button class="btn-cancel" onclick="_pinRun=null;closeSheet()">إلغاء</button>
      <button class="btn-save" onclick="delPinOk()">تأكيد</button></div>`);
  setTimeout(()=>{ const el=$('#del_pw'); if(el){ el.focus(); el.onkeydown=e=>{ if(e.key==='Enter') delPinOk(); }; } }, 60);
}
function delPinOk(){
  const v=($('#del_pw').value||'').trim();
  if(v!==FIN_PASS){ toast('الرقم السري غلط'); return; }
  const f=_pinRun; _pinRun=null; closeSheet();
  if(f) setTimeout(f,0);
}
(function(){
  const LBL={delItem:'حذف صنف',delUnit:'حذف وحدة',delGvCode:'حذف كود',delWarehouse:'حذف مخزن',
    delCustomer:'حذف عميل',delSalesMonth:'حذف شهر مبيعات',delEmployee:'حذف موظف',gvDelete:'حذف الطلبية'};
  Object.keys(LBL).forEach(n=>{
    const o=window[n]; if(typeof o!=='function') return;
    window[n]=function(){ const a=arguments, self=this; askDelPin(()=>o.apply(self,a), LBL[n]); };
  });
})();
</script>
