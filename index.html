function docRowHTML_(it, idx, priced){
  let size='', frameTxt='—', brorTxt='—', qty=it.qty, unit;
  if(it.kind==='door'){
    size=it.sizeTxt; frameTxt=it.frame?frameText_(it.frame,it.frameHeight):'—'; brorTxt=it.dbror?it.dbror:'—'; unit='باب';
  } else if(it.kind==='frame'||it.kind==='bror'){
    size=(it.rodCm?'عود '+it.rodCm+' سم · ':'')+it.spec; unit='عود';
  } else { size='—'; unit=it.unit||'قطعة'; }
  return `<tr>
    <td style="text-align:center">${idx}</td>
    <td><b>${esc(it.title)}</b></td>
    <td style="font-size:11px;color:#5B6B7D">${esc(size)}</td>
    <td style="text-align:center;font-size:11px;color:#5B6B7D">${esc(frameTxt)}</td>
    <td style="text-align:center;font-size:11px;color:#5B6B7D">${esc(brorTxt)}</td>
    <td style="text-align:center">${qty} ${esc(unit)}</td>
    ${priced?`<td style="text-align:center">${money(it.kind==='door'?it.unitPrice:it.price)}</td>
    <td style="text-align:center;font-weight:700">${money(linePrice(it))}</td>`:''}
  </tr>`;
}

// بيرتّب مفاتيح مقاسات الأبواب (نص عربي زي "70 سم") تصاعديًا، والمقاسات الخاصة آخر القايمة
function sortSizeKeys_(keys){
  return keys.sort((a,b)=>{
    const aStd=/^\d+\s*سم$/.test(a), bStd=/^\d+\s*سم$/.test(b);
    if(aStd&&bStd) return parseInt(a)-parseInt(b);
    if(aStd) return -1;
    if(bStd) return 1;
    return 0;
  });
}

function docRows(o, priced){
  const items=o.items||[];
  const doorItems=items.filter(it=>it.kind==='door');
  const otherItems=items.filter(it=>it.kind!=='door');
  const colspan=priced?8:6;

  const groups={};
  doorItems.forEach(it=>{ const k=it.sizeTxt||''; (groups[k]=groups[k]||[]).push(it); });
  const order=sortSizeKeys_(Object.keys(groups));

  let n=0, rows='';
  order.forEach(k=>{
    rows += `<tr><td colspan="${colspan}" style="background:#EAF2FA;padding:6px 8px;font-weight:700;color:#0B4A7A;font-size:11.5px;font-family:Arial,'Helvetica Neue',sans-serif">🚪 أبواب مقاس ${esc(k)}</td></tr>`;
    groups[k].forEach(it=>{ rows += docRowHTML_(it, ++n, priced); });
  });
  if(otherItems.length){
    rows += `<tr><td colspan="${colspan}" style="background:#F3F6FA;padding:6px 8px;font-weight:700;color:#5B6B7D;font-size:11.5px;font-family:Arial,'Helvetica Neue',sans-serif">🔩 حلق / برور / إكسسوارات</td></tr>`;

function docTotalsHTML(o){
  const items=o.items||[];
  const doorItems=items.filter(it=>it.kind==='door');
  if(!doorItems.length) return '';
  const perSize={};
  doorItems.forEach(it=>{ const k=it.sizeTxt||''; perSize[k]=(perSize[k]||0)+(Number(it.qty)||0); });
  const keys=sortSizeKeys_(Object.keys(perSize));
  const lines=keys.map(k=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0"><span>أبواب مقاس ${esc(k)}</span><b>${perSize[k]} باب</b></div>`).join('');
  const doorsTotal=keys.reduce((s,k)=>s+perSize[k],0);
  const overallTotal=items.reduce((s,it)=>s+(Number(it.qty)||0),0);

  return `<div style="margin-top:14px;padding:10px 13px;background:#F3F6FA;border-radius:9px">
    ${lines}

}

   ============================================================ */
function exportExcel(orders,fname){
  if(typeof XLSX==='undefined'){toast('محتاج نت أول مرة عشان يجهّز الإكسيل');return;}
  if(!orders.length){toast('مفيش طلبات');return;}
  const priced=pricesVisible();
  busy(true,'جارٍ تجهيز الإكسيل…');
  try{
    const sum=[['Order No','Date','Distributor','Phone','Region','Warehouse','Status','Lines'].concat(priced?['Total']:[])];
    const det=[['Order No','Date','Distributor','Phone','Region','Status','Type','Item','Colour','Size','Frame (cm)','Frame Height (cm)','Bror','Milling','Unit','Qty','Available'].concat(priced?['Unit Price','Line Total']:[])];

    orders.forEach(o=>{
      const sumRow=[o.id, dateStr(o.ts), o.name||'', String(o.phone||''), o.region||'', o.warehouse||WAREHOUSE, o.status||'', o.items.length];
      if(priced) sumRow.push(Number(o.total)||0);
      sum.push(sumRow);
      o.items.forEach(it=>{
        const isDoor=it.kind==='door', isRod=it.kind==='frame'||it.kind==='bror';
        const row=[
          o.id, dateStr(o.ts), o.name||'', String(o.phone||''), o.region||'', o.status||'',
          isDoor?'Door':(it.kind==='frame'?'Frame':it.kind==='bror'?'Bror':'Accessory'),
          it.titleEn||it.title||'', it.code||'',
          isDoor?(it.sizeEn||it.sizeTxt||''):(isRod?(it.spec||''):''),
          isDoor?(it.frame||''):'',
          isDoor?(it.frameHeight||''):'',
          isDoor?(it.dbror||''):'',
          isDoor?(it.millEn||''):'',
          isDoor?'door':(isRod?('rod '+(it.rodCm||220)+'cm'):(it.unit||'pc')),
          Number(it.qty)||0,
          it.avail===false?'N':'Y'
        ];
        if(priced) row.push(Number(isDoor?it.unitPrice:it.price)||0, Number(linePrice(it))||0);
        det.push(row);
      });
    });

    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sum), 'Orders');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(det), 'Order_Items');
    XLSX.writeFile(wb, fname+'.xlsx');
  }catch(err){ toast('تعذّر التصدير: '+(err&&err.message?err.message:err)); }
  busy(false);
}

async function doUpdate(){
  busy(true,'جارٍ التحديث…');
  try{
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
  }catch(e){}
  // بنضيف طابع وقت للرابط عشان نتخطى كاش المتصفح نفسه — location.reload لوحدها
  // ممكن ترجّع نفس النسخة القديمة من الكاش.
  const u = new URL(location.href);
  u.searchParams.set('v', Date.now());
  location.replace(u.toString());
}

   ده اللي بيكشف الحالة اللي مافيهاش أي مؤشر تاني: التطبيق شغال بنسخة قديمة
   والسيرفر عليه جديدة، والكاش بيخفي الفرق. لو لقى فرق، بينبّه بوضوح. */
async function checkServerVersion(){
  try{
    const res = await fetch('index.html?_v=' + Date.now(), { cache:'no-store' });
    if(!res || !res.ok) return;
    const txt = await res.text();
    const m = /const APP_BUILD\s*=\s*'([^']+)'/.exec(txt);
    if(!m) return;
    const serverVer = m[1];
    if(serverVer && serverVer !== APP_BUILD){
      const el = document.getElementById('vsVer');
      if(el) el.textContent = 'الإصدار ' + APP_BUILD + ' → متاح ' + serverVer;
      const btn = document.querySelector('.verstrip [data-act="update"]');
      if(btn) btn.classList.add('vs-install');
      toast('في إصدار ' + serverVer + ' جاهز — اضغط 🔄 تحديث');
    }
  }catch(e){}
}
setTimeout(checkServerVersion, 2500);
</script>
</body>
</html>
