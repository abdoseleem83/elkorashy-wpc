        </div>`;
      }
      if(its && its.length){
        itemsHtml += `<div style="margin-top:8px">
          <div style="font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:4px">${qtyMode?'تعديل الكمية المطلوبة أو حذف صنف من الطلب:':'تتبّع الإنتاج (لمسة على أي صف لتحديث الكمية الجاهزة):'}</div>
          ${prodTableHTML_(o.id, its, a, qtyMode)}
        </div>`;
      } else {
        itemsHtml += `<div class="note">جارٍ تحميل الأصناف…</div>`;
      }
    }

    // ⚠️ زرار PDF للطلب الواحد كان مفقود من الكارت — الدالة exportAdminOrderPdf
    // موجودة وشغّالة والمعالج موجود، بس مفيش زرار بينده عليهم. فالمصنع كان يقدر
    // يصدّر PDF لكل طلبات العميل مع بعض بس، مش طلب واحد.
    const actionBtns = `<button class="btn ${itemsOpen?'brand':'act-edit'} sm" data-act="adm-toggle-items" data-id="${esc(o.id)}">${ico("box")}${itemsOpen?'إخفاء':'الأصناف'}</button>
         <button class="btn act-tool sm" data-act="adm-preview" data-id="${esc(o.id)}" ${prevBusy?'disabled':''} title="معاينة الطلب ${esc(orderNoText_(o))}" aria-label="معاينة الطلب ${esc(orderNoText_(o))}">${ico("search")}${prevBusy?'…':'معاينة'}</button>
         <button class="btn act-report sm" data-act="adm-pdf" data-id="${esc(o.id)}" title="PDF كامل بالصور — الطلب ${esc(orderNoText_(o))}" aria-label="PDF بالصور للطلب ${esc(orderNoText_(o))}">${ico("doc")}PDF بالصور</button>
         <button class="btn act-report sm" data-act="adm-pdf-eco" data-id="${esc(o.id)}" title="نسخة اقتصادية بلا صور للطلب ${esc(orderNoText_(o))} — الجدول كامل + ملخص نصي لكل مقاس" aria-label="PDF بدون صور للطلب ${esc(orderNoText_(o))}">${ico("doc")}PDF بدون صور</button>
         <button class="btn ${qtyMode?'brand':'act-edit'} sm" data-act="adm-toggle-qtymode" data-id="${esc(o.id)}">${ico("edit")}تعديل</button>
         <button class="btn act-edit sm" data-act="adm-add-items" data-id="${esc(o.id)}">${ico("plus")}إضافة</button>
         <button class="btn act-send sm" data-act="adm-share" data-id="${esc(o.id)}">${ico("send")}إرسال</button>
         <button class="btn act-money sm" data-act="adm-quote" data-id="${esc(o.id)}">${ico("money")}سعر</button>
         <button class="btn act-del sm" data-act="adm-del" data-id="${esc(o.id)}" ${delBusy?'disabled':''}>${ico("trash")}${delBusy?'…':'حذف'}</button>`;

    return `<div class="ord" data-oid="${esc(o.id)}">
      <div class="oh">${Number(o.editCount)>0?`<span style="font-size:11.5px;font-weight:700;color:var(--warn-ink);background:rgba(217,164,65,.15);border:1px solid rgba(217,164,65,.4);border-radius:20px;padding:1px 8px">معدّل</span>`:''}${o.replacesId?`<span title="الكود الداخلي للطلب القديم: ${esc(o.replacesId)}" style="font-size:12px;font-weight:700;color:var(--danger-ink);background:rgba(240,115,106,.15);border-radius:20px;padding:2px 9px;display:inline-flex;align-items:center;gap:4px">${ico("undo")}تعديل على ${esc(prevOrderNoText_(o))}</span>`:''}${statusPill(o.status)}</div>
      <div class="os">${esc(o.dist||'')} · ${esc(o.region||'')} · ${esc(o.phone||'')}
        ${o.customer?`<br><b style="color:var(--info-ink)">صاحب الأوردر: ${esc(o.customer)}</b>`:''}
        ${o.customerRegion?`<br><span style="color:var(--info-ink)">عنوان العميل: ${esc(o.customerRegion)}</span>`:''}
        <br>${viewingArchive ? 'أُرشف '+esc(dateStr2_(o.updated||o.date))+(o.date&&o.updated&&o.date!==o.updated?' · الطلب '+esc(dateStr2_(o.date)):'') : esc(dateStr2_(o.date))} · ${esc(o.qty||0)} قطعة${o.rods?' · '+esc(o.rods)+' عود':''} · ${money(o.total||0)} ج</div>
      ${o.ordNote?`<div class="ordnote">${ico("warn")}<span><b>ملاحظات:</b> ${esc(o.ordNote)}</span></div>`:''}
      ${o.superseded?`<div style="margin-top:8px;padding:9px 12px;background:rgba(240,115,106,.13);border:1.5px solid rgba(240,115,106,.42);border-radius:9px;
        font-size:13px;font-weight:700;color:var(--danger-ink);display:flex;align-items:flex-start;gap:6px;line-height:1.6">
        ${ico("warn")}<span>الطلب ده <b>اتعدّل وعنده نسخة جديدة</b> — كان دخل التنفيذ فمقدرناش نلغيه تلقائي.
        راجع النسخة الجديدة واحذف السطر ده بنفسك من زرار «حذف» تحت.</span></div>`:''}
      <div class="chips chips-line" style="margin-top:10px;gap:6px">${btns}</div>
      ${busy?'<div class="note">جارٍ الحفظ…</div>':''}
      ${viewingArchive?`<button class="btn brand" data-act="adm-unarchive" data-id="${esc(o.id)}" ${archBusy?'disabled':''} style="width:100%;margin-top:10px;padding:10px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px">${ico("refresh")}${archBusy?'جارٍ الإرجاع…':'رجّع من الأرشيف للطلبات النشطة'}</button>`:''}
      <div class="cardacts">${actionBtns}</div>
      ${itemsHtml}
    </div>`;
  };

  // ---------- تجميع طلبات كل عميل في قايمة منسدلة ----------
  // v262 — قسم «العملاء وطلباتهم» مقفول في البداية، فمانبنيش كروت العملاء
  // (أغلى جزء في الرسمة) غير لما القسم يكون مفتوح فعلًا.
  const custSecOpen = uiOpen_('adm-sec-cust', false);
  let rows = '';
  let بالكارت = [];
  if(custSecOpen && lst.length){
  // مقاسة من صورة التصميم A3 المعتمدة نفسها (بكسلات الكروت والأفاتار)
  const _CUST_PALETTE_ = [['#EEF4FF','#1B5CC2'],['#FFF4E8','#D9822B'],['#ECF9F1','#2E9E5B'],['#F3EEFB','#8B4FC9'],['#FDEEF0','#C94F6D'],['#EAF7FA','#1B8AA5'],['#FDF8E0','#A9861B'],['#EFF3F6','#5B7186']];
  const groups = {};
  const order = [];
  list.forEach(o=>{
    const key = String(o.customer||'').trim() || 'بدون اسم';
    if(!groups[key]){ groups[key]=[]; order.push(key); }
    groups[key].push(o);
  });

  // وضع التركيز: ضغطة اسم العميل بتخفي باقي العملاء ويفضّل هو بطلباته بس،
  // وضغطة تانية على نفس الاسم بترجع القايمة كلها (groupOpen بتفضى فوق).
  const _focusName = Object.keys(a.groupOpen)[0] || null;
  const _visibleNames = _focusName ? order.filter(n=>n===_focusName) : order;

  // كل كارت عميل بيتبني لوحده وبيتخزّن بمفتاحه — عشان الرسمة الجاية تقدر
  // تحدّث الكارت اللي اتغيّر بس بدل ما تستبدل الشاشة كلها.
  rows = _visibleNames.map(name=>{
    const orders = groups[name];
    const open = !!a.groupOpen[name];
    const totalQty = orders.reduce((s,o)=>s+(Number(o.qty)||0),0);
    const pdfBusy = a.groupPdfBusy === name;
    const prevBusy = a.groupPreviewBusy === name;
    const imgBusy = a.groupImgBusy === name;
    const _ini = (String(name).trim().replace(/^[^\u0600-\u06FFA-Za-z0-9]+/,'')[0]||'؟');
    // باليت A3 المعتمدة: صبغات شبه بيضاء للكارت + أفاتار مشبع مطابق، ثابتة
    // لكل عميل من هاش اسمه (بدل عجلة الألوان اللي كانت بتطلع درجات طينية).
    const _pal = _CUST_PALETTE_[[...String(name)].reduce((h,c)=>(h*31+c.charCodeAt(0)),0) % _CUST_PALETTE_.length];
    const كارت = `<div class="ord grpa" data-grp="${esc(name)}" style="padding:0;overflow:hidden;--av:${_pal[1]};--cardtint:${_pal[0]}">
      <div class="grp-hd" data-act="adm-toggle-group" data-name="${esc(name)}" data-ini="${esc(_ini)}" style="--av:${_pal[1]}">
        <span style="flex:1;min-width:0">
          <b class="grp-nm" style="font-size:14.5px">${esc(name)}</b>
          <div style="font-size:11.5px;color:#5B6B80;margin-top:2px">${orders.length} طلب · ${totalQty} قطعة</div>
        </span>
        <span class="grp-chev" style="transform:rotate(${open?90:0}deg)">‹</span>
      </div>
      <!-- شريط التقدم مش في التصميم المختار (A) — الحالة ظاهرة في شريطة كل طلب -->
      <!-- سطر لكل طلب: رقمه وتاريخه ويومه، ومعاه معاينة وطباعة للطلب ده لوحده.
           الأزرار كانت قبل كده على مستوى العميل بس — يعني معاينة كل الطلبات مع
           بعض — والسطور كانت متداخلة مع الأزرار في نفس الصف فالشكل بيتلخبط. -->
      ${open&&orders.length>1?`<div class="grp-all">
        <span>كل طلبات العميل مع بعض (بدون صور الأبواب):</span>
        <button class="btn act-tool sm grp-b" data-act="adm-group-preview" data-name="${esc(name)}" ${prevBusy?'disabled':''}
          title="معاينة كل طلبات ${esc(name)} بدون صور الأبواب">${ico("search")}${prevBusy?'…':'معاينة'}</button>
        <button class="btn act-tool sm grp-b" data-act="adm-group-img" data-name="${esc(name)}" ${imgBusy?'disabled':''}
          title="صورة كل طلبات ${esc(name)} بدون صور الأبواب">${ico("share")}${imgBusy?'…':'صورة'}</button>
        <button class="btn act-report sm grp-b" data-act="adm-group-pdf" data-name="${esc(name)}" ${pdfBusy?'disabled':''}
          title="PDF كل طلبات ${esc(name)} بدون صور الأبواب">${ico("doc")}${pdfBusy?'…':'PDF'}</button>
      </div>`:''}
      ${open?`<div class="grp-list">${orders.map(o=>groupOrderRowHTML_(o, a)).join('')}</div>`:''}
      ${open&&a.focusOrder&&orders.some(o=>String(o.id)===String(a.focusOrder))?`<div style="padding:0 10px 10px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)">
        <div style="height:1px"></div>${orderCardHTML_(orders.find(o=>String(o.id)===String(a.focusOrder)))}
      </div>`:''}
    </div>`;
    بالكارت.push({ مفتاح: name, html: كارت });
    return كارت;
  }).join('');
  // قائمة كروت العملاء المباشرة (الشكل القديم المعتمد) بدل شبكة البلاطات — البلاطات كانت بتخبي الطلبات ورا ضغطتين وبتعبّي العين في البحث عن عميل.

  }
  _adminCards = null;

  const _cn = {new:0,prog:0,ready:0,done:0};
  lst.forEach(o=>{ const g=ordGroup_(o.status); if(g in _cn) _cn[g]++; });
  _adminShell = `
    ${staleBar}
    ${secsGrid_()}
    ${secsOpen_()}
    ${verBar()}`;
  return _adminShell.replace(ADMIN_CARDS_MARK, rows);
}

document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('button[data-tab]'); if(!b) return;
  // سايب شاشة «طلب جديد» وفيه صنف مسحوب للتعديل ما اتكملش؟ رجّعه للسلة بدل ما يضيع
  if(b.dataset.tab!=='new') restorePulledLine_();
  if(b.dataset.tab==='new'&&state.tab==='home')fresh357_();
  state.tab=b.dataset.tab; render(); window.scrollTo({top:0,behavior:'smooth'});
  if(state.tab==='orders'||state.tab==='home') maybeLoadTrack_();
  if(state.tab==='new') loadStock();
});

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, p=state.pick;
  switch(a){
    case 'home-go': state.tab = el.dataset.to; if(state.tab==='new' && !(profileOk()&&ownerOk_())) state.newStep='info'; render(); window.scrollTo({top:0,behavior:'smooth'});
      if(state.tab==='orders') maybeLoadTrack_();
      if(state.tab==='new') loadStock();
      break;
    case 'home-sec': state.tab='new';flowSelectCategory276_(el.dataset.to);loadStock();break;
    case 'go-cart': state.tab='cart'; render(); window.scrollTo({top:0}); break;
    case 'pick-door': selectDoor(el.dataset.code); loadStock(); break;
    case 'sec': state.newSection = (state.newSection===el.dataset.s) ? '' : el.dataset.s; save(LS_SECTION,state.newSection); render(); break;
    case 'ord-note-open': showOrdNote_(); break;
    case 'cust-mode': state.custMode = (el.dataset.v==='other') ? 'other' : 'self'; render(); break;
    case 'info-next': if(profileOk() && ownerOk_()){ state.touched=false; state.newStep='items'; render(); window.scrollTo({top:0,behavior:'smooth'}); loadStock(); } else { state.touched=true; render(); } break;
    case 'ui-toggle': { const k=el.dataset.k; const cur = (k==='prof') ? uiOpen_('prof', !profileOk() || state.touched) : uiOpen_(k,false); if(k.startsWith('adm-sec-')&&!cur){for(const section of ['adm-sec-tools','adm-sec-bal','adm-sec-reports','adm-sec-cust'])if(section!==k)_ui[section]=false;} _ui[k] = !cur; render(); break; }   // من غير تمرير لفوق — الصفحة تفضل مكانها
    case 'door-preview': showDoorPreview(el.dataset.code); break;
    case 'preview-select':
      { const ov=document.getElementById('doorPreviewOverlay'); if(ov) ov.remove(); }
      selectDoor(el.dataset.code);
      window.scrollTo({top:0,behavior:'smooth'});
      break;
    case 'toggle-size': {
      const w=Number(el.dataset.w);
      if(p.sizes[w]!=null) delete p.sizes[w]; else p.sizes[w]={qty:'',height:'',frame:null,frameHeight:'',dbror:null,hafr:false,wood:false,print:false,frameKind:null,frameRodQty:'',frameForDoors:''};
      render(); break;
    }
    case 'toggle-custom': p.customOn=!p.customOn; render(); break;
    case 'size-frame': { const w=Number(el.dataset.w); const e=p.sizes[w]; if(e) e.frame=Number(el.dataset.cm); render(); break; }
    case 'size-dbror': { const w=Number(el.dataset.w); const e=p.sizes[w]; if(e) e.dbror=el.dataset.size; render(); break; }
    case 'size-hafr': { const w=Number(el.dataset.w); const e=p.sizes[w]; if(e) e.hafr=(el.dataset.v==='1'); render(); break; }
    case 'cust-hafr': p.custom.hafr=(el.dataset.v==='1'); render(); break;
    case 'size-wood': { const w=Number(el.dataset.w); const e=p.sizes[w]; if(e) e.wood=(el.dataset.v==='1'); render(); break; }
    case 'cust-wood': p.custom.wood=(el.dataset.v==='1'); render(); break;
    case 'size-print': { const w=Number(el.dataset.w); const e=p.sizes[w]; if(e) e.print=(el.dataset.v==='1'); render(); break; }
    case 'cust-print': p.custom.print=(el.dataset.v==='1'); render(); break;
    case 'cust-frame': p.custom.frame=Number(el.dataset.cm); render(); break;
    case 'cust-dbror': p.custom.dbror=el.dataset.size; render(); break;
    case 'fr-cm': state.fr.cm=Number(el.dataset.cm); render(); break;
    case 'fr-code': state.fr.code=el.dataset.code; render(); break;
    case 'fr-doorw': state.fr.doorW=el.dataset.w; render(); break;
    case 'fr-kind': state.fr.kind=el.dataset.k; render(); break;
    case 'fr-brsize': state.fr.brSize=el.dataset.s||''; render(); break;
    case 'fr-nonstd-toggle': state.fr.nonStd=!state.fr.nonStd;
      if(!state.fr.nonStd){ state.fr.jambCm=lenFromCm_(220, state.fr.unit); state.fr.headerCm=lenFromCm_(110, state.fr.unit); state.fr.extra=[]; }
      render(); break;
    case 'fr-extra-add': state.fr.extra=[...(state.fr.extra||[]), {cm:'',qty:''}]; render(); break;
    // ⚠️ تبديل الوحدة لازم يحوّل اللي مكتوب: لو ٢٢٠ سم فضلت ٢٢٠ وإحنا بقينا
    // بالمتر، الطلب يطلع ٢٢٠ متر. بنحوّل كل خانة طول في الشاشة مرة واحدة.
    case 'fr-unit': {
      const قديم = state.fr.unit==='m' ? 'm' : 'cm';
      const جديد = el.dataset.u==='m' ? 'm' : 'cm';
      if(قديم !== جديد){
        const حوّل = v => (v==='' || v==null) ? '' : lenFromCm_(lenToCm_(v, قديم), جديد);
        state.fr.jambCm  = حوّل(state.fr.jambCm);
        state.fr.headerCm = حوّل(state.fr.headerCm);
        state.fr.rodsCm  = حوّل(state.fr.rodsCm);
        state.fr.brLen   = حوّل(state.fr.brLen);
        state.fr.extra = (state.fr.extra||[]).map(x=>({...x, cm:حوّل(x.cm)}));
        state.fr.unit = جديد;
      }
      render(); break;
    }
    case 'br-unit': {
      const قديمB = state.br.unit==='cm' ? 'cm' : 'm';
      const جديدB = el.dataset.u==='cm' ? 'cm' : 'm';
      if(قديمB !== جديدB){
        state.br.len = (state.br.len==='' || state.br.len==null)
          ? '' : lenFromCm_(lenToCm_(state.br.len, قديمB), جديدB);
        state.br.unit = جديدB;
      }
      render(); break;
    }
    case 'fr-extra-del': { const i=Number(el.dataset.i); state.fr.extra.splice(i,1); render(); break; }
    case 'br-size': state.br.size=el.dataset.size; render(); break;
    case 'br-code': state.br.code=el.dataset.code; render(); break;
    case 'mb-code': state.mb.code=el.dataset.code; render(); break;
    case 'mb-wall': state.mb.wall=Number(el.dataset.w); state.mb.wallCustom=false; render(); break;
    case 'mb-wall-custom': state.mb.wallCustom=!state.mb.wallCustom; if(state.mb.wallCustom) state.mb.wallTxt=''; else state.mb.wall=MABRA_WALLS.includes(state.mb.wall)?state.mb.wall:10; render(); break;
    case 'mb-doorw': state.mb.doorW=el.dataset.w; state.mb.custom=false; render(); break;
    case 'mb-custom': state.mb.custom=!state.mb.custom; if(state.mb.custom) state.mb.doorW=''; render(); break;
    case 'add-mb': addMabra(); break;
    case 'pd-code': state.pd.code=el.dataset.code; render(); break;
    case 'sp-code': state.sp.code=el.dataset.code; render(); break;
    case 'vn-code': state.vn.code=el.dataset.code; render(); break;
    case 'add-door': addDoor(); break;
    case 'add-fr': addRod('frame'); break;
    case 'add-br': addRod('bror'); break;
    case 'add-pd': addPanel(); break;
    case 'add-sp': addMeter_('strip'); break;
    case 'add-vn': addMeter_('veneer'); break;
    case 'add-acc': addAccessories(); break;
    case 'del': state.cart.splice(Number(el.dataset.i),1); saveCart_(); render(); break;
    case 'edit-line': editCartLine(Number(el.dataset.i)); break;
    case 'clear': if(confirm('تفريغ السلة بالكامل؟')){state.cart=[];saveCart_();render();} break;
    case 'submit': submitOrderGuarded_(); break;
    case 'ord-pdf':   withOrder(el,o=>makeDoc(mergeProducedFromTrack_(o),'order')); break;
    case 'ord-pdf-eco':withOrder(el,o=>makeDoc(mergeProducedFromTrack_(o),'order',undefined,true)); break;
    case 'ord-xls':   withOrder(el,o=>exportExcel([mergeProducedFromTrack_(o)],'طلب_'+orderNoText_(o).replace('/','-'))); break;
    case 'all-xls':   exportExcel(state.orders.map(mergeProducedFromTrack_),'كل_الطلبات'); break;

// لو رد "تابع طلبك" (list بالـphone) بيرجّع أصناف الطلب مع حقل produced، بنحطه على نسخة الطلب المحلية
// عشان مستند/صورة العميل يوري جاهز/متبقي محدّث. لو السيرفر لسه مابيرجعش الحقل ده، محصلش تغيير (0 آمن افتراضيًا).
// ⚠️ باج كان هنا: الدمج كان بالترتيب — الصنف رقم ١ عندي = الصنف رقم ١ عند
// السيرفر. لكن المصنع بيحذف أصناف ويعدّل كميات من شاشته، وسطور السيرفر
// بتزحلق ونسخة الموزّع زي ما هي. فأرقام «الجاهز» كانت بتتحط على أصناف تانية
// خالص — الموزّع يقرا إن باب جاهز وهو لسه ما اتعملش. دلوقتي المطابقة بالهوية
// (النوع + الكود + المقاس + الارتفاع)، والصنف اللي مالوش سطر عند السيرفر
// مابياخدش رقم حد تاني.
function producedKey_(type, code, size, doorHeight){
  return [type||'', String(code||'').trim(), String(size||'').trim(),
          String(doorHeight||'').trim()].join('|');
}
function cartItemKey_(it){
  const type = it.kind==='door' ? 'Door'
             : it.kind==='frame' ? 'Frame'
             : it.kind==='bror'  ? 'Bror'
             : it.kind==='panel' ? 'Panel'
             : it.kind==='mabra' ? 'Mabra'
             : METER_KINDS_[it.kind] ? METER_KINDS_[it.kind].type : 'Accessory';
  const size = it.kind==='door' ? (it.sizeEn||it.sizeTxt||'') : (it.spec||'');
  return producedKey_(type, it.code, size, it.doorHeight);
}
function mergeProducedFromTrack_(o){
  const live = (state.track.rows||[]).find(r=>String(r.id)===String(o.id));
  if(live && Array.isArray(live.items)){
    // أصناف متطابقة تمامًا (نفس الباب مرتين) بتتاخد بالترتيب — كل واحد بياخد
    // سطر لسه محدّش خده.
    const مأخوذ = new Set();
    (o.items||[]).forEach(it=>{
      const key = cartItemKey_(it);
      const idx = live.items.findIndex((li,i)=>!مأخوذ.has(i) &&
        producedKey_(li.type, li.code, li.size, li.doorHeight) === key);
      if(idx<0) return;                 // مالوش سطر عند السيرفر — مانخمّنش
      مأخوذ.add(idx);
      const li = live.items[idx];
      if(li.produced!==undefined) it.produced = li.produced;
    });
  }
  return o;
}

document.addEventListener('input',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a==='adm-pw'){ state.admin.pw=el.value; const b=document.querySelector('[data-act="adm-login"]'); if(b) b.disabled=!el.value; return; }
  if(a==='prof'){
    // الموبايل بيتخزّن بأرقام لاتينية دايمًا — لو الموزع كتبه بالعربي بنحوّله
    // على طول عشان يتقبل هنا ويتطابق مع السيرفر بعدين.
    state.profile[el.dataset.k] = (el.dataset.k==='phone') ? toLatinDigits_(el.value) : el.value;
    save(LS_PROFILE,state.profile); return;
  }
  if(a==='cust'){
    const k=el.dataset.k;
    const v = (k==='w'||k==='h') ? decIn_(el.value) : el.value;
    const wasReady = customReady_(state.pick);
    state.pick.custom[k]=v;
    if(el.value!==v) el.value=v;
    refreshSummary();
    // خيارات الحلق والبرور بتظهر بس لما المقاس الخاص يكتمل — لازم نرسم الشاشة تاني أول ما يكتمل (أو يبطل يكتمل)
    if(wasReady !== customReady_(state.pick)) render();
    return;
  }
  if(a==='pick-note'){ state.pick.note=el.value; return; }
  if(a==='cust-name'){ state.customer.name=el.value; return; }
  if(a==='cust-phone'){ state.customer.phone=toLatinDigits_(el.value); return; }
  if(a==='cust-region'){ state.customer.region=el.value; return; }
  if(a==='edit-date'){ state.editingDate=el.value; return; }
  if(a==='edit-meta-customer'){ if(state.editingMeta) state.editingMeta.customer=el.value; return; }
  if(a==='edit-meta-phone'){ if(state.editingMeta) state.editingMeta.customerPhone=toLatinDigits_(el.value); return; }
  if(a==='stock-in'){
    state.admin.stockDraft[el.dataset.code+'|'+el.dataset.w] = el.value;
    el.classList.add('dirty');
    const b=document.querySelector('[data-act="stock-save"]'); if(b) b.disabled=false;
    return;
  }
  if(a==='ord-note'){ state.orderNote=el.value; return; }
  if(a==='size-height'){ const w=Number(el.dataset.w); const e=state.pick.sizes[w]; if(e) e.height=decIn_(el.value); if(el.value!==e.height) el.value=e.height; refreshSummary(); return; }
  if(a==='size-frame-height'){ const w=Number(el.dataset.w); const e=state.pick.sizes[w]; if(e) e.frameHeight=decIn_(el.value); if(el.value!==e.frameHeight) el.value=e.frameHeight; return; }
  if(a==='cust-frame-height'){ state.pick.custom.frameHeight=decIn_(el.value); if(el.value!==state.pick.custom.frameHeight) el.value=state.pick.custom.frameHeight; return; }
  if(a==='size-frame-rodqty'){ const w=Number(el.dataset.w); const e=state.pick.sizes[w]; if(e) e.frameRodQty=el.value; return; }
  if(a==='cust-frame-rodqty'){ state.pick.custom.frameRodQty=el.value; return; }
  if(a==='size-frame-fordoors'){ const w=Number(el.dataset.w); const e=state.pick.sizes[w]; if(e) e.frameForDoors=el.value; return; }
  if(a==='cust-frame-fordoors'){ state.pick.custom.frameForDoors=el.value; return; }
  if(a==='size-qty-set'){ const w=Number(el.dataset.w); const e=state.pick.sizes[w]; if(e) e.qty=el.value; refreshSummary(); return; }
  if(a==='cust-qty-set'){ const wasReady=customReady_(state.pick); state.pick.custom.qty=el.value; refreshSummary(); if(wasReady!==customReady_(state.pick)) render(); return; }
  if(a==='acc-set'){ state.acc[el.dataset.id]=rodQty_(el.value); refreshAccBtn(); return; }
  if(a==='fr-jambCm'){ state.fr.jambCm=decIn_(el.value); render(); return; }
  if(a==='fr-headerCm'){ state.fr.headerCm=decIn_(el.value); render(); return; }
  if(a==='fr-qty'){ state.fr.qty=el.value; render(); return; }
  if(a==='fr-brqty'){ state.fr.brQty=el.value; render(); return; }
  if(a==='fr-brlen'){ state.fr.brLen=decIn_(el.value); render(); return; }
  if(a==='fr-rods'){ state.fr.rods=el.value; render(); return; }
  if(a==='fr-rodsCm'){ state.fr.rodsCm=decIn_(el.value); render(); return; }
  if(a==='fr-extra-cm'){ state.fr.extra[Number(el.dataset.i)].cm=decIn_(el.value); render(); return; }
  if(a==='fr-extra-qty'){ state.fr.extra[Number(el.dataset.i)].qty=el.value; render(); return; }
  if(a==='fr-note'){ state.fr.note=el.value; return; }
  if(a==='br-rods'){ state.br.rods=el.value; refreshRodBtn('add-br'); return; }
  if(a==='br-len'){ state.br.len=decIn_(el.value); render(); return; }
  if(a==='mb-qty'){ state.mb.qty=el.value; refreshMabraBtn_(); return; }
  if(a==='mb-wall-txt'){ state.mb.wallTxt=el.value; refreshMabraBtn_(); return; }
  if(a==='mb-w'){ state.mb.w=el.value; refreshMabraBtn_(); return; }
  if(a==='mb-h'){ state.mb.h=el.value; refreshMabraBtn_(); return; }
  if(a==='pd-qty'){ state.pd.qty=el.value; refreshPanelBtn(); return; }
  if(a==='sp-qty'){ state.sp.qty=el.value; refreshMeterBtn_('strip'); return; }
  if(a==='vn-qty'){ state.vn.qty=el.value; refreshMeterBtn_('veneer'); return; }
  if(a==='price-set'){
    const pe=state.admin.priceEdit; if(!pe) return;
    const v=parseFloat(el.value)||0, g=el.dataset.group, k=el.dataset.key, tier=el.dataset.tier;
    if(g==='customExtra') pe.customExtra[tier]=v;
    else if(g==='woodExtra') pe.woodExtra[tier]=v;
    else if(g==='printExtra'){ pe.printExtra = pe.printExtra || {dist:0,showroom:0}; pe.printExtra[tier]=v; }
    else if(g==='hafrExtra') pe.hafrExtra[tier]=v;
    else if(pe[g][k]) pe[g][k][tier]=v;
    return;
  }
  if(a==='prod-set'){
    const key = el.dataset.id+':'+el.dataset.idx;
    state.admin.prodEdit[key] = el.value;
    return;
  }
  if(a==='item-qty-set'){
    const key = el.dataset.id+':'+el.dataset.idx;
    state.admin.qtyEdit[key] = el.value;
    return;
  }
  if(a==='item-recv-set'){
    const key = el.dataset.id+':'+el.dataset.idx;
    state.admin.recvEdit[key] = el.value;
    return;
  }
  if(a==='meta-customer'){
    const id = el.dataset.id;
    if(!state.admin.metaEdit[id]){
      const o=adminOrderById_(id);
      state.admin.metaEdit[id] = {customer:(o&&o.customer)||'', date:(o&&o.date)||'', region:(o&&o.customerRegion)||''};
    }
    state.admin.metaEdit[id].customer = el.value;
    return;
  }
  if(a==='meta-date'){
    const id = el.dataset.id;
    if(!state.admin.metaEdit[id]){
      const o=adminOrderById_(id);
      state.admin.metaEdit[id] = {customer:(o&&o.customer)||'', date:(o&&o.date)||'', region:(o&&o.customerRegion)||''};
    }
    state.admin.metaEdit[id].date = el.value;
    return;
  }
  if(a==='meta-region'){
    const id = el.dataset.id;
    if(!state.admin.metaEdit[id]){
      const o=adminOrderById_(id);
      state.admin.metaEdit[id] = {customer:(o&&o.customer)||'', date:(o&&o.date)||'', region:(o&&o.customerRegion)||''};
    }
    state.admin.metaEdit[id].region = el.value;
  }
});

// زرار الإكسسوارات كان بيفضل مقفول لو الموزع كتب الكمية بإيده بدل ما يضغط +
// لأن الصفحة مش بتترسم وقت الكتابة — فبنحدّثه هنا يدوي.
function refreshAccBtn(){
  const b=document.querySelector('[data-act="add-acc"]'); if(!b) return;
  const t=ACCESSORIES.reduce((sum,a)=>sum+(state.acc[a.id]||0)*a.price,0);
  b.disabled = !(t>0);
  b.textContent = t>0 ? 'أضف الإكسسوارات' : 'اختر الكميات أولاً';
}

// جاهز للإضافة؟ كل مقاس مختار لازم يكون له كمية مكتوبة (مفيش كمية افتراضية عشان الموظف مايفوتهاش) + حلق + برور
function doorReady_(p){
  const ws = Object.keys(p.sizes).map(Number);
  const cr = customReady_(p);
  if(!p.code || (!ws.length && !cr)) return false;
  if(!ws.every(w=>wholeQuantity_(p.sizes[w].qty)>0 && p.sizes[w].frame!=null && p.sizes[w].dbror!=null)) return false;
  return !p.customOn || (cr && p.custom.frame!=null && p.custom.dbror!=null);
}
function refreshSummary(){
  const n=document.getElementById('sumline'); if(n) n.textContent=currentSummary();
  const b=document.querySelector('[data-act="add-door"]');
  if(b){ const ok=doorReady_(state.pick); b.disabled=!ok; b.textContent = ok ? 'أضف الأبواب للسلة' : 'اكتب الكمية وحدد الحلق والبرور لكل مقاس'; }
}

// زرار إضافة ألواح البروديوم — بيتحدّث من غير render كامل عشان الكيبورد ما يقفلش وإحنا بنكتب
function refreshPanelBtn(){
  const b=document.querySelector('[data-act="add-pd"]'); if(!b) return;
  const q=wholeQuantity_(state.pd.qty);
  b.disabled=!(q>0 && state.pd.code);
  b.textContent = !state.pd.code ? 'اختر اللون الأول (كود الباب)'
    : (q>0 ? `أضف ${q} لوح بروديوم — ${state.pd.code}` : 'اكتب عدد الألواح');
}

// بنحدّث زرار الإضافة من غير render عشان الكيبورد ما يقفلش وإحنا بنكتب
// زرار البرور بس — الحلق بقى عدادين فبيترسم كامل مع render()
function refreshRodBtn(act){
  const b=document.querySelector('[data-act="'+act+'"]'); if(!b) return;
  // ⚠️ addRod بتقرّب العدد (Math.round) لكن الزرار كان بيعرض الرقم زي ما اتكتب.
  // يعني «أضف 2.5 عود» وبتتضاف ٣ — الزرار كان بيوعد بحاجة والإضافة تعمل غيرها.
  // نفس تقريب البروديوم بالظبط.
  const r=rodQty_(state.br.rods), s=BRORS.find(x=>x.size===state.br.size)||BRORS[0];
  b.disabled=!(r>0 && state.br.code);
  b.textContent = !state.br.code ? 'اختر اللون الأول (كود الباب)'
    : (r>0 ? `أضف ${r} عود برور ${s.size} — ${state.br.code}` : 'اكتب عدد العيدان');
}

/* ============================================================
   السلة
   ============================================================ */
async function addDoor(){
  if(Object.values(state.pick.sizes||{}).some(e=>!wholeQuantity_(e.qty))||(state.pick.customOn&&!wholeQuantity_(state.pick.custom.qty))){toast('اكتب عدد أبواب صحيح أكبر من صفر');return;}
  const p=state.pick;
  const widths = Object.keys(p.sizes).map(Number).filter(w=>(Number((p.sizes[w]||{}).qty)||0)>0);
  const customReady = customReady_(p);
  if(Object.keys(p.sizes).some(w=>!(Number(p.sizes[w].qty)>0))){ toast('اكتب الكمية لكل مقاس مختار'); return; }
  if(!p.code || (!widths.length && !customReady)){
    toast('اختر مقاس واحد على الأقل'); return;
  }
  if(widths.some(w=>{ const e=p.sizes[w]; return e.frame==null || e.dbror==null; }) || (customReady && (p.custom.frame==null||p.custom.dbror==null))){
    toast('حدد الحلق والبرور لكل مقاس مختار'); return;
  }
  const chosen=widths.map(w=>p.sizes[w]).concat(customReady?[p.custom]:[]);
  try{await requirePrintLocal_(chosen.map(e=>({...e,kind:'door'})));}catch(err){toast(err.message,6500);return;}
  const oldCart=state.cart.slice();
  const d=doorByCode(p.code);
  const addedTxts=[];

  widths.forEach(w=>{
    const e=p.sizes[w];
    const qty=wholeQuantity_(e.qty);
    // ارتفاع الفتحة المعمارية اختياري ولكل مقاس ارتفاعه الخاص بيه (المقاس الخاص أصلًا بياخد ارتفاعه من حقل الطول بتاعه)
    const doorHeight = e.height ? Number(e.height) : 0;
    const sizeTxt=w+' سم', sizeEn=w+' cm', unitPrice=priceForWidth(w,e.hafr);
    const frameKind = e.frame ? (e.frameKind||'full') : null;
    state.cart.push({
      kind:'door',
      title:'باب '+d.code+' '+d.name+(e.hafr?' (حفر)':'')+(e.print?' (طباعة)':'')+approvedPrintSuffix_(e),
      titleEn:'WPC Door '+d.code+' - '+d.en+(e.hafr?' (Carved)':'')+(e.print?' (Print)':'')+approvedPrintSuffix_(e),
      code:d.code, img:d.img, sizeTxt, sizeEn, unitPrice, qty,
      w,   // العرض بالسم كرقم خام — لخصم الرصيد بدقة
      frame:e.frame||0, dbror:e.dbror||'', frameHeight:e.frameHeight?Number(e.frameHeight):0,
      frameKind, frameRodQty:frameKind==='rods'?(e.frameRodQty||''):'', frameForDoors:frameKind==='rods'?(e.frameForDoors||''):'',
      note: [frameKind==='rods' ? frameKindNote_('rods', e.frameRodQty, e.frameForDoors) : '', (p.note||'').trim()].filter(Boolean).join(' — '),
      doorHeight, ...(e.print?approvedPrintFields_(e):{}), printArt:e.print?e.printArt||'':'', engraveArt:e.hafr?e.engraveArt||'':'', hafr:!!e.hafr, wood:!!e.wood, print:!!e.print, millEn:e.hafr?'Carved':''
    });
    addedTxts.push(doorSizeText_(sizeTxt,doorHeight)+' × '+qty);
  });

  if(customReady){
    const w=Number(p.custom.w), h=Number(p.custom.h), qty=wholeQuantity_(p.custom.qty);
    // ⚠️ المقاس الخاص كان بيتضاف عليه CUSTOM_EXTRA في السعر. دلوقتي السعر زي
    // سعر المقاس العادي بالظبط، و«خدمة قص» بتتكتب كسطر تحت الصنف — تبان
    // للمصنع وللعميل من غير ما تتحسب في الفلوس.
    const sizeTxt=w+'×'+h+' سم (مقاس خاص)', sizeEn=w+'x'+h+' cm (custom)', unitPrice=priceForWidth(w,p.custom.hafr);
    const customFrameKind = p.custom.frame ? (p.custom.frameKind||'full') : null;
    state.cart.push({
      kind:'door',
      title:'باب '+d.code+' '+d.name+(p.custom.hafr?' (حفر)':'')+(p.custom.print?' (طباعة)':'')+approvedPrintSuffix_(p.custom),
      titleEn:'WPC Door '+d.code+' - '+d.en+(p.custom.hafr?' (Carved)':'')+(p.custom.print?' (Print)':'')+approvedPrintSuffix_(p.custom),
      code:d.code, img:d.img, sizeTxt, sizeEn, unitPrice, qty,
      w:'',   // مقاس خاص مش متتبّع في المخزون
      frame:p.custom.frame||0, dbror:p.custom.dbror||'', frameHeight:p.custom.frameHeight?Number(p.custom.frameHeight):0,
      frameKind:customFrameKind, frameRodQty:customFrameKind==='rods'?(p.custom.frameRodQty||''):'', frameForDoors:customFrameKind==='rods'?(p.custom.frameForDoors||''):'',
      // «خدمة قص» مابقتش ملحوظة — بقت بند مستقل بسعره تحت الباب (syncCutServiceLines_)
      note: [customFrameKind==='rods' ? frameKindNote_('rods', p.custom.frameRodQty, p.custom.frameForDoors) : '',
             (p.note||'').trim()].filter(Boolean).join(' — '),
      doorHeight:0, ...(p.custom.print?approvedPrintFields_(p.custom):{}), printArt:p.custom.print?p.custom.printArt||'':'', engraveArt:p.custom.hafr?p.custom.engraveArt||'':'', hafr:!!p.custom.hafr, wood:!!p.custom.wood, print:!!p.custom.print, millEn:p.custom.hafr?'Carved':''
    });
    addedTxts.push(sizeTxt+' × '+qty);
  }

  if(!saveCart_()){state.cart=oldCart;toast('تعذّر حفظ السلة؛ الصورة والاختيارات محفوظين. فضّي مساحة وجرّب تاني',6500);return;}
  clearPulledLine_();
  toast('اتضاف للسلة: '+d.code+' — '+addedTxts.join('، '));
  // نلمّ الاختيارات ونقفل اللوحة عشان يختار باب تاني بارتياح
  state.pick={code:'', sizes:{}, customOn:false, note:'', custom:{w:'',h:'',qty:'',frame:null,frameHeight:'',dbror:null,hafr:false,wood:false,print:false,frameKind:null,frameRodQty:'',frameForDoors:''}};
  render();
}

function addRod(kind){
  if(kind==='frame'&&state.fr.kind!=='rods'&&state.fr.brSize&&!(rodQty_(state.fr.brQty)>0)){toast('اكتب عدد البرور لكل طقم');return;}
  const isFrame = kind==='frame';
  const st = isFrame?state.fr:state.br;
  if(!st.code){toast('اختر اللون (كود الباب) الأول — الحلق/البرور بيتصنّع بلون');return;}
  const dName = (DOORS.find(x=>x.code===doorCode_(st.code))||{}).name || '';

  // بيضيف/بيجمّع سطر عود واحد في السلة (كل مقاس سطر مستقل)
  const push = (spec, cm, qty, perM, titleAr, titleEn) => {
    const key = kind+'|'+spec+'|'+cm+'|'+st.code+'|'+(st.doorW||'');
    const ex = state.cart.find(it=>it.kind===kind && it.key===key);
    if(ex){ ex.qty += qty; return; }
    state.cart.push({
      kind, key, qty, code:st.code, rodCm:cm, perM,
      price: rodPrice(perM, cm),
      spec:  spec+' — '+cm+' سم'+(st.code?' — '+st.code:''),
      title: titleAr, titleEn,
      doorW: isFrame ? (st.doorW||'') : '', note: isFrame ? (st.note||'') : ''
    });
  };

  let added = 0;
  let addedIsSet = false;
  if(isFrame){
    const f = FRAMES.find(x=>x.cm===st.cm)||FRAMES[0];
    const forDoor = st.doorW ? ' — لباب '+st.doorW+' سم' : '';
    // ⚠️ ده كان اسمه kind كمان — وبيحجب باراميتر الدالة نفسه (frame/bror) جوّه
    // البلوك ده. اشتغل صح بالصدفة لأن push() اتعرّفت قبله فبتقفل على الأصلي،
    // والسطر اللي جاي بيكتب 'frame' بالنص بدل ما يستعمل المتغيّر. أي سطر جديد
    // يستعمل kind هنا كان هيقارن بـ'full' من غير ما حد ياخد باله.
    const frameMode = st.kind==='rods' ? 'rods' : 'full';
    if(frameMode==='full'){
      const qty = rodQty_(st.qty);
      const jambCm = Math.max(1, frCm_(st.jambCm)||220);
      const headerCm = Math.max(1, frCm_(st.headerCm)||110);
      const extra = (st.extra||[]).map(x=>({cm:Math.max(0,frCm_(x.cm)), qty:rodQty_(x.qty)})).filter(x=>x.cm>0 && x.qty>0);
      const isStd = (jambCm===220 && headerCm===110 && !extra.length);
      if(qty<=0){toast('اكتب الكمية');return;}
      if(isStd){
        // الحالة الاستاندر: سطر واحد "حلق كامل" بعدد الأطقم — من غير تفاصيل قائم/عارضة حلق علوية/الطول لأنها معروفة للمصنع
        const setPrice = Math.round((rodPrice(f.price,220)*JAMBS_PER_SET + rodPrice(f.price,110)*HEADERS_PER_SET)*100)/100;
        const key = 'frame|fullset|'+f.cm+'|'+st.code+'|'+(st.doorW||'');
        const ex = state.cart.find(it=>it.kind===kind && it.key===key);
        if(ex){ ex.qty += qty; }
        else{
          state.cart.push({
            kind:'frame', key, qty, code:st.code, rodCm:0, isSet:true, perM:f.price, price:setPrice, frCm:f.cm,
            spec: 'حلق كامل '+f.cm+' سم'+(st.code?' — '+st.code:''),
            title: 'حلق كامل باب '+f.cm+' سم'+(st.code?' — '+st.code+(dName?' '+dName:''):'')+forDoor+(st.note?' — ملاحظة: '+st.note:''),
            titleEn: 'Full Door Frame '+f.cm+' cm'+(st.code?' - '+st.code:''),
            doorW: st.doorW||'', note: st.note||''
          });
        }
        added += qty;
        addedIsSet = true;
      } else {
        // ⚠️ كان بيتقسّم لسطرين/تلاتة (قائم لوحده، عارضة حلق علوية لوحدها، أي عود إضافي لوحده)
        // كل واحد بمقاسه في سطر مستقل بالسلة. طلب إن ده يبقى سطر واحد بعدد الأعواد
        // الإجمالي (زي "٣ أعواد")، والأطوال المختلفة تتكتب في وصف السطر نفسه.
        const jamb = qty*JAMBS_PER_SET;
        const header = qty*HEADERS_PER_SET;
        const parts = [];
        if(jamb)   parts.push({label:'قائم',        cm:jambCm,   qty:jamb});
        if(header) parts.push({label:'عارضة حلق علوية', cm:headerCm, qty:header});
        extra.forEach(x=>{ if(x.qty>0) parts.push({label:'عود', cm:x.cm, qty:x.qty}); });

        const totalQty = parts.reduce((s,p)=>s+p.qty,0);
        if(totalQty>0){
          const totalPrice = parts.reduce((s,p)=>s+rodPrice(f.price,p.cm)*p.qty,0);
          // ⚠️ التقريب لقرشين هنا كان بيخلي (سعر العود × العدد) ≠ مجموع الأعواد
          // الحقيقي — ٤ قروش فرق على سطر واحد، وبتكبر مع الطلبات الكبيرة.
          const avgPrice = Math.round((totalPrice/totalQty)*10000)/10000;
          const breakdown = parts.map(p=>p.label+' '+p.cm+' سم × '+p.qty).join(' + ');
          const sig = parts.map(p=>p.cm+':'+p.qty).join(',');
          const key = 'frame|customset|'+f.cm+'|'+sig+'|'+st.code+'|'+(st.doorW||'');
          const ex = state.cart.find(it=>it.kind===kind && it.key===key);
          if(ex){ ex.qty += totalQty; ex.setsQty=(ex.setsQty||0)+qty; }
          else{
            state.cart.push({
              kind:'frame', key, qty:totalQty, code:st.code, rodCm:jambCm, perM:f.price, price:avgPrice, frCm:f.cm,
              customSet:true, setsQty:qty, jambCm, headerCm, extra,
              spec: breakdown+(st.code?' — '+st.code:''),
              title: 'حلق باب '+f.cm+' سم — '+breakdown+(st.code?' — '+st.code+(dName?' '+dName:''):'')+forDoor+(st.note?' — ملاحظة: '+st.note:''),
              titleEn: 'Door Frame '+f.cm+' cm - '+parts.map(p=>p.label+' '+p.cm+'cm x'+p.qty).join(' + ')+(st.code?' - '+st.code:''),
              doorW: st.doorW||'', note: st.note||''
            });
          }
          added += totalQty;
        }
      }
      // برور مع الحلق الكامل: سطر برور عادي (نفس لون الحلق) بعدد = عدد البرور لكل طقم × الأطقم.
      // بنفس مفتاح سطر «برور فقط» عشان لو نفس المقاس/اللون موجود يتجمّعوا.
      if(st.brSize){
        const perSet = rodQty_(st.brQty);
        const bb = BRORS.find(x=>x.size===st.brSize);
        if(bb && perSet>0){
          const brTotal = Math.round(perSet*qty*100)/100;
          const rodCm = (st.brLen===''||st.brLen==null) ? BROR_ROD_CM : Math.max(1, frCm_(st.brLen)||BROR_ROD_CM);
          const spec = bb.size+' — '+rodCm+' سم'+(st.code?' — '+st.code:'');
          const bkey = 'bror|'+bb.size+'|'+rodCm+'|'+st.code+'|';
          const bex = state.cart.find(it=>it.kind==='bror' && it.key===bkey);
          if(bex){ bex.qty = Math.round((Number(bex.qty)+brTotal)*100)/100; }
          else{
            state.cart.push({
              kind:'bror', key:bkey, qty:brTotal, code:st.code, rodCm, perM:bb.price,
              price: rodPrice(bb.price, rodCm), spec,
              title: 'برور '+bb.size+' — عود '+rodCm+' سم'+(st.code?' — '+st.code+(dName?' '+dName:''):''),
              titleEn: 'Bror '+bb.size+' - '+rodCm+'cm rod'+(st.code?' - '+st.code:''),
              doorW:'', note:''
            });
          }
        }
      }
    } else {
      const rods = rodQty_(st.rods);   // بيقبل الكسور — نص عود/ربع عود تكملة
      // ⚠️ الطول بقى بيقبل كسور (220.5) في الشاشة، لكن الإضافة الفعلية كانت
      // لسه بتقرّبه لصحيح — فاللي بيتحفظ في الطلب غير اللي المستخدم كتبه.
      const rodsCm = Math.max(0, frCm_(st.rodsCm));
      if(rods<=0 || rodsCm<=0){toast('اكتب عدد الأعواد وطولها');return;}
      push(f.cm+' سم', rodsCm, rods, f.price,

        'حلق باب '+f.cm+' سم — عود '+rodsCm+' سم'+(st.code?' — '+st.code+(dName?' '+dName:''):'')+forDoor+(st.note?' — ملاحظة: '+st.note:''),
        'Door Frame '+f.cm+' cm - rod '+rodsCm+'cm'+(st.code?' - '+st.code:''));
      added += rods;
    }
    // ⚠️ الافتراضيات ٢٢٠/١١٠ بالسنتي — لو الشاشة واقفة على المتر لازم تتكتب
    // بالمتر، وإلا الطلب اللي بعده يطلع «٢٢٠ متر».
    state.fr.jamb=2; state.fr.header=1;
    state.fr.jambCm=lenFromCm_(220, state.fr.unit); state.fr.headerCm=lenFromCm_(110, state.fr.unit);
    state.fr.extra=[]; state.fr.rods=''; state.fr.rodsCm=''; state.fr.doorW=''; state.fr.note=''; state.fr.qty=''; state.fr.nonStd=false;
    state.fr.brSize=''; state.fr.brQty=''; state.fr.brLen='';
  } else {
    const b = BRORS.find(x=>x.size===st.size)||BRORS[0];
    const rods = rodQty_(st.rods);
    if(rods<=0){toast('اكتب عدد العيدان');return;}
    // طول العود قابل للتغيير (افتراضيًا الطول القياسي) — عشان لو حد طلب عيدان مقاس مختلف زي ٣م
    const rodCm = brRodCm_(st.len===''||st.len==null ? BROR_ROD_M_DEFAULT : st.len, st.unit);
    push(b.size, rodCm, rods, b.price,
      'برور '+b.size+' — عود '+rodCm+' سم'+(st.code?' — '+st.code+(dName?' '+dName:''):''),
      'Bror '+b.size+' - '+rodCm+'cm rod'+(st.code?' - '+st.code:''));
    added = rods;
    state.br.rods=''; state.br.len=lenFromCm_(rodCm, state.br.unit) || BROR_ROD_M_DEFAULT;
  }

  saveCart_();
  clearPulledLine_();
  toast(addedIsSet ? ('اتضاف '+added+' طقم حلق كامل') : ('اتضاف '+added+' عود'));
  render();
}

// معبرة: العرض والارتفاع بالسم — الاستاندر (عرض الباب × 215) أو مقاس خاص مكتوب
function mbDims_(){
  const m = state.mb;
  if(m.custom) return { w:Number(decIn_(m.w))||0, h:Number(decIn_(m.h))||0 };
  return { w:Number(m.doorW)||0, h:DOOR_STD_HEIGHT };
}
// سمك الحيطة: واحد من الاستاندر (10/15/20) أو مقاس آخر مكتوب بالإيد
function mbWall_(){
  const m = state.mb;
  if(m.wallCustom){ const n = Number(decIn_(m.wallTxt)); return n>0 ? Math.round(n*100)/100 : 0; }
  return Number(m.wall)||0;
}
function mbQty_(){ return wholeQuantity_(state.mb.qty); }
function mbNum_(n){ return String(Math.round(Number(n)*100)/100); }
function mbSpec_(wall, h, w){ return wall+' سم — '+mbNum_(h)+'×'+mbNum_(w); }
function parseMabraSpec_(spec){
  const m = /^(\d+(?:\.\d+)?)\s*سم\s*—\s*(\d+(?:\.\d+)?)×(\d+(?:\.\d+)?)/.exec(String(spec||'').trim());
  return m ? { wall:Number(m[1]), h:Number(m[2]), w:Number(m[3]) } : null;
}
function mbBtnLabel_(){
  const st=state.mb, d=mbDims_(), q=mbQty_();
  if(!st.code) return 'اختر اللون الأول (كود الباب)';
  if(!(mbWall_()>0)) return 'اكتب سمك الحيطة';
  if(!(d.w>0)) return st.custom ? 'اكتب عرض المعبرة' : 'اختر العرض';
  if(!(d.h>0)) return 'اكتب ارتفاع المعبرة';
  if(!(q>0)) return 'اكتب عدد المعابر';
  return `أضف ${q} معبرة — ${mbNum_(mbWall_())} سم — ${mbNum_(d.h)}×${mbNum_(d.w)} — ${st.code}`;
}

// تعديل صنف موجود في السلة: بنشيله من السلة ونفتحله شاشة الاختيار بنفس بياناته
// جاهزة قدام العين — لما يدوس «أضف» تاني بيرجع يتضاف بالتعديلات الجديدة.
// ⚠️ باج كان هنا: الدالة دي بتشيل الصنف من السلة على طول وتحطّ بياناته في شاشة الاختيار.
// لو المستخدم غيّر رأيه (رجع لتبويب تاني، أو قفل التطبيق) الصنف كان بيضيع خالص من غير
// ما ياخد باله. دلوقتي بنمسك نسخة منه، وبنرجّعها تلقائي لو ساب الشاشة من غير ما يضيف.
let _pulledLine = null;

// بيصفّر شاشة الاختيار اللي editCartLine ملّتها ببيانات الصنف.
// ⚠️ لازم تتنده مع أي رجوع للصنف: من غيرها الصنف بيرجع للسلة والشاشة تفضل مليانة
// ببياناته، فأول ضغطة على «أضف» بتحطّه تاني — يعني نسختين من نفس الصنف.
function resetPickerFor_(kind){
  if(kind==='door'){
    state.pick = {code:'', sizes:{}, customOn:false, note:'',
      custom:{w:'',h:'',qty:'',frame:null,frameHeight:'',dbror:null,hafr:false,wood:false,print:false,
              frameKind:null,frameRodQty:'',frameForDoors:''}};
  } else if(kind==='frame'){
    state.fr = {cm:10, code:'', doorW:'', kind:'full', qty:'', brSize:'', brQty:'', brLen:'', nonStd:false,
                jamb:2, header:1, jambCm:220, headerCm:110, extra:[], rods:'', rodsCm:'', note:'', unit:'cm'};
  } else if(kind==='bror'){
    state.br = {size:'6×9', code:'', rods:'', len:BROR_ROD_M_DEFAULT, unit:'m'};
  } else if(kind==='mabra'){
    state.mb = {wall:10, wallCustom:false, wallTxt:'', code:'', doorW:'', custom:false, w:'', h:'', qty:''};
  } else if(kind==='panel'){
    state.pd = {code:'', qty:''};
  } else if(kind==='strip' || kind==='veneer'){
    state[METER_KINDS_[kind].st] = {code:'', qty:''};
  } else if(kind==='acc'){
    state.acc = {};
  }
}

// بيرجّع الصنف اللي اتسحب للتعديل لو المستخدم ما كمّلش التعديل
function restorePulledLine_(silent){
  if(!_pulledLine) return false;
  const { item, index, kind } = _pulledLine;
  _pulledLine = null;
  state.cart.splice(Math.min(index, state.cart.length), 0, item);
  saveCart_();
  resetPickerFor_(kind);          // لازم تتصفّر مع الرجوع، وإلا الصنف بيتكرر
  if(!silent) toast('رجّعنا «'+(item.title||'الصنف')+'» للسلة — التعديل ما اتكملش');
  return true;
}
// بيتنده بعد أي إضافة ناجحة — يعني التعديل خلص فعلاً ومفيش حاجة نرجّعها
function clearPulledLine_(){ _pulledLine = null; }

// ⚠️ السطر المدموج (قوائم + عوارض + أعواد إضافية) بيتخزّن على الشيت بوصفه بس:
// «قائم 200 سم × 4 + عارضة حلق علوية 120 سم × 2 + عود 180.5 سم × 2».
// لما الطلب كان بيرجع للتعديل، الأطوال دي مكانتش بتترجع لشاشة الحلق — فأول ما
// حد يسحب السطر ليعدّله بيتحوّل لطقم ٢٢٠/١١٠ استاندر من غير ما حد ياخد باله،
// والمصنع يقطّع الحلق غلط. الدالة دي بتقرأ التفصيل من النص وترجّعه زي ما كان.
function parseFrameBreakdown_(txt){
  // ⚠️ العدد كان `(\d+)` بأرقام صحيحة بس، والتقريب بعديه. بعد ما عدد الأعواد
  // بقى يقبل كسور، الوصف بيبقى فيه «× 1.5» — والـregex كان بياخد «1» ويسيب
  // «.5»، يعني نص عود يضيع من الطلب وإحنا بنفتحه للتعديل.
  const re = /(قائم|عارضة حلق علوية|عارضة|عود)\s+(\d+(?:\.\d+)?)\s*سم\s*(?:×|x)\s*(\d+(?:\.\d+)?)/g;
  const out = { jambCm:0, jambQty:0, headerCm:0, headerQty:0, extra:[] };
  let m, found=false;
  while((m = re.exec(String(txt||'')))){
    found = true;
    const cm = Number(m[2]), q = rodQty_(m[3]);
    if(!(cm>0) || q<=0) continue;
    if(m[1]==='قائم'){ out.jambCm = cm; out.jambQty += q; }
    else if(m[1].indexOf('عارضة')===0){ out.headerCm = cm; out.headerQty += q; }
    else out.extra.push({cm, qty:q});
  }
  if(!found) return null;
  const jSets = Math.floor(out.jambQty/JAMBS_PER_SET), hSets = Math.floor(out.headerQty/HEADERS_PER_SET);
  const sets = (out.jambQty && out.headerQty) ? Math.min(jSets, hSets) : Math.max(jSets, hSets);
  out.setsQty = Math.max(1, sets);
  // أي عود زيادة عن الأطقم الكاملة بيتحط كعود إضافي بطوله — ما يضيعش من الطلب
  const restJ = out.jambQty - out.setsQty*JAMBS_PER_SET;
  if(restJ>0 && out.jambCm) out.extra.push({cm:out.jambCm, qty:restJ});
  const restH = out.headerQty - out.setsQty*HEADERS_PER_SET;
  if(restH>0 && out.headerCm) out.extra.push({cm:out.headerCm, qty:restH});
  if(!out.jambCm) out.jambCm = 220;
  if(!out.headerCm) out.headerCm = 110;
  return out;
}

function editCartLine(i){
  const it = state.cart[i];
  if(!it) return;
  if(flowMeta_(it)&&flowEditCart_(i))return;
  restorePulledLine_(true);                      // لو فيه تعديل سابق ما اتكملش، رجّعه الأول
  _pulledLine = { item: JSON.parse(JSON.stringify(it)), index: i, kind: it.kind };
  state.cart.splice(i,1);
  saveCart_();

  if(it.kind==='door'){
    const isHafr = !!it.hafr || /\(حفر\)|\(Carved\)/i.test((it.title||'')+(it.titleEn||''));
    const isWood = !!it.wood;
    const isPrint = !!it.print || PRINT_MARK_RE_.test((it.title||'')+(it.titleEn||''));
    let sizes={}, customOn=false, customW='', customH='', customQty=1, customFrame=null, customFrameHeight='', customDbror=null;
    let customFrameKind=null, customFrameRodQty='', customFrameForDoors='';
    let m = /^(\d+)\s*cm$/i.exec(it.sizeEn||'');
    if(m){
      sizes[Number(m[1])] = {
        qty:it.qty||1, height: it.doorHeight?String(it.doorHeight):'',
        frame: it.frame||0, frameHeight: it.frameHeight?String(it.frameHeight):'', dbror: it.dbror||'', hafr:isHafr, wood:isWood, print:isPrint, ...approvedPrintFields_(it), printArt:it.printArt||'', engraveArt:it.engraveArt||'',
        frameKind: it.frameKind||null, frameRodQty: it.frameRodQty||'', frameForDoors: it.frameForDoors||''
      };
    } else {
      m = /^(\d+(?:\.\d+)?)\s*x\s*(\d+(?:\.\d+)?)\s*cm\s*\(custom\)$/i.exec(it.sizeEn||'');
      if(m){
        customOn=true; customW=m[1]; customH=m[2]; customQty=it.qty||1;
        customFrame=it.frame||0; customFrameHeight=it.frameHeight?String(it.frameHeight):''; customDbror=it.dbror||'';
        customFrameKind=it.frameKind||null; customFrameRodQty=it.frameRodQty||''; customFrameForDoors=it.frameForDoors||'';
      }
    }
    state.pick = {code:it.code||'', sizes, customOn, note:it.note||'',
      custom:{w:customW,h:customH,qty:customQty,frame:customFrame,frameHeight:customFrameHeight,dbror:customDbror,hafr:isHafr,wood:isWood,print:isPrint,...approvedPrintFields_(it), printArt:it.printArt||'',engraveArt:it.engraveArt||'',
        frameKind:customFrameKind,frameRodQty:customFrameRodQty,frameForDoors:customFrameForDoors}};
    state.newSection='doors'; save(LS_SECTION,state.newSection);
  } else if(it.kind==='frame' || it.kind==='bror'){
    const isFr = it.kind==='frame';
    if(isFr){
      let cm = FRAMES[0].cm;   // سُمك الحلق — مش طول، مالوش دعوة بوحدة الشاشة
      const mm=/^(\d+)/.exec(it.spec||''); if(mm) cm=Number(mm[1]);
      if(it.frCm!=null) cm = it.frCm;
      if(it.isSet){
        // سطر "حلق كامل" الموحّد — بنرجّع الكمية (عدد الأطقم) زي ما هي
        state.fr = {cm, code:it.code||'', doorW: it.doorW||'', note: it.note||'', kind:'full',
                    qty: it.qty||1, nonStd:false,
                    jamb:2, jambCm:220, header:1, headerCm:110,
                    extra: [], rods:'', rodsCm:'', unit:'cm'};
      } else if(it.customSet){
        // سطر "حلق كامل — أطوال مخصوصة" الموحّد — بنرجّع الأطوال والكمية زي ما هي.
        // السطور الراجعة من السيرفر (ومن سلات محفوظة قديمة) مافيهاش الحقول دي،
        // فبنقرا الأطوال من وصف السطر نفسه بدل ما نرجّع ٢٢٠/١١٠ غلط.
        const br = (it.jambCm || it.headerCm || (it.extra||[]).length)
                     ? null : parseFrameBreakdown_(it.spec || it.title || '');
        state.fr = {cm, code:it.code||'', doorW: it.doorW||'', note: it.note||'', kind:'full',
                    qty: it.setsQty || (br && br.setsQty) || 1, nonStd:true,
                    jamb:2, jambCm: it.jambCm || (br && br.jambCm) || 220,
                    header:1, headerCm: it.headerCm || (br && br.headerCm) || 110,
                    extra: ((it.extra && it.extra.length ? it.extra : (br ? br.extra : []))||[])
                             .map(x=>({cm:x.cm, qty:x.qty})), rods:'', rodsCm:'', unit:'cm'};
      } else {
        const rodCm = Number(it.rodCm)||220;
        // بنرجّع العدد في خانة المقاس الصح حسب طول العود المحفوظ — قائم/عارضة حلق علوية لو الطول قياسي، وإلا سطر أعواد حرة
        const isStdCm = (rodCm===220 || rodCm===110);
        const restoredQty = rodCm===220 ? rodQty_((it.qty||2)/2) : (it.qty||1);
        state.fr = {cm, code:it.code||'', doorW: it.doorW||'', note: it.note||'', kind: isStdCm?'full':'rods',
                    qty: isStdCm?restoredQty:1, nonStd:false,
                    jamb:   rodCm===220 ? (it.qty||1) : 0, jambCm:220,
                    header: rodCm===110 ? (it.qty||1) : 0, headerCm:110,
                    extra: [], rods: isStdCm?'':(it.qty||1), rodsCm: isStdCm?'':rodCm, unit:'cm'};
      }
    } else {
      let size = BRORS[0].size;
      const mm=/^([\d×xX]+)/.exec(it.spec||''); if(mm) size=mm[1].replace(/x|X/,'×');
      // الطول الراجع من السلة بالسنتي دايمًا — بنرجّعه بوحدة السنتي عشان
      // يتعرض زي ما هو من غير أي تحويل يضيّع كسر
      state.br = {size, code:it.code||'', rods:it.qty||1,
                  len: it.rodCm ? String(Number(it.rodCm)) : BROR_ROD_M_DEFAULT,
                  unit: it.rodCm ? 'cm' : 'm'};
    }
    state.newSection = isFr?'frame':'bror'; save(LS_SECTION,state.newSection);
  } else if(it.kind==='mabra'){
    const sp = parseMabraSpec_(it.spec) || {};
    const std = SIZES.some(z=>z.w===sp.w) && sp.h===DOOR_STD_HEIGHT;
    state.mb = {wall: MABRA_WALLS.includes(sp.wall)?sp.wall:10, wallCustom: !!sp.wall && !MABRA_WALLS.includes(sp.wall), wallTxt: (sp.wall && !MABRA_WALLS.includes(sp.wall)) ? String(sp.wall) : '', code:it.code||'', doorW: std?String(sp.w):'',
                custom: !std, w: std?'':String(sp.w||''), h: std?'':String(sp.h||''), qty: it.qty||1};
    state.newSection='mabra'; save(LS_SECTION,state.newSection);
  } else if(it.kind==='panel'){
    state.pd = {code:it.code||'', qty:it.qty||1};
    state.newSection='prodium'; save(LS_SECTION,state.newSection);
  } else if(it.kind==='strip' || it.kind==='veneer'){
    state[METER_KINDS_[it.kind].st] = {code:it.code||'', qty:it.qty||1};
    state.newSection=it.kind; save(LS_SECTION,state.newSection);
  } else if(it.kind==='acc'){
    state.acc = {}; state.acc[it.id]=it.qty;
    state.newSection='acc'; save(LS_SECTION,state.newSection);
  }

  state.newStep='items';
  state.tab='new'; render();
  requestAnimationFrame(()=>{
    const _eb=document.querySelector('#view [data-act^="add-"]');
    const _ec=_eb&&(_eb.closest('section.card')||_eb.closest('.card'));
    if(_ec)_ec.scrollIntoView({block:'start'}); else window.scrollTo({top:0});
  });
  toast('عدّل البيانات وادوس «التالي» تاني عشان يتحدّث في السلة');
}

/* ============================================================
   الطلب
   ============================================================ */
function newOrderId(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  // ٣ حروف/أرقام عشوائية في الآخر عشان طلبين في نفس الثانية (وارد مع أكتر من موزع) ما ياخدوش نفس الرقم
  const rnd=Math.random().toString(36).slice(2,5).toUpperCase();
  return 'W'+String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())+rnd;
}

// تعديل الطلب من شاشة المصنع — بيحمّل أصناف الطلب في السلة ويفتح تبويب السلة،
// وبيحتفظ ببيانات صاحب الطلب الأصلي (اسم/موبايل/منطقة) عشان الحفظ ما يغيّرهاش لبيانات المصنع.
async function adminEditOrder(o){
  busy(true,'جارٍ تحميل أصناف الطلب…');
  let loaded;
  try{ loaded = await withOrderItems_(o, its => adminEditOrderWith_(o, its)); }
  finally{ busy(false); }
  return loaded;
}
function adminEditOrderWith_(o, its){
  // ⚠️ باج كان هنا: «تدعيم خشب» بند مستقل (مش حقل على سطر الباب)، والسيرفر
  // مش بيسجّل علامة "الباب ده عليه تدعيم" في صف الباب نفسه (زي ما بيسجّل
  // "milling" للحفر). فلو حد فتح تعديل الطلب من شاشة المصنع، كنا بنرجّع كل
  // الأبواب من غير wood خالص، وأول ما يتحفظ التعديل، saveCart_() كانت
  // بتمسح "تدعيم خشب" بصمت لأنها مش لاقيه أي باب معلّم عليه محتاج تدعيم.
  // الحل: نلمّ مقاسات الأبواب اللي أصلاً عندها سطر "تدعيم خشب" في الطلب،
  // ونعلّم عليها تاني وقت ما نرجّع الأبواب.
  // ⚠️ نفس الحكاية بالظبط بتنطبق على «طباعة» وعلى أي بند خدمة اختياري جاي.
  // كانت مكتوبة للتدعيم بالاسم — فأي بند جديد كان هيضيع بصمت مع أول تعديل.
  // بقت بتتبني من جدول SERVICE_LINES_ نفسه.
  const serviceLabels_ = {};
  SERVICE_LINES_.forEach(def=>{
    const re = new RegExp('^'+def.label.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*—\\s*');
    serviceLabels_[def.code] = new Set(
      (its||[]).filter(x=>x.type==='Accessory' && (String(x.code||'')===def.code || re.test(String(x.title||''))))
        .map(x=>String(x.title||'').replace(re,'').trim())
        .filter(Boolean)
    );
  });
  const woodLabels = serviceLabels_.WOOD;
  const printLabels = serviceLabels_.PRINT;
  state.cart = its.map(it=>{
    const qty = Number(it.qty)||0;
    const price = Number(it.unitPrice)||0;
    if(it.type==='Door'){
      const sizeTxt = arabicSizeText_(it.size);
      const doorHeight = Number(it.doorHeight)||0;
      const label = doorSizeText_(sizeTxt, doorHeight);
      const حفر = /\(حفر\)|\(Carved\)/i.test(String(it.title||'')) || !!String(it.milling||'').trim();
      // الكود بيتحوّل للجديد هنا كمان (مش في العرض بس): أي حفظ للطلب بعد
      // التعديل بيتسجّل بالكود الجديد، فالبيانات بتتنضّف مع الاستعمال
      return { kind:'door', title:arabicItemTitle_(it), titleEn:it.title||'', code:doorCode_(it.code||''),
               img:(DOORS.find(d=>d.code===doorCode_(it.code))||{}).img || '',
               sizeTxt, sizeEn:it.size||'', unitPrice:price, qty,
               w:it.width||'', frame:Number(it.frame)||0, dbror:it.dbror||'', frameHeight:Number(it.frameHeight)||0,
               doorHeight, hafr:حفر,
               wood:woodLabels.has(label),
               print:printLabels.has(label) || PRINT_MARK_RE_.test(String(it.title||'')),
               ...approvedPrintFields_(it), printArt:it.printArt||'',engraveArt:it.engraveArt||'',
               // ⚠️ عمود «الحفر» (Milling) كان بيضيع مع كل تعديل: السلة بترجع
               // من غير millEn، فالحفظ بيكتب الخانة فاضية. وarabicItemTitle_
               // بتقرا الحفر من الخانة دي — فالباب بيطلع في شاشة المصنع
               // وفي كل المستندات «باب A01» من غير «(حفر)»، وسعره لسه سعر
               // الحفر. يعني المصنع ينفّذه سادة والعميل دافع حفر.
               millEn: String(it.milling||'').trim() || (حفر ? 'Carved' : ''),
               note: it.itemNote||'' };
    }
    if(it.type==='Frame' || it.type==='Bror'){
      const isFr = it.type==='Frame';
      // ⚠️ باج كان هنا: السطر المدموج (قوائم + عوارض بأطوال مختلفة في سطر
      // واحد) كان بيرجع من السيرفر من غير علامته، فالسلة بتعرضه «٩ عود × ٢٠٠ سم»
      // — والحقيقة إن ٣ منهم عوارض ١٢٠ سم. التفصيل موجود في وصف الصنف بس
      // مكانش بيتعرض. يعني المصنع ممكن يقطّع ٣ أعواد أطول ٨٠ سم من اللازم.
      // بنعرف السطر المدموج من وحدته الجديدة ('rods')، ومن وصفه كمان عشان
      // الطلبات اللي اتسجّلت قبل التعديل ده تتعرض صح برضه.
      // («سم × عدد» — البرور «6×9» مابيتلخبطش معاها لأن مفيش «سم» قبل الـ×)
      const مدموج = String(it.unit||'')==='rods' || /سم\s*×\s*\d+/.test(String(it.size||''));
      // ⚠️ الوحدة بقت ممكن تكون بطول كسري ('rod 220.5cm')، والـregex كان
      // بياخد الجزء الصحيح بس — فالطول بيرجع ٢٢٠ والنص سنتي بيضيع من الطلب.
      const rodCm = مدموج ? null : (String(it.unit||'').match(/^rod\s+(\d+(?:\.\d+)?)/)||[])[1];
      // ⚠️ سطر «الحلق الكامل» كان بيرجع من السيرفر من غير علامة الطقم، فالسلة
      // تعرضه «٥ عود» بدل «٥ طقم» — ولو الطلب اتبعت تاني بيتسجّل ٥ أعواد بدل ١٥.
      const طقم = isFr && (String(it.unit||'')==='set' || /^حلق كامل/.test(String(it.size||'')));
      // سُمك الحلق (١٠ سم…) مش موجود في وصف السطر المدموج — بناخده من الاسم الإنجليزي
      const frCm = isFr ? Number((String(it.title||'').match(/Frame\s+(\d+(?:\.\d+)?)\s*cm/i)||[])[1]) : 0;
      // وتفصيل الأطوال بيترجع من الوصف عشان تعديل السطر ما يحوّلوش لطقم استاندر
      const br = (isFr && مدموج) ? parseFrameBreakdown_(it.size||'') : null;
      return { kind:isFr?'frame':'bror', key:(isFr?'حلق':'برور')+(it.size||'')+'|'+(it.code||''),
               title:arabicItemTitle_(it), titleEn:it.title||'', code:it.code||'',
               spec:it.size||'', price, qty, rodCm: طقم ? 0 : (rodCm?Number(rodCm):undefined),
               customSet: مدموج || undefined, isSet: طقم || undefined,
               frCm: (isFr && frCm>0) ? frCm : undefined,
               setsQty: br ? br.setsQty : undefined,
               jambCm: br ? br.jambCm : undefined, headerCm: br ? br.headerCm : undefined,
               extra: br ? br.extra : undefined,
               doorW: it.forDoorWidth||'', note: it.itemNote||'' };
    }
    if(METER_TYPE_TO_KIND_[it.type]){
      const mk = METER_TYPE_TO_KIND_[it.type];
      return { kind:mk, key:mk+'|'+(it.code||''),
               title:arabicItemTitle_(it), titleEn:it.title||'', code:it.code||'',
               spec:it.size||'', price, qty, unit:it.unit||'متر' };
    }
    if(it.type==='Mabra'){
      return { kind:'mabra', key:'mabra|'+(it.code||'')+'|'+(it.size||''),
               title:arabicItemTitle_(it), titleEn:it.title||'', code:it.code||'',
               spec:it.size||'', price, qty, unit:it.unit||'معبرة' };
    }
    if(it.type==='Panel'){
      return { kind:'panel', key:'panel|'+(it.code||''),
               title:arabicItemTitle_(it), titleEn:it.title||'', code:it.code||'',
               spec:it.size||'', price, qty, unit:it.unit||'لوح' };
    }
    return { kind:'acc', id:it.code||it.title||'', title:arabicItemTitle_(it), titleEn:it.title||'',
             price, qty, unit:it.unit||'' };
  });
  saveCart_();

  enterEditMode_(o, {
    date: o.date || isoLocal_(),
    meta: { name:o.dist||'', phone:o.phone||'', region:o.region||'', customer:o.customer||'', customerPhone:o.customerPhone||'', customerRegion:o.customerRegion||'' }
  });
}

// الدخول في وضع تعديل الطلب. المسارين (الموزّع من «تابع طلبك»، والمصنع من
// شاشته) كانوا بيظبّطوا نفس الحقول الخمسة كل واحد لوحده — ودي بالظبط الحقول
// اللي لو واحد نسي حقل فيها، رقم الطلب أو تاريخه يطلع غلط في المستند.
// بيدوّر على الطلب في القايمة النشطة والأرشيف مع بعض.
// ⚠️ باج كان هنا: سبع أزرار في كارت الطلب (PDF/سعر/إرسال/الأصناف/تعديل/…) كانت
// بتدوّر في state.admin.rows بس. الأرشيف بيعرض نفس الأزرار، والطلب المؤرشف مش
// في القايمة دي — فالزرار كان بيتضغط ومفيش أي حاجة تحصل ولا رسالة تظهر.
// تلات أزرار بس كانوا بيدوّروا في الاتنين. بقى نداء واحد للكل.
// ⚠️ التوستات وتأكيد الحذف كانوا بيكتبوا الكود الداخلي (#W260904-1234ABC)
// والمصنع شايف على الكارت الرقم التسلسلي (#33) — فمش عارف الرسالة دي بتتكلم
// عن أنهي طلب. وده على زرار حذف نهائي. بنكتب الرقم اللي هو شايفه.
function adminOrderNoText_(id){
  const o = adminOrderById_(id);
  return o ? orderNoText_(o) : ('#' + id);
}
function adminOrderById_(id){
  const key = String(id);
  return (state.admin.rows||[]).find(x=>String(x.id)===key)
      || (state.admin.archRows||[]).find(x=>String(x.id)===key)
      || null;
}

function enterEditMode_(o, opts){
  opts = opts || {};
  // ⚠️ الملاحظة العامة على الطلب كانت بتضيع مع التعديل: الخانة بتتصفّر بعد كل
  // إرسال، وحد ما كان بيرجّعها هنا — فالطلب المعدّل بيروح للمصنع من غير الملاحظة
  // اللي مكتوبة على الطلب الأصلي. بناخدها من الطلب نفسه (o.note جوّه الجهاز،
  // ordNote من صف المصنع).
  state.orderNote = String(o.note || o.ordNote || '');
  state.editingId = o.id;
  state.editingMeta = opts.meta || null;
  // نرجّع بيانات صاحب الأوردر للفورم في التعديل العادي — من غير كده طلب «عميل آخر»
  // كان هيتسجّل بعد التعديل باسم الحساب بالغلط (لأن الفورم بيتصفّر بعد كل إرسال)
  if(!opts.meta && o.customer){
    const ownName = String(o.customer||'').trim(), profName = String(state.profile.name||'').trim();
    if(ownName && ownName !== profName){
      state.custMode='other';
      state.customer={ name:ownName, phone:String(o.customerPhone||''), region:String(o.customerRegion||'') };
    } else {
      state.custMode='self'; state.customer={name:'',phone:'',region:''};
    }
  }
  state.editingDate = opts.date || isoLocal_(o.ts);
  state.editingDisplayNo = o.displayNo || '';
  state.editingEditCount = Number(o.editCount) || 0;
  state.editingDue = (o.due || o.dueDate || ((state.track.rows||[]).find(r=>String(r.id)===String(o.id))||{}).due || '');
  state.tab = 'cart'; render(); window.scrollTo({top:0, behavior:'smooth'});
  toast('بتعدّل الطلب '+orderNoText_(o)+' — عدّل السلة واضغط «حفظ التعديل»');
}

/* ---------- استرجاع طلب من نص ----------
   الطلب ممكن يضيع من الجهاز ومن السيرفر مع بعض (زي ما حصل مع طلب كبير فشل
   إرساله في صمت). المستند المطبوع بيبقى فيه كل التفاصيل، فبدل ما الموزّع
   يدخّل ١٥ صنف تاني بالإيد، بيلزق نص الطلب هنا ويراجعه ويحفظ. */
function importOrderText_(){
  const txt = prompt('الصق نص الطلب المحفوظ هنا:');
  if(!txt || !txt.trim()) return;
  let data;
  try{ data = JSON.parse(txt.trim()); }
  catch(e){ toast('النص مش مقروء — اتأكد إنك نسخته كامل', 4500); return; }
  const items = Array.isArray(data) ? data : (data && data.items);
  if(!Array.isArray(items) || !items.length){ toast('مفيش أصناف في النص ده', 4000); return; }
  // بنتأكد إن كل صنف شكله صح قبل ما نحط حاجة في السلة
  const سليم = items.filter(it => it && it.kind && (Number(it.qty)||0) > 0);
  if(!سليم.length){ toast('الأصناف في النص ده مش مكتملة', 4000); return; }
  state.cart = JSON.parse(JSON.stringify(سليم));
  saveCart_();
  if(data && data.profile){
    ['name','phone','region'].forEach(k=>{ if(data.profile[k]) state.profile[k] = data.profile[k]; });
    save(LS_PROFILE, state.profile);
  }
  if(data && data.customer && data.customer.name){
    state.customer = { name: data.customer.name, phone: data.customer.phone || '', region: data.customer.region || '' };
    state.custMode = 'other';   // الطلب المسترجع ليه صاحب أوردر متسجّل — نفتح خانات «عميل آخر» عليه
  }
  const عدد = سليم.reduce((n,it)=>n+(Number(it.qty)||0), 0);
  toast('اترجّع '+سليم.length+' صنف ('+عدد+' قطعة) — راجعهم كويس واضغط «حفظ وإرسال»', 6000);
  state.tab='cart'; render(); window.scrollTo({top:0,behavior:'smooth'});
}

function draftOrder(){
  // لو المصنع بيعدّل طلب عميل، بنحافظ على بيانات العميل الأصلي مش بيانات جهاز المصنع
  const m = state.editingMeta;
  // لو بنعدّل طلب، بناخد نفس تاريخ الطلب الأصلي (أو التاريخ اللي اتغيّر يدويًا) بدل تاريخ النهاردة
  const ts = (state.editingId && state.editingDate)
    ? new Date(state.editingDate + 'T12:00:00').getTime()
    : Date.now();
  return {
    id:newOrderId(), ts,
    name: m ? m.name : state.profile.name,
    phone: m ? m.phone : state.profile.phone,
    region: m ? m.region : state.profile.region,   // منطقة الحساب زي ما هي دايمًا — عنوان العميل له حقله الخاص customerRegion
    warehouse:WAREHOUSE, items:JSON.parse(JSON.stringify(state.cart)), total:cartTotal(),
    // صاحب الأوردر: «لحسابي» بيتسجّل باسم صاحب الحساب من غير ما يتكتب تاني — «عميل آخر» بيتسجّل زي ما اتكتب
    customer: m ? (m.customer||'') : (state.custMode==='other' ? state.customer.name.trim() : state.profile.name.trim()),
    customerPhone: m ? (m.customerPhone||'') : (state.custMode==='other' ? state.customer.phone.trim() : ''),
    // عنوان العميل (اختياري، «عميل آخر» بس) — حقل مستقل زي customerPhone؛ بيظهر في رسالة الواتساب وكارت الطلب على الجهاز
    customerRegion: m ? (m.customerRegion||'') : (state.custMode==='other' ? String(state.customer.region||'').trim() : ''),
    note: state.orderNote.trim(),
    replacesId: state.editingId || '',   // لو ده تعديل لطلب قديم، بنحتفظ برقمه هنا عشان يبان في الطباعة/الرسالة
    // رقم الطلب "العادي" بيتورّث من الطلب الأصلي وقت التعديل (فاضي = السيرفر هيدّي رقم جديد تسلسلي)
    displayNo: state.editingId ? (state.editingDisplayNo || '') : '',
    editCount: state.editingId ? (Number(state.editingEditCount||0) + 1) : 0,
    // تاريخ التعديل نفسه. الطلب المعدّل بياخد تاريخ الطلب الأصلي عن قصد (عشان
    // يفضل محتفظ بتاريخه)، فتاريخ التعديل مكانش متسجّل في أي مكان. بنسجّله هنا
    // عشان يبان جنب رقم التعديل في المستند: «معدّل 52/1 — بتاريخ ...»
    editedAt: state.editingId ? isoLocal_() : '',
    dueDate: state.editingId ? (state.editingDue || '') : ''   // ميعاد الاستلام بيتورّث من الطلب القديم
  };
}

function buildMessage(o){
  const priced=pricesVisible();
  let m='🚪 طلب أوردر — '+COMPANY+'\n';
  // ⚠️ باج كان هنا: الرسالة كانت بتكتب الكود الداخلي (#W260904-1234ABC) بينما
  // المستند المطبوع وكل شاشات التطبيق بيكتبوا الرقم التسلسلي (52). يعني نفس
  // الطلب ليه رقمين مختلفين — واحد على واتساب وواحد على الورق. نفس الباج اللي
  // اتصلّح للشاشات والمستند قبل كده، بس قناة الواتساب فاتت.
  m+='رقم الطلب: '+orderNoText_(o)+(o.displayNo?' (الكود الداخلي: '+o.id+')':'')+'\n';
  if(o.replacesId) m+='🔁 تعديل على الطلب رقم: '+prevOrderNoText_(o)+'\n';
  m+='الاسم: '+(o.name||'-')+'\n';
  m+='المنطقة: '+(o.region||'-')+'\n';
