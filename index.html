// جدول عميل واحد: صنف/مقاس/كمية/حلق/برور — كل عميل بجدوله المستقل ولونه الخاص
// حالة توفّر الصنف بالمخزن: أخضر = متاح بالكامل، أصفر = الكمية أكبر من المتاح جزئيًا، أحمر = مفيش خالص
function stockStatus_(code, size, qty){
  // ⚠️ باج كان هنا: المقاس الخاص مش متتبّع في المخزون عن قصد (الباب بيتقص،
  // مش صنف جاهز على الرف) — ومحصلش يتخصم ولا يترجع رصيد له أبدًا. لكن الشارة
  // كانت بتدوّر على رصيد بنص المقاس الكامل، مالهوش سطر في المخزن، فبترجع صفر
  // وتطبع «غير متاح» أحمر على كل باب مقاس خاص. شارة إنذار غلط دايمًا معناها
  // إن المصنع يبطّل ياخد باله منها خالص.
  if(/\(custom\)/i.test(String(size||'')) || /مقاس خاص/.test(String(size||''))){
    return { color:'#5B6B7D', bg:'#F0F3F7', label:'مقاس خاص' };
  }
  const w = doorWidthGroup_(size);
  const stock = stockFor(code, w!=null ? w : size);
  if(stock===null) return null;   // الأرصدة لسه ما اتحمّلتش
  if(stock<=0) return {color:'#B3261E', bg:'#FBE7E7', label:'غير متاح'};
  if(qty>stock) return {color:'#B8790A', bg:'#FFF4E0', label:'جزئي ('+stock+' متاح)'};
  return {color:'#1E8E52', bg:'#E7F6EC', label:'متاح'};
}

function customerTableHTML_(cust, tint, showFrameHCol){
  const items = mergedCustomerItems_(cust);
  const total = items.reduce((s,it)=>s+it.qty,0);
  const totalProduced = items.reduce((s,it)=>s+it.produced,0);
  const totalPending = total-totalProduced;
  const colspan = 5 + (showFrameHCol?1:0);

  const rowHTML_ = (it, idx, qtyVal, qtyColor) => {
    const zebra = idx%2===1 ? 'background:#FAFBFC' : 'background:#FFFFFF';
    const st = stockStatus_(it.code, it.size, it.qty);
    const stCell = st
      ? `<span style="display:inline-block;padding:2.5px 9px;border-radius:20px;font-size:9.5px;font-weight:700;background:${st.bg};color:${st.color};white-space:nowrap">${st.label}</span>`
      : `<span style="color:#B7C0CA;font-size:10px">—</span>`;
    const frameHTxt = it.frameW ? (it.frameH||'استاندر') : '—';
    return `<tr style="${zebra}">
      <td style="text-align:center;padding:8px 6px;border-bottom:1px solid #EEF1F4;color:#4B5A6B">${esc(it.w||'—')}</td>
      <td style="text-align:center;padding:8px 6px;border-bottom:1px solid #EEF1F4;color:#4B5A6B">${esc(it.h||'—')}</td>
      <td style="text-align:center;padding:8px 6px;border-bottom:1px solid #EEF1F4;font-weight:700;color:#233246">${esc(it.code)}</td>
      <td style="text-align:center;padding:8px 6px;border-bottom:1px solid #EEF1F4;font-weight:700;color:${qtyColor}">${qtyVal}</td>
      <td style="text-align:center;padding:8px 6px;border-bottom:1px solid #EEF1F4">${stCell}</td>
      <td style="text-align:center;padding:8px 6px;border-bottom:1px solid #EEF1F4;color:#6B7A8C;font-size:10px">${esc(it.frameW)||'—'}</td>
      ${showFrameHCol?`<td style="text-align:center;padding:8px 6px;border-bottom:1px solid #EEF1F4;color:${frameHTxt==='استاندر'?'#8A6512':'#6B7A8C'};font-size:10px">${esc(frameHTxt)}</td>`:''}
      <td style="text-align:center;padding:8px 6px;border-bottom:1px solid #EEF1F4;color:#6B7A8C;font-size:10px">${esc(it.dbror)||'—'}</td>
    </tr>`;
  };

  const readyItems = items.filter(it=>it.produced>0);
  const pendingItems = items.filter(it=>(it.qty-it.produced)>0);

  const subTable_ = (rows, headBg, headTxt, title, emptyTxt) => `
    <div style="margin-top:${title==='جاهز للتسليم'?'0':'12px'}">
      <div style="font-size:11.5px;font-weight:700;color:${headTxt};background:${headBg};padding:5px 10px;border-radius:6px 6px 0 0">${title}</div>
      <table style="width:100%;border-collapse:collapse;font-size:11px">
        <thead><tr style="background:#12314F">
          <th style="padding:7px 4px;color:#fff;font-weight:700">عرض الفتحة المعمارية</th>
          <th style="padding:7px 4px;color:#fff;font-weight:700">ارتفاع الفتحة المعمارية</th>
          <th style="padding:7px 6px;color:#fff;font-weight:700">الكود</th>
          <th style="padding:7px 6px;color:#fff;font-weight:700">الكمية</th>
          <th style="padding:7px 6px;color:#fff;font-weight:700">حالة المخزن</th>
          <th style="padding:7px 4px;color:#fff;font-weight:700">عرض الحلق</th>
          ${showFrameHCol?`<th style="padding:7px 4px;color:#fff;font-weight:700">ارتفاع الحلق</th>`:''}
          <th style="padding:7px 6px;color:#fff;font-weight:700">البرور</th>
        </tr></thead>
        <tbody>${rows || `<tr><td colspan="${colspan}" style="text-align:center;padding:10px;color:#8A97A6;font-size:10.5px">${emptyTxt}</td></tr>`}</tbody>
      </table>
    </div>`;

  const readyRows = readyItems.map((it,idx)=>rowHTML_(it, idx, it.produced, '#1E8E52')).join('');
  const pendingRows = pendingItems.map((it,idx)=>rowHTML_(it, idx, it.qty-it.produced, '#B3261E')).join('');

  return `<div class="rpt-cust-block" style="margin-top:18px;border:1px solid #E3E7EC;border-radius:13px;overflow:hidden;break-inside:avoid;box-shadow:0 1px 4px rgba(20,36,58,.06)">
    <div style="font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg, ${tint.line}, ${tint.line}CC);padding:11px 16px;display:flex;align-items:center;justify-content:space-between">
      <span>👤 ${esc(cust.name)}</span>
      <span style="font-size:10.5px;font-weight:400;opacity:.9">${items.length} صنف</span>
    </div>
    <div style="padding:12px 13px 13px">
      ${subTable_(readyRows, '#E6F4EA', '#1E8E52', '✅ جاهز للتسليم', 'مفيش حاجة جاهزة لسه')}
      ${subTable_(pendingRows, '#FDECEA', '#B3261E', '⏳ لسه متبقي / تحت التنفيذ', 'مفيش حاجة متبقية 🎉')}
      <div style="display:flex;justify-content:space-between;align-items:center;background:${tint.head};border-radius:9px;padding:9px 14px;margin-top:10px">
        <span style="font-weight:700;font-size:12.5px;color:#233246">إجمالي عدد الأبواب</span>
        <span style="font-weight:700;font-size:19px;color:${tint.line}">${total}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:10.5px;color:#4B5A6B;padding:4px 2px 0">
        <span>جاهز: <b style="color:#1E8E52">${totalProduced}</b></span>
        <span>متبقي: <b style="color:#B3261E">${totalPending}</b></span>
      </div>
    </div>
  </div>`;
}

async function buildPendingDoorsPdf_(orders){
  const data = buildPendingDoorsData_(orders);

  if(!await needLibs_('html2canvas','jspdf')) return;

async function buildPendingDoorsExcel_(orders){
  const data = buildPendingDoorsData_(orders);
  if(!data.length){ toast('مفيش طلبات معلّقة'); return; }
  if(!await needLibs_('exceljs')) return;

  const NAVY='FF002050', WHITE='FFFFFFFF', ZEBRA='FFF6F8FA', BORDER_CLR='FFDCE4EC';
  const thin = {style:'thin', color:{argb:BORDER_CLR}};
  const border = {top:thin,left:thin,right:thin,bottom:thin};
  // عمود "ارتفاع الحلق" شرطي على مستوى التقرير كله — بيظهر بس لو صنف واحد على الأقل من كل العملاء متسجّل له ارتفاع حلق فعلي
  const showFrameHCol = data.some(cust=>mergedCustomerItems_(cust).some(it=>it.frameW && it.frameH));
  const COLS = showFrameHCol ? 8 : 7;
  const PROD_GREEN='FF1E8E52', PEND_RED='FFB3261E';
  const READY_FILL='FFE6F4EA', READY_TXT='FF1E8E52', PEND_FILL='FFFDECEA', PEND_TXT='FFB3261E';

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('الأبواب المعلّقة', { views:[{ rightToLeft:true }] });
  ws.columns = [
    { key:'w',    width:11 },
    { key:'h',    width:11 },
    { key:'code', width:13 },
    { key:'qty',  width:9  },
    { key:'stat', width:14 },
    { key:'frameW',width:11 },
    ...(showFrameHCol ? [{ key:'frameH', width:11 }] : []),
    { key:'bror', width:14 }
  ];

  function mergedRow(text, fillArgb, fontArgb, bold, size){
    const r = ws.addRow([text].concat(Array(COLS-1).fill('')));
    ws.mergeCells(r.number,1,r.number,COLS);
    r.eachCell(c=>{
      c.fill = {type:'pattern',pattern:'solid',fgColor:{argb:fillArgb}};
      c.font = {bold: !!bold, color:{argb:fontArgb}, size: size||11, name:'Arial'};
      c.alignment = {horizontal:'right', vertical:'middle'};
    });
    r.height = 20;
    return r;
  }

  const now = new Date();
  const dateTimeStr = now.toLocaleDateString('ar-EG') + ' — الساعة ' + now.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
  mergedRow('تقرير الأبواب المعلّقة  —  '+dateTimeStr, NAVY, WHITE, true, 13);
  ws.addRow([]);

  const CUST_FILL = ['FF1080C0','FFC08A3E','FF3E9B72','FF7C63C4','FFC25454','FF2C8FA3'];
  const CUST_TINT = ['FFEAF2FA','FFFBF0E1','FFE7F5EE','FFF0EAFB','FFFBE7E7','FFE3F3F7'];
  const STAT_GREEN='FFE7F6EC', STAT_YELLOW='FFFFF4E0', STAT_RED='FFFBE7E7';
  const STAT_GREEN_TXT='FF1E8E52', STAT_YELLOW_TXT='FFB8790A', STAT_RED_TXT='FFB3261E';
  const QTY_COL = 4, STAT_COL = 5;   // أرقام الأعمدة ثابتة بغض النظر عن ظهور "ارتفاع الحلق" — هو آخر عمود قبل البرور بس

  data.forEach((cust,ci)=>{
    const fill = CUST_FILL[ci % CUST_FILL.length];
    const tint = CUST_TINT[ci % CUST_TINT.length];
    mergedRow('صاحب الطلب: '+cust.name, fill, WHITE, true, 13);

    function subHeader_(bg, txt, title){
      const r = mergedRow(title, bg, txt, true, 11);
      r.height = 18;
      return r;
    }
    function colHeader_(){
      const labels = ['عرض الفتحة المعمارية','ارتفاع الفتحة المعمارية','الكود','الكمية','حالة المخزن','عرض الحلق']
        .concat(showFrameHCol?['ارتفاع الحلق']:[]).concat(['البرور']);
      const hdr = ws.addRow(labels);
      hdr.eachCell(c=>{
        c.fill = {type:'pattern',pattern:'solid',fgColor:{argb:fill}};
        c.font = {bold:true, color:{argb:WHITE}, name:'Arial', size:10.5};
        c.alignment = {horizontal:'center'};
        c.border = border;
      });
    }
    function itemRow_(it, idx, qtyVal, qtyColor){
      const st = stockStatus_(it.code, it.size, it.qty);
      const statTxt = st ? st.label : '—';
      const frameHTxt = it.frameW ? (it.frameH||'استاندر') : '—';
      const vals = [it.w||'—', it.h||'—', it.code, qtyVal, statTxt, it.frameW||'—']
        .concat(showFrameHCol?[frameHTxt]:[]).concat([it.dbror||'—']);
      const row = ws.addRow(vals);
      row.eachCell((c,colNo)=>{
        c.alignment = {horizontal:'center'};
        c.border = border;
        c.font = {name:'Arial', size:10.5, bold: colNo===QTY_COL||colNo===STAT_COL, color: colNo===QTY_COL?{argb:qtyColor}:(colNo===STAT_COL&&st?{argb: st.color==='#1E8E52'?STAT_GREEN_TXT:(st.color==='#B8790A'?STAT_YELLOW_TXT:STAT_RED_TXT)}:undefined)};
        c.fill = {type:'pattern',pattern:'solid',fgColor:{argb: colNo===STAT_COL&&st ? (st.color==='#1E8E52'?STAT_GREEN:(st.color==='#B8790A'?STAT_YELLOW:STAT_RED)) : (idx%2===1 ? ZEBRA : WHITE)}};
      });
    }
    function emptyRow_(text){
      const row = ws.addRow([text].concat(Array(COLS-1).fill('')));
      ws.mergeCells(row.number,1,row.number,COLS);
      row.eachCell(c=>{ c.border=border; c.alignment={horizontal:'center'}; c.font={name:'Arial', size:10.5, color:{argb:'FF8A97A6'}}; });
    }

    const items = mergedCustomerItems_(cust);
    let total = 0, totalProduced = 0;
    items.forEach(it=>{ total += it.qty; totalProduced += it.produced; });
    const readyItems = items.filter(it=>it.produced>0);
    const pendingItems = items.filter(it=>(it.qty-it.produced)>0);

    subHeader_(READY_FILL, READY_TXT, '✅ جاهز للتسليم');
    colHeader_();
    if(readyItems.length) readyItems.forEach((it,idx)=>itemRow_(it, idx, it.produced, PROD_GREEN));
    else emptyRow_('مفيش حاجة جاهزة لسه');

    ws.addRow([]);
    subHeader_(PEND_FILL, PEND_TXT, '⏳ لسه متبقي / تحت التنفيذ');
    colHeader_();
    if(pendingItems.length) pendingItems.forEach((it,idx)=>itemRow_(it, idx, it.qty-it.produced, PEND_RED));
    else emptyRow_('مفيش حاجة متبقية 🎉');

    mergedRow('إجمالي عدد الأبواب:  '+total+'   (جاهز '+totalProduced+' · متبقي '+(total-totalProduced)+')', tint, NAVY, true, 12);
    ws.addRow([]);
  });

  const codesTxt = DOORS.map(d=>d.code).join('، ');
  mergedRow('الأكواد المتاحة: '+codesTxt+'  |  المقاسات المتاحة (سم): 60، 70، 80، 90، 100', 'FFF7F9FB', 'FF6B7A8C', false, 9.5);

  // هامش الطباعة: رقم الصفحة بس (من غير سطر إعداد)
  wb.worksheets.forEach(w=>{
    w.headerFooter = w.headerFooter || {};
    w.headerFooter.oddFooter = '&L&9Page &P of &N';
  });

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const fname = 'تقرير_الأبواب_المعلقة_'+isoLocal_()+'.xlsx';
  await shareOrDownload_(blob, fname, fname);
}

// بيجيب بيانات الطلبات المعلّقة بالتفصيل من السيرفر — مشتركة بين التلات أزرار التصدير
async function fetchPendingOrders_(){
  if(!APPS_SCRIPT_URL || !state.admin.pw) return null;
  const d = await jsonp(APPS_SCRIPT_URL + '?action=listWithItems' + admParams_());
  if(!d || !d.ok) throw new Error((d && d.error) || 'رد غير متوقع');
  const orders = d.orders || [];
  if(!orders.length){ toast('مفيش طلبات لسه'); return null; }
  return orders;
}

// معاينة طلب العميل على الشاشة — نفس اللي بيطلع في الـ PDF بالظبط، بس من غير
// html2canvas ولا jsPDF خالص. فبتفتح فورًا (بدل ثواني تجهيز الـ PDF)، والمصنع
// يقدر يراجع الطلب وياخد قراره، ولو عايز الملف يضغط «تصدير PDF» من جوه المعاينة.
// ⚠️ النسخة الأولى من المعاينة كانت بطيئة جدًا وأحيانًا ماكانتش بتفتح خالص، لسببين:
//   ١) كانت بتنده loadStock(true) — والمستند ده مابيستخدمش الأرصدة أصلًا، نداء ملهوش لازمة
//   ٢) كانت بتنده fetchPendingOrders_() اللي بتجيب **كل** الطلبات بكل أصنافها من السيرفر
//      (listWithItems)، مع إن بيانات الطلبات موجودة قدامنا في الشاشة أصلًا.
// يعني نداءين تقال قبل ما أي حاجة تظهر، وأي واحد فيهم يفشل = المعاينة ما تفتحش.
//
// دلوقتي: بيانات الطلب بتتاخد من الشاشة على طول، والأصناف من الكاش لو محمّلة قبل كده
// (لو المصنع فتح «الأصناف» للطلب)، وإلا بنجيب أصناف الطلبات دي بس — نداء صغير لكل
// طلب بدل نداء واحد ضخم بكل طلبات المصنع.
async function previewCustomerOrder_(name){
  if(!name) return;
  const a = state.admin;
  if(a.groupPreviewBusy) return;

  // الطلبات موجودة في الشاشة خلاص — مفيش داعي نسأل السيرفر عنها تاني
  const list = (a.viewArchive ? a.archRows : a.rows) || [];
  const mine = list.filter(o => (String(o.customer||'').trim() || 'بدون اسم') === name);
  if(!mine.length){ toast('مفيش طلبات للعميل ده في الشاشة'); return; }

  a.groupPreviewBusy = name; render();
  try{
    // أصناف كل الطلبات في نداء واحد بدل نداء لكل طلب
    await loadOrderItemsMany_(mine.map(o => o.id));

    const html = mine.map(o => {
      const its = a.items[o.id] || [];
      return docHTML(buildAdminDocOrder_(o, its), 'order');
    }).join('<div style="height:18px"></div>');

    showReportPreview_(html, name);
  }catch(err){
    toast('تعذّر فتح المعاينة: ' + (err.message || err));
  }
  a.groupPreviewBusy = null; render();
}

// معاينة طلب واحد. المصنع كان يقدر يعاين كل طلبات العميل مع بعض بس — ولو العميل
// عنده عشر طلبات، اللي عايز يشوف طلب واحد بيستنى تحميلهم كلهم ويدوّر في الورق.
async function previewOneOrder_(id){
  const o = adminOrderById_(id); if(!o) return;
  const a = state.admin;
  if(a.orderPreviewBusy) return;
  a.orderPreviewBusy = o.id; render();
  try{
    const its = await loadOrderItems_(o.id);
    if(!its.length){ toast('مفيش أصناف في الطلب ده'); }
    else showReportPreview_(docHTML(buildAdminDocOrder_(o, its), 'order'), orderNoText_(o), o.id);
  }catch(err){
    toast('تعذّر فتح المعاينة: ' + (err.message || err));
  }
  a.orderPreviewBusy = null; render();
}

/* ⚠️ الأصناف الراجعة من الشيت لسه فيها الأكواد القديمة (A015) — والكود ده
   بيتعرض زي ما هو في شاشة المصنع وفي الإكسل والتقارير، وبيدخل في مفاتيح
   التجميع وفي فحص المتوفر بالمخزن. يعني من غير تطبيع هنا:
     • المصنع يشوف «A015» على طلبات قديمة و«A013» على الجديدة لنفس الباب.
     • التقرير الشامل يعدّهم صنفين منفصلين.
     • فحص المتوفر يدوّر على رصيد A015 وهو متسجّل على A013.
   بنطبّعهم مرة واحدة عند الاستقبال — وكل اللي بعده بياخد الكود الجديد.
   (والسيرفر بيطبّع كمان وقت مطابقة الصنف، فالتعديل والحذف على السطور
   القديمة فاضلين شغّالين.) */
function normalizeItems_(list){
  (list || []).forEach(it=>{ if(it && it.code) it.code = doorCode_(it.code); });
  return list || [];
}

// بتجيب أصناف طلب واحد وتكاشهم. بترجّع من غير أي نداء لو محمّلين خلاص.
async function loadOrderItems_(id){
  if(state.admin.items[id]) return state.admin.items[id];
  const d = await jsonp(APPS_SCRIPT_URL
    + '?action=orderItems' + admParams_()
    + '&id=' + encodeURIComponent(id));
  if(d && d.ok) state.admin.items[id] = normalizeItems_(d.items);
  return state.admin.items[id] || [];
}

// أصناف كذا طلب في نداء واحد.
// ⚠️ المعاينة والتصدير لعميل كانوا بيبعتوا نداء لكل طلب، و Apps Script بينفّذ
// نداءات نفس المستخدم واحد ورا التاني — يعني الانتظار بيتضاعف بعدد الطلبات.
// نداء واحد بكل المعرّفات = تنفيذ واحد وقراية واحدة للشيت.
// بنقسّمهم على دفعات عشان الرابط ما يطولش أوي.
async function loadOrderItemsMany_(ids){
  const ناقص = ids.filter(id => !state.admin.items[id]);
  for(let i = 0; i < ناقص.length; i += 12){
    const دفعة = ناقص.slice(i, i + 12);
    try{
      const d = await jsonp(APPS_SCRIPT_URL
        + '?action=orderItems' + admParams_()
        + '&ids=' + encodeURIComponent(دفعة.join(',')));
      if(d && d.ok && d.itemsById){
        دفعة.forEach(id => { if(d.itemsById[id]) state.admin.items[id] = normalizeItems_(d.itemsById[id]); });
      }
    }catch(e){}
    // أي طلب ما رجعش في الرد (سيرفر قديم مثلًا) بنجيبه لوحده
    for(const id of دفعة){
      if(!state.admin.items[id]){ try{ await loadOrderItems_(id); }catch(e){} }
    }
  }
}

// بتعرض HTML التقرير في طبقة فوق الشاشة، مصغّر ليدخل في عرض الموبايل.
// التقرير مرسوم بعرض A4 ثابت (794 بكسل)، فبنعمله scale حسب عرض الشاشة
// عشان يتقري من غير تمرير أفقي.
function showReportPreview_(html, title, orderId){
  const old = document.getElementById('reportPreviewOverlay'); if(old) old.remove();
  const ov = document.createElement('div');
  ov.id = 'reportPreviewOverlay';
  ov.className = 'rpv';
  ov.innerHTML = `
    <div class="rpv-bar">
      <b>معاينة — ${esc(title||'')}</b>
      <button class="rpv-bank ${state.showBank===false?'':'on'}" data-act="rpv-bank" title="إظهار/إخفاء بيانات التحويل البنكي">${ico('money')}<span>الحساب</span></button>
      <button class="rpv-pdf" data-act="rpv-pdf" data-name="${esc(title||'')}"${orderId?` data-id="${esc(orderId)}"`:''}>${ico('doc')}تصدير PDF</button>
      <button class="rpv-x" data-act="rpv-close" aria-label="إغلاق المعاينة">${ico('x')}</button>
    </div>
    <div class="rpv-scroll"><div class="rpv-fit"><div class="rpv-page">${html}</div></div></div>`;
  document.body.appendChild(ov);

  // نظبط التصغير حسب عرض الشاشة
  const fit = () => {
    const page = ov.querySelector('.rpv-page');
    const fitBox = ov.querySelector('.rpv-fit');
    const wrap = ov.querySelector('.rpv-scroll');
    if(!page || !fitBox || !wrap) return;
    const natural = 794;                        // نفس عرض #paper — مثبّت في الـ CSS
    const avail = Math.max(200, wrap.clientWidth - 16);
    const k = Math.min(1, avail / natural);
    page.style.transform = k < 1 ? 'scale(' + k + ')' : 'none';
    fitBox.style.width  = Math.round(natural * k) + 'px';
    fitBox.style.height = Math.round(page.offsetHeight * k) + 'px';
  };
  requestAnimationFrame(()=>{ fit(); setTimeout(fit, 250); });   // تاني مرة بعد ما الصور تتحمّل
  ov._fit = fit;
  window.addEventListener('resize', fit);

  // الضغط في أي مكان فاضي بره الورقة بيقفل — منطقة التمرير بتملى الشاشة،
  // فلازم نحسبها هي كمان مش الطبقة الخارجية بس.
  ov.addEventListener('click', e=>{
    if(e.target===ov || e.target.classList.contains('rpv-scroll')) closeReportPreview_();
  });
}

function closeReportPreview_(){
  const ov = document.getElementById('reportPreviewOverlay');
  if(!ov) return;
  if(ov._fit) window.removeEventListener('resize', ov._fit);
  ov.remove();
}

// ============================================================
// تصدير إكسيل — تقرير الطلبات (شاشة المصنع) — منظّم بالعربي، مجمّع لكل عميل
// بنفس روح تصميم تقرير الأبواب المعلّقة/الـ PDF الشامل (لوجو + ألوان + عناوين عربي)
// ============================================================
const ITEM_TYPE_AR_ = { 'Door':'باب', 'Frame':'حلق', 'Bror':'برور', 'Mabra':'معبرة', 'Panel':'لوح بروديوم', 'Strip':'شريط', 'Veneer':'قشرة' };
function itemTypeAr_(t){ return ITEM_TYPE_AR_[t] || 'إكسسوار'; }
function itemUnitAr_(u){
  const s = String(u||'').trim();
  if(s==='door') return 'باب';
  if(s==='pc') return 'قطعة';
  // السطر المدموج فيه أعواد بأطوال مختلفة — مالوش طول واحد يتكتب جنب الوحدة،
  // الأطوال مكتوبة في وصف الصنف نفسه.
  if(s==='rods') return 'عود';
  // ⚠️ كانت بترجّع «عود 220cmم»: الـcm مابتتشالش و«م» بتتزاد عليها.
  // ده بيبان للمصنع في كشف الإكسل وفي وحدة كل صنف.
  const rod = /^rod\s+(.+)$/i.exec(s);
  if(rod) return 'عود ' + rod[1].replace(/\s*cm\s*$/i, '') + ' سم';
  return s || '—';
}
// لو الصنف باب معروف (كود من A01..A10) بنرجّع اسمه العربي بدل الاعتماد على النص الإنجليزي المخزّن
function itemNameAr_(it){
  if(it.type==='Door'){
    const d = DOORS.find(x=>x.code===doorCode_(it.code));
    if(d) return 'باب '+d.name+' — '+it.code;
  }
  return it.title || it.code || '—';
}

function buildAdminOrdersDetail_(orders){
  const byCustomer = {}, order = [];
  orders.forEach(o=>{
    const key = o.dist || '—';
    if(!byCustomer[key]){ byCustomer[key]=[]; order.push(key); }
    byCustomer[key].push(o);
  });
  return order.map(name=>{
    const ords = byCustomer[name];
    const codeTotals = {}; // key: type+code -> {label, qty}
    let clientQty = 0, clientProduced = 0;
    ords.forEach(o=>(o.items||[]).forEach(it=>{
      if(isCutLine_(it)) return;      // بند تسعير — مش شغل إنتاج
      const qty = Number(it.qty)||0;
      const pp = itemProdPending_(it);
      clientQty += qty; clientProduced += pp.produced;
      const key = it.type+'|'+(it.code||it.title||'')+(it.isSet?'|set':'');
      if(!codeTotals[key]) codeTotals[key] = { type:it.type, code:it.code||'', name:itemNameAr_(it), qty:0, produced:0 };
      codeTotals[key].qty += qty;
      codeTotals[key].produced += pp.produced;
    }));
    return { name, orders:ords, clientQty, clientProduced, clientPending: clientQty-clientProduced, codeTotals: Object.values(codeTotals).sort((a,b)=>b.qty-a.qty) };
  });
}

async function buildAdminOrdersExcel_(orders){
  if(!orders.length){ toast('مفيش طلبات'); return; }
  if(!await needLibs_('exceljs')) return;

  // أبواب بس — زي الـ PDF بالظبط: بنشيل الإكسسوارات والحلق/البرور المنفصلين،
  // وأي طلب مابقاش فيه ولا باب بيتشال بالكامل من التلات شيتات.
  orders = orders
    .map(o=>Object.assign({}, o, { items:(o.items||[]).filter(it=>it.type==='Door') }))
    .filter(o=>(o.items||[]).length);
  if(!orders.length){ toast('مفيش أبواب في الطلبات الحالية'); return; }

  // عمود "ارتفاع الحلق" شرطي على مستوى المصنَّف كله (زي docHTML/reportHTML) — يظهر بس لو صنف باب
  // واحد على الأقل في كل الطلبات متسجّل له عرض حلق + ارتفاع حلق مع بعض.
  const showFrameHCol = orders.some(o=>(o.items||[]).some(it=>it.frame && it.frameHeight));

  busy(true,'جارٍ تجهيز الإكسيل…');

  const NAVY='FF002050', BRAND='FF1080C0', LIGHT='FFEAF2FA', WHITE='FFFFFFFF',
        BORDER_CLR='FFDCE4EC', ZEBRA='FFF7FAFC';
  const thin = {style:'thin', color:{argb:BORDER_CLR}};
  const border = {top:thin,left:thin,right:thin,bottom:thin};
  const FONT='Arial';

  const wb = new ExcelJS.Workbook();
  wb.creator = COMPANY_AR;
  wb.created = new Date();

  let logoImgId = null;
  try{ const lb64 = await logoBase64_(); if(lb64) logoImgId = wb.addImage({ base64: lb64, extension:'png' }); }catch(e){}

  function addHeaderBand_(ws, lastCol, title, subtitle){
    ws.mergeCells(1,1,3,1);
    ws.getRow(1).height = 26; ws.getRow(2).height = 20; ws.getRow(3).height = 18;
    if(logoImgId){ ws.addImage(logoImgId, { tl:{col:0.15, row:0.15}, ext:{width:58, height:58} }); }
    ws.mergeCells(1,2,1,lastCol);
    const tCell = ws.getCell(1,2);
    tCell.value = title;
    tCell.font = {bold:true, size:16, color:{argb:NAVY}, name:'Arial'};
    tCell.alignment = {horizontal:'right', vertical:'middle'};
    ws.mergeCells(2,2,2,lastCol);
    const sCell = ws.getCell(2,2);
    sCell.value = subtitle;
    sCell.font = {size:10.5, color:{argb:'FF6B7A8C'}, name:'Arial'};
    sCell.alignment = {horizontal:'right', vertical:'middle'};
    ws.mergeCells(3,2,3,lastCol);
    ws.getCell(3,2).border = {bottom:{style:'medium', color:{argb:BRAND}}};
    ws.getCell(3,1).border = {bottom:{style:'medium', color:{argb:BRAND}}};
    return 4;
  }

  // ---------- ورقة 1: ملخص الطلبات ----------
  const wsSum = wb.addWorksheet('ملخص الطلبات', { views:[{ rightToLeft:true }] });
  wsSum.columns = [
    {width:4},{key:'id',width:14},{key:'date',width:12},{key:'dist',width:22},
    {key:'customer',width:22},
    {key:'phone',width:14},{key:'region',width:13},{key:'wh',width:12},
    {key:'status',width:15},{key:'qty',width:10},{key:'produced',width:9},{key:'pending',width:9}
  ];
  const sumLastCol = 12;
  addHeaderBand_(wsSum, sumLastCol, 'تقرير الأبواب', COMPANY_AR+' — '+new Date().toLocaleDateString('ar-EG')+' — إجمالي الطلبات: '+orders.length);
  wsSum.addRow([]);
  const hdrSum = wsSum.addRow(['','رقم الطلب','التاريخ','صاحب الحساب','صاحب الأوردر','الهاتف','المنطقة','المخزن','الحالة','إجمالي الكمية','جاهز','متبقي']);
  hdrSum.eachCell((c,i)=>{ if(i===1) return; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:NAVY}}; c.font={bold:true,color:{argb:WHITE},name:FONT,size:10.5}; c.alignment={horizontal:'center',vertical:'middle'}; c.border=border; });
  hdrSum.height = 22;
  wsSum.views = [{ rightToLeft:true, state:'frozen', ySplit:hdrSum.number }];

  let grandQty = 0, grandProducedSum = 0;
  orders.forEach((o,idx)=>{
    const qty = (o.items||[]).reduce((s,it)=>s+(Number(it.qty)||0),0);
    const produced = (o.items||[]).reduce((s,it)=>s+itemProdPending_(it).produced,0);
    grandQty += qty; grandProducedSum += produced;
    const pending = qty-produced;
    const st = STATUS[o.status] || {ar:o.status||'—'};
    const r = wsSum.addRow(['', o.id, xlDate_(o.date), o.dist||'', o.customer||'—', String(o.phone||''), o.region||'', o.warehouse||'', st.ar, qty, produced, pending]);
    xlDateCell_(r, 3);
    r.eachCell((c,i)=>{ if(i===1) return; c.border=border; c.font={name:FONT,size:10.5, color: i===11?{argb:'FF1E8E52'}:(i===12&&pending>0?{argb:'FFB3261E'}:undefined)}; c.alignment={horizontal:'center',vertical:'middle'};
      if(idx%2===1) c.fill={type:'pattern',pattern:'solid',fgColor:{argb:ZEBRA}}; });
  });
  const totRowSum = wsSum.addRow(['','','','','','','','','الإجمالي الكلي', grandQty, grandProducedSum, grandQty-grandProducedSum]);
  totRowSum.eachCell((c,i)=>{ if(i===1) return; c.font={bold:true,name:FONT,size:11,color:{argb:NAVY}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:LIGHT}}; c.border=border; c.alignment={horizontal:'center'}; });
  wsSum.autoFilter = { from:{row:hdrSum.number,column:2}, to:{row:hdrSum.number,column:sumLastCol} };

  // ---------- ورقة 2: تفاصيل حسب العميل ----------
  const wsDet = wb.addWorksheet('تفاصيل حسب العميل', { views:[{ rightToLeft:true }] });
  wsDet.columns = [ {width:4},{width:12},{width:12},{width:24},{width:11},{width:11},{width:10}
    ].concat(showFrameHCol?[{width:10}]:[]).concat([{width:9},{width:12},{width:9},{width:9},{width:9},{width:9}]);
  const detLastCol = 13 + (showFrameHCol?1:0);
  addHeaderBand_(wsDet, detLastCol, 'تفاصيل الطلبات حسب العميل', COMPANY_AR+' — '+new Date().toLocaleDateString('ar-EG'));
  wsDet.addRow([]);

  const data = buildAdminOrdersDetail_(orders);
  // ترقيم الأعمدة ديناميكي حسب ظهور عمود "ارتفاع الحلق" — عشان تلوين الخلايا الصح، وبيستخدمه
  // كل من صفوف الأصناف وصفوف إجمالي الكود مع بعض.
  const BROR_COL = showFrameHCol?9:8, QTY_COL2 = BROR_COL+2, PRO_COL2 = QTY_COL2+1, PEND_COL2 = PRO_COL2+1, AVAIL_COL2 = PEND_COL2+1;
  data.forEach(cust=>{
    const rName = wsDet.addRow(['', 'صاحب الحساب:  '+cust.name]);
    wsDet.mergeCells(rName.number,2,rName.number,detLastCol);
    rName.eachCell((c,i)=>{ if(i===1) return; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:NAVY}}; c.font={bold:true,color:{argb:WHITE},name:'Arial',size:13}; c.alignment={horizontal:'right',vertical:'middle'}; });
    rName.height = 22;

    cust.orders.forEach(o=>{
      const st = STATUS[o.status] || {ar:o.status||'—'};
      const rOrd = wsDet.addRow(['', 'طلب '+orderNoText_(o)+'  —  '+dateStr2_(o.date)+'  —  '+st.ar+(o.customer?'  —  صاحب الأوردر: '+o.customer:'')]);
      wsDet.mergeCells(rOrd.number,2,rOrd.number,detLastCol);
      rOrd.eachCell((c,i)=>{ if(i===1) return; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:BRAND}}; c.font={bold:true,color:{argb:WHITE},name:FONT,size:10.5}; c.alignment={horizontal:'right',vertical:'middle'}; });

      const hdrCells = ['','النوع','الكود','الصنف','عرض الفتحة','ارتفاع الفتحة','عرض الحلق']
        .concat(showFrameHCol?['ارتفاع الحلق']:[]).concat(['البرور','الوحدة','الكمية','جاهز','متبقي','متاح؟']);
      const hdr = wsDet.addRow(hdrCells);
      hdr.eachCell((c,i)=>{ if(i===1) return; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:LIGHT}}; c.font={bold:true,color:{argb:NAVY},name:FONT,size:10}; c.alignment={horizontal:'center'}; c.border=border; });

      (o.items||[]).filter(it=>!quoteOnlyLine_(it)).forEach(it=>{
        const sp = itemSpecCells_(it);
        const wh = {w:sp.w, h:sp.h}, frameW = sp.frameW, frameH = sp.frameH, brorTxt = sp.bror;
        const pp = itemProdPending_(it);
        const cells = ['', itemTypeAr_(it.type), it.code||'—', itemNameAr_(it), wh.w||'—', wh.h||'—', frameW]
          .concat(showFrameHCol?[frameH]:[]).concat([brorTxt, itemUnitAr_(it.unit), Number(it.qty)||0, pp.produced, pp.pending, it.avail===false?'غير متاح':'متاح']);
        const row = wsDet.addRow(cells);
        row.eachCell((c,i)=>{ if(i===1) return; c.border=border; c.font={name:FONT,size:10}; c.alignment={horizontal:'center'};
          if(i===PRO_COL2) c.font={name:FONT,size:10,color:{argb:'FF1E8E52'}};
          if(i===PEND_COL2 && pp.pending>0) c.font={name:FONT,size:10,color:{argb:'FFB3261E'},bold:true};
          if(i===AVAIL_COL2 && it.avail===false) c.font={name:FONT,size:10,color:{argb:'FFB3261E'},bold:true}; });
      });
    });

    if(cust.codeTotals.length){
      const rCodeHdr = wsDet.addRow(['','إجمالي كل صنف (كود) — صاحب الحساب '+cust.name]);
      wsDet.mergeCells(rCodeHdr.number,2,rCodeHdr.number,detLastCol);
      rCodeHdr.eachCell((c,i)=>{ if(i===1) return; c.font={bold:true,color:{argb:NAVY},name:FONT,size:10.5}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF3F6FA'}}; });
      cust.codeTotals.forEach(ct=>{
        const cells = ['', itemTypeAr_(ct.type), ct.code||'—', ct.name, '', '', '']
          .concat(showFrameHCol?['']:[]).concat(['', '', ct.qty, ct.produced, ct.qty-ct.produced, '']);
        const r = wsDet.addRow(cells);
        r.eachCell((c,i)=>{ if(i===1) return; c.font={name:FONT,size:10, color: i===PRO_COL2?{argb:'FF1E8E52'}:(i===PEND_COL2&&(ct.qty-ct.produced)>0?{argb:'FFB3261E'}:undefined)}; if((i>=2&&i<=4)||i===QTY_COL2||i===PRO_COL2||i===PEND_COL2) c.border=border; c.alignment={horizontal:'center'}; });
      });
    }

    const rTot = wsDet.addRow(['', 'إجمالي صاحب الحساب '+cust.name+':  '+cust.clientQty+' قطعة  (جاهز '+cust.clientProduced+' · متبقي '+cust.clientPending+')']);
    wsDet.mergeCells(rTot.number,2,rTot.number,detLastCol);
    rTot.eachCell((c,i)=>{ if(i===1) return; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:LIGHT}}; c.font={bold:true,color:{argb:NAVY},name:FONT,size:11.5}; c.alignment={horizontal:'right',vertical:'middle'}; });
    rTot.height = 20;
    wsDet.addRow([]);
  });

  // ---------- ورقة 3: إجمالي الأصناف (كل الأكواد، كل العملاء) ----------
  const wsCodes = wb.addWorksheet('إجمالي الأصناف', { views:[{ rightToLeft:true }] });
  wsCodes.columns = [ {width:4},{width:10},{width:12},{width:26},{width:14},{width:10},{width:10},{width:10} ];
  const codesLastCol = 8;
  addHeaderBand_(wsCodes, codesLastCol, 'إجمالي الأصناف — كل العملاء', COMPANY_AR+' — '+new Date().toLocaleDateString('ar-EG'));
  wsCodes.addRow([]);
  const hdrCodes = wsCodes.addRow(['','النوع','الكود','الصنف','عدد الطلبات','إجمالي الكمية','جاهز','متبقي']);
  hdrCodes.eachCell((c,i)=>{ if(i===1) return; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:NAVY}}; c.font={bold:true,color:{argb:WHITE},name:FONT,size:10.5}; c.alignment={horizontal:'center'}; c.border=border; });
  hdrCodes.height=22;
  wsCodes.views = [{ rightToLeft:true, state:'frozen', ySplit:hdrCodes.number }];

  const grandList = groupItemsByCode_(orders);
  let grandProducedX = 0;
  grandList.forEach((g,idx)=>{
    grandProducedX += g.produced;
    const pending = g.qty-g.produced;
    const r = wsCodes.addRow(['', itemTypeAr_(g.type), g.code||'—', g.name, g.orderIds.size, g.qty, g.produced, pending]);
    r.eachCell((c,i)=>{ if(i===1) return; c.border=border; c.font={name:FONT,size:10.5, color: i===7?{argb:'FF1E8E52'}:(i===8&&pending>0?{argb:'FFB3261E'}:undefined)}; c.alignment={horizontal:'center'};
      if(idx%2===1) c.fill={type:'pattern',pattern:'solid',fgColor:{argb:ZEBRA}}; });
  });
  const rGrandTot = wsCodes.addRow(['','','','','الإجمالي الكلي', grandQty, grandProducedX, grandQty-grandProducedX]);
  rGrandTot.eachCell((c,i)=>{ if(i===1) return; c.font={bold:true,color:{argb:NAVY},name:FONT,size:11}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:LIGHT}}; c.border=border; c.alignment={horizontal:'center'}; });
  wsCodes.autoFilter = { from:{row:hdrCodes.number,column:2}, to:{row:hdrCodes.number,column:codesLastCol} };

  // نفس معاملة تقارير الـPDF: شاشة المشاركة الأصلية على الموبايل (واتساب/درايف)،
  // وتنزيل عادي على الكمبيوتر. downloadBlob لوحدها كانت بترمي الملف في مجلد

  await shareOrDownload_(blob, 'تقرير_الأبواب_'+isoLocal_()+'.xlsx', 'تقرير الأبواب');

}

// التاريخ في ملفات الإكسيل لازم يتكتب كقيمة تاريخ حقيقية مش نص.
// كان بيتكتب نص بأرقام عربية (زي "٠٣‏/٠٩‏/٢٠٢٦") — شكله مظبوط بس إكسيل مايعرفش
// يرتّبه ولا يفلتر بمدى تواريخ ولا يستخدمه في PivotTable، فعمود التاريخ كان
// عمليًا مالوش فايدة للمصنع. بنرجّع Date وبنحط numFmt على الخانة بعد الإضافة.
function xlDate_(v){
  if(v===''||v==null) return '';
  const d = (v instanceof Date) ? v : new Date(v);
  return isNaN(d.getTime()) ? '' : d;
}
// بتحط تنسيق تاريخ ومحاذاة على خانة واحدة في صف إكسيل (بترجّع من غير ما تعمل حاجة لو مش تاريخ)
function xlDateCell_(row, col){
  const c = row.getCell(col);
  if(c.value instanceof Date){ c.numFmt = 'yyyy-mm-dd'; c.alignment = { horizontal:'center' }; }
}

// اسم اليوم بالعربي الفصيح (الأحد/الاثنين/الثلاثاء/…) — المصنع بيرتّب شغله
// بالأيام مش بالتواريخ، والأسماء دي هي اللي بتتكتب على الورق والمستندات.
const DAY_AR_ = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
// ⚠️ new Date('2026-09-08') بيتقرا على إنه UTC، فالجهاز اللي توقيته قبل UTC
// بيرجّع اليوم اللي قبله — اسم اليوم بيطلع غلط. بنفكّ التاريخ بإيدينا بدل كده.
function dateParts_(d){
  if(!d) return null;
  const m = String(d).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return { y:+m[1], m:+m[2], d:+m[3] };
  const t = new Date(d);
  if(isNaN(t.getTime())) return null;
  return { y:t.getFullYear(), m:t.getMonth()+1, d:t.getDate() };
}
function dayNameAr_(d){
  const p = dateParts_(d); if(!p) return '';
  return DAY_AR_[new Date(p.y, p.m-1, p.d).getDay()] || '';
}
function dateStr2_(d){
  const p = dateParts_(d); if(!p) return String(d||'');
  try{ return new Date(p.y, p.m-1, p.d).toLocaleDateString('ar-EG',{day:'2-digit',month:'2-digit',year:'numeric'}); }
  catch(e){ return p.d+'/'+p.m+'/'+p.y; }
}

let adminPollTimer = null;
// ⚠️ باج كان هنا: المستمع ده كان بيتسجّل جوّه startAdminPolling. الخروج من شاشة
// المصنع بيوقّف المؤقّت بس مابيشيلش المستمع، فكل دخول جديد كان بيضيف واحد
// كمان — وكل مرة المصنع يرجّع التطبيق قدامه كان بيتبعت فحص كامل للشيت مرة
// لكل دخول عمله في الجلسة. الشاشة اللي أصلاً بطيئة كانت بتبطّأ أكتر وأكتر.
// دلوقتي بيتسجّل مرة واحدة، وبيشوف بنفسه لو المؤقّت شغّال ولا لأ.
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && adminPollTimer) adminPoll();
});
function startAdminPolling(){
  if(adminPollTimer || !APPS_SCRIPT_URL) return;
  adminPollTimer = setInterval(()=>adminPoll(), 90000);   // فحص خلفي كل ٩٠ ثانية طول ما الشاشة مفتوحة
}

// فحص خلفي: بيقارن آخر حالة معروفة لكل طلب بالحالة الجديدة —
// طلب جديد خالص → يزوّد عداد "معلق" فوق تبويب 🏭. طلب اتغيّرت حالته → إشعار فوري.
let _adminPollRunning = false;
async function adminPoll(){
  if(!APPS_SCRIPT_URL || !state.admin.pw) return;
  // التطبيق في الخلفية (الشاشة مقفولة أو المستخدم في تطبيق تاني)؟ مافيش داعي نستهلك نت وبطارية
  if(document.hidden) return;
  // نداء لسه شغّال؟ كل نداء بيقرا الشيت كله — منعملش اتنين مع بعض
  if(_adminPollRunning) return;
  _adminPollRunning = true;
  try{
    const d = await jsonp(APPS_SCRIPT_URL + '?action=list' + admParams_());
    if(!d || !d.ok) return;
    const rows = dropDeleted_(d.orders);
    const seen = loadAdminSeen_();
    // ⚠️ أول تشغيلة على جهاز جديد: مفيش أي طلب متسجّل كـ«مشوف»، فكل الطلبات
    // الموجودة هتبان جديدة والنافذة هتفتح بقايمة كاملة. markAdminSeen_ بتتنادى
    // جوّه adminLoad، لكن الفحص بيبدأ من غير ما يستنّاها — فبنسجّل الموجود
    // ونسكت في المرة الأولى بس.
    const أول_مرة = Object.keys(seen).length === 0;
    let pending = 0;
    const جداد = [];
    rows.forEach(o=>{
      const prev = seen[o.id];
      if(prev===undefined){
        pending++;
        جداد.push(o);
      } else if(prev !== o.status){
        const stAr = (STATUS[o.status] && STATUS[o.status].ar) || o.status;
        notifyAdmin_('طلب '+orderNoText_(o)+' تم تعديله لـ '+stAr, o.dist?('صاحب الطلب: '+o.dist):'');
      }
      seen[o.id] = o.status;
    });
    saveAdminSeen_(seen);
    state.admin.pendingCount = pending;
    updateAdmBadge();
    // إشعار واحد ونافذة واحدة لكل الطلبات الجديدة مع بعض — مش إشعار لكل طلب
    // بيمسح اللي قبله. الإشعار بيوصل حتى لو المصنع في تطبيق تاني، والنافذة
    // بتفضل مستنياه لما يرجع.
    if(جداد.length && !أول_مرة){
      notifyAdmin_(جداد.length===1 ? ('📥 طلب جديد '+orderNoText_(جداد[0])) : ('📥 '+جداد.length+' طلبات جديدة'),
                   جداد.length===1 ? (جداد[0].dist?('من: '+جداد[0].dist):'') : 'افتح شاشة المصنع للتفاصيل');
      showNewOrdersPopup_(جداد);
    }
    // لو شاشة متابعة المصنع مفتوحة فعلًا قدام المستخدم، حدّث القايمة المعروضة كمان
    if(state.admin.open && state.tab==='admin'){
      state.admin.rows = rows;
      state.admin.staleAt = null;
      saveAdminCache_(rows);
      // لو المستخدم واقف بيكتب في خانة (كمية/اسم عميل/تاريخ) مانعيدش الرسم دلوقتي
      // عشان مانضيّعش اللي بيكتبه — هيتحدّث في أقرب رسم جاي أو لما يخلص.
      const ae = document.activeElement;
      const typing = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
      if(!typing) render();
    }
  }catch(err){ /* أعطال الشبكة في الفحص الخلفي بنتجاهلها بصمت */ }
  finally{ _adminPollRunning = false; }
}

        </div>`
      : `<b style="color:${pending>0?'var(--danger-ink)':'var(--muted)'}">${pending}</b>`;

    // ⚠️ علامة «غير متاح» بتتطبع في مستند الطلب (شوف buildAdminDocOrder_) بس مكانش
    // فيه أي طريقة المصنع يعلّمها بيها — الدالة setItemAvail والمعالج موجودين من
    // غير زرار. الزرار ده بيقفل الدايرة: ضغطة بتقلب الحالة، والعميل يشوفها في ورقته.
    const avail = it.avail !== false;
    const availBusy = a.itemBusy === (oid+':'+idx);
    const availBtn = `<button class="btn ${avail?'act-send':'act-del'} sm"
        data-act="adm-item-avail" data-id="${esc(oid)}" data-idx="${idx}" data-avail="${avail?0:1}"
        ${availBusy?'disabled':''} title="${avail?'اضغط لتعليمه «غير متاح»':'اضغط لتعليمه «متاح»'}"
        style="font-size:11px;padding:3px 5px;min-height:0;width:auto">${availBusy?'…':(avail?ico('check'):ico('warn'))}</button>`;

    return `<tr data-act="${editing?'':'adm-prod-edit-open'}" data-id="${esc(oid)}" data-idx="${idx}" style="cursor:${editing?'default':'pointer'};${avail?'':'background:rgba(240,115,106,.13)'}">
      <td style="padding:6px 7px;text-align:right;font-size:12.5px">${avail?'':'<span style="color:var(--danger-ink);font-weight:700">غير متاح — </span>'}${title}</td>
      <td style="padding:6px 5px;text-align:center;font-size:12.5px;color:#A9BCD4;white-space:nowrap">${esc(sizeText_(it))}</td>
      <td style="padding:6px 5px;text-align:center;font-size:12.5px">${qty}</td>
      <td style="padding:6px 5px;text-align:center;font-size:12.5px">${readyCell}</td>
      <td style="padding:6px 5px;text-align:center;font-size:12.5px">${lastCell}</td>
      <td style="padding:6px 3px;text-align:center">${availBtn}</td>
    </tr>`;
  }).join('');

  return `<div style="overflow-x:auto;margin-top:6px">
    <table class="stktbl" style="min-width:0">
      <thead><tr>
        ${qtyMode
          ? `<th style="text-align:right">الصنف</th><th>المقاس</th><th colspan="2">الكمية</th><th>حذف</th>`
          : `<th style="text-align:right">الصنف</th><th>المقاس</th><th>مطلوب</th><th>جاهز</th><th>متبقي</th><th>متاح</th>`}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

// سطر الطلب الواحد على كارت العميل: رقمه وتاريخه ويومه، ومعاه معاينة وطباعة
// للطلب ده لوحده. قبل كده الأزرار كانت على مستوى العميل بس — يعني معاينة كل
// طلباته مع بعض — وكانت في نفس صف الأرقام فالشكل كان بيتداخل.
/* ============================================================
   ميعاد التسليم
   - الافتراضي: تاريخ الطلب + ١٤ يوم (السيرفر هو اللي بيحطه).
   - المصنع بيعدّله من الشريط الملوّن قدام كل أوردر.
   - أول ما المصنع يفتح الشاشة: نافذة بأوردرات النهاردة والمتأخرة،
     ولو فيه طلبات قديمة من غير ميعاد بتطلب منه يكتبهم.
   ============================================================ */
const DUE_DEFAULT_DAYS = 14;
const DUE_DONE_STATUSES = ['Delivered','Cancelled'];
function parseIso_(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||'').trim());
  return m ? new Date(Number(m[1]), Number(m[2])-1, Number(m[3])) : null;
}
function fmtIso_(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayIso_(){ return fmtIso_(new Date()); }
function addDaysIso_(iso, n){
  const d = parseIso_(iso) || new Date();
  d.setDate(d.getDate() + n);
  return fmtIso_(d);
}
function daysUntilIso_(iso){
  const d = parseIso_(iso), t = parseIso_(todayIso_());
  return (d && t) ? Math.round((d - t) / 86400000) : null;
}
function dueShort_(iso){
  const d = parseIso_(iso); if(!d) return '';
  try{ return d.toLocaleDateString('ar-EG',{day:'numeric',month:'numeric'}); }
  catch(e){ return (d.getDate())+'/'+(d.getMonth()+1); }
}
// بيرجّع {cls, label, days} لطلب — اللون والكلام حسب قرب الميعاد
function dueInfo_(o){
  const iso = o && o.due;
  const done = !!(o && (DUE_DONE_STATUSES.includes(o.status) || o.status==='Ready'));
  if(!iso || daysUntilIso_(iso)===null) return {cls:'due-none', label:'مفيش ميعاد تسليم — اضغط وحدّده', days:null, iso:''};
  const n = daysUntilIso_(iso);
  const dayName = dayNameAr_(iso);
  if(done) return {cls:'due-done', label:'التسليم', days:n, iso, extra:dayName+' '+dueShort_(iso)};
  if(n < 0)  return {cls:'due-overdue', label:'متأخر '+(n===-1?'يوم':(-n)+' يوم'), days:n, iso, extra:dayName+' '+dueShort_(iso)};
  if(n === 0) return {cls:'due-today', label:'التسليم النهاردة', days:0, iso, extra:dueShort_(iso)};
  if(n === 1) return {cls:'due-soon', label:'التسليم بكرة', days:1, iso, extra:dayName+' '+dueShort_(iso)};
  if(n <= 3)  return {cls:'due-soon', label:'التسليم بعد '+n+' أيام', days:n, iso, extra:dayName+' '+dueShort_(iso)};
  return {cls:'due-later', label:'التسليم بعد '+n+' يوم', days:n, iso, extra:dayName+' '+dueShort_(iso)};
}
// الشريط الملوّن قدام الأوردر. الضغط عليه بيفتح اختيار التاريخ مباشرة.
function dueChipHTML_(o, editable){ /* v221: ميعاد التسليم اتلغى من شاشة المصنع نهائيًا */ return '';
  const inf = dueInfo_(o);
  const ic = inf.cls==='due-overdue' ? 'warn' : (inf.cls==='due-done' ? 'checkC' : 'clock');
  const input = editable
    ? `<input type="date" value="${esc(inf.iso||addDaysIso_(o.date||todayIso_(), DUE_DEFAULT_DAYS))}" data-act="due-set" data-id="${esc(o.id)}" aria-label="تعديل ميعاد التسليم">`
    : '';
  return `<label class="due ${inf.cls}" title="ميعاد التسليم">${ico(ic)}<span class="dl">${esc(inf.label)}</span>${inf.extra?`<span class="de">${esc(inf.extra)}</span>`:''}${editable?ico('edit'):''}${input}</label>`;
}
// ميعاد الاستلام اللي بيتكتب في مستند الأوردر: اللي المصنع حدده لو معروف،
// وإلا تاريخ الطلب + ١٤ يوم (نفس افتراضي السيرفر)
function docDue_(o){
  const live = (state.track.rows||[]).find(r=>String(r.id)===String(o.id));
  const v = (o.due && parseIso_(o.due)) ? o.due
          : (live && live.due && parseIso_(live.due)) ? live.due
          : (o.dueDate && parseIso_(o.dueDate)) ? o.dueDate : '';
  return v || addDaysIso_(isoLocal_(o.ts), DUE_DEFAULT_DAYS);
}
function dueCounts_(rows){
  const c = {today:0, overdue:0, none:0};
  (rows||[]).forEach(o=>{
    if(!o || DUE_DONE_STATUSES.includes(o.status) || o.superseded) return;
    if(!o.due){ c.none++; return; }
    const n = daysUntilIso_(o.due);
    if(n===null) { c.none++; return; }
    if(n===0) c.today++; else if(n<0 && o.status!=='Ready') c.overdue++;
  });
  return c;
}
function grpDueBadges_(orders){ /* v221: ميعاد التسليم اتلغى من شاشة المصنع نهائيًا */ return '';
  if(state.admin.viewArchive) return '';
  const c = dueCounts_(orders);
  return (c.overdue?`<span class="due-mini due-overdue">متأخر ${c.overdue}</span>`:'')
       + (c.today?`<span class="due-mini due-today">النهاردة ${c.today}</span>`:'');
}
function dueStripHTML_(rows){ /* v221: ميعاد التسليم اتلغى من شاشة المصنع نهائيًا */ return '';
  const act = (rows||[]).filter(o=>o && !DUE_DONE_STATUSES.includes(o.status) && !o.superseded);
  const qty = l=>l.reduce((s,o)=>s+(Number(o.qty)||0),0);
  const today = act.filter(o=>o.due && daysUntilIso_(o.due)===0);
  const late  = act.filter(o=>o.due && daysUntilIso_(o.due)<0 && o.status!=='Ready');
  const prod  = act.filter(o=>o.status==='In Progress');
  const none  = act.filter(o=>!o.due);
  const oldest = late.length ? Math.max(...late.map(o=>-daysUntilIso_(o.due))) : 0;
  const card = (cls, ic, t, n, sub, act_)=>`<button class="kpi ${cls}" data-act="${act_}">
      <div class="kt"><span>${t}</span>${ico(ic)}</div><div class="kn">${n}</div><div class="ks">${sub}</div></button>`;
  return `<div class="kpis">
    ${card('due-today','truck','تسليم النهاردة', today.length, today.length?`${qty(today)} قطعة`:'مفيش النهاردة','adm-due-open')}
    ${card('due-overdue','warn','متأخر', late.length, late.length?`أقدمها متأخر ${oldest} ${oldest===1?'يوم':'أيام'}`:'مفيش متأخر','adm-due-open')}
    ${card('due-later','box','تحت التنفيذ', prod.length, prod.length?`${qty(prod)} قطعة`:'مفيش دلوقتي','adm-due-open')}
    ${card('due-none','clock','من غير ميعاد', none.length, none.length?'اضغط وحدّد المواعيد':'كله له ميعاد','adm-due-open')}
  </div>`;
}
// حفظ ميعاد واحد — تحديث فوري على الشاشة والرجوع للقديم لو السيرفر رفض
async function saveDue_(id, iso){
  const o = adminOrderById_(id); if(!o) return;
  const old = o.due || '';
  if(iso === old) return;
  o.due = iso; render();
  try{
    const d = await jsonp(APPS_SCRIPT_URL + '?action=setOrderMeta' + admParams_()
      + '&id=' + encodeURIComponent(id) + '&due=' + encodeURIComponent(iso));
    if(!d || !d.ok) throw new Error((d && d.error) || 'فشل الحفظ');
    saveAdminCache_(state.admin.rows);
    toast('اتحفظ ميعاد التسليم');
  }catch(err){
    o.due = old; render();
    toast('تعذّر حفظ الميعاد: ' + (err.message||err), 5000);
  }
}
// حفظ مجموعة مواعيد (للطلبات القديمة) — دفعات صغيرة عشان طول الرابط
async function saveDueBatch_(map){
  const ids = Object.keys(map);
  let ok = 0;
  for(let i=0; i<ids.length; i+=25){
    const part = ids.slice(i, i+25).map(id=>({id, due:map[id]}));
    const d = await jsonp(APPS_SCRIPT_URL + '?action=setDueBatch' + admParams_()
      + '&payload=' + encodeURIComponent(JSON.stringify(part)), 60000);
    if(!d || !d.ok) throw new Error((d && d.error) || 'فشل الحفظ');
    part.forEach(x=>{ const o = adminOrderById_(x.id); if(o) o.due = x.due; });
    ok += part.length;
  }
  saveAdminCache_(state.admin.rows);
  return ok;
}

let _dueOverlayShownThisSession = false;
function maybeShowDueOverlay_(force){ /* v221: ميعاد التسليم اتلغى من شاشة المصنع نهائيًا */ return;
  const a = state.admin;
  if(!a.open || !a.rows || a.staleAt || a.viewArchive) return;
  if(!force){
    if(_dueOverlayShownThisSession || state.tab!=='admin') return;
  }
  const active = a.rows.filter(o=>!DUE_DONE_STATUSES.includes(o.status) && !o.superseded);
  const today = active.filter(o=>o.due && daysUntilIso_(o.due)===0);
  const late = active.filter(o=>o.due && daysUntilIso_(o.due)<0 && o.status!=='Ready');
  const none = active.filter(o=>!o.due);
  if(!force && !today.length && !late.length && !none.length){ _dueOverlayShownThisSession = true; return; }
  _dueOverlayShownThisSession = true;
  showDueOverlay_(today, late, none);
}
function showDueOverlay_(today, late, none){
  const old = document.getElementById('dueOverlay'); if(old) old.remove();
  const ov = document.createElement('div');
  ov.id = 'dueOverlay'; ov.className = 'dueov';
  const rowHtml = o=>`<div class="rw">
      <div class="t"><b>${esc(orderNoText_(o))}</b> ${statusPill(o.status)}
        <div>${esc(o.customer||o.dist||'')}${o.customer&&o.dist?' · '+esc(o.dist):''} · ${esc(o.qty||0)} قطعة${o.due&&daysUntilIso_(o.due)<0?' · كان '+esc(dateStr2_(o.due)):''}</div></div>
    </div>`;
  const draft = {};
  none.forEach(o=>{ draft[o.id] = addDaysIso_(o.date || todayIso_(), DUE_DEFAULT_DAYS); });
  const noneRow = o=>{
    const قيمة = draft[o.id], معرّف = o.id;
    return `<div class="rw col">
      <div class="t"><b>${esc(orderNoText_(o))}</b>
        <div>${esc(o.customer||o.dist||'')} · طُلب ${esc(dateStr2_(o.date))}</div></div>
      <input type="date" value="${esc(قيمة)}" data-did="${esc(معرّف)}">
    </div>`;
  };
  ov.innerHTML = `<div class="box">
    <h3>${ico('clock')} مواعيد التسليم</h3>
    <div class="sub">${esc(dayNameAr_(todayIso_()))} ${esc(dateStr2_(todayIso_()))}</div>
    ${today.length?`<div class="sec" style="color:var(--warn-ink)">${ico('truck')} تسليمهم النهاردة (${today.length})</div>${today.map(rowHtml).join('')}`:''}
    ${late.length?`<div class="sec" style="color:var(--danger-ink)">${ico('warn')} متأخرين (${late.length})</div>${late.map(rowHtml).join('')}`:''}
    ${!today.length && !late.length?`<div class="note" style="margin:6px 0 0">مفيش أوردرات ميعاد تسليمها النهاردة.</div>`:''}
    ${none.length?`<div class="sec" style="color:var(--warn-ink)">${ico('edit')} طلبات قديمة من غير ميعاد (${none.length})</div>
      <div class="sub" style="margin:4px 0 0">اكتب ميعاد التسليم قدام كل طلب (متحط تلقائي أسبوعين من تاريخ الطلب — عدّل اللي يفرق).</div>
      ${none.map(noneRow).join('')}
      <button id="dueSaveAll" class="btn brand" style="width:100%;margin-top:10px;padding:12px;font-weight:700">${ico('save')} حفظ مواعيد الطلبات القديمة</button>`:''}
    <button id="dueClose" style="width:100%;margin-top:10px;background:rgba(255,255,255,.12);color:var(--ink);padding:11px;border-radius:12px;font-size:13.5px">${none.length?'بعدين':'تمام'}</button>
  </div>`;
  document.body.appendChild(ov);
  const close = ()=>ov.remove();
  document.getElementById('dueClose').onclick = close;
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
  ov.querySelectorAll('input[data-did]').forEach(inp=>{
    inp.addEventListener('change', ()=>{ draft[inp.dataset.did] = inp.value; });
  });
  const sv = document.getElementById('dueSaveAll');
  if(sv) sv.onclick = async ()=>{
    const map = {};
    Object.keys(draft).forEach(id=>{ if(parseIso_(draft[id])) map[id] = draft[id]; });
    if(!Object.keys(map).length){ toast('اكتب التواريخ الأول'); return; }
    sv.disabled = true; sv.textContent = 'جارٍ الحفظ…';
    try{
      const n = await saveDueBatch_(map);
      toast('اتحفظ ميعاد '+n+' طلب'); close(); render();
    }catch(err){
      sv.disabled = false; sv.innerHTML = ico('save')+' حفظ مواعيد الطلبات القديمة';
      toast('تعذّر الحفظ: '+(err.message||err), 6000);
    }
  };
}

  const headerBtns = `${staleBar}<div class="ad-tools">
      <div class="ad-tg"><span class="ad-tl">${ico("clock")} عرض</span><div class="ad-row">
        <button class="btn ${a.viewStock?'brand':'act-edit'} sm" data-act="adm-toggle-stock">${ico("box")}${a.viewStock?'رجوع للطلبات':'أرصدة المخزن'}</button>
        <button class="btn ${viewingArchive?'brand':'act-edit'} sm" data-act="adm-toggle-archive">${ico("folder")}${viewingArchive?'رجوع للطلبات':'الأرشيف'}</button>
        <button class="btn act-money sm" data-act="adm-prices-open">${ico("money")}الأسعار</button>
      </div></div>
      <div class="ad-tg"><span class="ad-tl">${ico("doc")} تقارير</span><div class="ad-row">
        <button class="btn act-report sm" data-act="adm-pending-pdf">${ico("doc")}متبقي PDF</button>
        <button class="btn act-report sm" data-act="adm-pending-xls">${ico("sheet")}متبقي إكسيل</button>
        <button class="btn act-report sm" data-act="adm-full-pdf">${ico("report")}تقرير كامل</button>
        <button class="btn act-report sm" data-act="adm-full-xls">${ico("sheet")}كل الطلبات إكسيل</button>
      </div></div>
      ${viewingArchive?`<div class="ad-tg"><span class="ad-tl">${ico("trash")} الأرشيف</span><div class="ad-row">
        <button class="btn act-del sm" data-act="adm-clear-delivered">${ico("trash")}حذف المؤرشف</button></div></div>`:''}
      <div class="ad-row ad-end">
        <button class="btn act-tool sm" data-act="adm-reload">${ico("refresh")}${a.loading?'بيحدّث…':'تحديث'}</button>
        <button class="btn act-tool sm" data-act="adm-logout">${ico("lock")}خروج</button>
      </div>
    </div>`;

  if(a.pricesOpen) return viewAdminPrices() + verBar();

  if(viewingArchive && a.archLoading){
    return `<section class="card">
      <div class="step"><span class="n">${ico("folder","lg")}</span><h2>الأرشيف</h2></div>
      ${headerBtns}
    </section>
    <div class="empty"><span class="em">${ico("clock","xl")}</span><p>جارٍ تحميل الأرشيف…</p></div>${verBar()}`;
  }

  // ---------- شاشة أرصدة المخزن ----------
  if(a.viewStock){
    const rowsHtml = DOORS.map(d=>{
      const cells = SIZES.map(sz=>{
        const key = d.code+'|'+sz.w;
        const cur = stockFor(d.code, sz.w) || 0;
        const draft = a.stockDraft[key];
        const val = draft!==undefined ? draft : cur;
        const busy = a.stockBusy===key;
        const dirty = draft!==undefined && Number(draft)!==Number(cur);
        const res = reservedFor(d.code, sz.w);
        const free = cur-(res||0);
        return `<td style="padding:4px">
          <input type="number" inputmode="numeric" min="0" value="${esc(val)}"
            data-act="stock-in" data-code="${esc(d.code)}" data-w="${sz.w}"
            class="stkin ${dirty?'dirty':''}" ${busy?'disabled':''}>
          ${res>0?`<div style="text-align:center;font-size:11px;margin-top:2px"><span style="color:var(--danger-ink)">مطلوب ${res}</span> · <span style="color:${free<0?'var(--danger-ink)':'var(--ok-ink)'};font-weight:700">متبقي ${free}</span></div>`:''}
        </td>`;
      }).join('');
      const total = stockTotalFor(d.code)||0;
      const resTotal = SIZES.reduce((s,sz)=>s+(reservedFor(d.code, sz.w)||0),0);
      const freeTotal = total-resTotal;
      return `<tr>
        <td style="padding:5px 7px;white-space:nowrap"><b>${esc(d.code)}</b>
          <span style="color:var(--muted);font-size:12.5px"> ${esc(d.name)}</span></td>
        ${cells}
        <td style="padding:5px 7px;text-align:center;color:var(--muted);font-size:12.5px">${total}</td>
        <td style="padding:5px 7px;text-align:center;font-size:12.5px;color:${resTotal>0?'var(--danger-ink)':'var(--muted)'}">${resTotal||'—'}</td>
        <td style="padding:5px 7px;text-align:center;font-size:12.5px;font-weight:700;color:${freeTotal>0?'var(--ok-ink)':'var(--danger-ink)'}">${freeTotal}</td>
      </tr>`;
    }).join('');

    const dirtyCount = Object.keys(a.stockDraft).filter(k=>{
      const [c,w] = k.split('|');
      return Number(a.stockDraft[k]) !== Number(stockFor(c, Number(w))||0);
    }).length;

    return `<section class="card">
      <div class="step"><span class="n">${ico("box","lg")}</span><h2>أرصدة المخزن</h2>
        <span class="hint">الجاهز للتسليم</span></div>
      <div class="note" style="margin-top:0">اكتب الكمية المتاحة لكل كود ومقاس. العميل هيشوف
        «${esc(READY_HOURS_TXT)}» للأصناف اللي ليها رصيد. عمود «مطلوب لعملاء» بيوريك كام باب من نفس الكود/المقاس
        لسه محجوز لطلبات عملاء معلّقة، عشان تعرف الرصيد الفاضي فعليًا.</div>
      ${headerBtns}
      <div style="overflow-x:auto;margin-top:12px">
        <table class="stktbl">
          <thead><tr>
            <th style="text-align:right">الكود</th>
            ${SIZES.map(sz=>`<th>${sz.w} سم</th>`).join('')}
            <th>الإجمالي</th>
            <th>مطلوب لعملاء</th>
            <th>متبقي فعليًا</th>
          </tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
      <div class="btnrow" style="margin-top:12px">
        <button class="btn brand" data-act="stock-save" ${dirtyCount?'':'disabled'}>
          ${dirtyCount?`حفظ ${dirtyCount} تعديل`:'مفيش تعديلات'}</button>
        <button class="btn ghost sm" data-act="stock-reload">${ico("refresh")}تحديث</button>
        <button class="btn act-report sm" data-act="stock-pdf" ${a.stockPdfBusy?'disabled':''}>${ico("doc")}${a.stockPdfBusy?'…':'تصدير PDF'}</button>
      </div>
    </section>${verBar()}`;
  }


  if(!list || !list.length){
    return `<section class="card">
      <div class="step"><span class="n">${viewingArchive?ico("folder","lg"):ico("factory","lg")}</span><h2>${viewingArchive?'الأرشيف':'متابعة المصنع'}</h2></div>
      ${headerBtns}
    </section>
    <div class="empty"><span class="em">${ico("clip","xl")}</span><p>${viewingArchive?'مفيش طلبات مؤرشفة.':'مفيش طلبات نشطة لسه.'}</p></div>${verBar()}`;
  }

  const orderCardHTML_ = o=>{
    const busy = a.busy === o.id;
    const delBusy = a.delBusy === o.id;
    const prevBusy = a.orderPreviewBusy === o.id;
    const archBusy = a.archBusy === o.id;
    const btns = FLOW.map(st=>{
      const c = STATUS[st];
      const on = o.status === st;
      return `<button class="chip ${on?'on':''}" data-act="adm-set" data-id="${esc(o.id)}" data-st="${esc(st)}"
        ${busy?'disabled':''} style="flex:1;min-width:0;padding:8px 4px;font-size:12.5px">
        ${ico(c.ic,'lg')}<span style="display:block;margin-top:3px">${esc(c.ar)}</span></button>`;
    }).join('');

    const itemsOpen = !!a.itemsOpen[o.id];
    const qtyMode = !!a.qtyEditOpen[o.id];
    const its = a.items[o.id];
    let itemsHtml = '';
    if(itemsOpen){
      if(qtyMode){
        const meta = a.metaEdit[o.id] || {customer:o.customer||'', date:o.date||''};
        const metaBusy = a.metaBusy === o.id;
        itemsHtml += `<div style="margin-top:8px;padding:9px 10px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px">
          <div style="font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:6px">بيانات الطلب:</div>
          <div style="display:flex;gap:7px;flex-wrap:wrap">
            <label style="flex:1;min-width:140px;display:flex;flex-direction:column;gap:3px">
              <span style="font-size:12px;color:var(--muted)">صاحب الأوردر</span>
              <input type="text" value="${esc(meta.customer)}" data-act="meta-customer" data-id="${esc(o.id)}"
                style="border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:13px">
            </label>
            <label style="flex:1;min-width:120px;display:flex;flex-direction:column;gap:3px">
              <span style="font-size:12px;color:var(--muted)">تاريخ الطلب</span>
              <input type="date" value="${esc(meta.date)}" data-act="meta-date" data-id="${esc(o.id)}"
                style="border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px">
            </label>
          </div>
          <button class="btn sm" data-act="adm-meta-save" data-id="${esc(o.id)}" ${metaBusy?'disabled':''} style="margin-top:7px;font-size:12.5px;padding:6px 12px">${metaBusy?'…':ico('save')+' حفظ بيانات الطلب'}</button>
        </div>`;
      }
      if(its && its.length){
        itemsHtml += `<div style="margin-top:8px">
          <div style="font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:4px">${qtyMode?'تعديل الكمية المطلوبة أو حذف صنف من الطلب:':'تتبّع الإنتاج (لمسة على أي صف لتحديث الكمية الجاهزة):'}</div>
          ${prodTableHTML_(o.id, its, a, qtyMode)}
        </div>`;
      } else {
        itemsHtml += `<div class="note">جارٍ تحميل الأصناف…</div>`;
      }
    }

    // ⚠️ زرار PDF للطلب الواحد كان مفقود من الكارت — الدالة exportAdminOrderPdf
    // موجودة وشغّالة والمعالج موجود، بس مفيش زرار بينده عليهم. فالمصنع كان يقدر
    // يصدّر PDF لكل طلبات العميل مع بعض بس، مش طلب واحد.
    const actionBtns = `<button class="btn ${itemsOpen?'brand':'act-edit'} sm" data-act="adm-toggle-items" data-id="${esc(o.id)}">${ico("box")}${itemsOpen?'إخفاء':'الأصناف'}</button>
         <button class="btn act-tool sm" data-act="adm-preview" data-id="${esc(o.id)}" ${prevBusy?'disabled':''}>${ico("search")}${prevBusy?'…':'معاينة'}</button>
         <button class="btn act-report sm" data-act="adm-pdf" data-id="${esc(o.id)}">${ico("doc")}PDF</button>
         <button class="btn ${qtyMode?'brand':'act-edit'} sm" data-act="adm-toggle-qtymode" data-id="${esc(o.id)}">${ico("edit")}تعديل</button>
         <button class="btn act-edit sm" data-act="adm-add-items" data-id="${esc(o.id)}">${ico("plus")}إضافة</button>
         <button class="btn act-send sm" data-act="adm-share" data-id="${esc(o.id)}">${ico("send")}إرسال</button>
         <button class="btn act-money sm" data-act="adm-quote" data-id="${esc(o.id)}">${ico("money")}سعر</button>
         <button class="btn act-del sm" data-act="adm-del" data-id="${esc(o.id)}" ${delBusy?'disabled':''}>${ico("trash")}${delBusy?'…':'حذف'}</button>`;

    return `<div class="ord">
      <div class="oh"><span class="oid" title="الكود الداخلي: ${esc(o.id)}">${esc(orderNoText_(o))}</span>${Number(o.editCount)>0?`<span style="font-size:11.5px;font-weight:700;color:var(--warn-ink);background:rgba(217,164,65,.15);border:1px solid rgba(217,164,65,.4);border-radius:20px;padding:1px 8px">معدّل</span>`:''}${o.replacesId?`<span title="الكود الداخلي للطلب القديم: ${esc(o.replacesId)}" style="font-size:12px;font-weight:700;color:var(--danger-ink);background:rgba(240,115,106,.15);border-radius:20px;padding:2px 9px;display:inline-flex;align-items:center;gap:4px">${ico("undo")}تعديل على ${esc(prevOrderNoText_(o))}</span>`:''}${statusPill(o.status)}</div>
      <div class="os">${esc(o.dist||'')} · ${esc(o.region||'')} · ${esc(o.phone||'')}
        ${o.customer?`<br><b style="color:var(--info-ink)">صاحب الأوردر: ${esc(o.customer)}</b>`:''}
        <br>${viewingArchive ? 'أُرشف '+esc(dateStr2_(o.updated||o.date))+(o.date&&o.updated&&o.date!==o.updated?' · الطلب '+esc(dateStr2_(o.date)):'') : esc(dateStr2_(o.date))} · ${esc(o.qty||0)} قطعة${o.rods?' · '+esc(o.rods)+' عود':''} · ${money(o.total||0)} ج</div>
      ${o.ordNote?`<div class="ordnote">${ico("warn")}<span><b>ملاحظات:</b> ${esc(o.ordNote)}</span></div>`:''}
      ${o.superseded?`<div style="margin-top:8px;padding:9px 12px;background:rgba(240,115,106,.13);border:1.5px solid rgba(240,115,106,.42);border-radius:9px;
        font-size:13px;font-weight:700;color:var(--danger-ink);display:flex;align-items:flex-start;gap:6px;line-height:1.6">
        ${ico("warn")}<span>الطلب ده <b>اتعدّل وعنده نسخة جديدة</b> — كان دخل التنفيذ فمقدرناش نلغيه تلقائي.
        راجع النسخة الجديدة واحذف السطر ده بنفسك من زرار «حذف» تحت.</span></div>`:''}
      <div class="chips chips-line" style="margin-top:10px;gap:6px">${btns}</div>
      ${busy?'<div class="note">جارٍ الحفظ…</div>':''}
      ${viewingArchive?`<button class="btn brand" data-act="adm-unarchive" data-id="${esc(o.id)}" ${archBusy?'disabled':''} style="width:100%;margin-top:10px;padding:10px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px">${ico("refresh")}${archBusy?'جارٍ الإرجاع…':'رجّع من الأرشيف للطلبات النشطة'}</button>`:''}
      <div class="cardacts">${actionBtns}</div>
      ${itemsHtml}
    </div>`;
  };

  // ---------- تجميع طلبات كل عميل في قايمة منسدلة ----------
  const groups = {};
  const order = [];
  list.forEach(o=>{
    const key = String(o.customer||'').trim() || 'بدون اسم';
    if(!groups[key]){ groups[key]=[]; order.push(key); }
    groups[key].push(o);
  });

  // كل كارت عميل بيتبني لوحده وبيتخزّن بمفتاحه — عشان الرسمة الجاية تقدر
  // تحدّث الكارت اللي اتغيّر بس بدل ما تستبدل الشاشة كلها.
  const بالكارت = [];
  const rows = order.map(name=>{
    const orders = groups[name];
    const open = !!a.groupOpen[name];
    const totalQty = orders.reduce((s,o)=>s+(Number(o.qty)||0),0);
    const totalMoney = orders.reduce((s,o)=>s+(Number(o.total)||0),0);
    const pdfBusy = a.groupPdfBusy === name;
    const prevBusy = a.groupPreviewBusy === name;
    const _ini = (String(name).trim().replace(/^[^\u0600-\u06FFA-Za-z0-9]+/,'')[0]||'؟');
    const _hue = [...String(name)].reduce((h,c)=>(h*31+c.charCodeAt(0))%360,0);
    const _rd = orders.filter(o=>o.status==='Ready').length, _ip = orders.filter(o=>o.status==='In Progress').length;
    const كارت = `<div class="ord" data-grp="${esc(name)}" style="padding:0;overflow:hidden">
      <div class="grp-hd" data-act="adm-toggle-group" data-name="${esc(name)}" data-ini="${esc(_ini)}" style="--av:hsl(${_hue} 55% 42%)">
        <span style="flex:1;min-width:0">
          <b style="font-size:13.5px;color:#FFFFFF">${esc(name)}</b>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">${orders.length} طلب · ${totalQty} قطعة · ${money(totalMoney)} ج${grpDueBadges_(orders)}</div>
        </span>
        <span class="grp-chev" style="transform:rotate(${open?90:0}deg)">‹</span>
      </div>
      <div class="grp-bar"><i class="g" style="width:${Math.round(_rd/orders.length*100)}%"></i><i class="a" style="width:${Math.round(_ip/orders.length*100)}%"></i></div>
      <!-- سطر لكل طلب: رقمه وتاريخه ويومه، ومعاه معاينة وطباعة للطلب ده لوحده.
           الأزرار كانت قبل كده على مستوى العميل بس — يعني معاينة كل الطلبات مع
           بعض — والسطور كانت متداخلة مع الأزرار في نفس الصف فالشكل بيتلخبط. -->
      <div class="grp-list">${orders.map(o=>groupOrderRowHTML_(o, a)).join('')}</div>
      ${orders.length>1?`<div class="grp-all">
        <span>كل طلبات العميل مع بعض:</span>
        <button class="btn act-tool sm grp-b" data-act="adm-group-preview" data-name="${esc(name)}" ${prevBusy?'disabled':''}
          title="معاينة كل طلبات ${esc(name)}">${ico("search")}${prevBusy?'…':'معاينة'}</button>
        <button class="btn act-report sm grp-b" data-act="adm-group-pdf" data-name="${esc(name)}" ${pdfBusy?'disabled':''}
          title="PDF كل طلبات ${esc(name)}">${ico("doc")}${pdfBusy?'…':'PDF'}</button>
      </div>`:''}
      ${open?`<div style="padding:0 10px 10px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)">
        <div style="height:1px"></div>${orders.map(orderCardHTML_).join('')}
      </div>`:''}
    </div>`;
    بالكارت.push({ مفتاح: name, html: كارت });
    return كارت;
  }).join('');
  _adminCards = بالكارت;

  const _toolsOpen = uiOpen_('adm-tools', false);
  const _toolsInner = headerBtns.startsWith(staleBar) ? headerBtns.slice(staleBar.length) : headerBtns;
  const _cn = {new:0,prog:0,ready:0,done:0};
  list.forEach(o=>{ const g=ordGroup_(o.status); if(g in _cn) _cn[g]++; });
  const _k = (n,t,c)=>`<div class="ad-k" style="--kc:${c}"><b>${n}</b><span>${t}</span></div>`;
  _adminShell = `<section class="ad-hero"><div class="g1"></div><div class="g2"></div>
      <div class="ad-top"><span class="ad-ico">${viewingArchive?ico("folder","lg"):ico("factory","lg")}</span>
        <div><small>${viewingArchive?'الطلبات المؤرشفة':'لوحة متابعة المصنع'}</small><b>${list.length} طلب</b></div></div>
      <div class="ad-kpis">${_k(_cn.new,'جديدة','#3FA9F5')}${_k(_cn.prog,'تحت التنفيذ','#D9A441')}${_k(_cn.ready,'جاهزة','#4FC08A')}${_k(_cn.done,'اتسلّمت','#9A8CF0')}</div>
    </section>
    ${viewingArchive?'':dueStripHTML_(list)}
    <section class="card ad-card">
      <div class="step"><span class="n">${ico("search","lg")}</span><h2>دوّر على عميل</h2></div>
      <input type="search" id="admQ" class="ad-q" placeholder="اكتب اسم العميل…" value="${esc(_admQ)}" autocomplete="off">
      <div class="note" style="margin-top:8px">${viewingArchive?'الطلبات المؤرشفة (اتسلمت أو اتأرشفت يدوي) — مش بتظهر في التقارير.':'اضغط اسم العميل عشان تشوف طلباته، وجوّه كل طلب غيّر الحالة وتابع الأصناف والإنتاج.'}</div>
      <div class="ad-legend"><span><i class="g"></i>جاهز</span><span><i class="a"></i>تحت التنفيذ</span><span><i class="r"></i>لسه ما بدأش</span></div>
    </section>
    ${staleBar}
    <section class="card ad-card ad-dd${_toolsOpen?' open':''}">
      <button class="adH" data-act="ui-toggle" data-k="adm-tools" aria-expanded="${_toolsOpen}">
        <span class="n">${ico("parts","lg")}</span>
        <span class="tt"><b>أدوات وتقارير</b><small>${_toolsOpen?'اضغط للإخفاء':'عرض · تقارير · تحديث · خروج'}</small></span>
        ${ico("chev")}
      </button>
      ${_toolsOpen?`<div class="adB">${_toolsInner}${srvBuildNote_()}</div>`:''}
    </section>
    <div class="hm-h"><span>${viewingArchive?'عملاء الأرشيف':'العملاء وطلباتهم'}</span></div>
    ${ADMIN_CARDS_MARK}${verBar()}`;
  return _adminShell.replace(ADMIN_CARDS_MARK, rows);
}


/* ============================================================
   الأحداث
   ============================================================ */
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('button[data-tab]'); if(!b) return;
  // سايب شاشة «طلب جديد» وفيه صنف مسحوب للتعديل ما اتكملش؟ رجّعه للسلة بدل ما يضيع
  if(b.dataset.tab!=='new') restorePulledLine_();
  state.tab=b.dataset.tab; render(); window.scrollTo({top:0,behavior:'smooth'});
  if(state.tab==='orders'||state.tab==='home') maybeLoadTrack_();
  if(state.tab==='new') loadStock();
  if(state.tab==='admin') maybeShowDueOverlay_();
});

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, p=state.pick;
  switch(a){
    case 'home-go': state.tab = el.dataset.to; render(); window.scrollTo({top:0,behavior:'smooth'});
      if(state.tab==='orders') maybeLoadTrack_();
      if(state.tab==='new') loadStock();
      break;
    case 'home-sec': state.tab='new'; state.newSection = el.dataset.to; save(LS_SECTION, state.newSection); render(); window.scrollTo({top:0,behavior:'smooth'}); loadStock(); break;
    case 'home-repeat': repeatLastOrder_(); break;
    case 'home-bank': showBankOverlay_(); break;
    case 'home-call': if(FACTORY_PHONE) location.href = 'tel:'+FACTORY_PHONE; break;
    case 'go-cart': state.tab='cart'; render(); window.scrollTo({top:0}); break;
    case 'pick-door': selectDoor(el.dataset.code); loadStock(); break;

// لو رد "تابع طلبك" (list بالـphone) بيرجّع أصناف الطلب مع حقل produced، بنحطه على نسخة الطلب المحلية
// عشان مستند/صورة العميل يوري جاهز/متبقي محدّث. لو السيرفر لسه مابيرجعش الحقل ده، محصلش تغيير (0 آمن افتراضيًا).
// ⚠️ باج كان هنا: الدمج كان بالترتيب — الصنف رقم ١ عندي = الصنف رقم ١ عند
// السيرفر. لكن المصنع بيحذف أصناف ويعدّل كميات من شاشته، وسطور السيرفر
// بتزحلق ونسخة الموزّع زي ما هي. فأرقام «الجاهز» كانت بتتحط على أصناف تانية
// خالص — الموزّع يقرا إن باب جاهز وهو لسه ما اتعملش. دلوقتي المطابقة بالهوية
// (النوع + الكود + المقاس + الارتفاع)، والصنف اللي مالوش سطر عند السيرفر
// مابياخدش رقم حد تاني.
function producedKey_(type, code, size, doorHeight){
  return [type||'', String(code||'').trim(), String(size||'').trim(),
          String(doorHeight||'').trim()].join('|');
}
function cartItemKey_(it){
  const type = it.kind==='door' ? 'Door'
             : it.kind==='frame' ? 'Frame'
             : it.kind==='bror'  ? 'Bror'
             : it.kind==='panel' ? 'Panel'
             : it.kind==='mabra' ? 'Mabra'
             : METER_KINDS_[it.kind] ? METER_KINDS_[it.kind].type : 'Accessory';
  const size = it.kind==='door' ? (it.sizeEn||it.sizeTxt||'') : (it.spec||'');
  return producedKey_(type, it.code, size, it.doorHeight);
}
function mergeProducedFromTrack_(o){
  const live = (state.track.rows||[]).find(r=>String(r.id)===String(o.id));
  if(live && Array.isArray(live.items)){
    // أصناف متطابقة تمامًا (نفس الباب مرتين) بتتاخد بالترتيب — كل واحد بياخد
    // سطر لسه محدّش خده.
    const مأخوذ = new Set();
    (o.items||[]).forEach(it=>{
      const key = cartItemKey_(it);
      const idx = live.items.findIndex((li,i)=>!مأخوذ.has(i) &&
        producedKey_(li.type, li.code, li.size, li.doorHeight) === key);
      if(idx<0) return;                 // مالوش سطر عند السيرفر — مانخمّنش
      مأخوذ.add(idx);
      const li = live.items[idx];
      if(li.produced!==undefined) it.produced = li.produced;
    });
  }
  return o;
}

// إنتر في خانة كلمة سر متابعة المصنع يعمل دخول على طول
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeReportPreview_(); return; }
  if(e.key!=='Enter') return;
  const el = e.target.closest('[data-act="adm-pw"]');
  if(!el) return;
  e.preventDefault();
  const b = document.querySelector('[data-act="adm-login"]');
