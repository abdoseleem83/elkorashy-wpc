   كلهم يفضلوا شايفين السعر القديم المكتوب جوّه التطبيق لحد ما تترفع نسخة جديدة.
   دلوقتي الشيت هو المصدر الواحد. بنقرا منه عند فتح التطبيق، وبنفضل شغّالين
   بآخر نسخة محفوظة على الجهاز لو النت مش موجود. */
let _pricesSyncedAt = '';
async function syncPricesFromServer_(){
  if(!APPS_SCRIPT_URL) return;
  // ⚠️ لو المصنع عدّل الأسعار وهو مش متصل، التعديل لسه على جهازه بس. لو قرينا
  // من السيرفر دلوقتي هنمسح تعديله بالأسعار القديمة. فبنحاول نرفع الأول،
  // ومانقراش خالص طالما لسه فيه تعديل ما اترفعش.
  if(load(LS_PRICES_DIRTY, false)){
    const pushed = await pushPricesToServer_(loadPriceOverrides_(), true);
    if(!pushed) return;
  }
  try{
    const d = await jsonp(APPS_SCRIPT_URL + '?action=prices');
    if(!d || !d.ok || !d.prices) return;
    const incoming = JSON.stringify(d.prices);
    if(incoming === JSON.stringify(loadPriceOverrides_())) return;   // نفس اللي عندنا
    save(LS_PRICES, d.prices);
    applyPriceOverrides();
    _pricesSyncedAt = d.at || '';
    render();
  }catch(err){ /* مفيش نت — بنكمّل بآخر أسعار محفوظة على الجهاز */ }
}

(function renameDoorCodeLocally_(){

    });
    localStorage.setItem('wpc_code_migrated', '1');
  }catch(e){}
})();

/* ---------- قراية التخزين ----------
   ⚠️ دي كانت بترجّع القيمة الافتراضية في صمت لو الـJSON اتخرب. والمشكلة إن أول
   حفظ بعدها بيكتب القايمة الفاضية فوق البيانات المخربة — فالضياع يبقى نهائي
   ومفيش أي أثر ليه.
   والـJSON بيتخرب فعلًا: الـService Worker بيعمل reload إجباري لكل الصفحات
   المفتوحة مع كل نسخة جديدة، ولو ده حصل وسط كتابة قايمة الطلبات، النص بيتقطع.
   دلوقتي: بنحتفظ بالأصل المخرب في مفتاح جانبي، وبنحاول نرجّع منه أكبر عدد
   ممكن من الطلبات السليمة، وبنقول للمستخدم اللي حصل. */
function load(k,d){
  let raw = null;
  try{ raw = localStorage.getItem(k); }catch(e){ return d; }
  if(raw == null || raw === '') return d;
  try{ return JSON.parse(raw); }catch(e){}
  // الـJSON مقطوع أو مخرب — نحفظ الأصل الأول قبل أي حاجة تكتب فوقه
  try{ localStorage.setItem(k + '_corrupt', raw); }catch(e2){}
  const مسترجع = recoverArray_(raw);
  _storeProblems_.push({ key:k, recovered: مسترجع ? مسترجع.length : 0 });
  return مسترجع && مسترجع.length ? مسترجع : d;
}

// بيحاول ينقذ أكبر عدد عناصر من مصفوفة JSON اتقطعت في النص.
// بيرجع للخلف لآخر عنصر مكتمل ويقفل المصفوفة، وبيجرّب لحد ما يعرف يقراها.
function recoverArray_(raw){
  const t = String(raw||'').trim();
  if(t[0] !== '[') return null;
  for(let i = t.lastIndexOf('}'); i > 0; i = t.lastIndexOf('}', i - 1)){
    try{
      const v = JSON.parse(t.slice(0, i + 1) + ']');
      if(Array.isArray(v) && v.length) return v;
    }catch(e){}
  }
  return null;
}
// ⚠️ دي كانت بتبتلع أي خطأ في صمت. لما مساحة التخزين تمتلي (أو المتصفح يمنع
// التخزين — بيحصل في وضع التصفح الخاص وعلى iOS لما المساحة تقل)، الطلب كان
// بيتحط في الذاكرة والمستخدم يشوف «✅ اتسجّل الطلب»، وأول ما يقفل التطبيق يلاقيه
// اختفى من «تابع طلبك» من غير ما حد يقوله ليه.
// دلوقتي بترجّع true/false، وبتحاول تفضّي مساحة قبل ما تستسلم.
function save(k,v){
  try{ localStorage.setItem(k,JSON.stringify(v)); return true; }
  catch(e){
    // المساحة اتملت؟ نجرّب نقصّ الطلبات القديمة ونعيد المحاولة — أحسن من إننا
    // نضيّع الطلب الجديد عشان طلبات من شهور.
    try{
      if(k===LS_ORDERS && Array.isArray(v) && v.length>12){
        const trimmed = v.slice(0, Math.max(12, Math.floor(v.length/2)));
        localStorage.setItem(k, JSON.stringify(trimmed));
        if(Array.isArray(state.orders)) state.orders = trimmed;
        // ⚠️ دي كانت بترجّع true في صمت — يعني المستخدم يشوف «اتحفظ» والطلبات
        // القديمة اتمسحت من غير ما حد يقوله. القص ضرورة عشان منضيّعش الطلب
        // الجديد، بس لازم يعرف إن ده حصل.
        try{ toast('⚠️ مساحة جهازك امتلت — اتشال '+(v.length-trimmed.length)
          +' طلب قديم من القايمة عشان الجديد يتحفظ. الطلبات دي لسه عند المصنع.', 8000); }catch(eT){}
        return true;
      }
      // مش قايمة الطلبات؟ نفضّي كاش شاشة المصنع (أقل حاجة أهمية) ونعيد
      localStorage.removeItem('wpc_adm_rows');
      localStorage.setItem(k, JSON.stringify(v));
      return true;
    }catch(e2){ return false; }
  }
}

// ⚠️ الشرط ده كان متكتب تلات مرات بتعريفين مختلفين: زرار «أضف» والمعاينة
// كانوا بيشوفوا العرض والارتفاع بس، والإضافة الفعلية بتشوف الكمية كمان. فلو
// الموزّع مسح خانة الكمية عشان يكتب رقم تاني وضغط «أضف»، الزرار شغّال
// والمعاينة بتوريه سعر — والباب الخاص بيتشال في صمت والباقي بيتضاف عادي.
// طقم الحلق الكامل = قائمين + عارضة علوية = ٣ عيدان. الأرقام دي كانت مكتوبة
// بالنص في أكتر من مكان (السعر، والتفكيك لقوائم وعوارض) — والمصنع بيقطّع على
// أساسها، فخلّيناها ثابت واحد.
const JAMBS_PER_SET = 2, HEADERS_PER_SET = 1;
const RODS_PER_SET = JAMBS_PER_SET + HEADERS_PER_SET;

function customReady_(p){
  return !!(p.customOn && Number(p.custom.w) > 0 && Number(p.custom.h) > 0 && Number(p.custom.qty) > 0);
}
function priceForWidth(w, hafr){const n=Number(w)||0;let p=SIZES[SIZES.length-1].price;for(const s of SIZES) if(n<=s.w){p=s.price;break;}return p+(hafr?HAFR_EXTRA:0);}
function rodPrice(perMetre, cm){return Math.round(perMetre*((Number(cm)||220)/100)*100)/100;}
/* ---------- وحدة الطول في شاشة «حلق فقط» و«برور فقط» ----------
   فيه موزّعين بيفكّروا بالسنتي (٢٢٠ سم) وفيه بالمتر (٢.٢ م). بدل ما كل شاشة
   تفرض وحدة واحدة والموزّع يحسب في دماغه (وده مصدر غلطات في الأطوال)، فيه
   زرار وحدة جنب الخانات. التطبيق بيحسب وبيسجّل بالسنتي دايمًا — الوحدة
   اختيار كتابة وعرض بس، مابتأثرش على الطلب المتسجّل ولا على السعر. */
const LEN_UNITS_ = { cm:{lbl:'سم', f:1, ar:'سنتيمتر'}, m:{lbl:'م', f:100, ar:'متر'} };
function lenUnit_(u){ return LEN_UNITS_[u] || LEN_UNITS_.cm; }
function lenUnitLbl_(u){ return lenUnit_(u).lbl; }
// من اللي المستخدم كتبه (بالوحدة المختارة) لسنتيمتر.
// ⚠️ التقريب لجزء من مية من السنتي مقصود: من غيره ٢.٢٦٥ م بتطلع
// 226.49999999999997 وبتتسجّل كده في الشيت وفي الطلب المبعوت.
function lenToCm_(v, u){
  const n = Number(decIn_(String(v==null?'':v))) || 0;
  return Math.round(n * lenUnit_(u).f * 100) / 100;
}
// والعكس — لما الموزّع يبدّل الوحدة، اللي مكتوب يتحوّل بدل ما معناه يتغيّر
// (٢٢٠ سم تبقى ٢.٢ م، مش ٢٢٠ م).
function lenFromCm_(cm, u){
  const v = (Number(cm)||0) / lenUnit_(u).f;
  if(!v) return '';
  return String(Math.round(v * 10000) / 10000);
}
// ⚠️ عدد الأعواد كان بيتقرّب لصحيح (Math.round) في كل مكان — فنص عود أو ربع
// عود (تكملة) مكانش ينفع يتطلب أصلاً، والزرار كان بيقول «أضف ٣» والمستخدم
// كاتب ٢.٥. بقى بيقبل الكسور زي الأطوال.
function rodQty_(v){
  const n = Number(decIn_(String(v==null?'':v))) || 0;
  return n > 0 ? Math.round(n*100)/100 : 0;
}
// طول عود البرور بالسنتي من اللي مكتوب في الشاشة (بالوحدة المختارة).
// كان بيتقرّب لسنتي صحيح — فعود ٢.٢٦٥ م يتسجّل ٢٢٧ سم، نص سنتي يضيع من كل
// عود والسعر (سعر المتر × الطول) يطلع غلط على الطلب كله.
function brRodCm_(v, unit){
  return Math.max(0.1, lenToCm_(v, unit===undefined ? 'm' : unit));
}
// طول من شاشة «حلق فقط» بالسنتي — المكان الوحيد اللي بيقرا وحدة الشاشة
function frCm_(v){ return lenToCm_(v, (state.fr||{}).unit); }
// شرايح اختيار الوحدة (سنتيمتر / متر)
function unitChips_(cur, act){
  return ['cm','m'].map(u=>
    `<button class="miniChip ${cur===u?'on':''}" data-act="${act}" data-u="${u}">${LEN_UNITS_[u].ar}</button>`
  ).join('');
}
// ⚠️ الفلوس بتتخزّن وبتتبعت زي ما هي — مش بس بتتعرض. سعر العود المتوسط بقى
// بأربع خانات عشرية (عشان إجمالي السطر يطلع مظبوط بالقرش)، فحاصل الضرب كان
// بيطلع 7199.499999999999 ويتسجّل كده في الشيت وفي الطلب المبعوت.
// بنقرّب لأقرب قرش عند حساب السطر والإجمالي — الفلوس متقاس بالقرش مش أكتر.
const قرش_ = n => Math.round((Number(n)||0)*100)/100;
function linePrice(it){return قرش_((it.kind==='door'?it.unitPrice:it.price)*it.qty);}
function cartTotal(){return قرش_(state.cart.reduce((s,it)=>s+linePrice(it),0));}
function cartCount(){return state.cart.length;}
// ⚠️ الكيبورد العربي على الموبايل بيكتب أرقام هندية (٠١٢٣٤٥٦٧٨٩) مش لاتينية.
// الموزع بيكتب رقمه ٠١٠١٢٣٤٥٦٧٨ — رقم صح تمامًا — والتطبيق كان بيقوله «رقم غلط»
// من غير ما يقوله ليه، ويمنعه من إرسال الطلب.
// وأخطر من كده: لو الرقم اتسجّل بالعربي، السيرفر بيشيل «كل اللي مش رقم» فبيمسح
// الرقم كله ويفضل فاضي — يعني الموزع ده مش هيلاقي طلباته أبدًا في «تابع طلبك»،
// ولا يقدر يلغي طلب.
// بنحوّل الأرقام الهندية (العربية والفارسية) للاتينية في أي مكان بنقرا فيه رقم.
function toLatinDigits_(v){
  return String(v == null ? '' : v)
    .replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 0x0660))   // ٠-٩ عربي
    .replace(/[\u06F0-\u06F9]/g, d => String(d.charCodeAt(0) - 0x06F0));  // ۰-۹ فارسي
}

function phoneOk(p){return /^0?1[0-9]{9}$/.test(toLatinDigits_(p).replace(/\s/g,''));}

// بيسمح بالأرقام (حتى لو مكتوبة بالأرقام العربية) ونقطة عشرية واحدة بس —
// عشان حقول الأطوال/الارتفاعات (زي 110.5) تتكتب طبيعي من غير ما تتمسح.
// مستخدمة بدل type="number" اللي كان بيصفّر الخانة أول ما تكتب النقطة.
function decIn_(v){
  let s = toLatinDigits_(v);
  // ٫ (u066B) هي العلامة العشرية العربية، و٬ (u066C) فاصلة الآلاف — مش نفس الحاجة.
  // والفاصلة العادية بتبقى عشرية لو مفيش نقطة في النص (1,5)، وفاصلة آلاف لو
  // فيه نقطة كمان (1,234.5) — الحالة التانية كانت بتطلّع 1.2345 بدل 1234.5.
  s = s.replace(/\u066B/g, '.').replace(/[\u066C\u2009\s]/g, '');
  s = /\./.test(s) ? s.replace(/[,،]/g, '') : s.replace(/[,،]/g, '.');
  s = s.replace(/[^0-9.]/g,'');
  const i = s.indexOf('.');
  if(i!==-1) s = s.slice(0,i+1) + s.slice(i+1).replace(/\./g,'');
  return s;
}

// بيرجّع الرصيد المتاح لكود + مقاس (المقاس بالسم كرقم، أو '' لأي مقاس)
// المطلوب/المحجوز لعملاء: بيجمع كل الطلبات المعلّقة (اللي لسه ما اتسلّمتش) وبيحسب المتبقي
// (الكمية - الجاهز) لكل كود+مقاس — عشان المصنع يعرف الرصيد فعلًا فاضي قد إيه بعد خصم المحجوز
async function loadReserved(force){
  const a = state.admin;
  if(a.reservedLoading) return;
  if(!force && a.reserved && Date.now()-a.reservedAt < 60000) return;   // كاش دقيقة
  a.reservedLoading = true; render();
  try{
    const orders = await fetchPendingOrders_();
    const map = {};
    (orders||[]).forEach(o=>{
      // «المحجوز لعملاء» = اللي لسه مطلوب فعلاً. الملغي مش مطلوب، والمُسلَّم
      // خلاص خرج. (المسلَّم بيتأرشف أوتوماتيك فمابيجيش أصلاً — إلا لو حد غيّر
      // الحالة بإيده على الشيت، وساعتها كان بيتحسب محجوز وهو مسلَّم.)
      if(o.status==='Cancelled' || o.status==='Delivered') return;
      (o.items||[]).forEach(it=>{
        if(it.type!=='Door') return;
        const qty = Number(it.qty)||0;
        const produced = Number(it.produced)||0;
        const remain = Math.max(0, qty-produced);
        if(remain<=0) return;
        const key = String(it.code||'').trim()+'|'+String(doorWidthGroup_(it.size) ?? it.size ?? '').trim();
        map[key] = (map[key]||0) + remain;
      });
    });
    a.reserved = map; a.reservedAt = Date.now();
  }catch(err){ /* المحجوز إضافة مساعدة — لو فشل مايوقفش الشاشة */ }
  a.reservedLoading = false; render();
}
function reservedFor(code, sizeW){
  const map = state.admin.reserved;
  if(!map) return null;
  return map[String(code).trim()+'|'+String(sizeW).trim()] || 0;

function stockFor(code, sizeW){
  const rows = state.stock.rows;
  if(!rows || !code) return null;
  const want = String(sizeW==null?'':sizeW).trim();
  const wantCode = doorCode_(code);
  const hit = rows.find(r=>doorCode_(r.code)===wantCode
                        && String(r.size).trim()===want);
  return hit ? (Number(hit.qty)||0) : 0;
}
// إجمالي رصيد الكود على كل المقاسات — للشارة على كارت الباب
function stockTotalFor(code){
  const rows = state.stock.rows;
  if(!rows || !code) return null;
  return rows.filter(r=>String(r.code).trim()===String(code).trim())
             .reduce((n,r)=>n+(Number(r.qty)||0),0);
}

async function loadStock(force){
  if(!APPS_SCRIPT_URL) return;
  if(state.stock.loading) return;
  if(!force && state.stock.rows && Date.now()-state.stock.at < 120000) return;  // كاش دقيقتين
  state.stock.loading = true;

    if(d && d.ok){ state.stock.rows = d.stock || []; state.stock.at = Date.now(); }
  }catch(err){ /* الرصيد إضافة مساعدة — لو فشل مايوقفش الطلب */ }
  state.stock.loading = false;
  render();
}

// بيحفظ كل التعديلات المعلّقة على الأرصدة واحدة واحدة
async function saveStockDrafts(){
  const a = state.admin;
  const keys = Object.keys(a.stockDraft).filter(k=>{
    const [c,w] = k.split('|');
    return Number(a.stockDraft[k]) !== Number(stockFor(c, Number(w))||0);
  });
  if(!keys.length){ toast('مفيش تعديلات'); return; }
  busy(true,'جارٍ حفظ الأرصدة…');
  let done=0;
  const kept = {}, failedNames = [];
  for(const k of keys){
    const [code, w] = k.split('|');
    a.stockBusy = k;
    let ok = false;
    try{
      const d = await jsonp(APPS_SCRIPT_URL
        + '?action=setStock' + admParams_()
        + '&code=' + encodeURIComponent(code)
        + '&size=' + encodeURIComponent(w)
        + '&qty='  + encodeURIComponent(Math.max(0, Math.round(Number(a.stockDraft[k])||0))));
      ok = !!(d && d.ok);
    }catch(err){ ok = false; }
    if(ok) done++;
    else {
      // ⚠️ قبل كده كنا بنمسح المسوّدات كلها في الآخر، فالرقم اللي المصنع كتبه
      // وفشل حفظه كان بيختفي من الشاشة من غير ما حد يعرف أنهي صنف. بنسيبه
      // مكتوب عشان يشوفه ويحاول تاني.
      kept[k] = a.stockDraft[k];
      failedNames.push(code + ' / ' + w + ' سم');
    }
  }
  a.stockBusy = null;
  a.stockDraft = kept;
  await loadStock(true);          // نرجّع الأرصدة من السيرفر عشان الشاشة تطابقه
  busy(false);
  toast(failedNames.length
    ? ('اتحفظ '+done+' — فشل: '+failedNames.join('، ')+' (الأرقام لسه مكتوبة، جرّب تاني)')
    : ('اتحفظت '+done+' أرصدة'), failedNames.length ? 5200 : undefined);
}

// التاريخ المحلي بصيغة yyyy-mm-dd. مش toISOString() لأنها بتدّي التوقيت العالمي،
// ومصر UTC+2/+3 — فأي شغل بعد نص الليل كان بيتسجّل بتاريخ اليوم اللي فات.
function isoLocal_(ts){
  const d = (ts===undefined||ts===null) ? new Date() : new Date(ts);
  if(isNaN(d.getTime())) return '';
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function dateStr(ts){return new Date(ts).toLocaleDateString('ar-EG',{day:'2-digit',month:'2-digit',year:'numeric'});}
// نفس الفكرة بس بأرقام إنجليزية وشكل يوم/شهر/سنة ثابت — مستخدمة في صيغة "طلب أوردر رقم (...) بتاريخ ..." في المستند المطبوع
function dateStrDMY_(ts){
  const d=new Date(ts), p=n=>String(n).padStart(2,'0');
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear();
}

/* ------------------------------------------------------------
   الرسم — نسخة سريعة
   ------------------------------------------------------------
   المشاكل اللي كانت موجودة واتصلّحت هنا:
   ١) كل ضغطة زرار (+/-، اختيار مقاس، شيك بوكس) كانت بتعيد بناء الشاشة كلها فورًا،
      ولو الكود نده render() أكتر من مرة في نفس اللحظة كانت بتتنفّذ كلها — شغل مكرر ملهوش لازمة.
      دلوقتي النداءات بتتجمّع وتتنفّذ مرة واحدة في أقرب إطار رسم (requestAnimationFrame).
   ٢) الكتابة في خانات الحلق/البرور كانت بتنده render() فالخانة بتتمسح من الصفحة،
      فالفوكس والكيبورد بيقفلوا بعد كل حرف. دلوقتي بنحفظ الخانة اللي فيها الفوكس
      ومكان المؤشر جواها وبنرجّعهم بعد الرسم.
   ٣) مكان التمرير (scroll) كان بيتهزّ لما يتغيّر طول الصفحة. بنثبّته دلوقتي.
   ------------------------------------------------------------ */

// بصمة تعرّف الخانة اللي فيها الفوكس عشان نلاقيها تاني بعد إعادة الرسم
function focusKey_(el){
  if(!el || !el.dataset || !el.dataset.act) return null;
  const d = el.dataset;
  const q = v => String(v).replace(/\\/g,'\\\\').replace(/"/g,'\\"');
  return ['act','k','w','i','id','idx','code','group','key','tier']
    .filter(n => d[n] != null)
    .map(n => '[data-'+n+'="'+q(d[n])+'"]')
    .join('');
}

function captureFocus_(){
  const el = document.activeElement;
  if(!el || !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return null;
  const sel = focusKey_(el);
  if(!sel) return null;
  let start=null, end=null;
  try{ start=el.selectionStart; end=el.selectionEnd; }catch(e){}
  return { sel, start, end };
}

function restoreFocus_(snap){
  if(!snap) return;
  const el = document.querySelector(snap.sel);
  if(!el || el===document.activeElement) return;
  try{
    el.focus({preventScroll:true});
    if(snap.start!=null && el.setSelectionRange) el.setSelectionRange(snap.start, snap.end);
  }catch(e){}
}

let _renderQueued = false;
// أي scrollTo بيطلبه الكود نفسه (رجوع لأول الصفحة بعد تغيير القسم…) لازم الرسم
// ما يلغيهوش برجوع المكان القديم — فبنفتكر آخر طلب تمرير متعمّد.
let _progScrollAt = 0;
const _origScrollTo = window.scrollTo.bind(window);
window.scrollTo = function(){ _progScrollAt = Date.now(); return _origScrollTo.apply(null, arguments); };
let _lastRenderedTab = null;
let _lastRenderedHTML = null;   // آخر HTML اترسم لشاشة المصنع — للمقارنة قبل أي استبدال
// شاشة المصنع بتتبني على هيئة «شِل» (العنوان والأزرار) + كارت لكل عميل.
// بنحتفظ بآخر نسخة عشان الرسمة الجاية تستبدل الكارت اللي اتغيّر بس.
const ADMIN_CARDS_MARK = '<!--كروت-العملاء-->';
let _adminShell = null, _adminCards = null;
let _lastAdminShell = null, _lastAdminCards = null;

// بتحاول تحدّث الكروت اللي اتغيّرت بس. بترجّع true لو نجحت،
// و false لو الشكل اتغيّر (عميل زاد/نقص، أو ترتيبهم اتغيّر) ولازم رسمة كاملة.
function patchAdminCards_(){
  if(!_adminShell || !_adminCards || !_lastAdminShell || !_lastAdminCards) return false;
  if(_adminShell !== _lastAdminShell) return false;
  if(_adminCards.length !== _lastAdminCards.length) return false;
  for(let i = 0; i < _adminCards.length; i++){
    if(_adminCards[i].مفتاح !== _lastAdminCards[i].مفتاح) return false;
  }
  const اتغيّر = [];
  for(let i = 0; i < _adminCards.length; i++){
    if(_adminCards[i].html !== _lastAdminCards[i].html) اتغيّر.push(_adminCards[i]);
  }
  if(اتغيّر.length){
    // لو الكارت مش موجود في الصفحة (حاجة غير متوقعة) بنرجع للرسمة الكاملة
    const عناصر = اتغيّر.map(c => document.querySelector('[data-grp="' + cssEscape_(c.مفتاح) + '"]'));
    if(عناصر.some(el => !el)) return false;
    عناصر.forEach((el, i) => { el.outerHTML = اتغيّر[i].html; });
  }
  return true;
}

// اسم العميل بيتحط في محدّد CSS — لازم يتهرّب (فيه مسافات وأقواس وعلامات)
function cssEscape_(v){
  const s = String(v);
  if(window.CSS && CSS.escape) return CSS.escape(s);
  return s.replace(/["\\]/g, '\\$&');
}
// النداء العادي: بيتجمّع مع أي نداءات تانية في نفس اللحظة ويتنفّذ مرة واحدة
function render(){
  if(_renderQueued) return;
  _renderQueued = true;
  requestAnimationFrame(()=>{ _renderQueued = false; renderNow(); });
}

function renderNow(){
  _renderQueued = false;

  const nav=document.getElementById('tabs');
  const bar=document.getElementById('bar');
  nav.hidden=false;

  const allowed=allowedTabs();
  if(!allowed.includes(state.tab)) state.tab=allowed[0];
  save(LS_TAB, state.tab);
  document.querySelectorAll('#tabs button[data-tab]').forEach(b=>{
    b.hidden = !allowed.includes(b.dataset.tab);
  });

  const v=document.getElementById('view');
  const snap = captureFocus_();
  const sy = window.scrollY;

  // حركة الدخول للكروت بتتفعّل بس لما التبويب يتغيّر فعلاً
  const tabChanged = (_lastRenderedTab !== state.tab);
  _lastRenderedTab = state.tab;
  v.classList.toggle('enter', tabChanged);

  const html = state.tab==='home' ? viewHome()
             : state.tab==='new' ? viewNew()
             : state.tab==='cart' ? viewCart()
             : state.tab==='admin' ? viewAdmin()
             : viewOrders();

  // ⚠️ استبدال شاشة المصنع كلها تقيل: مع ٣٠٠ طلب الرسمة الواحدة بتاخد ١٠٠ مللي
  // على جهاز سريع (وأكتر بكتير على موبايل)، والشاشة بتترسم مع كل ضغطة ومع كل
  // فحص خلفي. الفحص الخلفي كل ٩٠ ثانية بيرسم نفس الشكل بالظبط في أغلب المرات.
  // فلو الناتج مطابق للي معروض، مانلمسش الصفحة خالص.
  // الشاشات التانية فيها حاجات بتتعدّل في الصفحة من غير render (زرار
  // الإكسسوارات، سطر الملخّص)، فالمقارنة دي لشاشة المصنع بس.
  const يقدر_يتخطى = state.tab === 'admin' && _lastRenderedHTML !== null && !tabChanged;
  if(يقدر_يتخطى && html === _lastRenderedHTML){
    updateAdmBadge();
    return;
  }

  // اتغيّر كارت عميل واحد بس؟ (فتح طلب، حفظ، تعديل كمية…) — نستبدل الكارت ده
  // لوحده. استبدال الشاشة كلها مع كل ضغطة كان بياخد وقت محسوس على الموبايل.
  let اتحدّث_جزئي = false;
  if(يقدر_يتخطى) اتحدّث_جزئي = patchAdminCards_();
  // ⚠️ باج «الشاشة بتنط» لما تختار باب أو حلق: استبدال innerHTML بيفضّي الصفحة لحظة،
  // فالمتصفح بيقصّر التمرير لفوق. وبعدها كنا بنرجّع المكان بس لو فيه خانة كتابة
  // متفوكسة (snap) — واختيار الباب/الحلق ضغطة زرار مش خانة. بنثبّت الارتفاع
  // أثناء الاستبدال ونرجّع المكان في كل رسمة جوّه نفس التبويب.
  if(!اتحدّث_جزئي){
    if(!tabChanged) v.style.minHeight = v.offsetHeight + 'px';
    v.innerHTML = html;
  }

  _lastRenderedHTML = state.tab === 'admin' ? html : null;
  _lastAdminShell = state.tab === 'admin' ? _adminShell : null;
  _lastAdminCards = state.tab === 'admin' ? _adminCards : null;

  restoreFocus_(snap);
  // لو الصفحة قصرت فجأة المتصفح بيقفز لفوق — بنرجّع المكان زي ما كان
  if(!tabChanged && window.scrollY !== sy && Date.now() - _progScrollAt > 600) _origScrollTo({top:sy, behavior:'instant'});
  if(v.style.minHeight) requestAnimationFrame(()=>{ v.style.minHeight=''; });

  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===state.tab));
  const cb=document.getElementById('cartBadge');
  const cn=cartCount();
  cb.textContent=cn;
  cb.classList.toggle('zero', cn===0);   // «0» أحمر على طول فوق السلة كان مشوّش
  updateAdmBadge();

  const show = state.tab==='new' && state.cart.length>0;
  bar.hidden=!show;
  if(show){
    document.getElementById('barTotal').textContent=(pricesVisible()?money(cartTotal())+' ج':'—');
    document.getElementById('barCount').textContent=cartCount()+' صنف في السلة';
  }
  document.body.style.paddingBottom = show ? '104px' : '30px';

  // الشاشات اللي فيها تصدير: بنسخّن المكتبات في الخلفية عشان أول ضغطة تبقى فورية
  if(state.tab==='admin' || state.tab==='orders' || state.tab==='cart') warmExportLibs_();
}

function viewNew(){
  const p=state.pick, bad=state.touched;
  const selWidths = Object.keys(p.sizes).map(Number).sort((a,b)=>a-b);

  const sizeToggleRow=SIZES.map(s=>{

  // شبكة صغيرة لاختيار الحلق/البرور جوه كارت كل مقاس — كل مقاس له حلقه وبروره الخاصين بيه
  // w بيبقى رقم المقاس العادي، أو النص 'custom' للمقاس الخاص — وبناءً عليه بنبعت الحدث للـhandler الصح
  const frameMiniChips=(sel,w)=>{
    const act = w==='custom' ? 'cust-frame' : 'size-frame';
    const wAttr = w==='custom' ? '' : ` data-w="${w}"`;
    return FRAMES.map(f=>`<button class="miniChip ${sel===f.cm?'on':''}" data-act="${act}"${wAttr} data-cm="${f.cm}">${f.cm} سم</button>`).join('')
      +`<button class="miniChip ${sel===0?'on':''}" data-act="${act}"${wAttr} data-cm="0">بدون</button>`;
  };
  // اختيار نوع الحلق: كامل (طقم كامل شامل مع الباب زي المعتاد) أو أعواد (عدد أعواد إضافي منفصل عن كمية الباب)
  const frameKindChips=(kind,w)=>{
    const act = w==='custom' ? 'cust-frame-kind' : 'size-frame-kind';
    const wAttr = w==='custom' ? '' : ` data-w="${w}"`;

    return `<button class="miniChip iconChip ${k==='full'?'on':''}" data-act="${act}"${wAttr} data-k="full">${ico('door')}</button>`
      +`<button class="miniChip iconChip ${k==='rods'?'on':''}" data-act="${act}"${wAttr} data-k="rods">${ico('ruler')}<span>أعواد</span></button>`;
  };
  const dbrorMiniChips=(sel,w)=>{
    const act = w==='custom' ? 'cust-dbror' : 'size-dbror';
    const wAttr = w==='custom' ? '' : ` data-w="${w}"`;
    return BRORS.map(b=>`<button class="miniChip ${sel===b.size?'on':''}" data-act="${act}"${wAttr} data-size="${esc(b.size)}">${esc(b.size)}</button>`).join('')
      +`<button class="miniChip ${sel===''?'on':''}" data-act="${act}"${wAttr} data-size="">بدون</button>`;
  };
  const hafrMiniChips=(sel,w)=>{
    const act = w==='custom' ? 'cust-hafr' : 'size-hafr';
    const wAttr = w==='custom' ? '' : ` data-w="${w}"`;
    return `<button class="miniChip ${!sel?'on':''}" data-act="${act}"${wAttr} data-v="0">عادي</button>`
      +`<button class="miniChip ${sel?'on':''}" data-act="${act}"${wAttr} data-v="1">حفر${pricesVisible()?` (+${HAFR_EXTRA}ج)`:''}</button>`;
  };

  // تدعيم الخشب: اختيار صريح على الباب، وبيتحوّل لبند مستقل بسعره تحت الصنف
  const woodMiniChips=(sel,w)=>{
    const act = w==='custom' ? 'cust-wood' : 'size-wood';
    const wAttr = w==='custom' ? '' : ` data-w="${w}"`;
    return `<button class="miniChip ${!sel?'on':''}" data-act="${act}"${wAttr} data-v="0">بدون</button>`
      +`<button class="miniChip ${sel?'on':''}" data-act="${act}"${wAttr} data-v="1">تدعيم خشب${pricesVisible()?` (+${WOOD_EXTRA}ج)`:''}</button>`;
  };

  // الطباعة: اختيار صريح على الباب زي التدعيم، وبيتحوّل لبند مستقل بسعره تحت الصنف
  const printMiniChips=(sel,w)=>{
    const act = w==='custom' ? 'cust-print' : 'size-print';
    const wAttr = w==='custom' ? '' : ` data-w="${w}"`;
    return `<button class="miniChip ${!sel?'on':''}" data-act="${act}"${wAttr} data-v="0">بدون</button>`

  };

  // خانة منسدلة صغيرة — بتتفتح بالضغط بس
  const dd = (key, title, summary, inner) => {
    const open = uiOpen_(key,false);
    return `<div class="dd ${open?'open':''}">
      <button class="ddH" data-act="ui-toggle" data-k="${key}"><span class="t">${title}</span><span class="sm">${summary?esc(summary):''}</span>${ico("chev")}</button>

  // الخطوات: الكمية ← الحلق ← (ارتفاع الحلق + البرور بعد ما الحلق يتحدد) ← خيارات إضافية منسدلة
  const stepsFor = (e, w) => {
    const isC = w==='custom';
    const A = (n)=> isC ? 'cust-'+n : 'size-'+n;

    const frameStep = `<div class="miniLbl">١) الحلق</div><div class="miniChips">${frameMiniChips(e.frame,w)}</div>`;

        <div class="miniLbl">٢) البرور</div><div class="miniChips">${dbrorMiniChips(e.dbror,w)}</div>`;
    return frameStep + afterFrame + extras;
  };

  const sizeCards = selWidths.map(w=>{
    const e=p.sizes[w];
    const st = stockFor(p.code, w);
    const stockLine = st===null ? '' : (st<=0
      ? `<div class="stockbar out">${ico("factory")}<span>بيتصنّع حسب الطلب — المصنع هيتواصل معاك بالميعاد.</span></div>`
      : `<div class="stockbar ${st>=e.qty?'ok':'part'}">${ico(st>=e.qty?"checkC":"warn")}
          <span>${st>=e.qty
            ? `متوفر بالمخزن (${st} باب) — <b>${READY_HOURS_TXT}</b>`
            : `المتوفر دلوقتي <b>${st}</b> بس من الكمية اللي طلبتها — الباقي بيتصنّع حسب الطلب.`}</span></div>`);
    return `<div class="sizeCard">
      <div class="scHead"><b>${w} سم</b>
        <div class="qty sm"><span class="qIc" aria-hidden="true">${ico('qty')}</span>
          <button data-act="size-qty-minus" data-w="${w}">−</button>
          <input type="number" inputmode="numeric" min="1" value="${e.qty}" placeholder="الكمية" class="qtyEmpty" data-act="size-qty-set" data-w="${w}">
          <button data-act="size-qty-plus" data-w="${w}">+</button>
        </div>
      </div>
      ${stockLine}
      ${stepsFor(e,w)}
    </div>`;
  }).join('');

  const customCard = p.customOn ? `<div class="sizeCard">
      <div class="scHead"><b>مقاس خاص</b></div>
      <div class="row2">
        <label class="fld"><span>العرض (سم)</span><input type="text" inputmode="decimal" value="${esc(p.custom.w)}" placeholder="مثال 85" data-act="cust" data-k="w"></label>
        <label class="fld"><span>الارتفاع (سم)</span><input type="text" inputmode="decimal" value="${esc(p.custom.h)}" placeholder="مثال 215" data-act="cust" data-k="h"></label>
      </div>
      <div class="grp" style="margin-top:6px">الكمية</div>
      <div class="qty"><span class="qIc" aria-hidden="true">${ico('qty')}</span>
        <button data-act="cust-qty-minus">−</button>
        <input type="number" inputmode="numeric" min="1" value="${p.custom.qty}" placeholder="الكمية" class="qtyEmpty" data-act="cust-qty-set">
        <button data-act="cust-qty-plus">+</button>
      </div>
      <div class="note">سعر الباب زي المقاس العادي، و<b>«${CUT_SERVICE_NOTE_}»</b> بتتحط بند مستقل تحته بالكمية والسعر (${CUSTOM_EXTRA} ج للباب).</div>
      ${customReady_(p) ? stepsFor(p.custom,'custom') : `<div class="stepHint">اكتب العرض والارتفاع عشان تظهر باقي الاختيارات</div>`}
    </div>` : '';

  const frKind=state.fr.kind==='rods'?'rods':'full';
  const frUnit=lenUnit_(state.fr.unit).lbl;
  const frQty=rodQty_(state.fr.qty);
  const frNonStd=!!state.fr.nonStd;
  const frJamb=frKind==='full' ? frQty*2 : Math.max(0,Number(state.fr.jamb)||0);
  const frHeader=frKind==='full' ? frQty*1 : Math.max(0,Number(state.fr.header)||0);
  const frJambCm=Math.max(1,frCm_(state.fr.jambCm)||220);

function currentSummary(){
  const p=state.pick;
  if(!p.code) return '';
  const d=doorByCode(p.code);
  const widths = Object.keys(p.sizes).map(Number).sort((a,b)=>a-b);
  const customReady = customReady_(p);

  if(!widths.length && !p.customOn) return 'اختر مقاس واحد على الأقل.';
  for(const w of widths){ if(!(Number(p.sizes[w].qty)>0)) return `اكتب الكمية لمقاس ${w} سم.`; }
  if(p.customOn && !customReady) return 'اكتب العرض والارتفاع والكمية للمقاس الخاص.';
  for(const w of widths){
    const e=p.sizes[w];
    if(e.frame==null) return `اختر الحلق (أو «بدون حلق») لمقاس ${w} سم.`;
    if(e.dbror==null) return `اختر البرور (أو «بدون برور») لمقاس ${w} سم.`;
  }
  if(customReady && (p.custom.frame==null || p.custom.dbror==null)) return 'اختر الحلق والبرور للمقاس الخاص.';

  const parts=[]; let totalQty=0, totalPrice=0;
  widths.forEach(w=>{
    const e=p.sizes[w];
    const qty=Number(e.qty)||1; totalQty+=qty;
    const unit=priceForWidth(w,e.hafr); totalPrice+=unit*qty;
    // ارتفاع غير الاستاندر = خدمة قص، والتدعيم اختيار — الاتنين بنود بتتحسب
    if(Number(e.height)) totalPrice+=CUSTOM_EXTRA*qty;
    if(e.wood) totalPrice+=WOOD_EXTRA*qty;
    if(e.print) totalPrice+=PRINT_EXTRA*qty;
    let line=doorSizeText_(w+' سم',e.height)+' × '+qty;
    const bits=[];
    if(Number(e.height)) bits.push(CUT_SERVICE_NOTE_);
    if(e.wood) bits.push('تدعيم خشب');
    if(e.print) bits.push('طباعة');
    if(e.hafr) bits.push('حفر');
    if(e.frame) bits.push('حلق '+frameText_(e.frame,e.frameHeight));
    if(e.dbror) bits.push('برور '+e.dbror);
    if(bits.length) line+=' ('+bits.join('، ')+')';
    parts.push(line);
  });
  if(customReady){
    const w=Number(p.custom.w), h=Number(p.custom.h), qty=Number(p.custom.qty)||1;
    // خدمة القص بند مستقل — بتتحسب في الإجمالي زي أي صنف
    totalQty+=qty; totalPrice+=(priceForWidth(w,p.custom.hafr)*qty)+(CUSTOM_EXTRA*qty)
                              +(p.custom.wood?WOOD_EXTRA*qty:0)
                              +(p.custom.print?PRINT_EXTRA*qty:0);
    let line=w+'×'+h+' سم (خاص) × '+qty;
    const bits=[CUT_SERVICE_NOTE_];
    if(p.custom.wood) bits.push('تدعيم خشب');
    if(p.custom.print) bits.push('طباعة');
    if(p.custom.hafr) bits.push('حفر');
    if(p.custom.frame) bits.push('حلق '+frameText_(p.custom.frame,p.custom.frameHeight));
    if(p.custom.dbror) bits.push('برور '+p.custom.dbror);
    if(bits.length) line+=' ('+bits.join('، ')+')';
    parts.push(line);
  }

  let t='باب '+d.code+' '+d.name+' — '+parts.join('، ')+' — إجمالي '+totalQty;
  if(pricesVisible()) t+=' = '+money(totalPrice)+' ج';
  t+=' (الحلق والبرور شامل مع الباب)';
  return t;
}

  const lines=state.cart.map((it,i)=>{

    let spec;
    if(it.kind==='door'){
      spec=doorSizeText_(it.sizeTxt,it.doorHeight)+(priced?' · '+money(it.unitPrice)+' ج':'')+' × '+it.qty;
      const inc=[]; if(it.frame) inc.push('حلق '+frameText_(it.frame,it.frameHeight)); if(it.dbror) inc.push('برور '+it.dbror);
      if(inc.length) spec+='<br>شامل: '+inc.join(' + ')+(priced?' — بدون سعر':'');

    } else if(it.kind==='frame'||it.kind==='bror'){
      spec = it.isSet ? (it.qty+' طقم'+(priced?' — '+money(it.price)+' ج/طقم':''))
                       : it.customSet ? (it.qty+' عود'+(priced?' — '+money(linePrice(it))+' ج':'')+'<br>'+esc(it.spec))
                       : (it.qty+' عود'+(it.rodCm?' × '+it.rodCm+' سم':'')+(priced?' — '+money(it.price)+' ج/عود':''));

      spec = it.qty+' متر'+(priced?' — '+money(it.price)+' ج/متر':'');

    // ⚠️ بند «خدمة قص» بيتولّد تلقائي من الأبواب. لو سبنا زراير التعديل/الحذف
    // شغالة عليه، الحذف كان بيشيله والحفظ بيرجّعه في نفس اللحظة — زرار بيوهم

    const cut = isCutLine_(it);

    return `<div class="line">${th}<div class="info2"><b>${esc(it.title)}</b>
      <div class="spec">${spec}</div>${priced?`<div class="pr">${money(linePrice(it))} ج</div>`:''}</div>
      ${cut?'':`<div class="lineacts">
        <button class="edit" data-act="edit-line" data-i="${i}" title="تعديل" aria-label="تعديل">${ico("edit")}</button>
        <button class="del" data-act="del" data-i="${i}" title="حذف" aria-label="حذف">${ico("x")}</button>

      ${state.editingMeta?`

   متابعة الطلبات — بتقرا الحالة من الشيت
   ============================================================ */
/* ============================================================
   الأيقونات — مجموعة SVG موحّدة (هوية بصرية ثابتة على كل الأجهزة)
   بديل الإيموجي اللي كان شكله بيختلف من موبايل للتاني.
   ============================================================ */
/* ============================================================
   تجهيز الصور والـ PDF — نسخة محسّنة ضد التهنيج
   المشاكل اللي كانت بتهنّج التطبيق واتحلّت هنا:
   ١) html2canvas بينسخ الصفحة كلها قبل ما يرسم، وصفحتنا فيها صور الأبواب
      كلها base64 (حجم كبير) — فكنا بندفع التكلفة دي في كل تصدير.
      الحل: نخفي شبكة الأبواب مؤقتًا وقت الرسم (onclone) فمابتتنسخش.
   ٢) scale ثابت ٢ حتى للتقارير الطويلة — كان بيطلع كانفس بملايين البكسلات
      فالمتصفح بيقع. الحل: scale بيتحسب حسب طول المستند مع سقف أقصى للبكسلات.
   ٣) الـ PDF الطويل كان بيحط نسخة كاملة من الصورة في كل صفحة (تكرار ضخم).
      الحل: بنقصّ كل صفحة لوحدها من الكانفس ونحطها بحجمها بس.
   ٤) العمليات التقيلة كانت بتقفل الواجهة تمامًا. الحل: بنسيب المتصفح
      يتنفّس بين الخطوات (yield_) فالشاشة تفضل تتحرك ومؤشر التحميل يبان.
   ============================================================ */

const MAX_CANVAS_PIXELS = 16e6;   // سقف آمن يشتغل على الموبايلات الضعيفة

// بتسيب المتصفح يرسم قبل ما نكمل — بتمنع تجميد الواجهة
function yield_(ms){
  return new Promise(r=>requestAnimationFrame(()=>setTimeout(r, ms||0)));
}

// بترسم محتوى #paper وترجّع canvas — بتظبط الـ scale لوحدها حسب الطول
async function renderPaper_(html, opts){
  const paper = document.getElementById('paper');
  paper.innerHTML = html;
  await yield_(60);                       // تفتح مجال للصور/الخطوط تتحمّل
  const el = paper.firstElementChild;
  const w = el.offsetWidth || 794;
  const h = el.offsetHeight || 1123;

  // scale المطلوب مقابل السقف المسموح
  let scale = (opts && opts.scale) || 2;
  // التقارير الطويلة (أكتر من ~4 صفحات A4) مش محتاجة دقة x2 — الفرق مش بيبان في PDF
  // بس الوقت والذاكرة بيتضاعفوا. بنقلّل الدقة تدريجيًا مع الطول فالتقرير بيطلع أسرع بكتير.
  const a4h = w * 1.414;
  if(h > a4h * 4)      scale = Math.min(scale, 1.5);
  else if(h > a4h * 2) scale = Math.min(scale, 1.75);
  const maxScale = Math.sqrt(MAX_CANVAS_PIXELS / Math.max(w*h, 1));
  if(scale > maxScale) scale = Math.max(1, maxScale);

  // لو مطلوب إن كل عنصر بيطابق selector معيّن يبدأ صفحة جديدة إجباريًا (مثلاً كل طلب في تقرير)،
  // بنسجّل مكانه بالبكسل (بمقياس canvas) قبل ما نمسح محتوى الورقة
  let breaksPx = null;
  if(opts && opts.breakSelector){
    const elTop = el.getBoundingClientRect().top;
    breaksPx = Array.from(el.querySelectorAll(opts.breakSelector))
      .map(n => Math.round((n.getBoundingClientRect().top - elTop) * scale))
      .filter(y => y > 0);
  }

  // بلوكات لازم تفضل في صفحة واحدة (كارت التحويل والملحوظة) — بنسجّل مكانها بمقياس canvas
  const keepTop = el.getBoundingClientRect().top;
  const keepBlocks = Array.from(el.querySelectorAll('.keep-blk')).map(n=>{
    const r = n.getBoundingClientRect();
    return [Math.round((r.top-keepTop)*scale), Math.round((r.bottom-keepTop)*scale)];
  });

  await yield_(0);
  const canvas = await html2canvas(el, {
    scale,
    backgroundColor:'#ffffff',
    useCORS:true,
    logging:false,
    imageTimeout:15000,
    removeContainer:true,
    // أهم سطر: بنشيل صور الكتالوج من النسخة اللي html2canvas بيرسمها
    onclone: doc => {
      doc.querySelectorAll('.rail, .secnav, .tabs, #view').forEach(n=>{
        if(!n.contains(doc.getElementById('paper'))) n.remove();
      });
    }
  });
  paper.innerHTML = '';
  canvas._keep = keepBlocks;
  await yield_(0);
  return { canvas, breaksPx };
}

// بتحوّل canvas لـ PDF بتقطيع صفحات حقيقي (مش تكرار نفس الصورة)

// بيحاول يشارك الملف مباشرة (بيظهر واتساب في شاشة المشاركة لو متاحة)، ولو مش متاحة بينزّله عادي
async function shareOrDownload_(blob, filename, title){
  try{
    const file = new File([blob], filename, {type: blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title: title||filename});
      return true;
    }
  }catch(err){
    if(err && err.name==='AbortError') return true;   // العميل قفل شاشة المشاركة، مش خطأ
  }
  downloadBlob(blob, filename);
  toast('اتحمّل الملف — افتح واتساب وابعته من المرفقات');
  return false;
}

// بتقطّع الـ canvas لصفحات A4. لو opts.hardBreaksPx موجودة، كل نقطة فيها بتبدأ صفحة جديدة إجباريًا
// (مثلاً بداية كل طلب في تقرير) — والمقطع اللي أطول من صفحة واحدة بيتقسّم تلقائي زي العادي جواه.
async function canvasToPdf_(canvas, filename, opts){
  opts = opts || {};
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF('p','mm','a4');
  const PW = 210, PH = 297;
  const FOOT_H = 5;                               // مساحة صغيرة أسفل الصفحة لرقم الصفحة بس
  const usableH = PH - FOOT_H;
  const pxPerMm = canvas.width / PW;
  const pageHpx  = Math.floor(usableH * pxPerMm); // المحتوى بيتقص على الارتفاع المتاح بس

  const hardBreaks = (opts.hardBreaksPx||[]).filter(y=>y>0 && y<canvas.height).sort((a,b)=>a-b);
  // لو بلوك «لازم يفضل مع بعضه» هيتقطع بين صفحتين، نبدأ صفحة جديدة عنده (لو أقصر من صفحة)
  (canvas._keep||[]).forEach(([top,bot])=>{
    const prev = hardBreaks.filter(y=>y<=top).pop() || 0;
    const rt = top-prev, rb = bot-prev;
    if(rb-rt <= pageHpx && Math.floor(rt/pageHpx) !== Math.floor((rb-1)/pageHpx)){
      hardBreaks.push(top); hardBreaks.sort((a,b)=>a-b);
    }
  });
  const segBounds = [0, ...hardBreaks, canvas.height];
  const segments = [];
  for(let i=0;i<segBounds.length-1;i++){
    if(segBounds[i+1] > segBounds[i]) segments.push([segBounds[i], segBounds[i+1]]);
  }

  const slice = document.createElement('canvas');
  // willReadFrequently:false + إعادة استخدام نفس اللوحة بدل ما نعيد حجزها كل صفحة.
  // تغيير width/height بيمسح اللوحة ويعيد حجز الذاكرة، وده كان بيتعمل لكل صفحة
  // حتى لما الطول مايكونش اتغيّر — أبطأ حاجة في تجهيز تقرير طويل.
  const ctx = slice.getContext('2d', { alpha:false });
  slice.width = canvas.width;

  let totalPages = 0;
  segments.forEach(([s,e])=>{ totalPages += Math.max(1, Math.ceil((e-s)/pageHpx)); });

  let pageIdx = 0;
  for(const [segStart, segEnd] of segments){
    const subPages = Math.max(1, Math.ceil((segEnd-segStart)/pageHpx));
    for(let j=0;j<subPages;j++){
      const sy = segStart + j*pageHpx;
      const sh = Math.min(pageHpx, segEnd - sy);
      if(slice.height !== sh) slice.height = sh;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0,0,slice.width,slice.height);
      ctx.drawImage(canvas, 0, sy, canvas.width, sh, 0, 0, canvas.width, sh);

      if(pageIdx > 0) pdf.addPage();
      pdf.addImage(slice.toDataURL('image/jpeg',0.88), 'JPEG', 0, 0, PW, sh / pxPerMm);

      if(totalPages > 1){
        pdf.setFontSize(8);
        pdf.setTextColor(120,130,145);
        pdf.text(String(pageIdx+1) + ' / ' + totalPages, PW/2, PH - 2.5, {align:'center'});
      }
      pageIdx++;
      if(pageIdx % 2 === 0) await yield_(0);          // منع تجميد الواجهة من غير ما نبطّأ التقرير
    }
  }
  // ⚠️ المشاركة كانت خيار اختياري (opts.share) — واتنين من أربع نداءات نسيوه،
  // منهم مستند الطلب وعرض السعر نفسهم. النتيجة إن أهم ورقتين بيبعتهم المصنع
  // كانوا بينزّلوا في مجلد التنزيلات على الموبايل بدل ما تتفتح شاشة المشاركة.
  // بقت هي الافتراضي: اللي عايز تنزيل مباشر يطلبه صراحة بـ share:false.
  if(opts.share !== false){
    const blob = pdf.output('blob');
    await shareOrDownload_(blob, filename, filename);
    return;
  }
  pdf.save(filename);
}

// ومعدّل بيبقى مركّب (417/2) زي المستند بالظبط.
// ⚠️ باج كان هنا: الشاشات كانت بتعرض o.id (الكود الداخلي) والمستند بيعرض displayNo،
// فالموزع والمصنع كانوا شايفين رقمين مختلفين لنفس الطلب — وجع أول ما حد يكلّم حد.
// رقم النسخة اللي قبل التعديل: نفس الرقم التسلسلي بعدّاد تعديل أقل بواحد
// (52 ثم 52/1 ثم 52/2). لو الرقم التسلسلي لسه مش معروف بنقع على الكود الداخلي.
// ⚠️ الشاشات كانت بتعرض الكود الداخلي (#W260908-...) — كود الموزّع مايعرفوش
// ومش مكتوب على أي ورقة عنده. نفس باج v137 اللي اتصلّح للواتساب والمستند.
function prevOrderNoText_(o){
  if(!o || !o.replacesId) return '';
  return o.displayNo
    ? orderNoText_({ displayNo:o.displayNo, editCount:(Number(o.editCount)||1) - 1 })
    : '#' + o.replacesId;
}
function orderNoText_(o){
  if(!o) return '';
  const n = o.displayNo;
  if(!n) return '#' + (o.id || '');
  const ec = Number(o.editCount) || 0;
  return ec > 0 ? (n + '/' + ec) : String(n);
}

// مش سر ومش وسيلة تحقق — مجرد تفرقة بين الأجهزة.
function deviceId_(){

}

// بنستخدم JSONP (وسم script) بدل fetch — أضمن مع Apps Script ومفيش مشاكل CORS
// ⚠️ المهلات كانت متناثرة بأرقام عشوائية: ١٢ ثانية لجلب الأسعار، ١٥ للافتراضي،
// ٢٠ لإرسال الطلب، ٢٥ لتقرير الأصناف. وأقصر واحدة فيهم (الأسعار) بتتنادى عند
// فتح التطبيق بالظبط — وقت ما Apps Script بيبقى «نايم» ورده بياخد أطول حاجة.
// Apps Script بطيء بطبعه (بيصحّى من السكون + بيقرا الشيت)، والفشل الحقيقي في
// الشبكة بيوصل فورًا من sc.onerror مش بالمهلة — فالمهلة الطويلة مابتأخّرش
// المستخدم في حالة العطل، بس بتديه فرصة لما السيرفر يكون بطيء وخلاص.
const JSONP_TIMEOUT_MS = 25000;
function jsonp(url, timeout){
  return new Promise((res, rej) => {
    const cb = 'wpcb' + Date.now() + Math.floor(Math.random()*999);
    const sc = document.createElement('script');
    const t = setTimeout(() => { cleanup(); rej(new Error('انتهت المهلة')); }, timeout || JSONP_TIMEOUT_MS);
    function cleanup(){ clearTimeout(t); delete window[cb]; sc.remove(); }
    window[cb] = d => { cleanup(); res(d); };
    sc.onerror = () => { cleanup(); rej(new Error('تعذّر الاتصال')); };
    sc.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.body.appendChild(sc);
  });
}



async function loadTrack(){
  if(!APPS_SCRIPT_URL){ state.track.err='مفيش رابط سيرفر متظبّط'; render(); return; }
  state.track.loading = true; state.track.err = ''; render();
  try{
    const phone = String(state.profile.phone||'').trim();
    const d = await jsonp(APPS_SCRIPT_URL + '?action=list&dev=' + encodeURIComponent(deviceId_())
      + '&phone=' + encodeURIComponent(phone));
    if(!d || !d.ok) throw new Error((d && d.error) || 'رد غير متوقع');
    state.track.rows = d.orders || [];
    state.track.at = Date.now();
    state.track.phoneUsed = phoneKey_();
    mergeRestored_(state.track.rows);
    // بنحدّث رقم الطلب "العادي" وعدد التعديلات في النسخة المحلية من أي رد سيرفر بيوصلنا،
    // عشان لو الرد الأول وقت الإرسال ضاع (النت اتقطع) يتظبط تلقائي أول ما نفتح "تابع طلبك"
    let changedLocal=false;
    state.track.rows.forEach(r=>{
      const lo = state.orders.find(x=>String(x.id)===String(r.id));
      if(lo && r.displayNo && (lo.displayNo!==r.displayNo || lo.editCount!==r.editCount)){
        lo.displayNo=r.displayNo; lo.editCount=r.editCount||0; changedLocal=true;
      }
    });
    if(changedLocal) saveOrders_(state.orders);
  }catch(err){
    state.track.err = err.message || String(err);
  }
  state.track.loading = false; render();
}

/* ============================================================
   شاشة المصنع — تغيير حالة الطلب (بكلمة سر)
   ============================================================ */
// ⚠️ شاشة المصنع كانت بتفضل فاضية بتلف لحد ما السيرفر يرد. Apps Script بطيء
// بطبعه (بيصحّى من السكون + بيقرا الشيت كله)، فالمصنع كان بيستنى كل مرة يفتح
// الشاشة أو يبدّل تبويب.
// دلوقتي بنحفظ آخر قايمة وصلت، وبنعرضها فورًا وإحنا بنجيب الجديدة في الخلفية.
// الشاشة بتفتح على طول، والأرقام بتتحدّث لوحدها أول ما الرد يوصل.
// ⚠️ باج تاني كان بيخلّي الحذف «ما يمسكش»: الفحص الخلفي بيجيب قايمة الطلبات
// كل ٩٠ ثانية، وبيكتبها فوق القايمة المعروضة. لو النداء ده كان طالع قبل الحذف
// (أو طلع وقت ما الحذف لسه شغّال على السيرفر)، الرد بييجي وفيه الطلب المحذوف
// — فالسطر بيرجع يبان تاني بعد ثواني، والمصنع يفتكر إن الحذف مش بيشتغل.
// بنفتكر اللي اتحذف من هنا لمدة ٥ دقايق، وبنشيله من أي قايمة جاية من السيرفر.
const _deletedIds = new Map();          // معرّف الطلب → وقت الحذف
const DELETED_TTL_MS = 5 * 60 * 1000;
function dropDeleted_(rows){
  const now = Date.now();
  _deletedIds.forEach((t,id)=>{ if(now - t > DELETED_TTL_MS) _deletedIds.delete(id); });
  if(!_deletedIds.size) return rows || [];
  return (rows || []).filter(o => !_deletedIds.has(String(o.id)));
}

const LS_ADM_CACHE = 'wpc_adm_rows';

function saveAdminCache_(rows){
  try{ localStorage.setItem(LS_ADM_CACHE, JSON.stringify({at:Date.now(), rows:rows||[]})); }catch(e){}
}
function loadAdminCache_(){
  try{
    const c = JSON.parse(localStorage.getItem(LS_ADM_CACHE)||'null');
    // بنسيبها ٧ أيام — أقدم من كده الأرقام بتبقى مضلّلة أكتر من إنها مفيدة
    if(c && Array.isArray(c.rows) && (Date.now()-c.at) < 7*24*3600*1000) return c;
  }catch(e){}
  return null;
}
function clearAdminCache_(){ try{ localStorage.removeItem(LS_ADM_CACHE); }catch(e){} }

// بتقارن نسخة السكربت المنشور بالمطلوبة. ما بترجّعش حاجة — بتحدّث state
// والشاشة بتعرض السطر لوحدها. أي فشل (نت، سكربت قديم مابيرجّعش srv) بيتسجّل
// كـ«مش معروف» مش كـ«تمام» — الافتراض الأأمن إننا مانعرفش.
// الـping رد صغير جدًا، فمهلة أقصر من العادي كفاية — ومش عايزينه يقعد
// يستنى ٢٥ ثانية وهو مجرد سؤال عن نسخة.
const PING_TIMEOUT_MS = 15000;
async function checkServerBuild_(){
  if(state.admin.srvChecking) return;
  state.admin.srvChecking = true;
  try{
    const d = await jsonp(APPS_SCRIPT_URL + '?action=ping', PING_TIMEOUT_MS);
    state.admin.srv = (d && d.ok && d.srv) ? String(d.srv) : '';
    state.admin.srvErr = '';
  }catch(e){
    state.admin.srv = null;                 // null = مافيش رد خالص
    state.admin.srvErr = e && e.message ? e.message : 'مفيش رد';
  }
  state.admin.srvChecking = false;
  render();
}

// السطر اللي المصنع بيشوفه. تمام؟ مابيبانش خالص — مش عايزين سطر زيادة على
// الشاشة كل يوم. قديم أو مش معروف بس هو اللي بيظهر.
function srvBuildNote_(){
  const v = state.admin.srv;
  if(v === undefined || v === SRV_BUILD_WANT) return '';

  return `<div class="ordnote">${ico("warn")}<span>السكربت المنشور على جوجل نسخة <b>${esc(v||'قديمة جدًا')}</b> والتطبيق محتاج <b>${SRV_BUILD_WANT}</b>. انسخ <b>apps_script.gs</b> كله من جديد واعمل <b>Deploy ▸ New version</b> على <b>نفس</b> الـdeployment — مش deployment جديد، عشان الرابط مايتغيّرش.</span></div>`;
}

async function adminLoad(){
  // فيه نسخة محفوظة ومفيش حاجة معروضة؟ اعرضها فورًا بدل شاشة الانتظار
  if(!state.admin.rows){
    const c = loadAdminCache_();
    if(c){
      state.admin.rows = c.rows;
      state.admin.open = true;
      state.admin.staleAt = c.at;       // عشان نقول للمستخدم إن دي نسخة محفوظة
    }
  }
  state.admin.loading = true; state.admin.err = ''; render();
  try{
    const d = await jsonp(APPS_SCRIPT_URL + '?action=list' + admParams_());
    if(!d || !d.ok) throw new Error((d && d.error) || 'رد غير متوقع');
    state.admin.rows = dropDeleted_(d.orders);
    state.admin.open = true;
    state.admin.staleAt = null;         // البيانات بقت من السيرفر مباشرة
    saveAdminCache_(state.admin.rows);
    sessionStorage.setItem('wpc_adm', state.admin.pw);
    markAdminSeen_(state.admin.rows);       // فتح الشاشة فعليًا = المصنع شاف كل الطلبات الحالية
    state.admin.pendingCount = 0; updateAdmBadge();
    if('Notification' in window && Notification.permission==='default') Notification.requestPermission();
    startAdminPolling();
    // ⚠️ كلمة سر المصنع متخزّنة في sessionStorage وبتتمسح لما التطبيق يتقفل.
    // فلو المصنع عدّل الأسعار وهو أوفلاين وقفل التطبيق، الرفع مكانش يقدر يشتغل
    // تاني (محتاج كلمة السر) ومزامنة الأسعار كانت هتفضل واقفة. الدخول نفسه
    // بيشغّلها دلوقتي — فأول ما يدخل، اللي لسه ما اترفعش بيترفع.
    syncPricesFromServer_();
    checkServerBuild_();                    // مرة كل دخول — رد صغير وبيتكاش
  }catch(err){
    state.admin.err = err.message || String(err);
    // فشل التحديث وعندنا نسخة محفوظة معروضة؟ سيبها شغّالة بدل ما نقفل الشاشة
    // على المصنع — نسخة قديمة أحسن من شاشة فاضية وقت ما النت يقطع.
    if(!state.admin.staleAt) state.admin.open = false;
  }
  state.admin.loading = false; render();
  maybeShowDueOverlay_();   // أوردرات النهاردة + الطلبات القديمة من غير ميعاد (مرة كل فتحة للتطبيق)
}


async function setStatus(id, st){
  // بنمسك الرقم قبل أي حاجة: التسليم بيشيل الصف من القايمة، وبعدها مش هنلاقي
  // رقمه التسلسلي فالرسالة كانت بترجع للكود الداخلي
  const رقم_الطلب = adminOrderNoText_(id);
  state.admin.busy = id; render();
  try{
    const d = await jsonp(APPS_SCRIPT_URL
      + '?action=setStatus' + admParams_()
      + '&id=' + encodeURIComponent(id)
      + '&status=' + encodeURIComponent(st));
    if(!d || !d.ok) throw new Error((d && d.error) || 'فشل التحديث');
    const row = (state.admin.rows||[]).find(o=>String(o.id)===String(id));
    if(row) row.status = st;
    if(d.archived){
      // تسليم الطلب بيأرشفه أوتوماتيك — يتشال من القايمة النشطة على طول
      state.admin.rows = (state.admin.rows||[]).filter(o=>String(o.id)!==String(id));
      state.admin.archRows = null;   // الكاش بقى قديم، هيتحمّل تاني لما المصنع يفتح الأرشيف
      toast('اتحدّثت حالة الطلب ' + رقم_الطلب + ' → ' + (STATUS[st] ? STATUS[st].ar : st) + ' — واتأرشف تلقائي');
    } else {
      toast('اتحدّثت حالة الطلب ' + رقم_الطلب + ' → ' + (STATUS[st] ? STATUS[st].ar : st));
    }
  }catch(err){
    toast('تعذّر التحديث: ' + (err.message || err));
  }
  state.admin.busy = null; render();
}

// بيشيل الطلب من كل نسخ الشاشة (النشط + الأرشيف + الأصناف المحمّلة)
function forgetOrderLocally_(id){
  _deletedIds.set(String(id), Date.now());
  state.admin.rows = (state.admin.rows||[]).filter(o=>String(o.id)!==String(id));
  if(state.admin.archRows) state.admin.archRows = state.admin.archRows.filter(o=>String(o.id)!==String(id));

  saveAdminCache_(state.admin.rows||[]);

// ⚠️ «الحذف بيعلّق والسطر مش بيتمسح من الشيت»:
// الحذف كتابة تقيلة (سطر ملخّص + كل سطور الأصناف + رجوع الرصيد)، والرد بيرجع
// عن طريق JSONP. لو المهلة خلصت أو النت قطع بعد ما السيرفر اشتغل فعلًا،
// التطبيق كان بيقول «تعذّر الحذف» والسطر يفضل في الشاشة — والمصنع يضغط تاني
// ويلاقي «الطلب مش موجود»، فيفتكر إن الحذف مش شغّال.
// دلوقتي: مهلة أطول للحذف، ومحاولة تانية أوتوماتيك لو الاتصال قطع
// (الحذف على السيرفر بقى مُعاد التنفيذ بأمان)، و«الطلب مش موجود» =
// يعني اتمسح خلاص، فبنشيله من الشاشة بدل ما نسيبه معلّق.
const DELETE_TIMEOUT_MS = 60000;

async function deleteOrderCall_(id){
  const d = await jsonp(APPS_SCRIPT_URL
    + '?action=deleteOrder' + admParams_()
    + '&id=' + encodeURIComponent(id), DELETE_TIMEOUT_MS);
  if(d && d.ok) return { gone:true, already:!!d.alreadyGone };
  const msg = (d && d.error) || 'فشل الحذف';
  if(/مش موجود/.test(msg)) return { gone:true, already:true };   // اتمسح قبل كده
  // رد فعلي من السيرفر (كلمة سر غلط مثلاً) — إعادة المحاولة مش هتفيد
  const err = new Error(msg); err.fromServer = true; throw err;
}

async function deleteOrder(id){
  if(!confirm('تأكيد حذف الطلب '+adminOrderNoText_(id)+'؟ الإجراء ده نهائي ومش هيترجع.')) return;
  const رقم_الطلب = adminOrderNoText_(id);
  state.admin.delBusy = id; render();
  try{
    let r;
    try{
      r = await deleteOrderCall_(id);
    }catch(err1){
      // السيرفر رد برفض واضح؟ مفيش فايدة من إعادة المحاولة
      if(err1 && err1.fromServer) throw err1;
      // فشل اتصال/مهلة؟ نعيد النداء مرة واحدة — لو الأولى نجحت على السيرفر
      // التانية هترجع «اتمسح خلاص»، ولو ما نجحتش هتكمّل الشغل اللي وقف
      r = await deleteOrderCall_(id);
    }
    forgetOrderLocally_(id);
    toast(r.already ? ('الطلب ' + رقم_الطلب + ' كان متحذف خلاص — اتشال من القايمة')
                    : ('اتحذف الطلب ' + رقم_الطلب));
  }catch(err){
    toast('تعذّر الحذف: ' + (err.message || err));
  }
  state.admin.delBusy = null; render();
}

// مسح كل الطلبات المؤرشفة (تم التسليم) دفعة واحدة — تنظيف دوري، إجراء نهائي وجماعي فمحتاج تأكيد قوي
async function clearDeliveredOrders(){
  const list = state.admin.archRows || [];
  const n = list.filter(o=>o.status==='Delivered').length;
  if(!n){ toast('مفيش طلبات مؤرشفة لمسحها'); return; }
  if(!confirm('هيتمسح '+n+' طلب من الأرشيف نهائيًا من الشيت (الطلب وكل أصنافه) — الإجراء ده مش قابل للتراجع. متأكد؟')) return;
  if(!confirm('تأكيد أخير: هيتحذف '+n+' طلب فعلًا ونهائيًا. اضغط موافق للمتابعة.')) return;
  state.admin.archLoading = true; render();
  try{
    const d = await jsonp(APPS_SCRIPT_URL
      + '?action=deleteDelivered' + admParams_());
    if(!d || !d.ok) throw new Error((d && d.error) || 'فشل المسح');
    // نفس حكاية الفحص الخلفي: اللي اتمسح دلوقتي ممكن يرجع في رد قايمة
    // كان طالع قبل المسح — فبنفتكره ونشيله من أي قايمة جاية
    (d.ids || list.filter(o=>o.status==='Delivered').map(o=>o.id))
      .forEach(id=>_deletedIds.set(String(id), Date.now()));
    state.admin.archRows = list.filter(o=>o.status!=='Delivered');
    state.admin.rows = (state.admin.rows||[]).filter(o=>o.status!=='Delivered');
    Object.keys(state.admin.items||{}).forEach(id=>{
      if(!(state.admin.rows||[]).find(o=>String(o.id)===id) && !(state.admin.archRows||[]).find(o=>String(o.id)===id)){
        delete state.admin.items[id]; delete state.admin.itemsOpen[id];
      }
    });
    toast('اتمسح '+(d.count||n)+' طلب من الأرشيف');
  }catch(err){
    toast('تعذّر المسح: ' + (err.message || err));
  }
  state.admin.archLoading = false; render();
}

// بيحدّث الكمية المطلوبة لصنف معيّن جوه طلب (تعديل يدوي من شاشة المصنع) وبيحدّث إجماليات الطلب في القايمة
// ⚠️ السيرفر ممكن يعدّل/يمسح بند «خدمة قص» لوحده بعد تعديل كمية باب أو حذفه.
// نسخة الأصناف المحفوظة على الجهاز بتبقى ساعتها مزحلقة عن الشيت — والأرقام
// اللي بنبعتها في أي تعديل بعده بتوقع على الصنف الغلط. بنرمي النسخة ونجيبها
// تاني من السيرفر.
async function refreshOrderItems_(id){
  delete state.admin.items[id];
  // مسودّات تعديل الكميات متخزّنة بالرقم (id:idx) — بعد ما الترتيب يتغيّر
  // بتبقى بتشاور على أصناف تانية خالص. بنمسحها بدل ما تتطبّق على الغلط.
  Object.keys(state.admin.qtyEdit || {}).forEach(k=>{
    if(k.indexOf(id+':')===0) delete state.admin.qtyEdit[k];
  });
  try{ await loadOrderItems_(id); }catch(e){}
  render();
}

/* ---------- نداء موحّد لعمليات المصنع ----------
   ⚠️ خمس دوال كانوا بيكرروا نفس الهيكل حرف بحرف: علّم «مشغول» → أعِد الرسم →
   نادِ السيرفر → اتأكد من الرد → طبّق النتيجة → رسالة → صفّر «مشغول» → أعِد
   الرسم، وكل واحدة بتكتب معالجة الخطأ من أول وجديد. أي تعديل على المعالجة كان
   لازم يتعمل ٥ مرات، ونسيان واحدة معناها إن الصف يفضل معطّل للأبد بعد أي خطأ. */
async function adminAction_(o){
  state.admin[o.busyField] = o.busyKey; render();
  try{
    const d = await jsonp(APPS_SCRIPT_URL + '?action=' + o.action + admParams_() + (o.params || ''));
    if(!d || !d.ok) throw new Error((d && d.error) || o.failMsg || 'فشل التحديث');
    if(o.onOk) o.onOk(d);
    toast(typeof o.okMsg === 'function' ? o.okMsg(d) : o.okMsg);
  }catch(err){
    toast((o.errPrefix || 'تعذّر التحديث: ') + (err.message || err));
  }
  state.admin[o.busyField] = null; render();
}

// بيحدّث qty/rods/total لسطر الطلب في state.admin.rows/archRows بعد أي تعديل يدوي على أصنافه
function applyOrderTotals_(id, totals){
  if(!totals) return;
  [state.admin.rows, state.admin.archRows].forEach(list=>{
    const o = (list||[]).find(x=>String(x.id)===String(id));
    if(o){ o.qty = totals.qty; o.rods = totals.rods; o.total = totals.total; }
  });
}

// بيبني order object موحّد من بيانات شاشة المصنع (list + orderItems) — مستخدم في تصدير الـ PDF وفي مشاركة الصورة
// السيرفر بيخزّن اسم الصنف بالإنجليزي بس (Order_Items عمود Item). بنعيد بناء الاسم العربي
// من نفس الكتالوجات اللي التطبيق أصلًا شغال بيها (DOORS/ACCESSORIES)، مش نص إنجليزي متسيّب.
const ACC_EN_TO_AR_ = {}; ACCESSORIES.forEach(a=>{ ACC_EN_TO_AR_[a.en] = a.name; });
// الحفر ليه عمود خاص في الشيت (Milling)، والطباعة علامتها متكتوبة في اسم
// الصنف نفسه («(Print)») — الاتنين بيرجعوا للاسم العربي عشان المصنع يشوفهم
// على سطر الباب في كل مستند، مش في بند تحته بس.
const PRINT_MARK_RE_ = /\(طباعة\)|\(Print\)/i;
function arabicItemTitle_(it){
  if(it.type==='Door'){
    const d = DOORS.find(x=>x.code===doorCode_(it.code));
    const base = d ? ('باب '+d.code+' '+d.name) : (it.code||it.title||'');
    return base + (String(it.milling||'').trim() ? ' (حفر)' : '')
                + (PRINT_MARK_RE_.test(String(it.title||'')) ? ' (طباعة)' : '')
                + (it.itemNote ? ' — '+it.itemNote : '');
  }
  // المقاس محفوظ إنجليزي في الشيت ('10 cm' / '6x9')، والمستند عربي —
  // arabicSizeText_ بتحوّله لـ '10 سم' وبتسيب اللي مش على الصيغة دي زي ما هو.
  // ⚠️ وصف الحلق اللي على الشيت بقى عربي كامل ('حلق كامل 10 سم — A01')، فالسطر
  // كان بيطلع في المستندات «حلق حلق كامل 10 سم — A01 — A01» — الاسم والكود متكررين.
  if(it.type==='Frame' || it.type==='Bror'){
    const بادئة = it.type==='Frame' ? 'حلق' : 'برور';
    const sz = arabicSizeText_(it.size||'');
    let t = sz.indexOf(بادئة)===0 ? sz : (بادئة+' '+sz);
    if(it.code && t.indexOf(it.code)<0) t += ' — '+it.code;
    if(it.forDoorWidth && t.indexOf('لباب '+it.forDoorWidth)<0) t += ' — لباب '+it.forDoorWidth+' سم';
    if(it.itemNote && t.indexOf(it.itemNote)<0) t += ' — '+it.itemNote;
    return t;
  }
  if(it.type==='Panel') return 'لوح بروديوم'+(it.code?' — '+it.code:'');
  if(it.type==='Mabra') return 'معبرة'+(it.size?' '+arabicSizeText_(it.size):'')+(it.code?' — '+it.code:'');
  if(METER_TYPE_TO_KIND_[it.type]) return METER_KINDS_[METER_TYPE_TO_KIND_[it.type]].ar+(it.code?' — '+it.code:'');
  return ACC_EN_TO_AR_[it.title] || it.title || '';
}

// السيرفر بيخزّن المقاس بالإنجليزي ("70 cm" أو "80x210 cm (custom)") — بنحوّله لنفس صيغة
// العميل العربية ("70 سم" أو "80×210 سم (مقاس خاص)") قبل ما نعرضه في أي مستند
function arabicSizeText_(sizeEn){
  const s = String(sizeEn||'').trim();
  let m = /^(\d+(?:\.\d+)?)\s*cm$/i.exec(s);
  if(m) return m[1]+' سم';
  m = /^(\d+(?:\.\d+)?)\s*x\s*(\d+(?:\.\d+)?)\s*cm\s*\(custom\)$/i.exec(s);
  if(m) return m[1]+'×'+m[2]+' سم (مقاس خاص — مقاس الفتحة المعمارية)';
  return s;
}

function buildAdminDocOrder_(o, its, tierKey){
  const items = (its||[]).map(it=>adminDocItem_(it, tierKey));
  // ⚠️ باج كان هنا: الإجمالي كان بيتاخد من o.total زي ما هو — وده دايمًا إجمالي
  // الجملة. لكن السطور بتتسعّر بالمستوى المختار (عميل). يعني عرض السعر
  // اللي بيروح للعميل سطوره مابتجمعش على الإجمالي المكتوب تحتها، والإجمالي أقل
  // من مجموعها. بنحسبه من نفس السطور اللي اتطبعت.
  const total = tierKey && tierKey !== 'dist'
    ? قرش_(items.reduce((sum,it)=>sum + قرش_((Number(it.unitPrice)||0) * (Number(it.qty)||0)), 0))
    : o.total;
  return {
    id:o.id, fromAdmin:true, ts:o.date?new Date(o.date).getTime():Date.now(),
    name:o.dist, phone:o.phone, region:o.region, warehouse:'', total,
    customer:o.customer||'', note:o.ordNote||'',
    // ⚠️ الحقول دي مكانتش بتتنقل خالص، فمستند المصنع كان بيطبع رقم الطلب الداخلي
    // الطويل (#2026-xxxx) بدل الرقم التسلسلي اللي العميل شايفه في تطبيقه.
    // يعني الورقة اللي في المصنع والورقة اللي مع العميل رقمين مختلفين لنفس الطلب.
    displayNo: o.displayNo || '', editCount: Number(o.editCount)||0, replacesId: o.replacesId || '',
    editedAt: o.editedAt || '',
    priceTierLabel: tierKey ? (PRICE_TIERS[tierKey]||PRICE_TIERS.dist).label : '',
    priceTier: tierKey || '',
    items
  };
}

// بيحوّل صنف من شكل السيرفر لشكل المستند، وبيسعّره على المستوى المختار
function adminDocItem_(it, tierKey){
  // المقاس بيتخزّن إنجليزي في الشيت ('10 cm')؛ بنعرّبه لكل الأنواع مش الأبواب بس
  const sz = it.type==='Door' ? doorSizeText_(arabicSizeText_(it.size), it.doorHeight)
                              : arabicSizeText_(it.size||'');
  const kind = it.type==='Door'?'door':(it.type==='Frame'?'frame':(it.type==='Bror'?'bror':(it.type==='Panel'?'panel':(it.type==='Mabra'?'mabra':(METER_TYPE_TO_KIND_[it.type]||'acc')))));
  // الحفر بيتعرف من عموده، ولو الطلب قديم مافيهوش العمود بنقراه من الاسم
  const حفرـالصنف = kind==='door' &&
    (!!String(it.milling||'').trim() || /\(حفر\)|\(Carved\)/i.test(String(it.title||'')));
  const price = tierKey
    ? tierPrice(it.unitPrice||0, kind, tierKey, tierKeyFor_(it, kind), {hafr:حفرـالصنف})
    : (it.unitPrice||0);
  return {
    kind, title: (it.avail===false?'⚠️ غير متاح — ':'') + arabicItemTitle_(it),
    code: it.code||'',
    sizeTxt: sz, sizeEn: it.size||'', spec: sz, unit: it.unit||'', qty: it.qty||0,
    // ⚠️ باج كان هنا: السيرفر بيخزّن وحدة الحلق الكامل كـ 'set'، والمستند بيقرا
    // it.isSet عشان يكتب «طقم». الحقل ده مكانش بيتنقل خالص، فسطر فيه ٥ أطقم كان
    // بيتطبع «٥ عود» — والطقم ٣ عيدان، يعني المصنع يقطّع ٥ بدل ١٥.
    isSet: String(it.unit||'') === 'set',
    titleEn: String(it.title||''),   // الاسم الإنجليزي المحفوظ — منه بنقرا عرض الحلق في المستند
    // نفس حكاية الكسور: مستند المصنع كان بياخد الجزء الصحيح من طول العود بس
    rodCm: (String(it.unit||'').match(/^rod\s+(\d+(?:\.\d+)?)/)||[])[1] || '',
    unitPrice: price, price: price,
    frame: it.frame||'', dbror: it.dbror||'', frameHeight: it.frameHeight||'', doorHeight: it.doorHeight||'',
    produced: it.produced
  };
}

// بيبني مستند PDF للطلب من بيانات شاشة المصنع (بعد ما أصنافه تتحمّل)
// بيبني صف المستويين (جملة/عميل) لصنف معيّن — سعر الجملة هو الأساسي، والتاني بيتاخد من القيمة
// المحفوظة له لو موجودة، وإلا بتتحسب مبدئيًا بالزيادة الافتراضية لحد ما تحفظ إنت قيمة تانية بنفسك.
function triFor_(basePrice, kind, key){
  return {
    dist: basePrice,
    showroom: tierPrice(basePrice, kind, 'showroom', key)
  };
}

function saveAdminPrices(){
  const pe = state.admin.priceEdit; if(!pe) return;
  SIZES.forEach(s=>{ if(pe.sizes[s.w]) s.price=Number(pe.sizes[s.w].dist)||0; });
  CUSTOM_EXTRA = Number(pe.customExtra.dist)||0;
  WOOD_EXTRA = Number(pe.woodExtra.dist)||0;
  if(pe.printExtra) PRINT_EXTRA = Number(pe.printExtra.dist)||0;
  if(pe.hafrExtra) HAFR_EXTRA = Number(pe.hafrExtra.dist)||0;
  FRAMES.forEach(f=>{ if(pe.frames[f.cm]) f.price=Number(pe.frames[f.cm].dist)||0; });
  BRORS.forEach(b=>{ if(pe.brors[b.size]) b.price=Number(pe.brors[b.size].dist)||0; });
  ACCESSORIES.forEach(a=>{ if(pe.acc[a.id]) a.price=Number(pe.acc[a.id].dist)||0; });
  if(pe.panel && pe.panel.prodium) PRODIUM_PRICE = Number(pe.panel.prodium.dist)||0;
  if(pe.strip && pe.strip.m) STRIP_PRICE = Number(pe.strip.m.dist)||0;
  if(pe.veneer && pe.veneer.m) VENEER_PRICE = Number(pe.veneer.m.dist)||0;

  const pickGroup = (g, tier) => Object.fromEntries(Object.entries(g).map(([k,v])=>[k, Number(v[tier])||0]));
  const out = { dist:{}, showroom:{} };
  ['dist','showroom'].forEach(tier=>{
    out[tier] = {
      sizes: pickGroup(pe.sizes, tier),
      customExtra: Number(pe.customExtra[tier])||0,
      woodExtra: Number(pe.woodExtra[tier])||0,
      printExtra: Number((pe.printExtra||{})[tier])||0,
      hafrExtra: Number((pe.hafrExtra||{})[tier])||0,
      frames: pickGroup(pe.frames, tier),
      brors: pickGroup(pe.brors, tier),
      acc: pickGroup(pe.acc, tier),
      panel: pickGroup(pe.panel, tier),
      strip: pickGroup(pe.strip, tier),
      veneer: pickGroup(pe.veneer, tier)
    };
  });
  // ⚠️ لو مساحة الجهاز مليانة، الحفظ بيفشل. من غير الفحص ده الرسالة كانت بتقول
  // «اتحفظت الأسعار الجديدة» والأسعار ترجع القديمة أول ما يقفل التطبيق.
  const pricesSaved = save(LS_PRICES, out);
  TIER_OVERRIDES.showroom = { sizes:{...out.showroom.sizes}, customExtra:out.showroom.customExtra, woodExtra:out.showroom.woodExtra, printExtra:out.showroom.printExtra, hafrExtra:out.showroom.hafrExtra, frames:{...out.showroom.frames}, brors:{...out.showroom.brors}, acc:{...out.showroom.acc}, panel:{...out.showroom.panel}, strip:{...out.showroom.strip}, veneer:{...out.showroom.veneer} };
  state.admin.pricesOpen=false; state.admin.priceEdit=null;
  render();

  if(!pricesSaved){
    toast('⚠️ الأسعار شغّالة دلوقتي بس ما اتحفظتش على الجهاز (المساحة مليانة) — هترجع القديمة لو قفلت التطبيق', 5200);
    return;
  }
  // ودلوقتي للسيرفر عشان توصل الموزّعين كلهم، مش الجهاز ده بس
  pushPricesToServer_(out);
}

// بيرفع الأسعار للشيت عشان كل الأجهزة تشوفها. لو فشل، المصنع لازم يعرف إن
// التعديل شغّال على جهازه هو بس — عشان مايفتكرش إن الموزّعين شايفين الجديد.
async function pushPricesToServer_(out, quiet){
  if(!APPS_SCRIPT_URL){
    if(!quiet) toast('اتحفظت الأسعار على الجهاز — مفيش رابط سيرفر عشان توصل للموزّعين');
    return false;
  }
  if(!state.admin.pw){ return false; }        // مش المصنع — مالوش يرفع أسعار
  if(!quiet) busy(true,'جارٍ نشر الأسعار للموزّعين…');
  let ok = false;
  try{
    const payload = JSON.stringify(out);
    const url = APPS_SCRIPT_URL + '?action=setPrices' + admParams_() + '&payload=' + encodeURIComponent(payload);
    if(url.length > 7500) throw new Error('الأسعار أطول من اللي الرابط بيستحمله');
    const d = await jsonp(url);
    if(!d || !d.ok) throw new Error((d && d.error) || 'رد غير متوقع');
    ok = true;
    save(LS_PRICES_DIRTY, false);
    toast(quiet ? '✅ الأسعار اللي عدّلتها قبل كده وصلت للموزّعين دلوقتي'
                : '✅ اتحفظت الأسعار الجديدة ووصلت للموزّعين كلهم');
  }catch(err){
    // العلامة دي بتمنع القراية من السيرفر إنها تمسح تعديل لسه ما اترفعش
    save(LS_PRICES_DIRTY, true);
    if(!quiet) toast('⚠️ الأسعار اتحفظت على جهازك بس ما وصلتش للموزّعين: '
      + (err.message || err) + ' — هنحاول تاني تلقائي أول ما يرجع النت', 6000);
  }
  if(!quiet) busy(false);
  return ok;
}

/* ---------- غلافين بيتكرروا في كل مكان ---------- */

// غلاف شاشة الانتظار: شغّلها → اعمل الشغل → لو فشل قول السبب → اقفلها.
// ⚠️ كان مكتوب حرف بحرف في أربع دوال تصدير. نسيان busy(false) في واحدة معناها
// إن شاشة الانتظار تفضل مغطية التطبيق للأبد بعد أي خطأ.
async function withBusy_(msg, errPrefix, work){
  busy(true, msg);
  try{ await work(); }
  catch(err){ toast(errPrefix + (err.message || err)); }
  busy(false);
}

// بيحمّل أصناف الطلب من السيرفر (لو مش محمّلة) وبعدين ينفّذ الشغل عليها.
// ⚠️ كانت مكتوبة أربع مرات، وفي كل مرة نفس فحص «مفيش أصناف» — بس برسالتين
// مختلفتين. لو حد نسي الفحص، المستند بيتبني فاضي من غير ما حد يعرف ليه.
async function withOrderItems_(o, work){
  const err = await toggleOrderItemsLoadOnly_(o.id);
  const its = state.admin.items[o.id] || [];
  if(!its.length){
    // نفرّق بين «الطلب فاضي فعلاً» و«ما قدرناش نجيب أصنافه» — الرسالتين مختلفتين تمامًا
    toast(err ? ('تعذّر تحميل أصناف الطلب: ' + (err.message || err)) : 'مفيش أصناف في الطلب ده', err ? 4200 : undefined);
    return false;
  }
  await work(its);
  return true;
}

// بيفتح واتساب من غير رقم محدد — عكس تدفق العميل بالظبط، هنا المصنع هو اللي بيختار
// يبعت الصورة لمين (موزع/مجموعة/أي حد) بدل ما تتقفل على رقم ثابت.
function openWhatsAppFree(text){
  window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(text),'_blank');
}

// بيجهّز صورة الطلب من شاشة المصنع ويسيب المصنع يختار المستلم بنفسه (زرار "📤 إرسال" في كل كارت)
async function shareAdminOrderImage(o){
  await withOrderItems_(o, its => shareAdminOrderImageWith_(o, its));
}
async function shareAdminOrderImageWith_(o, its){
  const doc = buildAdminDocOrder_(o, its);
  const caption = 'طلب أوردر '+orderNoText_(o)+' — '+(o.dist||'');

  try{ await ensureLib_('html2canvas'); }
  catch(e){
    openWhatsAppFree(caption);
    toast('مفيش نت كفاية لتجهيز الصورة — هيتفتح واتساب بالنص بس');
    return;
  }
  busy(true,'جارٍ تجهيز صورة الطلب…');
  try{
    const {canvas} = await renderPaper_(docHTML(doc,'order'));
    const blob=await new Promise(res=>canvas.toBlob(res,'image/png',0.95));
    const file=new File([blob],'طلب_'+orderNoText_(o).replace('/','-')+'.png',{type:'image/png'});

    if(navigator.canShare && navigator.canShare({files:[file]})){
      // شاشة المشاركة الأصلية بتاعة الموبايل — يختار واتساب وبعدين الشخص/المجموعة بنفسه
      await navigator.share({files:[file], title:'طلب أوردر '+orderNoText_(o), text:caption});
    } else {
      downloadBlob(blob,'طلب_'+orderNoText_(o).replace('/','-')+'.png');
      openWhatsAppFree(caption);
      toast('اتحمّلت صورة الطلب — اختار واتساب والمستلم وارفقها');
    }
  }catch(err){
    if(err && err.name==='AbortError'){ busy(false); return; }
    toast('تعذّر تجهيز صورة الطلب — هيتفتح واتساب بالنص');
    openWhatsAppFree(caption);
  }
  busy(false);
}

function toggleOrderItemsLoadOnly_(id){
  // زي toggleOrderItems بس من غير ما يقفل القايمة لو مفتوحة أصلًا — مستخدمة قبل تصدير الـ PDF
  // ⚠️ الـcatch كان بيبلع الخطأ في صمت، فالمصنع كان بيتقاله «مفيش أصناف في الطلب
  // ده» وهو أصلًا النت اللي قطع — رسالة غلط بتخليه يفتكر إن الطلب فاضي فعلاً.
  // بنرجّع الخطأ عشان اللي نداها يقول السبب الحقيقي.
  return (async()=>{
    if(state.admin.items[id]) return null;
    state.admin.itemsLoading = id; render();
    let err = null;
    try{ await loadOrderItems_(id); }catch(e){ err = e; }
    state.admin.itemsLoading = null; render();
    return err;
  })();
}

// تقرير PDF شامل: كل الطلبات مقسّمة حسب المرحلة، كل طلب بتاريخه واسم صاحبه وأصنافه وكمياتها
// بيجمع الأصناف المتكررة (نفس الاسم/الكود/المقاس) في سطر واحد بكميتهم مجمّعة

// بيرجّع عرض الباب بالسم لو المقاس قياسي ("70 cm") عشان نقدر نجمّع بيه، أو null لو مقاس خاص/غير قياسي
function doorWidthGroup_(sizeStr){
  const m = /^(\d+)\s*cm$/.exec(String(sizeStr||'').trim());
  return m ? Number(m[1]) : null;
}


// تجميع أصناف كل الطلبات حسب النوع والكود — مرتّبة بالكمية تنازليًا.
// ⚠️ الكتلة دي كانت مكتوبة مرتين حرف بحرف: مرة في تقرير الـPDF ومرة في تقرير
// الإكسيل. أي تعديل على واحدة كان هيخلي التقريرين يدّوا أرقام مختلفة لنفس
// البيانات — والمصنع بيقارن بينهم.
function groupItemsByCode_(orders){
  const grand = {};
  (orders||[]).forEach(o=>(o.items||[]).forEach(it=>{
    if(isCutLine_(it)) return;        // بند تسعير — مش شغل إنتاج
    const key = it.type+'|'+(it.code||it.title||'')+(it.isSet?'|set':'');
    if(!grand[key]) grand[key] = { type:it.type, code:it.code||'', name:itemNameAr_(it), qty:0, produced:0, orderIds:new Set() };
    grand[key].qty += Number(it.qty)||0;
    grand[key].produced += itemProdPending_(it).produced;
    grand[key].orderIds.add(o.id);
  }));
  return Object.values(grand).sort((a,b)=>b.qty-a.qty);
}

// مواصفات الصنف زي ما بتتعرض في التقارير (عرض/ارتفاع الفتحة، الحلق، البرور).
// ⚠️ كانت مكتوبة مرتين حرف بحرف — في تقرير الـPDF وفي تقرير الإكسيل — فأي
// تعديل على واحدة كان بيخلي التقريرين يوصفوا نفس الصنف بشكلين مختلفين.
function itemSpecCells_(it){
  const wh = doorWH_(it.size, it.doorHeight);
  return {
    w: wh.w, h: wh.h,
    frameW: it.frame ? it.frame : '—',
    frameH: it.frame ? (it.frameHeight ? it.frameHeight : 'استاندر') : '—',
    bror:   it.dbror ? it.dbror : '—'
  };
}

// ============================================================
// تقرير الأبواب المعلّقة — كل عميل، كل طلب بتاريخه، الأبواب مقسّمة حسب المقاس
// (الطلبات المؤرشفة مستبعدة أصلًا من listWithItems؛ هنا كمان بنستبعد الملغي
//  والمُسلَّم — التقرير ده «اللي لسه ما اتسلّمش»، والمسلَّم اللي مااتأرشفش
//  بالغلط كان بيظهر فيه وكإنه لسه مطلوب)
// ============================================================
function buildPendingDoorsData_(orders){
  const pending = orders.filter(o=>o.status!=='Cancelled' && o.status!=='Delivered');
  const byCustomer = {}, order = [];
  pending.forEach(o=>{
    // التقرير ده للأبواب بس — الطلبات اللي مفيهاش أبواب (إكسسوارات أو حلق/برور فقط)
    // بتتشال من الأساس عشان ما تظهرش كعناوين فاضية بإجمالي صفر
    if(!(o.items||[]).some(it=>it.type==='Door')) return;
    // التجميع بقى على **صاحب الأوردر** — لو مفيش، بنرجع لصاحب الحساب
    const key = (o.customer && o.customer.trim()) || o.dist || '—';
    if(!byCustomer[key]){ byCustomer[key]=[]; order.push(key); }
    byCustomer[key].push(o);
  });
  return order.map(name=>{
    const ords = byCustomer[name];
    const perOrder = ords.map(o=>{
      const doorItems = (o.items||[]).filter(it=>it.type==='Door');
      const groups={};
      doorItems.forEach(it=>{
        const w = doorWidthGroup_(it.size);
        const key = w!=null ? String(w) : 'خاص';
        (groups[key]=groups[key]||[]).push(it);
      });
      const widths = Object.keys(groups).sort((a,b)=>{
        if(a==='خاص') return 1; if(b==='خاص') return -1; return Number(a)-Number(b);
      });
      return { id:o.id, date:o.date, customer:o.customer||'', phone:o.customerPhone||o.phone||'', groups, widths };
    });
    const total = ords.reduce((s,o)=>s+(o.items||[]).filter(it=>it.type==='Door').reduce((s2,it)=>s2+(Number(it.qty)||0),0),0);
    return { name, perOrder, total };
  }).filter(c=>c.total>0);   // عميل مالوش ولا باب واحد مايظهرش خالص
}

// عدد الأيام من تاريخ الطلب لحد النهاردة — بيتحسب من تاريخ الطلب (yyyy-MM-dd)

// نوتة صنف واحد: بتجمع معلومات الحلق الإضافي/البرور في سطر ملاحظات واحد — زي النموذج المطلوب بالظبط

// بيرجّع أصناف العميل مجمّعة (لو نفس الصنف اتكرر في أكتر من طلب، بيتجمعوا في سطر واحد بالكمية الإجمالية)
function mergedCustomerItems_(cust){
  const merged = {}, order = [];
  cust.perOrder.forEach(o=>{
    o.widths.forEach(w=>{
      o.groups[w].forEach(it=>{
        const frame = it.frame ? frameText_(it.frame, it.frameHeight) : '';
        const size = doorSizeText_(it.size || (w==='خاص'?'خاص':w+' سم'), it.doorHeight);
        const key = [it.code||'', size, frame, it.dbror||''].join('|');
        if(!merged[key]){
          const wh = doorWH_(it.size, it.doorHeight);
          merged[key] = {
            code:it.code||'', size, qty:0, produced:0, frame, dbror: it.dbror||'',
            w:wh.w, h:wh.h, frameW: it.frame||'', frameH: it.frame ? (it.frameHeight||'') : ''
          };
          order.push(key);
        }
        merged[key].qty += Number(it.qty)||0;
        merged[key].produced += itemProdPending_(it).produced;
      });
    });
  });
  return order.map(k=>merged[k]);
}

// ألوان مختلفة لكل عميل عشان جدوله يتفرّق بسرعة عن اللي قبله وبعده
const CUST_TINTS_ = [
  {line:'#1080C0', head:'#EAF2FA'},
  {line:'#C08A3E', head:'#FBF0E1'},
  {line:'#3E9B72', head:'#E7F5EE'},
  {line:'#7C63C4', head:'#F0EAFB'},

  {line:'#2C8FA3', head:'#E3F3F7'}
