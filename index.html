// ============================================================
// توزيع الرصيد على العملاء — بعد ما المصنع يسجّل رصيد المخزن، كل كود+مقاس بيتوزّع
// على الطلبات المعلّقة بالأقدم أول: العميل ياخد من المتاح لحد ما يخلص، واللي زاد عن
// الرصيد = المطلوب تصنيعه. المقاس الخاص مش متتبّع في المخزن فبيتصنّع كله.
// المطلوب = الكمية - الجاهز (نفس منطق «مطلوب لعملاء» في شاشة الأرصدة).
// ============================================================
function crDate354_(iso){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||''));return m?m[3]+'/'+m[2]+'/'+m[1].slice(2):'—';}
function buildAllocationData_(orders){
  const pending = (orders||[])
    .filter(o=>o.status!=='Cancelled' && o.status!=='Delivered')
    .slice()
    .sort((a,b)=> String(a.date||'').localeCompare(String(b.date||'')) || String(a.id||'').localeCompare(String(b.id||'')));
  const left = {}, avail = {}, cells = {}, custBy = {}, sizeSet = new Set(), codeSet = new Set(), dateBy = {};
  pending.forEach(o=>{
    const cust = String(o.customer||'').trim() || o.dist || '—';
    (o.items||[]).forEach(it=>{
      if(it.type!=='Door') return;
      // v327: الجاهز غير المسلَّم محسوب ضمن الرصيد الفعلي؛ يُوزَّع الرصيد على كامل المتبقي للتسليم (الأقدم أولاً) بلا خصم المنتَج مرتين
      const remain = Math.max(0, (Number(it.qty)||0));
      if(remain<=0) return;
      const code = String(it.code||'').trim() || '—';
      const w = doorWidthGroup_(it.size);
      const g = w!=null ? String(w) : 'خاص';
      let got = 0;
      if(w!=null){
        const sk = code+'|'+w;
        if(!(sk in left)){ left[sk] = Math.max(0, Number(stockFor(code, w))||0); avail[sk] = left[sk]; }
        got = Math.min(remain, left[sk]);
        left[sk] -= got;
      }
      { const dk = code+'|'+cust, dv = String(o.date||'').slice(0,10); if(dv && (!dateBy[dk] || dv<dateBy[dk])) dateBy[dk]=dv; }
      const ck = g+'|'+code+'|'+cust;
      const c = cells[ck] || (cells[ck] = {req:0, got:0, rem:0});
      c.req += remain; c.got += got; c.rem += remain-got;
      sizeSet.add(g); codeSet.add(code);
      const list = custBy[g] || (custBy[g] = []);
      if(!list.includes(cust)) list.push(cust);
    });
  });
  const sizes = [...sizeSet].sort((a,b)=> a==='خاص'?1 : b==='خاص'?-1 : Number(a)-Number(b));
  const idx = c=>{ const i = DOORS.findIndex(d=>d.code===c); return i<0 ? 999 : i; };
  const codes = [...codeSet].sort((a,b)=> idx(a)-idx(b) || a.localeCompare(b));
  const cell = (g,code,cust)=> cells[g+'|'+code+'|'+cust] || null;
  // إجمالي الكود في مقاس واحد (على كل العملاء)
  const sum = (g,code)=>{
    const t = {req:0, got:0, rem:0};
    (custBy[g]||[]).forEach(n=>{ const c = cell(g,code,n); if(c){ t.req+=c.req; t.got+=c.got; t.rem+=c.rem; } });
    return t;
  };
  const grand = {req:0, got:0, rem:0};
  sizes.forEach(g=>codes.forEach(c=>{ const s = sum(g,c); grand.req+=s.req; grand.got+=s.got; grand.rem+=s.rem; }));
  return { sizes, codes, custBy, cell, sum, grand, avail, pending, dateBy };
}

// بيحمّل الرصيد + الطلبات المعلّقة ويحسب التوزيع (null لو فيه مشكلة وفي toast بيوضّحها)
async function loadAllocData_(){
  const _aa=state.admin;
  if(_aa.custRem&&Date.now()-_aa.custRemAt<60000)return _aa.custRem;
  await loadStock(true);
  if(!state.stock.rows){ toast('تعذّر تحميل أرصدة المخزن'); return null; }
  const orders = await fetchPendingOrders_();
  if(!orders) return null;
  const d = buildAllocationData_(orders);
  if(!d.sizes.length){ toast('مفيش أبواب مطلوبة'); return null; }
  return d;
}

// الكودات اللي لسه عليها تصنيع (متبقي > 0 في أي مقاس) — للتقرير التاني
function allocToMakeCodes_(d){
  return d.codes.filter(c=>d.sizes.some(g=>d.sum(g,c).rem>0));
}

function allocBanner_(title, sub, statsHTML){
  return `<div style="display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#002050,#0B3A75);border-radius:14px;padding:16px 20px">
      <img src="${ASSETS.logo}" style="height:46px;width:auto;background:#fff;border-radius:8px;padding:3px">
      <div style="flex:1">
        <div style="font-size:19px;font-weight:700;color:#fff">${title}</div>
        <div style="font-size:11.5px;color:#B9CCE3;margin-top:3px">${sub}</div>
      </div>
      ${statsHTML}
    </div>`;
}

// ---------- تقرير ١: توزيع الرصيد على العملاء ----------
function allocCustomersHTML_(d){
  const now = new Date();
  const dateStr = now.toLocaleDateString('ar-EG');
  const timeStr = now.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
  const td = 'text-align:center;padding:7px 5px;border-bottom:1px solid #EEF1F4';
  const th = 'padding:6px 4px;color:#fff;font-weight:700;font-size:11.5px;border-left:1px solid rgba(255,255,255,.18)';
  const doorName = c=>{ const x = DOORS.find(y=>y.code===c); return x ? x.name : ''; };
  const num = (v,color)=> v==null ? '<span style="color:#B7C0CA">—</span>' : `<b style="color:${color}">${v}</b>`;
  const CH = 3;   // عدد العملاء في الجدول الواحد — أكتر من كده الصفحة بتزحم
  const blocks = [];
  d.sizes.forEach((g,gi)=>{
    const custs = d.custBy[g]||[];
    const codes = d.codes.filter(c=>custs.some(n=>d.cell(g,c,n)));
    const title = g==='خاص' ? 'مقاس خاص' : 'مقاس '+g+' سم';
    const gt = {req:0, got:0, rem:0};
    codes.forEach(c=>{ const s = d.sum(g,c); gt.req+=s.req; gt.got+=s.got; gt.rem+=s.rem; });
    const tint = CUST_TINTS_[gi % CUST_TINTS_.length];
    for(let i=0;i<custs.length;i+=CH){
      const part = custs.slice(i,i+CH);
      const rows = codes.map((c,ri)=>{
        const cs = part.map(n=>{
          const x = d.cell(g,c,n);
          return x
            ? `<td style="${td};font-weight:700;color:#233246">${x.req}</td><td style="${td}">${num(x.got, x.got>0?'#1E8E52':'#8A97A6')}</td><td style="${td}">${num(x.rem, x.rem>0?'#B3261E':'#1E8E52')}</td>`
            : `<td style="${td}"></td><td style="${td}"></td><td style="${td}"></td>`;
        }).join('');
        return `<tr style="background:${ri%2?'#FAFBFC':'#FFFFFF'}">
          <td style="${td};font-weight:700;color:#233246;text-align:right">${esc(c)} <span style="font-weight:400;color:#8A97A6;font-size:10.5px">${esc(doorName(c))}</span></td>${cs}</tr>`;
      }).join('');
      const tot = part.map(n=>{
        const t = {req:0, got:0, rem:0};
        codes.forEach(c=>{ const x = d.cell(g,c,n); if(x){ t.req+=x.req; t.got+=x.got; t.rem+=x.rem; } });
        return `<td style="${td};font-weight:700">${t.req}</td><td style="${td};font-weight:700;color:#1E8E52">${t.got}</td><td style="${td};font-weight:700;color:${t.rem>0?'#B3261E':'#1E8E52'}">${t.rem}</td>`;
      }).join('');
      const custHead = part.map(n=>`<th colspan="3" style="${th};font-size:12px;background:${tint.line}">${esc(n)}</th>`).join('');
      const subHead = part.map(()=>`<th style="${th}">مطلوب</th><th style="${th}">متاح</th><th style="${th}">متبقي له</th>`).join('');
      blocks.push(`<div class="rpt-cust-block keep-blk" style="margin-top:18px;border:1px solid #E3E7EC;border-radius:13px;overflow:hidden;break-inside:avoid;box-shadow:0 1px 4px rgba(20,36,58,.06)">
        <div style="font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg, ${tint.line}, ${tint.line}CC);padding:11px 16px;display:flex;align-items:center;justify-content:space-between">
          <span>${title}${i>0?' (تابع)':''}</span>
          <span style="font-size:11px;font-weight:400;opacity:.95">مطلوب ${gt.req} · متاح ${gt.got} · يتصنّع ${gt.rem}</span>
        </div>
        <div style="padding:10px 13px 13px">
          <table style="width:100%;border-collapse:collapse;font-size:12.5px">
            <thead>
              <tr style="background:#12314F"><th style="${th}"></th>${custHead}</tr>
              <tr style="background:#12314F"><th style="${th}">الكود</th>${subHead}</tr>
            </thead>
            <tbody>${rows}
              <tr style="background:${tint.head}"><td style="${td};font-weight:700;text-align:right">الإجمالي</td>${tot}</tr>
            </tbody>
          </table>
        </div>
      </div>`);
    }
  });
  const stats = `<div style="text-align:left;border-right:1px solid rgba(255,255,255,.25);padding-right:16px">
      <div style="font-size:10px;color:#B9CCE3">يتصنّع</div>
      <div style="font-size:22px;font-weight:700;color:#fff">${d.grand.rem}</div>
      <div style="font-size:9.5px;color:#B9CCE3;margin-top:1px">مطلوب ${d.grand.req} · متاح ${d.grand.got}</div>
    </div>`;
  return `<div style="font-family:Arial,'Helvetica Neue',sans-serif;direction:rtl;background:#fff;padding:32px 28px;color:#14243A;">
    ${allocBanner_('توزيع الرصيد على العملاء', esc(COMPANY_AR)+'  •  '+dateStr+' — الساعة '+timeStr+'  •  الأقدم أول', stats)}
    ${blocks.join('')}
  </div>`;
}

// ---------- تقرير ٢: الأبواب المطلوب تصنيعها ----------
function allocDoorsHTML_(d){
  const now = new Date();
  const dateStr = now.toLocaleDateString('ar-EG');
  const timeStr = now.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
  const td = 'text-align:center;padding:8px 6px;border-bottom:1px solid #EEF1F4';
  const th = 'padding:7px 6px;color:#fff;font-weight:700;border-left:1px solid rgba(255,255,255,.18)';
  const doorName = c=>{ const x = DOORS.find(y=>y.code===c); return x ? x.name : ''; };
  const codes = allocToMakeCodes_(d);
  const colTot = {};
  let all = 0;
  const rows = codes.map((c,ri)=>{
    let rowTot = 0;
    const cs = d.sizes.map(g=>{
      const r = d.sum(g,c).rem;
      rowTot += r; colTot[g] = (colTot[g]||0) + r;
      return `<td style="${td};font-weight:700;font-size:13px;color:${r>0?'#B3261E':'#B7C0CA'}">${r>0?r:'—'}</td>`;
    }).join('');
    all += rowTot;
    return `<tr style="background:${ri%2?'#FAFBFC':'#FFFFFF'}">
      <td style="${td};font-weight:700;color:#233246;text-align:right">${esc(c)} <span style="font-weight:400;color:#8A97A6;font-size:11px">${esc(doorName(c))}</span></td>
      ${cs}<td style="${td};font-weight:700;font-size:13px;background:#F0F4F8;color:#002050">${rowTot}</td></tr>`;
  }).join('');
  const head1 = d.sizes.map(g=>`<th style="${th}">${g==='خاص'?'مقاس خاص':g}</th>`).join('');
  const head2 = d.sizes.map(()=>`<th style="${th};font-size:11px;font-weight:400">مطلوب</th>`).join('');
  const totRow = d.sizes.map(g=>`<td style="${td};font-weight:700;font-size:13px">${colTot[g]||0}</td>`).join('');
  const stats = `<div style="text-align:left;border-right:1px solid rgba(255,255,255,.25);padding-right:16px">
      <div style="font-size:10px;color:#B9CCE3">إجمالي المطلوب تصنيعه</div>
      <div style="font-size:22px;font-weight:700;color:#fff">${all}</div>
    </div>`;
  return `<div style="font-family:Arial,'Helvetica Neue',sans-serif;direction:rtl;background:#fff;padding:32px 28px;color:#14243A;">
    ${allocBanner_('الأبواب المطلوب تصنيعها', esc(COMPANY_AR)+'  •  '+dateStr+' — الساعة '+timeStr+'  •  بعد خصم رصيد المخزن', stats)}
    <div style="margin-top:18px;border:1px solid #E3E7EC;border-radius:13px;overflow:hidden;box-shadow:0 1px 4px rgba(20,36,58,.06)">
      <div style="padding:10px 13px 13px">
        <table style="width:100%;border-collapse:collapse;font-size:12.5px">
          <thead>
            <tr style="background:#12314F"><th style="${th}"></th><th colspan="${d.sizes.length}" style="${th};text-align:center">المقاس (سم)</th><th style="${th}"></th></tr>
            <tr style="background:#12314F"><th style="${th}">الكود</th>${head1}<th style="${th}">الإجمالي</th></tr>
            <tr style="background:#1B4A78"><th style="${th};font-weight:400;font-size:10px"></th>${head2}<th style="${th}"></th></tr>
          </thead>
          <tbody>${rows}
            <tr style="background:#EAF2FA"><td style="${td};font-weight:700;text-align:right">الإجمالي</td>${totRow}<td style="${td};font-weight:700;font-size:14px;color:#B3261E">${all}</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>`;
}

  if(!await needLibs_('html2canvas','jspdf')) return;
  const {canvas, breaksPx} = await renderPaper_(allocCustomersHTML_(d));
  await canvasToPdf_(canvas, 'توزيع_الرصيد_على_العملاء_'+isoLocal_()+'.pdf', { hardBreaksPx: breaksPx });
}
async function buildAllocDoorsPdf_(d){
  if(!allocToMakeCodes_(d).length){ toast('كل المطلوب متاح في المخزن — مفيش حاجة تتصنّع'); return; }
  if(!await needLibs_('html2canvas','jspdf')) return;
  const {canvas} = await renderPaper_(allocDoorsHTML_(d));
  await canvasToPdf_(canvas, 'الأبواب_المطلوب_تصنيعها_'+isoLocal_()+'.pdf');
}

// إكسيل ١: نفس شكل الشيت — صفوف الأكواد، وفوق كل مقاس العملاء، وتحت كل عميل (مطلوب/متاح/متبقي له)
async function buildAllocCustomersExcel_(d){
  if(!await needLibs_('exceljs')) return;
  const NAVY='FF002050', WHITE='FFFFFFFF', BORDER_CLR='FFDCE4EC';
  const thin = {style:'thin', color:{argb:BORDER_CLR}};
  const border = {top:thin,left:thin,right:thin,bottom:thin};
  const GRP_FILL = ['FF1080C0','FFC08A3E','FF3E9B72','FF7C63C4','FFC25454','FF2C8FA3'];
  const GRP_TINT = ['FFEAF2FA','FFFBF0E1','FFE7F5EE','FFF0EAFB','FFFBE7E7','FFE3F3F7'];

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('توزيع الرصيد على العملاء', { views:[{ rightToLeft:true, state:'frozen', xSplit:1, ySplit:5 }], pageSetup:{ orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0 } });

  // أعمدة: ١ = الكود، وبعدها لكل مقاس → لكل عميل ٣ أعمدة
  const groups = [];   // {g, gi, n, c}
  let col = 2;
  d.sizes.forEach((g,gi)=>(d.custBy[g]||[]).forEach(n=>{ groups.push({g, gi, n, c:col}); col += 3; }));
  const lastCol = col-1;
  ws.getColumn(1).width = 14;
  for(let c=2;c<=lastCol;c++) ws.getColumn(c).width = 10;

  const now = new Date();
  const dateTimeStr = now.toLocaleDateString('ar-EG') + ' — الساعة ' + now.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
  const style = (cell, fill, font, bold, size)=>{
    if(fill) cell.fill = {type:'pattern',pattern:'solid',fgColor:{argb:fill}};
    cell.font = {bold:!!bold, color:{argb:font||'FF14243A'}, size:size||11, name:'Arial'};
    cell.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
    cell.border = border;
  };

  ws.mergeCells(1,1,1,Math.max(lastCol,2));
  ws.getCell(1,1).value = 'توزيع الرصيد على العملاء  —  '+dateTimeStr;
  style(ws.getCell(1,1), NAVY, WHITE, true, 13);
  ws.getCell(1,1).alignment = {horizontal:'right', vertical:'middle'};
  ws.getRow(1).height = 22;

  // صف ٣: المقاس، صف ٤: العميل، صف ٥: مطلوب/متاح/متبقي له
  style(ws.getCell(3,1), NAVY, WHITE, true); ws.getCell(3,1).value = 'المقاس';
  style(ws.getCell(4,1), NAVY, WHITE, true);
  style(ws.getCell(5,1), NAVY, WHITE, true); ws.getCell(5,1).value = 'الكود';
  d.sizes.forEach((g,gi)=>{
    const gs = groups.filter(x=>x.g===g);
    if(!gs.length) return;
    const c1 = gs[0].c, c2 = gs[gs.length-1].c+2;
    ws.mergeCells(3,c1,3,c2);
    ws.getCell(3,c1).value = g==='خاص' ? 'مقاس خاص' : 'مقاس '+g;
    for(let c=c1;c<=c2;c++) style(ws.getCell(3,c), GRP_FILL[gi%GRP_FILL.length], WHITE, true, 12);
  });
  groups.forEach(x=>{
    ws.mergeCells(4,x.c,4,x.c+2);
    ws.getCell(4,x.c).value = x.n;
    for(let c=x.c;c<=x.c+2;c++) style(ws.getCell(4,c), GRP_TINT[x.gi%GRP_TINT.length], 'FF14243A', true);
    ['مطلوب','متاح','متبقي له'].forEach((t,k)=>{ ws.getCell(5,x.c+k).value = t; style(ws.getCell(5,x.c+k), 'FFE9EEF4', 'FF14243A', true, 10); });
  });

  const tot = {};   // إجمالي كل عمود
  d.codes.forEach(code=>{
    const r = ws.addRow([code]);
    style(r.getCell(1), null, 'FF14243A', true); r.getCell(1).alignment = {horizontal:'right', vertical:'middle'};
    groups.forEach(x=>{
      const v = d.cell(x.g, code, x.n);
      for(let k=0;k<3;k++) style(r.getCell(x.c+k), null, 'FF14243A', k===0);
      if(!v) return;
      const vals = [v.req, v.got, v.rem];
      vals.forEach((val,k)=>{
        r.getCell(x.c+k).value = val;
        tot[x.c+k] = (tot[x.c+k]||0) + val;
      });
      r.getCell(x.c+1).font = {bold:true, color:{argb: v.got>0 ? 'FF1E8E52' : 'FF8A97A6'}, size:11, name:'Arial'};
      r.getCell(x.c+2).font = {bold:true, color:{argb: v.rem>0 ? 'FFB3261E' : 'FF1E8E52'}, size:11, name:'Arial'};
    });
  });
  const tr = ws.addRow(['الإجمالي']);
  style(tr.getCell(1), 'FFE9EEF4', 'FF002050', true);
  for(let c=2;c<=lastCol;c++){ tr.getCell(c).value = tot[c]||0; style(tr.getCell(c), 'FFE9EEF4', 'FF002050', true); }

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const fname = 'توزيع_الرصيد_على_العملاء_'+isoLocal_()+'.xlsx';
  await shareOrDownload_(blob, fname, fname);
}

// إكسيل ٢: صفوف الأكواد × المقاسات (70/80/90/100/خاص) — «مطلوب» = اللي يتصنّع بعد خصم الرصيد
async function buildAllocDoorsExcel_(d){
  const codes = allocToMakeCodes_(d);
  if(!codes.length){ toast('كل المطلوب متاح في المخزن — مفيش حاجة تتصنّع'); return; }
  if(!await needLibs_('exceljs')) return;
  const NAVY='FF002050', WHITE='FFFFFFFF', BORDER_CLR='FFDCE4EC';
  const thin = {style:'thin', color:{argb:BORDER_CLR}};
  const border = {top:thin,left:thin,right:thin,bottom:thin};
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('المطلوب تصنيعه', { views:[{ rightToLeft:true, state:'frozen', xSplit:1, ySplit:3 }], pageSetup:{ orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0 } });
  const n = d.sizes.length;
  ws.getColumn(1).width = 14;
  for(let c=2;c<=n+2;c++) ws.getColumn(c).width = 12;
  const style = (cell, fill, font, bold, size)=>{
    if(fill) cell.fill = {type:'pattern',pattern:'solid',fgColor:{argb:fill}};
    cell.font = {bold:!!bold, color:{argb:font||'FF14243A'}, size:size||11, name:'Arial'};
    cell.alignment = {horizontal:'center', vertical:'middle'};
    cell.border = border;
  };
  const now = new Date();
  ws.mergeCells(1,1,1,n+2);
  ws.getCell(1,1).value = 'الأبواب المطلوب تصنيعها  —  ' + now.toLocaleDateString('ar-EG') + ' — الساعة ' + now.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
  style(ws.getCell(1,1), NAVY, WHITE, true, 13);
  ws.getCell(1,1).alignment = {horizontal:'right', vertical:'middle'};
  ws.getRow(1).height = 22;
  // صف ٢: المقاس، صف ٣: «مطلوب»
  ws.getCell(2,1).value = 'المقاس'; style(ws.getCell(2,1), NAVY, WHITE, true);
  ws.getCell(3,1).value = 'الكود';  style(ws.getCell(3,1), NAVY, WHITE, true);
  d.sizes.forEach((g,i)=>{

function allocCustByCodeHTML_(d){
  const now = new Date();

  const timeStr = now.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});

  const doorName = c=>{ const x = DOORS.find(y=>y.code===c); return x ? x.name : ''; };
  const custsOfCode = c=>{
    const list = [];
    d.sizes.forEach(g=>(d.custBy[g]||[]).forEach(n=>{ const x=d.cell(g,c,n); if(!list.includes(n) && x && x.rem>0) list.push(n); }));

  };

    const rows = custs.map((n,ri)=>{

        const v = x ? x.rem : 0;
        return `<td style="${td};font-weight:700;color:${v>0?'#233246':'#B7C0CA'}">${v>0?v:'—'}</td>`;
      }).join('');

    return `<div class="rpt-cbc-block keep-blk" style="margin-top:9px;border:1px solid #E3E7EC;border-radius:12px;overflow:hidden;break-inside:avoid;box-shadow:0 1px 4px rgba(20,36,58,.06)">
      <div style="background:${dsw?dsw.bg:'#12314F'};color:${dsw?'#3D2E17':'#fff'};font-weight:700;font-size:13px;padding:6px 10px;${dsw?`border-bottom:2px solid ${dsw.border};`:''}">
        <span>${esc(c)} <span style="font-weight:400;color:${dsw?'rgba(61,46,23,.72)':'#B9CCE3'};font-size:11px">${esc(doorName(c))}</span></span>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:12.5px">
        <thead><tr style="background:#1B4A78">
          <th style="${th};text-align:right">المتبقي للعملا</th>
          ${d.sizes.map(g=>`<th style="${th};width:64px">${g==='خاص'?'مقاس خاص':g}</th>`).join('')}
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }).join('');
  return `<div style="font-family:Arial,'Helvetica Neue',sans-serif;direction:rtl;background:#fff;padding:14px 12px;color:#14243A;">
    ${allocBanner_('المتبقي للعملاء حسب الكود', esc(COMPANY_AR)+'  •  '+dateStr+' — الساعة '+timeStr+'  •  بعد خصم رصيد المخزن — الأقدم أول', '')}
    ${blocks}
  </div>`;
}

// بيجيب بيانات الطلبات المعلّقة بالتفصيل من السيرفر — مشتركة بين التلات أزرار التصدير
async function fetchPendingOrders_(){
  if(!APPS_SCRIPT_URL || !state.admin.pw) return null;
  const d = await jsonp(APPS_SCRIPT_URL + '?action=listWithItems' + admParams_());
  if(!d || !d.ok) throw new Error((d && d.error) || 'رد غير متوقع');
  const orders = applyReceived_(excludeSuperseded_(d.orders || []));
  if(!orders.length){ toast('مفيش طلبات لسه'); return null; }
  return orders;
}

// كل التقارير بتحسب على «المتبقي للعميل»: لو استلم جزء من صنف، الكمية بتنقص بالمستلم،
// والجاهز بينقص بيه برضه (اللي استلمه كان جاهز أصلًا). الصنف اللي اتسلّم كله بيختفي.
// الطلب نفسه (مستنده وكارته في الشاشة) بيفضل بالكمية الأصلية — ده للتقارير بس.
function applyReceived_(orders){
  return (orders||[]).map(o=>{
    if(!o.items || !o.items.some(it=>Number(it.received)>0)) return o;
    const items = [];
    o.items.forEach(it=>{
      const q0 = Number(it.qty)||0;
      const rec = Math.max(0, Math.min(q0, Number(it.received)||0));
      if(!rec){ items.push(it); return; }
      const qty = q0 - rec;
      if(qty<=0) return;
      const produced = Math.max(0, Math.min(qty, (Number(it.produced)||0) - rec));
      items.push({...it, qty, produced, orderedQty:q0});
    });
    return {...o, items};
  });
}

// معاينة طلب العميل على الشاشة — نفس اللي بيطلع في الـ PDF بالظبط، بس من غير
// html2canvas ولا jsPDF خالص. فبتفتح فورًا (بدل ثواني تجهيز الـ PDF)، والمصنع
// يقدر يراجع الطلب وياخد قراره، ولو عايز الملف يضغط «تصدير PDF» من جوه المعاينة.
// ⚠️ النسخة الأولى من المعاينة كانت بطيئة جدًا وأحيانًا ماكانتش بتفتح خالص، لسببين:
//   ١) كانت بتنده loadStock(true) — والمستند ده مابيستخدمش الأرصدة أصلًا، نداء ملهوش لازمة
//   ٢) كانت بتنده fetchPendingOrders_() اللي بتجيب **كل** الطلبات بكل أصنافها من السيرفر
//      (listWithItems)، مع إن بيانات الطلبات موجودة قدامنا في الشاشة أصلًا.
// يعني نداءين تقال قبل ما أي حاجة تظهر، وأي واحد فيهم يفشل = المعاينة ما تفتحش.
//
// دلوقتي: بيانات الطلب بتتاخد من الشاشة على طول، والأصناف من الكاش لو محمّلة قبل كده
// (لو المصنع فتح «الأصناف» للطلب)، وإلا بنجيب أصناف الطلبات دي بس — نداء صغير لكل
// طلب بدل نداء واحد ضخم بكل طلبات المصنع.
function previewWait295_(work, ms=65000){
  let timer;
  return Promise.race([work, new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('المعاينة اتأخرت. البيانات محفوظة، جرّب العدسة تاني لما الاتصال يستقر')),ms);})]).finally(()=>clearTimeout(timer));
}

/* ⚠️ الأصناف الراجعة من الشيت لسه فيها الأكواد القديمة (A015) — والكود ده
   بيتعرض زي ما هو في شاشة المصنع وفي الإكسل والتقارير، وبيدخل في مفاتيح
   التجميع وفي فحص المتوفر بالمخزن. يعني من غير تطبيع هنا:
     • المصنع يشوف «A015» على طلبات قديمة و«A013» على الجديدة لنفس الباب.
     • التقرير الشامل يعدّهم صنفين منفصلين.
     • فحص المتوفر يدوّر على رصيد A015 وهو متسجّل على A013.
   بنطبّعهم مرة واحدة عند الاستقبال — وكل اللي بعده بياخد الكود الجديد.
   (والسيرفر بيطبّع كمان وقت مطابقة الصنف، فالتعديل والحذف على السطور
   القديمة فاضلين شغّالين.) */
function normalizeItems_(list){
  (list || []).forEach(it=>{ if(it && it.code) it.code = doorCode_(it.code); });
  return list || [];
}

// بتجيب أصناف طلب واحد وتكاشهم. بترجّع من غير أي نداء لو محمّلين خلاص.
const LS_ADM_ITEMS = 'wpc_adm_items_v1';
function loadAdmItemsCache_(){
  try{
    const c = JSON.parse(localStorage.getItem(LS_ADM_ITEMS)||'null');
    if(c && c.items && (Date.now()-(c.at||0)) < 7*24*3600*1000) return c.items;
  }catch(e){}
  return {};
}
function saveAdmItemsEntry_(id, items){
  try{
    const all = loadAdmItemsCache_();
    all[id] = items;
    // سقف حجم: لو التخزين مليان بنرمي الأقدم إدخالًا بدل ما يفشل الحفظ كله
    const keys = Object.keys(all);
    if(keys.length > 300) keys.slice(0, keys.length-300).forEach(k=>delete all[k]);
    localStorage.setItem(LS_ADM_ITEMS, JSON.stringify({at:Date.now(), items:all}));
  }catch(e){}
}
function deleteAdmItemsEntry_(id){
  try{
    const all = loadAdmItemsCache_();
    if(id in all){ delete all[id]; localStorage.setItem(LS_ADM_ITEMS, JSON.stringify({at:Date.now(), items:all})); }
  }catch(e){}
}
async function loadOrderItems_(id){
  if(state.admin.items[id]) return state.admin.items[id];
  let d = null;
  try{
    d = await jsonp(APPS_SCRIPT_URL
      + '?action=orderItems' + admParams_()
      + '&id=' + encodeURIComponent(id));
  }catch(e){
    // النت فاصل: النسخة المحفوظة من آخر تحميل ناجح أحسن من رسالة فشل — بشرط وجودها
    const c = loadAdmItemsCache_()[id];
    if(c){ state.admin.items[id] = c; return c; }
    throw e;
  }
  if(d && d.ok){
    state.admin.items[id] = normalizeItems_(d.items);
    saveAdmItemsEntry_(id, state.admin.items[id]);
  }
  return state.admin.items[id] || [];
}

// أصناف كذا طلب في نداء واحد.
// ⚠️ المعاينة والتصدير لعميل كانوا بيبعتوا نداء لكل طلب، و Apps Script بينفّذ
// نداءات نفس المستخدم واحد ورا التاني — يعني الانتظار بيتضاعف بعدد الطلبات.
// نداء واحد بكل المعرّفات = تنفيذ واحد وقراية واحدة للشيت.
// بنقسّمهم على دفعات عشان الرابط ما يطولش أوي.
async function loadOrderItemsMany_(ids){
  const ناقص = ids.filter(id => !state.admin.items[id]);
  for(let i = 0; i < ناقص.length; i += 12){
    const دفعة = ناقص.slice(i, i + 12);
    try{
      const d = await jsonp(APPS_SCRIPT_URL
        + '?action=orderItems' + admParams_()
        + '&ids=' + encodeURIComponent(دفعة.join(',')));
      if(d && d.ok && d.itemsById){
        دفعة.forEach(id => { if(d.itemsById[id]){ state.admin.items[id] = normalizeItems_(d.itemsById[id]); saveAdmItemsEntry_(id, state.admin.items[id]); } });
      }
    }catch(e){
      // النت فاصل: حمّل اللي متخزّن محليًا من الدفعة دي
      دفعة.forEach(id => { if(!state.admin.items[id]){ const c = loadAdmItemsCache_()[id]; if(c) state.admin.items[id] = c; } });
    }
    // أي طلب ما رجعش في الرد (سيرفر قديم مثلًا) بنجيبه لوحده
    for(const id of دفعة){
      if(!state.admin.items[id]){ try{ await loadOrderItems_(id); }catch(e){} }
    }
  }
}

// بتعرض HTML التقرير في طبقة فوق الشاشة، مصغّر ليدخل في عرض الموبايل.
// التقرير مرسوم بعرض A4 ثابت (794 بكسل)، فبنعمله scale حسب عرض الشاشة
// عشان يتقري من غير تمرير أفقي.
function showReportPreview_(html, title, orderId, pdfKind){
  const old = document.getElementById('reportPreviewOverlay'); if(old) old.remove();
  const ov = document.createElement('div');
  ov.id = 'reportPreviewOverlay';
  ov.className = 'rpv';
  ov.innerHTML = `
    <div class="rpv-bar">
      <b>معاينة — ${esc(title||'')}</b>
      
      <button class="rpv-pdf" data-act="rpv-pdf" data-name="${esc(title||'')}"${orderId?` data-id="${esc(orderId)}"`:''}${pdfKind?` data-kind="${esc(pdfKind)}"`:''}>${ico('doc')}تصدير PDF</button>
      <button class="rpv-x" data-act="rpv-close" aria-label="إغلاق المعاينة">${ico('x')}</button>
    </div>
    <div class="rpv-scroll"><div class="rpv-fit"><div class="rpv-page">${html}</div></div></div>`;
  document.body.appendChild(ov);

  // نظبط التصغير حسب عرض الشاشة
  const fit = () => {
    const page = ov.querySelector('.rpv-page');
    const fitBox = ov.querySelector('.rpv-fit');
    const wrap = ov.querySelector('.rpv-scroll');
    if(!page || !fitBox || !wrap) return;
    const natural = 794;                        // نفس عرض #paper — مثبّت في الـ CSS
    const avail = Math.max(200, wrap.clientWidth - 16);
    const k = Math.min(1, avail / natural);
    page.style.transform = k < 1 ? 'scale(' + k + ')' : 'none';
    fitBox.style.width  = Math.round(natural * k) + 'px';
    fitBox.style.height = Math.round(page.offsetHeight * k) + 'px';
  };
  requestAnimationFrame(()=>{ fit(); setTimeout(fit, 250); });   // تاني مرة بعد ما الصور تتحمّل
  ov._fit = fit;
  window.addEventListener('resize', fit);

  // الضغط في أي مكان فاضي بره الورقة بيقفل — منطقة التمرير بتملى الشاشة،
  // فلازم نحسبها هي كمان مش الطبقة الخارجية بس.
  ov.addEventListener('click', e=>{
    if(e.target===ov || e.target.classList.contains('rpv-scroll')) closeReportPreview_();
  });
}

function closeReportPreview_(){
  const ov = document.getElementById('reportPreviewOverlay');
  if(!ov) return;
  if(ov._fit) window.removeEventListener('resize', ov._fit);
  ov.remove();
}

// بيبني مستندات طلبات عميل واحد بصيغة eco (بدون صور الأبواب) — أساس المعاينة
// والـ PDF والصورة. بيرمي خطأ برسالة واضحة لو أصناف أي طلب مااتحمّلتش.
async function buildCustomerDocsEco_(name){
  const a=state.admin;
  const list=(a.viewArchive?a.archRows:a.rows)||[];
  const mine=list.filter(o=>(String(o.customer||'').trim()||'بدون اسم')===name);
  if(!mine.length) return null;
  await loadOrderItemsMany_(mine.map(o=>o.id));
  const docs=mine.map(o=>{
    const its=a.items[o.id];
    if(!Array.isArray(its)||!its.length) throw new Error('تعذّر تحميل أصناف الطلب '+orderNoText_(o));
    return buildAdminDocOrder_(o,its);
  });
  await Promise.all(docs.map(doc=>preparePrintDocument_(doc,{preview:true,skipArt:true})));
  // غلّاف واحد حوالين كل المستندات — renderPaper_ بيقيس firstElementChild،
  // فمن غير الغلاف كان بيرسم أول طلب بس والباقي يتقصّ من الملف.
  return '<div>'+docs.map(doc=>docHTML(doc,'order',undefined,true)).join('<div style="height:18px"></div>')+'</div>';
}

// ============================================================
// تصدير إكسيل — تقرير الطلبات (شاشة المصنع) — منظّم بالعربي، مجمّع لكل عميل
// بنفس روح تصميم تقرير الأبواب المعلّقة/الـ PDF الشامل (لوجو + ألوان + عناوين عربي)
// ============================================================
const ITEM_TYPE_AR_ = { 'Door':'باب', 'Frame':'حلق', 'Bror':'برور', 'Mabra':'معبرة', 'Panel':'لوح بروديوم', 'Strip':'شريط', 'Veneer':'قشرة' };
function itemTypeAr_(t){ return ITEM_TYPE_AR_[t] || 'إكسسوار'; }
function itemUnitAr_(u){
  const s = String(u||'').trim();
  if(s==='door') return 'باب';
  if(s==='pc') return 'قطعة';
  // السطر المدموج فيه أعواد بأطوال مختلفة — مالوش طول واحد يتكتب جنب الوحدة،
  // الأطوال مكتوبة في وصف الصنف نفسه.
  if(s==='rods') return 'عود';
  // ⚠️ كانت بترجّع «عود 220cmم»: الـcm مابتتشالش و«م» بتتزاد عليها.
  // ده بيبان للمصنع في كشف الإكسل وفي وحدة كل صنف.
  const rod = /^rod\s+(.+)$/i.exec(s);
  if(rod) return 'عود ' + rod[1].replace(/\s*cm\s*$/i, '') + ' سم';
  return s || '—';
}
// لو الصنف باب معروف (كود من A01..A10) بنرجّع اسمه العربي بدل الاعتماد على النص الإنجليزي المخزّن
function itemNameAr_(it){
  if(it.type==='Door'){
    const d = DOORS.find(x=>x.code===doorCode_(it.code));
    if(d) return 'باب '+d.name+' — '+it.code;
  }
  return it.title || it.code || '—';
}

function buildAdminOrdersDetail_(orders){
  const byCustomer = {}, order = [];
  orders.forEach(o=>{
    const key = o.dist || '—';
    if(!byCustomer[key]){ byCustomer[key]=[]; order.push(key); }
    byCustomer[key].push(o);
  });
  return order.map(name=>{
    const ords = byCustomer[name];
    const codeTotals = {}; // key: type+code -> {label, qty}
    let clientQty = 0, clientProduced = 0;
    ords.forEach(o=>(o.items||[]).forEach(it=>{
      if(isCutLine_(it)) return;      // بند تسعير — مش شغل إنتاج
      const qty = Number(it.qty)||0;
      const pp = itemProdPending_(it);
      clientQty += qty; clientProduced += pp.produced;
      const key = it.type+'|'+(it.code||it.title||'')+(it.isSet?'|set':'');
      if(!codeTotals[key]) codeTotals[key] = { type:it.type, code:it.code||'', name:itemNameAr_(it), qty:0, produced:0 };
      codeTotals[key].qty += qty;
      codeTotals[key].produced += pp.produced;
    }));
    return { name, orders:ords, clientQty, clientProduced, clientPending: clientQty-clientProduced, codeTotals: Object.values(codeTotals).sort((a,b)=>b.qty-a.qty) };
  });
}

async function buildAdminOrdersExcel_(orders){
  orders = (orders||[]).filter(o=>o.status!=='Cancelled');   // v330: الملغي مايدخلش الإجماليات
  if(!orders.length){ toast('مفيش طلبات'); return; }
  if(!await needLibs_('exceljs')) return;

  // أبواب بس — زي الـ PDF بالظبط: بنشيل الإكسسوارات والحلق/البرور المنفصلين،
  // وأي طلب مابقاش فيه ولا باب بيتشال بالكامل من التلات شيتات.
  orders = orders
    .map(o=>Object.assign({}, o, { items:(o.items||[]).filter(it=>it.type==='Door') }))
    .filter(o=>(o.items||[]).length);
  if(!orders.length){ toast('مفيش أبواب في الطلبات الحالية'); return; }

  // عمود "ارتفاع الحلق" شرطي على مستوى المصنَّف كله (زي docHTML/reportHTML) — يظهر بس لو صنف باب
  // واحد على الأقل في كل الطلبات متسجّل له عرض حلق + ارتفاع حلق مع بعض.
  const showFrameHCol = orders.some(o=>(o.items||[]).some(it=>it.frame && it.frameHeight));

  busy(true,'جارٍ تجهيز الإكسيل…');

  const NAVY='FF002050', BRAND='FF1080C0', LIGHT='FFEAF2FA', WHITE='FFFFFFFF',
        BORDER_CLR='FFDCE4EC', ZEBRA='FFF7FAFC';
  const thin = {style:'thin', color:{argb:BORDER_CLR}};
  const border = {top:thin,left:thin,right:thin,bottom:thin};
  const FONT='Arial';

  const wb = new ExcelJS.Workbook();
  wb.creator = COMPANY_AR;
  wb.created = new Date();

  let logoImgId = null;
  try{ const lb64 = await logoBase64_(); if(lb64) logoImgId = wb.addImage({ base64: lb64, extension:'png' }); }catch(e){}

  function addHeaderBand_(ws, lastCol, title, subtitle){
    ws.mergeCells(1,1,3,1);
    ws.getRow(1).height = 26; ws.getRow(2).height = 20; ws.getRow(3).height = 18;
    if(logoImgId){ ws.addImage(logoImgId, { tl:{col:0.15, row:0.15}, ext:{width:58, height:58} }); }
    ws.mergeCells(1,2,1,lastCol);
    const tCell = ws.getCell(1,2);
    tCell.value = title;
    tCell.font = {bold:true, size:16, color:{argb:NAVY}, name:'Arial'};
    tCell.alignment = {horizontal:'right', vertical:'middle'};
    ws.mergeCells(2,2,2,lastCol);
    const sCell = ws.getCell(2,2);
    sCell.value = subtitle;
    sCell.font = {size:10.5, color:{argb:'FF6B7A8C'}, name:'Arial'};
    sCell.alignment = {horizontal:'right', vertical:'middle'};
    ws.mergeCells(3,2,3,lastCol);
    ws.getCell(3,2).border = {bottom:{style:'medium', color:{argb:BRAND}}};
    ws.getCell(3,1).border = {bottom:{style:'medium', color:{argb:BRAND}}};
    return 4;
  }

  // ---------- ورقة 1: ملخص الطلبات ----------
  const wsSum = wb.addWorksheet('ملخص الطلبات', { views:[{ rightToLeft:true }] });
  wsSum.columns = [
    {width:4},{key:'id',width:14},{key:'date',width:12},{key:'dist',width:22},
    {key:'customer',width:22},{key:'custRegion',width:18},
    {key:'phone',width:14},{key:'region',width:13},{key:'wh',width:12},
    {key:'status',width:15},{key:'qty',width:10},{key:'produced',width:9},{key:'pending',width:9}
  ];
  const sumLastCol = 13;
  addHeaderBand_(wsSum, sumLastCol, 'تقرير الأبواب', COMPANY_AR+' — '+new Date().toLocaleDateString('ar-EG')+' — إجمالي الطلبات: '+orders.length);
  wsSum.addRow([]);
  const hdrSum = wsSum.addRow(['','رقم الطلب','التاريخ','صاحب الحساب','صاحب الأوردر','عنوان العميل','الهاتف','المنطقة','المخزن','الحالة','إجمالي الكمية','جاهز','متبقي']);
  hdrSum.eachCell((c,i)=>{ if(i===1) return; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:NAVY}}; c.font={bold:true,color:{argb:WHITE},name:FONT,size:10.5}; c.alignment={horizontal:'center',vertical:'middle'}; c.border=border; });
  hdrSum.height = 22;
  wsSum.views = [{ rightToLeft:true, state:'frozen', ySplit:hdrSum.number }];

  let grandQty = 0, grandProducedSum = 0;
  orders.forEach((o,idx)=>{
    const qty = (o.items||[]).reduce((s,it)=>s+(Number(it.qty)||0),0);
    const produced = (o.items||[]).reduce((s,it)=>s+itemProdPending_(it).produced,0);
    grandQty += qty; grandProducedSum += produced;
    const pending = qty-produced;
    const st = STATUS[o.status] || {ar:o.status||'—'};
    const r = wsSum.addRow(['', o.id, xlDate_(o.date), o.dist||'', o.customer||'—', o.customerRegion||'', String(o.phone||''), o.region||'', o.warehouse||'', st.ar, qty, produced, pending]);
    xlDateCell_(r, 3);
    r.eachCell((c,i)=>{ if(i===1) return; c.border=border; c.font={name:FONT,size:10.5, color: i===12?{argb:'FF1E8E52'}:(i===13&&pending>0?{argb:'FFB3261E'}:undefined)}; c.alignment={horizontal:'center',vertical:'middle'};
      if(idx%2===1) c.fill={type:'pattern',pattern:'solid',fgColor:{argb:ZEBRA}}; });
  });
  const totRowSum = wsSum.addRow(['','','','','','','','','','الإجمالي الكلي', grandQty, grandProducedSum, grandQty-grandProducedSum]);
  totRowSum.eachCell((c,i)=>{ if(i===1) return; c.font={bold:true,name:FONT,size:11,color:{argb:NAVY}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:LIGHT}}; c.border=border; c.alignment={horizontal:'center'}; });
  wsSum.autoFilter = { from:{row:hdrSum.number,column:2}, to:{row:hdrSum.number,column:sumLastCol} };

  // ---------- ورقة 2: تفاصيل حسب العميل ----------
  const wsDet = wb.addWorksheet('تفاصيل حسب العميل', { views:[{ rightToLeft:true }] });
  wsDet.columns = [ {width:4},{width:12},{width:12},{width:24},{width:11},{width:11},{width:10}
    ].concat(showFrameHCol?[{width:10}]:[]).concat([{width:9},{width:12},{width:9},{width:9},{width:9},{width:9}]);
  const detLastCol = 13 + (showFrameHCol?1:0);
  addHeaderBand_(wsDet, detLastCol, 'تفاصيل الطلبات حسب العميل', COMPANY_AR+' — '+new Date().toLocaleDateString('ar-EG'));
  wsDet.addRow([]);

  const data = buildAdminOrdersDetail_(orders); const AVM357=availMap357_(orders);
  // ترقيم الأعمدة ديناميكي حسب ظهور عمود "ارتفاع الحلق" — عشان تلوين الخلايا الصح، وبيستخدمه
  // كل من صفوف الأصناف وصفوف إجمالي الكود مع بعض.
  const BROR_COL = showFrameHCol?9:8, QTY_COL2 = BROR_COL+2, PRO_COL2 = QTY_COL2+1, PEND_COL2 = PRO_COL2+1, AVAIL_COL2 = PEND_COL2+1;
  data.forEach(cust=>{
    const rName = wsDet.addRow(['', 'صاحب الحساب:  '+cust.name]);
    wsDet.mergeCells(rName.number,2,rName.number,detLastCol);

// التاريخ في ملفات الإكسيل لازم يتكتب كقيمة تاريخ حقيقية مش نص.
// كان بيتكتب نص بأرقام عربية (زي "٠٣‏/٠٩‏/٢٠٢٦") — شكله مظبوط بس إكسيل مايعرفش
// يرتّبه ولا يفلتر بمدى تواريخ ولا يستخدمه في PivotTable، فعمود التاريخ كان
// عمليًا مالوش فايدة للمصنع. بنرجّع Date وبنحط numFmt على الخانة بعد الإضافة.
function xlDate_(v){
  if(v===''||v==null) return '';
  // v330: ExcelJS بيكتب التاريخ بتوقيت UTC، فالوقت المحلي (القاهرة) كان ممكن يطلع يوم قبل. بنثبّت اليوم المحلي كـ UTC منتصف الليل.
  const m = (typeof v==='string') ? v.trim().match(/^(\d{4})-(\d{2})-(\d{2})$/) : null;
  if(m) return new Date(Date.UTC(+m[1], +m[2]-1, +m[3]));
  const d = (v instanceof Date) ? v : new Date(v);
  return isNaN(d.getTime()) ? '' : new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
}
// بتحط تنسيق تاريخ ومحاذاة على خانة واحدة في صف إكسيل (بترجّع من غير ما تعمل حاجة لو مش تاريخ)
function xlDateCell_(row, col){
  const c = row.getCell(col);
  if(c.value instanceof Date){ c.numFmt = 'yyyy-mm-dd'; c.alignment = { horizontal:'center' }; }
}

// اسم اليوم بالعربي الفصيح (الأحد/الاثنين/الثلاثاء/…) — المصنع بيرتّب شغله
// بالأيام مش بالتواريخ، والأسماء دي هي اللي بتتكتب على الورق والمستندات.
const DAY_AR_ = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
// ⚠️ new Date('2026-09-08') بيتقرا على إنه UTC، فالجهاز اللي توقيته قبل UTC
// بيرجّع اليوم اللي قبله — اسم اليوم بيطلع غلط. بنفكّ التاريخ بإيدينا بدل كده.
function dateParts_(d){
  if(!d) return null;
  const m = String(d).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return { y:+m[1], m:+m[2], d:+m[3] };
  const t = new Date(d);
  if(isNaN(t.getTime())) return null;
  return { y:t.getFullYear(), m:t.getMonth()+1, d:t.getDate() };
}
function dayNameAr_(d){
  const p = dateParts_(d); if(!p) return '';
  return DAY_AR_[new Date(p.y, p.m-1, p.d).getDay()] || '';
}
function dateDM_(d){
  const p = dateParts_(d); if(!p) return String(d||'');
  try{ return new Date(p.y, p.m-1, p.d).toLocaleDateString('ar-EG',{day:'2-digit',month:'2-digit'}); }
  catch(e){ return p.d+'/'+p.m; }
}
function dateStr2_(d){
  const p = dateParts_(d); if(!p) return String(d||'');
  try{ return new Date(p.y, p.m-1, p.d).toLocaleDateString('ar-EG',{day:'2-digit',month:'2-digit',year:'numeric'}); }
  catch(e){ return p.d+'/'+p.m+'/'+p.y; }
}

let adminPollTimer = null;
// ⚠️ باج كان هنا: المستمع ده كان بيتسجّل جوّه startAdminPolling. الخروج من شاشة
// المصنع بيوقّف المؤقّت بس مابيشيلش المستمع، فكل دخول جديد كان بيضيف واحد
// كمان — وكل مرة المصنع يرجّع التطبيق قدامه كان بيتبعت فحص كامل للشيت مرة
// لكل دخول عمله في الجلسة. الشاشة اللي أصلاً بطيئة كانت بتبطّأ أكتر وأكتر.
// دلوقتي بيتسجّل مرة واحدة، وبيشوف بنفسه لو المؤقّت شغّال ولا لأ.
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && adminPollTimer) adminPoll();
});
function startAdminPolling(){
  if(adminPollTimer || !APPS_SCRIPT_URL) return;
  adminPollTimer = setInterval(()=>adminPoll(), 90000);   // فحص خلفي كل ٩٠ ثانية طول ما الشاشة مفتوحة
}

// فحص خلفي: بيقارن آخر حالة معروفة لكل طلب بالحالة الجديدة —
// طلب جديد خالص → يزوّد عداد "معلق" فوق تبويب 🏭. طلب اتغيّرت حالته → إشعار فوري.
let _adminPollRunning = false;
async function adminPoll(){
  if(!APPS_SCRIPT_URL || !state.admin.pw) return;
  // التطبيق في الخلفية (الشاشة مقفولة أو المستخدم في تطبيق تاني)؟ مافيش داعي نستهلك نت وبطارية
  if(document.hidden) return;
  // نداء لسه شغّال؟ كل نداء بيقرا الشيت كله — منعملش اتنين مع بعض
  if(_adminPollRunning) return;
  _adminPollRunning = true;
  try{
    const d = await jsonp(APPS_SCRIPT_URL + '?action=list' + admParams_());
    if(!d || !d.ok) return;
    const rows = dropDeleted_(d.orders);
    const seen = loadAdminSeen_();
    // ⚠️ أول تشغيلة على جهاز جديد: مفيش أي طلب متسجّل كـ«مشوف»، فكل الطلبات
    // الموجودة هتبان جديدة والنافذة هتفتح بقايمة كاملة. markAdminSeen_ بتتنادى
    // جوّه adminLoad، لكن الفحص بيبدأ من غير ما يستنّاها — فبنسجّل الموجود
    // ونسكت في المرة الأولى بس.
    const أول_مرة = Object.keys(seen).length === 0;
    let pending = 0;
    const جداد = [];
    rows.forEach(o=>{
      const prev = seen[o.id];
      if(prev===undefined){
        pending++;
        جداد.push(o);
      } else if(prev !== o.status){
        const stAr = (STATUS[o.status] && STATUS[o.status].ar) || o.status;
        notifyAdmin_('طلب '+orderNoText_(o)+' تم تعديله لـ '+stAr, o.dist?('صاحب الطلب: '+o.dist):'');
      }
      seen[o.id] = o.status;
    });
    saveAdminSeen_(seen);
    state.admin.pendingCount = pending;
    updateAdmBadge();
    // إشعار واحد ونافذة واحدة لكل الطلبات الجديدة مع بعض — مش إشعار لكل طلب
    // بيمسح اللي قبله. الإشعار بيوصل حتى لو المصنع في تطبيق تاني، والنافذة
    // بتفضل مستنياه لما يرجع.
    if(جداد.length && !أول_مرة){
      notifyAdmin_(جداد.length===1 ? ('📥 طلب جديد '+orderNoText_(جداد[0])) : ('📥 '+جداد.length+' طلبات جديدة'),
                   جداد.length===1 ? (جداد[0].dist?('من: '+جداد[0].dist):'') : 'افتح شاشة المصنع للتفاصيل');
      showNewOrdersPopup_(جداد);
    }
    // لو شاشة متابعة المصنع مفتوحة فعلًا قدام المستخدم، حدّث القايمة المعروضة كمان
    if(state.admin.open && state.tab==='admin'){
      state.admin.rows = rows;
      state.admin.staleAt = null;
      saveAdminCache_(rows);
      // لو المستخدم واقف بيكتب في خانة (كمية/اسم عميل/تاريخ) مانعيدش الرسم دلوقتي
      // عشان مانضيّعش اللي بيكتبه — هيتحدّث في أقرب رسم جاي أو لما يخلص.
      const ae = document.activeElement;
      const typing = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
      if(!typing) render();
    }
  }catch(err){ /* أعطال الشبكة في الفحص الخلفي بنتجاهلها بصمت */ }
  finally{ _adminPollRunning = false; }
}

function prodTableHTML_(oid, its, a, qtyMode){
  // ⚠️ الترقيم (idx) لازم يفضل على القايمة الأصلية زي ما هي، لأنه هو اللي

    .map(({it,idx})=>{
    const key = oid+':'+idx;
    const qty = Number(it.qty)||0;
    const produced = Math.max(0, Math.min(qty, Number(it.produced)||0));
    const pending = qty - produced;

    if(qtyMode){
      const qKey = oid+':'+idx;
      const qBusy = a.qtyBusy === qKey;
      const dBusy = a.itemDelBusy === qKey;
      const draft = a.qtyEdit.hasOwnProperty(qKey) ? a.qtyEdit[qKey] : qty;
      const received = Math.max(0, Math.min(qty, Number(it.received)||0));
      const leftQty = qty - received;
      const rBusy = a.recvBusy === qKey;
      const rDraft = a.recvEdit.hasOwnProperty(qKey) ? a.recvEdit[qKey] : received;
      return `<tr>
        <td style="padding:6px 7px;text-align:right;font-size:12.5px">${title}${it.type==='Door'?`<button class="btn sm" data-act="factory-item-edit294" data-id="${esc(oid)}" data-idx="${idx}">تعديل بيانات الباب</button>`:''}</td>
        <td style="padding:6px 5px;text-align:center;font-size:12.5px;color:#A9BCD4;white-space:nowrap">${esc(sizeText_(it))}</td>
        <td style="padding:6px 3px;text-align:center">
          <div style="display:flex;align-items:center;justify-content:center;gap:3px">
            <input type="number" inputmode="numeric" min="1" value="${esc(draft)}"

          </div>
        </td>
        <td style="padding:6px 3px;text-align:center">
          <div style="display:flex;align-items:center;justify-content:center;gap:3px">
            <input type="number" inputmode="numeric" min="0" max="${qty}" value="${esc(rDraft)}"
              data-act="item-recv-set" data-id="${esc(oid)}" data-idx="${idx}"
              style="width:42px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:4px 2px;font-size:13px;font-weight:700">
            <button class="btn sm" data-act="adm-recv-save" data-id="${esc(oid)}" data-idx="${idx}" ${rBusy?'disabled':''} style="font-size:11.5px;padding:4px 5px">${rBusy?'…':ico('check')}</button>
          </div>
        </td>
        <td style="padding:6px 3px;text-align:center;font-size:13px"><b style="color:${leftQty>0?'var(--danger-ink)':'var(--ok-ink)'}">${leftQty}</b></td>

          <button class="btn act-del sm" data-act="adm-item-del" data-id="${esc(oid)}" data-idx="${idx}" ${dBusy?'disabled':''} style="font-size:11.5px;padding:4px 6px">${dBusy?'…':ico('trash')}</button>
        </td>
      </tr>`;
    }

    const editing = a.prodEdit.hasOwnProperty(key);
    const busy = a.prodBusy === key;

    const readyCell = editing
      ? `<div style="display:flex;align-items:center;justify-content:center;gap:4px">
          <input type="number" inputmode="numeric" min="0" max="${qty}" value="${esc(a.prodEdit[key])}"
            data-act="prod-set" data-id="${esc(oid)}" data-idx="${idx}"
            style="width:44px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:4px 2px;font-size:13px;font-weight:700">
        </div>`
      : `<b style="color:${full?'var(--ok-ink)':(produced>0?'var(--warn-ink)':'var(--muted)')}">${produced}</b>`;

    const lastCell = editing
      ? `<div style="display:flex;gap:4px;justify-content:center">
          <button class="btn sm" data-act="adm-prod-save" data-id="${esc(oid)}" data-idx="${idx}" ${busy?'disabled':''} style="font-size:11.5px;padding:4px 6px">${busy?'…':ico('check')}</button>
          <button class="btn ghost sm" data-act="adm-prod-cancel" data-id="${esc(oid)}" data-idx="${idx}" ${busy?'disabled':''} style="font-size:11.5px;padding:4px 6px">${ico('x')}</button>
        </div>`
      : `<b style="color:${pending>0?'var(--danger-ink)':'var(--muted)'}">${pending}</b>`;

    // ⚠️ علامة «غير متاح» بتتطبع في مستند الطلب (شوف buildAdminDocOrder_) بس مكانش
    // فيه أي طريقة المصنع يعلّمها بيها — الدالة setItemAvail والمعالج موجودين من
    // غير زرار. الزرار ده بيقفل الدايرة: ضغطة بتقلب الحالة، والعميل يشوفها في ورقته.
    const avail = it.avail !== false;
    const availBusy = a.itemBusy === (oid+':'+idx);
    const availBtn = `<button class="btn ${avail?'act-send':'act-del'} sm"
        data-act="adm-item-avail" data-id="${esc(oid)}" data-idx="${idx}" data-avail="${avail?0:1}"
        ${availBusy?'disabled':''} title="${avail?'اضغط لتعليمه «غير متاح»':'اضغط لتعليمه «متاح»'}"
        style="font-size:11px;padding:3px 5px;min-height:0;width:auto">${availBusy?'…':(avail?ico('check'):ico('warn'))}</button>`;

    return `<tr data-act="${editing?'':'adm-prod-edit-open'}" data-id="${esc(oid)}" data-idx="${idx}" style="cursor:${editing?'default':'pointer'};${avail?'':'background:rgba(240,115,106,.13)'}">
      <td style="padding:6px 7px;text-align:right;font-size:12.5px">${avail?'':'<span style="color:var(--danger-ink);font-weight:700">غير متاح — </span>'}${title}</td>
      <td style="padding:6px 5px;text-align:center;font-size:12.5px;color:#A9BCD4;white-space:nowrap">${esc(sizeText_(it))}</td>
      <td style="padding:6px 5px;text-align:center;font-size:12.5px">${qty}</td>
      <td style="padding:6px 5px;text-align:center;font-size:12.5px">${readyCell}</td>
      <td style="padding:6px 5px;text-align:center;font-size:12.5px">${lastCell}</td>
      <td style="padding:6px 3px;text-align:center">${availBtn}</td>
    </tr>`;
  }).join('');

  return `<div style="overflow-x:auto;margin-top:6px">
    <table class="stktbl" style="min-width:0">
      <thead><tr>
        ${qtyMode
          ? `<th style="text-align:right">الصنف</th><th>المقاس</th><th>الكمية</th><th>المستلم</th><th>المتبقي</th><th>حذف</th>`
          : `<th style="text-align:right">الصنف</th><th>المقاس</th><th>مطلوب</th><th>جاهز</th><th>متبقي</th><th>متاح</th>`}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

// سطر الطلب الواحد على كارت العميل: رقمه وتاريخه ويومه، ومعاه معاينة وطباعة
// للطلب ده لوحده. قبل كده الأزرار كانت على مستوى العميل بس — يعني معاينة كل
// طلباته مع بعض — وكانت في نفس صف الأرقام فالشكل كان بيتداخل.
/* ============================================================
   ميعاد التسليم
   - الافتراضي: تاريخ الطلب + ١٤ يوم (السيرفر هو اللي بيحطه).
   - المصنع بيعدّله من الشريط الملوّن قدام كل أوردر.
   - أول ما المصنع يفتح الشاشة: نافذة بأوردرات النهاردة والمتأخرة،
     ولو فيه طلبات قديمة من غير ميعاد بتطلب منه يكتبهم.
   ============================================================ */
function fmtIso_(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayIso_(){ return fmtIso_(new Date()); }
// بيرجّع {cls, label, days} لطلب — اللون والكلام حسب قرب الميعاد
// الشريط الملوّن قدام الأوردر. الضغط عليه بيفتح اختيار التاريخ مباشرة.
// ميعاد الاستلام اللي بيتكتب في مستند الأوردر: اللي المصنع حدده لو معروف،
// وإلا تاريخ الطلب + ١٤ يوم (نفس افتراضي السيرفر)
// حفظ ميعاد واحد — تحديث فوري على الشاشة والرجوع للقديم لو السيرفر رفض
async function saveDue_(id, iso){
  const o = adminOrderById_(id); if(!o) return;
  const old = o.due || '';
  if(iso === old) return;
  o.due = iso; render();
  try{
    const d = await jsonp(APPS_SCRIPT_URL + '?action=setOrderMeta' + admParams_()
      + '&id=' + encodeURIComponent(id) + '&due=' + encodeURIComponent(iso));
    if(!d || !d.ok) throw new Error((d && d.error) || 'فشل الحفظ');
    saveAdminCache_(state.admin.rows);
    toast('اتحفظ ميعاد التسليم');
  }catch(err){
    o.due = old; render();
    toast('تعذّر حفظ الميعاد: ' + (err.message||err), 5000);
  }
}
// حفظ مجموعة مواعيد (للطلبات القديمة) — دفعات صغيرة عشان طول الرابط

document.addEventListener('change', e=>{
  const el = null;   // v221: مفيش حقل ميعاد في الشاشة
  if(el && el.value) saveDue_(el.dataset.id, el.value);
});

function viewAdmin(){

  // عملاء، فبنصفّرهم هنا عشان التحديث الجزئي ما يشتغلش ببيانات قديمة.
  _adminShell = null; _adminCards = null;


  const a = state.admin;

  // شاشة الانتظار بتظهر بس لو مفيش أي حاجة نعرضها. لو عندنا نسخة محفوظة،
  // بنعرضها فورًا والتحديث ماشي في الخلفية (شريط التنبيه فوق بيوضّح ده).

  if(!a.open){

    </section>${verBar()}`;

  const viewingArchive = !!a.viewArchive;
  const list = viewingArchive ? a.archRows : a.rows;
  const lst = list || [];

  // شريط بيوضّح إن المعروض نسخة محفوظة وإن التحديث شغّال — عشان المصنع ما ياخدش

      : '');

  // ---------- v262 — شاشة المصنع صفحة واحدة بأقسام بتفتح وتتلم ----------
  // بدل ما كل أداة (أرصدة / متبقي / تقارير) تاخد الشاشة كلها وتحتاج زرار
  // «رجوع للطلبات»، بقت أقسام تحت بعض في نفس الصفحة: أدوات العرض، الأرصدة
  // والمتبقي للعملاء، التقارير، العملاء وطلباتهم. كل قسم ليه عنوان وأيقونة —
  // تضغط عليه يفتح محتواه تحته، وتضغط تاني يتلم. المحتوى كله مقفول في البداية.
  // أدوات العرض: الأرشيف والأسعار + تحديث وخروج (وحذف المؤرشف جوّه الأرشيف)
  const toolsBody_ = () => `<div class="ad-tools">
      <div class="ad-row">
        <button class="btn ${viewingArchive?'brand':'act-edit'} sm" data-act="adm-toggle-archive">${ico("folder")}${viewingArchive?'رجوع للطلبات':'الأرشيف'}</button>
        <button class="btn act-money sm" data-act="adm-prices-open">${ico("money")}الأسعار</button>
      </div>
      ${viewingArchive?`<div class="ad-row"><button class="btn act-del sm" data-act="adm-clear-delivered">${ico("trash")}حذف المؤرشف</button></div>`:''}
      <div class="ad-row ad-end">
        <button class="btn act-tool sm" data-act="adm-reload">${ico("refresh")}${a.loading?'بيحدّث…':'تحديث'}</button>
        <button class="btn act-tool sm" data-act="adm-logout">${ico("lock")}خروج</button>
      </div>
    </div>${srvBuildNote_()}`;

  // الأرصدة والمتبقي للعملاء: زرارين بيبدّلوا المحتوى اللي تحتهم في نفس المكان،
  // وضغطة تانية على الزرار الشغّال بتلمّ المحتوى.
  const balBody_ = () => {
    const pick = `<div class="ad-row" style="gap:6px">
        <button class="btn ${a.viewStock?'brand':'act-edit'}" data-act="adm-toggle-stock" style="flex:1">${ico("box")}أرصدة المخزن</button>
        <button class="btn ${a.viewCustRem?'brand':'act-edit'}" data-act="adm-toggle-custrem" style="flex:1">${ico("report")}المتبقي للعملاء</button>
      </div>`;
    if(a.viewCustRem) return pick + custRemBody_();
    if(a.viewStock) return pick + stockBody_();
    return pick + `<div class="note" style="margin-top:10px">اختار «أرصدة المخزن» أو «المتبقي للعملاء» — المحتوى هيفتح تحتهم هنا على طول.</div>`;
  };

  // العملاء وطلباتهم: البحث + كروت العملاء. مكان الكروت بيفضل ماركر بيتبدّل
  // بعد بناء الكروت (نفس نظام التحديث الجزئي الموجود).
  const custBody_ = () => `
      
      <div style="display:flex;gap:7px;align-items:center">
      <input type="search" id="admQ" class="ad-q" placeholder="اكتب اسم العميل…" value="${esc(_admQ)}" autocomplete="off" style="flex:1;min-width:0">
      <button type="button" class="btn act-tool sm" data-act="adm-reload" ${(a.loading||a.archLoading)?'disabled':''} style="flex:none;width:auto"
        title="تحديث الطلبات من السيرفر من غير ما تطلع من الشاشة" aria-label="تحديث الطلبات">${ico("refresh")}${(a.loading||a.archLoading)?'بيحدّث…':'تحديث الطلبات'}</button>
      </div>
      <div class="note" style="margin-top:8px">${viewingArchive?'الطلبات المؤرشفة (اتسلمت أو اتأرشفت يدوي) — مش بتظهر في التقارير.':'اضغط اسم العميل عشان تركّز عليه وتشوف طلباته بس، واضغطه تاني ترجع القايمة كلها، واضغط رقم الطلب يفتحلك كارته الكامل بكل وظائفه.'}</div>
      <div class="ad-legend"><span><i class="g"></i>جاهز</span><span><i class="a"></i>تحت التنفيذ</span><span><i class="r"></i>لسه ما بدأش</span></div>
      ${!lst.length
        ? `<div class="empty"><span class="em">${ico("clip","xl")}</span><p>${viewingArchive?'مفيش طلبات مؤرشفة.':'مفيش طلبات نشطة لسه.'}</p></div>`
        : ADMIN_CARDS_MARK}`;

  // الكروت المربعة: كل اتنين جمب بعض في مربع، وضغطة على الكارت تفتح محتوى
  // القسم تحت الشبكة في كارت لوحده بعنوانه، وضغطة تانية (على الكارت أو على
  // العنوان) تلمّه. المحتوى كله مقفول في البداية.
  const secDefs_ = () => [
    ['adm-sec-tools','filter','أدوات العرض','الأرشيف · الأسعار · تحديث · خروج', toolsBody_, 't-blue'],
    ['adm-sec-bal','box','الأرصدة والمتبقي للعملاء','أرصدة المخزن · المتبقي للعملاء', balBody_, 't-green'],
    ['adm-sec-reports','report','التقارير','تقارير الطلبات والمخزن والتصدير', reportsBody_, 't-violet'],
    ['adm-sec-cust','user',viewingArchive?'عملاء الأرشيف':'العملاء وطلباتهم','دوّر على عميل وتابع طلباته', custBody_, 't-gold'],
  ];
  const secsGrid_ = () => `<div class="ad-grid">${secDefs_().map(d=>{
      const on = uiOpen_(d[0],false);
      return `<button class="card ad-sq ${d[5]}${on?' on':''}" data-act="ui-toggle" data-k="${d[0]}" aria-expanded="${on}">
        <span class="n">${ico(d[1],"lg")}</span>
        <span class="tt"><b>${d[2]}</b><small>${d[3]}</small></span>
      </button>`;
    }).join('')}</div>`;
  const secsOpen_ = () => secDefs_().filter(d=>uiOpen_(d[0],false)).map(d=>`<section class="card ad-card ad-dd open">
      <button class="adH" data-act="ui-toggle" data-k="${d[0]}" aria-expanded="true">
        <span class="n">${ico(d[1],"lg")}</span>
        <span class="tt"><b>${d[2]}</b><small>اضغط لطي المحتوى، أو اختار قسمًا من الشريط</small></span>
        ${ico("chev")}
      </button>
      <div class="adB">${d[4]()}</div>
    </section>`).join('');

  if(a.pricesOpen) return viewAdminPrices() + verBar();

  if(viewingArchive && a.archLoading){
    return `<section class="card">
      <div class="step"><span class="n">${ico("folder","lg")}</span><h2>الأرشيف</h2></div>
      <div class="btnrow"><button class="btn act-edit" data-act="adm-toggle-archive">${ico("back")}رجوع للطلبات</button></div>
    </section>
    <div class="empty"><span class="em">${ico("clock","xl")}</span><p>جارٍ تحميل الأرشيف…</p></div>${verBar()}`;
  }

  // ---------- شاشة التقارير والتصدير — كل التقارير في مكان واحد بدل قوائم متفرقة ----------
  const reportsBody_ = () => {
    const rptBtns = (pdfAct, xlsAct) =>
      `<button class="btn act-report sm" data-act="${pdfAct}">${ico("doc")}PDF</button>`
      + (xlsAct ? `<button class="btn act-report sm" data-act="${xlsAct}">${ico("sheet")}إكسيل</button>` : '');
    const rptRow = (title, desc, btns) => `<div style="border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-top:9px">
        <b style="font-size:14px">${title}</b>
        <div class="note" style="margin-top:2px">${desc}</div>
        <div class="btnrow" style="margin-top:8px">${btns}</div>
      </div>`;
    return `<div class="hm-h"><span>تقارير الطلبات</span></div>
      ${rptRow('التقرير الكامل', 'كل الطلبات النشطة: ملخص + تفاصيل كل عميل + إجمالي الأصناف', rptBtns('adm-full-pdf','adm-full-xls'))}
      ${rptRow('الأبواب المعلّقة', 'الأبواب اللي لسه ما اتسلّمتش، مجمّعة حسب العميل', rptBtns('adm-pending-pdf','adm-pending-xls'))}
      ${rptRow('الأبواب المطلوبة', 'إجمالي الأبواب المطلوبة حسب الكود والمقاس', rptBtns('adm-req-pdf','adm-req-xls'))}
      <div class="hm-h" style="margin-top:16px"><span>المخزن والتوزيع</span></div>
      ${rptRow('أرصدة المخزن', 'جرد المخزن الحالي مع المطلوب للعملاء منه', rptBtns('stock-pdf'))}
      ${rptRow('المتبقي للعملاء حسب الكود', 'المتبقي لكل عميل بعد خصم رصيد المخزن — الأقدم أول', rptBtns('adm-allocbycode-pdf','adm-allocbycode-xls'))}
      ${rptRow('توزيع الرصيد على العملاء', 'إزاي رصيد المخزن بيتوزّع على طلبات العملاء', rptBtns('adm-alloc-cust-pdf','adm-alloc-cust-xls'))}
      ${rptRow('المطلوب تصنيعه', 'الأبواب المطلوب تصنيعها بعد خصم رصيد المخزن', rptBtns('adm-alloc-doors-pdf','adm-alloc-doors-xls'))}`;
  };

  // ---------- محتوى «المتبقي للعملاء» و«أرصدة المخزن» — بيفتحوا جوّه قسم الأرصدة ----------
  const tools285_=(btns)=>`<div class="tools285">${btns}</div>`;
  const toolBtn285_=(act,icon,label,aria)=>`<button type="button" class="tool285" data-act="${act}" aria-label="${aria||label}">${ico(icon)}<span>${label}</span></button>`;
  const custRemDetail353_ = (d,name) => {
    const rows=[];let tr=0,tg=0,tm=0;
    d.sizes.forEach(g=>d.codes.forEach(c=>{const x=d.cell(g,c,name);if(x){rows.push([c,g,x]);tr+=x.req;tg+=x.got;tm+=x.rem;}}));
    const key=o=>String(o.customer||'').trim()||o.dist||'—';
    const ords=(d.pending||[]).filter(o=>key(o)===name).slice().sort((x,y)=>String(x.date||'').localeCompare(String(y.date||''))||String(x.id||'').localeCompare(String(y.id||'')));
    const stAr=o=>(STATUS[o.status]&&STATUS[o.status].ar)||o.status||'';
    const chip=(t,v,col)=>`<div style="flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 2px"><div style="font-size:11px;color:var(--muted)">${t}</div><div style="font-size:18px;font-weight:800;color:${col}">${v}</div></div>`;
    const tbl=rows.length?`<table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:8px"><thead><tr style="color:var(--muted);font-size:11.5px"><th style="text-align:right;padding:5px 6px;font-weight:600">الكود</th><th style="font-weight:600">المقاس</th><th style="font-weight:600">مطلوب</th><th style="font-weight:600">متاح</th><th style="font-weight:600">ناقص</th></tr></thead><tbody>${rows.map(([c,g,x])=>`<tr style="border-top:1px solid var(--line);text-align:center"><td style="padding:6px;text-align:right;font-weight:700">${esc(c)}</td><td>${g==='خاص'?'خاص':esc(g)}</td><td>${x.req}</td><td style="color:var(--ok-ink);font-weight:700">${x.got||'—'}</td><td style="color:${x.rem>0?'var(--danger-ink)':'var(--muted)'};font-weight:800">${x.rem>0?x.rem:'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="note">مفيش أبواب معلّقة للعميل ده.</div>';
    const ordHtml=ords.map(o=>{const its=(o.items||[]).filter(it=>it.type==='Door'&&(Number(it.qty)||0)>0).map(it=>`${esc(String(it.code||'').trim()||'—')} · ${esc(it.size||'')} × ${esc(it.qty)}`).join('<br>');return `<div style="border-top:1px solid var(--line);padding:7px 2px;font-size:12.5px"><div style="display:flex;justify-content:space-between;gap:6px"><b>${esc(o.id||'')}</b><span style="color:var(--muted)">${esc(String(o.date||'').slice(0,10))} · ${esc(stAr(o))}</span></div><div style="color:var(--muted);margin-top:2px">${its||'—'}</div></div>`;}).join('');
    return `<div data-custrem-detail="1" style="margin-top:10px"><div style="display:flex;align-items:center;gap:8px"><button type="button" class="btn act-tool sm" data-act="custrem-back" style="flex:none;width:auto">رجوع</button><b style="font-size:15px">${esc(name)}</b></div>
      <div style="display:flex;gap:6px;margin-top:10px">${chip('مطلوب',tr,'var(--ink)')}${chip('متاح',tg,'var(--ok-ink)')}${chip('ناقص',tm,tm>0?'var(--danger-ink)':'var(--muted)')}</div>${tbl}
      <div style="margin-top:12px;font-weight:800;font-size:13px">طلباته (${ords.length})</div>${ordHtml||'<div class="note">مفيش طلبات.</div>'}</div>`;
  };
  const custRemBody_ = () => {
    const d = a.custRem;
    let body;
    if(d && a.custRemSel){
      return `${tools285_(toolBtn285_('custrem-reload','refresh',a.custRemLoading?'بيحدّث…':'تحديث'))}${custRemDetail353_(d,a.custRemSel)}`;
    }
    if(a.custRemLoading && !d){
      body = `<div class="empty"><span class="em">${ico("clock","xl")}</span><p>جارٍ تحميل المتبقي للعملاء…</p></div>`;
    }else if(a.custRemErr&&!d){
      body = `<div class="empty"><p>تعذّر تحميل المتبقي للعملاء. اضغط تحديث لإعادة المحاولة.</p></div>`;
    }else if(!d || !d.codes.length){
      body = `<div class="empty"><span class="em">${ico("clip","xl")}</span><p>مفيش أبواب متبقية للتصنيع دلوقتي.</p></div>`;
    }else{
      const blocks = d.codes.map(c=>{
        const custs = [];
        d.sizes.forEach(g=>(d.custBy[g]||[]).forEach(n=>{ const x=d.cell(g,c,n); if(!custs.includes(n) && x && x.rem>0) custs.push(n); }));
        if(!custs.length) return '';
        custs.sort((x,y)=>String((d.dateBy||{})[c+'|'+x]||'9999').localeCompare(String((d.dateBy||{})[c+'|'+y]||'9999'))||String(x).localeCompare(String(y),'ar'));   // v356: الأقدم أولاً بالتاريخ فقط
        const dn = (DOORS.find(x=>x.code===c)||{}).name || '';
        const dsw = DOOR_COLOR_SWATCH[dn] || null;   // لون الكود الحقيقي — نفس سواتش شيبس الأكواد في التطبيق
        const rows = custs.map(n=>{
          const cs = d.sizes.map(g=>{
            const x = d.cell(g,c,n);
            const v = x ? x.rem : 0;
            return `<td style="padding:7px 4px;text-align:center;font-weight:700;font-size:14px;color:${v>0?'var(--ink)':'var(--muted)'}">${v>0?v:'—'}</td>`;
          }).join('');
          return `<tr style="border-top:1px solid var(--line)">
            <td style="padding:7px 8px;font-weight:700"><button type="button" class="cr353-name" data-act="custrem-cust" data-n="${esc(n)}">${esc(n)}</button></td><td class="cr354-date" style="padding:7px 3px;text-align:center;font-size:11.5px;color:var(--muted);white-space:nowrap">${esc(crDate354_((d.dateBy||{})[c+'|'+n]))}</td>${cs}</tr>`;
        }).join('');
        return `<div style="margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden">
          <div style="padding:9px 12px;font-weight:800;font-size:14px;background:${dsw?dsw.bg:'var(--surface-2)'};${dsw?`border-bottom:2px solid ${dsw.border};`:''}color:${dsw?'#3D2E17':'var(--ink)'}"><b>${esc(c)}</b> <span style="color:${dsw?'rgba(61,46,23,.72)':'var(--muted)'};font-size:12px;font-weight:400">${esc(dn)}</span></div>
          <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead><tr style="color:var(--muted);font-size:11.5px">
              <th style="text-align:right;padding:6px 8px;font-weight:600">المتبقي للعملا</th>
              <th style="padding:6px 3px;width:58px;font-weight:600">تاريخ الطلب</th>
              ${d.sizes.map(g=>`<th style="padding:6px 4px;width:52px;font-weight:600">${g==='خاص'?'مقاس خاص':g}</th>`).join('')}
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
      }).join('');
      body = `<div class="note" style="margin-top:10px">«المتبقي للعملا» = اللي لسه محتاج يتصنّع لكل عميل
        بعد خصم الموجود في المخزن (الرصيد بيتوزّع على الطلبات الأقدم أول، زي تقرير «توزيع الرصيد»). الرصيد هو الجرد الفعلي بما فيه الجاهز غير المسلَّم، فالرقم هنا قد يختلف عن «متبقي» في تقارير تقدّم الإنتاج لأنها بتحسب «جاهز» من الطلب نفسه ومش من الرصيد.</div>${blocks}`;
    }
    return `${tools285_(toolBtn285_('custrem-reload','refresh',a.custRemLoading?'بيحدّث…':'تحديث')+toolBtn285_('adm-allocbycode-pdf','doc','PDF')+toolBtn285_('adm-allocbycode-xls','sheet','إكسيل'))}${d&&a.custRemAt?`<div data-custrem-loaded-at="1" class="note" style="font-size:11px">آخر تحميل ناجح: ${esc(new Date(a.custRemAt).toLocaleString('ar-EG'))}</div>`:''}${a.custRemErr?`<div role="alert" class="note" style="color:var(--danger-ink)">${esc(a.custRemErr)}${d?' · المعروض آخر تحميل ناجح، وليس تحديثًا حاليًا.':''}</div>`:''}${body}
`;
  };

  const stockBody_ = () => {
    const rowsHtml = DOORS.map(d=>{
      const cells = SIZES.map(sz=>{
        const key = d.code+'|'+sz.w;
        const cur = stockFor(d.code, sz.w) || 0;
        const draft = a.stockDraft[key];
        const val = draft!==undefined ? draft : cur;
        const busy = a.stockBusy===key;
        const dirty = draft!==undefined && Number(draft)!==Number(cur);
        const res = reservedFor(d.code, sz.w);
        const free = cur-(res||0);
        return `<td style="padding:4px">
          <input type="number" inputmode="numeric" min="0" value="${esc(val)}"
            data-act="stock-in" data-code="${esc(d.code)}" data-w="${sz.w}"
            class="stkin ${dirty?'dirty':''}" ${busy?'disabled':''}>
          ${res>0?`<div style="text-align:center;font-size:11px;margin-top:2px"><span style="color:var(--danger-ink)">مطلوب ${res}</span> · <span style="color:${free<0?'var(--danger-ink)':'var(--ok-ink)'};font-weight:700">متبقي ${free}</span></div>`:''}
        </td>`;
      }).join('');
      const freeCells = SIZES.map(sz=>{
        const f = (stockFor(d.code, sz.w)||0) - (reservedFor(d.code, sz.w)||0);
        return `<td style="padding:5px 4px;text-align:center;font-size:14px;font-weight:700;color:${f<0?'var(--danger-ink)':'var(--ok-ink)'}">${f<0?'-'+(-f):f}</td>`;
      }).join('');
      return `<tr>
        <td style="padding:5px 7px;white-space:nowrap"><b>${esc(d.code)}</b>
          <span style="color:var(--muted);font-size:12.5px"> ${esc(d.name)}</span></td>
        ${cells}
        ${freeCells}
      </tr>`;
    }).join('');

    const dirtyCount = Object.keys(a.stockDraft).filter(k=>{
      const [c,w] = k.split('|');
      return Number(a.stockDraft[k]) !== Number(stockFor(c, Number(w))||0);
    }).length;

    return `${tools285_(toolBtn285_('stock-reload','refresh','تحديث')+toolBtn285_('stock-pdf','doc',a.stockPdfBusy?'…':'تصدير PDF'))}<div class="note" style="margin-top:10px">اكتب الكمية المتاحة لكل كود ومقاس. العميل هيشوف
        «${esc(READY_HOURS_TXT)}» للأصناف اللي ليها رصيد. تحت كل خانة «مطلوب» (المحجوز لطلبات العملاء) و«متبقي» للمقاس. وخانات «متبقي فعليًا» (٧٠ / ٨٠ / ٩٠ / ١٠٠) بتوريك الرصيد الفاضي
        فعليًا لكل مقاس لوحده بعد خصم المطلوب لطلبات العملاء المعلّقة. الرقم بالسالب الأحمر معناه الناقص من المقاس ده.</div>
      <div style="overflow-x:auto;margin-top:12px">
        <table class="stktbl">
          <thead><tr>
            <th rowspan="2" style="text-align:right">الكود</th>
            ${SIZES.map(sz=>`<th rowspan="2">${sz.w} سم</th>`).join('')}
            <th colspan="${SIZES.length}">متبقي فعليًا</th>
          </tr><tr>
            ${SIZES.map(sz=>`<th style="font-size:12px">${sz.w}</th>`).join('')}
          </tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
      <div class="btnrow" style="margin-top:12px">
        <button class="btn brand" data-act="stock-save" ${dirtyCount?'':'disabled'}>
          ${dirtyCount?`حفظ ${dirtyCount} تعديل`:'مفيش تعديلات'}</button>
      </div>`;
  };


  const orderCardHTML_ = o=>{
    const busy = a.busy === o.id;
    const delBusy = a.delBusy === o.id;
    const prevBusy = a.orderPreviewBusy === o.id;
    const archBusy = a.archBusy === o.id;
    const btns = FLOW.map(st=>{
      const c = STATUS[st];
      const on = o.status === st;
      return `<button class="chip ${on?'on':''}" data-act="adm-set" data-id="${esc(o.id)}" data-st="${esc(st)}"
        ${busy?'disabled':''} style="flex:1;min-width:0;padding:8px 4px;font-size:12.5px">
        ${ico(c.ic,'lg')}<span style="display:block;margin-top:3px">${esc(c.ar)}</span></button>`;
    }).join('');

    const itemsOpen = !!a.itemsOpen[o.id];
    const qtyMode = !!a.qtyEditOpen[o.id];
    const its = a.items[o.id];
    let itemsHtml = '';
    if(itemsOpen){
      if(qtyMode){
        const meta = a.metaEdit[o.id] || {customer:o.customer||'', date:o.date||'', region:o.customerRegion||''};
        const metaBusy = a.metaBusy === o.id;
        itemsHtml += `<div style="margin-top:8px;padding:9px 10px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px">
          <div style="font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:6px">بيانات الطلب:</div>
          <div style="display:flex;gap:7px;flex-wrap:wrap">
            <label style="flex:1;min-width:140px;display:flex;flex-direction:column;gap:3px">

            </label>
