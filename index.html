<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ELKORASHI DOORS — طلبات أبواب WPC</title>
<meta name="theme-color" content="#002050">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ELKORASHI">
<!-- المكتبات التقيلة (html2canvas / jsPDF / ExcelJS) مابقتش بتتحمّل مع فتح التطبيق.
     كانت ~2.4 ميجا جافاسكريبت بتتقفل قدام أول رسم للشاشة وبتأخّر الفتح تأخير واضح على الموبايل.
     دلوقتي بتتحمّل أول مرة بس وقت ما المستخدم يطلب PDF/صورة/إكسيل (شوف ensureLib_ تحت)،
     وبعدها بتفضل في كاش الـ Service Worker فالمرة الجاية فورية.
     مكتبة xlsx اتشالت خالص — كانت مكرّرة مع ExcelJS اللي بيعمل نفس الشغل وأحسن. -->
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
<style>
:root{
  --navy:#002050;
  --navy-2:#003060;
  --brand:#1080C0;
  --brand-lt:#4FA8DC;
  --wood:#A6642F;
  --wood-lt:#C98A54;
  --wood-bg:#FBF1E7;
  --wood-line:#E8C9A8;
  --bg:#F3F6FA;
  --card:#FFFFFF;
  --ink:#14243A;
  --muted:#6B7A8C;
  --line:#DCE4EC;
  --ok:#1E7A54;
  --ok-bg:#E7F3EE;
  --warn-bg:#FFF6E5;
  --warn-line:#E8C77A;
  --danger:#B3261E;
  --r:16px;
  --shadow:0 4px 18px rgba(0,32,80,.09);
  --mark:none;

  /* ---- توكنز التصميم المحدّثة (v108) ----
     سلّم ظلال متدرّج بدل ظل واحد لكل حاجة، وسلّم زوايا، ومنحنيات حركة موحّدة.
     ده اللي بيخلي الشاشة تبان مرتّبة وفيها عمق بدل ما كل الكروت في نفس المستوى. */
  --e1:0 1px 2px rgba(12,32,64,.06), 0 1px 3px rgba(12,32,64,.05);
  --e2:0 2px 6px rgba(12,32,64,.06), 0 6px 16px rgba(12,32,64,.07);
  --e3:0 6px 14px rgba(12,32,64,.08), 0 16px 34px rgba(12,32,64,.10);
  --r-sm:10px;
  --r-md:14px;
  --r-lg:18px;
  --r-pill:999px;
  --ease:cubic-bezier(.2,.7,.3,1);          /* دخول ناعم — بيقف من غير ارتداد */
  --ease-out:cubic-bezier(.16,1,.3,1);      /* خروج سريع في الأول وبطيء في الآخر */
  --t-fast:.13s;
  --t-med:.22s;
  --surface-2:#F8FAFD;                       /* سطح تاني للتمييز جوه الكروت */
  --line-soft:#E7EDF4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:Arial,'Helvetica Neue',system-ui,sans-serif;
  font-weight:700;                 /* الخط بولد في كل التطبيق */
  background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.6;padding-bottom:30px;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,b,strong{font-family:Arial,'Helvetica Neue',system-ui,sans-serif;font-weight:700}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;font-weight:700}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ بوابة التثبيت — شاشة كاملة قبل أي حاجة تانية ============ */
#installGate{
  position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(170deg,var(--navy),var(--navy-2));color:#EAF2FA;
  padding:32px 24px calc(28px + env(safe-area-inset-bottom));text-align:center;
}
#installGate.hidden{display:none}
#installGate img.gatelogo{width:96px;height:96px;border-radius:20px;background:#fff;padding:10px;object-fit:contain;margin-bottom:20px;box-shadow:0 8px 26px rgba(0,0,0,.3)}
#installGate h1{font-size:19px;margin:0 0 10px;line-height:1.4}
#installGate .gatesub{font-size:13.5px;color:#B9CBDD;line-height:1.75;max-width:320px;margin:0 0 26px}
.gatebtn{
  display:block;width:100%;max-width:320px;padding:15px;border-radius:14px;
  background:linear-gradient(180deg,var(--gold-lt,#E4C766),var(--gold,#C9A227));
  color:#2A1F18;font-family:Arial,'Helvetica Neue',sans-serif;font-size:15.5px;font-weight:700;
  box-shadow:0 6px 20px rgba(201,162,39,.35);
}
.gatehint{font-size:11.5px;color:#8FA3BC;margin-top:12px;max-width:300px;line-height:1.6}
.gatesteps{background:rgba(255,255,255,.07);border-radius:12px;padding:14px;max-width:320px;margin-bottom:18px;text-align:right}
.gatestep{font-size:12.5px;line-height:1.7;color:#DCE7F2;display:flex;gap:8px;margin-bottom:9px}
.gatestep:last-child{margin-bottom:0}
.gatestep b{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;display:grid;place-items:center}
.gateskip{margin-top:20px;font-size:12.5px;color:#9CB6D2;text-decoration:underline;background:none}

/* ============ الهيدر ============ */
#appbar{position:sticky;top:0;z-index:40}
#appbar::after{content:'';display:block;height:3px;background:linear-gradient(90deg,var(--wood),var(--wood-lt) 45%,var(--brand-lt))}
.top{
  background:linear-gradient(160deg,var(--navy),var(--navy-2));
  color:#EAF2FA;padding:calc(9px + env(safe-area-inset-top)) 14px 9px;
  box-shadow:0 2px 14px rgba(0,32,80,.3);
}
.top-row{display:flex;align-items:center;gap:11px}
.top img.logo{height:38px;width:auto;background:#fff;border-radius:8px;padding:4px 7px;flex:0 0 auto}
.top .t1{font-family:Arial,'Helvetica Neue',sans-serif;font-size:14.5px;font-weight:600;line-height:1.3}
.top .t2{font-size:11px;color:#9CB6D2;margin-top:1px}
.wh-chip{
  margin-inline-start:auto;flex:0 0 auto;text-align:center;
  background:rgba(79,168,220,.15);border:1px solid rgba(79,168,220,.42);
  color:#9FD1F0;border-radius:9px;padding:4px 9px;font-size:10.5px;line-height:1.35;
}
.wh-chip b{display:block;font-size:12px;color:#DCEEFB}


/* شريط التثبيت/التحديث — تحت اللوجو على طول زي تطبيق الموزعين */
/* شريط الإصدار/التحديث/التثبيت — أعلى الصفحة جنب اللوجو */
.verstrip{display:flex;align-items:center;gap:7px;margin-top:8px}
.verstrip .vs-ver{font-size:10.5px;color:#9CB6D2;flex:1;min-width:0}
.verstrip button{
  flex:0 0 auto;background:rgba(255,255,255,.14);border:1px solid rgba(159,209,240,.4);
  color:#EAF2FA;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:600;
  white-space:nowrap;
}
.verstrip button.vs-install{background:linear-gradient(180deg,var(--brand-lt),var(--brand));border-color:transparent;color:#fff}
.verstrip button[hidden]{display:none}


/* شريط الأقسام فوق (الأبواب / الإكسسوارات / حلق فقط / برور فقط) */
.secnav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:13px}
.secnav button{
  background:var(--card);border:1.5px solid var(--line);border-radius:12px;
  padding:10px 4px;text-align:center;box-shadow:var(--shadow);
}
.secnav button .i{display:block;margin:0 auto 4px;width:22px;height:22px;color:var(--muted)}
.secnav button.on .i{color:var(--wood)}
.secnav button .tx{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.secnav button.on{border-color:var(--brand);background:linear-gradient(180deg,#fff,#F3F9FE)}
.secnav button.on .tx{color:var(--navy)}

/* شبكة الإكسسوارات المصغّرة — ٣ في الصف */
.accgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.accgrid .ac{border:1.5px solid var(--line);border-radius:11px;padding:8px 6px 7px;text-align:center;background:#FCFDFE}
.accgrid .ac b{display:block;font-size:11px;font-weight:600;line-height:1.28;min-height:28px}
.accgrid .ac .pr{font-size:10px;color:var(--muted);margin:2px 0 7px}
.accgrid .ac .qty{transform:scale(.82);transform-origin:center;margin:0 auto;width:fit-content}

/* لوحة تفاصيل الباب — بتظهر تحت صف الباب المختار جوه نفس الشبكة */
.doorpanel{grid-column:1/-1;background:#F7FAFD;border:1px dashed var(--brand);border-radius:12px;padding:12px;margin:2px 0 4px}
/* المقاس / الحلق / البرور — أعمدة جنب بعض تحت الباب المختار */
.specgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.specol{display:flex;flex-direction:column;gap:5px;min-width:0}
.specol .sol-h{font-size:10px;color:var(--muted);text-align:center;font-weight:600}
.specol .colchip{
  width:100%;padding:7px 2px;border:1.5px solid var(--line);border-radius:8px;
  background:#FCFDFE;font-size:10.5px;font-weight:500;text-align:center;line-height:1.25;
}
.specol .colchip .ic{display:block;font-size:14px;line-height:1.1;margin-bottom:1px}
.specol .colchip .sub{display:block;font-size:8.8px;color:var(--muted);font-weight:400;margin-top:1px}
.specol .colchip.on{background:var(--navy);border-color:var(--navy);color:#EAF2FA}
.specol .colchip.on .sub{color:#9CB6D2}
.doorpanel .dphead{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.doorpanel .dphead b{font-family:Arial,'Helvetica Neue',sans-serif;font-size:14px;color:var(--navy)}
.doorpanel .dphead span{font-size:11.5px;color:var(--muted)}
.doorpanel .grp{font-size:11.5px;color:var(--muted);margin:11px 0 6px}
.doorpanel .dphead + .grp{margin-top:0}
.grp{font-size:12px;font-weight:700;color:var(--wood);margin:11px 0 6px}
.prow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.prow:last-of-type{border-bottom:0}
.prow span{flex:1;font-size:12.5px;color:var(--ink)}
.prow small{color:var(--muted)}
.prow input{width:84px;flex:0 0 auto;text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px 4px;font-size:13px}
.prow input:focus{border-color:var(--wood);outline:none}
.prow .u{flex:0 0 auto;width:auto;font-size:12px;color:var(--muted)}
.prow3{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.prow3:last-of-type{border-bottom:0}
.prow3 .lbl{flex:1 1 100%;font-size:12.5px;color:var(--ink);margin-bottom:2px}
.prow3 .lbl small{color:var(--muted)}
.prow3 .tri{display:flex;gap:5px;flex:1 1 100%}
.prow3 .tcell{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.prow3 .tcell b{font-size:9.5px;color:var(--muted);font-weight:700}
.prow3 input{width:100%;text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px 2px;font-size:12.5px;min-width:0}
.prow3 input:focus{border-color:var(--wood);outline:none}
.ptri-head{display:flex;gap:5px;padding:4px 0 2px}
.ptri-head b{flex:1;text-align:center;font-size:10.5px;color:#1080C0;font-weight:700}

/* ============ التبويبات ============ */

/* ============ أيقونات SVG — هوية بصرية موحّدة بدل الإيموجي ============
   كلها stroke-based بنفس السُمك والزوايا، وبتاخد لون النص اللي حواليها (currentColor)
   فبتتلوّن تلقائي حسب الزرار/الحالة، وبتطلع نفس الشكل بالظبط على كل الأجهزة
   (الإيموجي كان بيختلف شكله من موبايل للتاني وده كان بيضرب الهوية البصرية). */
.i{width:1.15em;height:1.15em;flex:0 0 auto;vertical-align:-.18em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.i.lg{width:1.5em;height:1.5em}
.i.xl{width:26px;height:26px;stroke-width:1.7}

.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
.tabs[hidden]{display:none}
.tabs button{flex:1;padding:9px 2px 7px;font-size:11px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;
  display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tabs button .i{width:21px;height:21px}
.tabs button.on .i{color:var(--brand)}
.tabs button.on{color:var(--navy);border-bottom-color:var(--brand);font-weight:600}
.tabs .badge{position:absolute;top:4px;inset-inline-end:calc(50% - 20px);min-width:17px;padding:0 4px;
  background:var(--brand);color:#fff;border-radius:20px;font-size:10px;line-height:17px;font-weight:700;
  box-shadow:0 1px 4px rgba(0,32,80,.25)}
.tabs .badge[hidden]{display:none}

.wrap{padding:14px;max-width:660px;margin:0 auto;position:relative}

/* ============ الكروت + علامة مائية ============ */
.card{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:14px;margin-bottom:13px;box-shadow:var(--shadow);
  overflow:hidden;
}
/* اللوجو خلفية باهتة في كل كارت */
.card::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:var(--mark) no-repeat left 8px bottom 8px;
  background-size:42px auto;opacity:.05;
}
.card>*{position:relative}

.step{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.step .n{
  font-family:Arial,'Helvetica Neue',sans-serif;font-size:11.5px;font-weight:700;color:#fff;
  background:linear-gradient(160deg,var(--brand-lt),var(--brand));border-radius:9px;width:28px;height:28px;
  display:grid;place-items:center;flex:0 0 auto;box-shadow:0 2px 6px rgba(16,128,192,.3);
}
.step .n .i{width:16px;height:16px;stroke-width:2}
.step h2{font-size:15px;margin:0}
.step .hint{font-size:11px;color:var(--muted);margin-inline-start:auto;font-weight:400}

label.fld{display:block;margin-bottom:10px}
label.fld span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
label.fld span .req{color:var(--danger);font-weight:700}
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=date],input[type=search],select,textarea{
  width:100%;padding:10px 11px;border:1.5px solid var(--line);border-radius:10px;background:#FCFDFE;
}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none}
input.bad{border-color:var(--danger);background:#FFF6F5}
input::placeholder{color:#A8B4C2}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ============ رف الأبواب ============ */
.rail{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 9px;padding:4px 2px 6px}
/* وضع التركيز: الباب المختار لوحده وجنبه زرار الرجوع للأكواد */
.focusrow{display:flex;align-items:center;gap:12px;padding:2px 2px 10px;border-bottom:1px solid var(--line);margin-bottom:11px}
.focusrow .door{width:88px;flex:0 0 auto}
.stktbl{width:100%;border-collapse:collapse;font-size:12px;min-width:420px}
.stktbl th{background:var(--navy);color:#EAF2FA;padding:7px 5px;font-size:11px;white-space:nowrap}
.stktbl td{border-bottom:1px solid var(--line)}
.stktbl tbody tr:nth-child(even){background:#F7FAFC}
.stkin{width:100%;min-width:56px;border:1.5px solid var(--line);border-radius:8px;
  padding:7px 4px;text-align:center;font-size:14px;font-weight:700;color:var(--ink);background:#fff}
.stkin:focus{border-color:var(--brand);outline:none}
.stkin.dirty{border-color:#C08A3E;background:#FFF9F0}
/* المقاس المتوفر بالمخزن: خلفية خضرا وكلام بولد عشان يبان فورًا */
.specol .colchip.instock{background:#DCF1E6;border-color:#4FA986;color:#14603F;font-weight:700}
.specol .colchip.instock .sub{color:#2E7D5B;font-weight:700}
.specol .colchip.instock .stk{display:block;font-size:9.5px;font-weight:700;color:#0F5237;margin-top:2px}
/* لو مختار ومتوفر — يفضل الأخضر واضح مع تمييز الاختيار */
.specol .colchip.instock.on{background:#1E7A54;border-color:#14603F;color:#fff}
.specol .colchip.instock.on .sub,
.specol .colchip.instock.on .stk{color:#CFEBDD}
.colchip .stk{display:block;font-size:9.5px;font-weight:700;color:#1E7A54;margin-top:2px}
.door .rdy{display:inline-flex;align-items:center;gap:3px;margin-top:3px;font-size:9.5px;
  font-weight:700;color:#1E7A54;background:#E7F3EE;border-radius:20px;padding:2px 7px}
.door .rdy .i{width:11px;height:11px}
.stockbar{display:flex;align-items:flex-start;gap:8px;margin-top:11px;padding:10px 12px;
  border-radius:10px;font-size:12px;line-height:1.5}
.stockbar .i{flex:0 0 auto;margin-top:1px}
.stockbar.ok{background:#E7F3EE;border:1.5px solid #8FC7B0;color:#14603F}
.stockbar.part{background:#FFF6E5;border:1.5px solid #E8C9A8;color:#8A6512}
.stockbar.out{background:#F3F6FA;border:1.5px solid var(--line);color:var(--muted)}
.rodrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rodbox{border:1.5px solid var(--line);border-radius:11px;padding:10px;background:#fff;text-align:center}
.rodbox .rl{font-size:12px;font-weight:700;color:var(--navy);line-height:1.4}
.rodbox .rl b{color:var(--wood)}
.rodbox .rl small{display:block;font-size:10px;font-weight:400;color:var(--muted)}
.rodbox input{width:100%;margin-top:7px;border:1.5px solid var(--line);border-radius:9px;
  padding:9px 6px;text-align:center;font-size:16px;font-weight:700;color:var(--ink)}
.rodbox input:focus{border-color:var(--wood);outline:none}
.rodbox .rp{margin-top:5px;font-size:10.5px;color:var(--muted)}
.whoswitch{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.whoswitch .who{display:flex;align-items:center;gap:8px;padding:11px 12px;border:1.5px solid var(--line);
  border-radius:11px;background:#fff;text-align:right;color:var(--muted);transition:.15s}
.whoswitch .who span{display:block;font-size:12.5px;font-weight:700;line-height:1.35}
.whoswitch .who small{display:block;font-size:10.5px;font-weight:400;color:var(--muted)}
.whoswitch .who.on{border-color:var(--brand);background:#EAF2FA;color:var(--navy)}
.whoswitch .who.on .i{color:var(--brand)}
.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 11px;
  font-family:inherit;font-size:14px;font-weight:700;resize:vertical;background:#fff;color:var(--ink)}
.fld textarea:focus{border-color:var(--brand);outline:none}
.focusrow .changedoor{width:auto;flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:9px 13px;font-size:12px}
.door{text-align:center;padding:0;min-width:0}
.door .leaf{
  position:relative;width:100%;aspect-ratio:3/4;border-radius:9px;overflow:hidden;
  border:2px solid var(--line);background:#E9EEF4;
  transform-origin:right center;transition:transform .25s ease,border-color .18s,box-shadow .18s;
  box-shadow:0 1px 4px rgba(0,32,80,.1);
}
.door .leaf img{width:100%;height:100%;object-fit:cover;display:block}
.door .leaf.noimg{background:linear-gradient(160deg,#B9CBDD,#4A6580)}
.door .leaf.noimg::before{
  content:attr(data-code);position:absolute;inset:0;display:grid;place-items:center;
  font-family:Arial,'Helvetica Neue',sans-serif;font-size:16px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);
}
.door.on .leaf{border-color:var(--wood);transform:perspective(620px) rotateY(-12deg);box-shadow:-6px 4px 18px rgba(166,100,47,.32)}
.door .zoombadge{
  position:absolute;top:5px;inset-inline-end:5px;width:24px;height:24px;border-radius:50%;
  background:rgba(0,20,50,.55);color:#fff;display:grid;place-items:center;font-size:13px;
  backdrop-filter:blur(2px);z-index:2;
}
.door .code{display:block;font-size:12px;font-weight:600;margin-top:7px;font-family:Arial,'Helvetica Neue',sans-serif}
.door .nm{display:block;font-size:10.5px;color:var(--muted);line-height:1.3}
.door.on .code{color:var(--wood)}

/* ============ الشرايح ============ */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border:1.5px solid var(--line);border-radius:10px;background:#FCFDFE;font-size:13.5px;font-weight:500;text-align:center}
.chip.on{background:var(--navy);border-color:var(--navy);color:#EAF2FA}
.chip .sub{display:block;font-size:10.5px;color:var(--muted);font-weight:400;margin-top:-2px}
.chip.on .sub{color:#9CB6D2}
.chip .ic{display:block;font-size:20px;line-height:1.2;margin-bottom:1px}

.box{margin-top:11px;padding:11px;background:#F7FAFD;border:1px dashed var(--brand);border-radius:11px}
.note{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.55}
.note b{color:var(--brand)}
/* ============ العداد ============ */
.qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;width:fit-content;background:#FCFDFE}
.qty.sm{transform:scale(.78);transform-origin:center}
.qty.sm input{width:42px}
.sizeToggleRow{display:flex;flex-flow:row wrap;gap:7px;justify-content:center}
.sizeToggleRow .colchip{width:auto;flex:1 1 76px}
.sizeCard{margin-top:11px;padding:11px 12px;background:#F7FAFD;border:1.5px solid #DCEAF6;border-radius:13px}
.sizeCard .scHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.sizeCard .scHead b{font-size:14px;color:var(--navy)}
.sizeCard .fld.sm{margin-top:8px}
.sizeCard .fld.sm span{font-size:10.5px}
.hgtIn{width:100%;text-align:center;border:1.5px solid var(--line);border-radius:8px;
  padding:6px 2px;font-size:12px;background:#FCFDFE}
.hgtIn:focus{border-color:var(--brand);outline:none}
.hgtIn::placeholder{color:#AEBBC8}
.miniLbl{font-size:10px;color:var(--muted);font-weight:600;margin-top:9px;margin-bottom:4px}
.miniChips{display:flex;flex-wrap:wrap;gap:6px}
.miniChip{border:1.5px solid var(--line);border-radius:9px;padding:6px 10px;font-size:11.5px;
  font-weight:600;color:var(--ink);background:#fff}
.miniChip.on{background:var(--navy);border-color:var(--navy);color:#EAF2FA}
.miniChip:active{opacity:.85}
.miniChip.iconChip{display:inline-flex;align-items:center;gap:5px}
.qty button{width:40px;height:40px;font-size:19px;font-weight:600;color:var(--brand);display:grid;place-items:center}
.qty button:active{background:#EDF3F9}
.qty input{width:54px;text-align:center;border:0;border-inline:1.5px solid var(--line);border-radius:0;padding:10px 0;background:transparent}

/* ============ الأزرار ============ */
.btn{display:block;width:100%;padding:13px;border-radius:13px;font-family:Arial,'Helvetica Neue',sans-serif;font-size:14px;font-weight:600;text-align:center;transition:transform .1s,box-shadow .15s;font-variant-emoji:text}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--navy);color:#EAF2FA}
.btn.brand{background:linear-gradient(180deg,var(--brand-lt),var(--brand));color:#fff;box-shadow:0 3px 10px rgba(16,128,192,.28)}
.btn.wood{background:linear-gradient(180deg,var(--wood-lt),var(--wood));color:#fff;box-shadow:0 3px 10px rgba(166,100,47,.3)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.sm{padding:10px;font-size:12.5px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}
/* شبكة أزرار مضغوطة لشاشة المصنع — أصغر وأكتر تنظيمًا من .btnrow العادية */
.toolgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:5px;margin-top:10px}
.toolgrid .btn{padding:7px 4px;font-size:10px;border-radius:9px;line-height:1.25}
.cardacts{display:flex;flex-wrap:nowrap;gap:4px;margin-top:9px;overflow-x:auto;padding-bottom:2px}
.cardacts .btn{padding:6px 4px;font-size:9.5px;border-radius:8px;flex:1 1 0;min-width:0}

/* ألوان موحّدة حسب وظيفة الزرار — عشان العين تفرّق بينهم بسرعة من غير ما تقرا */
.toolgrid .btn,.cardacts .btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.toolgrid .btn i,.cardacts .btn i{font-style:normal;font-size:15px;line-height:1;font-variant-emoji:text}
.toolgrid .btn svg,.cardacts .btn svg{width:15px;height:15px}
.btn.act-edit  {background:#EAF2FA;border:1.5px solid #9CC6E4;color:#0B4A7A}
.btn.act-send  {background:#E7F3EE;border:1.5px solid #8FC7B0;color:#14603F}
.btn.act-arch  {background:#FFF6E5;border:1.5px solid var(--warn-line);color:#8A6512}
.btn.act-del   {background:#FDECEA;border:1.5px solid #E8A9A3;color:var(--danger)}
.btn.act-tool  {background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.btn.act-report{background:#F1EEFA;border:1.5px solid #B7ABDD;color:#40308A}
.btn.act-money {background:var(--wood-bg);border:1.5px solid var(--wood-line);color:var(--wood)}
.btn:disabled{opacity:.55}

/* ============ الإكسسوارات ============ */
.acc{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.acc:last-of-type{border-bottom:0}
.acc .an{flex:1;min-width:0}
.acc .an b{display:block;font-size:13px;font-weight:500}
.acc .an span{font-size:11px;color:var(--muted)}
.acc .qty{transform:scale(.84);transform-origin:left center}

/* ============ السلة ============ */
.line{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.line:last-of-type{border-bottom:0}
.line img{width:44px;height:60px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:0 0 auto}
.line .ic{width:44px;height:60px;display:grid;place-items:center;background:#EDF3F9;border-radius:6px;font-size:20px;flex:0 0 auto}
.line .info2{flex:1;min-width:0}
.line .info2 b{font-size:13px;font-weight:600;display:block}
.line .info2 .spec{font-size:11.5px;color:var(--muted);line-height:1.55}
.line .info2 .pr{font-size:12.5px;color:var(--wood);font-weight:600;margin-top:2px}
.line .del{color:var(--danger);font-size:18px;padding:0 4px;align-self:flex-start}
.line .lineacts{display:flex;flex-direction:column;align-items:center;gap:6px;align-self:flex-start}
.line .edit{font-size:15px;padding:0 4px;line-height:1}

.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;margin-top:6px;border-top:2px solid var(--wood)}
.total .lbl{font-size:13px;color:var(--muted)}
.total .val{font-family:Arial,'Helvetica Neue',sans-serif;font-size:21px;font-weight:700;color:var(--wood)}
.total .val small{font-size:12px;font-weight:400;color:var(--muted)}

/* ============ طلباتي ============ */
.ord{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:11px;box-shadow:var(--shadow)}
.ord .oh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.ord .oid{font-family:Arial,'Helvetica Neue',sans-serif;font-weight:700;color:var(--brand);font-size:14px}
.ord .od{font-size:11px;color:var(--muted)}
.ord .os{font-size:12.5px;color:var(--muted);line-height:1.6}
.ord .oa{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.ord .oa .btn{padding:9px;font-size:12.5px}

.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .em{font-size:38px;display:block;margin-bottom:10px;opacity:.45}

/* ============ التوست + اللودر ============ */
#toast{
  position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));inset-inline:16px;z-index:95;
  background:var(--navy);color:#EAF2FA;padding:13px 16px;border-radius:12px;font-size:13.5px;text-align:center;
  box-shadow:0 6px 22px rgba(0,32,80,.35);opacity:0;transform:translateY(14px);pointer-events:none;transition:.2s;
}
#toast.show{opacity:1;transform:translateY(0)}
#busy{position:fixed;inset:0;z-index:99;background:rgba(0,32,80,.55);display:none;place-items:center;color:#fff;font-size:14px}
#busy.on{display:grid}
#busy .b{background:var(--navy);padding:20px 26px;border-radius:14px;text-align:center}
#busy .sp{width:26px;height:26px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;margin:0 auto 10px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ============ الشريط السفلي ============ */
.bar{position:fixed;bottom:0;inset-inline:0;z-index:50;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.bar .inner{max-width:660px;margin:0 auto;display:flex;align-items:center;gap:11px}
.bar .sum{flex:0 0 auto;line-height:1.25}
.bar .sum b{display:block;font-family:Arial,'Helvetica Neue',sans-serif;font-size:16px}
.bar .sum span{font-size:11px;color:var(--muted)}
.bar .btn{flex:1;width:auto}

.foot{text-align:center;font-size:11px;color:var(--muted);padding:8px 0 4px}

/* ============ المستند (عرض سعر / طلب) ============ */
#paper{position:fixed;top:-10000px;left:-10000px;width:794px;background:#fff}
/* ============================================================
   طبقة التحديث البصري — v108
   ------------------------------------------------------------
   مكتوبة كطبقة فوق التصميم الأصلي عشان أي حاجة مش مذكورة هنا
   تفضل شغّالة زي ما هي بالظبط. اللي اتغيّر:
   • شريط التبويبات بقى بقرص متحرّك بدل خط تحت — أوضح وبيتحرك بنعومة
   • الكروت والأزرار بقى لهم سلّم ظلال وزوايا موحّد بدل ظل واحد لكل حاجة
   • فتح وقفل اللوحات بقى فيه حركة قصيرة (١٨٠ مللي) بدل ما يظهر فجأة
   • مساحات اللمس كبرت للحد الآمن (44px) عشان الضغط ما يغلطش
   ============================================================ */

/* ---------- الأيقونات: سُمك أنعم ووضوح أعلى على الشاشات الصغيرة ---------- */
.i{stroke-width:1.75;shape-rendering:geometricPrecision}
.i.lg{stroke-width:1.7}
.tabs button .i{stroke-width:1.8;transition:transform var(--t-med) var(--ease-out),color var(--t-fast)}

/* ---------- شريط التبويبات ---------- */
.tabs{
  background:var(--card);border-bottom:1px solid var(--line-soft);
  padding:6px 6px calc(4px + env(safe-area-inset-bottom,0px));gap:4px;
  box-shadow:0 1px 0 rgba(12,32,64,.04);
}
.tabs button{
  border-bottom:0;border-radius:var(--r-md);padding:7px 2px 6px;min-height:52px;
  gap:4px;font-size:11px;position:relative;isolation:isolate;
  transition:color var(--t-fast) var(--ease);
}
/* القرص المتحرّك ورا الأيقونة — هو ده اللي بيبيّن التبويب الشغّال */
.tabs button::before{
  content:'';position:absolute;inset:0;z-index:-1;border-radius:var(--r-md);
  background:linear-gradient(180deg,#EAF4FC,#DCEDFA);
  opacity:0;transform:scale(.86);
  transition:opacity var(--t-med) var(--ease-out),transform var(--t-med) var(--ease-out);
}
.tabs button.on::before{opacity:1;transform:scale(1)}
.tabs button.on{color:var(--navy);font-weight:700}
.tabs button.on .i{color:var(--brand);transform:translateY(-1px) scale(1.06)}
.tabs button:active{transform:scale(.96)}
.tabs .badge{
  top:2px;inset-inline-end:calc(50% - 21px);
  background:linear-gradient(180deg,#E05A4E,#C33B2E);
  box-shadow:0 1px 4px rgba(195,59,46,.4);border:1.5px solid var(--card);
}

/* ---------- الهيدر ---------- */
#appbar::after{height:2.5px;opacity:.9}
.top{box-shadow:0 1px 12px rgba(0,32,80,.22)}
.top img.logo{box-shadow:0 2px 8px rgba(0,0,0,.18)}
.wh-chip{border-radius:var(--r-sm);backdrop-filter:saturate(1.4)}
.verstrip button{
  border-radius:var(--r-sm);min-height:32px;
  transition:background var(--t-fast),transform var(--t-fast) var(--ease);
}
.verstrip button:active{transform:scale(.95)}

/* ---------- الكروت ---------- */
.card{
  border-radius:var(--r-lg);border-color:var(--line-soft);
  box-shadow:var(--e2);margin-bottom:12px;
}
.card::before{opacity:.045}
/* الكروت اللي بره الشاشة مش بتتحسب في الرسم — الفرق بيبان في شاشة المصنع
   لما يكون فيه عشرات الطلبات: التمرير بيبقى ناعم بدل ما يتهتّ. */
.wrap>.card{content-visibility:auto;contain-intrinsic-size:auto 320px}

.step .n{border-radius:var(--r-sm);box-shadow:0 2px 8px rgba(16,128,192,.28)}

/* ---------- شريط الأقسام ---------- */
.secnav{gap:7px}
.secnav button{
  border-radius:var(--r-md);border-color:var(--line-soft);box-shadow:var(--e1);
  min-height:62px;
  transition:border-color var(--t-fast),background var(--t-fast),
             box-shadow var(--t-fast),transform var(--t-fast) var(--ease);
}
.secnav button:active{transform:scale(.97)}
.secnav button.on{box-shadow:0 0 0 1.5px var(--brand),var(--e2)}

/* ---------- الأزرار ---------- */
.btn{
  border-radius:var(--r-md);min-height:44px;
  transition:transform var(--t-fast) var(--ease),box-shadow var(--t-med) var(--ease),
             background var(--t-fast),opacity var(--t-fast);
}
.btn:active{transform:scale(.97)}
.btn.brand{box-shadow:0 2px 4px rgba(16,128,192,.18),0 6px 16px rgba(16,128,192,.24)}
.btn.brand:active{box-shadow:0 1px 3px rgba(16,128,192,.2)}
.btn.wood{box-shadow:0 2px 4px rgba(166,100,47,.18),0 6px 16px rgba(166,100,47,.24)}
.btn.primary{box-shadow:0 2px 4px rgba(0,32,80,.2),0 6px 16px rgba(0,32,80,.18)}
.btn.ghost{border-color:var(--line-soft);box-shadow:var(--e1)}
.btn.sm{min-height:38px;border-radius:var(--r-sm)}
.toolgrid{gap:6px}
.toolgrid .btn,.cardacts .btn{min-height:40px;border-radius:var(--r-sm);box-shadow:none}
.cardacts{gap:5px;scrollbar-width:none;-ms-overflow-style:none}
.cardacts::-webkit-scrollbar{display:none}

/* ---------- خانات الإدخال ---------- */
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=date],input[type=search],select,textarea{
  border-radius:var(--r-sm);border-color:var(--line-soft);min-height:44px;
  transition:border-color var(--t-fast),box-shadow var(--t-fast),background var(--t-fast);
}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px rgba(16,128,192,.14)}
input.bad{box-shadow:0 0 0 3px rgba(179,38,30,.1)}

/* ---------- الشريط السفلي ---------- */
.bar{box-shadow:0 -2px 10px rgba(12,32,64,.06),0 -10px 30px rgba(12,32,64,.08)}

/* ---------- التوست ---------- */
#toast{border-radius:var(--r-md);box-shadow:var(--e3)}

/* ---------- الحركة: ظهور اللوحات والكروت ---------- */
@keyframes riseIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* الحركة بتشتغل بس لما المستخدم يبدّل تبويب — مش مع كل ضغطة زرار.
   لو سابناها عامة كانت الكروت هتعيد الحركة مع كل +/- وده هيبان اهتزاز. */
#view.enter>.card{animation:riseIn var(--t-med) var(--ease-out) both}
#view.enter>.card:nth-child(2){animation-delay:.03s}
#view.enter>.card:nth-child(3){animation-delay:.06s}
#view.enter>.card:nth-child(n+4){animation-delay:.09s}

/* لو المستخدم مفعّل «تقليل الحركة» في نظامه، كل ده بيتلغي (القاعدة فوق في أول الملف) */

/* ---------- شاشات أكبر: عرض أوسع ومسافات أريح ---------- */
@media (min-width:720px){
  .wrap{max-width:760px;padding:18px}
  .card{padding:16px}
  .tabs button{font-size:12px}
}
/* ---------- تصحيحات شكل (v108) ---------- */
/* شريط الأقسام: خمس أزرار في شبكة أربعة كانت بتسيب الزرار الأخير لوحده في سطر.
   تلاتة في الصف بيدّي توزيع متوازن (3 + 2 في النص) ومساحة لمس أكبر. */
.secnav{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}
.secnav button{flex:1 1 calc(33.333% - 7px);min-width:96px;max-width:none}

/* الأيقونات جوه الحالات الفاضية والصور المصغّرة — كانت مقاسة لإيموجي بالخط */
.empty .em{opacity:.35;line-height:0}
.empty .em .i{width:52px;height:52px;stroke-width:1.4}
.line .ic .i{width:24px;height:24px;color:var(--muted);stroke-width:1.7}
.chip .ic,.specol .colchip .ic{line-height:0}
.lineacts .i{width:18px;height:18px}

/* أزرار فيها أيقونة + كلام: مسافة ثابتة بينهم بدل ما تعتمد على مسافة النص */
.btn .i{margin-inline-end:6px}
.toolgrid .btn .i,.cardacts .btn .i{margin-inline-end:0}

/* شارة السلة: تختفي وهي صفر بدل ما تفضل «0» أحمر على طول */
.tabs .badge.zero{display:none}
/* ---------- معاينة التقرير على الشاشة ----------
   بتعرض نفس اللي بيطلع في الـ PDF بالظبط، من غير ما تشغّل html2canvas ولا jsPDF —
   فبتفتح فورًا. التقرير مرسوم بعرض A4 ثابت (794px) فبنصغّره بـ transform:scale
   عشان يدخل في عرض الموبايل من غير تمرير أفقي. */
.rpv{position:fixed;inset:0;z-index:320;background:rgba(4,14,32,.96);display:flex;flex-direction:column}
.rpv-bar{
  display:flex;align-items:center;gap:8px;flex:0 0 auto;
  padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
  background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#EAF2FA;
  box-shadow:0 2px 14px rgba(0,0,0,.35);
}
.rpv-bar b{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rpv-bar button{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;min-height:38px;
  border-radius:var(--r-sm);font-size:12px;font-weight:700;padding:0 12px;
  transition:transform var(--t-fast) var(--ease),background var(--t-fast);
}
.rpv-bar button:active{transform:scale(.95)}
.rpv-pdf{background:linear-gradient(180deg,var(--brand-lt),var(--brand));color:#fff}
.rpv-x{background:rgba(255,255,255,.14);border:1px solid rgba(159,209,240,.35);color:#EAF2FA;padding:0 10px}
.rpv-scroll{
  flex:1;overflow:auto;-webkit-overflow-scrolling:touch;
  padding:10px 8px calc(14px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;
  direction:ltr;   /* التقرير جواه بيحدد اتجاهه بنفسه — ده عشان حساب التصغير يبقى متوقّع */
}
/* الغلاف بياخد المقاس بعد التصغير، والصفحة جواه بعرضها الأصلي ومتصغّرة.
   من غير الغلاف ده، العنصر المصغّر بيفضل واخد مساحته الأصلية (794px) في التخطيط
   فيظهر تمرير أفقي وفراغ كبير تحت التقرير. */
.rpv-fit{flex:0 0 auto;overflow:hidden;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.rpv-page{
  /* نفس عرض #paper بالظبط (794px = A4) عشان المعاينة تطابق الـ PDF شكلاً وتوزيعًا.
     من غير العرض ده التقرير كان بيتضغط على عرض الموبايل والأعمدة تتلخبط،
     فالمعاينة تبقى مضلّلة — المصنع يشوف حاجة والملف يطلع حاجة تانية. */

<script>
'use strict';

/* ============================================================
   الإعدادات
   ============================================================ */
const ASSETS = {
  logo:'img/logo.png',
  mark:'img/mark.png',
  doors:{
    A01:'img/doors/A01.jpg',
    A02:'img/doors/A02.jpg',
    A03:'img/doors/A03.jpg',
    A04:'img/doors/A04.jpg',
    A05:'img/doors/A05.jpg',
    A06:'img/doors/A06.jpg',
    A07:'img/doors/A07.jpg',
    A08:'img/doors/A08.jpg',
    A09:'img/doors/A09.jpg',
    A010:'img/doors/A010.jpg',
    A015:'img/doors/A015.jpg'
  }
};

// اللوجو والصور بقت ملفات منفصلة بدل ما تكون base64 جوه الكود (أخف وبتتكاش لوحدها).
// الدالة دي بتجيب اللوجو كـ base64 مرة واحدة بس وتخزّنه — محتاجينه بالشكل ده لمكتبة الإكسيل (ExcelJS).
let _logoB64Cache = null;
async function logoBase64_(){
  if(_logoB64Cache) return _logoB64Cache;
  try{
    const res = await fetch(ASSETS.logo);
    const blob = await res.blob();
    _logoB64Cache = await new Promise((resolve,reject)=>{
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result).split(',')[1]);
      fr.onerror = reject;
      fr.readAsDataURL(blob);
    });
  }catch(e){ _logoB64Cache = null; }
  return _logoB64Cache;
}

// بنحمّل صور الأبواب واللوجو بدري في الخلفية عشان تبقى جاهزة في كاش المتصفح
// وقت ما المستخدم يفتح لوحة اختيار الباب أو يعمل تصدير PDF/صورة (بدل ما تتأخر في اللحظة دي).
function preloadDoorImages_(){
  // كان بيبدأ 13 تحميل صورة مع أول لحظة فتح فيزاحم رسم الشاشة نفسها.
  // دلوقتي بيستنى المتصفح يفضى (requestIdleCallback) فالفتحة بقت أسرع محسوسًا.
  const go = () => {
    [ASSETS.logo, ASSETS.mark, ...Object.values(ASSETS.doors)].forEach(src=>{
      const im = new Image(); im.decoding = 'async'; im.src = src;
    });
  };
  (window.requestIdleCallback || (fn => setTimeout(fn, 1200)))(go, { timeout: 3000 });
}

/* ============================================================
   تحميل المكتبات التقيلة عند الطلب (Lazy loading)
   ------------------------------------------------------------
   قبل كده كانت 4 مكتبات (~2.4 ميجا) بتتحمّل في <head> مع كل فتحة للتطبيق،
   حتى لو المستخدم مش هيصدّر أي حاجة. ده كان بيأخّر ظهور الشاشة الأولى ثواني
   على الموبايل. دلوقتي كل مكتبة بتتحمّل أول مرة تتطلب فيها بس، والوعد بتاعها
   بيتخزّن فمافيش تحميل مكرر، والـ Service Worker بيكاشها فالمرات الجاية فورية.
   ============================================================ */
const LIB_URLS = {
  html2canvas:'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
  jspdf      :'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  exceljs    :'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'
};
const LIB_READY = {
  html2canvas:()=>typeof html2canvas!=='undefined',
  jspdf      :()=>!!window.jspdf,
  exceljs    :()=>typeof ExcelJS!=='undefined'
};
const _libPromises = {};
function ensureLib_(name){
  if(LIB_READY[name] && LIB_READY[name]()) return Promise.resolve(true);
  if(_libPromises[name]) return _libPromises[name];
  _libPromises[name] = new Promise((resolve, reject)=>{
    const sc = document.createElement('script');
    sc.src = LIB_URLS[name];
    sc.async = true;
    const fail = () => { delete _libPromises[name]; sc.remove(); reject(new Error(name)); };
    sc.onload = () => {
      // ⚠️ onload لوحده مش كفاية. لو الشبكة اعترضت الطلب ورجّعت صفحة HTML بحالة 200
      // (بوابات الواي فاي العامة والفنادق بتعمل كده كتير)، الوسم بيعتبرها «تحميل ناجح»
      // والمكتبة مش موجودة أصلًا. ساعتها الكود كان هيكمّل ويقع على html2canvas is not
      // defined من غير ما المستخدم يشوف أي رسالة — يدوس PDF ومفيش أي رد فعل.
      // فبنتأكد إن المكتبة عرّفت نفسها فعلاً قبل ما نقول إنها جاهزة.
      if(LIB_READY[name] && LIB_READY[name]()) resolve(true);
      else fail();
    };
    sc.onerror = fail;
    document.head.appendChild(sc);
  });
  return _libPromises[name];
}
// بتحمّل مجموعة مكتبات مع بعض وبتوري رسالة واضحة لو النت مقطوع.
// بترجّع true لو كله تمام، و false لو فشل — فكل مكان بيستخدمها بيعمل return عادي.
async function needLibs_(...names){
  const missing = names.filter(n => !(LIB_READY[n] && LIB_READY[n]()));
  if(!missing.length) return true;
  // ⚠️ كان فيه باج هنا: الدالة دي بتقفل شاشة «جارٍ التجهيز» في الآخر على طول.
  // بس هي بتتنده أحيانًا من جوه عملية أطول فاتحة الشاشة أصلًا (زي «تقرير كامل»)،
  // فكانت بتقفلها في نص الشغل والمستخدم يفتكر إن التطبيق علّق — والباقي (رسم
  // الصفحة وتحويلها PDF) هو أبطأ جزء أصلًا. دلوقتي بنرجّع الشاشة زي ما لقيناها.
  const wasOn = _busyOn, wasTxt = _busyTxt;
  busy(true,'جارٍ تجهيز الأدوات…');
  try{
    await Promise.all(missing.map(ensureLib_));
    return true;
  }catch(e){
    toast('محتاج نت أول مرة عشان يجهّز الملف — جرّب تاني وانت متصل');
    return false;
  }finally{
    if(wasOn) busy(true, wasTxt);   // العملية الأكبر لسه شغّالة — سيب الشاشة مفتوحة
    else busy(false);
  }
}
// أول ما المستخدم يفتح شاشة فيها تصدير، بنبدأ نجيب المكتبات في الخلفية بهدوء
// عشان أول ضغطة على «PDF» تبقى فورية بدل ما يستنى التحميل ساعتها.
let _libsWarmed = false;
function warmExportLibs_(){
  if(_libsWarmed) return;
  _libsWarmed = true;
  const go = () => { ensureLib_('html2canvas').catch(()=>{}); ensureLib_('jspdf').catch(()=>{}); };
  (window.requestIdleCallback || (fn=>setTimeout(fn,1500)))(go, {timeout:4000});
}

const APP_BUILD   = 'v124';
const COMPANY     = 'ELKORASHI DOORS';
const COMPANY_AR  = 'القرشي لأبواب WPC';
const WAREHOUSE   = 'مصنع إنشاص';
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw2aVRVaUVubR3w4a3weiQTHGp03SvMozh83NY3OtBD14n1YugCjbcWdYEJUPJb-s3E/exec';

/* ============================================================
   أطوال الأعواد الحقيقية (المصنع)
   الحلق بيتقطّع مقاسين: قائم ٢٢٠ سم (جنبي الباب) وعارضة حلق علوية ١١٠ سم (فوق الباب).
   البرور عود واحد ٢٢٦ سم.

const BROR_ROD_CM = 226;

   الباب بياخد: ٣ أعواد حلق — عودين ٢٢٠ سم (القوائم) + عود ١١٠ سم (عارضة الحلق العلوية)
                ٥ أعواد برور — كل عود ٢٢٦ سم
   الأرقام دي بتتحسب أوتوماتيك لكل باب وبتظهر في مستند الطلب
   عشان المصنع يعرف يقطّع على طول من غير حسابات بالإيد.

const FRAME_PER_DOOR = [

// نوع الحلق: "كامل" (طقم كامل شامل مع الباب زي المعتاد — من غير تفاصيل زيادة) أو "أعواد" (عدد أعواد إضافي منفصل، بيتكتب كملحوظة على الصنف)
function frameKindNote_(kind, rodQty, forDoors){

const DOOR_STD_HEIGHT = 215;
const PRICE_NOTE = 'الأسعار بعاليه حسب وقت التسعير وغير ملزمة إلا في حالة سداد المبلغ كامل أو نصفه.';

const DOORS = [
  {code:'A01', name:'أرو',   en:'Arrow',  img:ASSETS.doors.A01},
  {code:'A02', name:'خشبي',  en:'Wood',   img:ASSETS.doors.A02},
  {code:'A03', name:'أرو',   en:'Arrow',  img:ASSETS.doors.A03},
  {code:'A04', name:'خشبي',  en:'Wood',   img:ASSETS.doors.A04},
  {code:'A05', name:'بني',   en:'Brown',  img:ASSETS.doors.A05},

  {code:'A07', name:'بني',   en:'Brown',  img:ASSETS.doors.A07},
  {code:'A08', name:'زان',   en:'Beech',  img:ASSETS.doors.A08},
  {code:'A09', name:'شيري',  en:'Cherry', img:ASSETS.doors.A09},
  {code:'A010', name:'رمادي', en:'Grey',   img:ASSETS.doors.A010},
  {code:'A015', name:'أرو فاتح', en:'Light Arrow', img:ASSETS.doors.A015}
];
// خلفية/بردر شيبس "كود الباب" في أقسام الحلق/البرور/البروديوم — بتاخد لون قريب من اسم اللون نفسه
// (مش لون مسحوب من الصورة لأن الصور بتاعتنا لقطات لاستوديو/غرفة كاملة مش سواتش لون نضيف)
const DOOR_COLOR_SWATCH = {
  'أرو':       {bg:'#EAD9BC', border:'#C6A468'},
  'خشبي':      {bg:'#D7B685', border:'#A47C46'},
  'بني':       {bg:'#CDA379', border:'#96693D'},

};
// بتبني style="" جاهز لشيب كود باب — بترجع فاضي لو الشيب مختار (عشان مايكسرش هايلايت .chip.on الأزرق الغامق)
function doorChipStyle_(code, selected){

}

const SIZES = [{w:70,price:5200},{w:80,price:5200},{w:90,price:5400},{w:100,price:6000}];
// لون مختلف لكارت مقاس معيّن في مستند الأوردر/عرض السعر (docTotalsHTML) — عشان يتميّز بسرعة عن باقي المقاسات.
// عدّل المفتاح (رقم المقاس) والقيمة (اسم لون من SIZE_COLOR_PALETTE) حسب اللي محتاجه — سيبه فاضي {} لو مفيش تمييز مطلوب.
const SIZE_COLOR_OVERRIDES = { 100:'brick' };
const SIZE_COLOR_PALETTE = {
  brick: {bg:'#F6E4DA', border:'#E3B196', text:'#8A3A1E'},
  blue:  {bg:'#EAF2FA', border:'#B9D4EA', text:'#002050'}   // اللون الافتراضي (زي ما كان قبل كده)
};
function sizeColor_(w){ return SIZE_COLOR_PALETTE[SIZE_COLOR_OVERRIDES[w]] || SIZE_COLOR_PALETTE.blue; }
let CUSTOM_EXTRA = 300;
let HAFR_EXTRA = 600;   // باب حفر — زيادة ثابتة فوق سعر الباب العادي لنفس المقاس

/* الحلق — سعر المتر الطولي، وبيتباع بالعود 2.15 م */

const BRORS = [{size:'6×9',price:79.46},{size:'4×8',price:68.20}];
const BROR_ROD_M_DEFAULT = BROR_ROD_CM/100;   // 2.26 م — الطول القياسي، بيتغيّر لو حد طلب طول مختلف

/* ألواح بروديوم — سعر اللوح الواحد ثابت (مش بالمتر)، ومرتبط بكود/لون الباب زي الحلق والبرور */
let PRODIUM_PRICE = 1668;

/* تفريز الكالون */

const ACCESSORIES = [
  {id:'h1', name:'مقبض باب مودرن / نيو مودرن',  en:'Door Handle - Modern / New Modern',    price:230,  unit:'قطعة'},
  {id:'h2', name:'مقبض حمام مودرن / نيو مودرن', en:'Bathroom Handle - Modern / New Modern', price:250,  unit:'قطعة'},

];

const LS_PROFILE = 'wpc_profile', LS_CART = 'wpc_cart', LS_ORDERS = 'wpc_orders', LS_TAB = 'wpc_tab', LS_SECTION = 'wpc_section', LS_PRICES = 'wpc_prices', LS_PENDING = 'wpc_pending_sync';

// الزيادة بتتطبّق وقت طباعة عرض السعر بس — من غير ما تغيّر الأسعار المتخزّنة نفسها.
const PRICE_TIERS = {
  dist:     { label:'سعر جملة', labelEn:'Wholesale Price', doorAdd:0,   otherAdd:0   },
  showroom: { label:'سعر معرض', labelEn:'Showroom Price',    doorAdd:300, otherAdd:0.5 },

};

// الزيادات فوق (doorAdd/otherAdd) بتُستخدم بس كقيمة مبدئية أول مرة تفتح فيها شاشة تعديل الأسعار قبل ما تحفظ حاجة بنفسك.
const TIER_OVERRIDES = { showroom:{sizes:{},customExtra:null,hafrExtra:null,frames:{},brors:{},acc:{},panel:{}}, customer:{sizes:{},customExtra:null,hafrExtra:null,frames:{},brors:{},acc:{},panel:{}} };
const ACC_EN_TO_ID_ = {}; ACCESSORIES.forEach(a=>{ ACC_EN_TO_ID_[a.en] = a.id; });
// بيرجّع سعر الصنف على مستوى معيّن (جملة/معرض/عميل). لو الصنف ده اتحفظله سعر مخصوص لنفس المستوى بيترجع هو،
// وإلا بيترجع سعر الجملة + الزيادة الافتراضية للمستوى (fallback للأصناف اللي لسه محدّش عدّل سعرها بنفسه).
function tierPrice(basePrice, kind, tierKey, key){
  if(!tierKey || tierKey==='dist') return Number(basePrice)||0;
  const group = kind==='door'?'sizes':kind==='frame'?'frames':kind==='bror'?'brors':kind==='panel'?'panel':'acc';
  const ov = TIER_OVERRIDES[tierKey];
  if(ov){
    if(key==='customExtra'){ if(ov.customExtra!=null) return Number(ov.customExtra)||0; }
    else if(key==='hafrExtra'){ if(ov.hafrExtra!=null) return Number(ov.hafrExtra)||0; }
    else if(key!=null && ov[group] && ov[group][key]!=null){ return Number(ov[group][key])||0; }
  }
  const t = PRICE_TIERS[tierKey] || PRICE_TIERS.dist;
  const add = kind==='door' ? t.doorAdd : t.otherAdd;
  return (Number(basePrice)||0) + add;
}
// بيستخرج مفتاح الصنف (مقاس الباب/الحلق بالرقم، مقاس البرور، أو كود الإكسسوار) من صنف الطلب —
// المفتاح ده هو اللي بيتربط بيه سعر كل مستوى في TIER_OVERRIDES.
function tierKeyFor_(it, kind){
  if(kind==='door' || kind==='frame'){ const m=/^(\d+)/.exec(String(it.size||'')); return m?Number(m[1]):null; }
  if(kind==='bror') return it.size||null;
  if(kind==='panel') return 'prodium';
  if(kind==='acc') return ACC_EN_TO_ID_[it.title] || null;
  return null;
}

// أسعار الكتالوج (الأبواب/الحلق/البرور/الإكسسوارات) متخزّنة كأرقام ثابتة فوق —
// الدالتين دول بيسمحوا بتعديلها من شاشة المصنع وحفظ التعديل على نفس الجهاز.
function loadPriceOverrides_(){ try{ return JSON.parse(localStorage.getItem(LS_PRICES)||'{}'); }catch(e){ return {}; } }
function applyPriceOverrides(){
  const ov = loadPriceOverrides_();
  // توافق مع الشكل القديم (كان فيه سعر جملة بس، من غير مستويات معرض/عميل مخصوصة)
  const dist = ov.dist || ov;
  if(dist.sizes) SIZES.forEach(s=>{ if(dist.sizes[s.w]!=null) s.price=Number(dist.sizes[s.w])||0; });
  if(dist.customExtra!=null) CUSTOM_EXTRA = Number(dist.customExtra)||0;
  if(dist.hafrExtra!=null) HAFR_EXTRA = Number(dist.hafrExtra)||0;
  if(dist.frames) FRAMES.forEach(f=>{ if(dist.frames[f.cm]!=null) f.price=Number(dist.frames[f.cm])||0; });
  if(dist.brors) BRORS.forEach(b=>{ if(dist.brors[b.size]!=null) b.price=Number(dist.brors[b.size])||0; });
  if(dist.acc) ACCESSORIES.forEach(a=>{ if(dist.acc[a.id]!=null) a.price=Number(dist.acc[a.id])||0; });
  if(dist.panel && dist.panel.prodium!=null) PRODIUM_PRICE = Number(dist.panel.prodium)||0;
  ['showroom','customer'].forEach(tk=>{
    const t = ov[tk]; if(!t) return;
    if(t.sizes) TIER_OVERRIDES[tk].sizes = {...t.sizes};
    if(t.customExtra!=null) TIER_OVERRIDES[tk].customExtra = t.customExtra;
    if(t.hafrExtra!=null) TIER_OVERRIDES[tk].hafrExtra = t.hafrExtra;
    if(t.frames) TIER_OVERRIDES[tk].frames = {...t.frames};
    if(t.brors) TIER_OVERRIDES[tk].brors = {...t.brors};
    if(t.acc) TIER_OVERRIDES[tk].acc = {...t.acc};
    if(t.panel) TIER_OVERRIDES[tk].panel = {...t.panel};
  });
}
applyPriceOverrides();

function save(k,v){
  try{ localStorage.setItem(k,JSON.stringify(v)); return true; }
  catch(e){
    // المساحة اتملت؟ نجرّب نقصّ الطلبات القديمة ونعيد المحاولة — أحسن من إننا
    // نضيّع الطلب الجديد عشان طلبات من شهور.
    try{
      if(k===LS_ORDERS && Array.isArray(v) && v.length>12){
        const trimmed = v.slice(0, Math.max(12, Math.floor(v.length/2)));
        localStorage.setItem(k, JSON.stringify(trimmed));
        if(Array.isArray(state.orders)) state.orders = trimmed;
        return true;

      localStorage.removeItem('wpc_adm_rows');

// ⚠️ الكيبورد العربي على الموبايل بيكتب أرقام هندية (٠١٢٣٤٥٦٧٨٩) مش لاتينية.
// الموزع بيكتب رقمه ٠١٠١٢٣٤٥٦٧٨ — رقم صح تمامًا — والتطبيق كان بيقوله «رقم غلط»
// من غير ما يقوله ليه، ويمنعه من إرسال الطلب.
// وأخطر من كده: لو الرقم اتسجّل بالعربي، السيرفر بيشيل «كل اللي مش رقم» فبيمسح
// الرقم كله ويفضل فاضي — يعني الموزع ده مش هيلاقي طلباته أبدًا في «تابع طلبك»،
// ولا يقدر يلغي طلب.
// بنحوّل الأرقام الهندية (العربية والفارسية) للاتينية في أي مكان بنقرا فيه رقم.
function toLatinDigits_(v){
  return String(v == null ? '' : v)
    .replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 0x0660))   // ٠-٩ عربي
    .replace(/[\u06F0-\u06F9]/g, d => String(d.charCodeAt(0) - 0x06F0));  // ۰-۹ فارسي
}

function phoneOk(p){return /^0?1[0-9]{9}$/.test(toLatinDigits_(p).replace(/\s/g,''));}

// المطلوب/المحجوز لعملاء: بيجمع كل الطلبات المعلّقة (اللي لسه ما اتسلّمتش) وبيحسب المتبقي

async function loadReserved(force){
  const a = state.admin;
  if(a.reservedLoading) return;
  if(!force && a.reserved && Date.now()-a.reservedAt < 60000) return;   // كاش دقيقة
  a.reservedLoading = true; render();
  try{
    const orders = await fetchPendingOrders_();
    const map = {};
    (orders||[]).forEach(o=>{
      if(o.status==='Cancelled') return;
      (o.items||[]).forEach(it=>{
        if(it.type!=='Door') return;
        const qty = Number(it.qty)||0;
        const produced = Number(it.produced)||0;
        const remain = Math.max(0, qty-produced);
        if(remain<=0) return;
        const key = String(it.code||'').trim()+'|'+String(doorWidthGroup_(it.size) ?? it.size ?? '').trim();
        map[key] = (map[key]||0) + remain;
      });
    });
    a.reserved = map; a.reservedAt = Date.now();
  }catch(err){ /* المحجوز إضافة مساعدة — لو فشل مايوقفش الشاشة */ }
  a.reservedLoading = false; render();
}

function stockFor(code, sizeW){
  const rows = state.stock.rows;
  if(!rows || !code) return null;
  const want = String(sizeW==null?'':sizeW).trim();
  const hit = rows.find(r=>String(r.code).trim()===String(code).trim()
                        && String(r.size).trim()===want);
  return hit ? (Number(hit.qty)||0) : 0;
}
// إجمالي رصيد الكود على كل المقاسات — للشارة على كارت الباب
function stockTotalFor(code){
  const rows = state.stock.rows;
  if(!rows || !code) return null;
  return rows.filter(r=>String(r.code).trim()===String(code).trim())
             .reduce((n,r)=>n+(Number(r.qty)||0),0);
}

async function saveStockDrafts(){
  const a = state.admin;
  const keys = Object.keys(a.stockDraft).filter(k=>{
    const [c,w] = k.split('|');
    return Number(a.stockDraft[k]) !== Number(stockFor(c, Number(w))||0);
  });
  if(!keys.length){ toast('مفيش تعديلات'); return; }
  busy(true,'جارٍ حفظ الأرصدة…');
  let done=0, failed=0;
  for(const k of keys){
    const [code, w] = k.split('|');
    a.stockBusy = k;
    try{
      const d = await jsonp(APPS_SCRIPT_URL
        + '?action=setStock' + admParams_()
        + '&code=' + encodeURIComponent(code)
        + '&size=' + encodeURIComponent(w)
        + '&qty='  + encodeURIComponent(Math.max(0, Math.round(Number(a.stockDraft[k])||0))));
      if(d && d.ok) done++; else failed++;
    }catch(err){ failed++; }
  }
  a.stockBusy = null;
  a.stockDraft = {};
  await loadStock(true);          // نرجّع الأرصدة من السيرفر عشان الشاشة تطابقه
  busy(false);
  toast(failed ? ('اتحفظ '+done+' وفشل '+failed) : ('اتحفظت '+done+' أرصدة'));
}

// التاريخ المحلي بصيغة yyyy-mm-dd. مش toISOString() لأنها بتدّي التوقيت العالمي،
// ومصر UTC+2/+3 — فأي شغل بعد نص الليل كان بيتسجّل بتاريخ اليوم اللي فات.
function isoLocal_(ts){
  const d = (ts===undefined||ts===null) ? new Date() : new Date(ts);
  if(isNaN(d.getTime())) return '';
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function dateStr(ts){return new Date(ts).toLocaleDateString('ar-EG',{day:'2-digit',month:'2-digit',year:'numeric'});}
// نفس الفكرة بس بأرقام إنجليزية وشكل يوم/شهر/سنة ثابت — مستخدمة في صيغة "طلب أوردر رقم (...) بتاريخ ..." في المستند المطبوع
function dateStrDMY_(ts){
  const d=new Date(ts), p=n=>String(n).padStart(2,'0');
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear();
}

function allowedTabs(){ return ['new','cart','orders','admin']; }

/* ------------------------------------------------------------
   الرسم — نسخة سريعة
   ------------------------------------------------------------
   المشاكل اللي كانت موجودة واتصلّحت هنا:
   ١) كل ضغطة زرار (+/-، اختيار مقاس، شيك بوكس) كانت بتعيد بناء الشاشة كلها فورًا،
      ولو الكود نده render() أكتر من مرة في نفس اللحظة كانت بتتنفّذ كلها — شغل مكرر ملهوش لازمة.
      دلوقتي النداءات بتتجمّع وتتنفّذ مرة واحدة في أقرب إطار رسم (requestAnimationFrame).
   ٢) الكتابة في خانات الحلق/البرور كانت بتنده render() فالخانة بتتمسح من الصفحة،
      فالفوكس والكيبورد بيقفلوا بعد كل حرف. دلوقتي بنحفظ الخانة اللي فيها الفوكس
      ومكان المؤشر جواها وبنرجّعهم بعد الرسم.
   ٣) مكان التمرير (scroll) كان بيتهزّ لما يتغيّر طول الصفحة. بنثبّته دلوقتي.
   ------------------------------------------------------------ */

// بصمة تعرّف الخانة اللي فيها الفوكس عشان نلاقيها تاني بعد إعادة الرسم
function focusKey_(el){
  if(!el || !el.dataset || !el.dataset.act) return null;
  const d = el.dataset;
  const q = v => String(v).replace(/\\/g,'\\\\').replace(/"/g,'\\"');
  return ['act','k','w','i','id','idx','code','group','key','tier']
    .filter(n => d[n] != null)
    .map(n => '[data-'+n+'="'+q(d[n])+'"]')
    .join('');
}

function captureFocus_(){
  const el = document.activeElement;
  if(!el || !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return null;
  const sel = focusKey_(el);
  if(!sel) return null;
  let start=null, end=null;
  try{ start=el.selectionStart; end=el.selectionEnd; }catch(e){}
  return { sel, start, end };
}

function restoreFocus_(snap){
  if(!snap) return;
  const el = document.querySelector(snap.sel);
  if(!el || el===document.activeElement) return;
  try{
    el.focus({preventScroll:true});
    if(snap.start!=null && el.setSelectionRange) el.setSelectionRange(snap.start, snap.end);
  }catch(e){}
}

let _renderQueued = false;
let _lastRenderedTab = null;
// النداء العادي: بيتجمّع مع أي نداءات تانية في نفس اللحظة ويتنفّذ مرة واحدة
function render(){
  if(_renderQueued) return;
  _renderQueued = true;
  requestAnimationFrame(()=>{ _renderQueued = false; renderNow(); });
}

function renderNow(){
  _renderQueued = false;
  updateInstallGate();

  const nav=document.getElementById('tabs');
  const bar=document.getElementById('bar');
  nav.hidden=false;

  const allowed=allowedTabs();
  if(!allowed.includes(state.tab)) state.tab=allowed[0];
  save(LS_TAB, state.tab);
  document.querySelectorAll('#tabs button[data-tab]').forEach(b=>{
    b.hidden = !allowed.includes(b.dataset.tab);
  });

  const v=document.getElementById('view');
  const snap = captureFocus_();
  const sy = window.scrollY;

  // حركة الدخول للكروت بتتفعّل بس لما التبويب يتغيّر فعلاً
  const tabChanged = (_lastRenderedTab !== state.tab);
  _lastRenderedTab = state.tab;
  v.classList.toggle('enter', tabChanged);

  v.innerHTML = state.tab==='new' ? viewNew()
              : state.tab==='cart' ? viewCart()
              : state.tab==='admin' ? viewAdmin()
              : viewOrders();

  restoreFocus_(snap);
  // لو الصفحة قصرت فجأة المتصفح بيقفز لفوق — بنرجّع المكان زي ما كان
  if(snap && window.scrollY !== sy) window.scrollTo(0, sy);

  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===state.tab));
  const cb=document.getElementById('cartBadge');
  const cn=cartCount();
  cb.textContent=cn;
  cb.classList.toggle('zero', cn===0);   // «0» أحمر على طول فوق السلة كان مشوّش
  updateAdmBadge();

  const show = state.tab==='new' && state.cart.length>0;
  bar.hidden=!show;
  if(show){
    document.getElementById('barTotal').textContent=(pricesVisible()?money(cartTotal())+' ج':'—');
    document.getElementById('barCount').textContent=cartCount()+' صنف في السلة';
  }
  document.body.style.paddingBottom = show ? '104px' : '30px';

  // الشاشات اللي فيها تصدير: بنسخّن المكتبات في الخلفية عشان أول ضغطة تبقى فورية
  if(state.tab==='admin' || state.tab==='orders' || state.tab==='cart') warmExportLibs_();
}

  // لما يختار باب، بنعرض الباب ده لوحده + لوحة التفاصيل — باقي الأكواد بتختفي

function currentSummary(){
  const p=state.pick;
  if(!p.code) return '';
  const d=doorByCode(p.code);
  const widths = Object.keys(p.sizes).map(Number).sort((a,b)=>a-b);
  const customReady = p.customOn && Number(p.custom.w)>0 && Number(p.custom.h)>0;

  if(!widths.length && !p.customOn) return 'اختر مقاس واحد على الأقل.';
  if(p.customOn && !customReady) return 'اكتب العرض والارتفاع للمقاس الخاص.';
  for(const w of widths){
    const e=p.sizes[w];
    if(e.frame==null) return `اختر الحلق (أو «بدون حلق») لمقاس ${w} سم.`;
    if(e.dbror==null) return `اختر البرور (أو «بدون برور») لمقاس ${w} سم.`;
  }
  if(customReady && (p.custom.frame==null || p.custom.dbror==null)) return 'اختر الحلق والبرور للمقاس الخاص.';

  const parts=[]; let totalQty=0, totalPrice=0;
  widths.forEach(w=>{
    const e=p.sizes[w];
    const qty=Number(e.qty)||1; totalQty+=qty;
    const unit=priceForWidth(w,e.hafr); totalPrice+=unit*qty;
    let line=doorSizeText_(w+' سم',e.height)+' × '+qty;
    const bits=[];
    if(e.hafr) bits.push('حفر');
    if(e.frame) bits.push('حلق '+frameText_(e.frame,e.frameHeight));
    if(e.dbror) bits.push('برور '+e.dbror);
    if(bits.length) line+=' ('+bits.join('، ')+')';
    parts.push(line);
  });
  if(customReady){
    const w=Number(p.custom.w), h=Number(p.custom.h), qty=Number(p.custom.qty)||1;
    totalQty+=qty; totalPrice+=(priceForWidth(w,p.custom.hafr)+CUSTOM_EXTRA)*qty;
    let line=w+'×'+h+' سم (خاص) × '+qty;
    const bits=[];
    if(p.custom.hafr) bits.push('حفر');
    if(p.custom.frame) bits.push('حلق '+frameText_(p.custom.frame,p.custom.frameHeight));
    if(p.custom.dbror) bits.push('برور '+p.custom.dbror);
    if(bits.length) line+=' ('+bits.join('، ')+')';
    parts.push(line);
  }

  let t='باب '+d.code+' '+d.name+' — '+parts.join('، ')+' — إجمالي '+totalQty;
  if(pricesVisible()) t+=' = '+money(totalPrice)+' ج';
  t+=' (الحلق والبرور شامل مع الباب)';
  return t;
}

function viewCart(){
  if(!state.cart.length) return `<div class="empty"><span class="em">${ico("cart","xl")}</span><p>السلة فاضية — ارجع لتبويب «طلب جديد».</p></div>${verBar()}`;
  const priced=pricesVisible();

  const lines=state.cart.map((it,i)=>{
    const kindIcon = it.kind==='frame'?'ruler':it.kind==='bror'?'bror':it.kind==='panel'?'panel':'parts';
    const th = it.kind==='door' ? `<img src="${esc(it.img)}" alt="" loading="lazy" decoding="async" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ic',innerHTML:ico('door','lg')}))">`
             : `<div class="ic">${ico(kindIcon,'lg')}</div>`;
    let spec;
    if(it.kind==='door'){
      spec=doorSizeText_(it.sizeTxt,it.doorHeight)+(priced?' · '+money(it.unitPrice)+' ج':'')+' × '+it.qty;
      const inc=[]; if(it.frame) inc.push('حلق '+frameText_(it.frame,it.frameHeight)); if(it.dbror) inc.push('برور '+it.dbror);
      if(inc.length) spec+='<br>شامل: '+inc.join(' + ')+(priced?' — بدون سعر':'');
      if(it.note) spec+='<br><span style="color:#8A6512">'+esc(it.note)+'</span>';
    } else if(it.kind==='frame'||it.kind==='bror'){
      spec = it.isSet ? (it.qty+' طقم'+(priced?' — '+money(it.price)+' ج/طقم':''))
                       : (it.qty+' عود'+(it.rodCm?' × '+it.rodCm+' سم':'')+(priced?' — '+money(it.price)+' ج/عود':''));
    } else spec=(priced?money(it.price)+' ج × ':'× ')+it.qty;

    return `<div class="line">${th}<div class="info2"><b>${esc(it.title)}</b>
      <div class="spec">${spec}</div>${priced?`<div class="pr">${money(linePrice(it))} ج</div>`:''}</div>
      <div class="lineacts">
        <button class="edit" data-act="edit-line" data-i="${i}" title="تعديل" aria-label="تعديل">${ico("edit")}</button>
        <button class="del" data-act="del" data-i="${i}" title="حذف" aria-label="حذف">${ico("x")}</button>
      </div></div>`;}).join('');

  const ok=profileOk();
  const editing = !!state.editingId;
  return `
  <section class="card">
    <div class="step"><span class="n">✓</span><h2>مراجعة الطلب</h2></div>
    ${editing?`<div class="note" style="margin-top:0;background:#FFF6E5;color:#8A6512;border-radius:8px;padding:9px 12px">
      ${ico("edit")} بتعدّل الطلب <b>#${esc(state.editingId)}</b>${state.editingMeta?' — العميل: <b>'+esc(state.editingMeta.name||'')+'</b>':''} — الحفظ هيلغي الطلب القديم ده وهيعمل طلب جديد بالأصناف المعدّلة.
      ${state.editingMeta?`
      <div class="row2" style="margin-top:9px">
        <label class="fld"><span>اسم صاحب الأوردر <b class="req">*</b></span>
          <input type="text" value="${esc(state.editingMeta.customer||'')}" placeholder="لو اتغيّر" data-act="edit-meta-customer"></label>
        <label class="fld"><span>تليفون صاحب الأوردر</span>
          <input type="tel" inputmode="tel" value="${esc(state.editingMeta.customerPhone||'')}" placeholder="لو اتغيّر" data-act="edit-meta-phone"></label>
      </div>`:''}
      <label class="fld" style="margin-top:9px;max-width:230px">
        <span>تاريخ الطلب <span style="font-weight:400;color:var(--muted)">(نفس تاريخ الطلب الأصلي — تقدر تغيّره)</span></span>
        <input type="date" value="${esc(state.editingDate||'')}" data-act="edit-date">
      </label>

    </div>`:''}
    ${lines}
    ${priced?`<div class="total"><span class="lbl">الإجمالي التقديري</span><span class="val">${money(cartTotal())} <small>ج</small></span></div>
    <div class="note">${esc(PRICE_NOTE)}<br>تقدر تتابع حالة طلبك بعد الإرسال من تبويب «تابع طلبك».</div>`

function viewOrders(){
  if(!state.orders.length) return `<div class="empty"><span class="em">${ico("doc","xl")}</span><p>لسه مفيش طلبات مسجّلة على الجهاز ده.</p></div>${verBar()}`;
  const priced=pricesVisible();
  const t = state.track;
  const liveById = {};
  (t.rows||[]).forEach(r=>{ liveById[String(r.id)] = r; });

  const refreshBtn = `<button class="btn ghost sm" style="margin-bottom:12px" data-act="track-load" ${t.loading?'disabled':''}>
    ${t.loading?ico('clock')+' جارٍ تحديث الحالة…':ico('refresh')+' تحديث حالة الطلبات من المصنع'}</button>`;
  const errNote = t.err ? `<div class="note" style="color:var(--danger);margin-bottom:10px">${esc(t.err)}</div>` : '';

  const cards = state.orders.map(o=>{
    const live = liveById[String(o.id)];
    const locked = isOrderLocked_(live);
    const editBtn = locked
      ? `<button class="btn ghost sm" disabled title="الطلب دخل التنفيذ ومينفعش يتعدّل">${ico("lock")} اتقفل التعديل</button>`
      : `<button class="btn ghost sm" data-act="ord-edit" data-id="${esc(o.id)}">${ico("edit")} تعديل</button>`;
    const delBtn = locked
      ? `<button class="btn ghost sm" disabled title="الطلب دخل التنفيذ ومينفعش يتحذف">${ico("lock")} اتقفل الحذف</button>`
      : `<button class="btn ghost sm" data-act="ord-del" data-id="${esc(o.id)}">${ico("trash")} حذف</button>`;
    return `
    <div class="ord">
      <div class="oh"><span class="oid" title="الكود الداخلي: ${esc(o.id)}">${esc(orderNoText_(o))}</span>${Number(o.editCount)>0?`<span style="font-size:10px;font-weight:700;color:#8A6512;background:#FFF6E5;border:1px solid #E8C77A;border-radius:20px;padding:1px 8px">معدّل</span>`:''}${o.replacesId?`<span style="font-size:10.5px;font-weight:700;color:#B3261E;background:#FBE9E7;border-radius:20px;padding:2px 9px;display:inline-flex;align-items:center;gap:4px">${ico("undo")}تعديل على #${esc(o.replacesId)}</span>`:''}${live?statusPill(live.status):''}</div>
      <div class="os">${esc(dateStr(o.ts))} · ${o.items.length} صنف${priced?' · إجمالي '+money(o.total)+' ج':''}
        ${o.customer?`<br><b style="color:#0B4A7A">صاحب الأوردر: ${esc(o.customer)}</b>`:''}<br>
        ${esc(o.items.map(x=>x.title).slice(0,3).join('، '))}${o.items.length>3?'…':''}
        ${o.note?('<br><span style="color:#8A6512">ملاحظات: '+esc(o.note)+'</span>'):''}
        ${live && live.note?('<br><b style="color:var(--brand)">'+esc(live.note)+'</b>'):''}</div>
      <div class="oa">
        ${editBtn}
        <button class="btn ghost sm" data-act="ord-pdf"   data-id="${esc(o.id)}">${ico("doc")} PDF</button>
        <button class="btn ghost sm" data-act="ord-xls"   data-id="${esc(o.id)}">${ico("sheet")} إكسيل</button>
        <button class="btn ghost sm" data-act="resend"    data-id="${esc(o.id)}">${ico("send")} إرسال</button>
        ${delBtn}
      </div>
    </div>`;
  }).join('');

  return refreshBtn + errNote + cards
    + `<button class="btn ghost sm" data-act="all-xls" style="margin-bottom:12px">${ico("sheet")} تصدير كل الطلبات إكسيل</button>`
    + verBar();
}

   ============================================================ */
/* ============================================================
   الأيقونات — مجموعة SVG موحّدة (هوية بصرية ثابتة على كل الأجهزة)
   بديل الإيموجي اللي كان شكله بيختلف من موبايل للتاني.
   ============================================================ */
/* ============================================================
   تجهيز الصور والـ PDF — نسخة محسّنة ضد التهنيج
   المشاكل اللي كانت بتهنّج التطبيق واتحلّت هنا:
   ١) html2canvas بينسخ الصفحة كلها قبل ما يرسم، وصفحتنا فيها صور الأبواب
      كلها base64 (حجم كبير) — فكنا بندفع التكلفة دي في كل تصدير.
      الحل: نخفي شبكة الأبواب مؤقتًا وقت الرسم (onclone) فمابتتنسخش.
   ٢) scale ثابت ٢ حتى للتقارير الطويلة — كان بيطلع كانفس بملايين البكسلات
      فالمتصفح بيقع. الحل: scale بيتحسب حسب طول المستند مع سقف أقصى للبكسلات.
   ٣) الـ PDF الطويل كان بيحط نسخة كاملة من الصورة في كل صفحة (تكرار ضخم).
      الحل: بنقصّ كل صفحة لوحدها من الكانفس ونحطها بحجمها بس.
   ٤) العمليات التقيلة كانت بتقفل الواجهة تمامًا. الحل: بنسيب المتصفح
      يتنفّس بين الخطوات (yield_) فالشاشة تفضل تتحرك ومؤشر التحميل يبان.
   ============================================================ */

const MAX_CANVAS_PIXELS = 16e6;   // سقف آمن يشتغل على الموبايلات الضعيفة

// بتسيب المتصفح يرسم قبل ما نكمل — بتمنع تجميد الواجهة
function yield_(ms){
  return new Promise(r=>requestAnimationFrame(()=>setTimeout(r, ms||0)));
}

// بترسم محتوى #paper وترجّع canvas — بتظبط الـ scale لوحدها حسب الطول
async function renderPaper_(html, opts){
  const paper = document.getElementById('paper');
  paper.innerHTML = html;
  await yield_(60);                       // تفتح مجال للصور/الخطوط تتحمّل
  const el = paper.firstElementChild;
  const w = el.offsetWidth || 794;
  const h = el.offsetHeight || 1123;

  // scale المطلوب مقابل السقف المسموح
  let scale = (opts && opts.scale) || 2;
  // التقارير الطويلة (أكتر من ~4 صفحات A4) مش محتاجة دقة x2 — الفرق مش بيبان في PDF
  // بس الوقت والذاكرة بيتضاعفوا. بنقلّل الدقة تدريجيًا مع الطول فالتقرير بيطلع أسرع بكتير.
  const a4h = w * 1.414;
  if(h > a4h * 4)      scale = Math.min(scale, 1.5);
  else if(h > a4h * 2) scale = Math.min(scale, 1.75);
  const maxScale = Math.sqrt(MAX_CANVAS_PIXELS / Math.max(w*h, 1));
  if(scale > maxScale) scale = Math.max(1, maxScale);

  // لو مطلوب إن كل عنصر بيطابق selector معيّن يبدأ صفحة جديدة إجباريًا (مثلاً كل طلب في تقرير)،
  // بنسجّل مكانه بالبكسل (بمقياس canvas) قبل ما نمسح محتوى الورقة
  let breaksPx = null;
  if(opts && opts.breakSelector){
    const elTop = el.getBoundingClientRect().top;
    breaksPx = Array.from(el.querySelectorAll(opts.breakSelector))
      .map(n => Math.round((n.getBoundingClientRect().top - elTop) * scale))
      .filter(y => y > 0);
  }

  await yield_(0);
  const canvas = await html2canvas(el, {
    scale,
    backgroundColor:'#ffffff',
    useCORS:true,
    logging:false,
    imageTimeout:15000,
    removeContainer:true,
    // أهم سطر: بنشيل صور الكتالوج من النسخة اللي html2canvas بيرسمها
    onclone: doc => {
      doc.querySelectorAll('.rail, .secnav, .tabs, #view').forEach(n=>{
        if(!n.contains(doc.getElementById('paper'))) n.remove();
      });
    }
  });
  paper.innerHTML = '';
  await yield_(0);
  return { canvas, breaksPx };
}

// بتحوّل canvas لـ PDF بتقطيع صفحات حقيقي (مش تكرار نفس الصورة)

// بيحاول يشارك الملف مباشرة (بيظهر واتساب في شاشة المشاركة لو متاحة)، ولو مش متاحة بينزّله عادي
async function shareOrDownload_(blob, filename, title){
  try{
    const file = new File([blob], filename, {type: blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title: title||filename});
      return true;
    }
  }catch(err){
    if(err && err.name==='AbortError') return true;   // العميل قفل شاشة المشاركة، مش خطأ
  }
  downloadBlob(blob, filename);
  toast('اتحمّل الملف — افتح واتساب وابعته من المرفقات');
  return false;
}

// بتقطّع الـ canvas لصفحات A4. لو opts.hardBreaksPx موجودة، كل نقطة فيها بتبدأ صفحة جديدة إجباريًا
// (مثلاً بداية كل طلب في تقرير) — والمقطع اللي أطول من صفحة واحدة بيتقسّم تلقائي زي العادي جواه.
async function canvasToPdf_(canvas, filename, opts){
  opts = opts || {};
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF('p','mm','a4');
  const PW = 210, PH = 297;
  const FOOT_H = 5;                               // مساحة صغيرة أسفل الصفحة لرقم الصفحة بس
  const usableH = PH - FOOT_H;
  const pxPerMm = canvas.width / PW;
  const pageHpx  = Math.floor(usableH * pxPerMm); // المحتوى بيتقص على الارتفاع المتاح بس

  const hardBreaks = (opts.hardBreaksPx||[]).filter(y=>y>0 && y<canvas.height).sort((a,b)=>a-b);
  const segBounds = [0, ...hardBreaks, canvas.height];
  const segments = [];
  for(let i=0;i<segBounds.length-1;i++){
    if(segBounds[i+1] > segBounds[i]) segments.push([segBounds[i], segBounds[i+1]]);
  }

  const slice = document.createElement('canvas');
  // willReadFrequently:false + إعادة استخدام نفس اللوحة بدل ما نعيد حجزها كل صفحة.
  // تغيير width/height بيمسح اللوحة ويعيد حجز الذاكرة، وده كان بيتعمل لكل صفحة
  // حتى لما الطول مايكونش اتغيّر — أبطأ حاجة في تجهيز تقرير طويل.
  const ctx = slice.getContext('2d', { alpha:false });
  slice.width = canvas.width;

  let totalPages = 0;
  segments.forEach(([s,e])=>{ totalPages += Math.max(1, Math.ceil((e-s)/pageHpx)); });

  let pageIdx = 0;
  for(const [segStart, segEnd] of segments){
    const subPages = Math.max(1, Math.ceil((segEnd-segStart)/pageHpx));
    for(let j=0;j<subPages;j++){
      const sy = segStart + j*pageHpx;
      const sh = Math.min(pageHpx, segEnd - sy);
      if(slice.height !== sh) slice.height = sh;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0,0,slice.width,slice.height);
      ctx.drawImage(canvas, 0, sy, canvas.width, sh, 0, 0, canvas.width, sh);

      if(pageIdx > 0) pdf.addPage();
      pdf.addImage(slice.toDataURL('image/jpeg',0.88), 'JPEG', 0, 0, PW, sh / pxPerMm);

      if(totalPages > 1){
        pdf.setFontSize(8);
        pdf.setTextColor(120,130,145);
        pdf.text(String(pageIdx+1) + ' / ' + totalPages, PW/2, PH - 2.5, {align:'center'});
      }
      pageIdx++;
      if(pageIdx % 2 === 0) await yield_(0);          // منع تجميد الواجهة من غير ما نبطّأ التقرير
    }
  }
  if(opts.share){
    const blob = pdf.output('blob');
    await shareOrDownload_(blob, filename, filename);
    return;
  }
  pdf.save(filename);
}

const LOCKED_EDIT_STATUSES = ['In Progress','Ready','Delivered'];
function isOrderLocked_(live){ return !!(live && LOCKED_EDIT_STATUSES.includes(live.status)); }
// رقم الطلب زي ما بيبان للناس: الرقم التسلسلي (417) مش الكود الداخلي (2026-0417)،
// ومعدّل بيبقى مركّب (417/2) زي المستند بالظبط.
// ⚠️ باج كان هنا: الشاشات كانت بتعرض o.id (الكود الداخلي) والمستند بيعرض displayNo،
// فالموزع والمصنع كانوا شايفين رقمين مختلفين لنفس الطلب — وجع أول ما حد يكلّم حد.
function orderNoText_(o){
  if(!o) return '';
  const n = o.displayNo;
  if(!n) return '#' + (o.id || '');
  const ec = Number(o.editCount) || 0;
  return ec > 0 ? (n + '/' + ec) : String(n);
}

// معرّف ثابت للجهاز — بيتبعت مع نداءات شاشة المصنع عشان السيرفر يقدر يقفل
// الجهاز اللي بيحاول يخمّن كلمة السر لوحده، بدل ما يقفل الشاشة على كل الموظفين.
// مش سر ومش وسيلة تحقق — مجرد تفرقة بين الأجهزة.
function deviceId_(){
  let d = null;
  try{ d = localStorage.getItem('wpc_dev'); }catch(e){}
  if(!d){
    d = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,10);
    try{ localStorage.setItem('wpc_dev', d); }catch(e){}
  }
  return d;
}

// بتزوّد باراميترات شاشة المصنع (كلمة السر + معرّف الجهاز) على أي رابط
function admParams_(){
  return '&pw=' + encodeURIComponent(state.admin.pw || '') + '&dev=' + encodeURIComponent(deviceId_());
}

// بنستخدم JSONP (وسم script) بدل fetch — أضمن مع Apps Script ومفيش مشاكل CORS
function jsonp(url, timeout){
  return new Promise((res, rej) => {
    const cb = 'wpcb' + Date.now() + Math.floor(Math.random()*999);
    const sc = document.createElement('script');
    const t = setTimeout(() => { cleanup(); rej(new Error('انتهت المهلة')); }, timeout || 15000);
    function cleanup(){ clearTimeout(t); delete window[cb]; sc.remove(); }
    window[cb] = d => { cleanup(); res(d); };
    sc.onerror = () => { cleanup(); rej(new Error('تعذّر الاتصال')); };
    sc.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.body.appendChild(sc);
  });
}



async function loadTrack(){
  if(!APPS_SCRIPT_URL){ state.track.err='مفيش رابط سيرفر متظبّط'; render(); return; }
  state.track.loading = true; state.track.err = ''; render();
  try{
    const phone = String(state.profile.phone||'').trim();
    const d = await jsonp(APPS_SCRIPT_URL + '?action=list&phone=' + encodeURIComponent(phone));
    if(!d || !d.ok) throw new Error((d && d.error) || 'رد غير متوقع');
    state.track.rows = d.orders || [];
    state.track.at = Date.now();
    // بنحدّث رقم الطلب "العادي" وعدد التعديلات في النسخة المحلية من أي رد سيرفر بيوصلنا،
    // عشان لو الرد الأول وقت الإرسال ضاع (النت اتقطع) يتظبط تلقائي أول ما نفتح "تابع طلبك"
    let changedLocal=false;
    state.track.rows.forEach(r=>{
      const lo = state.orders.find(x=>String(x.id)===String(r.id));
      if(lo && r.displayNo && (lo.displayNo!==r.displayNo || lo.editCount!==r.editCount)){
        lo.displayNo=r.displayNo; lo.editCount=r.editCount||0; changedLocal=true;
      }
    });
    if(changedLocal) save(LS_ORDERS,state.orders);
  }catch(err){
    state.track.err = err.message || String(err);
  }
  state.track.loading = false; render();
}

/* ============================================================
   شاشة المصنع — تغيير حالة الطلب (بكلمة سر)
   ============================================================ */
// ⚠️ شاشة المصنع كانت بتفضل فاضية بتلف لحد ما السيرفر يرد. Apps Script بطيء
// بطبعه (بيصحّى من السكون + بيقرا الشيت كله)، فالمصنع كان بيستنى كل مرة يفتح
// الشاشة أو يبدّل تبويب.
// دلوقتي بنحفظ آخر قايمة وصلت، وبنعرضها فورًا وإحنا بنجيب الجديدة في الخلفية.
// الشاشة بتفتح على طول، والأرقام بتتحدّث لوحدها أول ما الرد يوصل.
const LS_ADM_CACHE = 'wpc_adm_rows';

function saveAdminCache_(rows){
  try{ localStorage.setItem(LS_ADM_CACHE, JSON.stringify({at:Date.now(), rows:rows||[]})); }catch(e){}
}
function loadAdminCache_(){
  try{
    const c = JSON.parse(localStorage.getItem(LS_ADM_CACHE)||'null');
    // بنسيبها ٧ أيام — أقدم من كده الأرقام بتبقى مضلّلة أكتر من إنها مفيدة
    if(c && Array.isArray(c.rows) && (Date.now()-c.at) < 7*24*3600*1000) return c;
  }catch(e){}
  return null;
}
function clearAdminCache_(){ try{ localStorage.removeItem(LS_ADM_CACHE); }catch(e){} }

async function adminLoad(){
  // فيه نسخة محفوظة ومفيش حاجة معروضة؟ اعرضها فورًا بدل شاشة الانتظار
  if(!state.admin.rows){
    const c = loadAdminCache_();
    if(c){
      state.admin.rows = c.rows;
      state.admin.open = true;
      state.admin.staleAt = c.at;       // عشان نقول للمستخدم إن دي نسخة محفوظة
    }
  }
  state.admin.loading = true; state.admin.err = ''; render();
  try{
    const d = await jsonp(APPS_SCRIPT_URL + '?action=list' + admParams_());
    if(!d || !d.ok) throw new Error((d && d.error) || 'رد غير متوقع');
    state.admin.rows = d.orders || [];
    state.admin.open = true;
    state.admin.staleAt = null;         // البيانات بقت من السيرفر مباشرة
    saveAdminCache_(state.admin.rows);
    sessionStorage.setItem('wpc_adm', state.admin.pw);
    markAdminSeen_(state.admin.rows);       // فتح الشاشة فعليًا = المصنع شاف كل الطلبات الحالية
    state.admin.pendingCount = 0; updateAdmBadge();
    if('Notification' in window && Notification.permission==='default') Notification.requestPermission();
    startAdminPolling();
  }catch(err){
    state.admin.err = err.message || String(err);
    // فشل التحديث وعندنا نسخة محفوظة معروضة؟ سيبها شغّالة بدل ما نقفل الشاشة
    // على المصنع — نسخة قديمة أحسن من شاشة فاضية وقت ما النت يقطع.
    if(!state.admin.staleAt) state.admin.open = false;
  }
  state.admin.loading = false; render();
}
