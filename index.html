// تعديل صنف موجود في السلة: بنشيله من السلة ونفتحله شاشة الاختيار بنفس بياناته
// جاهزة قدام العين — لما يدوس «أضف» تاني بيرجع يتضاف بالتعديلات الجديدة.
// ⚠️ باج كان هنا: الدالة دي بتشيل الصنف من السلة على طول وتحطّ بياناته في شاشة الاختيار.
// لو المستخدم غيّر رأيه (رجع لتبويب تاني، أو قفل التطبيق) الصنف كان بيضيع خالص من غير
// ما ياخد باله. دلوقتي بنمسك نسخة منه، وبنرجّعها تلقائي لو ساب الشاشة من غير ما يضيف.
let _pulledLine = null;

// بيصفّر شاشة الاختيار اللي editCartLine ملّتها ببيانات الصنف.
// ⚠️ لازم تتنده مع أي رجوع للصنف: من غيرها الصنف بيرجع للسلة والشاشة تفضل مليانة
// ببياناته، فأول ضغطة على «أضف» بتحطّه تاني — يعني نسختين من نفس الصنف.
function resetPickerFor_(kind){
  if(kind==='door'){
    state.pick = {code:'', sizes:{}, customOn:false, note:'',
      custom:{w:'',h:'',qty:'',frame:null,frameHeight:'',dbror:null,hafr:false,wood:false,print:false,
              frameKind:null,frameRodQty:'',frameForDoors:''}};
  } else if(kind==='frame'){
    state.fr = {cm:10, code:'', doorW:'', kind:'full', qty:1, brSize:'', brQty:5, brLen:'', nonStd:false,
                jamb:2, header:1, jambCm:220, headerCm:110, extra:[], rods:'', rodsCm:'', note:'', unit:'cm'};
  } else if(kind==='bror'){
    state.br = {size:'6×9', code:'', rods:1, len:BROR_ROD_M_DEFAULT, unit:'m'};
  } else if(kind==='mabra'){
    state.mb = {wall:10, wallCustom:false, wallTxt:'', code:'', doorW:'', custom:false, w:'', h:'', qty:1};
  } else if(kind==='panel'){
    state.pd = {code:'', qty:1};
  } else if(kind==='strip' || kind==='veneer'){
    state[METER_KINDS_[kind].st] = {code:'', qty:1};
  } else if(kind==='acc'){
    state.acc = {};
  }
}

// بيرجّع الصنف اللي اتسحب للتعديل لو المستخدم ما كمّلش التعديل
function restorePulledLine_(silent){
  if(!_pulledLine) return false;
  const { item, index, kind } = _pulledLine;
  _pulledLine = null;
  state.cart.splice(Math.min(index, state.cart.length), 0, item);
  saveCart_();
  resetPickerFor_(kind);          // لازم تتصفّر مع الرجوع، وإلا الصنف بيتكرر
  if(!silent) toast('رجّعنا «'+(item.title||'الصنف')+'» للسلة — التعديل ما اتكملش');
  return true;
}
// بيتنده بعد أي إضافة ناجحة — يعني التعديل خلص فعلاً ومفيش حاجة نرجّعها
function clearPulledLine_(){ _pulledLine = null; }

// ⚠️ السطر المدموج (قوائم + عوارض + أعواد إضافية) بيتخزّن على الشيت بوصفه بس:
// «قائم 200 سم × 4 + عارضة حلق علوية 120 سم × 2 + عود 180.5 سم × 2».
// لما الطلب كان بيرجع للتعديل، الأطوال دي مكانتش بتترجع لشاشة الحلق — فأول ما
// حد يسحب السطر ليعدّله بيتحوّل لطقم ٢٢٠/١١٠ استاندر من غير ما حد ياخد باله،
// والمصنع يقطّع الحلق غلط. الدالة دي بتقرأ التفصيل من النص وترجّعه زي ما كان.
function parseFrameBreakdown_(txt){
  // ⚠️ العدد كان `(\d+)` بأرقام صحيحة بس، والتقريب بعديه. بعد ما عدد الأعواد
  // بقى يقبل كسور، الوصف بيبقى فيه «× 1.5» — والـregex كان بياخد «1» ويسيب
  // «.5»، يعني نص عود يضيع من الطلب وإحنا بنفتحه للتعديل.
  const re = /(قائم|عارضة حلق علوية|عارضة|عود)\s+(\d+(?:\.\d+)?)\s*سم\s*(?:×|x)\s*(\d+(?:\.\d+)?)/g;
  const out = { jambCm:0, jambQty:0, headerCm:0, headerQty:0, extra:[] };
  let m, found=false;
  while((m = re.exec(String(txt||'')))){
    found = true;
    const cm = Number(m[2]), q = rodQty_(m[3]);
    if(!(cm>0) || q<=0) continue;
    if(m[1]==='قائم'){ out.jambCm = cm; out.jambQty += q; }
    else if(m[1].indexOf('عارضة')===0){ out.headerCm = cm; out.headerQty += q; }
    else out.extra.push({cm, qty:q});
  }
  if(!found) return null;
  const jSets = Math.floor(out.jambQty/JAMBS_PER_SET), hSets = Math.floor(out.headerQty/HEADERS_PER_SET);
  const sets = (out.jambQty && out.headerQty) ? Math.min(jSets, hSets) : Math.max(jSets, hSets);
  out.setsQty = Math.max(1, sets);
  // أي عود زيادة عن الأطقم الكاملة بيتحط كعود إضافي بطوله — ما يضيعش من الطلب
  const restJ = out.jambQty - out.setsQty*JAMBS_PER_SET;
  if(restJ>0 && out.jambCm) out.extra.push({cm:out.jambCm, qty:restJ});
  const restH = out.headerQty - out.setsQty*HEADERS_PER_SET;
  if(restH>0 && out.headerCm) out.extra.push({cm:out.headerCm, qty:restH});
  if(!out.jambCm) out.jambCm = 220;
  if(!out.headerCm) out.headerCm = 110;
  return out;
}

function editCartLine(i){
  const it = state.cart[i];
  if(!it) return;
  restorePulledLine_(true);                      // لو فيه تعديل سابق ما اتكملش، رجّعه الأول
  _pulledLine = { item: JSON.parse(JSON.stringify(it)), index: i, kind: it.kind };
  state.cart.splice(i,1);
  saveCart_();

  if(it.kind==='door'){
    const isHafr = !!it.hafr || /\(حفر\)|\(Carved\)/i.test((it.title||'')+(it.titleEn||''));
    const isWood = !!it.wood;
    const isPrint = !!it.print || PRINT_MARK_RE_.test((it.title||'')+(it.titleEn||''));
    let sizes={}, customOn=false, customW='', customH='', customQty=1, customFrame=null, customFrameHeight='', customDbror=null;
    let customFrameKind=null, customFrameRodQty='', customFrameForDoors='';
    let m = /^(\d+)\s*cm$/i.exec(it.sizeEn||'');
    if(m){
      sizes[Number(m[1])] = {
        qty:it.qty||1, height: it.doorHeight?String(it.doorHeight):'',
        frame: it.frame||0, frameHeight: it.frameHeight?String(it.frameHeight):'', dbror: it.dbror||'', hafr:isHafr, wood:isWood, print:isPrint,
        frameKind: it.frameKind||null, frameRodQty: it.frameRodQty||'', frameForDoors: it.frameForDoors||''
      };
    } else {
      m = /^(\d+(?:\.\d+)?)\s*x\s*(\d+(?:\.\d+)?)\s*cm\s*\(custom\)$/i.exec(it.sizeEn||'');
      if(m){
        customOn=true; customW=m[1]; customH=m[2]; customQty=it.qty||1;
        customFrame=it.frame||0; customFrameHeight=it.frameHeight?String(it.frameHeight):''; customDbror=it.dbror||'';
        customFrameKind=it.frameKind||null; customFrameRodQty=it.frameRodQty||''; customFrameForDoors=it.frameForDoors||'';
      }
    }
    state.pick = {code:it.code||'', sizes, customOn, note:it.note||'',
      custom:{w:customW,h:customH,qty:customQty,frame:customFrame,frameHeight:customFrameHeight,dbror:customDbror,hafr:isHafr,wood:isWood,print:isPrint,
        frameKind:customFrameKind,frameRodQty:customFrameRodQty,frameForDoors:customFrameForDoors}};
    state.newSection='doors'; save(LS_SECTION,state.newSection);
  } else if(it.kind==='frame' || it.kind==='bror'){
    const isFr = it.kind==='frame';
    if(isFr){
      let cm = FRAMES[0].cm;   // سُمك الحلق — مش طول، مالوش دعوة بوحدة الشاشة
      const mm=/^(\d+)/.exec(it.spec||''); if(mm) cm=Number(mm[1]);
      if(it.frCm!=null) cm = it.frCm;
      if(it.isSet){
        // سطر "حلق كامل" الموحّد — بنرجّع الكمية (عدد الأطقم) زي ما هي
        state.fr = {cm, code:it.code||'', doorW: it.doorW||'', note: it.note||'', kind:'full',
                    qty: it.qty||1, nonStd:false,
                    jamb:2, jambCm:220, header:1, headerCm:110,
                    extra: [], rods:'', rodsCm:'', unit:'cm'};
      } else if(it.customSet){
        // سطر "حلق كامل — أطوال مخصوصة" الموحّد — بنرجّع الأطوال والكمية زي ما هي.
        // السطور الراجعة من السيرفر (ومن سلات محفوظة قديمة) مافيهاش الحقول دي،
        // فبنقرا الأطوال من وصف السطر نفسه بدل ما نرجّع ٢٢٠/١١٠ غلط.
        const br = (it.jambCm || it.headerCm || (it.extra||[]).length)
                     ? null : parseFrameBreakdown_(it.spec || it.title || '');
        state.fr = {cm, code:it.code||'', doorW: it.doorW||'', note: it.note||'', kind:'full',
                    qty: it.setsQty || (br && br.setsQty) || 1, nonStd:true,
                    jamb:2, jambCm: it.jambCm || (br && br.jambCm) || 220,
                    header:1, headerCm: it.headerCm || (br && br.headerCm) || 110,
                    extra: ((it.extra && it.extra.length ? it.extra : (br ? br.extra : []))||[])
                             .map(x=>({cm:x.cm, qty:x.qty})), rods:'', rodsCm:'', unit:'cm'};
      } else {
        const rodCm = Number(it.rodCm)||220;
        // بنرجّع العدد في خانة المقاس الصح حسب طول العود المحفوظ — قائم/عارضة حلق علوية لو الطول قياسي، وإلا سطر أعواد حرة
        const isStdCm = (rodCm===220 || rodCm===110);
        const restoredQty = rodCm===220 ? rodQty_((it.qty||2)/2) : (it.qty||1);
        state.fr = {cm, code:it.code||'', doorW: it.doorW||'', note: it.note||'', kind: isStdCm?'full':'rods',
                    qty: isStdCm?restoredQty:1, nonStd:false,
                    jamb:   rodCm===220 ? (it.qty||1) : 0, jambCm:220,
                    header: rodCm===110 ? (it.qty||1) : 0, headerCm:110,
                    extra: [], rods: isStdCm?'':(it.qty||1), rodsCm: isStdCm?'':rodCm, unit:'cm'};
      }
    } else {
      let size = BRORS[0].size;
      const mm=/^([\d×xX]+)/.exec(it.spec||''); if(mm) size=mm[1].replace(/x|X/,'×');
      // الطول الراجع من السلة بالسنتي دايمًا — بنرجّعه بوحدة السنتي عشان
      // يتعرض زي ما هو من غير أي تحويل يضيّع كسر
      state.br = {size, code:it.code||'', rods:it.qty||1,
                  len: it.rodCm ? String(Number(it.rodCm)) : BROR_ROD_M_DEFAULT,
                  unit: it.rodCm ? 'cm' : 'm'};
    }
    state.newSection = isFr?'frame':'bror'; save(LS_SECTION,state.newSection);
  } else if(it.kind==='mabra'){
    const sp = parseMabraSpec_(it.spec) || {};
    const std = SIZES.some(z=>z.w===sp.w) && sp.h===DOOR_STD_HEIGHT;
    state.mb = {wall: MABRA_WALLS.includes(sp.wall)?sp.wall:10, wallCustom: !!sp.wall && !MABRA_WALLS.includes(sp.wall), wallTxt: (sp.wall && !MABRA_WALLS.includes(sp.wall)) ? String(sp.wall) : '', code:it.code||'', doorW: std?String(sp.w):'',
                custom: !std, w: std?'':String(sp.w||''), h: std?'':String(sp.h||''), qty: it.qty||1};
    state.newSection='mabra'; save(LS_SECTION,state.newSection);
  } else if(it.kind==='panel'){
    state.pd = {code:it.code||'', qty:it.qty||1};
    state.newSection='prodium'; save(LS_SECTION,state.newSection);
  } else if(it.kind==='strip' || it.kind==='veneer'){
    state[METER_KINDS_[it.kind].st] = {code:it.code||'', qty:it.qty||1};
    state.newSection=it.kind; save(LS_SECTION,state.newSection);
  } else if(it.kind==='acc'){
    state.acc = {}; state.acc[it.id]=it.qty;
    state.newSection='acc'; save(LS_SECTION,state.newSection);
  }

  state.tab='new'; render(); window.scrollTo({top:0,behavior:'smooth'});
  toast('عدّل البيانات وادوس «أضف» تاني عشان يتحدّث في السلة');
}

/* ============================================================
   الطلب
   ============================================================ */
function newOrderId(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  // ٣ حروف/أرقام عشوائية في الآخر عشان طلبين في نفس الثانية (وارد مع أكتر من موزع) ما ياخدوش نفس الرقم
  const rnd=Math.random().toString(36).slice(2,5).toUpperCase();
  return 'W'+String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())+rnd;
}

// تعديل الطلب من شاشة المصنع — بيحمّل أصناف الطلب في السلة ويفتح تبويب السلة،
// وبيحتفظ ببيانات صاحب الطلب الأصلي (اسم/موبايل/منطقة) عشان الحفظ ما يغيّرهاش لبيانات المصنع.
async function adminEditOrder(o){
  busy(true,'جارٍ تحميل أصناف الطلب…');
  let loaded;
  try{ loaded = await withOrderItems_(o, its => adminEditOrderWith_(o, its)); }
  finally{ busy(false); }
  return loaded;
}
function adminEditOrderWith_(o, its){
  // ⚠️ باج كان هنا: «تدعيم خشب» بند مستقل (مش حقل على سطر الباب)، والسيرفر
  // مش بيسجّل علامة "الباب ده عليه تدعيم" في صف الباب نفسه (زي ما بيسجّل
  // "milling" للحفر). فلو حد فتح تعديل الطلب من شاشة المصنع، كنا بنرجّع كل
  // الأبواب من غير wood خالص، وأول ما يتحفظ التعديل، saveCart_() كانت
  // بتمسح "تدعيم خشب" بصمت لأنها مش لاقيه أي باب معلّم عليه محتاج تدعيم.
  // الحل: نلمّ مقاسات الأبواب اللي أصلاً عندها سطر "تدعيم خشب" في الطلب،
  // ونعلّم عليها تاني وقت ما نرجّع الأبواب.
  // ⚠️ نفس الحكاية بالظبط بتنطبق على «طباعة» وعلى أي بند خدمة اختياري جاي.
  // كانت مكتوبة للتدعيم بالاسم — فأي بند جديد كان هيضيع بصمت مع أول تعديل.
  // بقت بتتبني من جدول SERVICE_LINES_ نفسه.
  const serviceLabels_ = {};
  SERVICE_LINES_.forEach(def=>{
    const re = new RegExp('^'+def.label.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*—\\s*');
    serviceLabels_[def.code] = new Set(
      (its||[]).filter(x=>x.type==='Accessory' && (String(x.code||'')===def.code || re.test(String(x.title||''))))
        .map(x=>String(x.title||'').replace(re,'').trim())
        .filter(Boolean)
    );
  });
  const woodLabels = serviceLabels_.WOOD;
  const printLabels = serviceLabels_.PRINT;
  state.cart = its.map(it=>{
    const qty = Number(it.qty)||0;
    const price = Number(it.unitPrice)||0;
    if(it.type==='Door'){
      const sizeTxt = arabicSizeText_(it.size);
      const doorHeight = Number(it.doorHeight)||0;
      const label = doorSizeText_(sizeTxt, doorHeight);
      const حفر = /\(حفر\)|\(Carved\)/i.test(String(it.title||'')) || !!String(it.milling||'').trim();
      // الكود بيتحوّل للجديد هنا كمان (مش في العرض بس): أي حفظ للطلب بعد
      // التعديل بيتسجّل بالكود الجديد، فالبيانات بتتنضّف مع الاستعمال
      return { kind:'door', title:arabicItemTitle_(it), titleEn:it.title||'', code:doorCode_(it.code||''),
               img:(DOORS.find(d=>d.code===doorCode_(it.code))||{}).img || '',
               sizeTxt, sizeEn:it.size||'', unitPrice:price, qty,
               w:it.width||'', frame:Number(it.frame)||0, dbror:it.dbror||'', frameHeight:Number(it.frameHeight)||0,
               doorHeight, hafr:حفر,
               wood:woodLabels.has(label),
               print:printLabels.has(label) || PRINT_MARK_RE_.test(String(it.title||'')),
               // ⚠️ عمود «الحفر» (Milling) كان بيضيع مع كل تعديل: السلة بترجع
               // من غير millEn، فالحفظ بيكتب الخانة فاضية. وarabicItemTitle_
               // بتقرا الحفر من الخانة دي — فالباب بيطلع في شاشة المصنع
               // وفي كل المستندات «باب A01» من غير «(حفر)»، وسعره لسه سعر
               // الحفر. يعني المصنع ينفّذه سادة والعميل دافع حفر.
               millEn: String(it.milling||'').trim() || (حفر ? 'Carved' : ''),
               note: it.itemNote||'' };
    }
    if(it.type==='Frame' || it.type==='Bror'){
      const isFr = it.type==='Frame';
      // ⚠️ باج كان هنا: السطر المدموج (قوائم + عوارض بأطوال مختلفة في سطر
      // واحد) كان بيرجع من السيرفر من غير علامته، فالسلة بتعرضه «٩ عود × ٢٠٠ سم»
      // — والحقيقة إن ٣ منهم عوارض ١٢٠ سم. التفصيل موجود في وصف الصنف بس
      // مكانش بيتعرض. يعني المصنع ممكن يقطّع ٣ أعواد أطول ٨٠ سم من اللازم.
      // بنعرف السطر المدموج من وحدته الجديدة ('rods')، ومن وصفه كمان عشان
      // الطلبات اللي اتسجّلت قبل التعديل ده تتعرض صح برضه.
      // («سم × عدد» — البرور «6×9» مابيتلخبطش معاها لأن مفيش «سم» قبل الـ×)
      const مدموج = String(it.unit||'')==='rods' || /سم\s*×\s*\d+/.test(String(it.size||''));
      // ⚠️ الوحدة بقت ممكن تكون بطول كسري ('rod 220.5cm')، والـregex كان
      // بياخد الجزء الصحيح بس — فالطول بيرجع ٢٢٠ والنص سنتي بيضيع من الطلب.
      const rodCm = مدموج ? null : (String(it.unit||'').match(/^rod\s+(\d+(?:\.\d+)?)/)||[])[1];
      // ⚠️ سطر «الحلق الكامل» كان بيرجع من السيرفر من غير علامة الطقم، فالسلة
      // تعرضه «٥ عود» بدل «٥ طقم» — ولو الطلب اتبعت تاني بيتسجّل ٥ أعواد بدل ١٥.
      const طقم = isFr && (String(it.unit||'')==='set' || /^حلق كامل/.test(String(it.size||'')));
      // سُمك الحلق (١٠ سم…) مش موجود في وصف السطر المدموج — بناخده من الاسم الإنجليزي
      const frCm = isFr ? Number((String(it.title||'').match(/Frame\s+(\d+(?:\.\d+)?)\s*cm/i)||[])[1]) : 0;
      // وتفصيل الأطوال بيترجع من الوصف عشان تعديل السطر ما يحوّلوش لطقم استاندر
      const br = (isFr && مدموج) ? parseFrameBreakdown_(it.size||'') : null;
      return { kind:isFr?'frame':'bror', key:(isFr?'حلق':'برور')+(it.size||'')+'|'+(it.code||''),
               title:arabicItemTitle_(it), titleEn:it.title||'', code:it.code||'',
               spec:it.size||'', price, qty, rodCm: طقم ? 0 : (rodCm?Number(rodCm):undefined),
               customSet: مدموج || undefined, isSet: طقم || undefined,
               frCm: (isFr && frCm>0) ? frCm : undefined,
               setsQty: br ? br.setsQty : undefined,
               jambCm: br ? br.jambCm : undefined, headerCm: br ? br.headerCm : undefined,
               extra: br ? br.extra : undefined,
               doorW: it.forDoorWidth||'', note: it.itemNote||'' };
    }
    if(METER_TYPE_TO_KIND_[it.type]){
      const mk = METER_TYPE_TO_KIND_[it.type];
      return { kind:mk, key:mk+'|'+(it.code||''),
               title:arabicItemTitle_(it), titleEn:it.title||'', code:it.code||'',
               spec:it.size||'', price, qty, unit:it.unit||'متر' };
    }
    if(it.type==='Mabra'){
      return { kind:'mabra', key:'mabra|'+(it.code||'')+'|'+(it.size||''),
               title:arabicItemTitle_(it), titleEn:it.title||'', code:it.code||'',
               spec:it.size||'', price, qty, unit:it.unit||'معبرة' };
    }
    if(it.type==='Panel'){
      return { kind:'panel', key:'panel|'+(it.code||''),
               title:arabicItemTitle_(it), titleEn:it.title||'', code:it.code||'',
               spec:it.size||'', price, qty, unit:it.unit||'لوح' };
    }
    return { kind:'acc', id:it.code||it.title||'', title:arabicItemTitle_(it), titleEn:it.title||'',
             price, qty, unit:it.unit||'' };
  });
  saveCart_();

  enterEditMode_(o, {
    date: o.date || isoLocal_(),
    meta: { name:o.dist||'', phone:o.phone||'', region:o.region||'', customer:o.customer||'', customerPhone:o.customerPhone||'' }
  });
}

// الدخول في وضع تعديل الطلب. المسارين (الموزّع من «تابع طلبك»، والمصنع من
// شاشته) كانوا بيظبّطوا نفس الحقول الخمسة كل واحد لوحده — ودي بالظبط الحقول
// اللي لو واحد نسي حقل فيها، رقم الطلب أو تاريخه يطلع غلط في المستند.
// بيدوّر على الطلب في القايمة النشطة والأرشيف مع بعض.
// ⚠️ باج كان هنا: سبع أزرار في كارت الطلب (PDF/سعر/إرسال/الأصناف/تعديل/…) كانت
// بتدوّر في state.admin.rows بس. الأرشيف بيعرض نفس الأزرار، والطلب المؤرشف مش
// في القايمة دي — فالزرار كان بيتضغط ومفيش أي حاجة تحصل ولا رسالة تظهر.
// تلات أزرار بس كانوا بيدوّروا في الاتنين. بقى نداء واحد للكل.
// ⚠️ التوستات وتأكيد الحذف كانوا بيكتبوا الكود الداخلي (#W260904-1234ABC)
// والمصنع شايف على الكارت الرقم التسلسلي (#33) — فمش عارف الرسالة دي بتتكلم
// عن أنهي طلب. وده على زرار حذف نهائي. بنكتب الرقم اللي هو شايفه.
function adminOrderNoText_(id){
  const o = adminOrderById_(id);
  return o ? orderNoText_(o) : ('#' + id);
}
function adminOrderById_(id){
  const key = String(id);
  return (state.admin.rows||[]).find(x=>String(x.id)===key)
      || (state.admin.archRows||[]).find(x=>String(x.id)===key)
      || null;
}

function enterEditMode_(o, opts){
  opts = opts || {};
  // ⚠️ الملاحظة العامة على الطلب كانت بتضيع مع التعديل: الخانة بتتصفّر بعد كل
  // إرسال، وحد ما كان بيرجّعها هنا — فالطلب المعدّل بيروح للمصنع من غير الملاحظة
  // اللي مكتوبة على الطلب الأصلي. بناخدها من الطلب نفسه (o.note جوّه الجهاز،
  // ordNote من صف المصنع).
  state.orderNote = String(o.note || o.ordNote || '');
  state.editingId = o.id;
  state.editingMeta = opts.meta || null;
  state.editingDate = opts.date || isoLocal_(o.ts);
  state.editingDisplayNo = o.displayNo || '';
  state.editingEditCount = Number(o.editCount) || 0;
  state.editingDue = (o.due || o.dueDate || ((state.track.rows||[]).find(r=>String(r.id)===String(o.id))||{}).due || '');
  state.tab = 'cart'; render(); window.scrollTo({top:0, behavior:'smooth'});
  toast('بتعدّل الطلب '+orderNoText_(o)+' — عدّل السلة واضغط «حفظ التعديل»');
}

/* ---------- استرجاع طلب من نص ----------
   الطلب ممكن يضيع من الجهاز ومن السيرفر مع بعض (زي ما حصل مع طلب كبير فشل
   إرساله في صمت). المستند المطبوع بيبقى فيه كل التفاصيل، فبدل ما الموزّع
   يدخّل ١٥ صنف تاني بالإيد، بيلزق نص الطلب هنا ويراجعه ويحفظ. */
function importOrderText_(){
  const txt = prompt('الصق نص الطلب المحفوظ هنا:');
  if(!txt || !txt.trim()) return;
  let data;
  try{ data = JSON.parse(txt.trim()); }
  catch(e){ toast('النص مش مقروء — اتأكد إنك نسخته كامل', 4500); return; }
  const items = Array.isArray(data) ? data : (data && data.items);
  if(!Array.isArray(items) || !items.length){ toast('مفيش أصناف في النص ده', 4000); return; }
  // بنتأكد إن كل صنف شكله صح قبل ما نحط حاجة في السلة
  const سليم = items.filter(it => it && it.kind && (Number(it.qty)||0) > 0);
  if(!سليم.length){ toast('الأصناف في النص ده مش مكتملة', 4000); return; }
  state.cart = JSON.parse(JSON.stringify(سليم));
  saveCart_();
  if(data && data.profile){
    ['name','phone','region'].forEach(k=>{ if(data.profile[k]) state.profile[k] = data.profile[k]; });
    save(LS_PROFILE, state.profile);
  }
  if(data && data.customer && data.customer.name) state.customer = {
    name: data.customer.name, phone: data.customer.phone || '' };
  const عدد = سليم.reduce((n,it)=>n+(Number(it.qty)||0), 0);
  toast('اترجّع '+سليم.length+' صنف ('+عدد+' قطعة) — راجعهم كويس واضغط «حفظ وإرسال»', 6000);
  state.tab='cart'; render(); window.scrollTo({top:0,behavior:'smooth'});
}

function draftOrder(){
  // لو المصنع بيعدّل طلب عميل، بنحافظ على بيانات العميل الأصلي مش بيانات جهاز المصنع
  const m = state.editingMeta;
  // لو بنعدّل طلب، بناخد نفس تاريخ الطلب الأصلي (أو التاريخ اللي اتغيّر يدويًا) بدل تاريخ النهاردة
  const ts = (state.editingId && state.editingDate)
    ? new Date(state.editingDate + 'T12:00:00').getTime()
    : Date.now();
  return {
    id:newOrderId(), ts,
    name: m ? m.name : state.profile.name,
    phone: m ? m.phone : state.profile.phone,
    region: m ? m.region : state.profile.region,
    warehouse:WAREHOUSE, items:JSON.parse(JSON.stringify(state.cart)), total:cartTotal(),
    // صاحب الأوردر: إجباري من v84 — بيتسجّل زي ما اتكتب
    customer: m ? (m.customer||'') : state.customer.name.trim(),
    customerPhone: m ? (m.customerPhone||'') : state.customer.phone.trim(),
    note: state.orderNote.trim(),
    replacesId: state.editingId || '',   // لو ده تعديل لطلب قديم، بنحتفظ برقمه هنا عشان يبان في الطباعة/الرسالة
    // رقم الطلب "العادي" بيتورّث من الطلب الأصلي وقت التعديل (فاضي = السيرفر هيدّي رقم جديد تسلسلي)
    displayNo: state.editingId ? (state.editingDisplayNo || '') : '',
    editCount: state.editingId ? (Number(state.editingEditCount||0) + 1) : 0,
    // تاريخ التعديل نفسه. الطلب المعدّل بياخد تاريخ الطلب الأصلي عن قصد (عشان
    // يفضل محتفظ بتاريخه)، فتاريخ التعديل مكانش متسجّل في أي مكان. بنسجّله هنا
    // عشان يبان جنب رقم التعديل في المستند: «معدّل 52/1 — بتاريخ ...»
    editedAt: state.editingId ? isoLocal_() : '',
    dueDate: state.editingId ? (state.editingDue || '') : ''   // ميعاد الاستلام بيتورّث من الطلب القديم
  };
}

function buildMessage(o){
  const priced=pricesVisible();
  let m='🚪 طلب أوردر — '+COMPANY+'\n';
  // ⚠️ باج كان هنا: الرسالة كانت بتكتب الكود الداخلي (#W260904-1234ABC) بينما
  // المستند المطبوع وكل شاشات التطبيق بيكتبوا الرقم التسلسلي (52). يعني نفس
  // الطلب ليه رقمين مختلفين — واحد على واتساب وواحد على الورق. نفس الباج اللي
  // اتصلّح للشاشات والمستند قبل كده، بس قناة الواتساب فاتت.
  m+='رقم الطلب: '+orderNoText_(o)+(o.displayNo?' (الكود الداخلي: '+o.id+')':'')+'\n';
  if(o.replacesId) m+='🔁 تعديل على الطلب رقم: '+prevOrderNoText_(o)+'\n';
  m+='الاسم: '+(o.name||'-')+'\n';
  m+='المنطقة: '+(o.region||'-')+'\n';
  m+='الموبايل: '+(o.phone||'-')+'\n';
  if(o.customer) m+='صاحب الأوردر: '+o.customer+'\n';
  if(o.customerPhone) m+='تليفون صاحب الأوردر: '+o.customerPhone+'\n';
  m+='المخزن: '+WAREHOUSE+'\n';
  if(o.note) m+='ملاحظات: '+o.note+'\n';
  m+='——————\n';
  // «خدمة قص» بتبان في عرض السعر بس. «تدعيم خشب» بيفضل — دي رسالة بتروح
  // للمصنع كمان، ولازم يعرف إن الباب ده عليه تدعيم.
  (o.items||[]).filter(it=>!quoteOnlyLine_(it)).forEach((it,i)=>{
    m+=(i+1)+'. '+it.title+'\n';
    if(it.kind==='door'){
      m+='   المقاس: '+doorSizeText_(it.sizeTxt,it.doorHeight)+' — الكمية: '+it.qty+'\n';
      const inc=[]; if(it.frame) inc.push('حلق '+frameText_(it.frame,it.frameHeight)); if(it.dbror) inc.push('برور '+it.dbror);
      if(inc.length) m+='   شامل مع الباب: '+inc.join(' + ')+'\n';
    } else if(it.kind==='frame'||it.kind==='bror'){
      m+='   '+it.qty+(it.isSet?' طقم':' عود')+(priced?' × '+money(it.price)+' ج':'')+'\n';
    } else m+='   الكمية: '+it.qty+' '+(it.unit||'')+'\n';
  });
  m+='——————\n';
  if(priced){
    m+='الإجمالي التقديري: '+money(o.total)+' جنيه\n';
    m+='شكرًا لتعاملك مع '+COMPANY_AR+'\n';
  } else {
    m+='هيتواصل معاك المصنع بالتفاصيل والسعر.\n';
  }
  m+='تقدر تتابع حالة الطلب من تبويب «تابع طلبك» في التطبيق.';
  return m;
}

function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

// بيجهّز صورة الطلب (نفس تصميم المستند) وبيفتح شاشة المشاركة الأصلية بتاعة الموبايل —
// العميل يختار هو المستلم بنفسه (واتساب أو أي حد)، زي تطبيق القطاعات بالظبط.
// لو الجهاز مبيدعمش المشاركة (كمبيوتر مثلًا)، بننزّل الصورة ويبعتها العميل يدويًا.
async function shareOrderImage(o){
  if(!await needLibs_('html2canvas')) return;

  // لو رقم الطلب التسلسلي لسه ما وصلش (رد السيرفر اتأخر أو ضاع)، بنسأل السيرفر عنه
  // قبل ما نرسم الصورة — عشان ما يظهرش الكود الداخلي الطويل (W261014-...) مكان الرقم.
  if(!o.displayNo && APPS_SCRIPT_URL){
    busy(true,'جارٍ تأكيد رقم الطلب…');
    try{ await verifyOrderArrived_(o, 3); }catch(e){}
    busy(false);
  }

  busy(true,'جارٍ تجهيز صورة الطلب…');
  try{
    const {canvas} = await renderPaper_(docHTML(o,'order'));
    const blob=await new Promise(res=>canvas.toBlob(res,'image/png',0.95));
    const file=new File([blob],'طلب_'+orderNoText_(o).replace('/','-')+'.png',{type:'image/png'});

    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'طلب أوردر '+orderNoText_(o)});   // صورة بس، من غير نص مرفق
    } else {
      downloadBlob(blob,'طلب_'+orderNoText_(o).replace('/','-')+'.png');
      toast('اتحمّلت صورة الطلب — افتح واتساب وابعتها من المعرض');
    }
  }catch(err){
    if(err && err.name==='AbortError'){ busy(false); return; }   // العميل قفل شاشة المشاركة
    toast('تعذّر تجهيز صورة الطلب');
  }
  busy(false);
}

/* ============================================================
   إرسال الطلب للسيرفر مع تأكيد فعلي للوصول (بدل الإرسال الأعمى القديم)
   ============================================================ */
/* السيرفر ممكن يرفض الطلب لسببين مختلفين تمامًا:
     • رفض مؤقت (حد استخدام، نت قطع) → إعادة المحاولة هي الحل
     • رفض دائم (شكل الطلب غلط) → إعادة المحاولة عمرها ما هتنجح
   من غير التفرقة دي التطبيق كان هيقول «لسه ما وصلش، هنحاول تاني» ويفضل
   يحاول للأبد على طلب السيرفر رافضه — والموزّع مستني على الفاضي. */
let _lastSendError = null;
async function sendOrderToServer_(o){
  _lastSendError = null;
  const payload = JSON.stringify(o);
  // ⚠️ الشرط القديم كان `payload.length < 6000` — بيقيس النص الخام. لكن الحروف العربية
  // بتتحوّل لـ %XX%XX في الرابط، يعني بتتضخّم 3 أضعاف تقريبًا. فطلب طوله 5999 حرف
  // كان بيوصل لرابط ~18000 حرف — أطول من اللي المتصفح وApps Script بيقبلوه، فبيفشل.
  // بنقيس الرابط النهائي نفسه دلوقتي، وبنسيب هامش أمان تحت الحد المتعارف عليه (8000).
  // معرّف الجهاز بيتبعت مع الطلب عشان حدود الاستخدام على السيرفر تبقى لكل
  // جهاز لوحده — من غيره كل الأجهزة بتتحاسب على دلو واحد مشترك.
  const jsonpUrl = APPS_SCRIPT_URL + '?action=newOrder&dev=' + encodeURIComponent(deviceId_())
                 + '&payload=' + encodeURIComponent(payload);
  if(jsonpUrl.length < 7500){
    try{
      const d = await jsonp(jsonpUrl);
      _lastSendError = (d && !d.ok) ? { msg: d.error || '', permanent: !!d.permanent } : null;
      if(d && d.ok && d.displayNo){
        // بنسجّل رقم الطلب "العادي" اللي السيرفر رجّعه على النسخة المحلية عشان يبان صح في أي طباعة/مشاركة لاحقة
        o.displayNo = d.displayNo; o.editCount = d.editCount||0;
        const idx = state.orders.findIndex(x=>String(x.id)===String(o.id));
        if(idx>-1){ state.orders[idx].displayNo=d.displayNo; state.orders[idx].editCount=d.editCount||0; saveOrders_(state.orders); }
      }
      return !!(d && d.ok);
    }catch(err){ return false; }
  }
  /* طلب كبير (أصناف كتير) — الرابط أطول من اللي JSONP بيستحمله، فبنبعت POST.
     ⚠️ ودي كانت أخطر نقطة في التطبيق: mode:'no-cors' معناه إننا مش شايفين رد
     السيرفر خالص، والدالة كانت بترجّع null = «اتبعت بس مش متأكدين».
     والنتيجة إن null مكانش بيتعامل معاه كفشل في أي مكان:
       • submitOrder كان بيمسح الطلب القديم على طول (الشرط sent === false بس)
       • syncOrder_ كان بيشيله من قايمة المعلّق فمايتبعتش تاني
     يعني لو الـPOST فشل في صمت، الطلب بيروح بالكامل: الجديد ما وصلش والقديم
     اتمسح ومحدش هيحاول تاني. وده بيحصل بالظبط للطلبات الكبيرة (١٥ صنف =
     رابط ١٦ ألف حرف). دلوقتي بنسأل السيرفر بنفسنا بدل ما نفترض. */
  try{
    await fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'newOrder', dev:deviceId_(), order:o})});
  }catch(err){ return false; }
  return await verifyOrderArrived_(o);
}

// بنسأل السيرفر: الطلب وصل ولا لأ؟ بنجرّب أكتر من مرة لأن Apps Script بياخد
// وقت لحد ما يكتب في الشيت. لو ما قدرناش نتأكد بنعتبره ما وصلش — والإرسال
// تاني آمن لأن السيرفر بيحدّث الصف بنفس الـid بدل ما يضيف صف جديد.
// ⚠️ كانت ٣ محاولات بفواصل ١.٥ + ٣ + ٤.٥ = ٩ ثواني إجمالي. ودي كفاية لطلب
// صغير، لكن الطلب الكبير (٦٠+ صنف) Apps Script بياخد وقت أطول وهو بيكتب سطوره
// في الشيت — فالتأكيد كان بيفشل، والتطبيق يستنتج «ما وصلش» ومايلغيش الطلب
// القديم. يعني بالظبط الطلبات الكبيرة اللي تعديلها أهم هي اللي كانت بتفشل.
// بقت ٦ محاولات (١.٥+٣+٤.٥+٦+٦+٦ ≈ ٢٧ ثانية) مع سقف للانتظار عشان
// ماتطولش بلا نهاية.
async function verifyOrderArrived_(o, tries){
  const مرات = tries || 6;
  for(let i = 0; i < مرات; i++){
    await new Promise(r=>setTimeout(r, Math.min(6000, 1500 * (i + 1))));
    try{
      const d = await jsonp(APPS_SCRIPT_URL + '?action=list&dev=' + encodeURIComponent(deviceId_())
        + '&phone=' + encodeURIComponent(o.phone||''));
      if(d && d.ok){
        const hit = (d.orders||[]).find(r=>String(r.id)===String(o.id));
        if(hit){
          if(hit.displayNo){
            o.displayNo = hit.displayNo; o.editCount = Number(hit.editCount)||0;
            const idx = state.orders.findIndex(x=>String(x.id)===String(o.id));
            if(idx>-1){
              state.orders[idx].displayNo = hit.displayNo;
              state.orders[idx].editCount = Number(hit.editCount)||0;
              saveOrders_(state.orders);
            }
          }
          return true;
        }
      }
    }catch(e){}
  }
  return false;
}

/* ---------- حفظ الطلبات: دمج مش كتابة فوق ----------
   ⚠️ ده كان سبب «طلبات النهاردة اختفت». التطبيق ممكن يكون مفتوح في أكتر من
   مكان (مثبّت + تاب في المتصفح)، وكل نسخة شايلة قايمة الطلبات في ذاكرتها.
   كل مسارات الحفظ كانت بتكتب القايمة اللي في الذاكرة فوق التخزين كله — فأول
   ما نسخة قديمة تحفظ أي حاجة، بتمسح الطلبات اللي النسخة التانية ضافتها.
   والطلب الجديد بيتحط في أول القايمة، فاللي بيضيع هو الأحدث — مش الأقدم.
   والـService Worker بيعمل reload لكل النسخ المفتوحة مع كل تحديث، فوقت
   التحديث هو أخطر وقت بالظبط.
   دلوقتي بنقرا اللي في التخزين ونضمّ اللي مش عندنا، وبنمشي على سجل المحذوف
   عشان اللي اتمسح عن قصد مايرجعش. */
function loadDeleted_(){ const v = load(LS_DELETED, []); return Array.isArray(v) ? v : []; }
function markDeleted_(id){
  if(!id) return;
  const list = loadDeleted_().filter(x=>String(x)!==String(id));
  list.unshift(String(id));
  save(LS_DELETED, list.slice(0,300));   // آخر ٣٠٠ كفاية — أقدم من كده مش هيرجع من حتة تانية
}
function saveOrders_(list){
  const اتمسح = new Set(loadDeleted_().map(String));
  // سجل الحذف بيتطبّق على القايمة الداخلة كمان — مش على اللي في التخزين بس.
  // من غير كده، نسخة تانية من التطبيق لسه شايلة الطلب المحذوف في ذاكرتها كانت
  // بترجّعه أول ما تحفظ أي حاجة.
  list = (list||[]).filter(o=>o && !اتمسح.has(String(o.id)));
  let stored = [];
  try{
    const raw = localStorage.getItem(LS_ORDERS);
    if(raw) stored = JSON.parse(raw) || [];
  }catch(e){ stored = []; }
  if(Array.isArray(stored) && stored.length){
    const عندنا = new Set(list.map(o=>String(o && o.id)));
    const زيادة = stored.filter(o=>o && !عندنا.has(String(o.id)) && !اتمسح.has(String(o.id)));
    if(زيادة.length) list = list.concat(زيادة).sort((a,b)=>(Number(b.ts)||0)-(Number(a.ts)||0));
  }
  list = (list||[]).slice(0,80);
  state.orders = list;
  return save(LS_ORDERS, list);
}

function loadPendingSync_(){ const v = load(LS_PENDING, []); return Array.isArray(v) ? v : []; }

// الطلبات اللي اتأكد وصولها للمصنع — عشان الدمج مايرجّعهاش لقايمة المعلّق
// فتتبعت مرتين.
function loadSent_(){ const v = load(LS_SENT, []); return Array.isArray(v) ? v : []; }

/* الطلبات اللي السيرفر رفضها رفض دائم (شكل الطلب نفسه غلط).
   ⚠️ مش كفاية نشيلها من قايمة المعلّق: القايمة دي بتدمج بدل ما تكتب فوق —
   دي حماية مقصودة عشان طلب ما يضيعش لو نسخة تانية من التطبيق حفظت في نفس
   الوقت. فمن غير القايمة دي، الطلب المرفوض بيرجع للطابور ويتحاول للأبد. */
function loadRejected_(){ const v = load(LS_REJECTED, []); return Array.isArray(v) ? v : []; }
function markRejected_(id){
  if(!id) return;
  const l = loadRejected_().filter(x=>String(x)!==String(id));
  l.unshift(String(id));
  save(LS_REJECTED, l.slice(0,300));
}
function markSent_(id){
  if(!id) return;
  const l = loadSent_().filter(x=>String(x)!==String(id));
  l.unshift(String(id));
  save(LS_SENT, l.slice(0,300));
}

/* ⚠️ ده كان نفس باج قايمة الطلبات: الكتابة فوق بدل الدمج.
   قايمة المعلّق دي هي الضمان الوحيد إن الطلب اللي ما وصلش المصنع يتبعت تاني.
   لو نسخة تانية من التطبيق (مثبّت + تاب) كتبت قايمتها القديمة فوقها، الـid
   بيتشال — والطلب مايتبعتش تاني أبدًا، فيفضل على الجهاز والمصنع مايشوفهوش خالص.
   وده أخطر من ضياعه من الشاشة: الطلب يبقى «موجود» عند الموزّع ومش موجود عند
   المصنع. */
function savePendingSync_(list){
  const اتبعت = new Set(loadSent_().concat(loadRejected_()).map(String));
  const عندنا = new Set((list||[]).map(String));
  // الطلب المعلّق لازم يكون لسه موجود — على الجهاز أو في التخزين (نسخة تانية
  // ضافته). الـid اللي مالوش طلب مانقدرش نبعته أصلًا، وسيبه في القايمة معناه
  // تحذير كاذب «فيه طلب ما وصلش» على طول.
  const موجود = new Set((state.orders||[]).map(o=>String(o && o.id)));
  try{
    const raw = localStorage.getItem(LS_ORDERS);
    (raw ? (JSON.parse(raw)||[]) : []).forEach(o=>{ if(o) موجود.add(String(o.id)); });
  }catch(e){}
  const زيادة = loadPendingSync_()
    .map(String)
    .filter(id => !عندنا.has(id) && !اتبعت.has(id) && موجود.has(id));
  const نهائي = (list||[]).map(String)
    .filter(id => !اتبعت.has(id) && موجود.has(id))
    .concat(زيادة);
  save(LS_PENDING, نهائي);
}

// الطلبات اللي لسه بتتبعت دلوقتي — عشان إعادة المحاولة ماتبعتهاش تاني في نفس الوقت
const _sendingNow = new Set();

async function syncOrder_(o){
  // ⚠️ بنسجّله «معلّق» قبل ما نبعت، مش بعد ما يفشل. لو التطبيق اتقفل أو الصفحة
  // اتحدّثت وسط الإرسال (نسخة جديدة اتنشرت، التليفون نام، المتصفح قفل التاب)،
  // مكانش فيه أي أثر إن الطلب ما وصلش — فكان بيفضل على الجهاز للأبد من غير ما
  // يتبعت تاني ومن غير ما حد يعرف.
  const pending = loadPendingSync_();
  if(!pending.includes(o.id)){ pending.push(o.id); savePendingSync_(pending); }
  _sendingNow.add(String(o.id));
  let ok;
  try{ ok = await sendOrderToServer_(o); }
  finally{ _sendingNow.delete(String(o.id)); }
  if(ok !== true){
    const رفض = _lastSendError;
    if(رفض && رفض.permanent){
      // السيرفر رافض الطلب نفسه — إعادة المحاولة مالهاش لازمة، والموزّع لازم يعرف
      markRejected_(o.id);
      savePendingSync_(loadPendingSync_().filter(id=>String(id)!==String(o.id)));
      toast('⛔ المصنع رفض الطلب '+orderNoText_(o)+': '+(رفض.msg||'شكل الطلب مش مقبول')+
            ' — عدّل الطلب وابعته تاني', 7000);
    } else if(رفض && رفض.msg){
      toast('⚠️ الطلب '+orderNoText_(o)+' لسه ما وصلش المصنع: '+رفض.msg+
            ' — هنحاول تاني تلقائي', 5200);
    } else {
      toast('⚠️ الطلب '+orderNoText_(o)+' اتسجّل على جهازك بس لسه ما وصلش المصنع — هنحاول تاني تلقائي أول ما يرجع النت', 4200);
    }
  } else {
    markSent_(o.id);   // اتأكد وصوله — الدمج مايرجّعهوش لقايمة المعلّق
    savePendingSync_(loadPendingSync_().filter(id=>String(id)!==String(o.id)));
  }
  return ok;
}

/* ---------- حذف الطلب القديم بعد التعديل ----------
   ⚠️ قبل كده كان أمر حذف الطلب القديم بيتبعت في نفس اللحظة مع إرسال الطلب
   الجديد، من غير ما نستنى. لو الجديد فشل يوصل (النت قطع)، القديم بيكون
   اتمسح خلاص والجديد لسه على الجهاز بس — يعني المصنع مايشوفش الطلب خالص.
   دلوقتي القديم مايتمسحش غير لما الجديد يتأكد إنه وصل، ولو الجديد لسه معلّق
   بنسجّل نية الحذف وننفّذها أول ما يوصل. طلب قديم أحسن من ولا طلب. */
function loadPendingCancels_(){ return load(LS_PENDING_CANCEL, []); }
function savePendingCancel_(info){
  // ⚠️ الفلترة كانت بالـnewId لوحده — يعني تعديل ورا تعديل والنت واقع كان
  // بيمسح النية المنقولة (أ→ج) وهو بيسجّل (ب→ج)، والطلب الأصلي يفضل عند
  // المصنع. المفتاح لازم يكون الاتنين مع بعض.
  const list = loadPendingCancels_().filter(c=>
    !(String(c.newId)===String(info.newId) && String(c.prevId)===String(info.prevId)));
  list.push(info); save(LS_PENDING_CANCEL, list);
}
// ⚠️ باج كان هنا: الموزّع يعدّل الطلب مرتين والنت واقع.
//   أ → ب: ب ما وصلش، فالنية «ألغي أ لما ب يوصل» بتتسجّل.
//   ب → ج: ب بيتشال من الجهاز خالص لأنه اتبدل، يعني عمره ما هيوصل ولا هيتبعت.
// النتيجة إن نية إلغاء «أ» بتفضل مستنية طلب مش هييجي أبدًا — والمصنع يفضل
// شايف الطلب الأصلي أ جنب الجديد ج. طلب مكرر في الورشة.
// الحل: النية بتتنقل للطلب الجديد. أ لسه محتاج يتلغي، بس دلوقتي لما ج يوصل.
function transferPendingCancel_(oldNewId, newNewId){
  const list = loadPendingCancels_();
  let غيّرنا = false;
  list.forEach(c=>{
    if(String(c.newId) === String(oldNewId)){ c.newId = newNewId; غيّرنا = true; }
  });
  if(غيّرنا) save(LS_PENDING_CANCEL, list);
  return غيّرنا;
}
async function cancelOldOrder_(info){
  try{
    const d = await jsonp(APPS_SCRIPT_URL + '?action=cancelOrder&dev=' + encodeURIComponent(deviceId_())
      + '&id=' + encodeURIComponent(info.prevId)
      + '&phone=' + encodeURIComponent(info.phone||'')
      + '&newId=' + encodeURIComponent(info.newId)
      + (info.admin ? admParams_() : ''));
    if(d && d.ok) return true;
    // السيرفر عرف يحط علامة "معدّل" على القديم (دخل التنفيذ ومنقدرش نمسحه) — ده كافي
    if(d && d.marked){
      toast('✅ الطلب الجديد #'+info.newId+' اتسجّل — والقديم #'+info.prevId+' اتحطت عليه علامة "معدّل" عشان المصنع يحذفه', 5500);
      return true;
    }
    // القديم أصلًا مش موجود عند المصنع (اتمسح قبل كده بأي طريقة) — مفيش داعي
    // نفضل نحاول نمسحه للأبد وننبّه المستخدم بحاجة خلصت خلاص.
    if(d && d.error === 'الطلب مش موجود') return true;
    toast('⚠️ الطلب الجديد #'+info.newId+' اتسجّل، بس القديم #'+info.prevId+' لسه موجود عند المصنع: '+((d&&d.error)||'خطأ غير معروف'), 5500);
    return false;
  }catch(err){
    toast('⚠️ الطلب الجديد #'+info.newId+' اتسجّل، بس تعذّر حذف القديم #'+info.prevId+' — النت اتقطع', 5500);
    return false;
  }
}
// بيتنادى بعد ما طلب معلّق يوصل المصنع بنجاح: دلوقتي بس ينفع نمسح القديم
// ⚠️ كانت بتنفّذ أول نية بس. بعد ما بقى ينفع أكتر من طلب قديم يستنّى نفس
// الطلب الجديد (تعديل ورا تعديل والنت واقع)، لازم تنفّذهم كلهم — وتشيل اللي
// نجح بس، عشان اللي فشل يتحاول تاني.
async function runPendingCancelFor_(newId){
  const hits = loadPendingCancels_().filter(c=>String(c.newId)===String(newId));
  if(!hits.length) return;
  const نجح = [];
  for(const hit of hits){
    if(await cancelOldOrder_(hit)) نجح.push(String(hit.prevId));
  }
  if(!نجح.length) return;
  save(LS_PENDING_CANCEL, loadPendingCancels_().filter(c=>
    !(String(c.newId)===String(newId) && نجح.indexOf(String(c.prevId))>-1)));
}

// بيحاول يبعت أي طلبات فشل إرسالها قبل كده — بيتنادى عند فتح التطبيق وعند رجوع النت
// ⚠️ الدالة دي بتتنده عند فتح التطبيق وكمان مع كل حدث "النت رجع". لو الاتنين حصلوا
// مع بعض (أو النت قطع ورجع بسرعة) كان ممكن نسختين يشتغلوا في نفس الوقت، الاتنين
// يقروا نفس القايمة ويبعتوا نفس الطلبات — يعني طلبات مكررة عند المصنع. القفل ده بيمنع ده.
let _retryRunning = false;
async function retryPendingOrders_(){
  if(_retryRunning) return;
  if(!APPS_SCRIPT_URL || !navigator.onLine) return;
  const pending = loadPendingSync_();
  if(!pending.length) return;
  _retryRunning = true;
  try{
    const stillPending = [];
    let مرفوض = 0;
    for(const id of pending){
      const o = state.orders.find(x=>String(x.id)===String(id));
      if(!o) continue;   // اتشال من عندنا لأي سبب — متبقاش نحاول تاني
      // بيتبعت دلوقتي من syncOrder_ — سيبه له عشان مايوصلش المصنع مرتين
      if(_sendingNow.has(String(id))){ stillPending.push(id); continue; }
      const ok = await sendOrderToServer_(o);
      // رفض دائم؟ نشيله من الطابور بدل ما نفضل نحاول للأبد، ونقول للموزّع
      if(ok !== true && _lastSendError && _lastSendError.permanent){
        markRejected_(id);
        مرفوض++;
        toast('⛔ المصنع رفض الطلب '+orderNoText_(o)+': '+(_lastSendError.msg||'شكل الطلب مش مقبول'), 7000);
        continue;
      }
      if(ok !== true) stillPending.push(id);   // مش متأكدين = لسه معلّق
      else { markSent_(id); await runPendingCancelFor_(id); }   // وصل — دلوقتي بس ينفع نمسح القديم
    }
    // مش savePendingSync_(stillPending) على طول: لو الموزع بعت طلب جديد وهو
    // مستني الرد هنا، syncOrder_ بتكون ضافته للقايمة — والكتابة فوقها كانت
    // بتمسحه، فالطلب ده عمره ما يتبعت تاني. بنقرا القايمة تاني ونشيل بس اللي
    // اتعامل معاه فعلاً.
    const handled = new Set(pending.map(String));
    const merged = loadPendingSync_().filter(id => !handled.has(String(id)));
    savePendingSync_(merged.concat(stillPending));
    // الطلب المرفوض مااتبعتش — مانقولش «اتبعتت كلها» وهو لسه برّه
    if(pending.length && !stillPending.length && !مرفوض){
      toast('✅ اتبعتت كل الطلبات اللي كانت معلّقة للمصنع');
    }
  } finally {
    _retryRunning = false;
  }
}

/* ============================================================
   أوردر تاني في نفس اليوم لنفس العميل
   قبل ما الأوردر الجديد يتبعت بنسأل السيرفر: لو الموزّع عنده أوردر النهاردة
   لنفس صاحب الأوردر —
   • لسه ما دخلش الإنتاج → نقترح يضيف عليه بدل ما يعمل أوردر جديد منفصل
   • دخل الإنتاج → نقوله «للأسف دخل إنتاج، بلّغ المصنع»
   لو السيرفر مردّش في ٨ ثواني بنعتمد على الطلبات المحفوظة على الجهاز،
   ولو مفيش نتيجة الأوردر يتبعت عادي — الفحص مايعطّلش الطلب أبدًا.
   ============================================================ */
function normName_(v){
  return String(v||'').trim().toLowerCase().replace(/\s+/g,' ')
    .replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');
}
const SAME_DAY_OPEN_ = ['New','Received'];
const SAME_DAY_LOCKED_ = ['In Progress','Ready'];
function sameDayMatches_(rows){
  const today = todayIso_();
  const cust = normName_(state.customer && state.customer.name);
  const replaced = new Set((rows||[]).map(r=>String(r.replacesId||'')).filter(Boolean));
  return (rows||[]).filter(r=>
    r && r.date===today && !replaced.has(String(r.id))
    && (SAME_DAY_OPEN_.includes(r.status) || SAME_DAY_LOCKED_.includes(r.status))
    && (!cust || !r.customer || normName_(r.customer)===cust));
}
async function findSameDayOrders_(){
  let rows = null;
  try{
    const phone = String(state.profile.phone||'').trim();
    const d = await jsonp(APPS_SCRIPT_URL + '?action=list&dev=' + encodeURIComponent(deviceId_())
      + '&phone=' + encodeURIComponent(phone), 8000);
    if(d && d.ok) rows = d.orders || [];
  }catch(err){ rows = null; }
  if(!rows){
    // مفيش رد من السيرفر — من الطلبات اللي على الجهاز نفسه (والحالة من آخر تحديث لو موجود)
    const today = todayIso_();
    const live = {}; (state.track.rows||[]).forEach(r=>{ live[String(r.id)] = r; });
    rows = state.orders.filter(o=>isoLocal_(o.ts)===today).map(o=>({
      id:o.id, date:today, customer:o.customer||'', displayNo:o.displayNo, editCount:o.editCount,
      replacesId:o.replacesId||'', status:(live[String(o.id)]&&live[String(o.id)].status)||'New'}));
  }
  const hit = sameDayMatches_(rows);
  return { open: hit.filter(r=>SAME_DAY_OPEN_.includes(r.status)),
           locked: hit.filter(r=>SAME_DAY_LOCKED_.includes(r.status)) };
}
async function submitOrderGuarded_(){
  // التعديل، وتعديل المصنع، والسلة الفاضية، والبيانات الناقصة: نفس المسار القديم بالظبط
  if(!state.cart.length || state.editingId || state.editingMeta || !profileOk() || !APPS_SCRIPT_URL){
    return submitOrder();
  }
  busy(true, 'بنراجع أوردراتك النهاردة…');
  let hit = null;
  try{ hit = await findSameDayOrders_(); }catch(err){ hit = null; }
  finally{ busy(false); }
  if(!hit || (!hit.open.length && !hit.locked.length)) return submitOrder();
  showSameDayDialog_(hit);
}
function showSameDayDialog_(hit){
  const old = document.getElementById('sameDayOverlay'); if(old) old.remove();
  const ov = document.createElement('div');
  ov.id = 'sameDayOverlay'; ov.className = 'dueov';
  const canAdd = hit.open.length > 0;
  const r = canAdd ? hit.open[0] : hit.locked[0];
  const local = state.orders.find(x=>String(x.id)===String(r.id));
  const no = orderNoText_(r.displayNo ? r : (local || r));
  const cust = r.customer || (state.customer && state.customer.name) || '';
  const addBtn = (canAdd && local)
    ? `<button id="sdAdd" class="btn brand" style="width:100%;padding:13px;font-weight:700;margin-top:12px">${ico('plus')} ضيف على الأوردر ${esc(no)}</button>` : '';
  const body = canAdd
    ? `عندك أوردر النهاردة <b>${esc(no)}</b>${cust?' لـ <b>'+esc(cust)+'</b>':''} ولسه ما دخلش الإنتاج. الأفضل تضيف الأصناف دي عليه بدل ما تبعت أوردر جديد منفصل.${local?'':'<br><span style="color:var(--warn-ink)">الأوردر ده اتبعت من جهاز تاني، فمش هينفع تضيف عليه من هنا — كلّم المصنع.</span>'}`
    : `للأسف الأوردر <b>${esc(no)}</b>${cust?' بتاع <b>'+esc(cust)+'</b>':''} اللي طلبته النهاردة <b>دخل إنتاج</b> ومينفعش نضيف عليه. بلّغ المصنع بالأصناف اللي عايز تزودها.`;
  ov.innerHTML = `<div class="box" style="text-align:right">
    <h3>${ico(canAdd?'doc':'warn')} ${canAdd?'عندك أوردر النهاردة':'الأوردر دخل إنتاج'}</h3>
    <div class="sub" style="font-size:13.5px;color:var(--ink);margin-top:8px">${body}</div>
    ${addBtn}
    ${canAdd
      ? `<button id="sdNew" class="btn ghost" style="width:100%;padding:12px;margin-top:8px">ابعت أوردر جديد منفصل</button>
         <button id="sdBack" style="width:100%;margin-top:8px;background:rgba(255,255,255,.12);color:var(--ink);padding:11px;border-radius:12px;font-size:13.5px">رجوع للسلة</button>`
      : `<button id="sdBack" class="btn brand" style="width:100%;padding:13px;font-weight:700;margin-top:12px">تمام، هبلّغ المصنع</button>
         <button id="sdNew" class="btn ghost" style="width:100%;padding:12px;margin-top:8px">ابعته كأوردر جديد برضه</button>`}
  </div>`;
  document.body.appendChild(ov);
  const close = ()=>ov.remove();
  document.getElementById('sdBack').onclick = close;
  document.getElementById('sdNew').onclick = ()=>{ close(); submitOrder(); };
  const add = document.getElementById('sdAdd');
  if(add) add.onclick = ()=>{
    close();
    const merged = JSON.parse(JSON.stringify(local.items||[])).concat(JSON.parse(JSON.stringify(state.cart)));
    state.cart = merged; saveCart_();
    enterEditMode_(local);
    toast('اتضافت الأصناف على الأوردر '+no+' — راجع السلة واضغط «حفظ التعديل»', 6000);
  };
}

function submitOrder(){
  if(!state.cart.length){toast('السلة فاضية');return;}
  if(!state.editingMeta){
    // طلب جديد أو تعديل عادي من الموزع — لازم اسم الحساب وبيانات صحيحة وصاحب الأوردر
    if(!profileOk()){
      state.touched=true; state.tab='new'; render();
      window.scrollTo({top:0,behavior:'smooth'});
      toast('اكتب الاسم ورقم موبايل صحيح واسم صاحب الأوردر — إجباري');
      return;
    }
  } else {
    // تعديل من شاشة المصنع — اسم الحساب وصاحب الأوردر إجباريين هنا كمان، لو ناقصين بنسأل
    if(!state.editingMeta.name || !state.editingMeta.name.trim()){
      const v = (prompt('اسم الحساب (صاحب الجهاز) مفقود من الطلب ده — اكتبه عشان تقدر تحفظ:') || '').trim();
      if(!v){ toast('لازم تكتب اسم الحساب عشان تكمّل الحفظ'); return; }
      state.editingMeta.name = v;
    }
    if(!state.editingMeta.customer || !state.editingMeta.customer.trim()){
      const v2 = (prompt('اسم صاحب الأوردر مفقود من الطلب ده — اكتبه عشان تقدر تحفظ:') || '').trim();
      if(!v2){ toast('لازم تكتب اسم صاحب الأوردر عشان تكمّل الحفظ'); return; }
      state.editingMeta.customer = v2;
    }
  }
  const wasEditing = !!state.editingId;
  const prevId = state.editingId;
  const o=draftOrder();
  o.msg=buildMessage(o);

  if(wasEditing){
    // ⚠️ لو الطلب اللي بنعدّله هو نفسه لسه ما وصلش المصنع، يبقى فيه نية إلغاء
    // مستنياه — ونيته دي هتفضل مستنية طلب مش هييجي أبدًا (لأنه بيتشال دلوقتي).
    // بننقلها للطلب الجديد عشان الطلب الأصلي القديم مايفضلش عند المصنع.
    transferPendingCancel_(prevId, o.id);
    // التعديل بيلغي الطلب القديم بدل ما يحدّثه في مكانه — وبيعمل طلب جديد مستقل بالأصناف المعدّلة
    markDeleted_(prevId);                       // اتلغى بالتعديل — الدمج مايرجّعهوش
    state.orders = state.orders.filter(x=>String(x.id)!==String(prevId));
    // ⚠️ ونشيله من نسخة قايمة السيرفر المحفوظة على الجهاز كمان. من غير كده كان
    // بيفضل فيها لحد التحديث الجاي من السيرفر — وأي بحث بالحالة أو قفل التعديل
    // كان لسه بيلاقي طلب اتمسح خلاص.
    if(state.track.rows) state.track.rows = state.track.rows.filter(x=>String(x.id)!==String(prevId));
  }
  state.orders.unshift(o);
  // كانت الذاكرة بتحتفظ بكل الطلبات والمحفوظ 80 بس — فبعد أي إعادة فتح الأرقام
  // بتختلف عن اللي كان ظاهر. بنقصّ الاتنين على نفس الحد.
  const savedLocally = saveOrders_(state.orders);
  const wasAdminEdit = !!state.editingMeta;
  state.cart=[]; saveCart_(); state.touched=false;
  state.editingId=null; state.editingMeta=null; state.editingDate=null;
  state.editingDisplayNo=null; state.editingEditCount=null;
  state.customer={name:'',phone:''}; state.orderNote='';   // تصفير بيانات صاحب الأوردر للطلب الجاي

  if(APPS_SCRIPT_URL){
    // الطلب القديم لازم يتمسح من عند المصنع — لو المصنع هو اللي بيعدّل بنبعت كلمة سره
    // عشان يقدر يمسحه حتى لو دخل التنفيذ فعليًا.
    // ⚠️ الترتيب مهم: بنبعت الجديد الأول وبنستنى، ومانمسحش القديم غير لما الجديد
    // يتأكد إنه وصل. لو بعتنا الاتنين مع بعض والجديد فشل، المصنع بيفضل من غير
    // أي نسخة من الطلب خالص.
    const cancelInfo = (wasEditing && prevId)
      ? { prevId, phone:o.phone||'', newId:o.id, admin:wasAdminEdit } : null;
    // ⚠️ باج كان هنا: كنا بنبعت الصورة (shareOrderImage) فورًا من غير ما نستنى
    // رد السيرفر، فـ o.displayNo لسه مش موجود لحظة تجهيز الصورة — والمستند كان
    // بيرجع يعرض o.id (الكود الداخلي الطويل W260905-...) بدل الرقم الصغير
    // العادي. دلوقتي بنستنى رد السيرفر الأول (سواء نجح أو فشل)، وبعدين نجهّز
    // الصورة على o بعد ما displayNo يتحدّث فيه (لو السيرفر رد بنجاح).
    // ⚠️ والانتظار ده ممكن يوصل ٢٥ ثانية لو السيرفر بطيء — من غير أي مؤشّر كان
    // المستخدم يشوف «اتسجّل الطلب» ويفتكر إنه خلص، وفجأة شاشة المشاركة تفتح
    // عليه. فبنوريه إن فيه حاجة شغالة.
    const syncing = syncOrder_(o);
    if(!wasAdminEdit){
      (async ()=>{
        busy(true, 'جارٍ تأكيد رقم الطلب مع المصنع…');
        try{ await syncing; } finally { busy(false); }
        shareOrderImage(o);
      })();
    }
    // ⚠️ باج كان هنا: الكتلة دي بتشتغل في الخلفية، وتحتها على طول كان بيتعمل
    // adminLoad() — يعني شاشة المصنع بتجيب القايمة من السيرفر **قبل** ما الطلب
    // الجديد يتبعت وقبل ما القديم يتمسح. فالمصنع يشوف القديم لسه موجود، وشاشته
    // عمرها ما بتصحّح نفسها بعد كده (adminPoll بيحدّث الشارة والإشعارات بس، مش
    // القايمة). بنمسك الوعد هنا وناخده تحت عشان نستنّاه قبل التحديث.
    const إلغاء_القديم = (async ()=>{
      const sent = await syncing;
      if(!cancelInfo) return 'لا-داعي';
      // ⚠️ الشرط ده كان `sent === false` بس، و null (اتبعت من غير تأكيد) كان
      // بيعدّي منه ويمسح الطلب القديم. دلوقتي مفيش null أصلًا، بس بنتشدّد:
      // القديم مايتمسحش غير لما الجديد يتأكد وصوله بالظبط.
      if(sent !== true){ savePendingCancel_(cancelInfo); return 'مؤجّل'; }   // لسه ما وصلش — سيب القديم
      const cancelled = await cancelOldOrder_(cancelInfo);
      // ⚠️ باج كان هنا: لو المسح فشل هنا (مش لأن الطلب الجديد لسه ما وصلش،
      // لكن لأن استدعاء المسح نفسه فشل — النت قطع لحظته أو أي خطأ عابر)،
      // المحاولة دي كانت تروح في الهوا من غير أي تسجيل، فمفيش حد كان
      // هيحاول يمسح القديم تاني أبدًا — وده كان بيخلّي القديم والجديد
      // يفضلوا الاتنين ظاهرين عند المصنع للأبد.
      if(!cancelled) savePendingCancel_(cancelInfo);
      // ولو كانت فيه نية إلغاء اتنقلت للطلب ده (تعديل ورا تعديل والنت واقع)،
      // دلوقتي بعد ما وصل بقى ينفع تتنفّذ.
      await runPendingCancelFor_(o.id);
      return cancelled ? 'اتلغى' : 'مؤجّل';
    })();
  } else if(!wasAdminEdit){
    shareOrderImage(o);
  }
  if(wasAdminEdit){
    // المصنع رجع لشاشته، والقايمة بتتحدّث من السيرفر عشان تبان بالأصناف الجديدة
    state.tab='admin'; render();
    (async ()=>{
      // ⚠️ التوست كان بيقول «اتلغى الطلب القديم» قبل ما الإلغاء يحصل أصلاً —
      // فلو فشل أو اتأجّل، المصنع اتقاله إنه نجح. دلوقتي بنستنى النتيجة الحقيقية
      // ونقولها زي ما هي، وبعدين بنحدّث القايمة عشان تبان الحقيقة.
      busy(true, wasEditing ? 'جارٍ حفظ التعديل وإلغاء الطلب القديم…' : 'جارٍ حفظ التعديل…');
      let نتيجة = 'لا-داعي';
      try{ نتيجة = await إلغاء_القديم; }catch(e){}
      finally{ busy(false); }
      if(!wasEditing) toast('✅ اتحدّث الطلب '+orderNoText_(o));
      else if(نتيجة === 'اتلغى')
        toast('✅ اتلغى الطلب القديم '+prevOrderNoText_(o)+' واتعمل طلب جديد '+orderNoText_(o));
      else
        toast('⚠️ الطلب الجديد '+orderNoText_(o)+' اتسجّل، بس القديم '+prevOrderNoText_(o)+
              ' لسه موجود — هنحاول نلغيه تاني تلقائي، ولو فضل شيله بنفسك من زرار «حذف»', 7000);
      adminLoad();
    })();
    return;
  }
  state.tab='orders'; render();
  if(savedLocally){
    // ⚠️ نفس باج v137: الرسالة كانت بتكتب الكود الداخلي بينما المستند والواتساب
    // وكل الشاشات بيكتبوا الرقم التسلسلي. الرقم لسه ممكن مايكونش وصل من السيرفر
    // في اللحظة دي، فـ orderNoText_ بترجّع الكود الداخلي لوحدها وقتها.
    toast((wasEditing?'✅ اتحدّث الطلب ':'اتسجّل طلب الأوردر ') + orderNoText_(o));
  } else {
    // الطلب اتبعت للمصنع بس مقدرناش نحفظه على الجهاز — لازم المستخدم يعرف،
    // لأنه هيختفي من «تابع طلبك» أول ما يقفل التطبيق.
    toast('⚠️ الطلب اتبعت للمصنع، بس مساحة جهازك مليانة فمقدرناش نحفظه هنا — '
        + 'صوّر الشاشة أو ابعت الصورة لنفسك، وفضّي مساحة من إعدادات المتصفح', 8000);
  }
}

/* ============================================================
   المستندات — عرض سعر / طلب (PDF)
   ============================================================ */
// بيحسب الجاهز/المتبقي لأي صنف (لو مفيش بيانات إنتاج للصنف ده بيرجع جاهز=0 ومتبقي=الكمية كاملة)
function itemProdPending_(it){
  const qty = Number(it.qty)||0;
  const produced = Math.max(0, Math.min(qty, Number(it.produced)||0));
  return { produced, pending: qty-produced };
}

// بيرجّع عرض وارتفاع الفتحة المعمارية للباب من نص المقاس الإنجليزي (زي "80 cm" أو "75x209 cm (custom)")
// بيشتغل مع شكل عربة العميل (sizeEn) وشكل بيانات السيرفر الخام (size) لأنهم بنفس الصيغة الإنجليزية الثابتة
function doorWH_(sizeEn, doorHeight){
  let m = /^(\d+(?:\.\d+)?)\s*cm$/i.exec(sizeEn||'');
  if(m) return { w:Number(m[1]), h: doorHeight?Number(doorHeight):DOOR_STD_HEIGHT };
  m = /^(\d+(?:\.\d+)?)\s*x\s*(\d+(?:\.\d+)?)\s*cm\s*\(custom\)$/i.exec(sizeEn||'');
  if(m) return { w:Number(m[1]), h:Number(m[2]) };
  return { w:'', h:'' };
}

// عرض الحلق (10/15/20) للسطر المنفصل: من الحقل المحفوظ في السلة، وإلا من الاسم
// ('Door Frame 15 cm' / 'حلق كامل 15 سم'). مقاسات القائم/العارضة (208، 75) مش بتتلقط.
function docFrameCm_(it){
  if(Number(it.frCm)>0) return String(Number(it.frCm));
  const src = [it.titleEn, it.title, it.spec, it.sizeEn].map(x=>String(x||'')).join(' | ');
  const m = /Frame\s+(\d+(?:\.\d+)?)\s*cm/i.exec(src)
         || /حلق(?:\s+كامل)?(?:\s+باب)?\s+(\d+(?:\.\d+)?)\s*سم/.exec(src);
  return m ? m[1] : '';
}
// مقاس البرور (6×9 / 4×8) للسطر المنفصل — أول مقاس مكتوب في الوصف
function docBrorSize_(it){
  const src = [it.spec, it.sizeEn, it.titleEn, it.title].map(x=>String(x||'')).join(' | ');
  const m = /(\d+)\s*[×xX*]\s*(\d+)/.exec(src);
  return m ? (m[1]+'×'+m[2]) : '';
}
function docRowHTML_(it, idx, priced, showFrameHCol, oddFrameW, titleTxt){
  let widthTxt='—', heightTxt='—', frameW='—', frameH='—', brorTxt='—', qty=it.qty, unit;
  if(it.kind==='door'){
    const wh = doorWH_(it.sizeEn, it.doorHeight);
    widthTxt = wh.w||'—'; heightTxt = wh.h||'—';
    frameW = it.frame ? it.frame : '—';
    frameH = it.frame ? (it.frameHeight ? it.frameHeight : 'استاندر') : '—';
    brorTxt = it.dbror ? it.dbror : '—';
    unit='باب';
  } else if(it.kind==='frame'||it.kind==='bror'){
    unit = it.isSet ? 'طقم' : 'عود';
    // سطر الحلق بيكتب عرض الحلق، وسطر البرور بيكتب مقاسه، في نفس خانات الجدول
    if(it.kind==='frame'){ frameW = docFrameCm_(it) || '—'; }
    else { brorTxt = docBrorSize_(it) || '—'; }
  } else {
    // الوحدة ممكن تيجي من السيرفر بالإنجليزي ('pc'/'door'/'rod 220cm') لأن كده
    // بتتخزّن في الشيت. itemUnitAr_ بتعرّبها، ولو كانت عربي أصلًا بترجّعها زي ما هي.
    unit = itemUnitAr_(it.unit) || 'قطعة';
    if(unit==='—') unit='قطعة';
  }
  const isCut = isCutLine_(it);
  // لو مقاس الحلق (البرور) في السطر ده مختلف عن باقي أسطر الطلب، نبرز الخلية دي
  // بخلفية تلفت النظر عشان المصنع ما يلخبطش بين حلق 15 وحلق 20 مثلًا في نفس الأوردر.
  const frameWStyle = oddFrameW
    ? 'background:#FFF3CD;color:#8A5A00;font-weight:700;border-radius:4px'
    : 'color:#5B6B7D';
  // «خدمة قص» بتتشال من نص الملحوظة هنا لأنها بقت صف مستقل تحت الصنف
  const restNote = (it.kind==='door' && it.note)
    ? it.note.split(' — ').filter(x=>x.trim() && x.trim()!==CUT_SERVICE_NOTE_).join(' — ')
    : '';
  // تنسيق v211: خط أكبر وأغمق، فواصل خفيفة بين مجموعات الأعمدة، والفاضي بشرطة رمادية باهتة
  const T  = 'padding:9px 4px;border-bottom:1px solid #E1E8F0;vertical-align:middle;text-align:center;font-size:14px;color:#000';
  const SEP = 'border-inline-start:1px solid #E1E8F0';
  const val = (v, extra) => (v==='—' || v==='' || v==null)
    ? `<span style="color:#888">—</span>`
    : `<b style="${extra||''}">${esc(v)}</b>`;
  const frameWCell = oddFrameW
    ? `<span style="display:inline-block;min-width:26px;padding:2px 6px;background:#FFF3CD;color:#8A5A00;font-weight:900;border-radius:6px">${esc(frameW)}</span>`
    : val(frameW);
  return `<tr${isCut?' style="background:#FFF8E8"':''}>
    <td style="${T};font-size:12px;color:#444">${idx}</td>
    <td style="${T};text-align:right;padding-inline:8px"><b style="font-size:14px">${esc(titleTxt||it.title)}</b>${restNote?`<br><span style="font-size:12.5px;font-weight:700;color:#B3261E">${esc(restNote)}</span>`:''}</td>
    <td style="${T};white-space:nowrap"><b style="font-size:16px;color:#000">${qty}</b> <span style="font-size:11px;color:#333">${esc(unit)}</span></td>
    <td style="${T};${SEP}">${val(widthTxt)}</td>
    <td style="${T}">${val(heightTxt)}</td>
    <td style="${T};${SEP}">${frameWCell}</td>
    ${showFrameHCol?`<td style="${T}">${frameH==='استاندر'?`<span style="color:#8A6512;font-size:12px;font-weight:700">استاندر</span>`:val(frameH)}</td>`:''}
    <td style="${T};${SEP}">${val(brorTxt)}</td>
    ${priced?(it.included
      ? `<td style="${T};${SEP};font-size:12px;color:#8A6512">مشمول</td><td style="${T};font-size:12px;color:#8A6512">مشمول</td>`
      : `<td style="${T};${SEP}">${money(it.kind==='door'?it.unitPrice:it.price)}</td>
    <td style="${T}"><b>${money(linePrice(it))}</b></td>`):''}
  </tr>`;
}

// بيرتّب مفاتيح مقاسات الأبواب (نص عربي زي "70 سم") تصاعديًا، والمقاسات الخاصة آخر القايمة
function sortSizeKeys_(keys){
  return keys.sort((a,b)=>{
    const aStd=/^\d+\s*سم$/.test(a), bStd=/^\d+\s*سم$/.test(b);
    if(aStd&&bStd) return parseInt(a)-parseInt(b);
    if(aStd) return -1;
    if(bStd) return 1;
    return 0;
  });
}

function docRows(o, priced, showFrameHCol){
  const items=o.items||[];
  const doorItems=items.filter(it=>it.kind==='door');
  const otherItems=items.filter(it=>it.kind!=='door');
  // ⚠️ عمودين «جاهز/متبقي» اتشالوا من ورقة الأوردر — الأرقام دي شغل مصنع
  // مش بيانات أوردر، ومكانها شاشة متابعة الإنتاج.
  const colspan=(priced?9:7)+(showFrameHCol?1:0);

  // نحدّد مقاس الحلق (البرور) الأكتر تكرارًا في كل أبواب الطلب، عشان أي سطر
  // بمقاس حلق مختلف عنه (زي حلق 20 وسط حلق 15) يبان بخلفية صفراء تلفت النظر.
  const frameWCount={};
  doorItems.forEach(it=>{ const f=it.frame?String(it.frame):''; if(f) frameWCount[f]=(frameWCount[f]||0)+1; });
  const distinctFrameWs=Object.keys(frameWCount);
  let dominantFrameW=null;
  if(distinctFrameWs.length>1){
    dominantFrameW=distinctFrameWs.reduce((a,b)=>frameWCount[a]>=frameWCount[b]?a:b);
  }

  const groups={};
  doorItems.forEach(it=>{ const k=doorSizeText_(it.sizeTxt,it.doorHeight)||''; (groups[k]=groups[k]||[]).push(it); });
  const order=sortSizeKeys_(Object.keys(groups));

  // بنود «خدمة قص» بتتحط تحت مجموعة مقاسها على طول — عنوان البند فيه نفس نص
  // المقاس، فبنطابق بيه. أي بند قص مالوش مجموعة (مقاس اتشال مثلًا) بينزل مع الباقي.
  const cutFor={};
  const cutItems = otherItems.filter(isCutLine_);
  cutItems.forEach(it=>{ const k=cutLineLabel_(it); if(groups[k]) (cutFor[k]=cutFor[k]||[]).push(it); });
  const restOther = otherItems.filter(it=>!isCutLine_(it) || !groups[cutLineLabel_(it)]);

  let n=0, rows='';
  order.forEach((k,gi)=>{
    rows += `<tr><td colspan="${colspan}" style="${gi>0?'border-top:2px dashed #5B6B7D;':''}background:#F9E4DB;padding:10px 12px;font-family:Arial,'Helvetica Neue',sans-serif;font-weight:800;color:#A0451F;font-size:14px">🚪 أبواب مقاس ${esc(k)}</td></tr>`;
    groups[k].forEach(it=>{
      const oddFrameW = dominantFrameW!=null && it.frame && String(it.frame)!==dominantFrameW;
      rows += docRowHTML_(it, ++n, priced, showFrameHCol, oddFrameW);
    });
    // البند تحت مجموعة مقاسه — فالاسم المختصر كفاية، المقاس مكتوب في عنوان المجموعة
    (cutFor[k]||[]).forEach(it=>{
      const def = serviceDefFor_(it);
      rows += docRowHTML_(it, ++n, priced, showFrameHCol, false, def ? def.label : '');
    });
  });
  if(restOther.length){
    rows += `<tr><td colspan="${colspan}" style="${order.length?'border-top:2px dashed #5B6B7D;':''}background:#F3F6FA;border-inline-start:5px solid #9AA7B5;padding:9px 12px;font-weight:800;color:#000;font-size:14px;font-family:Arial,'Helvetica Neue',sans-serif">حلق / برور / إكسسوارات</td></tr>`;
    restOther.forEach(it=>{ rows += docRowHTML_(it, ++n, priced, showFrameHCol, false); });
  }
  return rows;
}

// صندوق إجماليات لكل مقاس باب + إجمالي الأبواب + الإجمالي الكلي — نفس فكرة التقرير الشامل بس لطلب واحد
function docTotalsHTML(o){
  const items=o.items||[];
  const doorItems=items.filter(it=>it.kind==='door');
  if(!doorItems.length) return '';
  const perSize={};
  doorItems.forEach(it=>{ const k=doorSizeText_(it.sizeTxt,it.doorHeight)||''; perSize[k]=(perSize[k]||0)+(Number(it.qty)||0); });
  // ⚠️ ترتيب الكروت: الفلكس RTL بيرسم آخر عنصر على الشمال — .reverse() بيخلّي أول مجموعة في الجدول أول كارت من اليمين
  const keys=sortSizeKeys_(Object.keys(perSize)).reverse();
  const doorsTotal=keys.reduce((s,k)=>s+perSize[k],0);
  // «خدمة قص» بند فلوس مش قطعة تتقطع — مابتتعدّش في إجمالي القطع
  const counted=items.filter(it=>!isCutLine_(it));
  const overallTotal=counted.reduce((s,it)=>s+(Number(it.qty)||0),0);
  // ⚠️ «الإجمالي الكلي» بيعدّ طقم الحلق كقطعة واحدة — وهو فعليًا ٣ عيدان. مابنغيّرش الحساب، بنوضّح الطقم كام عود.
  const setsQty = items.reduce((s,it)=>s+(it.isSet?(Number(it.qty)||0):0),0);
  const setsNote = setsQty
    ? `<div style="display:flex;justify-content:space-between;font-size:11.5px;padding:2px 0;color:#000"><span>منهم ${setsQty} طقم حلق</span><b>= ${setsQty*RODS_PER_SET} عود</b></div>`
    : '';
    const PAL = [['#E3F0FF','#9CC3EE'],['#FFF1D6','#EBC46E'],['#E2F6E9','#8ED1A5'],['#F1E6FF','#C4A4EE'],['#FFE5E3','#EE9F98'],['#DFF6F8','#8ACFD8'],['#FDE6F1','#E79DC2'],['#EEF2D4','#C3CF7E']];
  const cards = keys.map((k,i)=>{ const [bg,bd]=PAL[i%PAL.length];
    return `<div style="flex:1;min-width:84px;background:${bg};border:1.5px solid ${bd};border-radius:10px;padding:5px 4px;text-align:center;color:#000">
    <div style="font-size:11px;font-weight:800;line-height:1.3">${esc(k)}</div>
    <div style="font-size:19px;font-weight:900;line-height:1.2">${perSize[k]}</div></div>`; }).join('');
  const sumRow = (lbl,val,unit)=>`<div style="display:flex;justify-content:space-between;align-items:baseline;padding:2px 0;font-size:14px;font-weight:800;color:#0A1F44"><span>${lbl}</span><span>${val} <span style="font-size:13px">${unit}</span></span></div>`;
  return `<div class="keep-blk" style="margin-top:10px"><div style="display:flex;gap:6px;flex-wrap:wrap">${cards}</div>
    <div style="margin-top:8px;background:#F3F6FA;border-radius:10px;padding:6px 16px">
      ${sumRow('إجمالي الأبواب', doorsTotal, 'باب')}
      ${setsNote}
    </div></div>`;
}

// الطلبات اللي اتعملت قبل ما «خدمة قص» تبقى بند (أو من جهاز لسه على نسخة قديمة)
// مافيهاش سطر قص خالص — والمصنع لازم يشوفه في المعاينة والطباعة. بنولّده للعرض
// من الباب نفسه.
// ⚠️ بشرط واحد: سعر الباب المتخزّن يكون هو سعر المقاس الحالي بالظبط. النسخ
// الأقدم من v164 كانت بتحط الـ٣٠٠ جوه سعر الباب — لو ولّدنا سطر كمان هنحسب
// القص مرتين على العميل. لو السعر مش مطابق بنسيب الطلب زي ما هو.
// tierKey: مستوى السعر المختار لعرض السعر — البند المولّد لازم يتسعّر بنفس
// المستوى زي باقي السطور، وإلا العرض بيخلط سعر عميل بسعر جملة في ورقة واحدة.
function derivedCutLines_(items, tierKey){
  const list = items||[];
  if(list.some(isCutLine_)) return [];
  const out=[], byLabel={};
  list.forEach(it=>{
    if(!doorNeedsCut_(it)) return;
    const label = doorSizeText_(it.sizeTxt, it.doorHeight) || '';
    const w = Number(it.w) || doorWH_(it.sizeEn, it.doorHeight).w;
    // الحفر مابيتنقلش كحقل في مستند المصنع — بنقراه من اسم الصنف
    const hafr = !!it.hafr || /\(حفر\)|Carved/i.test(it.title||'');
    // ⚠️ النسخ الأقدم من v164 كانت بتحط الـ٣٠٠ جوه سعر الباب. لو سعر الباب
    // المتخزّن مش هو سعر المقاس الحالي، يبقى غالبًا القص محسوب جواه — فالسطر
    // بيبان للمصنع بس مكتوب عليه «مشمول»، ومابيتضافش على الإجمالي تاني.
    // ⚠️ المقارنة لازم تبقى بسعر نفس المستوى المطبوع. في عرض سعر العميل
    // السطور بتتسعّر بسعر العميل، والمقارنة بسعر الجملة كانت بتفشل دايمًا —
    // فالبند بيطلع «مشمول» بصفر جنيه وخدمة القص بتضيع من العرض كله.
    const سعر_المقاس = tierPrice(priceForWidth(w, hafr), 'door', tierKey, w, {hafr});
    const included = !w || (Number(it.unitPrice)||0) !== سعر_المقاس;
    const g = byLabel[label] || (byLabel[label] = { qty:0, included:false });
    g.qty += (Number(it.qty)||0);
    if(included) g.included = true;
  });
  Object.keys(byLabel).forEach(label=>{
    const g = byLabel[label];
    out.push({ kind:'acc', id:CUT_SERVICE_CODE_, code:CUT_SERVICE_CODE_, unit:'باب',
               title:cutServiceTitle_(label), qty:g.qty,
               price: g.included ? 0 : tierPrice(CUSTOM_EXTRA, 'acc', tierKey, 'customExtra'),
               included: g.included });
  });
  return out;
}
// بيرجّع نسخة من الطلب فيها بنود القص (المتخزّنة أو المولّدة) وإجماليها متحسوب
function withCutLines_(o){
  const derived = derivedCutLines_(o && o.items, o && o.priceTier);
  if(!derived.length) return o;
  const add = derived.reduce((s,it)=>s+قرش_((Number(it.price)||0)*(Number(it.qty)||0)), 0);
  return Object.assign({}, o, { items:(o.items||[]).concat(derived),
                                total:قرش_((Number(o.total)||0) + add) });
}
// بيشيل بنود «عرض السعر بس» من نسخة الطلب (زي خدمة القص) من غير ما يلمس
// الإجمالي. «تدعيم خشب» مش منهم — المصنع مايعرفهوش من أي حاجة تانية في
// الورقة، فلازم يفضل باين في ورقة الشغل زي ما هو.
function withoutCutLines_(o){
  if(!o || !(o.items||[]).some(quoteOnlyLine_)) return o;
  return Object.assign({}, o, { items:(o.items||[]).filter(it=>!quoteOnlyLine_(it)) });
}
// طلبات قديمة لنفس العميل لسه ما خلصتش (مش «تم التسليم» ولا «ملغي» ولا اتعدّلت بطلب جديد)
// — بتبان كملحوظة في ورقة الأوردر والرسالة عشان المصنع يعرف إن فيه شغل مفتوح للعميل ده.
// مستند الأدمن: بندوّر في طلبات المصنع بنفس رقم الموبايل. مستند العميل: طلبات جهازه.
function otherOpenOrders_(o){
  if(!o) return [];
  // ⚠️ باج كان هنا: الملحوظة كانت بتجيب كل الطلبات المفتوحة على الحساب/الجهاز (نفس رقم الموبايل)،
  // والموزّع الواحد عنده عملاء كتير — فعميل جديد كان يطلع له أرقام طلبات ناس تانية.
  // «العميل» هنا = صاحب الأوردر، فبنقارن بالاسم، ولو الطلب ده مالوش اسم مفيش ملحوظة.
  const custKey = normName_(o.customer);
  if(!custKey) return [];
  const skip = new Set([String(o.id||''), String(o.replacesId||'')].filter(Boolean));
  const out = [];
  const push = (x, status) => {
    if(!x || skip.has(String(x.id))) return;
    if(normName_(x.customer)!==custKey) return;
    if(DUE_DONE_STATUSES.includes(status) || x.superseded) return;
    // طلب قديم من قبل الترقيم التسلسلي: مالوش رقم، فمنكتبش كوده الداخلي الطويل
    // (#W260904-002419ATB) — بنكتب «طلب» وتاريخه (من الكود نفسه) عشان يتعرف.
    let no = orderNoText_(x);
    if(!x.displayNo){
      const dm = /W(\d{2})(\d{2})(\d{2})/.exec(String(x.id||''));
      no = dm ? ('طلب '+dm[3]+'/'+dm[2]) : ('طلب '+shortIdText_(x.id));
    }
    out.push({ no, st: (STATUS[status]||STATUS.New).ar });
  };
  try{
    if(o.fromAdmin){
      const ph = String(o.phone||'').replace(/\D/g,'').slice(-10);
      if(!ph) return [];
      ((state.admin&&state.admin.rows)||[]).forEach(x=>{
        if(String(x.phone||'').replace(/\D/g,'').slice(-10)===ph) push(x, x.status||'New');
      });
    } else {
      (state.orders||[]).forEach(x=>push(x, homeStatus_(x)));
    }
  }catch(e){ return []; }
  return out;
}
function openOrdersNoteHTML_(o){

// اتحوّل من مكتبة xlsx لـ ExcelJS — كانت المكتبتين محمّلين مع بعض وبيعملوا نفس الشغل
// (زيادة ~900 كيلوبايت على كل فتحة من غير أي فايدة). دلوقتي مكتبة واحدة بس، وبتتحمّل
// وقت الطلب فعلاً، والملف الناتج بقى فيه رأس أعمدة مثبّت وعرض أعمدة مظبوط.
async function exportExcel(orders,fname){
  if(!orders.length){toast('مفيش طلبات');return;}
  if(!await needLibs_('exceljs')) return;
  const priced=pricesVisible();
  busy(true,'جارٍ تجهيز الإكسيل…');
  try{
    const sumHead=['Order No','Date','Distributor','Phone','Region','Warehouse','Status','Lines'].concat(priced?['Total']:[]);
    const detHead=['Order No','Date','Distributor','Phone','Region','Status','Type','Item','Colour','Size','Door Height (cm)','Frame (cm)','Frame Height (cm)','Bror','Milling','Unit','Qty','Produced','Remaining','Available'].concat(priced?['Unit Price','Line Total']:[]);
    const sum=[], det=[];

    orders.forEach(o=>{
      // بنود «خدمة قص» بتبان في عرض السعر بس — الإكسل ده كشف أصناف للمصنع
      // كشف أصناف للمصنع: القص (بند تسعير) بيتشال، والتدعيم بيفضل
      const its = (o.items||[]).filter(it=>!quoteOnlyLine_(it));
      const sumRow=[o.id, xlDate_(o.ts), o.name||'', String(o.phone||''), o.region||'', o.warehouse||WAREHOUSE, o.status||'', its.length];
      if(priced) sumRow.push(Number(o.total)||0);
      sum.push(sumRow);
      its.forEach(it=>{
        const isDoor=it.kind==='door', isRod=it.kind==='frame'||it.kind==='bror';
        const pp=itemProdPending_(it);
        const row=[
          o.id, xlDate_(o.ts), o.name||'', String(o.phone||''), o.region||'', o.status||'',
          isDoor?'Door':(it.kind==='frame'?'Frame':it.kind==='bror'?'Bror':it.kind==='panel'?'Panel':it.kind==='mabra'?'Mabra':METER_KINDS_[it.kind]?METER_KINDS_[it.kind].type:'Accessory'),
          it.titleEn||it.title||'', it.code||'',
          isDoor?(it.sizeEn||it.sizeTxt||''):(isRod?(it.spec||''):((it.kind==='panel'||it.kind==='mabra'||METER_KINDS_[it.kind])?(it.spec||''):'')),
          isDoor?(it.doorHeight||''):'',
          isDoor?(it.frame||''):'',
          isDoor?(it.frameHeight||''):'',
          isDoor?(it.dbror||''):'',
          isDoor?(it.millEn||''):'',
          isDoor?'door':(it.isSet?'set':(isRod?('rod '+(it.rodCm||220)+'cm'):(it.unit||'pc'))),
          Number(it.qty)||0, pp.produced, pp.pending,
          it.avail===false?'N':'Y'
        ];
        if(priced) row.push(Number(isDoor?it.unitPrice:it.price)||0, Number(linePrice(it))||0);
        det.push(row);
      });
    });

    const wb = new ExcelJS.Workbook();
    wb.creator = COMPANY;
    const fill = (ws, head, rows) => {
      ws.views = [{ state:'frozen', ySplit:1, rightToLeft:false }];
      const hr = ws.addRow(head);
      hr.eachCell(c=>{
        c.font = { bold:true, color:{argb:'FFFFFFFF'}, size:11 };
        c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF002050'} };
        c.alignment = { horizontal:'center', vertical:'middle' };
      });
      hr.height = 22;
      rows.forEach(r=>xlDateCell_(ws.addRow(r), 2));   // عمود Date هو التاني في الورقتين
      ws.autoFilter = { from:{row:1,column:1}, to:{row:1,column:head.length} };
      head.forEach((h,i)=>{
        if(String(h)==='Date'){ ws.getColumn(i+1).width = 12; return; }   // قيمة تاريخ، مش نص يتقاس
        let w = String(h).length + 2;
        rows.forEach(r=>{ const v=r[i]==null?'':String(r[i]); if(v.length+2>w) w=v.length+2; });
        ws.getColumn(i+1).width = Math.min(38, Math.max(9, w));
      });
    };
    fill(wb.addWorksheet('Orders'), sumHead, sum);
    fill(wb.addWorksheet('Order_Items'), detHead, det);

    const buf = await wb.xlsx.writeBuffer();
    await shareOrDownload_(
      new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),
      fname+'.xlsx', fname);
  }catch(err){ toast('تعذّر التصدير: '+(err&&err.message?err.message:err)); }
  busy(false);
}

function toggleTheme_(){
  const cur=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
  const nx=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',nx);
  try{ localStorage.setItem('wpc_theme',nx); }catch(e){}
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content',nx==='dark'?'#0A1830':'#2E7FF0');
}

async function doUpdate(){
  busy(true,'جارٍ التحديث…');
  try{
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
  }catch(e){}
  // بنضيف طابع وقت للرابط عشان نتخطى كاش المتصفح نفسه — location.reload لوحدها
  // ممكن ترجّع نفس النسخة القديمة من الكاش.
  const u = new URL(location.href);
  u.searchParams.set('v', Date.now());
  location.replace(u.toString());
}

}

function isIOSDevice(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

      ٢ — اختار «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية»`;
