// لو التخزين كان مخرب وقت الفتح، نقول للمستخدم بدل ما نسكت. الأصل المخرب
// محفوظ في مفتاح جانبي (wpc_orders_corrupt) فلسه ينفع يترجع يدويًا.
if(_storeProblems_.length){
  const طلبات = _storeProblems_.find(p=>p.key===LS_ORDERS);
  setTimeout(()=>{
    if(طلبات && طلبات.recovered) toast('⚠️ بيانات الجهاز كانت مقطوعة — رجّعنا '+طلبات.recovered
      +' طلب. لو فيه طلبات ناقصة هتلاقيها عند المصنع في «تابع طلبك».', 9000);
    else if(طلبات) toast('⚠️ قايمة الطلبات على جهازك كانت مخربة ومقدرناش نرجّعها. '
      +'طلباتك كلها لسه عند المصنع — اضغط تحديث في «تابع طلبك».', 9000);
  }, 1200);
}

// بيمسح أي "نيات إلغاء" فضلت معلّقة من مرة سابقة — حتى لو الطلب الجديد
// بتاعها كان اتبعت واتأكد من زمن. ده بيغطي حالة إن cancelOldOrder_ فشل
// لظرف عابر (النت قطع لحظة استدعاء المسح بالذات) بعد ما الطلب الجديد
// خلاص وصل ولم يعد في قايمة "لسه معلّق" — يعني الحلقة العادية
// (retryPendingOrders_) ما كانتش هتحاول تمسح القديم تاني أبدًا، فالطلب
// القديم يفضل ظاهر جنب الجديد للأبد من غير أي تنبيه واضح.
let _retryCancelsRunning = false;
async function retryPendingCancels_(){
  if(_retryCancelsRunning) return;
  if(!APPS_SCRIPT_URL || !navigator.onLine) return;
  const list = loadPendingCancels_();
  if(!list.length) return;
  _retryCancelsRunning = true;
  try{
    const نجح = [];
    for(const hit of list){
      if(await cancelOldOrder_(hit)) نجح.push(hit);
    }
    if(نجح.length){
      save(LS_PENDING_CANCEL, loadPendingCancels_().filter(c=>
        !نجح.some(h=>String(h.newId)===String(c.newId) && String(h.prevId)===String(c.prevId))));
    }
  } finally {
    _retryCancelsRunning = false;
  }
}

retryPendingOrders_();   // لو فيه طلبات اتسجلت على الجهاز بس ما وصلتش المصنع، نحاول تاني
retryPendingCancels_();  // لو فيه طلبات قديمة اتعدّلت وفشل مسحها من عند المصنع، نحاول تاني
syncPricesFromServer_(); // أحدث أسعار من المصنع — بتشتغل في الخلفية ومابتوقفش حاجة
window.addEventListener('online', retryPendingOrders_);
window.addEventListener('online', retryPendingCancels_);
window.addEventListener('online', ()=>{ if(load(LS_PRICES_DIRTY,false)) syncPricesFromServer_(); });
// التطبيق اتقفل أو راح للخلفية وفيه صنف مسحوب للتعديل؟ نرجّعه للسلة قبل ما يضيع
window.addEventListener('pagehide', ()=>restorePulledLine_(true));
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) restorePulledLine_(true); });
function markUpdateReady(){
  const btn=document.querySelector('.verstrip [data-act="update"]');
  if(btn) btn.classList.add('vs-install');
  toast('فيه إصدار جديد — اضغط 🔄 تحديث فوق');
}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg=>{
      // لو لقى نسخة جديدة مستنية، بننبّه على زرار التحديث فوق
      if(reg.waiting) markUpdateReady();
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing; if(!nw) return;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed' && navigator.serviceWorker.controller){
            markUpdateReady();
          }
        });
      });
      reg.update().catch(()=>{});                                // فحص فوري عند الفتح
      setInterval(()=>reg.update().catch(()=>{}), 30*60*1000);    // وكل نص ساعة بعد كده
    }).catch(()=>{});
  });
}

/* بيقارن إصدار الجهاز بالإصدار الموجود فعليًا على السيرفر.
   ده اللي بيكشف الحالة اللي مافيهاش أي مؤشر تاني: التطبيق شغال بنسخة قديمة
   والسيرفر عليه جديدة، والكاش بيخفي الفرق. لو لقى فرق، بينبّه بوضوح. */
async function checkServerVersion(){
  try{
    // بنطلب أول 40 كيلوبايت بس (رقم الإصدار في أول الملف) بدل ما ننزّل الملف كامل
    // كل فتحة — ده كان بيستهلك باقة المستخدم ويبطّأ التشغيل من غير أي داعي.
    let res = await fetch('index.html?_v=' + Date.now(), { cache:'no-store', headers:{ Range:'bytes=0-40000' } });
    if(!res || !res.ok) res = await fetch('index.html?_v=' + Date.now(), { cache:'no-store' });
    if(!res || !res.ok) return;
    const txt = await res.text();
    const m = /const APP_BUILD\s*=\s*'([^']+)'/.exec(txt);
    if(!m) return;
    const serverVer = m[1];
    if(serverVer && serverVer !== APP_BUILD){
      const el = document.getElementById('vsVer');
      if(el) el.textContent = APP_BUILD + ' → ' + serverVer;
      const btn = document.querySelector('.verstrip [data-act="update"]');
      if(btn) btn.classList.add('vs-install');
      toast('في إصدار ' + serverVer + ' جاهز — اضغط 🔄 تحديث');
    }
  }catch(e){}
}
setTimeout(checkServerVersion, 2500);

// اهتزاز خفيف عند لمس الأزرار والشرايح (بيشتغل على أندرويد، وبيتجاهله آيفون)
try{ if(navigator.vibrate && !matchMedia('(prefers-reduced-motion: reduce)').matches){
  document.addEventListener('click',e=>{ if(e.target.closest && e.target.closest('button[data-act],.chip,.miniChip,.secTile')) navigator.vibrate(7); },{passive:true});
} }catch(_){}

/* ===== بحث لحظي + فلتر الحالة في قايمة الطلبات (v234) ===== */
let _ordF = {q:'', st:''};
const ORD_GROUPS_ = [['','الكل'],['new','جديد'],['prog','شغّال'],['ready','جاهز'],['done','اتسلّم']];
function ordGroup_(st){ st=String(st||'New'); return /^(New|Received)$/i.test(st)?'new' : /progress/i.test(st)?'prog' : /^ready$/i.test(st)?'ready' : /deliver/i.test(st)?'done' : 'other'; }
function ordNorm_(v){ return toLatinDigits_(v).toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim(); }
function ordMatch_(q,grp){ return (!_ordF.st || grp===_ordF.st) && (!_ordF.q || q.includes(ordNorm_(_ordF.q))); }
function ordFilterBar_(){
  const cnt = {}; (state.orders||[]).forEach(o=>{ const g=ordGroup_(homeStatus_(o)); cnt[g]=(cnt[g]||0)+1; });
  const chips = ORD_GROUPS_.map(([k,t])=>{ const n = k ? (cnt[k]||0) : (state.orders||[]).length;
    return (k && !n) ? '' : `<button type="button" class="chip ordChip${_ordF.st===k?' on':''}" data-ofst="${k}">${t} <b>${n}</b></button>`; }).join('');
  return `<div class="ordFilter"><input type="search" id="ordQ" placeholder="ابحث برقم الطلب أو الاسم أو الصنف…" value="${esc(_ordF.q)}" autocomplete="off"><div class="ordChips">${chips}</div></div>`;
}
function applyOrdFilter_(){
  let shown=0, total=0;
  document.querySelectorAll('.ord[data-q]').forEach(c=>{ total++; const ok=ordMatch_(c.dataset.q,c.dataset.st); c.hidden=!ok; if(ok) shown++; });
  const none=document.getElementById('ordNone'); if(none) none.hidden = !(total && !shown);
  document.querySelectorAll('.ordChip').forEach(b=>b.classList.toggle('on', b.dataset.ofst===_ordF.st));
}
document.addEventListener('input',e=>{ if(e.target && e.target.id==='ordQ'){ _ordF.q=e.target.value; applyOrdFilter_(); } });
document.addEventListener('click',e=>{ const b=e.target.closest && e.target.closest('[data-ofst]'); if(b){ _ordF.st=b.dataset.ofst; applyOrdFilter_(); } });

/* ===== شريط السلة العائم على شاشة «طلب جديد» (v234) ===== */
function updateCartFloat_(){
  let el=document.getElementById('cartFloat');
  const show = state.tab==='new' && cartCount()>0;
  if(!el){ if(!show) return; el=document.createElement('button'); el.id='cartFloat'; el.type='button';
    el.onclick=()=>{ state.tab='cart'; render(); window.scrollTo({top:0}); }; document.body.appendChild(el); }
  el.hidden=!show; document.body.classList.toggle('hasFloat',show); if(!show) return;
  let tot=''; try{ if(pricesVisible()) tot='<b>'+money(cartTotal())+' ج</b>'; }catch(_){}
  el.innerHTML = ico('cart')+'<span>السلة · '+cartCount()+' صنف</span>'+tot+'<em>عرض السلة ‹</em>';
  const t=document.getElementById('tabs'); el.style.bottom=((t&&!t.hidden?t.offsetHeight:0)+10)+'px';
}
(function(){ const _rn=renderNow; renderNow=function(){ const r=_rn.apply(this,arguments); try{ updateCartFloat_(); applyOrdFilter_(); applyAdmFilter_(); }catch(_){} return r; }; })();

document.addEventListener('click',e=>{ const b=e.target.closest && e.target.closest('[data-hmk]');
  if(b){ _ordF.st=b.dataset.hmk; _ordF.q=''; state.tab='orders'; render(); window.scrollTo({top:0}); } });

/* ===== بحث العملاء في شاشة المصنع (v238) ===== */
let _admQ = '';
function applyAdmFilter_(){
  const q = ordNorm_(_admQ);
  document.querySelectorAll('.ord[data-grp]').forEach(c=>{ c.hidden = !!q && !ordNorm_(c.dataset.grp).includes(q); });
}
document.addEventListener('input',e=>{ if(e.target && e.target.id==='admQ'){ _admQ=e.target.value; applyAdmFilter_(); } });

/* ===== استرجاع الطلبات على جهاز جديد برقم الموبايل (v241) ===== */
function phoneKey_(){ const p = toLatinDigits_(state.profile.phone||'').replace(/[\s+\-]/g,'').replace(/^(00)?20/,''); return phoneOk(p) ? p.replace(/^0/,'') : ''; }
function maybeLoadTrack_(){
  if(state.track.loading) return;
  const ph = phoneKey_();
  if((state.track.rows===null && (state.orders.length || ph)) || (ph && state.track.phoneUsed!==ph)) loadTrack();
}
function mergeRestored_(rows){
  try{
    const have = new Set(state.orders.map(o=>String(o.id)));
    const gone = new Set((loadDeleted_()||[]).map(String));
    let added = 0;
    (rows||[]).forEach(r=>{
      if(!r || r.id==null || have.has(String(r.id)) || gone.has(String(r.id)) || _deletedIds.has(String(r.id)) || r.superseded) return;
      const qty = Number(r.qty)||0;
      state.orders.push({ id:String(r.id), displayNo:r.displayNo, editCount:r.editCount||0,
        ts: Number(r.ts) || (r.date ? Date.parse(r.date) : 0) || Date.now(), date:r.date||'',
        customer:r.customer||'', note:r.note||'', total:Number(r.total)||0, qty,
        items:[{title:'أوردر مسترجع من جهاز تاني — '+qty+' قطعة', qty, restored:true}], restored:true });
      added++;
    });
    if(added){ state.orders.sort((a,b)=>(b.ts||0)-(a.ts||0)); saveOrders_(state.orders); toast('رجّعنا '+added+' طلب من جهاز تاني برقم موبايلك'); }
  }catch(e){}
}
</script>
