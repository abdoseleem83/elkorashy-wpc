<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ELKORASHI DOORS — طلبات أبواب WPC</title>
<meta name="theme-color" content="#002050">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ELKORASHI">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --navy:#002050;
  --navy-2:#003060;
  --brand:#1080C0;
  --brand-lt:#4FA8DC;
  --wood:#A6642F;
  --wood-lt:#C98A54;
  --wood-bg:#FBF1E7;
  --wood-line:#E8C9A8;
  --bg:#F3F6FA;
  --card:#FFFFFF;
  --ink:#14243A;
  --muted:#6B7A8C;
  --line:#DCE4EC;
  --ok:#1E7A54;
  --ok-bg:#E7F3EE;
  --warn-bg:#FFF6E5;
  --warn-line:#E8C77A;
  --danger:#B3261E;
  --r:16px;
  --shadow:0 4px 18px rgba(0,32,80,.09);
  --mark:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:Arial,'Helvetica Neue',system-ui,sans-serif;
  font-weight:700;                 /* الخط بولد في كل التطبيق */
  background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.6;padding-bottom:30px;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,b,strong{font-family:Arial,'Helvetica Neue',system-ui,sans-serif;font-weight:700}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;font-weight:700}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ بوابة التثبيت — شاشة كاملة قبل أي حاجة تانية ============ */
#installGate{
  position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(170deg,var(--navy),var(--navy-2));color:#EAF2FA;
  padding:32px 24px calc(28px + env(safe-area-inset-bottom));text-align:center;
}
#installGate.hidden{display:none}
#installGate img.gatelogo{width:96px;height:96px;border-radius:20px;background:#fff;padding:10px;object-fit:contain;margin-bottom:20px;box-shadow:0 8px 26px rgba(0,0,0,.3)}
#installGate h1{font-size:19px;margin:0 0 10px;line-height:1.4}
#installGate .gatesub{font-size:13.5px;color:#B9CBDD;line-height:1.75;max-width:320px;margin:0 0 26px}
.gatebtn{
  display:block;width:100%;max-width:320px;padding:15px;border-radius:14px;
  background:linear-gradient(180deg,var(--gold-lt,#E4C766),var(--gold,#C9A227));
  color:#2A1F18;font-family:Arial,'Helvetica Neue',sans-serif;font-size:15.5px;font-weight:700;
  box-shadow:0 6px 20px rgba(201,162,39,.35);
}
.gatehint{font-size:11.5px;color:#8FA3BC;margin-top:12px;max-width:300px;line-height:1.6}
.gatesteps{background:rgba(255,255,255,.07);border-radius:12px;padding:14px;max-width:320px;margin-bottom:18px;text-align:right}
.gatestep{font-size:12.5px;line-height:1.7;color:#DCE7F2;display:flex;gap:8px;margin-bottom:9px}
.gatestep:last-child{margin-bottom:0}
.gatestep b{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;display:grid;place-items:center}
.gateskip{margin-top:20px;font-size:12.5px;color:#9CB6D2;text-decoration:underline;background:none}

/* ============ الهيدر ============ */
#appbar{position:sticky;top:0;z-index:40}
#appbar::after{content:'';display:block;height:3px;background:linear-gradient(90deg,var(--wood),var(--wood-lt) 45%,var(--brand-lt))}
.top{
  background:linear-gradient(160deg,var(--navy),var(--navy-2));
  color:#EAF2FA;padding:calc(9px + env(safe-area-inset-top)) 14px 9px;
  box-shadow:0 2px 14px rgba(0,32,80,.3);
}
.top-row{display:flex;align-items:center;gap:11px}
.top img.logo{height:38px;width:auto;background:#fff;border-radius:8px;padding:4px 7px;flex:0 0 auto}
.top .t1{font-family:Arial,'Helvetica Neue',sans-serif;font-size:14.5px;font-weight:600;line-height:1.3}
.top .t2{font-size:11px;color:#9CB6D2;margin-top:1px}
.wh-chip{
  margin-inline-start:auto;flex:0 0 auto;text-align:center;
  background:rgba(79,168,220,.15);border:1px solid rgba(79,168,220,.42);
  color:#9FD1F0;border-radius:9px;padding:4px 9px;font-size:10.5px;line-height:1.35;
}
.wh-chip b{display:block;font-size:12px;color:#DCEEFB}


/* شريط التثبيت/التحديث — تحت اللوجو على طول زي تطبيق الموزعين */
/* شريط الإصدار/التحديث/التثبيت — أعلى الصفحة جنب اللوجو */
.verstrip{display:flex;align-items:center;gap:7px;margin-top:8px}
.verstrip .vs-ver{font-size:10.5px;color:#9CB6D2;flex:1;min-width:0}
.verstrip button{
  flex:0 0 auto;background:rgba(255,255,255,.14);border:1px solid rgba(159,209,240,.4);
  color:#EAF2FA;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:600;
  white-space:nowrap;
}
.verstrip button.vs-install{background:linear-gradient(180deg,var(--brand-lt),var(--brand));border-color:transparent;color:#fff}
.verstrip button[hidden]{display:none}


/* شريط الأقسام فوق (الأبواب / الإكسسوارات / حلق فقط / برور فقط) */
.secnav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:13px}
.secnav button{
  background:var(--card);border:1.5px solid var(--line);border-radius:12px;
  padding:10px 4px;text-align:center;box-shadow:var(--shadow);
}
.secnav button .i{display:block;margin:0 auto 4px;width:22px;height:22px;color:var(--muted)}
.secnav button.on .i{color:var(--wood)}
.secnav button .tx{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.secnav button.on{border-color:var(--brand);background:linear-gradient(180deg,#fff,#F3F9FE)}
.secnav button.on .tx{color:var(--navy)}

/* شبكة الإكسسوارات المصغّرة — ٣ في الصف */
.accgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.accgrid .ac{border:1.5px solid var(--line);border-radius:11px;padding:8px 6px 7px;text-align:center;background:#FCFDFE}
.accgrid .ac b{display:block;font-size:11px;font-weight:600;line-height:1.28;min-height:28px}
.accgrid .ac .pr{font-size:10px;color:var(--muted);margin:2px 0 7px}
.accgrid .ac .qty{transform:scale(.82);transform-origin:center;margin:0 auto;width:fit-content}

/* لوحة تفاصيل الباب — بتظهر تحت صف الباب المختار جوه نفس الشبكة */
.doorpanel{grid-column:1/-1;background:#F7FAFD;border:1px dashed var(--brand);border-radius:12px;padding:12px;margin:2px 0 4px}
/* المقاس / الحلق / البرور — أعمدة جنب بعض تحت الباب المختار */
.specgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.specol{display:flex;flex-direction:column;gap:5px;min-width:0}
.specol .sol-h{font-size:10px;color:var(--muted);text-align:center;font-weight:600}
.specol .colchip{
  width:100%;padding:7px 2px;border:1.5px solid var(--line);border-radius:8px;
  background:#FCFDFE;font-size:10.5px;font-weight:500;text-align:center;line-height:1.25;
}
.specol .colchip .ic{display:block;font-size:14px;line-height:1.1;margin-bottom:1px}
.specol .colchip .sub{display:block;font-size:8.8px;color:var(--muted);font-weight:400;margin-top:1px}
.specol .colchip.on{background:var(--navy);border-color:var(--navy);color:#EAF2FA}
.specol .colchip.on .sub{color:#9CB6D2}
.doorpanel .dphead{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.doorpanel .dphead b{font-family:Arial,'Helvetica Neue',sans-serif;font-size:14px;color:var(--navy)}
.doorpanel .dphead span{font-size:11.5px;color:var(--muted)}
.doorpanel .grp{font-size:11.5px;color:var(--muted);margin:11px 0 6px}
.doorpanel .dphead + .grp{margin-top:0}
.grp{font-size:12px;font-weight:700;color:var(--wood);margin:11px 0 6px}
.prow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.prow:last-of-type{border-bottom:0}
.prow span{flex:1;font-size:12.5px;color:var(--ink)}
.prow small{color:var(--muted)}
.prow input{width:84px;flex:0 0 auto;text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px 4px;font-size:13px}
.prow input:focus{border-color:var(--wood);outline:none}
.prow .u{flex:0 0 auto;width:auto;font-size:12px;color:var(--muted)}
.prow3{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.prow3:last-of-type{border-bottom:0}
.prow3 .lbl{flex:1 1 100%;font-size:12.5px;color:var(--ink);margin-bottom:2px}
.prow3 .lbl small{color:var(--muted)}
.prow3 .tri{display:flex;gap:5px;flex:1 1 100%}
.prow3 .tcell{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.prow3 .tcell b{font-size:9.5px;color:var(--muted);font-weight:700}
.prow3 input{width:100%;text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px 2px;font-size:12.5px;min-width:0}
.prow3 input:focus{border-color:var(--wood);outline:none}
.ptri-head{display:flex;gap:5px;padding:4px 0 2px}
.ptri-head b{flex:1;text-align:center;font-size:10.5px;color:#1080C0;font-weight:700}

/* ============ التبويبات ============ */

/* ============ أيقونات SVG — هوية بصرية موحّدة بدل الإيموجي ============
   كلها stroke-based بنفس السُمك والزوايا، وبتاخد لون النص اللي حواليها (currentColor)
   فبتتلوّن تلقائي حسب الزرار/الحالة، وبتطلع نفس الشكل بالظبط على كل الأجهزة
   (الإيموجي كان بيختلف شكله من موبايل للتاني وده كان بيضرب الهوية البصرية). */
.i{width:1.15em;height:1.15em;flex:0 0 auto;vertical-align:-.18em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.i.lg{width:1.5em;height:1.5em}
.i.xl{width:26px;height:26px;stroke-width:1.7}

.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
.tabs[hidden]{display:none}
.tabs button{flex:1;padding:9px 2px 7px;font-size:11px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;
  display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tabs button .i{width:21px;height:21px}
.tabs button.on .i{color:var(--brand)}
.tabs button.on{color:var(--navy);border-bottom-color:var(--brand);font-weight:600}
.tabs .badge{position:absolute;top:4px;inset-inline-end:calc(50% - 20px);min-width:17px;padding:0 4px;
  background:var(--brand);color:#fff;border-radius:20px;font-size:10px;line-height:17px;font-weight:700;
  box-shadow:0 1px 4px rgba(0,32,80,.25)}
.tabs .badge[hidden]{display:none}

.wrap{padding:14px;max-width:660px;margin:0 auto;position:relative}

/* ============ الكروت + علامة مائية ============ */
.card{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:14px;margin-bottom:13px;box-shadow:var(--shadow);
  overflow:hidden;
}
/* اللوجو خلفية باهتة في كل كارت */
.card::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:var(--mark) no-repeat left 8px bottom 8px;
  background-size:42px auto;opacity:.05;
}
.card>*{position:relative}

.step{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.step .n{
  font-family:Arial,'Helvetica Neue',sans-serif;font-size:11.5px;font-weight:700;color:#fff;
  background:linear-gradient(160deg,var(--brand-lt),var(--brand));border-radius:9px;width:28px;height:28px;
  display:grid;place-items:center;flex:0 0 auto;box-shadow:0 2px 6px rgba(16,128,192,.3);
}
.step .n .i{width:16px;height:16px;stroke-width:2}
.step h2{font-size:15px;margin:0}
.step .hint{font-size:11px;color:var(--muted);margin-inline-start:auto;font-weight:400}

label.fld{display:block;margin-bottom:10px}
label.fld span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
label.fld span .req{color:var(--danger);font-weight:700}
input[type=text],input[type=tel],input[type=number],select,textarea{
  width:100%;padding:10px 11px;border:1.5px solid var(--line);border-radius:10px;background:#FCFDFE;
}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none}
input.bad{border-color:var(--danger);background:#FFF6F5}
input::placeholder{color:#A8B4C2}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ============ رف الأبواب ============ */
.rail{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 9px;padding:4px 2px 6px}
/* وضع التركيز: الباب المختار لوحده وجنبه زرار الرجوع للأكواد */
.focusrow{display:flex;align-items:center;gap:12px;padding:2px 2px 10px;border-bottom:1px solid var(--line);margin-bottom:11px}
.focusrow .door{width:88px;flex:0 0 auto}
.stktbl{width:100%;border-collapse:collapse;font-size:12px;min-width:420px}
.stktbl th{background:var(--navy);color:#EAF2FA;padding:7px 5px;font-size:11px;white-space:nowrap}
.stktbl td{border-bottom:1px solid var(--line)}
.stktbl tbody tr:nth-child(even){background:#F7FAFC}
.stkin{width:100%;min-width:56px;border:1.5px solid var(--line);border-radius:8px;
  padding:7px 4px;text-align:center;font-size:14px;font-weight:700;color:var(--ink);background:#fff}
.stkin:focus{border-color:var(--brand);outline:none}
.stkin.dirty{border-color:#C08A3E;background:#FFF9F0}
/* المقاس المتوفر بالمخزن: خلفية خضرا وكلام بولد عشان يبان فورًا */
.specol .colchip.instock{background:#DCF1E6;border-color:#4FA986;color:#14603F;font-weight:700}
.specol .colchip.instock .sub{color:#2E7D5B;font-weight:700}
.specol .colchip.instock .stk{display:block;font-size:9.5px;font-weight:700;color:#0F5237;margin-top:2px}
/* لو مختار ومتوفر — يفضل الأخضر واضح مع تمييز الاختيار */
.specol .colchip.instock.on{background:#1E7A54;border-color:#14603F;color:#fff}
.specol .colchip.instock.on .sub,
.specol .colchip.instock.on .stk{color:#CFEBDD}
.colchip .stk{display:block;font-size:9.5px;font-weight:700;color:#1E7A54;margin-top:2px}
.door .rdy{display:inline-flex;align-items:center;gap:3px;margin-top:3px;font-size:9.5px;
  font-weight:700;color:#1E7A54;background:#E7F3EE;border-radius:20px;padding:2px 7px}
.door .rdy .i{width:11px;height:11px}
.stockbar{display:flex;align-items:flex-start;gap:8px;margin-top:11px;padding:10px 12px;
  border-radius:10px;font-size:12px;line-height:1.5}
.stockbar .i{flex:0 0 auto;margin-top:1px}
.stockbar.ok{background:#E7F3EE;border:1.5px solid #8FC7B0;color:#14603F}
.stockbar.part{background:#FFF6E5;border:1.5px solid #E8C9A8;color:#8A6512}
.stockbar.out{background:#F3F6FA;border:1.5px solid var(--line);color:var(--muted)}
.rodrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rodbox{border:1.5px solid var(--line);border-radius:11px;padding:10px;background:#fff;text-align:center}
.rodbox .rl{font-size:12px;font-weight:700;color:var(--navy);line-height:1.4}
.rodbox .rl b{color:var(--wood)}
.rodbox .rl small{display:block;font-size:10px;font-weight:400;color:var(--muted)}
.rodbox input{width:100%;margin-top:7px;border:1.5px solid var(--line);border-radius:9px;
  padding:9px 6px;text-align:center;font-size:16px;font-weight:700;color:var(--ink)}
.rodbox input:focus{border-color:var(--wood);outline:none}
.rodbox .rp{margin-top:5px;font-size:10.5px;color:var(--muted)}
.whoswitch{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.whoswitch .who{display:flex;align-items:center;gap:8px;padding:11px 12px;border:1.5px solid var(--line);
  border-radius:11px;background:#fff;text-align:right;color:var(--muted);transition:.15s}
.whoswitch .who span{display:block;font-size:12.5px;font-weight:700;line-height:1.35}
.whoswitch .who small{display:block;font-size:10.5px;font-weight:400;color:var(--muted)}
.whoswitch .who.on{border-color:var(--brand);background:#EAF2FA;color:var(--navy)}
.whoswitch .who.on .i{color:var(--brand)}
.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 11px;
  font-family:inherit;font-size:14px;font-weight:700;resize:vertical;background:#fff;color:var(--ink)}
.fld textarea:focus{border-color:var(--brand);outline:none}
.focusrow .changedoor{width:auto;flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:9px 13px;font-size:12px}
.door{text-align:center;padding:0;min-width:0}
.door .leaf{
  position:relative;width:100%;aspect-ratio:3/4;border-radius:9px;overflow:hidden;
  border:2px solid var(--line);background:#E9EEF4;
  transform-origin:right center;transition:transform .25s ease,border-color .18s,box-shadow .18s;
  box-shadow:0 1px 4px rgba(0,32,80,.1);
}
.door .leaf img{width:100%;height:100%;object-fit:cover;display:block}
.door .leaf.noimg{background:linear-gradient(160deg,#B9CBDD,#4A6580)}
.door .leaf.noimg::before{
  content:attr(data-code);position:absolute;inset:0;display:grid;place-items:center;
  font-family:Arial,'Helvetica Neue',sans-serif;font-size:16px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);
}
.door.on .leaf{border-color:var(--wood);transform:perspective(620px) rotateY(-12deg);box-shadow:-6px 4px 18px rgba(166,100,47,.32)}
.door .zoombadge{
  position:absolute;top:5px;inset-inline-end:5px;width:24px;height:24px;border-radius:50%;
  background:rgba(0,20,50,.55);color:#fff;display:grid;place-items:center;font-size:13px;
  backdrop-filter:blur(2px);z-index:2;
}
.door .code{display:block;font-size:12px;font-weight:600;margin-top:7px;font-family:Arial,'Helvetica Neue',sans-serif}
.door .nm{display:block;font-size:10.5px;color:var(--muted);line-height:1.3}
.door.on .code{color:var(--wood)}

/* ============ الشرايح ============ */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border:1.5px solid var(--line);border-radius:10px;background:#FCFDFE;font-size:13.5px;font-weight:500;text-align:center}
.chip.on{background:var(--navy);border-color:var(--navy);color:#EAF2FA}
.chip .sub{display:block;font-size:10.5px;color:var(--muted);font-weight:400;margin-top:-2px}
.chip.on .sub{color:#9CB6D2}
.chip .ic{display:block;font-size:20px;line-height:1.2;margin-bottom:1px}

.box{margin-top:11px;padding:11px;background:#F7FAFD;border:1px dashed var(--brand);border-radius:11px}
.note{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.55}
.note b{color:var(--brand)}
/* ============ العداد ============ */
.qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;width:fit-content;background:#FCFDFE}
.qty button{width:40px;height:40px;font-size:19px;font-weight:600;color:var(--brand);display:grid;place-items:center}
.qty button:active{background:#EDF3F9}

/* ============ التوست + اللودر ============ */
#toast{
  position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));inset-inline:16px;z-index:95;

/* ============ الشريط السفلي ============ */

/* ============ المستند (عرض سعر / طلب) ============ */
#paper{position:fixed;top:-10000px;left:-10000px;width:794px;background:#fff}

<script>
'use strict';

/* ============================================================
   الإعدادات
   ============================================================ */
const ASSETS = {
  logo:'img/logo.png',
  mark:'img/mark.png',
  doors:{
    A01:'img/doors/A01.jpg',
    A02:'img/doors/A02.jpg',
    A03:'img/doors/A03.jpg',
    A04:'img/doors/A04.jpg',
    A05:'img/doors/A05.jpg',
    A06:'img/doors/A06.jpg',
    A07:'img/doors/A07.jpg',
    A08:'img/doors/A08.jpg',
    A09:'img/doors/A09.jpg',
    A010:'img/doors/A010.jpg',
    A015:'img/doors/A015.jpg'
  }
};

// اللوجو والصور بقت ملفات منفصلة بدل ما تكون base64 جوه الكود (أخف وبتتكاش لوحدها).
// الدالة دي بتجيب اللوجو كـ base64 مرة واحدة بس وتخزّنه — محتاجينه بالشكل ده لمكتبة الإكسيل (ExcelJS).
let _logoB64Cache = null;
async function logoBase64_(){
  if(_logoB64Cache) return _logoB64Cache;
  try{
    const res = await fetch(ASSETS.logo);
    const blob = await res.blob();
    _logoB64Cache = await new Promise((resolve,reject)=>{
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result).split(',')[1]);
      fr.onerror = reject;
      fr.readAsDataURL(blob);
    });
  }catch(e){ _logoB64Cache = null; }
  return _logoB64Cache;
}

// بنحمّل صور الأبواب واللوجو بدري في الخلفية عشان تبقى جاهزة في كاش المتصفح
// وقت ما المستخدم يفتح لوحة اختيار الباب أو يعمل تصدير PDF/صورة (بدل ما تتأخر في اللحظة دي).
function preloadDoorImages_(){
  [ASSETS.logo, ASSETS.mark, ...Object.values(ASSETS.doors)].forEach(src=>{
    const im = new Image(); im.src = src;
  });
}

const APP_BUILD   = 'v74';
const COMPANY     = 'ELKORASHI DOORS';
const COMPANY_AR  = 'القرشي لأبواب WPC';
const WAREHOUSE   = 'مصنع إنشاص';
const ADMIN_WHATS = '201067765483';   // مش مستخدم في إرسال الطلبات دلوقتي — سايبه لو احتجناه تاني
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw2aVRVaUVubR3w4a3weiQTHGp03SvMozh83NY3OtBD14n1YugCjbcWdYEJUPJb-s3E/exec';

/* ============================================================
   أطوال الأعواد الحقيقية (المصنع)
   الحلق بيتقطّع مقاسين: قائم ٢٢٠ سم (جنبي الباب) وعتب ١١٠ سم (فوق الباب).
   البرور عود واحد ٢٢٦ سم.
   التسعير بيتحسب بالمتر الطولي × طول العود الفعلي — فكل مقاس له سعره.
   ============================================================ */
const FRAME_ROD_TYPES = [
  { key:'jamb',   cm:220, label:'قائم', hint:'جنبي الباب' },
  { key:'header', cm:110, label:'عتب',  hint:'أعلى الباب' }
];
const BROR_ROD_CM = 226;
const ROD_LEN = 2.20;   // للتوافق مع الكود القديم — الطول الافتراضي للحلق بالمتر

/* ============================================================
   متطلبات التقطيع للباب الواحد (بيانات المصنع)
   الباب بياخد: ٣ أعواد حلق — عودين ٢٢٠ سم (القوائم) + عود ١١٠ سم (العتب)
                ٥ أعواد برور — كل عود ٢٢٦ سم
   الأرقام دي بتتحسب أوتوماتيك لكل باب وبتظهر في مستند الطلب
   عشان المصنع يعرف يقطّع على طول من غير حسابات بالإيد.
   ============================================================ */
const FRAME_PER_DOOR = [
  { qty:2, cm:220, label:'قائم' },     // جنبي الباب
  { qty:1, cm:110, label:'عتب'  }      // أعلى الباب
];
const BROR_PER_DOOR  = { qty:5, cm:BROR_ROD_CM };

// إجمالي أعواد الحلق/البرور المطلوبة لعدد أبواب
function frameRodsFor(doorQty){
  const n = Number(doorQty)||0;
  return FRAME_PER_DOOR.map(f=>({ ...f, total:f.qty*n }));
}
function brorRodsFor(doorQty){
  const n = Number(doorQty)||0;
  return { ...BROR_PER_DOOR, total:BROR_PER_DOOR.qty*n };
}
// نص مختصر يتعرض جنب الباب في المستندات
function cutText_(it){
  if(it.kind!=='door') return '';
  const parts=[];
  if(it.frame) parts.push(frameRodsFor(it.qty).map(f=>f.total+'×'+f.cm+' سم').join(' + ')+' حلق');
  if(it.dbror) parts.push(brorRodsFor(it.qty).total+'×'+BROR_PER_DOOR.cm+' سم برور');
  return parts.join(' · ');
}

// بيبني نص الحلق شامل الارتفاع الخاص لو الموزع/العميل حدده (اختياري)
function frameText_(cm, height){
  if(!cm) return '';
  return cm+' سم' + (height?' (ارتفاع '+height+' سم)':'');
}
const PRICE_NOTE = 'الأسعار بعاليه حسب وقت التسعير وغير ملزمة إلا في حالة سداد المبلغ كامل أو نصفه.';

const DOORS = [
  {code:'A01', name:'أرو',   en:'Arrow',  img:ASSETS.doors.A01},
  {code:'A02', name:'خشبي',  en:'Wood',   img:ASSETS.doors.A02},
  {code:'A03', name:'أرو',   en:'Arrow',  img:ASSETS.doors.A03},
  {code:'A04', name:'خشبي',  en:'Wood',   img:ASSETS.doors.A04},
  {code:'A05', name:'بني',   en:'Brown',  img:ASSETS.doors.A05},
  {code:'A06', name:'أبيض',  en:'White',  img:ASSETS.doors.A06},
  {code:'A07', name:'بني',   en:'Brown',  img:ASSETS.doors.A07},
  {code:'A08', name:'زان',   en:'Beech',  img:ASSETS.doors.A08},
  {code:'A09', name:'شيري',  en:'Cherry', img:ASSETS.doors.A09},
  {code:'A010', name:'رمادي', en:'Grey',   img:ASSETS.doors.A010},
  {code:'A015', name:'أرو فاتح', en:'Light Arrow', img:ASSETS.doors.A015}
];

const SIZES = [{w:70,price:5200},{w:80,price:5200},{w:90,price:5400},{w:100,price:6000}];
let CUSTOM_EXTRA = 300;

/* الحلق — سعر المتر الطولي، وبيتباع بالعود 2.15 م */
const FRAMES = [{cm:10,price:117.81},{cm:15,price:144.14},{cm:20,price:170.47}];

/* البرور — سعر المتر الطولي، وبيتباع بالعود 2.15 م */
const BRORS = [{size:'6×9',price:79.46},{size:'4×8',price:68.20}];

/* تفريز الكالون */
const MILLS = [
  {id:'smart',  ar:'سمارت', en:'Smart',   ic:'🔐'},
  {id:'normal', ar:'عادي',  en:'Standard', ic:'🔑'}
];

const ACCESSORIES = [
  {id:'h1', name:'مقبض باب مودرن / نيو مودرن',  en:'Door Handle - Modern / New Modern',    price:230,  unit:'قطعة'},
  {id:'h2', name:'مقبض حمام مودرن / نيو مودرن', en:'Bathroom Handle - Modern / New Modern', price:250,  unit:'قطعة'},
  {id:'h3', name:'مفصلة أبواب WPC',              en:'WPC Door Hinge',                       price:36,   unit:'قطعة'},
  {id:'h4', name:'زاوية كرسي للأبواب',            en:'Door Seat Angle',                      price:4.27, unit:'قطعة'},
  {id:'h5', name:'قلب كالون نحاس',                en:'Brass Lock Core',                      price:180,  unit:'قطعة'},
  {id:'h6', name:'كالون سلندر نحاس',              en:'Brass Cylinder Lock',                  price:160,  unit:'قطعة'},
  {id:'h7', name:'كالون إشارة نحاس',              en:'Brass Indicator Lock',                 price:160,  unit:'قطعة'},
  {id:'h8', name:'جوان',                          en:'Gasket',                               price:6,    unit:'متر'}
];

const LS_PROFILE = 'wpc_profile', LS_CART = 'wpc_cart', LS_ORDERS = 'wpc_orders', LS_TAB = 'wpc_tab', LS_SECTION = 'wpc_section', LS_PRICES = 'wpc_prices', LS_PENDING = 'wpc_pending_sync';

// مستويات السعر: السعر الأساسي المتخزّن في الكتالوج هو "سعر موزع"، ومنه بتتحسب المستويات التانية بزيادة ثابتة.
// الزيادة بتتطبّق وقت طباعة عرض السعر بس — من غير ما تغيّر الأسعار المتخزّنة نفسها.
const PRICE_TIERS = {
  dist:     { label:'سعر جملة', labelEn:'Wholesale Price', doorAdd:0,   otherAdd:0   },
  showroom: { label:'سعر معرض', labelEn:'Showroom Price',    doorAdd:300, otherAdd:0.5 },
  customer: { label:'سعر عميل', labelEn:'Customer Price',    doorAdd:500, otherAdd:1   }
};
// كل مستوى سعر (جملة/معرض/عميل) بقى بيتخزّن كقيمة مستقلة لكل صنف — مش بيتحسب تلقائي من زيادة ثابتة.
// الزيادات فوق (doorAdd/otherAdd) بتُستخدم بس كقيمة مبدئية أول مرة تفتح فيها شاشة تعديل الأسعار قبل ما تحفظ حاجة بنفسك.
const TIER_OVERRIDES = { showroom:{sizes:{},customExtra:null,frames:{},brors:{},acc:{}}, customer:{sizes:{},customExtra:null,frames:{},brors:{},acc:{}} };
const ACC_EN_TO_ID_ = {}; ACCESSORIES.forEach(a=>{ ACC_EN_TO_ID_[a.en] = a.id; });
// بيرجّع سعر الصنف على مستوى معيّن (جملة/معرض/عميل). لو الصنف ده اتحفظله سعر مخصوص لنفس المستوى بيترجع هو،
// وإلا بيترجع سعر الجملة + الزيادة الافتراضية للمستوى (fallback للأصناف اللي لسه محدّش عدّل سعرها بنفسه).
function tierPrice(basePrice, kind, tierKey, key){
  if(!tierKey || tierKey==='dist') return Number(basePrice)||0;
  const group = kind==='door'?'sizes':kind==='frame'?'frames':kind==='bror'?'brors':'acc';
  const ov = TIER_OVERRIDES[tierKey];
  if(ov){
    if(key==='customExtra'){ if(ov.customExtra!=null) return Number(ov.customExtra)||0; }
    else if(key!=null && ov[group] && ov[group][key]!=null){ return Number(ov[group][key])||0; }
  }
  const t = PRICE_TIERS[tierKey] || PRICE_TIERS.dist;
  const add = kind==='door' ? t.doorAdd : t.otherAdd;
  return (Number(basePrice)||0) + add;
}
// بيستخرج مفتاح الصنف (مقاس الباب/الحلق بالرقم، مقاس البرور، أو كود الإكسسوار) من صنف الطلب —
// المفتاح ده هو اللي بيتربط بيه سعر كل مستوى في TIER_OVERRIDES.
function tierKeyFor_(it, kind){
  if(kind==='door' || kind==='frame'){ const m=/^(\d+)/.exec(String(it.size||'')); return m?Number(m[1]):null; }
  if(kind==='bror') return it.size||null;
  if(kind==='acc') return ACC_EN_TO_ID_[it.title] || null;
  return null;
}

// الدالتين دول بيسمحوا بتعديلها من شاشة المصنع وحفظ التعديل على نفس الجهاز.
function loadPriceOverrides_(){ try{ return JSON.parse(localStorage.getItem(LS_PRICES)||'{}'); }catch(e){ return {}; } }
function applyPriceOverrides(){
  const ov = loadPriceOverrides_();
  // توافق مع الشكل القديم (كان فيه سعر جملة بس، من غير مستويات معرض/عميل مخصوصة)
  const dist = ov.dist || ov;
  if(dist.sizes) SIZES.forEach(s=>{ if(dist.sizes[s.w]!=null) s.price=Number(dist.sizes[s.w])||0; });
  if(dist.customExtra!=null) CUSTOM_EXTRA = Number(dist.customExtra)||0;
  if(dist.frames) FRAMES.forEach(f=>{ if(dist.frames[f.cm]!=null) f.price=Number(dist.frames[f.cm])||0; });
  if(dist.brors) BRORS.forEach(b=>{ if(dist.brors[b.size]!=null) b.price=Number(dist.brors[b.size])||0; });
  if(dist.acc) ACCESSORIES.forEach(a=>{ if(dist.acc[a.id]!=null) a.price=Number(dist.acc[a.id])||0; });
  ['showroom','customer'].forEach(tk=>{
    const t = ov[tk]; if(!t) return;
    if(t.sizes) TIER_OVERRIDES[tk].sizes = {...t.sizes};
    if(t.customExtra!=null) TIER_OVERRIDES[tk].customExtra = t.customExtra;
    if(t.frames) TIER_OVERRIDES[tk].frames = {...t.frames};
    if(t.brors) TIER_OVERRIDES[tk].brors = {...t.brors};
    if(t.acc) TIER_OVERRIDES[tk].acc = {...t.acc};
  });
}
applyPriceOverrides();

const READY_HOURS_TXT = 'التسليم خلال ٤٨ ساعة من المصنع';

// بيرجّع الرصيد المتاح لكود + مقاس (المقاس بالسم كرقم، أو '' لأي مقاس)
function stockFor(code, sizeW){
  const rows = state.stock.rows;
  if(!rows || !code) return null;
  const want = String(sizeW==null?'':sizeW).trim();
  const hit = rows.find(r=>String(r.code).trim()===String(code).trim()
                        && String(r.size).trim()===want);
  return hit ? (Number(hit.qty)||0) : 0;
}
// إجمالي رصيد الكود على كل المقاسات — للشارة على كارت الباب
function stockTotalFor(code){
  const rows = state.stock.rows;
  if(!rows || !code) return null;
  return rows.filter(r=>String(r.code).trim()===String(code).trim())
             .reduce((n,r)=>n+(Number(r.qty)||0),0);
}

async function loadStock(force){
  if(!APPS_SCRIPT_URL) return;
  if(state.stock.loading) return;
  if(!force && state.stock.rows && Date.now()-state.stock.at < 120000) return;  // كاش دقيقتين
  state.stock.loading = true;
  try{
    const d = await jsonp(APPS_SCRIPT_URL + '?action=stock');
    if(d && d.ok){ state.stock.rows = d.stock || []; state.stock.at = Date.now(); }
  }catch(err){ /* الرصيد إضافة مساعدة — لو فشل مايوقفش الطلب */ }
  state.stock.loading = false;
  render();
}

// بيحفظ كل التعديلات المعلّقة على الأرصدة واحدة واحدة
async function saveStockDrafts(){
  const a = state.admin;
  const keys = Object.keys(a.stockDraft).filter(k=>{
    const [c,w] = k.split('|');
    return Number(a.stockDraft[k]) !== Number(stockFor(c, Number(w))||0);
  });
  if(!keys.length){ toast('مفيش تعديلات'); return; }
  busy(true,'جارٍ حفظ الأرصدة…');
  let done=0, failed=0;
  for(const k of keys){
    const [code, w] = k.split('|');
    a.stockBusy = k;
    try{
      const d = await jsonp(APPS_SCRIPT_URL
        + '?action=setStock&pw=' + encodeURIComponent(a.pw)
        + '&code=' + encodeURIComponent(code)
        + '&size=' + encodeURIComponent(w)
        + '&qty='  + encodeURIComponent(Math.max(0, Math.round(Number(a.stockDraft[k])||0))));
      if(d && d.ok) done++; else failed++;
    }catch(err){ failed++; }
  }
  a.stockBusy = null;
  a.stockDraft = {};
  await loadStock(true);          // نرجّع الأرصدة من السيرفر عشان الشاشة تطابقه
  busy(false);
  toast(failed ? ('اتحفظ '+done+' وفشل '+failed) : ('اتحفظت '+done+' أرصدة'));
}

function currentSummary(){
  const p=state.pick;
  if(!p.code) return '';
  const d=doorByCode(p.code);

  if(p.size==null) return 'اختر المقاس.';
  let sizeTxt,unit;
  if(p.size==='custom'){
    const w=Number(p.custom.w)||0,h=Number(p.custom.h)||0;
    if(!w||!h) return 'اكتب العرض والارتفاع.';
    sizeTxt=w+'×'+h+' سم (خاص)'; unit=priceForWidth(w)+CUSTOM_EXTRA;
  } else { sizeTxt=p.size+' سم'; unit=priceForWidth(p.size); }

  if(p.frame==null) return 'اختر الحلق (أو «بدون حلق») عشان تكمّل.';
  if(p.dbror==null) return 'اختر البرور (أو «بدون برور») عشان تكمّل.';

  let t='باب '+d.code+' '+d.name+' — '+sizeTxt+' × '+p.qty;
  if(pricesVisible()) t+=' = '+money(unit*p.qty)+' ج';
  if(p.frame) t+=' | حلق '+frameText_(p.frame,p.frameHeight);
  if(p.dbror) t+=' | برور '+p.dbror;
  if(p.frame||p.dbror) t+=' (شامل مع الباب)';
  return t;
}

/* ============================================================
   الأيقونات — مجموعة SVG موحّدة (هوية بصرية ثابتة على كل الأجهزة)
   بديل الإيموجي اللي كان شكله بيختلف من موبايل للتاني.
   ============================================================ */
/* ============================================================
   تجهيز الصور والـ PDF — نسخة محسّنة ضد التهنيج
   المشاكل اللي كانت بتهنّج التطبيق واتحلّت هنا:
   ١) html2canvas بينسخ الصفحة كلها قبل ما يرسم، وصفحتنا فيها صور الأبواب
      كلها base64 (حجم كبير) — فكنا بندفع التكلفة دي في كل تصدير.
      الحل: نخفي شبكة الأبواب مؤقتًا وقت الرسم (onclone) فمابتتنسخش.
   ٢) scale ثابت ٢ حتى للتقارير الطويلة — كان بيطلع كانفس بملايين البكسلات
      فالمتصفح بيقع. الحل: scale بيتحسب حسب طول المستند مع سقف أقصى للبكسلات.
   ٣) الـ PDF الطويل كان بيحط نسخة كاملة من الصورة في كل صفحة (تكرار ضخم).
      الحل: بنقصّ كل صفحة لوحدها من الكانفس ونحطها بحجمها بس.
   ٤) العمليات التقيلة كانت بتقفل الواجهة تمامًا. الحل: بنسيب المتصفح
      يتنفّس بين الخطوات (yield_) فالشاشة تفضل تتحرك ومؤشر التحميل يبان.
   ============================================================ */

const MAX_CANVAS_PIXELS = 16e6;   // سقف آمن يشتغل على الموبايلات الضعيفة

// بتسيب المتصفح يرسم قبل ما نكمل — بتمنع تجميد الواجهة
function yield_(ms){
  return new Promise(r=>requestAnimationFrame(()=>setTimeout(r, ms||0)));
}

// بترسم محتوى #paper وترجّع canvas — بتظبط الـ scale لوحدها حسب الطول
async function renderPaper_(html, opts){
  const paper = document.getElementById('paper');
  paper.innerHTML = html;
  await yield_(60);                       // تفتح مجال للصور/الخطوط تتحمّل
  const el = paper.firstElementChild;
  const w = el.offsetWidth || 794;
  const h = el.offsetHeight || 1123;

  // scale المطلوب مقابل السقف المسموح
  let scale = (opts && opts.scale) || 2;
  const maxScale = Math.sqrt(MAX_CANVAS_PIXELS / Math.max(w*h, 1));
  if(scale > maxScale) scale = Math.max(1, maxScale);

  await yield_(0);
  const canvas = await html2canvas(el, {
    scale,
    backgroundColor:'#ffffff',
    useCORS:true,
    logging:false,
    imageTimeout:15000,
    removeContainer:true,
    // أهم سطر: بنشيل صور الكتالوج من النسخة اللي html2canvas بيرسمها
    onclone: doc => {
      doc.querySelectorAll('.rail, .secnav, .tabs, #view').forEach(n=>{
        if(!n.contains(doc.getElementById('paper'))) n.remove();
      });
    }
  });
  paper.innerHTML = '';
  await yield_(0);
  return canvas;
}

// بتحوّل canvas لـ PDF بتقطيع صفحات حقيقي (مش تكرار نفس الصورة)

// بيحاول يشارك الملف مباشرة (بيظهر واتساب في شاشة المشاركة لو متاحة)، ولو مش متاحة بينزّله عادي
async function shareOrDownload_(blob, filename, title){
  try{
    const file = new File([blob], filename, {type: blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title: title||filename});
      return true;
    }
  }catch(err){
    if(err && err.name==='AbortError') return true;   // العميل قفل شاشة المشاركة، مش خطأ
  }
  downloadBlob(blob, filename);
  toast('اتحمّل الملف — افتح واتساب وابعته من المرفقات');
  return false;
}

async function canvasToPdf_(canvas, filename, opts){
  opts = opts || {};
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF('p','mm','a4');
  const PW = 210, PH = 297;
  const FOOT_H = 5;                               // مساحة صغيرة أسفل الصفحة لرقم الصفحة بس
  const usableH = PH - FOOT_H;
  const pxPerMm = canvas.width / PW;
  const pageHpx  = Math.floor(usableH * pxPerMm); // المحتوى بيتقص على الارتفاع المتاح بس
  const pages = Math.max(1, Math.ceil(canvas.height / pageHpx));

  const slice = document.createElement('canvas');
  const ctx = slice.getContext('2d');

  for(let i=0; i<pages; i++){
    const sy = i * pageHpx;
    const sh = Math.min(pageHpx, canvas.height - sy);
    slice.width = canvas.width;
    slice.height = sh;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,slice.width,slice.height);
    ctx.drawImage(canvas, 0, sy, canvas.width, sh, 0, 0, canvas.width, sh);

    if(i > 0) pdf.addPage();
    pdf.addImage(slice.toDataURL('image/jpeg',0.88), 'JPEG', 0, 0, PW, sh / pxPerMm);

    if(pages > 1){
      pdf.setFontSize(8);
      pdf.setTextColor(120,130,145);
      pdf.text(String(i+1) + ' / ' + pages, PW/2, PH - 2.5, {align:'center'});
    }
    await yield_(0);                                // منع تجميد الواجهة
  }
  if(opts.share){
    const blob = pdf.output('blob');
    await shareOrDownload_(blob, filename, filename);
    return;
  }
  pdf.save(filename);
}

function ico(name, cls){
  const d = ICONS[name];

}

// بنستخدم JSONP (وسم script) بدل fetch — أضمن مع Apps Script ومفيش مشاكل CORS
function jsonp(url, timeout){
  return new Promise((res, rej) => {
    const cb = 'wpcb' + Date.now() + Math.floor(Math.random()*999);
    const sc = document.createElement('script');
    const t = setTimeout(() => { cleanup(); rej(new Error('انتهت المهلة')); }, timeout || 15000);
    function cleanup(){ clearTimeout(t); delete window[cb]; sc.remove(); }
    window[cb] = d => { cleanup(); res(d); };
    sc.onerror = () => { cleanup(); rej(new Error('تعذّر الاتصال')); };
    sc.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.body.appendChild(sc);
  });
}

}

}


async function setStatus(id, st){
  state.admin.busy = id; render();
  try{
    const d = await jsonp(APPS_SCRIPT_URL
      + '?action=setStatus&pw=' + encodeURIComponent(state.admin.pw)
      + '&id=' + encodeURIComponent(id)
      + '&status=' + encodeURIComponent(st));
    if(!d || !d.ok) throw new Error((d && d.error) || 'فشل التحديث');
    const row = (state.admin.rows||[]).find(o=>String(o.id)===String(id));
    if(row) row.status = st;
    if(d.archived){
      // تسليم الطلب بيأرشفه أوتوماتيك — يتشال من القايمة النشطة على طول
      state.admin.rows = (state.admin.rows||[]).filter(o=>String(o.id)!==String(id));
      state.admin.archRows = null;   // الكاش بقى قديم، هيتحمّل تاني لما المصنع يفتح الأرشيف
      toast('اتحدّثت حالة #' + id + ' → ' + (STATUS[st] ? STATUS[st].ar : st) + ' — واتأرشف تلقائي');
    } else {
      toast('اتحدّثت حالة #' + id + ' → ' + (STATUS[st] ? STATUS[st].ar : st));
    }
  }catch(err){
    toast('تعذّر التحديث: ' + (err.message || err));
  }
  state.admin.busy = null; render();
}

async function clearDeliveredOrders(){
  const n = (state.admin.rows||[]).filter(o=>o.status==='Delivered').length;
  if(!n){ toast('مفيش طلبات "تم التسليم" لمسحها'); return; }
  if(!confirm('هيتمسح '+n+' طلب حالتهم "تم التسليم" نهائيًا من الشيت (الطلب وكل أصنافه) — الإجراء ده مش قابل للتراجع. متأكد؟')) return;
  if(!confirm('تأكيد أخير: هيتحذف '+n+' طلب فعلًا ونهائيًا. اضغط موافق للمتابعة.')) return;
  state.admin.loading = true; render();
  try{
    const d = await jsonp(APPS_SCRIPT_URL
      + '?action=deleteDelivered&pw=' + encodeURIComponent(state.admin.pw), 25000);
    if(!d || !d.ok) throw new Error((d && d.error) || 'فشل المسح');
    state.admin.rows = (state.admin.rows||[]).filter(o=>o.status!=='Delivered');
    Object.keys(state.admin.items||{}).forEach(id=>{
      if(!state.admin.rows.find(o=>String(o.id)===id)){ delete state.admin.items[id]; delete state.admin.itemsOpen[id]; }
    });
    toast('اتمسح '+(d.count||n)+' طلب "تم التسليم"');
  }catch(err){
    toast('تعذّر المسح: ' + (err.message || err));
  }
  state.admin.loading = false; render();
}

// بيحدّث qty/rods/total لسطر الطلب في state.admin.rows/archRows بعد أي تعديل يدوي على أصنافه
function applyOrderTotals_(id, totals){
  if(!totals) return;
  [state.admin.rows, state.admin.archRows].forEach(list=>{

}

// بيبني order object موحّد من بيانات شاشة المصنع (list + orderItems) — مستخدم في تصدير الـ PDF وفي مشاركة الصورة
// السيرفر بيخزّن اسم الصنف بالإنجليزي بس (Order_Items عمود Item). بنعيد بناء الاسم العربي
// من نفس الكتالوجات اللي التطبيق أصلًا شغال بيها (DOORS/ACCESSORIES)، مش نص إنجليزي متسيّب.
const ACC_EN_TO_AR_ = {}; ACCESSORIES.forEach(a=>{ ACC_EN_TO_AR_[a.en] = a.name; });
function arabicItemTitle_(it){
  if(it.type==='Door'){
    const d = DOORS.find(x=>x.code===it.code);
    return d ? ('باب WPC '+d.code+' — '+d.name) : (it.title||'');
  }
  if(it.type==='Frame') return 'حلق باب '+(it.size||'')+(it.code?' — '+it.code:'');
  if(it.type==='Bror')  return 'برور '+(it.size||'');
  return ACC_EN_TO_AR_[it.title] || it.title || '';
}

// السيرفر بيخزّن المقاس بالإنجليزي ("70 cm" أو "80x210 cm (custom)") — بنحوّله لنفس صيغة
// العميل العربية ("70 سم" أو "80×210 سم (مقاس خاص)") قبل ما نعرضه في أي مستند
function arabicSizeText_(sizeEn){
  const s = String(sizeEn||'').trim();
  let m = /^(\d+)\s*cm$/i.exec(s);
  if(m) return m[1]+' سم';
  m = /^(\d+)\s*x\s*(\d+)\s*cm\s*\(custom\)$/i.exec(s);
  if(m) return m[1]+'×'+m[2]+' سم (مقاس خاص — مقاس الفتحة المعمارية)';
  return s;
}

function buildAdminDocOrder_(o, its, tierKey){
  return {
    id:o.id, ts:o.date?new Date(o.date).getTime():Date.now(),
    name:o.dist, phone:o.phone, region:o.region, warehouse:'', total:o.total,
    customer:o.customer||'', note:o.ordNote||'',
    priceTierLabel: tierKey ? (PRICE_TIERS[tierKey]||PRICE_TIERS.dist).label : '',
    items: its.map(it=>{
      const sz = it.type==='Door' ? arabicSizeText_(it.size) : (it.size||'');
      const kind = it.type==='Door'?'door':(it.type==='Frame'?'frame':(it.type==='Bror'?'bror':'acc'));
      const price = tierKey ? tierPrice(it.unitPrice||0, kind, tierKey, tierKeyFor_(it, kind)) : (it.unitPrice||0);
      return {
        kind, title: (it.avail===false?'⚠️ غير متاح — ':'') + arabicItemTitle_(it) + (it.type==='Door'&&it.code?' ('+it.code+')':''),
        sizeTxt: sz, spec: sz, unit: it.unit||'', qty: it.qty||0,
        unitPrice: price, price: price,
        frame: it.frame||'', dbror: it.dbror||'', frameHeight: it.frameHeight||''
      };
    })
  };
}

// بيبني مستند PDF للطلب من بيانات شاشة المصنع (بعد ما أصنافه تتحمّل)
// بيبني صف تلات مستويات (جملة/معرض/عميل) لصنف معيّن — سعر الجملة هو الأساسي، والباقي بيتاخد من القيمة
// المحفوظة له لو موجودة، وإلا بتتحسب مبدئيًا بالزيادة الافتراضية لحد ما تحفظ إنت قيمة تانية بنفسك.
function triFor_(basePrice, kind, key){
  return {
    dist: basePrice,
    showroom: tierPrice(basePrice, kind, 'showroom', key),
    customer: tierPrice(basePrice, kind, 'customer', key)
  };
}
function openAdminPrices(){
  state.admin.priceEdit = {
    sizes: Object.fromEntries(SIZES.map(s=>[s.w, triFor_(s.price,'door',s.w)])),
    customExtra: triFor_(CUSTOM_EXTRA,'door','customExtra'),
    frames: Object.fromEntries(FRAMES.map(f=>[f.cm, triFor_(f.price,'frame',f.cm)])),
    brors: Object.fromEntries(BRORS.map(b=>[b.size, triFor_(b.price,'bror',b.size)])),
    acc: Object.fromEntries(ACCESSORIES.map(a=>[a.id, triFor_(a.price,'acc',a.id)]))
  };
  state.admin.pricesOpen = true;
  render(); window.scrollTo({top:0,behavior:'smooth'});
}

function saveAdminPrices(){
  const pe = state.admin.priceEdit; if(!pe) return;
  SIZES.forEach(s=>{ if(pe.sizes[s.w]) s.price=Number(pe.sizes[s.w].dist)||0; });
  CUSTOM_EXTRA = Number(pe.customExtra.dist)||0;
  FRAMES.forEach(f=>{ if(pe.frames[f.cm]) f.price=Number(pe.frames[f.cm].dist)||0; });
  BRORS.forEach(b=>{ if(pe.brors[b.size]) b.price=Number(pe.brors[b.size].dist)||0; });
  ACCESSORIES.forEach(a=>{ if(pe.acc[a.id]) a.price=Number(pe.acc[a.id].dist)||0; });

  const pickGroup = (g, tier) => Object.fromEntries(Object.entries(g).map(([k,v])=>[k, Number(v[tier])||0]));
  const out = { dist:{}, showroom:{}, customer:{} };
  ['dist','showroom','customer'].forEach(tier=>{
    out[tier] = {
      sizes: pickGroup(pe.sizes, tier),
      customExtra: Number(pe.customExtra[tier])||0,
      frames: pickGroup(pe.frames, tier),
      brors: pickGroup(pe.brors, tier),
      acc: pickGroup(pe.acc, tier)
    };
  });
  save(LS_PRICES, out);
  TIER_OVERRIDES.showroom = { sizes:{...out.showroom.sizes}, customExtra:out.showroom.customExtra, frames:{...out.showroom.frames}, brors:{...out.showroom.brors}, acc:{...out.showroom.acc} };
  TIER_OVERRIDES.customer = { sizes:{...out.customer.sizes}, customExtra:out.customer.customExtra, frames:{...out.customer.frames}, brors:{...out.customer.brors}, acc:{...out.customer.acc} };
  state.admin.pricesOpen=false; state.admin.priceEdit=null;
  toast('اتحفظت الأسعار الجديدة');
  render();
}

// بيفتح واتساب من غير رقم محدد — عكس تدفق العميل بالظبط، هنا المصنع هو اللي بيختار
// يبعت الصورة لمين (موزع/مجموعة/أي حد) بدل ما تتقفل على رقم ثابت.
function openWhatsAppFree(text){
  window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(text),'_blank');
}

// بيجهّز صورة الطلب من شاشة المصنع ويسيب المصنع يختار المستلم بنفسه (زرار "📤 إرسال" في كل كارت)
async function shareAdminOrderImage(o){
  await toggleOrderItemsLoadOnly_(o.id);
  const its = state.admin.items[o.id] || [];
  if(!its.length){ toast('مفيش أصناف لهذا الطلب'); return; }
  const doc = buildAdminDocOrder_(o, its);
  const caption = 'طلب أوردر #'+o.id+' — '+(o.dist||'');

  if(typeof html2canvas==='undefined'){
    openWhatsAppFree(caption);
    toast('مفيش نت كفاية لتجهيز الصورة — هيتفتح واتساب بالنص بس');
    return;
  }
  busy(true,'جارٍ تجهيز صورة الطلب…');
  try{
    const canvas = await renderPaper_(docHTML(doc,'order'));
    const blob=await new Promise(res=>canvas.toBlob(res,'image/png',0.95));
    const file=new File([blob],'طلب_'+o.id+'.png',{type:'image/png'});

    if(navigator.canShare && navigator.canShare({files:[file]})){
      // شاشة المشاركة الأصلية بتاعة الموبايل — يختار واتساب وبعدين الشخص/المجموعة بنفسه
      await navigator.share({files:[file], title:'طلب أوردر #'+o.id, text:caption});
    } else {
      downloadBlob(blob,'طلب_'+o.id+'.png');
      openWhatsAppFree(caption);
      toast('اتحمّلت صورة الطلب — اختار واتساب والمستلم وارفقها');
    }
  }catch(err){
    if(err && err.name==='AbortError'){ busy(false); return; }
    toast('تعذّر تجهيز صورة الطلب — هيتفتح واتساب بالنص');
    openWhatsAppFree(caption);
  }
  busy(false);
}

// بيجمع الأصناف المتكررة (نفس الاسم/الكود/المقاس) في سطر واحد بكميتهم مجمّعة
function mergeReportItems_(items){
  const map = {}, ord = [];
  (items||[]).forEach(it=>{
    const key = (it.title||'')+'|'+(it.code||'')+'|'+(it.size||'')+'|'+(it.unit||'')+'|'+(it.frame||'')+'|'+(it.dbror||'')+'|'+(it.frameHeight||'');
    if(!map[key]){ map[key] = {type:it.type, title:arabicItemTitle_(it), code:it.code, size:it.size, frame:it.frame, dbror:it.dbror, frameHeight:it.frameHeight, unit:it.unit, qty:0, avail:true}; ord.push(key); }
    map[key].qty += Number(it.qty)||0;
    if(it.avail===false) map[key].avail = false;
  });
  return ord.map(k=>map[k]);
}

// ============================================================
// تقرير الأبواب المعلّقة — كل عميل، كل طلب بتاريخه، الأبواب مقسّمة حسب المقاس
// (الطلبات المؤرشفة مستبعدة أصلًا من listWithItems؛ هنا كمان بنستبعد الملغي)
// ============================================================
function buildPendingDoorsData_(orders){
  const pending = orders.filter(o=>o.status!=='Cancelled');
  const byCustomer = {}, order = [];
  pending.forEach(o=>{
    // التقرير ده للأبواب بس — الطلبات اللي مفيهاش أبواب (إكسسوارات أو حلق/برور فقط)
    // بتتشال من الأساس عشان ما تظهرش كعناوين فاضية بإجمالي صفر
    if(!(o.items||[]).some(it=>it.type==='Door')) return;
    // التجميع بقى على **صاحب الأوردر** — لو مفيش، بنرجع لصاحب الحساب
    const key = (o.customer && o.customer.trim()) || o.dist || '—';
    if(!byCustomer[key]){ byCustomer[key]=[]; order.push(key); }
    byCustomer[key].push(o);
  });
  return order.map(name=>{
    const ords = byCustomer[name];
    const perOrder = ords.map(o=>{
      const doorItems = (o.items||[]).filter(it=>it.type==='Door');
      const groups={};
      doorItems.forEach(it=>{
        const w = doorWidthGroup_(it.size);
        const key = w!=null ? String(w) : 'خاص';
        (groups[key]=groups[key]||[]).push(it);
      });
      const widths = Object.keys(groups).sort((a,b)=>{
        if(a==='خاص') return 1; if(b==='خاص') return -1; return Number(a)-Number(b);
      });
      return { id:o.id, date:o.date, customer:o.customer||'', phone:o.customerPhone||o.phone||'', groups, widths };
    });
    const total = ords.reduce((s,o)=>s+(o.items||[]).filter(it=>it.type==='Door').reduce((s2,it)=>s2+(Number(it.qty)||0),0),0);
    return { name, perOrder, total };
  }).filter(c=>c.total>0);   // عميل مالوش ولا باب واحد مايظهرش خالص
}

// عدد الأيام من تاريخ الطلب لحد النهاردة — بيتحسب من تاريخ الطلب (yyyy-MM-dd)
function daysSince_(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return null;
  const diff = Math.floor((Date.now() - d.getTime()) / 86400000);
  return diff < 0 ? 0 : diff;
}

// ============================================================
// تقرير حالة الإنتاج — نفس تجميع تقرير الأبواب المعلّقة (لكل عميل/طلب/مقاس)
// بس مع إضافة كام باب خلص إنتاجه وكام لسه لكل صنف ولكل مقاس — ده اللي بيترفع للمصنع
// ============================================================
function buildProductionReportData_(orders){
  const data = buildPendingDoorsData_(orders);
  // buildPendingDoorsData_ بترجّع groups فيها الأصناف الأصلية (من d.items) واللي فيها فعلًا it.produced
  // جاهزة من الـ backend (listWithItems)، فمش محتاجين نجيبها تاني — بس بنحسب الإجماليات هنا
  data.forEach(cust=>{
    cust.perOrder.forEach(o=>{
      o.widths.forEach(w=>{
        const items = o.groups[w];
        items.forEach(it=>{ it.producedN = Math.max(0, Math.min(Number(it.qty)||0, Number(it.produced)||0)); });
      });
    });
  });
  return data;
}

function itemNote_(it){
  const parts=[];
  if(it.frame) parts.push('مع حلق اضافي '+it.frame+' سم'+(it.frameHeight?' (ارتفاع '+it.frameHeight+' سم)':''));
  if(it.dbror) parts.push('بار'+it.dbror);
  return parts.join(' — ') || '';
}
function itemStatus_(it){
  const qty = Number(it.qty)||0;
  const produced = Number(it.produced)||0;
  if(qty>0 && produced>=qty) return {txt:'مكتمل ✔', color:'#1E8E52'};
  if(produced>0) return {txt:'جزئي ('+produced+'/'+qty+')', color:'#B8790A'};
  return {txt:'قيد التصنيع', color:'#B3261E'};
}

  const NAVY='FF002050', TABLE_HDR='FF12314F', LIGHT='FFEAF2FA', WHITE='FFFFFFFF', ZEBRA='FFF6F8FA', BORDER_CLR='FFDCE4EC';
  const thin = {style:'thin', color:{argb:BORDER_CLR}};

  const COLS = 6;

  const wb = new ExcelJS.Workbook();

    { key:'qty',   width:9  },

    ws.mergeCells(r.number,1,r.number,COLS);
    r.eachCell(c=>{ c.font={name:'Arial', size:10.5, color:{argb:'FF233246'}}; c.alignment={horizontal:'right'}; });

  const now = new Date();

  mergedRow('تقرير الأبواب المعلّقة  —  '+dateTimeStr, NAVY, WHITE, true, 13);
  ws.addRow([]);

  const CUST_FILL = ['FF1080C0','FFC08A3E','FF3E9B72','FF7C63C4','FFC25454','FF2C8FA3'];
  const CUST_TINT = ['FFF4F9FD','FFFBF4EC','FFF3F8F5','FFF7F4FB','FFFDF3F3','FFF1F8FB'];

  let n = 0;
  data.forEach(cust=>{
    cust.perOrder.forEach(o=>{
      const fill = CUST_FILL[n % CUST_FILL.length];
      const tint = CUST_TINT[n % CUST_TINT.length];
      n++;
      mergedRow(COMPANY_AR+' — WPC Doors Order Form', fill, WHITE, true, 12);
      infoRow('اسم العميل', o.customer);
      infoRow('رقم الهاتف', o.phone);
      infoRow('تاريخ الطلب', o.date);
      infoRow('موعد التسليم المطلوب', '—');

      const hdr = ws.addRow(['م','كود الباب','المقاس (سم)','الكمية','الحالة','ملاحظات']);
      hdr.eachCell(c=>{
        c.fill = {type:'pattern',pattern:'solid',fgColor:{argb:TABLE_HDR}};
        c.font = {bold:true, color:{argb:WHITE}, name:'Arial', size:10.5};
        c.alignment = {horizontal:'center'};
        c.border = border;
      });

      const rows = [];
      o.widths.forEach(w=> o.groups[w].forEach(it=> rows.push(it)));
      let total = 0;
      rows.forEach((it,idx)=>{
        const qty = Number(it.qty)||0, produced = Number(it.produced)||0;
        total += qty;
        const status = (qty>0 && produced>=qty) ? 'مكتمل ✔' : (produced>0 ? 'جزئي ('+produced+'/'+qty+')' : 'قيد التصنيع');
        const row = ws.addRow([idx+1, it.code||'', it.size||'', qty, status, itemNote_(it)||'—']);
        row.eachCell(c=>{

          c.fill = {type:'pattern',pattern:'solid',fgColor:{argb: idx%2===1 ? ZEBRA : WHITE}};

      if(!rows.length){

      mergedRow('إجمالي عدد الأبواب:  '+total, tint, NAVY, true, 12);
      ws.addRow([]);
    });
  });

  const codesTxt = DOORS.map(d=>d.code).join('، ');
  mergedRow('الأكواد المتاحة: '+codesTxt+'  |  المقاسات المتاحة (سم): 60، 70، 80، 90، 100', 'FFF7F9FB', 'FF6B7A8C', false, 9.5);

  // هامش الطباعة: رقم الصفحة بس (من غير سطر إعداد)
  wb.worksheets.forEach(w=>{
    w.headerFooter = w.headerFooter || {};

  });

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const fname = 'تقرير_الأبواب_المعلقة_'+new Date().toISOString().slice(0,10)+'.xlsx';
  await shareOrDownload_(blob, fname, fname);
}

// ============================================================
// تصدير إكسيل — تقرير الطلبات (شاشة المصنع) — منظّم بالعربي، مجمّع لكل عميل
// بنفس روح تصميم تقرير الأبواب المعلّقة/الـ PDF الشامل (لوجو + ألوان + عناوين عربي)
// ============================================================
const ITEM_TYPE_AR_ = { 'Door':'باب', 'Frame':'حلق', 'Bror':'برور' };
function itemTypeAr_(t){ return ITEM_TYPE_AR_[t] || 'إكسسوار'; }
function itemUnitAr_(u){
  const s = String(u||'').trim();
  if(s==='door') return 'باب';
  if(s==='pc') return 'قطعة';
  if(/^rod\s/.test(s)) return 'عود '+s.replace(/^rod\s/,'')+ (/م$/.test(s)?'':'م');
  return s || '—';
}
// لو الصنف باب معروف (كود من A01..A10) بنرجّع اسمه العربي بدل الاعتماد على النص الإنجليزي المخزّن
function itemNameAr_(it){
  if(it.type==='Door'){
    const d = DOORS.find(x=>x.code===it.code);
    if(d) return 'باب '+d.name+' — '+it.code;
  }
  return it.title || it.code || '—';
}

function buildAdminOrdersDetail_(orders){
  const byCustomer = {}, order = [];
  orders.forEach(o=>{
    const key = o.dist || '—';
    if(!byCustomer[key]){ byCustomer[key]=[]; order.push(key); }
    byCustomer[key].push(o);
  });
  return order.map(name=>{
    const ords = byCustomer[name];
    const codeTotals = {}; // key: type+code -> {label, qty}
    let clientQty = 0;
    ords.forEach(o=>(o.items||[]).forEach(it=>{
      const qty = Number(it.qty)||0;
      clientQty += qty;
      const key = it.type+'|'+(it.code||it.title||'');
      if(!codeTotals[key]) codeTotals[key] = { type:it.type, code:it.code||'', name:itemNameAr_(it), qty:0 };
      codeTotals[key].qty += qty;
    }));
    return { name, orders:ords, clientQty, codeTotals: Object.values(codeTotals).sort((a,b)=>b.qty-a.qty) };
  });
}

  }catch(err){

    busy(false);
  }
}

let adminPollTimer = null;
function startAdminPolling(){
  if(adminPollTimer || !APPS_SCRIPT_URL) return;
  adminPollTimer = setInterval(()=>adminPoll(), 90000);   // فحص خلفي كل ٩٠ ثانية طول ما الشاشة مفتوحة
}

// فحص خلفي: بيقارن آخر حالة معروفة لكل طلب بالحالة الجديدة —
// طلب جديد خالص → يزوّد عداد "معلق" فوق تبويب 🏭. طلب اتغيّرت حالته → إشعار فوري.
async function adminPoll(){
  if(!APPS_SCRIPT_URL || !state.admin.pw) return;
  try{
    const d = await jsonp(APPS_SCRIPT_URL + '?action=list&pw=' + encodeURIComponent(state.admin.pw));
    if(!d || !d.ok) return;
    const rows = d.orders || [];
    const seen = loadAdminSeen_();
    let pending = 0;
    rows.forEach(o=>{
      const prev = seen[o.id];
      if(prev===undefined){
        pending++;
        notifyAdmin_('📥 طلب جديد #'+o.id, o.dist?('من: '+o.dist):'');
      } else if(prev !== o.status){
        const stAr = (STATUS[o.status] && STATUS[o.status].ar) || o.status;
        notifyAdmin_('طلب #'+o.id+' تم تعديله لـ '+stAr, o.dist?('صاحب الطلب: '+o.dist):'');
      }
      seen[o.id] = o.status;
    });
    saveAdminSeen_(seen);
    state.admin.pendingCount = pending;
    updateAdmBadge();
    // لو شاشة متابعة المصنع مفتوحة فعلًا قدام المستخدم، حدّث القايمة المعروضة كمان
    if(state.admin.open && state.tab==='admin'){ state.admin.rows = rows; render(); }
  }catch(err){ /* أعطال الشبكة في الفحص الخلفي بنتجاهلها بصمت */ }
}

  if(it.type==='Door') return arabicSizeText_(it.size||'');
  if(it.type==='Frame') return (it.size||'')+(it.frameHeight?' (ارتفاع '+it.frameHeight+' سم)':'');

}
function prodTableHTML_(oid, its, a, qtyMode){
  const rows = its.map((it,idx)=>{
    const key = oid+':'+idx;
    const qty = Number(it.qty)||0;
    const produced = Math.max(0, Math.min(qty, Number(it.produced)||0));
    const pending = qty - produced;
    const full = qty>0 && produced>=qty;
    const title = esc(arabicItemTitle_(it)) + (it.type==='Door'&&it.code?' ('+esc(it.code)+')':'');

    if(qtyMode){
      const qKey = oid+':'+idx;
      const qBusy = a.qtyBusy === qKey;
      const dBusy = a.itemDelBusy === qKey;
      const draft = a.qtyEdit.hasOwnProperty(qKey) ? a.qtyEdit[qKey] : qty;
      return `<tr>
        <td style="padding:6px 7px;text-align:right;font-size:11px">${title}</td>
        <td style="padding:6px 5px;text-align:center;font-size:11px;color:#4B5A6B;white-space:nowrap">${esc(sizeText_(it))}</td>
        <td style="padding:6px 5px;text-align:center" colspan="2">

            <input type="number" inputmode="numeric" min="1" value="${esc(draft)}"
              data-act="item-qty-set" data-id="${esc(oid)}" data-idx="${idx}"
              style="width:48px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:4px 2px;font-size:12px;font-weight:700">
            <button class="btn sm" data-act="adm-qty-save" data-id="${esc(oid)}" data-idx="${idx}" ${qBusy?'disabled':''} style="font-size:10px;padding:4px 6px">${qBusy?'…':'✅'}</button>
          </div>
        </td>
        <td style="padding:6px 5px;text-align:center">
          <button class="btn act-del sm" data-act="adm-item-del" data-id="${esc(oid)}" data-idx="${idx}" ${dBusy?'disabled':''} style="font-size:10px;padding:4px 6px">${dBusy?'…':ico('trash')}</button>
        </td>
      </tr>`;
    }

    const editing = a.prodEdit.hasOwnProperty(key);
    const busy = a.prodBusy === key;

    const readyCell = editing
      ? `<div style="display:flex;align-items:center;justify-content:center;gap:4px">
          <input type="number" inputmode="numeric" min="0" max="${qty}" value="${esc(a.prodEdit[key])}"

        </div>`
      : `<b style="color:${full?'#1E8E52':(produced>0?'#B8790A':'#6B7A8C')}">${produced}</b>`;

    const lastCell = editing
      ? `<div style="display:flex;gap:4px;justify-content:center">
          <button class="btn sm" data-act="adm-prod-save" data-id="${esc(oid)}" data-idx="${idx}" ${busy?'disabled':''} style="font-size:10px;padding:4px 6px">${busy?'…':'✅'}</button>
          <button class="btn ghost sm" data-act="adm-prod-cancel" data-id="${esc(oid)}" data-idx="${idx}" ${busy?'disabled':''} style="font-size:10px;padding:4px 6px">✕</button>
        </div>`
      : `<b style="color:${pending>0?'#B3261E':'#6B7A8C'}">${pending}</b>`;

    return `<tr data-act="${editing?'':'adm-prod-edit-open'}" data-id="${esc(oid)}" data-idx="${idx}" style="cursor:${editing?'default':'pointer'}">

      <div class="chips" style="margin-top:10px;gap:6px;flex-wrap:nowrap">${btns}</div>
      ${busy?'<div class="note">جارٍ الحفظ…</div>':''}
      <div class="cardacts">${actionBtns}</div>
      ${itemsHtml}
    </div>`;
  };

  // ---------- تجميع طلبات كل عميل في قايمة منسدلة ----------
  const groups = {};
  const order = [];
  list.forEach(o=>{
    const key = (o.customer||'').trim() || 'بدون اسم';
    if(!groups[key]){ groups[key]=[]; order.push(key); }
    groups[key].push(o);
  });

  const rows = order.map(name=>{
    const orders = groups[name];
    const open = !!a.groupOpen[name];
    const totalQty = orders.reduce((s,o)=>s+(Number(o.qty)||0),0);
    const totalMoney = orders.reduce((s,o)=>s+(Number(o.total)||0),0);
    const pdfBusy = a.groupPdfBusy === name;
    return `<div class="ord" style="padding:0;overflow:hidden">
      <div data-act="adm-toggle-group" data-name="${esc(name)}" style="display:flex;align-items:center;gap:8px;padding:13px 14px;cursor:pointer">
        <span style="flex:1;min-width:0">
          <b style="font-size:13.5px;color:#0B2A4A">${esc(name)}</b>
          <div style="font-size:11px;color:#6B7A8C;margin-top:2px">${orders.length} طلب · ${totalQty} قطعة · ${money(totalMoney)} ج</div>
        </span>
        <button class="btn act-report sm" data-act="adm-group-pdf" data-name="${esc(name)}" ${pdfBusy?'disabled':''} style="width:auto;padding:7px 10px">
          ${ico("doc")}${pdfBusy?'…':'PDF'}</button>
        <span style="font-size:18px;color:#8A97A6;transform:rotate(${open?90:0}deg);transition:.15s">‹</span>
      </div>
      ${open?`<div style="padding:0 10px 10px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)">
        <div style="height:1px"></div>${orders.map(orderCardHTML_).join('')}
      </div>`:''}
    </div>`;
  }).join('');

  return `<section class="card">
      <div class="step"><span class="n">${viewingArchive?ico("folder","lg"):ico("factory","lg")}</span><h2>${viewingArchive?'الأرشيف':'متابعة المصنع'}</h2><span class="hint">${list.length} طلب · ${order.length} عميل</span></div>
      <div class="note" style="margin-top:0">${viewingArchive?'الطلبات المؤرشفة (اتسلمت أو اتأرشفت يدوي) — مش بتظهر في التقارير.':'اضغط اسم العميل عشان تشوف طلباته، وبعدين «الأصناف والإنتاج» جوه كل طلب عشان تسجّل الإنتاج وتشوف المتبقي. تسليم الطلب بيأرشفه أوتوماتيك.'}</div>
      ${headerBtns}
    </section>
    ${rows}${verBar()}`;
}

document.addEventListener('input',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a==='adm-pw'){ state.admin.pw=el.value; const b=document.querySelector('[data-act="adm-login"]'); if(b) b.disabled=!el.value; return; }
  if(a==='prof'){ state.profile[el.dataset.k]=el.value; save(LS_PROFILE,state.profile); return; }
  if(a==='cust'){ state.pick.custom[el.dataset.k]=el.value; refreshSummary(); return; }
  if(a==='cust-name'){ state.customer.name=el.value; return; }
  if(a==='cust-phone'){ state.customer.phone=el.value; return; }
  if(a==='edit-date'){ state.editingDate=el.value; return; }
  if(a==='edit-meta-customer'){ if(state.editingMeta) state.editingMeta.customer=el.value; return; }
  if(a==='edit-meta-phone'){ if(state.editingMeta) state.editingMeta.customerPhone=el.value; return; }
  if(a==='stock-in'){
    state.admin.stockDraft[el.dataset.code+'|'+el.dataset.w] = el.value;
    el.classList.add('dirty');
    const b=document.querySelector('[data-act="stock-save"]'); if(b) b.disabled=false;
    return;
  }
  if(a==='ord-note'){ state.orderNote=el.value; return; }
  if(a==='frame-height'){ state.pick.frameHeight=el.value; return; }
  if(a==='qty-set'){ state.pick.qty=Math.max(1,parseInt(el.value,10)||1); refreshSummary(); return; }
  if(a==='acc-set'){ state.acc[el.dataset.id]=Math.max(0,parseFloat(el.value)||0); refreshAccBtn(); return; }
  if(a==='fr-jamb'){ state.fr.jamb=el.value; render(); return; }
  if(a==='fr-header'){ state.fr.header=el.value; render(); return; }
  if(a==='fr-note'){ state.fr.note=el.value; return; }
  if(a==='br-rods'){ state.br.rods=el.value; refreshRodBtn('add-br'); return; }
  if(a==='price-set'){
    const pe=state.admin.priceEdit; if(!pe) return;
    const v=parseFloat(el.value)||0, g=el.dataset.group, k=el.dataset.key, tier=el.dataset.tier;
    if(g==='customExtra') pe.customExtra[tier]=v; else if(pe[g][k]) pe[g][k][tier]=v;
    return;
  }
  if(a==='prod-set'){
    const key = el.dataset.id+':'+el.dataset.idx;
    state.admin.prodEdit[key] = el.value;
    return;
  }
  if(a==='item-qty-set'){
    const key = el.dataset.id+':'+el.dataset.idx;
    state.admin.qtyEdit[key] = el.value;
    return;
  }
  if(a==='meta-customer'){
    const id = el.dataset.id;
    if(!state.admin.metaEdit[id]){
      const o=((state.admin.rows||[]).concat(state.admin.archRows||[])).find(x=>String(x.id)===String(id));
      state.admin.metaEdit[id] = {customer:(o&&o.customer)||'', date:(o&&o.date)||''};
    }
    state.admin.metaEdit[id].customer = el.value;
    return;
  }
  if(a==='meta-date'){
    const id = el.dataset.id;
    if(!state.admin.metaEdit[id]){
      const o=((state.admin.rows||[]).concat(state.admin.archRows||[])).find(x=>String(x.id)===String(id));
      state.admin.metaEdit[id] = {customer:(o&&o.customer)||'', date:(o&&o.date)||''};
    }
    state.admin.metaEdit[id].date = el.value;
    return;
  }
});

function addDoor(){
  const p=state.pick;
  if(!p.code || p.size==null || p.frame==null || p.dbror==null){
    toast('اختر المقاس والحلق والبرور أولاً'); return;
  }
  const d=doorByCode(p.code);
  let sizeTxt,sizeEn,unitPrice;
  if(p.size==='custom'){
    const w=Number(p.custom.w)||0,h=Number(p.custom.h)||0;
    if(!w||!h){toast('اكتب العرض والارتفاع للمقاس الخاص');return;}
    sizeTxt=w+'×'+h+' سم (مقاس خاص — مقاس الفتحة المعمارية)'; sizeEn=w+'x'+h+' cm (custom)'; unitPrice=priceForWidth(w)+CUSTOM_EXTRA;
  } else { sizeTxt=p.size+' سم'; sizeEn=p.size+' cm'; unitPrice=priceForWidth(p.size); }

  state.cart.push({
    kind:'door',
    title:'باب WPC '+d.code+' — '+d.name,
    titleEn:'WPC Door '+d.code+' - '+d.en,
    code:d.code, img:d.img, sizeTxt, sizeEn, unitPrice, qty:p.qty,
    w: p.size==='custom' ? '' : p.size,   // العرض بالسم كرقم خام — لخصم الرصيد بدقة، فاضي لو مقاس خاص (مش متتبّع في المخزون)
    frame:p.frame||0, dbror:p.dbror||'', frameHeight:p.frameHeight?Number(p.frameHeight):0
  });
  save(LS_CART,state.cart);
  toast('اتضاف للسلة: '+d.code+' — '+sizeTxt);
  // نلمّ الاختيارات ونقفل اللوحة عشان يختار باب تاني بارتياح
  state.pick={code:'', size:null, custom:{w:'',h:''}, frame:null, dbror:null, frameHeight:'', qty:1};
  render();
}

function addRod(kind){
  const isFrame = kind==='frame';
  const st = isFrame?state.fr:state.br;
  if(!st.code){toast('اختر كود الباب (اللون) الأول');return;}
  const dName = (DOORS.find(x=>x.code===st.code)||{}).name || '';

  // بيضيف/بيجمّع سطر عود واحد في السلة (كل مقاس سطر مستقل)
  const push = (spec, cm, qty, perM, titleAr, titleEn) => {
    const key = kind+'|'+spec+'|'+cm+'|'+st.code;
    const ex = state.cart.find(it=>it.kind===kind && it.key===key);
    if(ex){ ex.qty += qty; return; }
    state.cart.push({
      kind, key, qty, code:st.code, rodCm:cm, perM,
      price: rodPrice(perM, cm),
      spec:  spec+' — '+cm+' سم'+(st.code?' — '+st.code:''),
      title: titleAr, titleEn
    });
  };

  let added = 0;
  if(isFrame){
    const f = FRAMES.find(x=>x.cm===st.cm)||FRAMES[0];
    const jamb = Math.max(0, Math.round(Number(st.jamb)||0));
    const header = Math.max(0, Math.round(Number(st.header)||0));
    if(jamb+header<=0){toast('اكتب عدد الأعواد');return;}
    if(jamb){
      push(f.cm+' سم', 220, jamb, f.price,
        'حلق باب '+f.cm+' سم — قائم ٢٢٠ سم'+(st.code?' — '+st.code+(dName?' '+dName:''):'')+(st.note?' — ملاحظة: '+st.note:''),
        'Door Frame '+f.cm+' cm - jamb 220cm'+(st.code?' - '+st.code:''));
      added += jamb;
    }
    if(header){
      push(f.cm+' سم', 110, header, f.price,
        'حلق باب '+f.cm+' سم — عتب ١١٠ سم'+(st.code?' — '+st.code+(dName?' '+dName:''):'')+(st.note?' — ملاحظة: '+st.note:''),
        'Door Frame '+f.cm+' cm - header 110cm'+(st.code?' - '+st.code:''));
      added += header;
    }
    state.fr.jamb=2; state.fr.header=1; state.fr.note='';
  } else {
    const b = BRORS.find(x=>x.size===st.size)||BRORS[0];
    const rods = Math.max(0, Math.round(Number(st.rods)||0));
    if(rods<=0){toast('اكتب عدد العيدان');return;}
    push(b.size, BROR_ROD_CM, rods, b.price,
      'برور '+b.size+' — عود '+BROR_ROD_CM+' سم'+(st.code?' — '+st.code+(dName?' '+dName:''):''),
      'Bror '+b.size+' - '+BROR_ROD_CM+'cm rod'+(st.code?' - '+st.code:''));
    added = rods;
    state.br.rods=1;
  }

  save(LS_CART,state.cart);
  toast('اتضاف '+added+' عود');
  render();
}

function addAccessories(){
  let n=0;
  ACCESSORIES.forEach(a=>{
    const q=state.acc[a.id]||0; if(!q) return;
    const ex=state.cart.find(it=>it.kind==='acc'&&it.id===a.id);
    if(ex) ex.qty=Math.round((ex.qty+q)*100)/100;
    else state.cart.push({kind:'acc',id:a.id,title:a.name,titleEn:a.en,price:a.price,qty:q,unit:a.unit});
    n+=q;
  });
  if(!n){toast('محددتش أي كميات');return;}
  state.acc={}; save(LS_CART,state.cart); toast('اتضافت الإكسسوارات'); render();

// تعديل صنف موجود في السلة: بنشيله من السلة ونفتحله شاشة الاختيار بنفس بياناته
// جاهزة قدام العين — لما يدوس «أضف» تاني بيرجع يتضاف بالتعديلات الجديدة.
function editCartLine(i){
  const it = state.cart[i];
  if(!it) return;
  state.cart.splice(i,1);
  save(LS_CART,state.cart);

  if(it.kind==='door'){
    let sizeVal=null, customW='', customH='';
    let m = /^(\d+)\s*cm$/i.exec(it.sizeEn||'');
    if(m){ sizeVal = Number(m[1]); }
    else {
      m = /^(\d+)\s*x\s*(\d+)\s*cm\s*\(custom\)$/i.exec(it.sizeEn||'');
      if(m){ sizeVal='custom'; customW=m[1]; customH=m[2]; }
    }
    state.pick = {code:it.code||'', size:sizeVal, custom:{w:customW,h:customH},
      frame:it.frame||0, dbror:it.dbror||'', frameHeight:it.frameHeight?String(it.frameHeight):'', qty:it.qty||1};
    state.newSection='doors'; save(LS_SECTION,state.newSection);
  } else if(it.kind==='frame' || it.kind==='bror'){
    const isFr = it.kind==='frame';
    if(isFr){
      let cm = FRAMES[0].cm;
      const mm=/^(\d+)/.exec(it.spec||''); if(mm) cm=Number(mm[1]);
      // بنرجّع العدد في خانة المقاس الصح حسب طول العود المحفوظ
      const isHeader = Number(it.rodCm)===110;
      state.fr = {cm, code:it.code||'',
                  jamb:   isHeader ? 0 : (it.qty||1),
                  header: isHeader ? (it.qty||1) : 0};
    } else {
      let size = BRORS[0].size;
      const mm=/^([\d×xX]+)/.exec(it.spec||''); if(mm) size=mm[1].replace(/x|X/,'×');
      state.br = {size, code:it.code||'', rods:it.qty||1};
    }
    state.newSection = isFr?'frame':'bror'; save(LS_SECTION,state.newSection);
  } else if(it.kind==='acc'){
    state.acc = {}; state.acc[it.id]=it.qty;
    state.newSection='acc'; save(LS_SECTION,state.newSection);
  }

  state.tab='new'; render(); window.scrollTo({top:0,behavior:'smooth'});
  toast('عدّل البيانات وادوس «أضف» تاني عشان يتحدّث في السلة');
}

function newOrderId(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  // ٣ حروف/أرقام عشوائية في الآخر عشان طلبين في نفس الثانية (وارد مع أكتر من موزع) ما ياخدوش نفس الرقم
  const rnd=Math.random().toString(36).slice(2,5).toUpperCase();
  return 'W'+String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())+rnd;
}

// تعديل الطلب من شاشة المصنع — بيحمّل أصناف الطلب في السلة ويفتح تبويب السلة،
// وبيحتفظ ببيانات صاحب الطلب الأصلي (اسم/موبايل/منطقة) عشان الحفظ ما يغيّرهاش لبيانات المصنع.
async function adminEditOrder(o){

  busy(false);
  if(!its.length){ toast('مفيش أصناف في الطلب ده'); return; }

  state.cart = its.map(it=>{

      return { kind:'door', title:arabicItemTitle_(it), titleEn:it.title||'', code:it.code||'',
               img:(DOORS.find(d=>d.code===it.code)||{}).img || '',
               sizeTxt:arabicSizeText_(it.size), sizeEn:it.size||'', unitPrice:price, qty,
               w:it.width||'', frame:Number(it.frame)||0, dbror:it.dbror||'', frameHeight:Number(it.frameHeight)||0 };

               title:arabicItemTitle_(it), titleEn:it.title||'', code:it.code||'',
               spec:it.size||'', price, qty };

             price, qty, unit:it.unit||'' };

}

function draftOrder(){
  // لو المصنع بيعدّل طلب عميل، بنحافظ على بيانات العميل الأصلي مش بيانات جهاز المصنع
  const m = state.editingMeta;
  // لو بنعدّل طلب، بناخد نفس تاريخ الطلب الأصلي (أو التاريخ اللي اتغيّر يدويًا) بدل تاريخ النهاردة
  const ts = (state.editingId && state.editingDate)
    ? new Date(state.editingDate + 'T12:00:00').getTime()
    : Date.now();
  return {
    id:newOrderId(), ts,
    name: m ? m.name : state.profile.name,
    phone: m ? m.phone : state.profile.phone,
    region: m ? m.region : state.profile.region,
    warehouse:WAREHOUSE, items:JSON.parse(JSON.stringify(state.cart)), total:cartTotal(),
    // صاحب الأوردر: حقل اختياري — لو اتكتب بيتسجّل، لو فاضي يبقى نفس صاحب الحساب
    customer: m ? (m.customer||'') : state.customer.name.trim(),
    customerPhone: m ? (m.customerPhone||'') : state.customer.phone.trim(),

  };
}

  m+='الاسم: '+(o.name||'-')+'\n';
  m+='المنطقة: '+(o.region||'-')+'\n';
  m+='الموبايل: '+(o.phone||'-')+'\n';
  if(o.customer) m+='صاحب الأوردر: '+o.customer+'\n';
  if(o.customerPhone) m+='تليفون صاحب الأوردر: '+o.customerPhone+'\n';
  m+='المخزن: '+WAREHOUSE+'\n';
  if(o.note) m+='ملاحظات: '+o.note+'\n';
  m+='——————\n';
  o.items.forEach((it,i)=>{
    m+=(i+1)+'. '+it.title+'\n';
    if(it.kind==='door'){
      m+='   المقاس: '+it.sizeTxt+' — الكمية: '+it.qty+'\n';
      const inc=[]; if(it.frame) inc.push('حلق '+frameText_(it.frame,it.frameHeight)); if(it.dbror) inc.push('برور '+it.dbror);
      if(inc.length) m+='   شامل مع الباب: '+inc.join(' + ')+'\n';

    } else m+='   الكمية: '+it.qty+' '+(it.unit||'')+'\n';

  }

function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

// بيجهّز صورة الطلب (نفس تصميم المستند) وبيفتح شاشة المشاركة الأصلية بتاعة الموبايل —
// العميل يختار هو المستلم بنفسه (واتساب أو أي حد)، زي تطبيق القطاعات بالظبط.
// لو الجهاز مبيدعمش المشاركة (كمبيوتر مثلًا)، بننزّل الصورة ويبعتها العميل يدويًا.
async function shareOrderImage(o){
  if(typeof html2canvas==='undefined'){
    toast('محتاج نت أول مرة عشان يجهّز الصورة');
    return;
  }

  busy(true,'جارٍ تجهيز صورة الطلب…');
  try{
    const canvas = await renderPaper_(docHTML(o,'order'));
    const blob=await new Promise(res=>canvas.toBlob(res,'image/png',0.95));
    const file=new File([blob],'طلب_'+o.id+'.png',{type:'image/png'});

    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'طلب أوردر #'+o.id});   // صورة بس، من غير نص مرفق
    } else {
      downloadBlob(blob,'طلب_'+o.id+'.png');
      toast('اتحمّلت صورة الطلب — افتح واتساب وابعتها من المعرض');
    }
  }catch(err){
    if(err && err.name==='AbortError'){ busy(false); return; }   // العميل قفل شاشة المشاركة
    toast('تعذّر تجهيز صورة الطلب');
  }
  busy(false);
}

/* ============================================================
   إرسال الطلب للسيرفر مع تأكيد فعلي للوصول (بدل الإرسال الأعمى القديم)
   ============================================================ */
async function sendOrderToServer_(o){
  const payload = JSON.stringify(o);
  if(payload.length < 6000){
    try{
      const d = await jsonp(APPS_SCRIPT_URL + '?action=newOrder&payload=' + encodeURIComponent(payload), 20000);
      return !!(d && d.ok);
    }catch(err){ return false; }
  }
  // طلب كبير جدًا (أصناف كتير) — الرابط ممكن يطول أكتر من اللازم لـ JSONP،
  // فبنرجع لطريقة POST القديمة (بتوصل غالبًا لكن من غير تأكيد رد من السيرفر)
  try{
    await fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'newOrder',order:o})});
    return null;   // اتبعت لكن مش متأكدين من الرد
  }catch(err){ return false; }
}

function loadPendingSync_(){ return load(LS_PENDING, []); }
function savePendingSync_(list){ save(LS_PENDING, list); }

async function syncOrder_(o){
  const ok = await sendOrderToServer_(o);
  if(ok === false){
    const pending = loadPendingSync_();
    if(!pending.includes(o.id)){ pending.push(o.id); savePendingSync_(pending); }
    toast('⚠️ الطلب #'+o.id+' اتسجّل على جهازك بس لسه ما وصلش المصنع — هنحاول تاني تلقائي أول ما يرجع النت', 4200);
  }
}

// بيحاول يبعت أي طلبات فشل إرسالها قبل كده — بيتنادى عند فتح التطبيق وعند رجوع النت
async function retryPendingOrders_(){
  if(!APPS_SCRIPT_URL || !navigator.onLine) return;
  const pending = loadPendingSync_();
  if(!pending.length) return;
  const stillPending = [];
  for(const id of pending){
    const o = state.orders.find(x=>String(x.id)===String(id));
    if(!o) continue;   // اتشال من عندنا لأي سبب — متبقاش نحاول تاني
    const ok = await sendOrderToServer_(o);
    if(ok === false) stillPending.push(id);
  }
  savePendingSync_(stillPending);
  if(pending.length && !stillPending.length) toast('✅ اتبعتت كل الطلبات اللي كانت معلّقة للمصنع');
}

function submitOrder(){
  if(!state.cart.length){toast('السلة فاضية');return;}
  if(!state.editingMeta){
    // طلب جديد أو تعديل عادي من الموزع — لازم اسم الحساب وبيانات صحيحة. صاحب الأوردر اختياري
    if(!profileOk()){
      state.touched=true; state.tab='new'; render();
      window.scrollTo({top:0,behavior:'smooth'});
      toast('اكتب الاسم ورقم موبايل صحيح — إجباري');
      return;
    }
  } else {
    // تعديل من شاشة المصنع — اسم الحساب إجباري هنا كمان، لو ناقص بنسأل. صاحب الأوردر اختياري
    if(!state.editingMeta.name || !state.editingMeta.name.trim()){
      const v = (prompt('اسم الحساب (صاحب الجهاز) مفقود من الطلب ده — اكتبه عشان تقدر تحفظ:') || '').trim();
      if(!v){ toast('لازم تكتب اسم الحساب عشان تكمّل الحفظ'); return; }
      state.editingMeta.name = v;
    }
  }
  const wasEditing = !!state.editingId;
  const prevId = state.editingId;
  const o=draftOrder();
  o.msg=buildMessage(o);

  if(wasEditing){
    // التعديل بيلغي الطلب القديم بدل ما يحدّثه في مكانه — وبيعمل طلب جديد مستقل بالأصناف المعدّلة
    state.orders = state.orders.filter(x=>String(x.id)!==String(prevId));
  }
  state.orders.unshift(o);
  save(LS_ORDERS,state.orders.slice(0,80));
  const wasAdminEdit = !!state.editingMeta;
  state.cart=[]; save(LS_CART,state.cart); state.touched=false;
  state.editingId=null; state.editingMeta=null; state.editingDate=null;
  state.customer={name:'',phone:''}; state.orderNote='';   // تصفير بيانات صاحب الأوردر للطلب الجاي

  if(APPS_SCRIPT_URL){
    if(wasEditing && prevId){
      // الطلب القديم لازم يتمسح نهائيًا من عند المصنع — لو المصنع هو اللي بيعدّل بنبعت كلمة سره
      // عشان يقدر يمسحه حتى لو دخل التنفيذ فعليًا، وبنستنى الرد عشان نعرف لو فشل الحذف ونبلّغ بدل ما نسكت.
      const cancelUrl = APPS_SCRIPT_URL + '?action=cancelOrder&id=' + encodeURIComponent(prevId)
        + '&phone=' + encodeURIComponent(o.phone||'')
        + '&newId=' + encodeURIComponent(o.id)
        + (wasAdminEdit ? '&pw=' + encodeURIComponent(state.admin.pw||'') : '');
      jsonp(cancelUrl).then(d=>{
        if(!d || !d.ok){
          // لو السيرفر عرف يحط علامة "معدّل" على الطلب القديم (لأنه دخل التنفيذ ومنقدرش نمسحه)،
          // ده كافي والمصنع هيشوفه في الشيت — نطمّن المستخدم بدل توتير من رسالة "خطأ"
          if(d && d.marked) toast('✅ اتسجّل الطلب الجديد #'+o.id+' — والقديم #'+prevId+' اتحطت عليه علامة "معدّل" عشان المصنع يحذفه', 5500);
          else toast('⚠️ الطلب الجديد #'+o.id+' اتسجّل، بس القديم #'+prevId+' لسه موجود عند المصنع: '+((d&&d.error)||'خطأ غير معروف'), 5500);
        }
      }).catch(()=>{
        toast('⚠️ الطلب الجديد #'+o.id+' اتسجّل، بس تعذّر حذف القديم #'+prevId+' من عند المصنع — النت اتقطع', 5500);
      });
    }
    syncOrder_(o);
  }
  if(wasAdminEdit){
    // المصنع رجع لشاشته، والقايمة بتتحدّث من السيرفر عشان تبان بالأصناف الجديدة
    state.tab='admin'; render();
    toast(wasEditing?('✅ اتلغى الطلب القديم #'+prevId+' واتعمل طلب جديد #'+o.id):('✅ اتحدّث الطلب #'+o.id));
    adminLoad();
    return;
  }
  state.tab='orders'; render();
  toast(wasEditing?'✅ اتحدّث الطلب #'+o.id:'اتسجّل طلب الأوردر #'+o.id);
  shareOrderImage(o);
}
