/* ٤) الأبواب لكل عميل اشترى أبواب (مش الموزعين بس) — كمية وقيمة.
      الأبواب نفسها بس: القطاع الفرعي «أبواب» — من غير كالون ولا مفصلة ولا خدمات. */
const NOT_DOOR=/اكسسوار|إكسسوار|خدم|كالون|مفصل|جوان|سليكون|مسمار|عتب/;
function isDoorSub(name, sub){
  if(NOT_DOOR.test(String(sub||''))) return false;       // «اكسسوارات ابواب WPC» مش باب
  if(sub) return /ابواب|أبواب/.test(sub);
  return !NOT_DOOR.test(String(name||''));               // بيانات قديمة من غير قطاع فرعي
}
function buildDistDoors(){
  const cols=periodCols(); const moCol={}; cols.forEach((c,i)=> c.months.forEach(mo=> moCol[mo]=i));
  const clsOfName={}; customers.forEach(c=> clsOfName[c.name]=c.cls||'');
  const rows={};
  salesMonths().forEach(mo=>{
    const k=moCol[mo];
    Object.entries(monthlyDoors[mo]||{}).forEach(([cname, byItem])=>{
      if(clsOfName[cname]==='مستبعد') return;
      Object.entries(byItem).forEach(([nm,d])=>{
        if(!isDoorItem(nm, d.sub) || doorHide.indexOf(nm)>=0) return;   // نفس فلتر «أبواب بالكود»
        const r = rows[cname] = rows[cname] || {qty:0, val:0, by:{}};
        r.qty += (d.qty||0); r.val += (d.val||0);
        r.by[k]=(r.by[k]||0)+(d.val||0);
      });
    });
  });
  const list = Object.keys(rows).map(n=> ({name:n, qty:rows[n].qty, val:rows[n].val,
    cells: cols.map((c,i)=> Math.round(rows[n].by[i]||0))})).sort((a,b)=> b.val-a.val);
  const tot = cols.map((c,i)=> list.reduce((a,r)=> a+r.cells[i], 0));
  return {cols, list, tot, qty: list.reduce((a,r)=>a+r.qty,0), val: list.reduce((a,r)=>a+r.val,0)};
}
function repDistDoorsModel(){
  const d = buildDistDoors(), body=[];
  d.list.forEach((r,i)=> body.push({type:'row',
    cells:[r.name, ...r.cells, rnd2(r.qty), Math.round(r.val)]}));
  body.push({type:'tot', cells:['الإجمالي', ...d.tot, rnd2(d.qty), Math.round(d.val)]});
  return {title:'مبيعات الأبواب للعملاء — '+periodLabel(),
    header:['العميل', ...d.cols.map(c=>c.label), 'الكمية','القيمة'], body, d,
    boxes:[{l:'أعلى ٣ عملاء', rows:d.list.map(r=>({name:r.name, val:r.val}))}]};
}
function renderRepDistDoors(m){
  const d = buildDistDoors();
  if(!d.list.length){ m.innerHTML = `<div class="empty">مفيش مبيعات أبواب</div>`; return; }
  const md=repDistDoorsModel();
  renderRepTable(m, 'distdoor', md, {
    warn: !d.qty? 'الشيت المرفوع مكانش فيه عمود كمية، فالتقرير بالقيمة بس.' : '',
    boxes: modelBoxesHtml(md)
  });
}

/* ٥) مشتريات — كل عميل جملة بسطر، وقدامه اشترى كام من كل مجموعة.
      نفس شكل «موزعين قطاعات» بس للعملاء مش للموزعين. */
function buildBuys(){
  const custByName={}; customers.forEach(c=> custByName[c.name]=c);
  const secs=new Set(), rows={};
  salesMonths().forEach(mo=>{
    Object.entries(monthlySector[mo]||{}).forEach(([cname, bySec])=>{
      const cls=(custByName[cname]||{}).cls||'';
      if(cls!=='مبيعات جملة') return;                 // عملاء الجملة بس
      Object.entries(bySec).forEach(([k, v])=>{
        const sec=secColOf(k);
        secs.add(sec); rows[cname]=rows[cname]||{}; rows[cname][sec]=(rows[cname][sec]||0)+v;
      });
    });
  });
  const cols=[...secs].filter(sec=> !secHidden(sec) && Object.keys(rows).some(n=> rows[n][sec])).sort(secSort);
  const list=Object.keys(rows).map(n=>({name:n, cells:cols.map(c=> rows[n][c]||0),
    total:cols.reduce((a,c)=> a+(rows[n][c]||0), 0)})).sort((a,b)=> b.total-a.total);
  const tot=cols.map((c,i)=> list.reduce((a,r)=> a+r.cells[i], 0));
  return {cols, list, tot, total: tot.reduce((a,b)=>a+b,0)};
}
function repBuysModel(){
  const d=buildBuys(), body=[];
  d.list.forEach(r=> body.push({type:'row', cells:[r.name, ...r.cells.map(v=>Math.round(v)), Math.round(r.total)]}));
  body.push({type:'tot', cells:['الإجمالي', ...d.tot.map(v=>Math.round(v)), Math.round(d.total)]});
  return {title:'مشتريات عملاء الجملة — '+periodLabel(),
    header:['العميل', ...d.cols.map(secLabel), 'الإجمالي'],
    headTap:['', ...d.cols.map(k=>`secSheet(${jsArg(k)})`), ''], body, d,
    boxes:[{l:'أعلى ٣ عملاء', rows:d.list.map(r=>({name:r.name, val:r.total}))},
           {l:'أعلى ٣ مجموعات', rows:d.cols.map((c,i)=>({name:secLabel(c), val:d.tot[i]})).sort((a,b)=>b.val-a.val)}]};
}
function renderRepBuys(m){
  const d=buildBuys();
  if(!d.list.length){ m.innerHTML=`<div class="empty">مفيش مشتريات لعملاء جملة —<br>صنّف العملاء «مبيعات جملة» من شاشة العملاء</div>`; return; }
  const md=repBuysModel();
  renderRepTable(m, 'buys', md, {boxes: hiddenSecBar() + modelBoxesHtml(md)});
}

/* ٥) مبيعات خاصة — كل عميل مصنّف «مبيعات خاصة» بسطر وعمود لكل شهر */
function buildSpecial(){
  const cols=periodCols(); const moCol={}; cols.forEach((c,i)=> c.months.forEach(mo=> moCol[mo]=i));
  const names=new Set(customers.filter(c=>(c.cls||'')==='مبيعات خاصة').map(c=>c.name));
  const rows={};
  salesMonths().forEach(mo=> Object.keys(monthlySales[mo]||{}).forEach(n=>{
    if(!names.has(n)) return; const net=saleNet(mo,n);
    rows[n]=rows[n]||{}; rows[n][moCol[mo]]=(rows[n][moCol[mo]]||0)+net; }));
  const list=Object.keys(rows).map(n=>{
    const cells=cols.map((c,i)=> Math.round(rows[n][i]||0));
    return {name:n, cells, total:cells.reduce((a,b)=>a+b,0)};
  }).sort((a,b)=> b.total-a.total);
  const tot=cols.map((c,i)=> list.reduce((a,r)=> a+r.cells[i],0));
  return {cols, list, tot, total: tot.reduce((a,b)=>a+b,0)};
}
function repSpecialModel(){
  const d=buildSpecial(), body=[];
  d.list.forEach(r=> body.push({type:'row', cells:[r.name, ...r.cells, r.total]}));
  body.push({type:'tot', cells:['الإجمالي', ...d.tot, d.total]});
  return {title:'المبيعات الخاصة — '+periodLabel(),
    header:['العميل', ...d.cols.map(c=>c.label), 'الإجمالي'], body, d,
    boxes:[{l:'أعلى ٣', rows:d.list.map(r=>({name:r.name, val:r.total}))}]};
}
function renderRepSpecial(m){

/* ═══ ٦) مقارنة المبيعات بين شهرين ═══
   نفس صفوف تقرير «موزعين إجمالي» (التصنيفات مجمّعة + كل موزع بسطر)،
   بس عمودين لشهرين تختارهم، وعمود فرق وعمود نسبة. */
function cmpMonths(){
  const mos = salesMonths();
  let a = load('_cmpMoA_', null), b = load('_cmpMoB_', null);
  if(!mos.includes(a)) a = mos[mos.length-2] || mos[0] || null;
  if(!mos.includes(b)) b = mos[mos.length-1] || null;
  return {mos, a, b};
}
function setCmpMo(which, mo){ save(which==='a'?'_cmpMoA_':'_cmpMoB_', mo); render(true); }
function buildMonthCompare(){
  const {mos, a, b} = cmpMonths();
  if(mos.length<2 || !a || !b) return {mos, a, b, list:[], ta:0, tb:0};
  const custByName={}; customers.forEach(c=> custByName[c.name]=c);
  const agg={};   // المفتاح: اسم الموزع، أو اسم التصنيف للباقي
  const add=(mo, key)=>{
    Object.keys(monthlySales[mo]||{}).forEach(name=>{
      const cls=(custByName[name]||{}).cls||'', net=saleNet(mo,name);
      if(!cls || cls==='مستبعد' || cls==='عميل ابواب' || cls==='مبيعات خاصة') return;
      const row = cls==='موزع' ? name : cls;
      agg[row]=agg[row]||{a:0,b:0}; agg[row][key]+=net;
    });
  };
  add(a,'a'); add(b,'b');
  const list=Object.keys(agg).map(name=>{
    const va=agg[name].a, vb=agg[name].b, diff=vb-va;
    return {name, va, vb, diff, pct: va? Math.round(diff/va*100) : null};
  }).sort((x,y)=> y.vb - x.vb);
  const ta=list.reduce((s2,r)=>s2+r.va,0), tb=list.reduce((s2,r)=>s2+r.vb,0);
  return {mos, a, b, list, ta, tb};
}
const pctTxt = p => p===null ? '—' : (p>0?'+':'')+p+'%';
function repMonthCompareModel(){
  const d=buildMonthCompare(); const body=[];
  d.list.forEach(r=> body.push({type:'row', cells:[r.name, Math.round(r.va), Math.round(r.vb),
    Math.round(r.diff), pctTxt(r.pct)]}));
  const tdiff=d.tb-d.ta, tpct=d.ta? Math.round(tdiff/d.ta*100) : null;
  body.push({type:'tot', cells:['الإجمالي', Math.round(d.ta), Math.round(d.tb), Math.round(tdiff), pctTxt(tpct)]});
  return {title:`مقارنة المبيعات — ${moName(d.a)} مقابل ${moName(d.b)}`,
    header:['بيان', moName(d.a)||'—', moName(d.b)||'—', 'الفرق', 'النسبة'],
    body, sign:['','','','auto','auto'], d,
    boxes:[{l:'أعلى ٣ في '+moName(d.b), rows:d.list.map(r=>({name:r.name, val:r.vb}))}]};
}
function renderRepMonthCompare(m){
  const d=buildMonthCompare();
  if(d.mos.length<2){
    m.innerHTML=`<div class="empty">المقارنة محتاجة شهرين على الأقل —
      لسه مرفوع ${d.mos.length} شهر.<br>ارفع شيت شهر تاني من «رفع شيت المبيعات».</div>`;
    return;
  }
  const sel=(which,cur)=>`<select onchange="setCmpMo('${which}',this.value)"
    style="padding:8px 10px;border-radius:9px;border:1px solid var(--border);background:var(--panel);
    color:var(--text);font-weight:700;font-size:13.5px">
    ${d.mos.map(mo=>`<option value="${mo}" ${mo===cur?'selected':''}>${moName(mo)}</option>`).join('')}</select>`;
  const tdiff=d.tb-d.ta, tpct=d.ta? Math.round(tdiff/d.ta*100) : null;
  const col=v=> v>0?'var(--green,#0a7d3c)' : (v<0?'var(--red,#c0202f)':'inherit');
  const cell=v=>{ const n=Math.round(v);
    const t = n===0 ? '—' : (n>0?'+':'−')+Math.abs(n).toLocaleString('en-US');
    return `<td style="color:${col(n)};font-weight:700">${t}</td>`; };
  const pcell=p=>`<td style="color:${col(p===null?0:p)};font-weight:700">${pctTxt(p)}</td>`;
  m.innerHTML=`
    ${topBoxes(d.list.map(r=>({name:r.name, val:r.vb})), 'أعلى ٣ في '+moName(d.b))}
    <div class="toolbar" style="align-items:center;gap:8px;flex-wrap:wrap">
      <span style="font-size:13px;color:var(--muted)">من</span>${sel('a',d.a)}
      <span style="font-size:13px;color:var(--muted)">إلى</span>${sel('b',d.b)}
    </div>
    <div style="overflow-x:auto"><table class="rep stk">
      <tr><th>م</th><th>بيان</th><th>${moName(d.a)}</th><th>${moName(d.b)}</th><th>الفرق</th><th>النسبة</th></tr>
      ${d.list.map((r,i)=>`<tr><td>${i<3?MEDALS[i]:(i+1)}</td><td>${esc(r.name)}</td>
        <td>${repFmt(r.va)}</td><td>${repFmt(r.vb)}</td>${cell(r.diff)}${pcell(r.pct)}</tr>`).join('')}
      <tr class="m"><td></td><td><b>الإجمالي</b></td><td><b>${repFmt(d.ta)}</b></td>
        <td><b>${repFmt(d.tb)}</b></td>${cell(tdiff)}${pcell(tpct)}</tr>
    </table></div>
    ${floatBar(`<button onclick="exportRep('cmpmo','x')">📊 إكسل</button><button onclick="exportRep('cmpmo','p')">📄 PDF</button><button onclick="exportRep('cmpmo','i')">🖼️ صورة</button>`)}`;
}

/* ═══ ٧) مقارنة عميل — عميل أو أكتر × فترة بتحددها ═══
   جدول إجمالي (الشهور + إجمالي + متوسط شهري + نسبة) وجدول قطاعات.
   بتشتغل على أي عميل (موزع/جملة/خاصة/أبواب) من غير ما يهم تصنيفه. */
function ccAllCustomers(){
  const cnt={};
  monthsLive().forEach(mo=> Object.entries(monthlySales[mo]||{}).forEach(([n,v])=>{ cnt[n]=(cnt[n]||0)+(v||0); }));
  return Object.keys(cnt).map(n=>({name:n, val:cnt[n]})).sort((a,b)=> b.val-a.val);
}
function ccPeriod(){
  const live=monthsLive();
  let f=load('_ccFrom_',null), t=load('_ccTo_',null);
  if(!live.includes(f)) f=live[0]||null;
  if(!live.includes(t)) t=live[live.length-1]||null;
  if(f && t && moNum(f)>moNum(t)){ const x=f; f=t; t=x; }
  const months=(f&&t)? live.filter(mo=> moNum(mo)>=moNum(f) && moNum(mo)<=moNum(t)) : [];
  return {live, f, t, months};
}
function ccSelected(){
  const have=new Set(ccAllCustomers().map(c=>c.name));
  return (load('_ccSel_',[])||[]).filter(n=> have.has(n));
}
function setCcPeriod(which, mo){ save(which==='f'?'_ccFrom_':'_ccTo_', mo); render(true); }
function ccToggle(name){
  const sel=ccSelected(); const i=sel.indexOf(name);
  if(i>=0) sel.splice(i,1); else sel.push(name);

function buildCustCompare(){
  const {months,f,t,live}=ccPeriod(), sel=ccSelected();
  const i0=months.length? live.indexOf(months[0]) : -1;
  const prevMo = i0>0? live[i0-1] : null;     // الشهر اللي قبل الفترة (لسهم أول شهر)
  const custByName={}; customers.forEach(c=>custByName[c.name]=c);
  const rows=sel.map(name=>{
    const cells=months.map(mo=> Math.round(saleNet(mo,name)));
    const total=cells.reduce((a,b)=>a+b,0);
    return {name, cls:(custByName[name]||{}).cls||'', cells, total,
      avg: months.length? Math.round(total/months.length) : 0};
  }).sort((a,b)=> b.total-a.total);
  const tot=months.map((mo,i)=> rows.reduce((a,r)=> a+r.cells[i], 0));
  const total=tot.reduce((a,b)=>a+b,0);
  // القطاعات: نفس منطق «موزعين قطاعات» (نقل المجموعات + الأعمدة المخفية)
  const secSet=new Set(), bySec={}, bySecMo={};
  sel.forEach(name=>{ bySec[name]={}; bySecMo[name]={};
    months.forEach(mo=>{ bySecMo[name][mo]={};
      Object.entries((monthlySector[mo]||{})[name]||{}).forEach(([k,v])=>{
        const s2=secColOf(k); secSet.add(s2); bySec[name][s2]=(bySec[name][s2]||0)+v;
        bySecMo[name][mo][s2]=(bySecMo[name][mo][s2]||0)+v; }); }); });
  const cols=[...secSet].filter(s2=> !secHidden(s2) && sel.some(n=> Math.round(bySec[n][s2]||0))).sort(secSort);
  const srows=rows.map(r=>{
    const cells=cols.map(s2=> Math.round(bySec[r.name][s2]||0));
    const mrows=months.map(mo=>{
      const c2=cols.map(s2=> Math.round(bySecMo[r.name][mo][s2]||0));
      return {mo, cells:c2, total:c2.reduce((a,b)=>a+b,0)};
    });
    let prev=null;                                   // مفيش بيانات قطاعات للشهر ده = مفيش سهم
    if(prevMo){
      const raw=(monthlySector[prevMo]||{})[r.name]||{};
      if(Object.keys(raw).length){
        const acc={}; Object.entries(raw).forEach(([k,v])=>{ const s2=secColOf(k); acc[s2]=(acc[s2]||0)+v; });
        const c2=cols.map(s2=> Math.round(acc[s2]||0));
        prev={cells:c2, total:c2.reduce((a,b)=>a+b,0)};
      }
    }
    return {name:r.name, cells, total:cells.reduce((a,b)=>a+b,0), mrows, prev};
  });
  const stot=cols.map((s2,i)=> srows.reduce((a,r)=> a+r.cells[i], 0));
  const stotal=stot.reduce((a,b)=>a+b,0);
  return {months, f, t, rows, tot, total, cols, srows, stot, stotal};
}

/* ١) موزعين إجمالي — التصنيفات مجمّعة وكل موزع بسطر، عمود لكل شهر */
function buildDistTotal(){
  const cols=periodCols(), months=salesMonths();
  const moCol={}; cols.forEach((c,i)=> c.months.forEach(mo=> moCol[mo]=i));
  const custByName={}; customers.forEach(c=>custByName[c.name]=c);
  const rollup={}, distRows={}; const unclassified=new Set();
  months.forEach(mo=>{
    Object.keys(monthlySales[mo]||{}).forEach(name=>{
      const cls=(custByName[name]||{}).cls||'', net=saleNet(mo,name);
      if(cls==='مستبعد' || cls==='عميل ابواب' || cls==='مبيعات خاصة') return;   // ليهم تقاريرهم لوحدهم
      if(!cls){ unclassified.add(name); return; }
      const k=moCol[mo];
      if(cls==='موزع'){ distRows[name]=distRows[name]||{}; distRows[name][k]=(distRows[name][k]||0)+net; }
      else { rollup[cls]=rollup[cls]||{}; rollup[cls][k]=(rollup[cls][k]||0)+net; }
    });
  });
  const mk=(label,byCol)=>{
    const cells=cols.map((c,i)=> Math.round(byCol[i]||0));
    return {name:label, cells, total:cells.reduce((a,b)=>a+b,0)};
  };
  const list=[];
  ['مبيعات جملة'].forEach(cls=>{ if(rollup[cls]) list.push(mk(cls, rollup[cls])); });
  Object.keys(distRows).forEach(n=> list.push(mk(n, distRows[n])));
  list.sort((a,b)=> b.total-a.total);                       // من الأعلى للأقل
  const tot=cols.map((c,i)=> list.reduce((a,r)=> a+r.cells[i], 0));
  return {cols, months, list, tot, total: tot.reduce((a,b)=>a+b,0), unclassified:[...unclassified]};
}

  const d=buildDistTotal(), body=[];
  d.list.forEach(r=> body.push({type:'row', cells:[r.name, ...r.cells, r.total]}));
  body.push({type:'tot', cells:['الإجمالي', ...d.tot, d.total]});
  return {title:'مبيعات الموزعين — إجمالي '+periodLabel(),
    header:['بيان', ...d.cols.map(c=>c.label), 'الإجمالي'], body, d,

function importSales(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const sn = wb.SheetNames.find(n=>n==='Header_Wide') || wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
      /* صف العناوين في تصدير المحاسبة هو **الصف الأول** (rows[0]).
         الكود القديم كان بيبدأ البحث من الصف ١، فمكانش بيلاقيه أبدًا
         والاستيراد بيفشل في صمت. بندوّر من الأول دلوقتي. */
      let hdrRow=0; while(hdrRow<rows.length && !(rows[hdrRow]||[]).includes('c_name')) hdrRow++;
      if(hdrRow>=rows.length){ toast('الملف مفيهوش عمود c_name — اتأكد إنه تصدير المحاسبة'); return; }
      const hdr = rows[hdrRow];
      const idx=n=>hdr.indexOf(n);
      const ci=idx('c_name'), ii=idx('Item_Name'), voi=idx('vout'), vii=idx('vin');
      /* الكمية اسم عمودها بيختلف من تصدير للتاني — بندوّر على أشهر الأسماء.
         لو ملقيناش، تقارير الكميات بتقول كده بصراحة بدل ما تطلع أصفار. */
      const QOUT=['qout','q_out','qty_out','qtyout','quantity_out','الكمية','كمية','العدد','qty','quantity'];
      const QIN =['qin','q_in','qty_in','qtyin','quantity_in','كمية مرتجع','الكمية المرتجعة'];
      const findCol=(names)=>{ for(const n of names){
        const i=hdr.findIndex(h=> String(h||'').trim().toLowerCase()===n.toLowerCase()); if(i!==-1) return i; } return -1; };
      const qoi=findCol(QOUT), qii=findCol(QIN), coi=idx('Item_Code');
      // الملف مفيهوش عمود كود، فبنستخرجه من اسم الصنف: «باب كامل ارو 80 سم A01»
      const codeFromName = n=>{ const m=String(n||'').match(/\b([A-Za-z]\s?\d{1,3})\b/); return m? m[1].replace(/\s/g,'').toUpperCase() : ''; };
      /* الصنف يعتبر باب من **مجموعته الرئيسية** (ابواب WPC) — دي المرجع.
         الاسم بيتستخدم كاحتياطي بس لو الصنف نفسه مش موجود في قايمة
         الأصناف أصلاً، عشان مبيعات الأبواب ما تضيعش في صمت. */
      const isDoor = (it, nm)=> it ? /ابواب|أبواب/.test(it.mainGroup||'')
                                   : /(^|\s)(باب|ابواب|أبواب)/.test(nm||'');
      const dataRows = rows.slice(hdrRow+1).filter(r=>r[ci]);
      const custMap={}, sectorMap={}, doorMap={}, itemMap={};
      const unmatchedCust=new Set(), unmatchedItems=new Set();
      const custByName={}; customers.forEach(c=>custByName[c.name]=c);
      for(const row of dataRows){
        let cname=String(row[ci]).trim(); if(!cname) continue;
        cname = custAlias[cname] || cname;          // اسم اتدمج قبل كده
        const vout=nz(row[voi]), vin=vii>=0? nz(row[vii]) : 0, net=vout-vin;
        custMap[cname]=(custMap[cname]||0)+net;
        if(!custByName[cname]) unmatchedCust.add(cname);
        const iname=String(row[ii]||'').trim();
        const it=iname? itemFind(iname) : null;   // بالاسم، ولو مفيش بالبصمة (مسافة، ة/ه، أ/ا)
        /* بنخزّن المجموعة الرئيسية زي ما هي، والتوزيع على أعمدة
           التقرير بيتعمل وقت العرض — فتقدر تنقل مجموعة لعمود تاني
           في أي وقت من غير ما ترفع الشيت تاني. */
        const sector = it? (it.mainGroup || 'غير معروف') : 'غير معروف';
        if(!it && iname) unmatchedItems.add(iname);
        sectorMap[cname]=sectorMap[cname]||{}; sectorMap[cname][sector]=(sectorMap[cname][sector]||0)+net;
        if(iname){ const im=itemMap[iname]=itemMap[iname]||{qty:0,val:0};
          im.val+=net; im.qty+=(qoi>=0? nz(row[qoi]) : 0)-(qii>=0? nz(row[qii]) : 0); }
        // تفصيل الأبواب: لازم الكمية والكود عشان تقارير الأبواب
        if(isDoor(it, iname)){
          const qty=(qoi>=0? nz(row[qoi]) : 0) - (qii>=0? nz(row[qii]) : 0);
          const code=(coi>=0? String(row[coi]||'').trim() : '') || codeFromName(iname);
          doorMap[cname]=doorMap[cname]||{};
          const d=doorMap[cname][iname]=doorMap[cname][iname]||{qty:0, val:0, code, sub:(it&&it.subGroup)||''};
          d.qty+=qty; d.val+=net; if(!d.code && code) d.code=code;
          if(!d.sub && it && it.subGroup) d.sub=it.subGroup;
        }
      }
      const total=Object.values(custMap).reduce((a,b)=>a+b,0);
      pendingImport={type:'sales', custMap, sectorMap, doorMap, itemMap, hasQty: qoi>=0,
        unmatchedCust:[...unmatchedCust], unmatchedItems:[...unmatchedItems], total};
      openSheet(`<h3>تأكيد المبيعات</h3>
        <div class="f-row"><label>الشهر *</label>
          <div style="display:flex;gap:6px">
            <select id="s_mo" style="flex:2">${AR_MONTHS.map((n,i)=>
              `<option value="${String(i+1).padStart(2,'0')}" ${i===new Date().getMonth()?'selected':''}>${n}</option>`).join('')}</select>
            <select id="s_yr" style="flex:1">${(()=>{const y=new Date().getFullYear(); let o='';
              for(let v=y+1; v>=y-4; v--) o+=`<option ${v===y?'selected':''}>${v}</option>`; return o;})()}</select>
          </div></div>
        <p style="font-size:13px">عملاء: ${Object.keys(custMap).length} — إجمالي: ${Math.round(total).toLocaleString('en-US')}
          ${Object.keys(doorMap).length? ` — أبواب: ${Object.keys(doorMap).length} عميل` : ''}</p>
        ${qoi<0? `<div class="warn">الملف مفيهوش عمود كمية، فتقارير الأبواب هتطلع بالقيمة بس.</div>`:''}
        ${pendingImport.unmatchedCust.length?`<div class="warn">عملاء جدد: ${pendingImport.unmatchedCust.slice(0,5).join('، ')}</div>`:''}
        <div class="f-actions"><button class="btn-cancel" onclick="closeSheet()">إلغاء</button>
        <button class="btn-save" onclick="commitSalesImport()">💾 حفظ</button></div>`);
    }catch(err){ toast('خطأ في الملف'); }
  };
  r.readAsArrayBuffer(file);
}
function commitSalesImport(){
  const p=pendingImport; if(!p) return;
  const month=$('#s_yr').value+'-'+$('#s_mo').value;
  if(!/^\d{4}-\d{2}$/.test(month)){ toast('اختار الشهر'); return; }
  /* نفس الشهر مرفوع قبل كده (أو بصيغة قديمة زي 2026-1) — كان بيتكتب فوقه
     من غير ما يسأل، والصيغة القديمة كانت بتفضل جنبه فالشهر يتحسب مرتين */
  const same=Object.keys(monthlySales).filter(k=> moNum(k)===moNum(month));
  if(same.length && !confirm('شهر '+moName(month)+' مرفوع قبل كده — تستبدله بالشيت ده؟')) return;
  same.filter(k=> k!==month).forEach(k=>{ delete monthlySales[k]; delete monthlySector[k]; delete monthlyDoors[k]; delete monthlyItems[k];
    salesArchive=salesArchive.filter(x=> x!==k); });
  p.unmatchedCust.forEach(name=>{ customers.push({id:uid(),name,cls:''}); });
  save('customers_v1',customers);
  monthlySales[month]=p.custMap; monthlySector[month]=p.sectorMap;
  monthlyDoors[month]=p.doorMap||{}; monthlyItems[month]=p.itemMap||{};
  salesArchive = salesArchive.filter(x=> x!==month);   // شهر مرفوع من جديد يرجع شغّال
  save('monthlySales_v1',monthlySales); save('monthlySector_v1',monthlySector);
  save('monthlyDoors_v1',monthlyDoors); save('monthlyItems_v1',monthlyItems);
  save('salesArchive_v1',salesArchive);
  pendingImport=null; closeSheet(); render(); toast('تم حفظ '+moName(month));
}

function commitImport(){
  if(!pendingImport) return;
  if(pendingImport.type==='items'){ items=pendingImport.list; reindexItems(); save('items_v1',items); }
  /* الاستيراد كان بيدّي كل حاجة id جديد: الطلبيات كانت بتفقد أوزانها
     وأسعارها (مربوطة بـid الكود)، والعملاء بيرجعوا كلهم غير مصنفين،
     والحضور والخصومات (مربوطة بـid الموظف) بتضيع. دلوقتي اللي موجود
     بالاسم بيفضل بنفس الـid وبياناته. */
  else if(pendingImport.type==='gvcodes'){
    const byName={}, byCode={}; gvcodes.forEach(g=>{ byName[ordNorm(g.name)]=g; if(g.code) byCode[ordNorm(g.code)]=g; });
    gvcodes=pendingImport.list.map(g=>{ const old=byName[ordNorm(g.name)] || (g.code && byCode[ordNorm(g.code)]); return old? Object.assign(g,{id:old.id}) : g; });
    save('gvcodes_v1',gvcodes); }
  else if(pendingImport.type==='customers'){
    // دمج: العميل الموجود بيفضل بتصنيفه، والجديد بيتضاف غير مصنّف، ومحدش بيتمسح (ليه مبيعات)
    const have={}; customers.forEach(c=> have[ordNorm(c.name)]=1);
    const add=pendingImport.list.filter(c=> !have[ordNorm(c.name)] && (have[ordNorm(c.name)]=1));
    customers=customers.concat(add); save('customers_v1',customers);
    pendingImport=null; closeSheet(); render(); toast(add.length? 'اتضاف '+add.length+' عميل جديد' : 'مفيش عملاء جداد'); return; }
  else if(pendingImport.type==='employees'){
    const byName={}; employees.forEach(e=> byName[ordNorm(e.name)]=e);
    employees=pendingImport.list.map(e=>{ const old=byName[ordNorm(e.name)]; return old? Object.assign(e,{id:old.id}) : e; });
    save('employees_v1',employees); }
  else if(pendingImport.type==='gvrows'){ const o=gvGet(); if(o){ o.rows=pendingImport.rows; gvSave(); } }
  else if(pendingImport.type==='stock'){
    const at=load('whStockAt_v1',{}), now=Date.now();
    Object.entries(pendingImport.perWh).forEach(([whId,map])=>{ whStock[whId]=map; at[whId]={t:now, f:pendingImport.file||'', n:Object.keys(map).length}; });
    save('whStock_v1',whStock); save('whStockAt_v1',at); }
  pendingImport=null; closeSheet(); render(); toast('تم الحفظ');
}

const LIB_URLS={
  html2canvas:'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
  jspdf:'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  exceljs:'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'
};
function loadLib(key, test){
  return new Promise((res,rej)=>{
    if(test()) return res();
    const s=document.createElement('script'); s.src=LIB_URLS[key];
    s.onload=()=>test()?res():rej(new Error('lib '+key)); s.onerror=()=>rej(new Error('net '+key));
    document.head.appendChild(s);
  });
}

function docHeader(){

function mkDoc(bodyHtml, landscape){
  const el=document.createElement('div');
  el.style.cssText='position:fixed;left:-99999px;top:0;width:'+(landscape?1120:780)+'px;background:#fff;color:#111;padding:18px;direction:rtl;font-family:Tahoma,Arial,sans-serif;box-sizing:border-box';
  el.innerHTML=DOC_CSS+docHeader()+bodyHtml;
  document.body.appendChild(el);
  /* جدول أعمدته كتير أعرض من الورقة كان بيتقص من الشمال. بنوسّع
     المستند لعرض الجدول الطبيعي، والـPDF بيصغّره ليدخل الورقة. */
  const over = el.scrollWidth - el.clientWidth;
  if(over > 2) el.style.width = Math.min(el.scrollWidth + 8, 3400) + 'px';
  return el;
}
async function docToCanvas(el){
  await loadLib('html2canvas',()=>window.html2canvas);
  // نقلل الدقة تلقائيًا للجداول الطويلة عشان متعدّيش حد الذاكرة في الموبايل
  const area=Math.max(1,el.offsetWidth*el.offsetHeight); let sc=2;
  while(area*sc*sc>12e6 && sc>0.7) sc=Math.round((sc-0.1)*10)/10;
  return window.html2canvas(el,{scale:sc,backgroundColor:'#fff',useCORS:true});
}
/* الصورة بتفتح شاشة المشاركة بتاعة الموبايل على طول (واتس/تيليجرام/ميل)
   بدل ما تنزّلها وتروح تدوّر عليها في الملفات. لو الجهاز مش بيدعم
   المشاركة (كمبيوتر مثلاً) بتتنزّل عادي. */
function canvasToBlob(c){ return new Promise(r=> c.toBlob(r, 'image/png')); }
async function shareOrDownload(blob, filename, title){
  const file = new File([blob], filename, {type:'image/png'});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title: title||filename});
      return 'share';
    }
  }catch(e){
    // المستخدم قفل شاشة المشاركة — مش غلط، ما ننزّلش ورا ظهره
    if(e && e.name === 'AbortError') return 'cancel';
  }
  downloadBlob(blob, filename);
  return 'download';
}
async function exportDocImage(bodyHtml, filename, landscape, forceDownload){
  toast('جاري تجهيز الصورة...'); const el=mkDoc(bodyHtml,landscape);
  try{
    const c = await docToCanvas(el);
    const blob = await canvasToBlob(c);
    if(!blob) throw new Error('no blob');
    let how;
    if(forceDownload){ downloadBlob(blob, filename+'.png'); how='download'; }
    else how = await shareOrDownload(blob, filename+'.png', filename);
    toast(how === 'share' ? 'اتبعتت' : (how === 'cancel' ? '' : 'تم تنزيل الصورة'));
  }
  catch(e){ console.error(e); toast('تعذر التصدير — تأكد من الاتصال بالإنترنت'); }
  finally{ el.remove(); }
}

async function doExportDocPdf(bodyHtml, filename, landscape){
  toast('جاري تجهيز ملف PDF...'); const el=mkDoc(bodyHtml,landscape);
  try{
    await loadLib('jspdf',()=>window.jspdf);
    const canvas=await docToCanvas(el);
    const pdf=new window.jspdf.jsPDF({orientation:landscape?'l':'p',unit:'pt',format:'a4'});
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight(), mg=18;
    const sc=(pw-2*mg)/canvas.width, pageH=(ph-2*mg)/sc;
    const er=el.getBoundingClientRect(), k=canvas.width/er.width;
    const trs=[...el.querySelectorAll('tr')];
    const bounds=trs.map(r=>Math.round((r.getBoundingClientRect().bottom-er.top)*k));
    const Y=(r,edge)=> Math.round((r.getBoundingClientRect()[edge]-er.top)*k);
    /* الرأس = من فوق لحد صف عناوين الجدول الرئيسي، والذيل = صفوف إجماليه.
       بنبص على أول جدول بس — لو في جدول تاني تحته (زي الحاويات في طلبية
       جيفز) كان بيلخبط الحسبة فالعناوين ما كانتش بتتكرر. اللي بعد الجدول
       الرئيسي بيتطبع بعد الإجمالي في الآخر. */
    const T=el.querySelector('table');
    const ttrs=T? [...T.querySelectorAll('tr')] : [];
    let headH=0, footTop=0, footBot=0, footH=0;
    let hi=0; while(hi<ttrs.length && ttrs[hi].querySelector('th')) hi++;
    if(hi>0) headH=Y(ttrs[hi-1],'bottom');
    let fi=ttrs.length;
    for(let i=ttrs.length-1; i>=hi; i--){
      if(/(^|\s)m(\s|$)/.test(ttrs[i].className)){ fi=i; break; }
      if(!/(^|\s)s(\s|$)/.test(ttrs[i].className)) break;
    }
    if(fi<ttrs.length){ footTop=Y(ttrs[fi],'top'); footBot=Y(ttrs[ttrs.length-1],'bottom'); footH=footBot-footTop; }
    const band=(top,h)=>{ const sl=document.createElement('canvas');
      sl.width=canvas.width; sl.height=h;
      sl.getContext('2d').drawImage(canvas,0,top,canvas.width,h,0,0,canvas.width,h);
      return sl.toDataURL('image/jpeg',0.92); };
    const cut=(y,cap,lim)=>{ let end=Math.min(y+cap, lim);
      if(end<lim){ const cand=bounds.filter(b=>b>y+cap*0.4 && b<=end); if(cand.length) end=cand[cand.length-1]; }
      if(end<=y) end=Math.min(y+cap, lim); return end; };
    let first=true;
    const newPage=()=>{ if(!first) pdf.addPage(); first=false; };
    /* مكان رقم الصفحة تحت كل ورقة */
    const numH = 16/sc;
    const pageB = pageH - numH;
    /* «أعلى ٣» (.dxtop) في أول ورقة بس: الرأس في باقي الورق = اللي فوقهم
       (اللوجو والعنوان) + صف عناوين الجدول، من غير المربعات */
    const boxes=[...el.querySelectorAll('.dxtop')];
    let bTop=0, bBot=0;
    if(boxes.length && headH){ bTop=Math.min(...boxes.map(b=>Y(b,'top'))); bBot=Math.max(...boxes.map(b=>Y(b,'bottom')));
      if(!(bTop>0 && bBot<=headH)) bTop=bBot=0; }
    const head2H = headH - (bBot-bTop);
    /* مستند فيه أقسام .dxgrp (نتيجة الجرد): الملخص في أول ورقة، وكل مجموعة تبدأ
       في ورقة لوحدها بلوجو فوق وعناوين الجدول؛ والمجموعة الطويلة بتكمّل على ورقة
       تانية بنفس العناوين. */
    const gEls=[...el.querySelectorAll('.dxgrp')], hdEl=el.querySelector('.dxhead');
    if(gEls.length && hdEl){
      const hdTop=Y(hdEl,'top'), hdH=Y(hdEl,'bottom')-hdTop, gap=10*k, hdImg=band(hdTop,hdH);
      const g0=Y(gEls[0],'top');
      newPage(); pdf.addImage(band(0,g0),'JPEG',mg,mg,canvas.width*sc,g0*sc);
      gEls.forEach(g=>{
        const gt=Y(g,'top'), gb=Y(g,'bottom'), thr=g.querySelector('tr');
        const thTop=Y(thr,'top'), thBot=Y(thr,'bottom');
        let y=thBot, firstP=true;
        while(firstP || y<gb-2){
          newPage(); let cur=mg;
          pdf.addImage(hdImg,'JPEG',mg,cur,canvas.width*sc,hdH*sc); cur+=(hdH+gap)*sc;
          const t0 = firstP? gt : thTop, tH = thBot-t0;
          pdf.addImage(band(t0,tH),'JPEG',mg,cur,canvas.width*sc,tH*sc); cur+=tH*sc;
          const avail = pageB - hdH - gap - tH;
          const end = cut(y, avail, gb);
          pdf.addImage(band(y,end-y),'JPEG',mg,cur,canvas.width*sc,(end-y)*sc);
          y=end; firstP=false;
        }
      });
    } else if(!T || !headH || pageB - Math.max(headH, head2H) - footH < pageB*0.25){
      // مستند من غير جدول واضح — تقطيع عادي على حدود الصفوف
      let y=0;
      while(y < canvas.height-2){ const end=cut(y,pageB,canvas.height); newPage();
        pdf.addImage(band(y,end-y),'JPEG',mg,mg,canvas.width*sc,(end-y)*sc); y=end; }
    } else {
      const headImg=band(0,headH);
      const topImg = bBot? band(0,bTop) : null, thImg = bBot? band(bBot, headH-bBot) : null;
      const footImg = footH? band(footTop,footH) : null;
      const bodyEnd = footH? footTop : Y(ttrs[ttrs.length-1],'bottom');
      let y=headH, cur=mg, pg=0;
      while(y < bodyEnd-2){
        newPage(); cur=mg;
        const hH = pg===0 ? headH : head2H;
        if(pg===0 || !bBot){ pdf.addImage(headImg,'JPEG',mg,cur,canvas.width*sc,headH*sc); cur+=headH*sc; }
        else { if(bTop){ pdf.addImage(topImg,'JPEG',mg,cur,canvas.width*sc,bTop*sc); cur+=bTop*sc; }
               pdf.addImage(thImg,'JPEG',mg,cur,canvas.width*sc,(headH-bBot)*sc); cur+=(headH-bBot)*sc; }
        const avail = pageB - hH;
        let end = cut(y, avail, bodyEnd);
        // الإجمالي في آخر ورقة بس — ولو مش هيكفي مكانه، ناخد صفوف معاه للورقة الجاية
        if(end>=bodyEnd-2 && footH && (end-y)+footH > avail){
          end = cut(y, avail-footH, bodyEnd);
          if(end>=bodyEnd-2) end = cut(y, Math.max(avail-footH-1, 20), bodyEnd-1);
        }
        pdf.addImage(band(y,end-y),'JPEG',mg,cur,canvas.width*sc,(end-y)*sc); cur+=(end-y)*sc;
        if(end>=bodyEnd-2 && footImg){ pdf.addImage(footImg,'JPEG',mg,cur,canvas.width*sc,footH*sc); cur+=footH*sc; }
        y=end; pg++;
      }
      if(footImg && y>=bodyEnd-2 && pg===0){ newPage(); pdf.addImage(footImg,'JPEG',mg,mg,canvas.width*sc,footH*sc); cur=mg+footH*sc; }
      // اللي بعد الجدول الرئيسي (جدول الحاويات مثلاً)
      let t=footH? footBot : bodyEnd;
      const room=()=> (ph-mg-16-cur)/sc;
      if(canvas.height - t < 40*k) t=canvas.height;      // مجرد هامش المستند — مفيش حاجة بعد الجدول
      while(t < canvas.height-2){
        if(room() < 40){ newPage(); cur=mg; }
        const end=cut(t, room(), canvas.height);
        pdf.addImage(band(t,end-t),'JPEG',mg,cur,canvas.width*sc,(end-t)*sc);
        cur+=(end-t)*sc; t=end;
        if(t < canvas.height-2){ newPage(); cur=mg; }
      }
    }
    // «صفحة ١ من ٣» تحت كل ورقة — بالعربي كصورة لأن خطوط jsPDF مفيهاش عربي
    const N=pdf.internal.getNumberOfPages();
    for(let i=1;i<=N;i++){
      const c=document.createElement('canvas'); c.width=360; c.height=40;
      const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
      x.fillStyle='#555'; x.font='bold 22px Tahoma, Arial, sans-serif'; x.textAlign='center'; x.textBaseline='middle';
      x.direction='rtl'; x.fillText('صفحة '+i+' من '+N, c.width/2, c.height/2);
      pdf.setPage(i);
      const w=126, h=14;
      pdf.addImage(c.toDataURL('image/png'),'PNG',(pw-w)/2,ph-mg+2-h,w,h);
    }
    pdf.save(filename+'.pdf'); toast('تم تنزيل ملف PDF');
  }catch(e){ console.error(e); toast('تعذر إنشاء PDF — تأكد من الاتصال بالإنترنت'); }
  finally{ el.remove(); }
}

    rows+=`<tr class="m"><td colspan="2">${esc(bucket)}</td>${cols.map(u=>`<td>${b.byUnit[u]||''}</td>`).join('')}</tr>`;

      rows+=`<tr class="z"><td></td><td>${esc(sub)}</td>${cols.map(u=>`<td>${t[u]||''}</td>`).join('')}</tr>`; });
  });

/* ═══════════ مقارنة جيفز بالكراتين بين الفروع ═══════════
   أصناف جيفز متخزّنة بالقطعة في المخازن، وانت بتفكّر فيها بالكرتونة.
   هنا كل صنف جيفز بنجيب رصيده في كل فرع ونقسمه على عدد القطع في الكرتونة.
   المطابقة بالاسم بالظبط الأول، وبعدين بالبصمة (من غير مسافات ولا رموز). */
let gvcZero = false;
/* أصناف جيفز اسمها في شيت الأرصدة غالبًا مختلف عن اسمها في أكواد جيفز
   (مثلاً «سبلونة مفصلى 30 سم GEVIS» مقابل «سبلونه مفصلي 30 GEVIS ISP-M300»).
   بنجرّب بالترتيب: الاسم بالظبط → البصمة → الكود جوه اسم الرصيد → احتواء
   جزئي → وأخيرًا ربط يدوي محفوظ (gvMap) بيتزامن بين الأجهزة. */
let gvMap = load('gvMap_v1', {});
function gvMapSet(codeId, stockName){
  if(stockName) gvMap[codeId] = stockName; else delete gvMap[codeId];
  save('gvMap_v1', gvMap); render();
}
function allStockNames(){
  const out = new Set();
  for(const w of warehouses) for(const n of Object.keys(whStock[w.id]||{})) out.add(n);
  return [...out];
}
/* كلمات بتفرّق بين أنواع متشابهة في الاسم والكود (سبلونة 40 مفصلي
   وسبلونة 40 جرار الاتنين كودهم M400) — لازم النوع يتطابق قبل
   ما نعتبرهم نفس الصنف، وإلا الاتنين بياخدوا نفس الرصيد. */
const GV_KINDS=[/جرار/, /مفصل/, /كرنك/, /بكر/, /سحاب/];
function gvKind(t){ t=String(t||''); for(let i=0;i<GV_KINDS.length;i++) if(GV_KINDS[i].test(t)) return i; return -1; }
function gvKindOk(a,b){ const x=gvKind(a), y=gvKind(b); return x<0 || y<0 || x===y; }
function gvStockName(name, codeId, code){
  if(codeId && Object.prototype.hasOwnProperty.call(gvMap, codeId)){
    const m = gvMap[codeId];
    return m ? m : null;                       // '' = متجاهل بطلبك
  }
  if(name) for(const w of warehouses) if(stockKey(w.id, name) !== null) return name;
  const names = allStockNames();
  const ok = n=> gvKindOk(name, n);
  const cf = ordNorm(code || '');
  if(cf && cf.length >= 3){
    const hit = names.find(n=> ok(n) && ordNorm(n).indexOf(cf) >= 0);
    if(hit) return hit;
  }
  const nf = ordNorm(name || '');
  if(nf && nf.length >= 4){
    const hit = names.find(n=>{ if(!ok(n)) return false;
      const x = ordNorm(n); return x.indexOf(nf) >= 0 || nf.indexOf(x) >= 0; });
    if(hit) return hit;
  }
  return null;
}
/* أسماء جيفز طويلة وبيتكرر فيها نفس الكلام (GEVIS · ISP · SUR · الكود).
   المطلوب اسم عربي بس وبترتيب: الكلمة الأولى ثم المقاس ثم النوع —
   «سبلونة مفصلى 40 سم GEVIS ISP-M400»  →  «سبلونة 40 مفصلى».
   الاسم الكامل بيفضل في tooltip وفي لوحة الربط. */
function gvShortName(name, code){
  const orig = String(name || '').trim();
  /* ١) نشيل الأكواد كاملة الأول (M300 · ISP-M1600 · A01) — لو شلنا الحروف
     بس، الأرقام اللي جواها بتفضل وتبان كأنها مقاس (M300 → 300). */
  let t = orig.replace(/[A-Za-z][A-Za-z0-9\-]*/g, ' ')   // بيبدأ بحرف لاتيني
              .replace(/[\d]+[A-Za-z][A-Za-z0-9]*/g, ' ') // بيبدأ برقم وفيه حرف
              .replace(/جيفيز|جيفز/g, ' ')
              .replace(/[\-–—/_]+/g, ' ')
              .replace(/\.(?![\d٠-٩])|(?<![\d٠-٩])\./g, ' '); // النقطة بين رقمين تفضل
  // ٢) نشيل وحدات القياس المكرّرة
  t = t.replace(/(^|\s)(سم|مم|متر|م)(?=\s|$)/g, ' ');
  const parts = t.split(/\s+/).filter(Boolean);
  if(!parts.length) return orig;
  // ٣) المقاس يجي بعد الكلمة الأولى
  const numAt = parts.findIndex((w,k)=> k > 0 && /^[\d٠-٩]+([.,][\d٠-٩]+)?$/.test(w));
  if(numAt > 1){
    const [num] = parts.splice(numAt, 1);
    parts.splice(1, 0, num);
  }
  return parts.join(' ') || orig;
}
function buildGvCompare(){
  const rows = [];
  gvcodes.forEach(g=>{
    const nm = gvStockName(g.name, g.id, g.code);
    const pc = nz(g.perCarton);
    const pieces = warehouses.map(w=> nm ? qtyOf(w.id, nm) : 0);
    const total = pieces.reduce((a,b)=>a+b,0);
    if(!total && !gvcZero) return;
    rows.push({id:g.id, name:g.name, code:g.code||'', pc, pieces, stockName:nm,
      cartons: pieces.map(q=> pc ? q/pc : 0), total, totalCartons: pc ? total/pc : 0, matched: !!nm});
  });
  rows.sort(gvNameCmp);
  const tot = {pieces: warehouses.map((_,i)=> rows.reduce((a,r)=> a + r.pieces[i], 0))};
  tot.cartons = warehouses.map((_,i)=> rows.reduce((a,r)=> a + r.cartons[i], 0));
  tot.total = rows.reduce((a,r)=> a + r.total, 0);
  tot.totalCartons = rows.reduce((a,r)=> a + r.totalCartons, 0);
  return {rows, tot, groups: gvGroupRows(rows)};
}
/* المجموعة الفرعية بتتاخد من قايمة الأصناف عن طريق اسم الصنف في
   الأرصدة. اللي ملوش مجموعة بيتجمّع تحت «بدون مجموعة». */
function gvSubOf(r){
  const it = itemsByName[r.stockName] || {};
  return (it.subGroup || it.mainGroup || '').trim() || 'بدون مجموعة';
}
/* ترتيب أبجدي والأرقام جواه بتتقرا أرقام: ٣٠ ثم ٤٠ ثم ٦٠ ثم ١٠٠ */
const AR_COLL = new Intl.Collator('ar', {numeric:true, sensitivity:'base'});
const gvNameCmp = (a,b)=> AR_COLL.compare(gvShortName(a.name, a.code), gvShortName(b.name, b.code));
function gvGroupRows(rows){
  const by={};
  rows.forEach(r=>{ const g=gvSubOf(r); (by[g]=by[g]||[]).push(r); });
  return Object.keys(by).map(name=>{
    const list=by[name];
    const t={name, rows:list,
      cartons: warehouses.map((_,i)=> list.reduce((a,r)=> a+r.cartons[i], 0)),
      pieces:  warehouses.map((_,i)=> list.reduce((a,r)=> a+r.pieces[i], 0))};
    t.totalCartons=list.reduce((a,r)=>a+r.totalCartons,0);
    t.total=list.reduce((a,r)=>a+r.total,0);
    list.sort(gvNameCmp);
    return t;
  }).sort((a,b)=> AR_COLL.compare(a.name, b.name));
}
const fmtC = n=> !n ? '' : (Math.abs(n - Math.round(n)) < 0.005 ? String(Math.round(n)) : n.toFixed(2));
function gvCompareTableHtml(cls){

      <tr class="s"><td style="text-align:right"><b>إجمالي ${esc(g.name)}</b></td><td></td>

    <tr class="m"><td style="text-align:right"><b>الإجمالي العام</b></td><td></td>
      ${tot.cartons.map(c=>`<td><b>${fmtC(c)}</b></td>`).join('')}<td><b>${fmtC(tot.totalCartons)}</b></td></tr>
  </table>`;
}

  if(!gvcodes.length){ m.innerHTML = `<div class="empty">مفيش أكواد جيفز — ضيفها من شاشة جيفز أولاً</div>`; return; }

/* الأصناف اللي التطبيق ما عرفش يلاقيها في الأرصدة — تربطها بإيدك مرة
   واحدة من قايمة أسماء الأرصدة، والربط بيتزامن على كل أجهزتك. */
// تعديل «عدد القطع بالكرتونة» من مكان التنبيه من غير ما تروح لشاشة جيفز
function gvSetPerCarton(id, v){

function gvLinkHtml(){

function exportGvCompareImage(){ if(!buildGvCompare().rows.length){ toast('لا توجد بيانات'); return; } exportDocImage(gvCompareDocBody(),'مقارنة_جيفز_كراتين_'+todayStr(),true); }

let invCounts=load('invCounts_v1',{}), invMain=new Set(), invSub=new Set(), invHideZero=false, invView=0;
function invGet(whId){ if(!invCounts[whId]) invCounts[whId]={date:todayStr(),counts:{}}; return invCounts[whId]; }
/* مسودة الإدخال: اللي بتكتبه في «إدخال الجرد» بيتحفظ مسودة على الجهاز بس، ومابيتحسبش مجرود غير لما تدوس 💾 */
let invDraft=load('invDraft_v1',{});
function invDraftGet(whId){ if(!invDraft[whId]) invDraft[whId]={}; return invDraft[whId]; }
function setInvDraft(whId,itemId,kind,val){
  const it=items.find(x=>x.id===itemId); if(!it) return;
  const d=invDraftGet(whId), rq=Number(it.rollQty)||0, c=d[it.name]||{};
  if(kind==='q'){ if(val===''){ delete d[it.name]; } else { d[it.name]={actual:Number(val)}; } }
  else {
    if(val==='') delete c[kind]; else c[kind]=Number(val);
    if(c.big===undefined && c.small===undefined) delete d[it.name];
    else { c.actual=(c.big||0)*rq+(c.small||0); d[it.name]=c; }
  }
  save('invDraft_v1',invDraft);
}
function invSave(whId,itemId,btn){
  const it=items.find(x=>x.id===itemId); if(!it) return;
  const card=btn.closest('.invc'), d=invDraftGet(whId), c=d[it.name];
  /* لو لسه ماخرجش من الخانة، onchange ممكن ما اتنفذش — نقرا القيم من الكارت مباشرة */
  if(card){ const ins=[...card.querySelectorAll('input[type=number]')], rq=Number(it.rollQty)||0;
    if(rq>1){ ins.forEach((el,i)=>setInvDraft(whId,itemId,i===0?'big':'small',el.value)); } else if(ins[0]) setInvDraft(whId,itemId,'q',ins[0].value); }
  const cc=invDraftGet(whId)[it.name];
  if(!cc || cc.actual===undefined){ toast('اكتب الكمية الأول'); return; }
  invGet(whId).counts[it.name]=cc; delete invDraftGet(whId)[it.name];
  save('invCounts_v1',invCounts); save('invDraft_v1',invDraft);
  if(card && card.dataset.move==='1'){ card.remove(); invRefresh(whId); }
  else render(true);
  toast('اتحفظ ✅ — في «تم الجرد»');
}
function setInvDate(whId,v){ invGet(whId).date=v; save('invCounts_v1',invCounts); }
function invNew(whId){ if(!confirm('بدء جرد جديد؟ هيتمسح الجرد الحالي لهذا المخزن.')) return; invCounts[whId]={date:todayStr(),counts:{}}; invDraft[whId]={}; save('invCounts_v1',invCounts); save('invDraft_v1',invDraft); render(); }
function setInvCount(whId,itemId,kind,val){
  const it=items.find(x=>x.id===itemId); if(!it) return;
  const inv=invGet(whId), rq=Number(it.rollQty)||0, c=inv.counts[it.name]||{};
  if(kind==='q'){ if(val===''){ delete inv.counts[it.name]; } else { inv.counts[it.name]={actual:Number(val)}; } }
  else {
    if(val==='') delete c[kind]; else c[kind]=Number(val);
    if(c.big===undefined && c.small===undefined) delete inv.counts[it.name];
    else { c.actual=(c.big||0)*rq+(c.small||0); inv.counts[it.name]=c; }
  }
  save('invCounts_v1',invCounts);
  invRefresh(whId);
}
function invResult(whId){
  const inv=invGet(whId), stock=whStock[whId]||{}, rows=[];
  Object.entries(inv.counts).forEach(([name,c])=>{
    const it=itemsByName[name]||{}, prog=nz(stock[name]?.balance), act=nz(c.actual);
    rows.push({name, mg:it.mainGroup||'غير مصنف', prog, act, diff:act-prog});
  });
  const def=rows.filter(r=>r.diff<0), exc=rows.filter(r=>r.diff>0);
  const defTotal=def.reduce((a,r)=>a-r.diff,0), excTotal=exc.reduce((a,r)=>a+r.diff,0);
  const pct=rows.length? (rows.length-def.length-exc.length)/rows.length : 0;
  return {rows,def,exc,counted:rows.length,defTotal,excTotal,pct};
}
/* خانات إدخال الجرد: خانتين (لفة/عود) لو الصنف ليه محتوى لفة، وإلا خانة واحدة. fn = دالة الحفظ */

  return rq>1
    ? `<input type="number" inputmode="numeric" placeholder="${b.bigLbl}" value="${c.big??''}" style="${inp}" onchange="${call('big')}">
       <input type="number" inputmode="numeric" placeholder="${b.smallLbl}" value="${c.small??''}" style="${inp}" onchange="${call('small')}">`
    : `<input type="number" inputmode="numeric" placeholder="الفعلي" value="${c.actual??''}" style="${inp};width:84px" onchange="${call('q')}">`;
}
/* العدّادات: «مجرود» فوق + رقم تبويب «تم الجرد» + المتبقي في الاختيار الحالي */
function invRefresh(whId){
  const n=Object.keys(invGet(whId).counts).length;
  const a=document.getElementById('invCnt'); if(a) a.textContent=n;
  const bd=document.getElementById('invDoneBadge'); if(bd) bd.textContent=n;
  const L=document.getElementById('invList');
  if(L){
    const left=L.querySelectorAll('.invc[data-move="1"]').length;
    const p=document.getElementById('invProg'); if(p) p.textContent='متبقي في الاختيار ده: '+left+' صنف';
    const d=document.getElementById('invAllDone'); if(d) d.style.display = (!left && L.dataset.sel==='1' && Number(L.dataset.tot)>0)? '' : 'none';
  }
  const D=document.getElementById('invDoneList');
  if(D){ const e=document.getElementById('invDoneEmpty'); if(e) e.style.display = D.querySelector('.invc')? 'none' : ''; }
}
/* في تبويب «تم الجرد»: تعديل الكمية بيحدّث السطر، ولو اتمسحت الكمية الصنف يرجع لقايمة الإدخال */
function setInvCountDone(whId,itemId,kind,val,el){
  const it=items.find(x=>x.id===itemId); if(!it) return;
  setInvCount(whId,itemId,kind,val);
  const card=el&&el.closest?el.closest('.invc'):null, c=invGet(whId).counts[it.name];
  if(card){
    if(!c) card.remove();
    else{
      const prog=nz((whStock[whId]||{})[it.name]?.balance), d=nz(c.actual)-prog;
      const ia=card.querySelector('.ia'), idf=card.querySelector('.id');
      if(ia) ia.textContent=fmtN(nz(c.actual));
      if(idf) idf.innerHTML = invDiffHtml(d);
    }
  }
  invRefresh(whId);
}
function invUncount(whId, btn){
  const card=btn.closest('.invc'); if(!card) return;
  delete invGet(whId).counts[card.dataset.nm]; save('invCounts_v1',invCounts);
  card.remove(); invRefresh(whId);
  toast('رجع لقايمة الجرد');
}
const invDiffHtml = d => d===0? '<span style="color:var(--ok)">مطابق ✔</span>' : `<b style="color:${d<0?'var(--danger)':'var(--ok)'}">${d<0?'-':'+'}${fmtN(Math.abs(d))}</b>`;
function invDoneCard(whId, name){
  const c=invGet(whId).counts[name]; if(!c) return '';
  const it=itemsByName[name], prog=nz((whStock[whId]||{})[name]?.balance), act=nz(c.actual);
  return `<div class="card invc" data-nm="${esc(name)}"><div class="info"><div class="name" style="font-size:13px">${esc(name)}</div>
    <div class="sub">برنامج: ${fmtN(prog)} · فعلي: <span class="ia">${fmtN(act)}</span> · <span class="id">${invDiffHtml(act-prog)}</span></div></div>
    ${it? invInputsHtml(whId,it,c,'setInvCountDone') : ''}
    <button title="رجّعه لقايمة الجرد" onclick="invUncount('${whId}',this)" style="border:1px solid var(--border);background:var(--panel2);border-radius:8px;padding:8px 10px;font-size:15px;cursor:pointer">↩️</button></div>`;
}
function renderInvDone(m, whId, head){
  const inv=invGet(whId);
  let names=Object.keys(inv.counts).reverse();            // آخر اللي اتجرد يظهر الأول
  if(q) names=names.filter(n=>rsMatch(n,q));
  if(invFltOn()){ const stk=whStock[whId]||{};
    names=names.filter(n=>{ const it=itemsByName[n]||{}, d=nz(inv.counts[n].actual)-nz(stk[n]?.balance);
      if(invFlt.kind==='def' && !(d<0)) return false;
      if(invFlt.kind==='exc' && !(d>0)) return false;
      return !invFlt.secs.size || invFlt.secs.has(it.mainGroup||'غير مصنف'); }); }
  rsCtx={k:'inv', whId}; rsInfo = q? names.length+' نتيجة' : '';
  m.innerHTML = head+`
    <div class="toolbar"><input class="search" id="q" placeholder="بحث في اللي اتجرد..." value="${esc(q)}"></div>
    ${Object.keys(inv.counts).length? invFltBar(whId) : ''}
    <div id="invDoneList">${names.map(n=>invDoneCard(whId,n)).join('')}
      <div id="invDoneEmpty" class="empty" style="display:${names.length?'none':''}">${Object.keys(inv.counts).length?'لا توجد نتائج':'لسه ماتجردش أي صنف'}</div></div>
    <div style="height:20px"></div>`;
  const qi=$('#q'); if(qi) qi.oninput=e=>{ q=e.target.value; reRenderKeepQ(()=>renderWhInventory(m, whId)); };
  rsSync();
}
function renderWhInventory(m, whId){
  const inv=invGet(whId), w=warehouses.find(x=>x.id===whId), stock=whStock[whId]||{};
  const segBtn=(i,t)=>`<button class="stab${invView===i?' on':''}" style="flex:1 1 0" onclick="invView=${i};render()">${t}</button>`;
  const head=`<div class="warn" style="background:var(--panel2);color:var(--text);border-color:var(--border)">
      📝 جرد مخزن <b>${esc(w.name)}</b> بتاريخ <input type="date" value="${inv.date}" onchange="setInvDate('${whId}',this.value)" style="border:1px solid var(--border);border-radius:6px;padding:2px 6px;background:var(--panel);color:var(--text)">
      — مجرود: <b id="invCnt">${Object.keys(inv.counts).length}</b> صنف
      <button onclick="invNew('${whId}')" style="margin-right:8px;border:1px solid var(--border);background:var(--panel);color:var(--danger);border-radius:6px;padding:2px 8px;cursor:pointer">🗑️ جرد جديد</button></div>
    <div style="display:flex;gap:6px;margin-bottom:10px">${segBtn(0,'✍️ إدخال الجرد')}${segBtn(2,'✅ تم الجرد (<span id="invDoneBadge">'+Object.keys(inv.counts).length+'</span>)')}${segBtn(1,'📋 النتيجة')}</div>`;
  if(invView===1){ renderInvResult(m, whId, head); return; }
  if(invView===2){ renderInvDone(m, whId, head); return; }
  const allMain=[...new Set(items.map(i=>i.mainGroup).filter(Boolean))];
  const allSub=invMain.size? [...new Set(items.filter(i=>invMain.has(i.mainGroup)).map(i=>i.subGroup).filter(Boolean))] : [];
  rsCtx={k:'inv', whId};
  let list=invMain.size? items.filter(i=>invMain.has(i.mainGroup)) : (q? items.slice() : []);   // البحث بيدوّر في كل الأصناف حتى من غير مجموعة
  if(invSub.size) list=list.filter(i=>invSub.has(i.subGroup));
  if(q) list=list.filter(i=>rsMatch(i.name, q));
  if(invHideZero) list=list.filter(i=>qtyOf(whId, i.name)>0);
  const sel = invMain.size>0 && !q, tot = list.length;
  /* اللي اتجرد بيروح تبويب «تم الجرد» ويفضل هنا اللي لسه — إلا وقت البحث بيظهر الاتنين عشان تلاقي أي صنف */
  if(!q) list=list.filter(i=>!inv.counts[i.name]);
  const RS_CAP=80, capped = !!q && !invMain.size && list.length>RS_CAP;
  if(capped) list=list.slice(0,RS_CAP);
  rsInfo = q? (capped? 'أول '+RS_CAP+' — كمّل كتابة' : list.length+' نتيجة') : '';
  m.innerHTML = head+`
    <div class="toolbar"><input class="search" id="q" placeholder="بحث..." value="${esc(q)}"></div>
    ${ddRow('inv',allMain,invMain,allSub,invSub)}
    <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;margin:6px 0 10px"><input type="checkbox" ${invHideZero?'checked':''} onchange="invHideZero=this.checked;render()"> إخفاء الأصناف رصيدها صفر</label>
    ${(!invMain.size && !q)? `<div class="empty">اختار مجموعة رئيسية واحدة أو أكتر عشان تبدأ الجرد، أو دوّر بأيقونة 🔍</div>` :
      `<div id="invList" data-sel="${sel?1:0}" data-tot="${tot}">
        ${sel? `<div id="invProg" style="font-size:12.5px;color:var(--muted);margin:2px 0 8px">متبقي في الاختيار ده: ${list.length} صنف</div>`:''}
        <div id="invAllDone" class="empty" style="display:${sel&&tot&&!list.length?'':'none'}">✅ كل أصناف الاختيار ده اتجردت — شوفها في «تم الجرد»</div>
        ${list.length? list.map(it=>{
          const counted=!!inv.counts[it.name], c=counted? inv.counts[it.name] : (invDraftGet(whId)[it.name]||{});
          return `<div class="card invc" data-nm="${esc(it.name)}" ${counted?'':'data-move="1"'}><div class="info"><div class="name" style="font-size:13px">${esc(it.name)}${counted?' <span style="color:var(--ok);font-size:11.5px">✅ اتجرد</span>':''}</div>
            <div class="sub">برنامج: ${esc(balText(it.name, stockOf(whId, it.name)))}</div></div>${counted? '' : `<button title="حفظ ونقله لتم الجرد" onclick="invSave('${whId}','${it.id}',this)" style="border:1px solid var(--border);background:var(--panel2);border-radius:8px;padding:8px 10px;font-size:16px;cursor:pointer">💾</button>`}${invInputsHtml(whId,it,c,counted?'setInvCountDone':'setInvDraft')}</div>`;
        }).join('') : (tot? '' : `<div class="empty">لا توجد أصناف مطابقة</div>`)}
      </div>`}
    <div style="height:20px"></div>`;
  const qi=$('#q'); if(qi) qi.oninput=e=>{ q=e.target.value; reRenderKeepQ(()=>renderWhInventory(m, whId)); };
  rsSync();
}
function invStatsHtml(r){
  const box=(l,v,c)=>`<div style="background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center"><div style="font-size:11.5px;color:var(--muted)">${l}</div><div style="font-size:19px;font-weight:700;${c?'color:'+c:''}">${v}</div></div>`;
  return `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">
    ${box('أصناف مجرودة',fmtN(r.counted))}${box('أصناف عجز',fmtN(r.def.length),'var(--danger)')}${box('أصناف زيادة',fmtN(r.exc.length),'var(--ok)')}
    ${box('إجمالي العجز',fmtN(r.defTotal),'var(--danger)')}${box('إجمالي الزيادة',fmtN(r.excTotal),'var(--ok)')}${box('نسبة المطابقة',Math.round(r.pct*100)+'%')}</div>`;
}
function invListHtml(list, kind){
  if(!list.length) return `<div class="empty" style="padding:14px">${kind==='def'?'لا يوجد عجز':'لا يوجد زيادة'}</div>`;
  return list.map(x=>`<div class="card"><div class="info"><div class="name" style="font-size:13px">${esc(x.name)}</div>
    <div class="sub">${esc(x.mg)} · برنامج: ${fmtN(x.prog)} · فعلي: ${fmtN(x.act)}</div></div>
    <b style="color:${kind==='def'?'var(--danger)':'var(--ok)'}">${kind==='def'?'-':'+'}${fmtN(Math.abs(x.diff))}</b></div>`).join('');
}
/* النتيجة متجمّعة بالمجموعة: كل مجموعة (كرافت / نيو / …) فيها عجزها وزيادتها مع بعض */
let invFlt={kind:'all', secs:new Set()}, invFltNames=[];      // فلتر النتيجة: النوع (الكل/عجز/زيادة) + القطاعات
const invFltOn = () => invFlt.kind!=='all' || invFlt.secs.size>0;
function invByGroup(whId, raw){
  const r=invResult(whId), map=new Map();
  r.rows.forEach(x=>{ if(!x.diff) return;
    if(!map.has(x.mg)) map.set(x.mg,{mg:x.mg,def:[],exc:[]});
    (x.diff<0? map.get(x.mg).def : map.get(x.mg).exc).push(x); });
  const byName=(a,b)=>a.name.localeCompare(b.name,'ar');
  return [...map.values()].filter(g=> raw || !invFlt.secs.size || invFlt.secs.has(g.mg)).map(g=>{
      if(!raw){ if(invFlt.kind==='def') g.exc=[]; else if(invFlt.kind==='exc') g.def=[]; }
      g.def.sort(byName); g.exc.sort(byName);
      g.defTotal=g.def.reduce((a,x)=>a-x.diff,0); g.excTotal=g.exc.reduce((a,x)=>a+x.diff,0); return g; })
    .filter(g=> g.def.length||g.exc.length)
    .sort((a,b)=> ((a.mg==='غير مصنف')-(b.mg==='غير مصنف')) || a.mg.localeCompare(b.mg,'ar'));
}
const invGroupTitle = g => g.mg+' — '+[g.def.length? 'عجز '+fmtN(g.defTotal)+' ('+g.def.length+' صنف)':'', g.exc.length? 'زيادة '+fmtN(g.excTotal)+' ('+g.exc.length+' صنف)':''].filter(Boolean).join(' · ');
function invGroupHtml(g){
  const row=(x,neg)=>`<div class="card"><div class="info"><div class="name" style="font-size:13px">${esc(x.name)}</div>
    <div class="sub">برنامج: ${fmtN(x.prog)} · فعلي: ${fmtN(x.act)}</div></div>
    <b style="color:${neg?'var(--danger)':'var(--ok)'}">${neg?'-':'+'}${fmtN(Math.abs(x.diff))}</b></div>`;
  return `<div class="invgrp"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin:14px 0 8px">
      <b>📦 ${esc(g.mg)}</b>
      <span style="font-size:12.5px">${g.def.length?`<span style="color:var(--danger)">🔻 عجز ${g.def.length} · -${fmtN(g.defTotal)}</span>`:''}${g.def.length&&g.exc.length?' &nbsp; ':''}${g.exc.length?`<span style="color:var(--ok)">🔺 زيادة ${g.exc.length} · +${fmtN(g.excTotal)}</span>`:''}</span></div>
    ${g.def.map(x=>row(x,true)).join('')}${g.exc.map(x=>row(x,false)).join('')}</div>`;
}
const invFltText = () => invFltOn()? [invFlt.kind==='def'?'عجز فقط':invFlt.kind==='exc'?'زيادة فقط':'', invFlt.secs.size? 'القطاعات: '+[...invFlt.secs].join('، ') : ''].filter(Boolean).join(' · ') : '';
const invFltBar = whId => `<div style="display:flex;align-items:center;gap:8px;margin:0 0 10px">
      <button onclick="invFltSheet('${whId}')" style="border:1px solid ${invFltOn()?'var(--blue)':'var(--border)'};background:${invFltOn()?'var(--blue)':'var(--panel)'};color:${invFltOn()?'#fff':'var(--text)'};border-radius:10px;padding:8px 14px;font-weight:700;font-size:13.5px;cursor:pointer">🔽 فلتر${invFltOn()?' ●':''}</button>
      ${invFltOn()? `<span style="font-size:12.5px;color:var(--muted);flex:1">${esc(invFltText())}</span><button onclick="invFltClear('${whId}')" style="border:none;background:none;color:var(--danger);font-size:12.5px;cursor:pointer">✖ مسح</button>` : ''}</div>`;
function invFltSheet(whId){
  /* في «تم الجرد» القطاعات = كل مجموعات الأصناف المجرودة، وفي «النتيجة» = المجموعات اللي فيها فروق */
  invFltNames = invView===2? [...new Set(invResult(whId).rows.map(x=>x.mg))].sort((a,b)=> ((a==='غير مصنف')-(b==='غير مصنف')) || a.localeCompare(b,'ar'))
                           : invByGroup(whId,true).map(g=>g.mg);
  const kb=(v,t)=>`<button class="mochip${invFlt.kind===v?' on':''}" onclick="invFlt.kind='${v}';invFltSheet('${whId}');render(true)">${t}</button>`;
  openSheet(`<h3>🔽 فلتر نتيجة الجرد</h3>
    <div style="font-size:12.5px;color:var(--muted);margin:6px 0 4px">النوع</div>
    <div class="morow">${kb('all','الكل')}${kb('def','🔻 عجز')}${kb('exc','🔺 زيادة')}</div>
    <div style="font-size:12.5px;color:var(--muted);margin:10px 0 4px">القطاعات <span style="font-size:11.5px">(من غير اختيار = كلها)</span></div>
    <div class="morow">${invFltNames.map((n,i)=>`<button class="mochip${invFlt.secs.has(n)?' on':''}" onclick="invFltTog(${i},'${whId}')">${esc(n)}</button>`).join('')||'<span style="font-size:12.5px">لا توجد قطاعات</span>'}</div>
    <div class="f-actions"><button class="btn-cancel" onclick="invFltClear('${whId}')">مسح الفلتر</button><button class="btn-save" onclick="closeSheet()">تطبيق</button></div>`);
}
function invFltTog(i, whId){ const n=invFltNames[i]; if(n===undefined) return;
  if(invFlt.secs.has(n)) invFlt.secs.delete(n); else invFlt.secs.add(n);
  invFltSheet(whId); render(true); }
function invFltClear(whId){ invFlt={kind:'all', secs:new Set()}; closeSheet(); render(true); }
function renderInvResult(m, whId, head){
  const r=invResult(whId);
  const groups=invByGroup(whId);
  const fbar = r.counted? invFltBar(whId) : '';
  m.innerHTML = head + (r.counted? `${invStatsHtml(r)}${fbar}
    ${groups.length? groups.map(invGroupHtml).join('') : `<div class="empty">${invFltOn()? 'مفيش نتايج بالفلتر ده' : 'كل الأصناف المجرودة مطابقة ✔'}</div>`}` : `<div class="empty">لسه ماتجردش أي صنف — روح إدخال الجرد واكتب الكميات الفعلية</div>`)
    + floatBar(`<button onclick="exportInvExcel('${whId}')">📊 إكسل</button><button onclick="exportInvPdf('${whId}')">📄 PDF</button><button onclick="exportInvImage('${whId}')">🖼️ صورة</button>`);
}
function invDocBody(whId){
  const w=warehouses.find(x=>x.id===whId), inv=invGet(whId), r=invResult(whId), groups=invByGroup(whId);
  const tr=(x,neg)=>`<tr class="z"><td>${esc(x.name)}</td><td>${fmtN(x.prog)}</td><td>${fmtN(x.act)}</td><td class="${neg?'neg':'pos'}">${neg?'-':'+'}${fmtN(Math.abs(x.diff))}</td></tr>`;
  const grp=g=>`<div class="dxgrp"><h3>${esc(invGroupTitle(g))}</h3><table><tr><th>الصنف</th><th>الرصيد (برنامج)</th><th>الجرد الفعلي</th><th>الفرق</th></tr>
    ${g.def.map(x=>tr(x,true)).join('')}${g.exc.map(x=>tr(x,false)).join('')}</table></div>`;
  return `<div class="dx"><h2>نتيجة جرد مخزن ${esc(w.name)}</h2><div class="sub">بتاريخ ${inv.date}${invFltOn()? ' — فلتر: '+esc(invFltText()) : ''}</div>
    <table><tr><th>الأصناف المجرودة</th><th>أصناف عجز</th><th>أصناف زيادة</th><th>إجمالي العجز</th><th>إجمالي الزيادة</th><th>نسبة المطابقة</th></tr>
    <tr class="z"><td>${fmtN(r.counted)}</td><td class="neg">${fmtN(r.def.length)}</td><td class="pos">${fmtN(r.exc.length)}</td><td class="neg">${fmtN(r.defTotal)}</td><td class="pos">${fmtN(r.excTotal)}</td><td><b>${Math.round(r.pct*100)}%</b></td></tr></table>
    ${groups.length? groups.map(grp).join('') : `<div style="color:#666;padding:6px">لا يوجد عجز ولا زيادة</div>`}</div>`;
}
function exportInvPdf(whId){ const w=warehouses.find(x=>x.id===whId); if(!invResult(whId).counted){ toast('لا يوجد جرد'); return; } exportDocPdf(invDocBody(whId),'نتيجة_جرد_'+w.name+'_'+invGet(whId).date,false); }
function exportInvImage(whId){ const w=warehouses.find(x=>x.id===whId); if(!invResult(whId).counted){ toast('لا يوجد جرد'); return; } exportDocImage(invDocBody(whId),'نتيجة_جرد_'+w.name+'_'+invGet(whId).date,false); }
function exportInvExcel(whId){
  const w=warehouses.find(x=>x.id===whId), inv=invGet(whId), r=invResult(whId); if(!r.counted){ toast('لا يوجد جرد'); return; }
  // عمود الفرق: 'auto' يعني اللون من إشارة الرقم — عجز أحمر وزيادة خضرا
  const data=[['المجموعة','الصنف','الرصيد (برنامج)','الجرد الفعلي','الفرق'],
    ['إجمالي: '+r.counted+' صنف مجرود · عجز '+r.def.length+' · زيادة '+r.exc.length
      +' · مطابقة '+Math.round(r.pct*100)+'%','','','',''],
    ...invByGroup(whId).flatMap(g=>[
      [invGroupTitle(g),'','','',''],
      ...g.def.map(x=>[x.mg,x.name,x.prog,x.act,-Math.abs(x.diff)]),
      ...g.exc.map(x=>[x.mg,x.name,x.prog,x.act,Math.abs(x.diff)])])];
  saveAoaXlsx(data, 'نتيجة الجرد', 'نتيجة_جرد_'+w.name+'_'+inv.date+'.xlsx',
    [24,44,16,14,12], {title:'نتيجة جرد مخزن '+w.name+' بتاريخ '+inv.date,
                       sign:['','','','','auto']});
}

/* ═══════════════ الربط مع برنامج الطلبات (الموزعين) ═══════════════
   اتجاهين:
     ⬆️ بنبعت رصيد طنطا هناك فيتمسح رصيدهم القديم ويتحط الجديد.
     ⬇️ بنجيب الطلبات اللي الموزعين عملوها عشان تشوفها هنا وتخصمها من الرصيد.
   كل اتجاه له رقم سري مختلف عندهم: الرفع برقم «الإدارة» (manageLogin)،
   وقراءة الطلبات برقم «الأدمن» (adminLogin). التوكن بينتهي بعد ١٢ ساعة
   فبنسجّل دخول لحظي قبل كل عملية بدل ما نخزّن توكن بايظ.
   الأرقام السرية بتتخزّن على الجهاز بس — عمدًا مش بتتزامن. */
const ORD_URL = 'https://script.google.com/macros/s/AKfycbwRMd_ZIrXC_UQL1zc_YM8gV3zCfB9nWx8kehDN6QzYBW1OnrhDLdoWx42WWiNWVnEX/exec';
const ORD_STORE = 'طنطا';                 // برنامج الموزعين بيشتغل على رصيد طنطا
function ordWh(){ return warehouses.find(w=> String(w.name||'').trim() === ORD_STORE) || null; }
function ordPin(kind){ try{ return localStorage.getItem('_ordPin_' + kind) || ''; }catch(e){ return ''; } }
function ordSetPin(kind, v){ try{ v ? localStorage.setItem('_ordPin_'+kind, v) : localStorage.removeItem('_ordPin_'+kind); }catch(e){} }

// بصمة الاسم: من غير مسافات ولا رموز ولا تشكيل — عشان «باب 80 سم» = «باب ٨٠سم»
function ordNorm(n){
  return String(n||'').trim().toLowerCase()
    .replace(/[٠-٩]/g, d=> '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/[\s\-_.،,/\\()]+/g,'');
}
function ordTheirName(our){
  const k = ordNorm(our);
  return Object.prototype.hasOwnProperty.call(ordMap, k) ? ordMap[k] : undefined;
}
async function ordApi(path){
  const r = await fetch(ORD_URL + path);
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function ordLogin(kind, pin){
  const act = kind === 'admin' ? 'adminLogin' : 'manageLogin';
  const d = await ordApi('?action=' + act + '&pin=' + encodeURIComponent(pin));
  if(d && d.ok && d.token) return d.token;
  const why = d && d.reason;
  throw new Error(
    why === 'wrong_pin' ? 'الرقم السري غلط.'
    : why === 'locked' ? 'برنامج الطلبات قفل المحاولات مؤقتًا بعد محاولات غلط كتير — استنى شوية.'
    : why === 'not_configured' ? 'برنامج الطلبات لسه ما اتظبطش عليه رقم سري.'
    : 'الدخول لبرنامج الطلبات مانجحش.');
}
// أصناف برنامج الطلبات (نداء عام من غير رقم سري)
let ordCat = null;
async function ordFetchCatalog(){
  const d = await ordApi('?action=catalog');
  ordCat = ((d && d.items) || []).map(x=> String(x.name||'').trim()).filter(Boolean);
  return ordCat;
}
// حالة المطابقة بين أسمائنا وأسماءهم
function ordMatch(){
  const wh = ordWh(); if(!wh) return {ok:[],auto:[],none:[],skip:[]};
  const names = Object.keys(whStock[wh.id] || {});
  const exact = new Set(ordCat || []), fp = new Map();
  (ordCat || []).forEach(n=>{ const f = ordNorm(n); if(f && !fp.has(f)) fp.set(f, n); });
  const out = {ok:[], auto:[], none:[], skip:[]};
  names.forEach(our=>{
    const saved = ordTheirName(our);
    if(saved === '') return out.skip.push(our);
    if(saved) return exact.has(saved) ? out.ok.push(our) : out.none.push(our);
    if(exact.has(our)) return out.ok.push(our);
    const g = fp.get(ordNorm(our));
    if(g) return out.auto.push({our, their:g});
    out.none.push(our);
  });
  return out;
}
// الصفوف اللي هتتبعت — باسمهم، ومن غير المتجاهَل
function ordRows(){
  const wh = ordWh(); if(!wh) return [];
  const st = whStock[wh.id] || {};
  const rows = [];
  Object.keys(st).forEach(n=>{
    const t = ordTheirName(n);
    if(t === '') return;
    rows.push({name: t || n, stock: nz(st[n] && st[n].balance)});
  });
  return rows;
}

let ordOrders = null;        // آخر طلبات اتجابت
function ordMsg(html){ const el = $('#ordMsg'); if(el) el.innerHTML = html; }

async function ordSendStock(){
  const pin = ($('#ord_mpin') && $('#ord_mpin').value || '').trim();
  const rows = ordRows();
  if(!rows.length) return ordMsg('<b style="color:var(--danger)">مفيش رصيد مرفوع لطنطا.</b>');
  if(!pin) return ordMsg('<b style="color:var(--danger)">اكتب رقم «شاشة الإدارة» بتاع برنامج الطلبات.</b>');
  if(!confirm('هيتمسح الرصيد اللي في برنامج الطلبات كله، وبعدين يتحط رصيد ' + rows.length + ' صنف من «طنطا». أي صنف هناك مش في رصيد طنطا هيبقى صفر. تكمل؟')) return;
  ordSetPin('manage', pin);
  ordMsg('بيسجّل دخول...');
  try{
    const tk = await ordLogin('manage', pin);
    // المسح: نجيب أصناف برنامج الطلبات دلوقتي، وأي صنف عندهم مش في اللي هنبعته نبعته بصفر.
    // لو النداء فشل نوقف — أحسن من إننا نبعت من غير ما نمسح.
    ordMsg('بيجيب أصناف برنامج الطلبات...');
    const cat = await ordFetchCatalog();
    // مطابقة تلقائية بالبصمة: «باب 80 سم» عندنا = «باب ٨٠سم» عندهم — من غيرها الصنف كان هيتصفّر ومايتحدّثش
    const exact = new Set(cat), fp = new Map();
    cat.forEach(n=>{ const f = ordNorm(n); if(f && !fp.has(f)) fp.set(f, n); });
    rows.forEach(r=>{ if(!exact.has(r.name)){ const g = fp.get(ordNorm(r.name)); if(g) r.name = g; } });
    // لو صنفين عندنا وصلوا لنفس الصنف عندهم، آخر واحد بس هو اللي بيتبعت
    const byName = new Map(); rows.forEach(r=> byName.set(r.name, r));
    const sendRows = Array.from(byName.values());
    // الأصناف اللي اتعملها «تجاهل» ما بنلمسهاش — لا بنبعتها ولا بنصفّرها
    const wh = ordWh(), keep = new Set();
    Object.keys((wh && whStock[wh.id]) || {}).forEach(n=>{ if(ordTheirName(n) === '') keep.add(ordNorm(n)); });
    const sent = new Set(sendRows.map(r=> r.name));
    const zero = cat.filter(n=> !sent.has(n) && !keep.has(ordNorm(n))).map(n=> ({name:n, stock:0}));
    const all = sendRows.concat(zero);
    ordMsg('بيمسح الرصيد القديم ويبعت الجديد...');
    const r = await fetch(ORD_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'manageUploadCatalog', token:tk, mode:'stock', rows: all})});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if(!d || d.ok === false) throw new Error((d && d.error) || 'برنامج الطلبات رفض الطلب.');
    const nf = (d.notFound || []).filter(n=> sent.has(n));
    ordMsg('<b style="color:var(--ok)">تم: اتمسح الرصيد القديم واتحط رصيد ' + (sendRows.length - nf.length) + ' صنف'
      + (zero.length ? ' · و' + zero.length + ' صنف مش في طنطا اتصفّروا' : '') + '.</b>'
      + (nf.length ? '<div style="margin-top:6px;color:#b45309"><b>' + nf.length + ' صنف</b> مش موجودين عندهم بنفس الاسم فماتبعتوش:<br>'
          + esc(nf.slice(0,10).join('، ')) + (nf.length>10?' …':'')
          + '<br>دوس «🔍 طابق الأسماء» تحت عشان تربطهم مرة واحدة.</div>' : ''));
  }catch(e){ ordMsg('<b style="color:var(--danger)">' + esc(ordErr(e)) + '</b>'); }
}

async function ordGetOrders(){
  const pin = ($('#ord_apin') && $('#ord_apin').value || '').trim();
  if(!pin) return ordMsg('<b style="color:var(--danger)">اكتب رقم «الأدمن» بتاع برنامج الطلبات.</b>');
  ordSetPin('admin', pin);
  ordMsg('بيسجّل دخول...');
  try{
    const tk = await ordLogin('admin', pin);
    ordMsg('بيجيب الطلبات...');
    const d = await ordApi('?action=lookup&token=' + encodeURIComponent(tk));
    ordOrders = Array.isArray(d) ? d : [];
    ordMsg('');
    render(true);
  }catch(e){ ordMsg('<b style="color:var(--danger)">' + esc(ordErr(e)) + '</b>'); }
}
function ordErr(e){
  const m = (e && e.message) || '';
  return /^HTTP|Failed to fetch|NetworkError|Load failed/.test(m)
    ? 'مفيش اتصال ببرنامج الطلبات دلوقتي — جرّب تاني.' : m;
}
// مجموع الكميات المطلوبة لكل صنف (باسمنا إحنا)
function ordDemand(onlyOpen){
  const theirToOurs = {};
  Object.keys(ordMap).forEach(k=>{ if(ordMap[k]) theirToOurs[ordMap[k]] = k; });
  const wh = ordWh(); const st = (wh && whStock[wh.id]) || {};
  const byNorm = {}; Object.keys(st).forEach(n=> byNorm[ordNorm(n)] = n);
  const out = {};
  (ordOrders || []).forEach(o=>{
    if(onlyOpen && /تم تنفيذ/.test(o.status || '')) return;
    (o.items || []).forEach(it=>{
      const their = String(it.name || it.product || '').trim();
      if(!their) return;
      const ourKey = theirToOurs[their] || ordNorm(their);
      const our = byNorm[ourKey] || their;
      out[our] = (out[our] || 0) + (Number(it.qty || it.quantity) || 0);
    });
  });
  return out;
}
function ordDeductStock(){
  const wh = ordWh(); if(!wh) return;
  const dem = ordDemand(true);
  const names = Object.keys(dem).filter(n=> dem[n] > 0);
  if(!names.length) return toast('مفيش طلبات مفتوحة تتخصم');
  if(!confirm('هيتخصم من رصيد طنطا هنا:\n' + names.slice(0,10).map(n=> '• ' + n + ' ← ' + dem[n]).join('\n')
    + (names.length>10 ? '\n…و' + (names.length-10) + ' غيرهم' : '')
    + '\n\nده بيغيّر الرصيد عندك في التطبيق ده بس. تكمل؟')) return;
  whStock[wh.id] = whStock[wh.id] || {};
  names.forEach(n=>{
    const cur = whStock[wh.id][n] || {balance:0};
    cur.balance = nz(cur.balance) - dem[n];
    whStock[wh.id][n] = cur;
  });
  save('whStock_v1', whStock);
  toast('اتخصم ' + names.length + ' صنف من رصيد طنطا');
  render(true);
}
async function ordAutoMatch(){
  ordMsg('بيجيب أصناف برنامج الطلبات...');
  try{
    if(!ordCat) await ordFetchCatalog();
    const m = ordMatch();
    m.auto.forEach(x=>{ ordMap[ordNorm(x.our)] = x.their; });
    save('ordMap_v1', ordMap);
    ordMsg('<b style="color:var(--ok)">اتربط ' + m.auto.length + ' صنف تلقائي.</b>');
    render(true);
  }catch(e){ ordMsg('<b style="color:var(--danger)">' + esc(ordErr(e)) + '</b>'); }
}
function ordSetName(our, their){
  const k = ordNorm(our);
  if(their) ordMap[k] = their; else delete ordMap[k];
  save('ordMap_v1', ordMap); render(true);
}
function ordSkip(our){
  const k = ordNorm(our);
  if(ordMap[k] === '') delete ordMap[k]; else ordMap[k] = '';
  save('ordMap_v1', ordMap); render(true);
}

function renderWhDetail(m, whId){
  const w = warehouses.find(x=>x.id===whId);
  if(!w){ m.innerHTML=`<div class="empty">المخزن غير موجود</div>`; return; }
  const sub = load('_whSub_',null);
  const b=(n,t)=>`<button class="stab${sub===n?' on':''}" style="flex:1 1 0;padding:10px 6px" onclick="setWhSub(${n})">${t}</button>`;
  // تعديل/حذف المخزن — الدوال كانت موجودة من غير أي زرار يوصّلها
  const isOrd = String(w.name||'').trim() === ORD_STORE;
  m.innerHTML = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <b style="flex:1;font-size:14px">🏭 ${esc(w.name)}${w.location?` <span style="color:var(--muted);font-weight:400;font-size:12px">— ${esc(w.location)}</span>`:''}</b>
      <button onclick="editWarehouse('${w.id}')" title="تعديل المخزن" style="padding:5px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--border);color:var(--text);cursor:pointer">✏️</button>
      <button onclick="delWarehouse('${w.id}')" title="حذف المخزن" style="padding:5px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--border);color:var(--danger);cursor:pointer">🗑</button>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:10px">${b(0,'📊 الأرصدة')}${b(1,'🧾 طلب النواقص')}${b(2,'📝 الجرد')}${isOrd?b(3,'🚚 الموزعين'):''}</div><div id="wh_sub"></div>`;
  const box=$('#wh_sub');
  if(sub===null) box.innerHTML=`<div class="empty">اضغط على قسم فوق</div>`;
  else if(sub===0) renderWhStock(box, whId);
  else if(sub===1) renderWhShortage(box, whId);
  else if(sub===2) renderWhInventory(box, whId);
  else if(sub===3 && isOrd) renderWhOrders(box);
  else box.innerHTML = `<div class="empty">اضغط على قسم فوق</div>`;
}

// ===================== قوائم منسدلة متعددة الاختيار =====================
const DDREG={}; let ddOpen=new Set();
function ddToggle(id,open,el){
  if(open){ ddOpen.add(id); document.querySelectorAll('.dd details').forEach(d=>{ if(d!==el && d.open) d.open=false; }); }
  else ddOpen.delete(id);
}
function ddPick(id,val){ const d=DDREG[id]; if(!d) return; if(d.sel.has(val)) d.sel.delete(val); else d.sel.add(val); if(d.after) d.after(); render(); }
function ddAll(id){ const d=DDREG[id]; if(!d) return; d.options.forEach(o=>d.sel.add(o)); if(d.after) d.after(); render(); }
function ddClear(id){ const d=DDREG[id]; if(!d) return; d.sel.clear(); if(d.after) d.after(); render(); }
function msDD(id,label,options,sel,side,after){
  DDREG[id]={sel,options,after};
  const arr=[...sel];

// ===================== أدوات مشتركة للجداول =====================
/* رقم من أي خانة: شيتات المحاسبة ساعات بتطلع الرقم نص «12,345.50» أو
   بأرقام عربية «١٢٣» أو السالب بين قوسين «(500)». Number() كان بيرجّعها
   صفر، و parseFloat كان بيقف عند الفاصلة فـ«12,345» تبقى 12. */
function nz(x){
  if(typeof x === 'number') return isFinite(x) ? x : 0;
  if(x === null || x === undefined || x === '') return 0;
  let s = String(x).trim()
    .replace(/[٠-٩]/g, d=> d.charCodeAt(0)-1632).replace(/[۰-۹]/g, d=> d.charCodeAt(0)-1776)
    .replace(/٫/g, '.').replace(/[,٬\s ]/g, '');
  let neg = false;
  if(/^\(.*\)$/.test(s)){ neg = true; s = s.slice(1,-1); }
  if(/^[\d.]+-$/.test(s)){ neg = true; s = s.slice(0,-1); }
  const n = Number(s);
  return isFinite(n) ? (neg ? -n : n) : 0;
}
const rnd2=x=>Math.round((x+1e-9)*100)/100;
const rnd0=x=>Math.round(x+1e-9);
const mr5=x=>Math.round(x/5+1e-9)*5;
const fmt1=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:1});
const fmt2=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
/* إشارة الخانة: رقم بالسالب/الموجب، أو نص زي «+12%» و«عجز» */
function signOf(c){
  if(typeof c === 'number') return c<0 ? 'minus' : (c>0 ? 'plus' : '');
  const t = String(c||'');
  if(/^-/.test(t) || /عجز/.test(t)) return 'minus';
  if(/^\+/.test(t) || /زياد/.test(t)) return 'plus';
  return '';
}
/* عمود الاسم كان بيتعصر على ٣ سطور والأرقام واخدة المساحة كلها.
   دلوقتي عمود الاسم ليه عرض أدنى مريح، وعمود «م» على قده. */
const DOC_NAME_COL=/^(اسم الصنف|الصنف|الموظف|العميل|الموزع|بيان|البيان|الحساب|المجموعة)$/;
function docColClass(h){ return h==='م' ? 'ix' : (DOC_NAME_COL.test(String(h||'').trim()) ? 'nm' : ''); }
function docTableHtml(model, extraCss){

  return `<table><tr>${model.header.map((h,i)=>`<th class="${cc[i]}">${esc(h)}</th>`).join('')}</tr>`+
    model.body.map((r,bi)=> r.type==='branch'
      ? `<tr class="m"><td colspan="${n}">◆ ${esc(r.label)}</td></tr>`
      : `<tr class="${cls[r.type]}">${r.cells.map((c,i)=>{
          const dir = ((model.arrows||[])[bi]||[])[i];
          const arw = dir ? `<span style="color:${dir==='up'?'#0a7d3c':'#c0202f'};font-size:.8em;margin-inline-end:4px">${dir==='up'?'▲':'▼'}</span>` : '';
          const sg = (model.sign||[])[i]==='auto' ? signOf(c) : '';
          const e = r.type==='row' ? (model.hiLo||{})[i] : null;
          const hl = (e && typeof c==='number' && c!==0) ? (c===e.mx?'hi':(c===e.mn?'lo':'')) : '';
          return `<td class="${[cc[i],sg,hl].filter(Boolean).join(' ')}">${arw}${typeof c==='number'?fmt2(c):esc(c)}</td>`;
        }).join('')}</tr>`).join('')+`</table>`;
}
/* الكشف اللي بيتبعت: كل عمود ليه دوره — الراتب والصافي بخلفية خضرا،
   والخانات اللي بتتكتب (غياب/تأخير/إضافي/سلف/تأمينات/حوافز) بخلفية كريمي،
   والرقم اللي مش فاضي بيتكتب أزرق غامق عشان يبان وسط الخانات الفاضية. */
const PAY_MONEY_COL = /راتب النصف|صافي/;
const PAY_INPUT_COL = /غياب|تأخير|إضافي|اضافي|جزاء|سلف|تأمين|حواف/;
const PAY_MINUS_COL = /غياب|تأخير|جزاء|سلف|تأمين|خصم/;      // أحمر
const PAY_PLUS_COL  = /إضافي|اضافي|حواف|بونص|مكاف/;          // أخضر
function payTableHtml(model){

  // الساعات والأيام بخانتين عشريتين زي الورقة، والفلوس بفواصل الآلاف
  const isTime = H.map(h=> /\(ساعات\)|\(أيام\)/.test(h));
  const cc = H.map(docColClass);   // «م» على قده والاسم عرض مريح، زي باقي التقارير
  const num = (v, i)=> isTime[i] ? Number(v).toFixed(2) : fmtN(Math.round(Number(v)));
  const cell = (c, i)=>{
    const empty = c === '' || c === 0 || c === null || c === undefined;
    const cls = [cc[i], empty ? '' : kind[i]];
    const txt = typeof c === 'number' ? (empty ? '' : num(c, i)) : esc(c);

  return `<table class="pay"><tr>${H.map((h,i)=>`<th class="${cc[i]}">${esc(h)}</th>`).join('')}</tr>`

        r.type==='tot' ? `<td class="${cc[i]}">${typeof c==='number'? (c? num(c,i) : '') : esc(c)}</td>` : cell(c,i)
      ).join('')}</tr>`).join('') + `</table>`;
}
function modelToAoa(model, noTitle){
