.grp-no.nn{background:var(--surface-2);border-color:var(--line);color:#5B6B82}
.grp-dt{color:#5B6B82}
.grp-dy{color:#8A5A0B}
.grp-note{background:var(--warn-bg);border-color:var(--warn-line);
  border-inline-start-color:#D9A441;color:#8A5A0B}
.grp-chev{color:var(--muted)}
.grp-hd b{color:var(--ink)!important}

/* ---------- التوست واللودر والمعاينة ---------- */
#toast{background:var(--navy);color:#fff;border-color:transparent;box-shadow:var(--e3)}
#busy{background:rgba(15,39,64,.28)}
#busy .b{background:#fff}
.rpv{background:rgba(15,39,64,.55)}
.rpv-bar{background:#fff;color:var(--ink);border-bottom:1px solid var(--line)}
.rpv-pdf{background:linear-gradient(180deg,var(--brand-lt),var(--brand));color:#fff}

/* ---------- الكلام الباهت: تباين مظبوط على الفاتح ---------- */
:root{--muted:#5B6B82;--warn-ink:#8A5A0B;--info-ink:#1466A8;--ok-ink:#0E6B4D;--danger-ink:#A82D25}
.top .t2{color:#5B6B82}
.specol .sol-h,.miniLbl,.prow3 .tcell b,label.fld span{color:#4A5C74}
.line .info2 .spec,.ord .od,.ord .os,.note,.empty,.total .lbl{color:#5B6B82}

/* ============================================================
   v200 — «خفيف ودقيق» (شكل ٢٠٢٧)
   ------------------------------------------------------------
   تطوير هادي فوق الشكل النظيف (v197): خطوط الأيقونات أرفع وأدق، زوايا
   أنعم، ومساحات أوسع. مفيش أي خطوة ولا زرار اتغيّر — المقاسات بس.

   اللي اتغيّر بالأرقام:
     • سُمك خط الأيقونة من ١.٧٥ لـ١.٥ على شبكة ٢٤ (ده اللي ماشي في
       أيقونات ٢٠٢٦–٢٠٢٧: خط واحد رفيع ودقيق يفضل مقروء وهو صغير).
     • الزوايا كبرت درجة: الكارت ١٨→٢٢، والشرايح والخانات معاها.
     • الكارت والشاشة خدوا مساحة زيادة تتنفّس فيها.
     • الحدود بقت أخف شوية عشان الخط الرفيع ما يتوهش وسط إطار تقيل.
   ============================================================ */
:root{
  --r:20px;
  --r-sm:12px;
  --r-md:16px;
  --r-lg:22px;
  --line:#EDF1F6;
}

/* ---------- الأيقونات ---------- */
.i{stroke-width:1.5}
.i.lg{stroke-width:1.45}
.i.xl{stroke-width:1.4}
.tabs button .i{stroke-width:1.55}
.step .n .i{stroke-width:1.7}
/* الأيقونة اللي جوّه زرار ملوّن محتاجة شعرة زيادة عشان ما تبهتش على اللون */
.btn.brand .i,.btn.primary .i,.bar .btn .i{stroke-width:1.65}

/* ---------- مساحة تتنفّس فيها ---------- */
.wrap{padding:18px 16px}
.card{padding:18px}
.card,.ord{border-radius:var(--r-lg)}
.step{margin-bottom:14px}
.chips{gap:8px}
.miniChips{gap:7px}
.chip,.miniChip{border-radius:var(--r-pill)}
.sizeCard,.doorpanel,.rodbox,.accgrid .ac{border-radius:var(--r-md)}
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=date],input[type=search],select,textarea,.fld textarea{border-radius:var(--r-sm)}
.btn{border-radius:var(--r-sm)}
.line{padding-block:13px}
.line img,.line .ic{border-radius:var(--r-sm)}
.door .leaf{border-radius:var(--r-md)}

/* ---------- حدود أخف تحت الخط الرفيع ---------- */
.card,.ord,.sizeCard,.rodbox,.accgrid .ac{border-width:1px}
.chip,.miniChip{border-width:1px}
.chip.on,.miniChip.on{border-width:1px}

/* ---------- التبويبات: أهدى شوية ---------- */
.tabs button .i{width:22px;height:22px}
.secnav button .i{width:23px;height:23px}

/* ---------- ترتيب الشرايح: شبكة منتظمة بدل صفوف مبعثرة ----------
   ⚠️ الشكوى: الشرايح واخدة عرض كبير، اتنين في الصف، والآخر لوحده —
   والشاشة بتضيع في الفاضي. ١١ لون كانوا ٦ صفوف.
   السبب إن الشرايح كانت بتتلفّ حسب عرض النص (flex-wrap)، فطول النص
   العربي المختلف بيسيب فراغات متفاوتة وصف آخر ناقص.
   الحل: شبكة أعمدتها متساوية بتتحسب من عرض الشاشة — كل الشرايح بنفس
   العرض، الصفوف متساوية، ومفيش فراغ ضايع. */
.chips{
  display:grid;
  /* ٩٢ بكسل = أضيق عرض يخلّي ٣ أعمدة تدخل على تليفون ٣٦٠ بكسل (أصغر شاشة
     عملية: عرض الصف الفعلي هناك ٢٩٠ بكسل، و٣×٨٨+١٦ = ٢٨٠ بتدخل)، ويفضل ٣
     أعمدة على ٤١٢ كمان. أطول اسم («A013 — أرو فاتح» ١٠٤ بكسل) بينزل سطرين
     على الضيق بس — وده أحسن من إننا نضيّع صف كامل. */
  grid-template-columns:repeat(auto-fill,minmax(88px,1fr));
  gap:8px;align-items:stretch;
}
.chip{
  padding:9px 6px;               /* العرض بقى من الشبكة، فالحشو الجانبي مالوش لازمة */
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:44px;line-height:1.35;
  overflow-wrap:break-word;      /* يكسر عند المسافة، مش في نص الكلمة */
}
/* صف أزرار الحالة في شاشة المصنع لازم يفضل سطر واحد */
.chips-line{display:flex;flex-wrap:nowrap}
.chips-line .chip{padding:9px 10px}

/* أزرار الأقسام: صفوف متساوية كمان (كانت ٣ وبعدين ٢ متمدّدين) */
.secnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.secnav button{flex:none;min-width:0;max-width:none}

/* ============================================================
   v202 — «زجاج وعُمق» (الشكل ٢)
   ------------------------------------------------------------
   الشكل ١ كان مقصود إنه هادي — خط الأيقونة من ١.٧٥ لـ١.٥ مابيبانش.
   ده الشكل التاني من الاقتراحات: أسطح شبه شفافة فوق خلفية فيها
   تدرّجات لون خفيفة، ظلال ناعمة ملوّنة، وأزرار ليها عمق.

   مفيش أي خطوة ولا زرار اتغيّر — السطح واللون بس.

   ⚠️ backdrop-filter مش مدعوم على كل الأجهزة (ولا بيشتغل وقت تصوير
   المستندات في html2canvas). كل حتة فيها زجاج ليها خلفية صلبة تحتها،
   فلو الفلتر مشتغلش السطح يفضل مقروء — مش شفاف على الفاضي.
   ============================================================ */
:root{
  --brand:#1F6FEB;
  --brand-lt:#4B93FF;
  --wood:#1F6FEB;
  --wood-lt:#4B93FF;
  --bg:#EDF2FA;
  --card:rgba(255,255,255,.72);
  --surface-2:rgba(255,255,255,.55);
  --line:rgba(255,255,255,.9);
  --ink:#0E1B2E;
  --e1:0 1px 2px rgba(14,27,46,.05);
  --e2:0 2px 8px rgba(14,27,46,.06), 0 10px 26px rgba(14,27,46,.07);
  --e3:0 10px 26px rgba(14,27,46,.12), 0 24px 54px rgba(14,27,46,.14);
}

/* خلفية فيها لمسات لون خفيفة — دي اللي بتدّي الزجاج معنى */
body{
  background:
    radial-gradient(58% 34% at 10% 0%,rgba(31,111,235,.16),transparent 62%),
    radial-gradient(52% 30% at 94% 10%,rgba(120,80,230,.13),transparent 60%),
    radial-gradient(66% 38% at 50% 100%,rgba(0,180,175,.12),transparent 62%),
    var(--bg);
  background-attachment:fixed;
}

/* ---------- الأسطح الزجاجية ---------- */
.card,.ord,.sizeCard,.doorpanel,.rodbox,.accgrid .ac{
  background:var(--card);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:var(--e2),inset 0 1px 0 rgba(255,255,255,.85);
  -webkit-backdrop-filter:blur(16px) saturate(1.6);
  backdrop-filter:blur(16px) saturate(1.6);
}
.top{
  background:rgba(255,255,255,.62);
  -webkit-backdrop-filter:blur(18px) saturate(1.7);
  backdrop-filter:blur(18px) saturate(1.7);
  box-shadow:0 1px 0 rgba(255,255,255,.75),0 6px 20px rgba(14,27,46,.05);
}
.tabs{
  background:rgba(255,255,255,.74);
  -webkit-backdrop-filter:blur(18px) saturate(1.7);
  backdrop-filter:blur(18px) saturate(1.7);
  box-shadow:0 -1px 0 rgba(255,255,255,.8),0 -6px 22px rgba(14,27,46,.06);
}
.bar{
  background:rgba(255,255,255,.80);
  -webkit-backdrop-filter:blur(18px) saturate(1.7);
  backdrop-filter:blur(18px) saturate(1.7);
  box-shadow:0 -6px 24px rgba(14,27,46,.10);
}

/* ---------- الشرايح والخانات ---------- */
.chip,.miniChip,.specol .colchip,.qty,.hgtIn,.stkin,
input[type=text],input[type=tel],input[type=number],input[type=password],
input[type=date],input[type=search],select,textarea,.fld textarea,.prow3 input{
  background:rgba(255,255,255,.66);
  border-color:rgba(255,255,255,.95);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 1px 2px rgba(14,27,46,.04);
}
.chip.on,.miniChip.on,.specol .colchip.on{
  background:linear-gradient(135deg,var(--brand-lt),#1050C8);
  border-color:transparent;color:#fff;
  box-shadow:0 3px 12px rgba(31,111,235,.30),inset 0 1px 0 rgba(255,255,255,.3);
}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px rgba(31,111,235,.16)}

/* ---------- الأزرار: عمق حقيقي ---------- */
.btn.brand,.bar .btn.brand,.step .n{
  background:linear-gradient(135deg,var(--brand-lt),#1050C8);color:#fff;
  box-shadow:0 4px 14px rgba(31,111,235,.30),inset 0 1px 0 rgba(255,255,255,.32);
}
.btn.wood{background:linear-gradient(135deg,var(--brand-lt),#1050C8);color:#fff;
  box-shadow:0 4px 14px rgba(31,111,235,.28),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.primary{background:linear-gradient(135deg,#17233A,#0B1424);color:#fff;
  box-shadow:0 4px 14px rgba(14,27,46,.26),inset 0 1px 0 rgba(255,255,255,.14)}
.btn.ghost{background:rgba(255,255,255,.66);border-color:rgba(255,255,255,.95);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.secnav button{background:rgba(255,255,255,.62);border-color:rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.secnav button.on{background:rgba(31,111,235,.10);border-color:var(--brand);
  box-shadow:0 0 0 1.5px var(--brand),0 4px 14px rgba(31,111,235,.16)}

/* ---------- الأبواب ---------- */
.door .leaf{background:rgba(255,255,255,.7);border-color:rgba(255,255,255,.95);
  box-shadow:var(--e2),inset 0 1px 0 rgba(255,255,255,.8)}
.door.on .leaf{border-color:var(--brand);box-shadow:0 6px 20px rgba(31,111,235,.26)}

/* ---------- الأيقونات: تبان أوضح على الزجاج ---------- */
.i{stroke-width:1.65}
.i.lg{stroke-width:1.6}
.tabs button .i{stroke-width:1.7}
.tabs button.on .i{filter:drop-shadow(0 2px 6px rgba(31,111,235,.35))}

/* ---------- أجهزة مش قادرة على الزجاج: سطح صلب مقروء ---------- */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .card,.ord,.sizeCard,.doorpanel,.rodbox,.accgrid .ac{background:#fff}
  .top,.tabs,.bar{background:#fff}
  .secnav button{background:#fff}
  .chip,.miniChip,.specol .colchip,.qty,.hgtIn,.stkin,
  input[type=text],input[type=tel],input[type=number],input[type=password],
  input[type=date],input[type=search],select,textarea,.fld textarea,.prow3 input{background:#fff}
  .door .leaf{background:#fff}
}


/* ============================================================
   v203 — «الشكل المدموج»: التلات اقتراحات في واحد
   ------------------------------------------------------------
   الشكل ١ كان نظيف بس مابيبانش. الشكل ٢ (الزجاج) بان بس السطح
   بس هو اللي اتغيّر. الشكل ٣ كان جسور في اللون والهوية.
   ده التلاتة مدموجين:

     • من ١: أبيض فاتح، أزرق واحد، مسافات مرتاحة، قراءة واضحة
             في نور الورشة (الأساس فاضل هو هو).
     • من ٢: أسطح زجاجية وظلال ملوّنة وأزرار ليها عمق (فاضلة).
     • من ٣: هوية جسورة — هيدر بتدرّج لون العلامة، تبويب سفلي
             بحبّة (pill) ملوّنة بدل خط تحتاني، وشريط لون على
             عنوان كل كارت، وأرقام أتقل.

   مفيش أي خطوة ولا زرار ولا مسار اتغيّر — الشكل بس.

   ⚠️ الهيدر بقى غامق، فكل حاجة جواه (العنوان، شريحة المخزن،
   زراير النسخة) متظبّطة هنا لوحدها — التوكنز مش بتوصلها.
   ============================================================ */

/* ---------- ١) الهيدر: هوية العلامة ---------- */
.top{
  background-color:#1668B8;
  background-image:linear-gradient(135deg,#2E7FF0 0%,var(--brand) 48%,#0B4FA8 100%);
  color:#fff;
  box-shadow:0 2px 14px rgba(11,79,168,.28);
  -webkit-backdrop-filter:none;backdrop-filter:none;
}
#appbar::after{height:0}
.top .t1{color:#fff;letter-spacing:.2px}
.top .t2{color:rgba(255,255,255,.82)}
.top .t2 .vs-ver{background:rgba(255,255,255,.18);color:#fff}
.top img.logo{border-color:rgba(255,255,255,.55);box-shadow:0 2px 10px rgba(4,32,72,.25)}
.wh-chip{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.34);color:rgba(255,255,255,.88)}
.wh-chip b{color:#fff}
.verstrip button{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.34);color:#fff}
.verstrip button.vs-install{
  background:#fff;border-color:transparent;color:#0B4FA8;
  box-shadow:0 2px 10px rgba(4,32,72,.22);
}

/* ---------- ٢) التبويب السفلي: حبّة ملوّنة ---------- */
.tabs button{border-bottom:0;border-radius:14px}
/* ⚠️ من غير margin رأسي — ارتفاع الشريط مربوط بـ--navh والشريط السفلي
   (الإجمالي) قاعد فوقه بالحساب ده. أي زيادة هنا بتعمل تداخل. */
.tabs button::before{border-radius:14px}
.tabs button.on::before{
  background:linear-gradient(135deg,rgba(46,127,240,.16),rgba(11,79,168,.10));
  box-shadow:inset 0 0 0 1.5px rgba(46,127,240,.42);
}
.tabs button.on{color:var(--brand);font-weight:800}
.tabs button.on .i{color:var(--brand)}

/* ---------- ٣) شريط لون على عنوان الكارت ---------- */
.card{position:relative;overflow:hidden}
.card>.step:first-child::after,
.card>h3:first-child::after{content:none}
.step .n{
  background:linear-gradient(135deg,#2E7FF0,#0B4FA8);
  box-shadow:0 3px 10px rgba(46,127,240,.32),inset 0 1px 0 rgba(255,255,255,.3);
}

/* ---------- ٤) مسافات مرتاحة (من الشكل ١) ---------- */
.wrap{padding:18px 16px 22px}
.card{padding:18px;border-radius:20px}

/* ---------- ٥) الأرقام أتقل — تتقري من بعيد ---------- */
.bar .sum b,.tot b,.ttlrow b{font-weight:800}

/* ---------- ٦) الشريط السفلي: زرار الإرسال واضح ---------- */
.bar .btn.brand{
  background:linear-gradient(135deg,#2E7FF0,#0B4FA8);
  box-shadow:0 5px 18px rgba(46,127,240,.34),inset 0 1px 0 rgba(255,255,255,.3);
  font-weight:800;
}

/* ---------- أجهزة مش قادرة على الزجاج ---------- */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .tabs{background:#fff}
}


/* ============================================================
   v207 — نايت مود / نهار مود
   ------------------------------------------------------------
   النهاري = الشكل الحالي زي ما هو. الليلي = كحلي عميق بلمسات
   زجاجية وإضاءة زرقاء وذهبي للتمييز (زي تصميم التطبيقات الجديدة).
   الاختيار بيتحفظ في localStorage (wpc_theme: light | dark) وبيتطبّق
   قبل أول رسم عشان مفيش وميض. مستندات PDF/الطباعة بيضا دايمًا.
   ============================================================ */

/* ---------- زرار التبديل (الاتنين) ---------- */
.verstrip button.vs-theme .i{width:17px;height:17px;margin:0}
.verstrip button.vs-theme .ic-sun{display:none}
html[data-theme="dark"] .verstrip button.vs-theme .ic-sun{display:block}
html[data-theme="dark"] .verstrip button.vs-theme .ic-moon{display:none}
@media (max-width:430px){ .wh-chip{padding-inline:8px} .wh-chip b{font-size:11.5px} }

/* ---------- لمسة عصرية للأيقونات في الاتنين: بلاط ملوّن ---------- */
.secnav button .i{
  width:38px;height:38px;padding:8px;border-radius:12px;margin:0 auto 6px;
  color:#fff;stroke-width:1.7;
  background:linear-gradient(135deg,#4B93FF,#1F6FEB);
  box-shadow:0 4px 12px rgba(31,111,235,.30);
}
.secnav button:nth-child(2) .i{background:linear-gradient(135deg,#F2B544,#D98A12);box-shadow:0 4px 12px rgba(217,138,18,.30)}
.secnav button:nth-child(3) .i{background:linear-gradient(135deg,#3DD6A0,#12996B);box-shadow:0 4px 12px rgba(18,153,107,.30)}
.secnav button:nth-child(4) .i{background:linear-gradient(135deg,#9B7BFF,#6A45E0);box-shadow:0 4px 12px rgba(106,69,224,.30)}
.secnav button:nth-child(5) .i{background:linear-gradient(135deg,#FF8A7A,#E2503F);box-shadow:0 4px 12px rgba(226,80,63,.28)}
.secnav button:nth-child(6) .i{background:linear-gradient(135deg,#34C9E8,#0E8FB0);box-shadow:0 4px 12px rgba(14,143,176,.28)}
.secnav button:nth-child(7) .i{background:linear-gradient(135deg,#FF8FC0,#D9468A);box-shadow:0 4px 12px rgba(217,70,138,.28)}
.secnav button.on .i{color:#fff}

/* ================== الوضع الليلي ================== */
html[data-theme="dark"]{color-scheme:dark}
html[data-theme="dark"]{
  --navy:#16233A; --navy-2:#0C1524;
  --brand:#3FA9F5; --brand-lt:#6FC1FA;
  --wood:#E3B04B; --wood-lt:#F0C872;
  --bg:#070E1C;
  --card:rgba(17,29,50,.74);
  --surface-2:rgba(24,38,64,.70);
  --ink:#E8EEF6;
  --muted:#9DB0C9;
  --line:rgba(120,165,235,.16);
  --line-soft:rgba(120,165,235,.10);
  --warn-ink:#E8C47E; --info-ink:#9BCDF3; --ok-ink:#7FD8AE; --danger-ink:#F3968F;
  --danger:#F0736A;
  --e1:0 1px 2px rgba(0,0,0,.35);
  --e2:0 2px 8px rgba(0,0,0,.32),0 12px 28px rgba(0,0,0,.34);
  --e3:0 10px 26px rgba(0,0,0,.42),0 26px 54px rgba(0,0,0,.46);
}
html[data-theme="dark"] body{
  background:
    radial-gradient(60% 34% at 12% 0%,rgba(46,127,240,.28),transparent 64%),
    radial-gradient(50% 30% at 96% 12%,rgba(120,80,230,.20),transparent 62%),
    radial-gradient(70% 40% at 50% 100%,rgba(0,170,200,.16),transparent 64%),
    #070E1C;
  background-attachment:fixed;color:var(--ink);
}
/* الأسطح الزجاجية */
html[data-theme="dark"] .card,
html[data-theme="dark"] .ord,
html[data-theme="dark"] .sizeCard,
html[data-theme="dark"] .doorpanel,
html[data-theme="dark"] .rodbox,
html[data-theme="dark"] .accgrid .ac{
  background:var(--card);
  border:1px solid rgba(120,165,235,.18);
  box-shadow:var(--e2),inset 0 1px 0 rgba(255,255,255,.06);
}
html[data-theme="dark"] .top{
  background-color:#0A1830;
  background-image:linear-gradient(135deg,#12305E 0%,#0C2145 52%,#081530 100%);
  box-shadow:0 2px 18px rgba(0,0,0,.5),0 1px 0 rgba(111,193,250,.18);
}
html[data-theme="dark"] .tabs{
  background:rgba(9,17,33,.86);
  box-shadow:0 -1px 0 rgba(120,165,235,.16),0 -8px 26px rgba(0,0,0,.45);
}
html[data-theme="dark"] .tabs button{color:var(--muted)}
html[data-theme="dark"] .tabs button.on{color:var(--brand-lt)}
html[data-theme="dark"] .tabs button.on .i{color:var(--brand-lt);filter:drop-shadow(0 2px 8px rgba(63,169,245,.55))}
html[data-theme="dark"] .tabs button.on::before{
  background:linear-gradient(135deg,rgba(63,169,245,.20),rgba(31,111,235,.10));
  box-shadow:inset 0 0 0 1.5px rgba(111,193,250,.45);
}
html[data-theme="dark"] .bar{
  background:rgba(9,17,33,.92);border-top-color:var(--line);
  box-shadow:0 -8px 28px rgba(0,0,0,.5);
}
html[data-theme="dark"] .top img.logo{background:#fff}
html[data-theme="dark"] .verstrip button.vs-install{background:#E3B04B;color:#1A1203}
/* الحقول والشرايح */
html[data-theme="dark"] .chip,
html[data-theme="dark"] .miniChip,
html[data-theme="dark"] .specol .colchip,
html[data-theme="dark"] .qty,
html[data-theme="dark"] .hgtIn,
html[data-theme="dark"] .stkin,
html[data-theme="dark"] input[type=text],
html[data-theme="dark"] input[type=tel],
html[data-theme="dark"] input[type=number],
html[data-theme="dark"] input[type=password],
html[data-theme="dark"] input[type=date],
html[data-theme="dark"] input[type=search],
html[data-theme="dark"] select,
html[data-theme="dark"] textarea,
html[data-theme="dark"] .fld textarea,
html[data-theme="dark"] .prow3 input{
  background:rgba(10,20,40,.62);border-color:rgba(120,165,235,.20);color:var(--ink);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
}
html[data-theme="dark"] ::placeholder{color:#6E83A1;opacity:1}
html[data-theme="dark"] input:focus,html[data-theme="dark"] select:focus,html[data-theme="dark"] textarea:focus{
  border-color:var(--brand);box-shadow:0 0 0 3px rgba(63,169,245,.20)}
html[data-theme="dark"] input.bad{background:rgba(240,115,106,.12)}
html[data-theme="dark"] .chip.on,
html[data-theme="dark"] .miniChip.on,
html[data-theme="dark"] .specol .colchip.on{
  background:linear-gradient(135deg,#4FB4F8,#1F6FEB);border-color:transparent;color:#fff;
  box-shadow:0 3px 14px rgba(63,169,245,.34),inset 0 1px 0 rgba(255,255,255,.28);
}
html[data-theme="dark"] .chip.on .sub,html[data-theme="dark"] .specol .colchip.on .sub{color:rgba(255,255,255,.85)}
html[data-theme="dark"] .qty button:active{background:rgba(63,169,245,.18)}
/* الأزرار */
html[data-theme="dark"] .btn.brand,
html[data-theme="dark"] .bar .btn.brand,
html[data-theme="dark"] .btn.wood,
html[data-theme="dark"] .step .n{
  background:linear-gradient(135deg,#4FB4F8,#1F6FEB);color:#fff;
  box-shadow:0 5px 18px rgba(63,169,245,.32),inset 0 1px 0 rgba(255,255,255,.28);
}
html[data-theme="dark"] .step .n{background:linear-gradient(135deg,#F0C872,#D4962A);color:#2A1A02;
  box-shadow:0 4px 14px rgba(227,176,75,.32),inset 0 1px 0 rgba(255,255,255,.35)}
html[data-theme="dark"] .btn.primary{background:linear-gradient(135deg,#1E3358,#122241);color:#fff;
  border:1px solid rgba(120,165,235,.22)}
html[data-theme="dark"] .btn.ghost,
html[data-theme="dark"] .btn.act-tool{background:rgba(24,38,64,.72);border-color:var(--line);color:#CFDDF0}
html[data-theme="dark"] .btn.act-edit,html[data-theme="dark"] .btn.act-money{background:rgba(63,169,245,.12);border-color:rgba(63,169,245,.34);color:#9BCDF3}
html[data-theme="dark"] .btn.act-send{background:rgba(79,192,138,.12);border-color:rgba(79,192,138,.34);color:#7FD8AE}
html[data-theme="dark"] .btn.act-arch{background:rgba(227,176,75,.12);border-color:rgba(227,176,75,.36);color:#E8C47E}
html[data-theme="dark"] .btn.act-del{background:rgba(240,115,106,.12);border-color:rgba(240,115,106,.36);color:#F3968F}
html[data-theme="dark"] .btn.act-report{background:rgba(155,123,255,.13);border-color:rgba(155,123,255,.36);color:#C3B1FF}
/* الأقسام والأبواب */
html[data-theme="dark"] .secnav button{background:var(--card);border-color:rgba(120,165,235,.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
html[data-theme="dark"] .secnav button .tx{color:var(--muted)}
html[data-theme="dark"] .secnav button.on{background:rgba(63,169,245,.12);border-color:var(--brand);
  box-shadow:0 0 0 1.5px var(--brand),0 6px 20px rgba(63,169,245,.22)}
html[data-theme="dark"] .secnav button.on .tx{color:var(--brand-lt)}
html[data-theme="dark"] .door .leaf{background:rgba(24,38,64,.7);border-color:rgba(120,165,235,.2)}
html[data-theme="dark"] .door.on .leaf{border-color:var(--brand);box-shadow:0 6px 22px rgba(63,169,245,.30)}
html[data-theme="dark"] .line .ic{background:rgba(63,169,245,.12)}
/* حالات وملاحظات */
html[data-theme="dark"] .stockbar.ok,html[data-theme="dark"] .door .rdy,html[data-theme="dark"] .specol .colchip.instock{
  background:rgba(79,192,138,.13);border-color:rgba(79,192,138,.34);color:#7FD8AE}
html[data-theme="dark"] .stockbar.part{background:rgba(227,176,75,.12);border-color:rgba(227,176,75,.36);color:#E8C47E}
html[data-theme="dark"] .stockbar.out{background:rgba(255,255,255,.04);border-color:var(--line);color:var(--muted)}
html[data-theme="dark"] .ordnote-box,html[data-theme="dark"] .ordnote{
  background:rgba(227,176,75,.10);border-color:rgba(227,176,75,.38);color:#EBCB8A}
html[data-theme="dark"] .ordnote-ta{background:rgba(10,20,40,.7)!important;border-color:rgba(227,176,75,.38)!important;color:var(--ink)}
html[data-theme="dark"] .grp-no{background:rgba(63,169,245,.13);border-color:rgba(63,169,245,.34);color:#9BCDF3}
html[data-theme="dark"] .grp-no.nn{background:rgba(255,255,255,.06);border-color:var(--line);color:var(--muted)}
html[data-theme="dark"] .stktbl tbody tr:nth-child(even){background:rgba(255,255,255,.03)}
html[data-theme="dark"] .stkin.dirty{background:rgba(63,169,245,.14);border-color:var(--brand)}
html[data-theme="dark"] .wh-chip{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
/* نوافذ التحميل والمعاينة */
html[data-theme="dark"] #busy{background:rgba(2,6,14,.62)}
html[data-theme="dark"] #busy .b{background:#12203A;color:var(--ink);border:1px solid var(--line)}
html[data-theme="dark"] .rpv-bar{background:#0E1A30;color:var(--ink);border-bottom-color:var(--line)}
html[data-theme="dark"] #toast>*{background:#1B2B47;color:#fff}
html[data-theme="dark"] ::-webkit-scrollbar-thumb{background:rgba(120,165,235,.28)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  html[data-theme="dark"] .card,html[data-theme="dark"] .ord,html[data-theme="dark"] .sizeCard,
  html[data-theme="dark"] .doorpanel,html[data-theme="dark"] .rodbox,html[data-theme="dark"] .accgrid .ac{background:#121F36}
  html[data-theme="dark"] .tabs,html[data-theme="dark"] .bar{background:#0A1426}
}

/* هيدر أضيق: مكان لزرار الوضع من غير ما العنوان يتقطّع */
@media (max-width:430px){
  .top .verstrip button{min-width:32px;height:32px}
  .top .verstrip{gap:4px}
  .top-row{gap:6px}
  .wh-chip{font-size:0;padding:3px 7px;line-height:1.2}
  .wh-chip b{font-size:11px;display:block}
  .top img.logo{height:26px;padding:3px 5px}
  .wh-chip b{font-size:10px}
  .top .ttl{min-width:64px}
}
/* وضوح النصوص الخافتة في الليلي */
html[data-theme="dark"] .specol .sol-h,html[data-theme="dark"] .miniLbl,
html[data-theme="dark"] .prow3 .tcell b,html[data-theme="dark"] label.fld span{color:#B7C8DF}
html[data-theme="dark"] .line .info2 .spec,html[data-theme="dark"] .ord .od,html[data-theme="dark"] .ord .os,
html[data-theme="dark"] .note,html[data-theme="dark"] .empty,html[data-theme="dark"] .total .lbl,
html[data-theme="dark"] .top .t2{color:#A9BBD3}
html[data-theme="dark"] .empty .i{color:#4A6286}
/* ---------- v207: تخطيط أحدث — شريط ترحيب + كروت أقسام بوصف ---------- */
.hero{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:16px 18px;border-radius:22px;
  background:linear-gradient(135deg,#2E7FF0,#0B4FA8);color:#fff;box-shadow:0 8px 24px rgba(31,111,235,.28);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-start:-30px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}
.hero-t small{display:block;font-size:12.5px;opacity:.88;font-weight:600}
.hero-t b{display:block;font-size:18px;font-weight:800;margin-top:2px}
.hero-chip{position:relative;z-index:1;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:14px;color:#fff;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.34)}
.hero-chip .i{width:18px;height:18px}
.hero-chip span{font-size:17px;font-weight:800}
.hero-chip em{font-style:normal;font-size:11px;opacity:.9}
html[data-theme="dark"] .hero{background:linear-gradient(135deg,#12305E,#0A1B3A 70%);border:1px solid rgba(111,193,250,.22);
  box-shadow:0 10px 28px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07)}
html[data-theme="dark"] .hero-t b{background:linear-gradient(90deg,#F0C872,#E3B04B);-webkit-background-clip:text;background-clip:text;color:transparent}

/* كروت الأقسام: أيقونة جنب العنوان والوصف، عمودين */
.secnav{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.secnav button{display:grid;grid-template-columns:42px 1fr;grid-template-rows:auto auto;align-content:center;column-gap:10px;row-gap:1px;text-align:start;padding:11px 12px;min-width:0;max-width:none;flex:none;border-radius:18px}
.secnav button .i{margin:0;grid-row:1/3;grid-column:1;align-self:center;width:42px;height:42px;padding:9px}
.secnav button .tx{grid-column:2;grid-row:1;align-self:end}
.secnav button .sb{grid-column:2;grid-row:2;align-self:start}
.secnav button .tx{display:block;font-size:13.5px;font-weight:800;line-height:1.25;color:var(--ink)}
.secnav button .sb{display:block;font-size:10.5px;font-weight:600;color:var(--muted);margin-top:2px;line-height:1.3}
.secnav button>.tx,.secnav button>.sb{min-width:0}
.secnav button:last-child:nth-child(odd){grid-column:1/-1}
html[data-theme="dark"] .secnav button .tx{color:var(--ink)}
html[data-theme="dark"] .secnav button.on .tx{color:var(--brand-lt)}

/* ---------- ميعاد التسليم (شاشة المصنع) ---------- */
.grp-ord{flex-wrap:wrap}
.due{position:relative;display:inline-flex;align-items:center;gap:6px;flex:1 1 100%;min-width:0;
  padding:5px 10px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;line-height:1.4;
  border:1px solid var(--due-line,var(--line));background:var(--due-bg,transparent);color:var(--due-ink,var(--muted))}
.due .i{width:14px;height:14px;flex:none}
.due .dl{flex:1;min-width:0}
.due .de{font-weight:600;font-size:11px;opacity:.85;white-space:nowrap}
.due input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.due-overdue{--due-bg:rgba(240,115,106,.16);--due-line:rgba(240,115,106,.55);--due-ink:var(--danger-ink)}
.due-today{--due-bg:rgba(255,145,40,.28);--due-line:rgb(255,145,40);--due-ink:var(--warn-ink);box-shadow:inset 0 0 0 1px rgb(255,145,40)}
.due-soon{--due-bg:rgba(217,164,65,.16);--due-line:rgba(217,164,65,.5);--due-ink:var(--warn-ink)}
.due-later{--due-bg:rgba(79,192,138,.13);--due-line:rgba(79,192,138,.42);--due-ink:var(--ok-ink)}
.due-done{--due-bg:rgba(255,255,255,.04);--due-line:var(--line);--due-ink:var(--muted)}
.due-none{--due-bg:transparent;--due-line:var(--muted);--due-ink:var(--muted);border-style:dashed}
.due-mini{display:inline-block;margin-inline-start:5px;padding:0 7px;border-radius:20px;font-size:10.5px;font-weight:800;
  background:var(--due-bg);color:var(--due-ink);border:1px solid var(--due-line)}
.duestrip{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 0}
.duestrip button{flex:1 1 30%;min-width:0;padding:8px 6px;border-radius:10px;font-size:12px;font-weight:800;line-height:1.35;
  border:1px solid var(--due-line);background:var(--due-bg);color:var(--due-ink)}
.duestrip button b{display:block;font-size:17px}
.dueov{position:fixed;inset:0;z-index:330;background:rgba(0,10,30,.88);display:flex;align-items:flex-start;justify-content:center;
  padding:14px;overflow-y:auto;overscroll-behavior:contain}
.dueov .box{width:100%;max-width:420px;background:#FFFFFF;border:1px solid var(--line);border-radius:16px;padding:14px;margin:auto 0}
html[data-theme="dark"] .dueov .box{background:#141F32}
.dueov .rw.col{flex-wrap:wrap}
.dueov .rw.col input{flex:1 1 100%;margin-top:4px}
.dueov h3{margin:0 0 4px;font-size:16px;color:var(--ink)}
.dueov .sub{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.6}
.dueov .sec{margin-top:12px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px}
.dueov .rw{display:flex;align-items:center;gap:8px;justify-content:space-between;border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;margin-top:6px}
.dueov .rw .t{min-width:0}
.dueov .rw .t b{font-size:14px;color:var(--ink)}
.dueov .rw .t div{font-size:11.5px;color:var(--muted);margin-top:2px}
.dueov input[type=date]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;background:transparent;color:var(--ink);flex:none}

/* ---------- الصفحة الرئيسية للمصنع: كروت مؤشرات + اختصارات + كروت عملاء ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.kpi{position:relative;text-align:right;border-radius:14px;padding:11px 12px;border:1px solid var(--due-line,var(--line));
  background:var(--due-bg,transparent);color:var(--due-ink,var(--ink));cursor:pointer;min-width:0}
.kpi .kt{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;font-weight:700}
.kpi .kt .i{width:19px;height:19px;flex:none}
.kpi .kn{font-size:30px;font-weight:900;line-height:1.15;margin-top:2px}
.kpi .ks{font-size:11px;opacity:.85;margin-top:1px}
.kpi.due-none{border-style:dashed}
.toolgrid{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:8px!important}
.toolgrid .btn{min-height:62px;border-radius:14px!important;font-size:10.5px!important;padding:9px 3px!important;gap:5px!important}
.toolgrid .btn svg{width:21px!important;height:21px!important}
.grp-hd{align-items:center;gap:11px}
.grp-hd::before{content:attr(data-ini);flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:800;color:#fff;background:var(--av,#2E7FF0)}
.grp-bar{display:flex;height:4px;background:var(--line)}
.grp-bar i{display:block;height:100%}
.grp-bar .g{background:var(--ok-ink)}
.grp-bar .a{background:var(--warn-ink)}

/* ---------- الصفحة الرئيسية للتطبيق ---------- */
.hm-hero{background:linear-gradient(160deg,#0C447C,#185FA5);color:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(12,68,124,.25)}
.hm-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hm-top small{display:block;font-size:12px;opacity:.85}
.hm-top b{font-size:20px}
.hm-top img{height:34px;width:auto;background:#fff;border-radius:9px;padding:4px 8px}
.hm-last{margin-top:14px;background:rgba(255,255,255,.14);border-radius:14px;padding:12px;cursor:pointer}
.hm-last .r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hm-last .no{font-size:28px;font-weight:900;line-height:1.1}
.hm-last .sm{font-size:12px;opacity:.9}
.hm-steps{display:flex;gap:4px;margin-top:10px}
.hm-steps i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.3)}
.hm-steps i.on{background:#C0DD97}
.hm-sl{display:flex;justify-content:space-between;font-size:11px;margin-top:5px;opacity:.92;gap:8px}
.hm-new{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;padding:15px;border-radius:15px;
  font-size:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,#3FA9F5,#2E7FF0);box-shadow:0 6px 18px rgba(46,127,240,.35)}
.hm-new .i{width:21px;height:21px}
.hm-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.hm-t{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 4px;border-radius:15px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:12px;font-weight:700;text-align:center;position:relative}
.hm-t .ic{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--tb);color:var(--tc)}
.hm-t .ic .i{width:22px;height:22px}
.hm-t .bd{position:absolute;top:6px;inset-inline-start:8px;min-width:18px;height:18px;border-radius:9px;background:var(--danger-ink);color:#fff;font-size:11px;
  display:flex;align-items:center;justify-content:center;padding:0 5px}
.hm-h{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 8px;font-weight:800;font-size:14px;color:var(--ink)}
.hm-h button{font-size:12px;color:var(--info-ink);font-weight:700}
.hm-o{display:flex;align-items:center;gap:10px;padding:11px 13px;margin-bottom:8px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.hm-o .t{flex:1;min-width:0}
.hm-o .t b{font-size:15px;color:var(--ink)}
.hm-o .t div{font-size:12px;color:var(--muted);margin-top:2px}
.hm-o .due{flex:none;min-width:0;padding:4px 9px;font-size:11.5px}
.hm-empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;font-size:13px}

/* ---------- v210: أزرار الأقسام أصغر والصفحة أضم ---------- */
.secnav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.secnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;padding:7px 4px;border-radius:14px;min-width:0;flex:none}
.secnav button .i{width:28px;height:28px;padding:6px;border-radius:9px;margin:0;grid-row:auto;grid-column:auto;box-shadow:0 2px 6px rgba(31,111,235,.22)}
.secnav button .tx{display:block;font-size:11.5px;font-weight:800;line-height:1.2;grid-column:auto;grid-row:auto}
.secnav button .sb{display:none}
.secnav button:last-child:nth-child(odd){grid-column:auto}
.secnav button:last-child:nth-child(3n+1){grid-column:1/-1}

/* ---------- v214: قوائم منسدلة + بيانات أصغر ---------- */
.accCard{padding:0 !important;overflow:hidden}
.accList{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.accSec{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.accSec.open{border-color:var(--brand)}
.accH{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;text-align:start;background:transparent;color:var(--ink)}
.accH .ti,.secTile .ti{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#4B93FF,#1F6FEB)}
.accH .ti svg,.secTile .ti svg{width:17px;height:17px;stroke-width:1.9}
.accH .ti[data-s="acc"],.secTile .ti[data-s="acc"]{background:linear-gradient(135deg,#F2B544,#D98A12)}
.accH .ti[data-s="frame"],.secTile .ti[data-s="frame"]{background:linear-gradient(135deg,#3DD6A0,#12996B)}
.accH .ti[data-s="strip"],.secTile .ti[data-s="strip"]{background:linear-gradient(135deg,#9B7BFF,#6A45E0)}
.accH .ti[data-s="veneer"],.secTile .ti[data-s="veneer"]{background:linear-gradient(135deg,#FF8A7A,#E2503F)}
.accH .ti[data-s="bror"],.secTile .ti[data-s="bror"]{background:linear-gradient(135deg,#34C9E8,#0E8FB0)}
.accH .ti[data-s="prodium"],.secTile .ti[data-s="prodium"]{background:linear-gradient(135deg,#FF8FC0,#D9468A)}
.accH .ti[data-s="mabra"],.secTile .ti[data-s="mabra"]{background:linear-gradient(135deg,#FFB547,#E07B12)}
.accH .ti[data-s="user"],.secTile .ti[data-s="user"]{background:linear-gradient(135deg,#6B7A8C,#46566B)}
.accH .tx{font-size:13.5px;font-weight:800;white-space:nowrap}
.accH .sb{flex:1;min-width:0;font-size:11px;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.accH .reqb{flex:0 0 auto;font-size:10.5px;font-weight:800;color:#fff;background:var(--danger);border-radius:10px;padding:1px 8px}
.accH>svg.i,.ddH>svg.i{flex:0 0 auto;width:16px;height:16px;color:var(--muted);transition:transform .18s}
.accSec.open>.accH>svg.i,.dd.open>.ddH>svg.i,.accCard:has(.accBody)>.accH>svg.i{transform:rotate(180deg)}
.accBody{padding:4px 12px 12px}
.secPanel>.card{margin:0;padding:6px 0 0;border:0;box-shadow:none;background:transparent}
.secPanel>.card>.step{display:none}
.accCard .accBody .fld{margin-bottom:6px}
.accCard .accBody input{padding-top:8px;padding-bottom:8px}
.dd{margin-top:8px;border:1px dashed var(--line);border-radius:10px}
.ddH{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;text-align:start;background:transparent;color:var(--ink)}
.ddH .t{font-size:12px;font-weight:800}
.ddH .sm{flex:1;min-width:0;font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddB{padding:0 10px 8px}
.stepHint{margin-top:9px;font-size:11px;color:var(--muted);font-weight:600}
.secTiles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.secTile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 2px 7px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--ink);min-width:0}
.secTile .tx{font-size:11px;font-weight:800;line-height:1.2;text-align:center}
.secTile.on{border-color:var(--brand);box-shadow:0 0 0 1.5px var(--brand)}
.secPanel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px 12px;margin-bottom:12px}
.noteBtn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;margin-bottom:10px;border:1px dashed var(--line);border-radius:12px;background:var(--card);color:var(--ink);text-align:start}
.noteBtn svg.i{flex:0 0 auto;width:16px;height:16px;color:var(--warn-ink)}
.noteBtn .tx{font-size:12.5px;font-weight:800;white-space:nowrap}
.noteBtn .sb{flex:1;min-width:0;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.noteBtn.has{border-style:solid;border-color:var(--warn-ink)}

.rpv-bank{display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--muted);font-size:12px;font-weight:700}
.rpv-bank.on{border-color:var(--brand);color:var(--brand)}
.rpv-bank svg.i{width:15px;height:15px}
.qty input.qtyEmpty{width:68px}
input::placeholder,textarea::placeholder{color:#7A8DA6!important}
html[data-theme="dark"] input::placeholder,html[data-theme="dark"] textarea::placeholder{color:#9FB0C6!important}

/* ============================================================
   v229+ — ألوان خانات الكتابة + أيقونة الكمية
   كل خانة كتابة ليها خلفية مميّزة عن الكارت اللي حواليها، واللون بيدل على النوع:
   أزرق = نص/اسم/تليفون · أخضر = أرقام ومقاسات · كهرماني = الكمية
   بنفسجي = ملاحظات وتواريخ · رمادي مزرق = قوائم الاختيار
   ============================================================ */
:root{
  --fx-txt-bg:#EAF2FE;  --fx-txt-bd:#A9C6EC;  --fx-txt-fc:#FFFFFF;
  --fx-num-bg:#E7F7EE;  --fx-num-bd:#9ED6B8;  --fx-num-fc:#FFFFFF;
  --fx-note-bg:#F3EEFF; --fx-note-bd:#C9B9F0; --fx-note-fc:#FFFFFF;
  --fx-sel-bg:#EDF0F6;  --fx-sel-bd:#B4BFD2;  --fx-sel-fc:#FFFFFF;
  --fx-qty-bg:#FFF1D6;  --fx-qty-bd:#EBBE6B;  --fx-qty-fc:#FFFFFF;
  --fx-qty-ic-bg:#FBDFA4; --fx-qty-ic:#8A5A0B;
  --fx-bad-bg:#FFF0EE;  --fx-dirty-bg:#FFF4DF;
}
html[data-theme="dark"]{
  --fx-txt-bg:#14294A;  --fx-txt-bd:#34588C;  --fx-txt-fc:#1B3560;
  --fx-num-bg:#10302A;  --fx-num-bd:#2B6A55;  --fx-num-fc:#163E35;
  --fx-note-bg:#251F4A; --fx-note-bd:#4E4390;  --fx-note-fc:#30285E;
  --fx-sel-bg:#1B2740;  --fx-sel-bd:#3A4C70;  --fx-sel-fc:#24344F;
  --fx-qty-bg:#3A2A10;  --fx-qty-bd:#8A6524;  --fx-qty-fc:#4A3514;
  --fx-qty-ic-bg:#5A4015; --fx-qty-ic:#F0C46A;
  --fx-bad-bg:#3A1A1A;  --fx-dirty-bg:#3D2E12;
}
/* الحاملات: كل نوع خانة بياخد مجموعة ألوانه */
:root:root :is(input[type=text],input[type=tel],input[type=search],input[type=password],input[type=email],input:not([type])){
  --fxb:var(--fx-txt-bg);--fxd:var(--fx-txt-bd);--fxf:var(--fx-txt-fc)}
:root:root :is(input[type=number],.stkin,.hgtIn,.prow3 input,.rodbox input){
  --fxb:var(--fx-num-bg);--fxd:var(--fx-num-bd);--fxf:var(--fx-num-fc)}
:root:root :is(textarea,.fld textarea,input[type=date],input[type=time]){
  --fxb:var(--fx-note-bg);--fxd:var(--fx-note-bd);--fxf:var(--fx-note-fc)}
:root:root select{--fxb:var(--fx-sel-bg);--fxd:var(--fx-sel-bd);--fxf:var(--fx-sel-fc)}
:root:root :is(input[data-act*="qty"],input[data-act="acc-set"]){
  --fxb:var(--fx-qty-bg);--fxd:var(--fx-qty-bd);--fxf:var(--fx-qty-fc)}
/* التطبيق الفعلي */
:root:root :is(input[type=text],input[type=tel],input[type=search],input[type=password],input[type=email],input:not([type]),
  input[type=number],input[type=date],input[type=time],textarea,select,.stkin,.hgtIn,.prow3 input,.rodbox input,.fld textarea){
  background:var(--fxb);border-color:var(--fxd)}
:root:root :is(input[type=text],input[type=tel],input[type=search],input[type=password],input[type=email],input:not([type]),
  input[type=number],input[type=date],input[type=time],textarea,select,.stkin,.hgtIn,.prow3 input,.rodbox input,.fld textarea):focus{
  background:var(--fxf);border-color:var(--brand)}
:root:root .stkin.dirty{background:var(--fx-dirty-bg);border-color:#C08A3E}
:root:root input.bad{background:var(--fx-bad-bg);border-color:var(--danger)}

/* عدّاد الكمية: خلفية كهرمانية + خانة أيقونة */
:root:root .qty{background:var(--fx-qty-bg);border-color:var(--fx-qty-bd)}
:root:root .qty input,:root:root .qty input:focus{background:transparent;border-inline-color:var(--fx-qty-bd);box-shadow:none}
:root:root .qty button{color:var(--fx-qty-ic)}
:root:root .qty button:active{background:var(--fx-qty-ic-bg)}
.qty .qIc{display:grid;place-items:center;align-self:stretch;flex:0 0 auto;width:34px;
  background:var(--fx-qty-ic-bg);color:var(--fx-qty-ic);border-inline-end:1.5px solid var(--fx-qty-bd)}
.qty .qIc svg.i{width:18px;height:18px}
.accgrid .ac .qty .qIc{width:24px}
.accgrid .ac .qty .qIc svg.i{width:15px;height:15px}

/* ============================================================
   v230 — تظبيط وتنعيم الشكل العام (طبقة إضافية فوق اللي فات، من غير ما تغيّر أي منطق)
   ============================================================ */
:root{--ease:cubic-bezier(.22,.8,.3,1);--press:.97}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overscroll-behavior-y:none}
input,textarea,select,.money,.pr,.no{font-variant-numeric:tabular-nums}
/* انتقالات ناعمة موحّدة لكل العناصر اللي بتتلمس */
@media (prefers-reduced-motion:no-preference){
  .btn,.chip,.miniChip,.colchip,.secnav button,.tabs button,.door .leaf,.ord,.card,.sizeCard,.qty,.qty button,
  input,select,textarea,.stkin,.hgtIn,.noteBtn,.rpv-bank{
    transition:background-color .18s var(--ease),border-color .18s var(--ease),box-shadow .22s var(--ease),
               transform .14s var(--ease),color .18s var(--ease),opacity .18s}
  .chip.on,.miniChip.on,.colchip.on{transform:translateY(-1px)}
  .door.on .leaf{transform:translateY(-2px)}
}
/* إحساس الضغط على الموبايل */
.btn:active,.chip:active,.miniChip:active,.secnav button:active,.noteBtn:active,.rpv-bank:active{transform:scale(var(--press))}
.door:active .leaf{transform:scale(.98)}
.qty button:active{transform:scale(.9)}
/* كروت: زوايا أنعم وعمق أوضح، وطلبات العملاء تتنفس */
.card,.ord{border-radius:var(--r-lg,18px)}
.ord{padding:14px;margin-bottom:13px}
.card{margin-bottom:13px}
.sizeCard{border-radius:var(--r-md,14px);padding:12px 13px}
html[data-theme="dark"] .sizeCard{background:rgba(255,255,255,.04);border-color:rgba(120,165,235,.22)}
/* الأزرار: ارتفاع ثابت مريح للمس وحالة تعطيل واضحة */
.btn{min-height:46px;display:flex;align-items:center;justify-content:center;gap:7px;letter-spacing:.1px}
.btn.sm{min-height:34px}
.btn[disabled],.btn:disabled{opacity:.5;filter:saturate(.55);pointer-events:none;box-shadow:none}
.btn svg.i{width:18px;height:18px;flex:none}
/* شريط التبويبات والعنوان العلوي: فاصل ناعم بدل الخط الحاد */
.top{box-shadow:0 2px 14px rgba(0,0,0,.14)}
.tabs{box-shadow:0 1px 0 var(--line),0 6px 16px -10px rgba(0,0,0,.28)}
.tabs button{border-radius:12px 12px 0 0}
.tabs button.on{background:linear-gradient(180deg,transparent,rgba(63,169,245,.10))}
/* الشريط السفلي: زجاج خفيف وفاصل أنعم، والمحتوى ما يتغطّاش */
.bar{box-shadow:0 -8px 24px -12px rgba(0,0,0,.35)}
main,#app,.wrap{scroll-padding-bottom:110px}
/* عناوين الأقسام والملاحظات: مسافات منتظمة */
.grp{margin:14px 0 7px;letter-spacing:.2px}
.note{line-height:1.7}
.row2{gap:11px}
label.fld{margin-bottom:12px}
label.fld span{margin-bottom:5px;font-weight:700}
/* حلقة التركيز واضحة للي بيستخدم كيبورد */
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
/* جداول وقوائم طويلة: تمرير ناعم من غير شريط تمرير تقيل */
.stktbl,.tblwrap,[style*="overflow-x:auto"],[style*="overflow:auto"]{-webkit-overflow-scrolling:touch;scrollbar-width:thin}
::selection{background:rgba(63,169,245,.28)}

/* v231 — ترتيب كارت المقاس: الكمية ← الحلق ← البرور ← خيارات إضافية */
.sizeCard .scHead{padding-bottom:9px;margin-bottom:9px;border-bottom:1px dashed var(--line)}
.sizeCard .miniLbl{margin:11px 0 6px}
.sizeCard .miniLbl:first-of-type{margin-top:4px}
.sizeCard .dd{margin-top:13px;padding-top:11px;border-top:1px dashed var(--line)}

/* v233 — إصلاح عرض الهيدر: كان بيزق الصفحة أعرض من الشاشة ويعمل تمرير جانبي */
body{overflow-x:clip}
.top-row{flex-wrap:wrap;row-gap:6px}
.top-row .ttl{min-width:0;flex:1 1 120px}
.top-row .ttl .t1,.top-row .ttl .t2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-row .wh-chip{flex:none}
.top-row .verstrip{margin-top:0;margin-inline-start:auto;flex:none}

/* v234 — بحث الطلبات + شريط السلة العائم */
.ord[hidden],#ordNone[hidden],#cartFloat[hidden]{display:none!important}
.ordFilter{position:sticky;top:0;z-index:5;margin:0 0 12px;padding:2px 0 8px;background:var(--bg,transparent)}
.ordFilter input{width:100%;box-sizing:border-box;padding:11px 14px;border-radius:13px;font-size:14px}
.ordChips{display:flex;gap:7px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.ordChips::-webkit-scrollbar{display:none}
.ordChip{flex:none;padding:7px 13px!important;font-size:12.5px!important;border-radius:20px!important}
.ordChip b{margin-inline-start:4px;opacity:.75}
.ordChip.on{background:var(--brand)!important;color:#fff!important;border-color:var(--brand)!important}
#cartFloat{position:fixed;inset-inline:12px;z-index:60;display:flex;align-items:center;gap:9px;padding:12px 15px;border:0;border-radius:16px;
  background:linear-gradient(135deg,var(--brand-lt,#3FA9F5),var(--brand,#1668B8));color:#fff;font-weight:700;font-size:14px;
  box-shadow:0 8px 22px rgba(11,79,168,.38)}
#cartFloat svg.i{width:20px;height:20px;flex:none}
#cartFloat b{margin-inline-start:auto;font-size:15px}
#cartFloat em{font-style:normal;font-size:12px;opacity:.9}
#cartFloat:active{transform:scale(.98)}
.ordChip{white-space:nowrap}
.oa .btn{white-space:nowrap;font-size:12.5px;padding-inline:6px;gap:5px}
.oa .btn svg.i{width:16px;height:16px}

/* ============ v235 — الرئيسية الجديدة ============ */
.hm2-hero{position:relative;overflow:hidden;border-radius:24px;padding:18px 16px 16px;color:#fff;margin-bottom:14px;
  background:linear-gradient(160deg,#0E2A57 0%,#0A1B3D 55%,#071229 100%);box-shadow:0 14px 34px -14px rgba(7,18,41,.75),inset 0 0 0 1px rgba(111,193,250,.16)}
.hm2-hero .g1,.hm2-hero .g2{position:absolute;border-radius:50%;filter:blur(38px);pointer-events:none}
.hm2-hero .g1{width:170px;height:170px;top:-60px;inset-inline-start:-40px;background:rgba(63,169,245,.38)}
.hm2-hero .g2{width:150px;height:150px;bottom:-70px;inset-inline-end:-30px;background:rgba(154,140,240,.28)}
.hm2-hero>*{position:relative}
.hm2-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hm2-top small{display:block;font-size:12.5px;opacity:.8}
.hm2-top b{display:block;font-size:22px;margin-top:2px}
.hm2-cart{position:relative;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18)}
.hm2-cart svg.i{width:22px;height:22px}
.hm2-cart span{position:absolute;top:-6px;inset-inline-start:-6px;min-width:20px;height:20px;border-radius:10px;background:#F0736A;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.hm2-new{width:100%;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:16px;font-size:16px;font-weight:800;
  background:linear-gradient(135deg,#6FC1FA,#2E7FF0);color:#fff;box-shadow:0 10px 24px -8px rgba(63,169,245,.75)}
.hm2-new svg.i{width:20px;height:20px}
.hm2-hero .hm-last{margin-top:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:16px}
.hm2-ks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.hm2-k{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"i n" "t t";align-items:center;gap:4px 10px;text-align:start;
  padding:13px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.hm2-k .ki{grid-area:i;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--kc) 18%,transparent);color:var(--kc)}
.hm2-k .ki svg.i{width:21px;height:21px}
.hm2-k b{grid-area:n;font-size:30px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;justify-self:end}
.hm2-k .kt{grid-area:t;font-size:12.5px;font-weight:700;color:var(--muted)}
.hm2-k:active{transform:scale(.97)}
html[data-theme="dark"] .hm2-k{box-shadow:0 12px 26px -16px var(--kc),inset 0 0 0 1px rgba(255,255,255,.05)}
.hm2-qs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:6px;scrollbar-width:none}
.hm2-qs::-webkit-scrollbar{display:none}
.hm2-q{position:relative;flex:1 0 74px;display:flex;flex-direction:column;align-items:center;gap:7px;padding:4px 2px;background:none}
.hm2-q .qi{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--qc) 16%,var(--card));color:var(--qc);
  border:1px solid color-mix(in srgb,var(--qc) 35%,transparent)}
.hm2-q .qi svg.i{width:24px;height:24px}
.hm2-q .qt{font-size:11.5px;font-weight:700;color:var(--ink);text-align:center;white-space:nowrap}
.hm2-q:active .qi{transform:scale(.92)}
.hm2-o{padding:13px 14px;margin-bottom:10px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.hm2-o .oh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hm2-o .oh b{font-size:16px}
.hm2-o .oc{font-size:12.5px;color:var(--muted);flex:1;min-width:0}
.hm2-o .os{font-size:12.5px;color:var(--muted);margin-top:5px}
.hm2-p{height:6px;border-radius:6px;background:var(--line);margin-top:10px;overflow:hidden}
.hm2-p i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#3FA9F5,#4FC08A)}
.hm2-o .dc{flex:none}
.hm2-o .dc>*{display:inline-flex;width:auto;margin:0;white-space:nowrap;font-size:11.5px;padding:4px 10px}

/* ============ v236 — شاشة السلة ============ */
.ct-hero{position:relative;overflow:hidden;border-radius:24px;padding:16px;color:#fff;margin-bottom:14px;
  background:linear-gradient(160deg,#0E2A57 0%,#0A1B3D 55%,#071229 100%);box-shadow:0 14px 34px -14px rgba(7,18,41,.75),inset 0 0 0 1px rgba(111,193,250,.16)}
.ct-hero .g1,.ct-hero .g2{position:absolute;border-radius:50%;filter:blur(36px);pointer-events:none}
.ct-hero .g1{width:150px;height:150px;top:-60px;inset-inline-start:-30px;background:rgba(79,192,138,.32)}
.ct-hero .g2{width:140px;height:140px;bottom:-70px;inset-inline-end:-20px;background:rgba(63,169,245,.34)}
.ct-hero>*{position:relative}
.ct-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.ct-top small{display:block;font-size:12.5px;opacity:.78}
.ct-top b{display:block;font-size:24px;margin-top:2px}
.ct-tot{text-align:end}.ct-tot b{font-size:26px;font-variant-numeric:tabular-nums}.ct-tot em{font-style:normal;font-size:14px;opacity:.8}
.ct-steps{display:flex;align-items:center;gap:6px;margin-top:15px}
.ct-steps span{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:6px 11px;border-radius:20px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);white-space:nowrap}
.ct-steps span svg.i{width:15px;height:15px}
.ct-steps span.on{background:rgba(79,192,138,.22);color:#9FF0C6}
.ct-steps span.warn{background:rgba(240,115,106,.22);color:#FFB4AE}
.ct-steps i{flex:1;height:2px;border-radius:2px;background:rgba(255,255,255,.18);min-width:8px}
.line{border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:9px;box-shadow:var(--shadow)}
.total{border-radius:16px}
.ct-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.ct-info>div{padding:9px 11px;border-radius:13px;background:rgba(63,169,245,.09);border:1px solid rgba(63,169,245,.2);min-width:0}
.ct-info span{display:block;font-size:11px;color:var(--muted);font-weight:700}
.ct-info b{display:block;font-size:13.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct-fix{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px;margin-bottom:12px;border-radius:13px;font-size:13px;font-weight:800;
  background:rgba(240,115,106,.14);color:var(--danger-ink,#C6362D);border:1.5px dashed rgba(240,115,106,.55)}
.ct-fix svg.i{width:17px;height:17px}
.btn.ct-send{background:linear-gradient(135deg,#2BD576,#0E9F6E)!important;color:#fff!important;box-shadow:0 10px 22px -8px rgba(14,159,110,.6)}

/* v236 — شاشة «طلب جديد»: نفس هوية الرئيسية والسلة */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#0E2A57 0%,#0A1B3D 55%,#071229 100%)!important;
  box-shadow:0 14px 34px -14px rgba(7,18,41,.75),inset 0 0 0 1px rgba(111,193,250,.16)!important;border-radius:22px!important}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(34px);pointer-events:none}
.hero::before{width:140px;height:140px;top:-60px;inset-inline-end:-20px;background:rgba(63,169,245,.36)}
.hero::after{width:120px;height:120px;bottom:-60px;inset-inline-start:-10px;background:rgba(154,140,240,.26)}
.hero>*{position:relative;z-index:1}
.secTile.on{box-shadow:0 0 0 2px var(--brand),0 10px 22px -10px var(--brand)}
body.hasFloat #view{padding-bottom:84px}

/* ============ v237 — أيقونات بلمسة لونين + أشكال أنعم ============ */
.i .d{fill:currentColor;fill-opacity:.17;stroke:none}
.tabs button.on .i .d{fill-opacity:.38}
.i{stroke-width:1.8}
.btn .i .d,.hm2-new .i .d,#cartFloat .i .d{fill-opacity:.28}
.secTile .ti,.hm2-q .qi,.hm2-k .ki{border-radius:16px}
.secTile .ti{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.38),0 6px 14px -6px rgba(0,0,0,.35)}
.secTile .ti .i .d{fill:#fff;fill-opacity:.3}
.tabs button.on{border-radius:18px}
.tabs button .i{transition:transform .2s var(--ease,ease)}
.tabs button.on .i{transform:translateY(-1px) scale(1.08)}
.hm2-q .qi{border-radius:20px;box-shadow:0 8px 18px -10px var(--qc)}
.hm2-k .ki{box-shadow:0 6px 14px -8px var(--kc)}
.ct-steps span svg.i .d{fill-opacity:.35}

/* ============ v238 — شاشة المصنع ============ */
.ad-hero{position:relative;overflow:hidden;border-radius:24px;padding:16px;color:#fff;margin-bottom:14px;
  background:linear-gradient(160deg,#0E2A57 0%,#0A1B3D 55%,#071229 100%);box-shadow:0 14px 34px -14px rgba(7,18,41,.75),inset 0 0 0 1px rgba(111,193,250,.16)}
.ad-hero .g1,.ad-hero .g2{position:absolute;border-radius:50%;filter:blur(36px);pointer-events:none}
.ad-hero .g1{width:150px;height:150px;top:-60px;inset-inline-end:-20px;background:rgba(217,164,65,.30)}
.ad-hero .g2{width:140px;height:140px;bottom:-70px;inset-inline-start:-20px;background:rgba(63,169,245,.32)}
.ad-hero>*{position:relative}
.ad-top{display:flex;align-items:center;gap:12px}
.ad-ico{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18)}
.ad-ico svg.i{width:26px;height:26px}
.ad-top small{display:block;font-size:12.5px;opacity:.78}.ad-top b{display:block;font-size:24px;margin-top:2px}
.ad-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}
.ad-k{padding:10px 4px;border-radius:15px;text-align:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 20px -14px var(--kc)}
.ad-k b{display:block;font-size:24px;line-height:1.1;color:var(--kc);font-variant-numeric:tabular-nums}
.ad-k span{display:block;font-size:10.5px;margin-top:4px;opacity:.85;white-space:nowrap}
.ad-card{margin-bottom:14px}
.ad-q{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:14px;font-size:14px}
.ad-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--muted);font-weight:700}
.ad-legend span{display:inline-flex;align-items:center;gap:6px}
.ad-legend i{width:18px;height:6px;border-radius:6px;background:var(--line)}
.ad-legend i.g{background:#4FC08A}.ad-legend i.a{background:#D9A441}.ad-legend i.r{background:rgba(160,170,190,.55)}
.ad-tools{display:flex;flex-direction:column;gap:13px}
.ad-tg{padding:11px;border-radius:16px;background:rgba(63,169,245,.06);border:1px solid var(--line)}
.ad-tl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:9px}
.ad-tl svg.i{width:15px;height:15px}
.ad-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ad-row .btn{white-space:nowrap;font-size:12.5px;padding-inline:6px}
.ad-row.ad-end{grid-template-columns:1fr 1fr}
.ad-tg .ad-row:only-child{margin:0}
.ord[data-grp]{border-radius:18px}
.grp-hd{padding:12px}
.grp-ord{border-radius:12px}

/* v238 — تظبيط صفوف الطلبات وأزرار الأدوات في المصنع */
.ad-row .btn:last-child:nth-child(odd){grid-column:1/-1}
.grp-ord{display:flex!important;flex-wrap:wrap;align-items:center;gap:7px 8px}
.grp-ord>span[style]{flex:1 0 100%!important;height:0;margin:0}
.grp-ord .grp-b{flex:1 1 calc(50% - 5px);justify-content:center;white-space:nowrap}
.grp-all{display:flex;flex-wrap:wrap;align-items:center;gap:7px 8px}
.grp-all>span{flex:1 0 100%;font-size:11.5px;font-weight:700;color:var(--muted)}
.grp-all .grp-b{flex:1 1 calc(50% - 5px);justify-content:center}
.grp-all{display:flex!important;flex-wrap:wrap!important}
.grp-all>span{flex:1 0 100%!important;width:100%!important;text-align:start}
.grp-all .grp-b{flex:1 1 calc(50% - 5px)!important;width:auto!important;margin:0!important}

/* v239 — أدوات وتقارير: قايمة منسدلة */
.ad-dd{padding:0!important;overflow:hidden}
.adH{width:100%;display:flex;align-items:center;gap:11px;padding:14px;background:none;text-align:start;color:inherit}
.adH .n{flex:none;width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#F1C16B,#D9A441);color:#fff}
.adH .tt{flex:1;min-width:0}
.adH .tt b{display:block;font-size:16px}
.adH .tt small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:600}
.adH>svg.i:last-child{flex:none;width:20px;height:20px;color:var(--muted);transform:rotate(-90deg);transition:transform .22s var(--ease,ease)}
.ad-dd.open .adH>svg.i:last-child{transform:rotate(90deg)}
.ad-dd.open .adH{border-bottom:1px solid var(--line)}
.adB{padding:12px 14px 14px}

/* v239 — ضبط وتنسيق الرئيسية */
.hm2-ks{grid-template-columns:repeat(4,1fr)!important;gap:8px!important;margin-bottom:16px!important}
.hm2-k{grid-template-columns:1fr!important;grid-template-areas:"i" "n" "t"!important;justify-items:center;text-align:center!important;gap:6px!important;padding:12px 4px 10px!important;border-radius:16px!important}
.hm2-k .ki{width:36px!important;height:36px!important;border-radius:12px!important}
.hm2-k .ki svg.i{width:19px!important;height:19px!important}
.hm2-k b{justify-self:center!important;font-size:24px!important}
.hm2-k .kt{font-size:10.8px!important;line-height:1.25;white-space:normal;max-width:100%}
.hm-h{margin:18px 2px 10px!important}
.hm2-hero{margin-bottom:6px!important}
.hm2-qs{display:grid!important;grid-template-columns:repeat(4,1fr);gap:6px;overflow:visible!important;padding:4px 0 2px!important;margin-bottom:4px!important}
.hm2-q{flex:none!important;padding:2px!important}
.hm2-q .qt{white-space:normal!important;line-height:1.25;font-size:11px!important}
.hm2-o{padding:12px 13px!important;margin-bottom:9px!important}
.hm-empty{padding:18px 14px;text-align:center;border-radius:16px;border:1.5px dashed var(--line);color:var(--muted);font-size:13px}
.hm2-k{align-content:start}
.hm2-k .kt{min-height:1.3em}

/* v240 — «خيارات إضافية»: خلفية وإطار يبينوها */
:root{--dd-bg:#EEF0FD;--dd-bd:#B9C0F0;--dd-in:#F8F9FF;--dd-ink:#3F4BB0}
html[data-theme="dark"]{--dd-bg:#1E2450;--dd-bd:#4A53A0;--dd-in:#161B3E;--dd-ink:#B7BEFF}
:root:root .dd{background:var(--dd-bg);border:1.5px solid var(--dd-bd);border-radius:14px;padding:0;overflow:hidden;margin-top:13px}
:root:root .sizeCard .dd{border-top:1.5px solid var(--dd-bd);padding-top:0}
.dd .ddH{width:100%;display:flex;align-items:center;gap:8px;padding:11px 12px;background:transparent;text-align:start;color:inherit}
.dd .ddH .t{font-weight:800;color:var(--dd-ink)}
.dd .ddH .sm{flex:1;min-width:0;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd .ddH>svg.i{flex:none;color:var(--dd-ink)}
.dd.open .ddH{border-bottom:1.5px solid var(--dd-bd)}
.dd .ddB{background:var(--dd-in);padding:11px 12px 12px}
/* v241 — طلب مسترجع من جهاز تاني: بنخفي اللي محتاج أصناف */
.ord[data-restored] [data-act="ord-edit"],.ord[data-restored] [data-act="ord-again"],.ord[data-restored] [data-act="ord-pdf"],.ord[data-restored] [data-act="ord-xls"],.ord[data-restored] [data-act="resend"]{display:none!important}

/* v242 — «خيارات إضافية»: النوع / التدعيم / الطباعة في ٣ أعمدة */
.exCols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:start}
.exCol .miniLbl{margin:0 0 7px!important;text-align:center;font-size:12px}
.exCol .miniChips{display:flex;flex-direction:column;align-items:stretch;gap:7px}
.exCol .miniChip{width:100%;text-align:center;white-space:normal;line-height:1.25;padding:9px 4px!important;font-size:12.5px!important;min-height:38px;display:flex;align-items:center;justify-content:center}
.dd .ddB .fld.sm{margin-top:12px}
.hgtStep{margin:2px 0 4px}
.hgtStep>span{display:block;margin-bottom:6px;font-weight:700;color:var(--danger-ink,#C6362D)}

/* ============ v245 — أيقونات أكبر على الكمبيوتر ============ */
@media (min-width:820px){
  main.wrap{width:100%}
  .tabs button{flex:0 1 210px;font-size:15px;padding:12px 10px 10px;gap:7px}
  .tabs button .i.lg{width:34px;height:34px}
  .tabs button.on .i{transform:translateY(-1px) scale(1.06)}
  .verstrip button{padding:9px 13px;font-size:13px}
  .verstrip button svg.i{width:20px;height:20px}
  .btn svg.i{width:21px;height:21px}
  .btn.sm svg.i{width:19px;height:19px}
  /* الرئيسية */
  .hm2-cart{width:56px;height:56px;border-radius:18px}.hm2-cart svg.i{width:28px;height:28px}
  .hm2-new{font-size:18px;padding:17px}.hm2-new svg.i{width:24px;height:24px}
  .hm2-k .ki{width:50px!important;height:50px!important;border-radius:16px!important}
  .hm2-k .ki svg.i{width:28px!important;height:28px!important}
  .hm2-k b{font-size:30px!important}.hm2-k .kt{font-size:13px!important}
  .hm2-q .qi{width:68px;height:68px;border-radius:22px}.hm2-q .qi svg.i{width:32px;height:32px}
  .hm2-q .qt{font-size:13.5px!important}
  /* طلب جديد */
  .secTile .ti{width:42px;height:42px;border-radius:13px}.secTile .ti .i{width:24px;height:24px}
  .secTile{font-size:13.5px}
  /* السلة والمصنع */
  .ct-steps span{font-size:13.5px;padding:8px 14px}.ct-steps span svg.i{width:19px;height:19px}
  .ad-ico{width:62px;height:62px;border-radius:20px}.ad-ico svg.i{width:34px;height:34px}
  .ad-k b{font-size:30px}.ad-k span{font-size:13px}
  .adH .n{width:46px;height:46px;border-radius:15px}.adH .n svg.i{width:26px;height:26px}
  .adH>svg.i:last-child{width:24px;height:24px}
  .adH .tt b{font-size:18px}.adH .tt small{font-size:13px}
  .ad-tl svg.i{width:18px;height:18px}.ad-tl{font-size:13.5px}
  .step .n svg.i{width:24px;height:24px}
  .ordChip{font-size:14px!important}
}

}

const ASSETS = {
  logo:'img/logo.png',
  mark:'img/mark.png',
  bank:'img/bank-transfer.jpg',   // بيانات التحويل البنكي — بتتطبع في آخر مستند الأوردر
  doors:{

    A010:'img/doors/A010.jpg',
    A013:'img/doors/A013.jpg'
  }
};

// اللوجو والصور بقت ملفات منفصلة بدل ما تكون base64 جوه الكود (أخف وبتتكاش لوحدها).
// الدالة دي بتجيب اللوجو كـ base64 مرة واحدة بس وتخزّنه — محتاجينه بالشكل ده لمكتبة الإكسيل (ExcelJS).
let _logoB64Cache = null;
async function logoBase64_(){
  if(_logoB64Cache) return _logoB64Cache;
  try{
    const res = await fetch(ASSETS.logo);
    const blob = await res.blob();
    _logoB64Cache = await new Promise((resolve,reject)=>{
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result).split(',')[1]);
      fr.onerror = reject;
      fr.readAsDataURL(blob);
    });
  }catch(e){ _logoB64Cache = null; }
  return _logoB64Cache;
}

// بنحمّل صور الأبواب واللوجو بدري في الخلفية عشان تبقى جاهزة في كاش المتصفح
// وقت ما المستخدم يفتح لوحة اختيار الباب أو يعمل تصدير PDF/صورة (بدل ما تتأخر في اللحظة دي).
function preloadDoorImages_(){
  // كان بيبدأ 13 تحميل صورة مع أول لحظة فتح فيزاحم رسم الشاشة نفسها.
  // دلوقتي بيستنى المتصفح يفضى (requestIdleCallback) فالفتحة بقت أسرع محسوسًا.
  const go = () => {
    [ASSETS.logo, ASSETS.mark, ...Object.values(ASSETS.doors)].forEach(src=>{
      const im = new Image(); im.decoding = 'async'; im.src = src;
    });
  };
  (window.requestIdleCallback || (fn => setTimeout(fn, 1200)))(go, { timeout: 3000 });
}

/* ============================================================
   تحميل المكتبات التقيلة عند الطلب (Lazy loading)
   ------------------------------------------------------------
   قبل كده كانت 4 مكتبات (~2.4 ميجا) بتتحمّل في <head> مع كل فتحة للتطبيق،
   حتى لو المستخدم مش هيصدّر أي حاجة. ده كان بيأخّر ظهور الشاشة الأولى ثواني
   على الموبايل. دلوقتي كل مكتبة بتتحمّل أول مرة تتطلب فيها بس، والوعد بتاعها
   بيتخزّن فمافيش تحميل مكرر، والـ Service Worker بيكاشها فالمرات الجاية فورية.
   ============================================================ */
const LIB_URLS = {
  html2canvas:'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
  jspdf      :'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  exceljs    :'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'
};
const LIB_READY = {
  html2canvas:()=>typeof html2canvas!=='undefined',
  jspdf      :()=>!!window.jspdf,
  exceljs    :()=>typeof ExcelJS!=='undefined'
};
const _libPromises = {};
function ensureLib_(name){
  if(LIB_READY[name] && LIB_READY[name]()) return Promise.resolve(true);
  if(_libPromises[name]) return _libPromises[name];
  _libPromises[name] = new Promise((resolve, reject)=>{
    const sc = document.createElement('script');
    sc.src = LIB_URLS[name];
    sc.async = true;
    const fail = () => { delete _libPromises[name]; sc.remove(); reject(new Error(name)); };
    sc.onload = () => {
      // ⚠️ onload لوحده مش كفاية. لو الشبكة اعترضت الطلب ورجّعت صفحة HTML بحالة 200
      // (بوابات الواي فاي العامة والفنادق بتعمل كده كتير)، الوسم بيعتبرها «تحميل ناجح»
      // والمكتبة مش موجودة أصلًا. ساعتها الكود كان هيكمّل ويقع على html2canvas is not
      // defined من غير ما المستخدم يشوف أي رسالة — يدوس PDF ومفيش أي رد فعل.
      // فبنتأكد إن المكتبة عرّفت نفسها فعلاً قبل ما نقول إنها جاهزة.
      if(LIB_READY[name] && LIB_READY[name]()) resolve(true);
      else fail();
    };
    sc.onerror = fail;
    document.head.appendChild(sc);
  });
  return _libPromises[name];
}
// بتحمّل مجموعة مكتبات مع بعض وبتوري رسالة واضحة لو النت مقطوع.
// بترجّع true لو كله تمام، و false لو فشل — فكل مكان بيستخدمها بيعمل return عادي.
async function needLibs_(...names){
  const missing = names.filter(n => !(LIB_READY[n] && LIB_READY[n]()));
  if(!missing.length) return true;
  // ⚠️ كان فيه باج هنا: الدالة دي بتقفل شاشة «جارٍ التجهيز» في الآخر على طول.
  // بس هي بتتنده أحيانًا من جوه عملية أطول فاتحة الشاشة أصلًا (زي «تقرير كامل»)،
  // فكانت بتقفلها في نص الشغل والمستخدم يفتكر إن التطبيق علّق — والباقي (رسم
  // الصفحة وتحويلها PDF) هو أبطأ جزء أصلًا. دلوقتي بنرجّع الشاشة زي ما لقيناها.
  const wasOn = _busyOn, wasTxt = _busyTxt;
  busy(true,'جارٍ تجهيز الأدوات…');
  try{
    await Promise.all(missing.map(ensureLib_));
    return true;
  }catch(e){
    toast('محتاج نت أول مرة عشان يجهّز الملف — جرّب تاني وانت متصل');
    return false;
  }finally{
    if(wasOn) busy(true, wasTxt);   // العملية الأكبر لسه شغّالة — سيب الشاشة مفتوحة
    else busy(false);
  }
}
// أول ما المستخدم يفتح شاشة فيها تصدير، بنبدأ نجيب المكتبات في الخلفية بهدوء
// عشان أول ضغطة على «PDF» تبقى فورية بدل ما يستنى التحميل ساعتها.
let _libsWarmed = false;
function warmExportLibs_(){
  if(_libsWarmed) return;
  _libsWarmed = true;
  const go = () => { ensureLib_('html2canvas').catch(()=>{}); ensureLib_('jspdf').catch(()=>{}); };
  (window.requestIdleCallback || (fn=>setTimeout(fn,1500)))(go, {timeout:4000});
}

const APP_BUILD   = 'v246';
const COMPANY     = 'ELKORASHI DOORS';
const COMPANY_AR  = 'القرشي لأبواب WPC';
const WAREHOUSE   = 'مصنع إنشاص';
// نسخة السكربت اللي الكود ده محتاجها على جوجل. لو المنشور أقدم منها معناه
// إن حد نسخ apps_script.gs مرة وماعملش Deploy ▸ New version بعد كده — التطبيق
// شغّال والسيرفر ناقص حاجة، وده بيطلع على شكل باجات غريبة (رصيد باب مش لاقيه،
// تعديل صنف بيترفض). بنسأل السيرفر عن نسخته ونقول للمصنع بدل ما يخمّن.
const SRV_BUILD_WANT = 'v205';

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw2aVRVaUVubR3w4a3weiQTHGp03SvMozh83NY3OtBD14n1YugCjbcWdYEJUPJb-s3E/exec';

/* ============================================================
   أطوال الأعواد الحقيقية (المصنع)
   الحلق بيتقطّع مقاسين: قائم ٢٢٠ سم (جنبي الباب) وعارضة حلق علوية ١١٠ سم (فوق الباب).
   البرور عود واحد ٢٢٦ سم.
   التسعير بيتحسب بالمتر الطولي × طول العود الفعلي — فكل مقاس له سعره.
   ============================================================ */
const BROR_ROD_CM = 226;

/* ============================================================
   متطلبات التقطيع للباب الواحد (بيانات المصنع)
   الباب بياخد: ٣ أعواد حلق — عودين ٢٢٠ سم (القوائم) + عود ١١٠ سم (عارضة الحلق العلوية)
                ٥ أعواد برور — كل عود ٢٢٦ سم
   الأرقام دي بتتحسب أوتوماتيك لكل باب وبتظهر في مستند الطلب
   عشان المصنع يعرف يقطّع على طول من غير حسابات بالإيد.
   ============================================================ */
const FRAME_PER_DOOR = [
  { qty:2, cm:220, label:'قائم' },     // جنبي الباب
  { qty:1, cm:110, label:'عارضة حلق علوية'  }      // أعلى الباب
];
const BROR_PER_DOOR  = { qty:5, cm:BROR_ROD_CM };

// نص مختصر يتعرض جنب الباب في المستندات

// بيبني نص الحلق شامل الارتفاع الخاص لو الموزع/العميل حدده (اختياري)
function frameText_(cm, height){
  if(!cm) return '';
  return cm+' سم' + (height?' (ارتفاع '+height+' سم)':'');
}
// بيبني نص مقاس الباب شامل ارتفاع الفتحة المعمارية لو مختلف عن الاستاندر 215 (اختياري، زي الحلق بالظبط)
// المقاس الخاص محتاج قص، والارتفاع غير الاستاندر محتاج تظبيط. الاتنين بقوا
// بند مستقل بكميته وسعره (خدمة قص) — مش زيادة مخفية جوه سعر الباب.
const CUT_SERVICE_NOTE_ = 'خدمة قص';
const CUT_SERVICE_CODE_ = 'CUT';
function doorSizeText_(sizeTxt, height){
  return (sizeTxt||'') + (height?' (ارتفاع '+height+' سم)':'');
}
// الباب اللي محتاج قص: مقاس خاص، أو ارتفاع غير الاستاندر (٢١٥).
// بنعرفه من نص المقاس كمان عشان الطلبات القديمة تتحسب صح.
function doorNeedsCut_(it){
  if(!it || it.kind!=='door') return false;
  if(/مقاس خاص/.test(it.sizeTxt||'') || /\(custom\)/i.test(it.sizeEn||'')) return true;
  // ⚠️ مش أي ارتفاع مكتوب = قص. الطلبات اللي جاية من السيرفر أو من نص طلب
  // بيتكتب فيها الارتفاع الاستاندر (215) صراحة — ده مافيهوش أي قص.
  const h = Number(it.doorHeight)||0;
  return !!h && h !== DOOR_STD_HEIGHT;
}
// تدعيم الخشب اختيار من الموزّع على الباب نفسه (مش محسوب من المقاس زي القص).
function doorNeedsWood_(it){ return !!(it && it.kind==='door' && it.wood); }
// الطباعة زي التدعيم: اختيار صريح من الموزّع على الباب نفسه.
function doorNeedsPrint_(it){ return !!(it && it.kind==='door' && it.print); }

/* ---------- بنود الخدمة على الباب ----------
   بند الخدمة صنف حقيقي في الطلب بكميته وسعره، بيتولّد تلقائي من الأبواب
   وبيتشال معاها. الاتنين (قص/تدعيم) بيشتغلوا بنفس الميكانيكا بالظبط، فبدل
   ما الكود يتكتب مرتين وأي تعديل يتعمل في مكانين، الجدول ده هو المصدر الوحيد.
   quoteOnly: القص المصنع بيعرفه من المقاس نفسه فمالوش لازمة في ورقة الشغل.
   لكن التدعيم مش باين من أي حاجة — لازم يوصل للمصنع، فبيتكتب في الورقتين. */
const SERVICE_LINES_ = [
  { code:'CUT',   label:'خدمة قص',  needs:doorNeedsCut_,   priceKey:'customExtra', quoteOnly:true  },
  { code:'WOOD',  label:'تدعيم خشب', needs:doorNeedsWood_,  priceKey:'woodExtra',   quoteOnly:false },
  { code:'PRINT', label:'طباعة',    needs:doorNeedsPrint_, priceKey:'printExtra',  quoteOnly:true  }
];
// ⚠️ كانت ثلاثية (قص وإلا تدعيم) — أي بند خدمة جديد كان بياخد سعر التدعيم
// من غير ما حد ياخد باله. بقت بتقرا من الجدول نفسه.
const SERVICE_PRICE_GETTERS_ = {
  customExtra: () => CUSTOM_EXTRA,
  woodExtra:   () => WOOD_EXTRA,
  printExtra:  () => PRINT_EXTRA
};
function servicePrice_(code){
  const def = SERVICE_LINES_.find(d=>d.code===code);
  const get = def && SERVICE_PRICE_GETTERS_[def.priceKey];
  return get ? (Number(get())||0) : 0;
}
function serviceDefFor_(it){
  if(!it) return null;
  const code = it.code || it.id;
  let def = SERVICE_LINES_.find(d=>d.code===code);
  if(def) return def;
  // البنود اللي رجعت من السيرفر ممكن يكون الكود ضاع منها — بنعرفها من الاسم
  const isAcc = it.kind==='acc' || it.type==='Accessory';
  if(!isAcc) return null;
  const t = String(it.title||'');
  return SERVICE_LINES_.find(d=>t.indexOf(d.label)>=0) || null;
}
function isServiceLine_(it){ return !!serviceDefFor_(it); }
// ⚠️ isCutLine_ فاضلة بالاسم ده لأن كود كتير بينده عليها، بس بقت بتغطّي كل
// بنود الخدمة — أي مكان بيستبعد القص من عدّ القطع لازم يستبعد التدعيم زيه.
function isCutLine_(it){ return isServiceLine_(it); }
// ⚠️ فرق مهم: «خدمة قص» بند تسعير بيبان في عرض السعر بس، لكن «تدعيم خشب»
// شغل حقيقي بيتعمل في الباب. أي كشف أصناف بيروح للمصنع (رسالة الواتساب،
// ملف الإكسل، ورقة الأوردر) لازم يفضل مبيّن التدعيم — وإلا المصنع ينفّذ
// الباب من غير تدعيم وهو متحاسب عليه. عدّ القطع بس هو اللي بيستبعد الاتنين.
function quoteOnlyLine_(it){ const d = serviceDefFor_(it); return !!(d && d.quoteOnly); }
function serviceTitle_(label, sizeLabel){ return label + ' — ' + sizeLabel; }
function cutServiceTitle_(label){ return serviceTitle_(CUT_SERVICE_NOTE_, label); }
function cutLineLabel_(it){
  const def = serviceDefFor_(it);
  if(!def) return '';
  return String(it.title||'').replace(new RegExp('^.*?'+def.label+'\\s*—\\s*'), '');
}
// بيعيد بناء بنود الخدمة من الأبواب اللي في السلة — بيتنده مع أي تغيير في
// السلة. إعادة البناء من الصفر معناها إن تعديل باب أو مسحه مابيسيبش بند
// يتيم ولا بيكرّره. السعر القديم بيتحافظ عليه لو البند موجود أصلاً.
function syncCutServiceLines_(){
  const cart = state.cart || [];
  const prevByTitle = {};
  cart.forEach(it=>{ if(isServiceLine_(it)) prevByTitle[it.title]=it; });
  const kept = cart.filter(it=>!isServiceLine_(it));

  SERVICE_LINES_.forEach(def=>{
    const need = {};
    cart.forEach(it=>{
      if(!def.needs(it)) return;
      const label = doorSizeText_(it.sizeTxt, it.doorHeight) || '';
      // ⚠️ الطلبات اللي اتعملت قبل v164 سعر الباب فيها شامل الـ٣٠٠. لو المصنع
      // فتحها للتعديل وحفظ، كنا هنضيف بند قص فوقهم — يعني القص اتحسب مرتين،
      // والمرة دي متسجّلة في الطلب مش في ورقة بس. فبنولّد البند للأبواب اللي
      // سعرها هو سعر المقاس الحالي بالظبط، أو اللي ليها بند أصلاً.
      // (التدعيم اختيار صريح من الموزّع دلوقتي، فالشرط ده مايخصّهوش.)
      if(def.code===CUT_SERVICE_CODE_){
        const w = Number(it.w) || doorWH_(it.sizeEn, it.doorHeight).w;
        const hafr = !!it.hafr || /\(حفر\)|Carved/i.test(it.title||'');
        const مطابق = w && (Number(it.unitPrice)||0) === priceForWidth(w, hafr);
        if(!مطابق && !prevByTitle[serviceTitle_(def.label, label)]) return;
      }
      need[label] = (need[label]||0) + (Number(it.qty)||0);
    });
    Object.keys(need).forEach(label=>{
      const title = serviceTitle_(def.label, label);
      const prev = prevByTitle[title];
      // spec/doorHeight بيمشوا مع البند للسيرفر عشان يعرف البند ده تبع أنهي
      // مقاس باب — من غيرهم لو المصنع حذف باب أو نقّص كميته، البند بيفضل
      // بكميته القديمة والعميل بيدفع خدمة لأبواب مش موجودة.
      const أول = cart.find(it=>def.needs(it) &&
        (doorSizeText_(it.sizeTxt, it.doorHeight)||'')===label) || {};
      kept.push({ kind:'acc', id:def.code, code:def.code,
                  title, titleEn:title, unit:'باب', qty:need[label],
                  spec: أول.sizeEn || '', doorHeight: أول.doorHeight || '',
                  price: prev ? (Number(prev.price)||0) : servicePrice_(def.code) });
    });
  });
  state.cart = kept;
}

// المستوى فوقه.
function tierPrice(basePrice, kind, tierKey, key, opts){
  if(!tierKey || tierKey==='dist') return Number(basePrice)||0;
  if(kind==='mabra') return Number(basePrice)||0;   // لسه من غير تسعير — مايتزادش عليها زيادة المستوى
  const group = kind==='door'?'sizes':kind==='frame'?'frames':kind==='bror'?'brors':kind==='panel'?'panel':(kind==='strip'||kind==='veneer')?kind:'acc';
  const ov = TIER_OVERRIDES[tierKey];
  // «خدمة قص» سعرها واحد في كل المستويات إلا لو المصنع حفظ للمستوى ده قيمة
  // بنفسه. الزيادة الافتراضية للمستوى مالهاش لازمة هنا — كانت بتطلّع 300.5.
  if(key==='customExtra' || key==='woodExtra' || key==='printExtra'){
    return (ov && ov[key]!=null) ? (Number(ov[key])||0) : (Number(basePrice)||0);
  }
  const حفر = !!(opts && opts.hafr) && kind==='door';
  const زيادة_الحفر = حفر
    ? ((ov && ov.hafrExtra!=null) ? (Number(ov.hafrExtra)||0) : (Number(HAFR_EXTRA)||0))
    : 0;
  // سعر المقاس من غير الحفر — عشان نركّب عليه زيادة الحفر بتاعة المستوى
  const أساس = (Number(basePrice)||0) - (حفر ? (Number(HAFR_EXTRA)||0) : 0);
  if(ov){
    if(key==='hafrExtra'){ if(ov.hafrExtra!=null) return Number(ov.hafrExtra)||0; }
    else if(key!=null && ov[group] && ov[group][key]!=null){
      return (Number(ov[group][key])||0) + زيادة_الحفر;
    }
  }
  const t = PRICE_TIERS[tierKey] || PRICE_TIERS.dist;
  const add = kind==='door' ? t.doorAdd : t.otherAdd;
  return أساس + زيادة_الحفر + add;
}

  if(kind==='bror') return it.size||null;

  if(kind==='strip' || kind==='veneer') return 'm';
  // بنود الخدمة (قص/تدعيم) بتاخد سعرها من مفتاحها في كل مستوى

    const def = serviceDefFor_(it);
    if(def) return def.priceKey;
    return ACC_EN_TO_ID_[it.title] || null;
  }
  return null;
}
